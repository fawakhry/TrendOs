# ACC234 dedicated EasyStore staging Worker. Never merge with TrendOS order Worker.
# Intentionally NOT deployed by GitHub Actions. No live migration command here.
# Only scoped finance D1 binding; no TRENDOS D1 binding, no Google fallback.
name = "easystore-accounting-staging-api"
main = "./index.mjs"
compatibility_date = "2026-10-23"
workers_dev = true

[vars]
FINANCE_RELEASE = "NO_GO"
FINANCE_WRITES = "OFF"
EASYSTORE_ACCOUNTING_D1_WRITES = "false"
EASYSTORE_ACCOUNTING_D1_WRITE_MODE = "OFF"
EASYSTORE_FINANCE_PHASE1_SCOPE_V1 = "ENFORCE"
ACCOUNTING_FINANCE_GRANTS_MODE_V1 = "ENFORCE"
ACCOUNTING_FINANCE_GRANTS_V1 = "{\"version\":1,\"grants\":[]}"
EASYSTORE_CUSTOMER_CREDIT_V1 = "OFF"
EASYSTORE_CUSTOMER_SOURCE_V1 = "REMOTE_REQUIRED"

[[d1_databases]]
binding = "DB"
database_name = "easystore-accounting-staging"
database_id = "c2fe1a54-90f5-4e6f-9d51-80ce23e21328"
# Deliberately no migrations_dir: default TrendOS operational migrations
# are FORBIDDEN here. Run schema_preflight.py before any reviewed manual D1 SQL.
