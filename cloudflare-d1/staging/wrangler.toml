name = "trendos-d1-staging"
main = "./index.js"
compatibility_date = "2024-08-23"
workers_dev = true

# Dedicated remote staging lane for Cloud Write qualification.
# This file MUST NEVER point at trendos-main.
[vars]
CORS_ORIGINS = "https://fawakhry.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"
APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwwowwEBnYnojKsaW83NQJgiRPgPoCwC-bCPf1hBTZK6nACKDjh-Qy1uapPiCuPGD77/exec"
EDGE_SESSION_TTL_SECONDS = "600"
EDGE_DATA_MAX_AGE_SECONDS = "180"
EDGE_ORDERS_MIRROR_MAX_AGE_SECONDS = "600"
EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "false"
TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"
TRENDOS_STAGING_RECONCILE_VERIFY_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "trendos-staging"
database_id = "__STAGING_DB_ID__"
migrations_dir = "../migrations"
