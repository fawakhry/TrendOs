name = "trendos-edge-gateway-preview"
main = "./index.js"
compatibility_date = "2024-08-23"
workers_dev = true

# Preview is a read/performance verification lane only.
# It deliberately shares the existing read mirror binding, but it must never
# apply migrations or accept authoritative business writes.
[vars]
CORS_ORIGINS = "https://fawakhry.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"
APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec"
EDGE_SESSION_TTL_SECONDS = "600"
EDGE_DATA_MAX_AGE_SECONDS = "180"
EDGE_ORDERS_MIRROR_MAX_AGE_SECONDS = "600"
EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "true"
TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"
TRENDOS_PRODUCTION_SHADOW_PREVIEW_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "trendos-main"
database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"
