name: EasyStore A1 Laser Quote CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'cloudflare-d1/migrations/0021_employee_accounting_material_dimensions_v1.sql'
      - 'cloudflare-d1/src/employee-accounting-native-v1.mjs'
      - 'tests/easystore_a1_laser_quote_v1.test.mjs'
      - '.github/workflows/easystore-a1-laser-quote-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate A1 deterministic laser quote
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/entry614_employee_accounting_native.test.mjs
          node tests/easystore_a1_party_master_v1.test.mjs
          node tests/easystore_a1_laser_quote_v1.test.mjs
          echo EASYSTORE_A1_LASER_QUOTE_CI=PASS
