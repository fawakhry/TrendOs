name: EasyStore A2.9 Frontend OFF Closure Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a29-frontend-off-closure-audit.yml'

permissions:
  contents: write

concurrency:
  group: easystore-a29-frontend-off-closure-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
      FRONTEND_COMMIT: c86015194b41cd8914a5ec2b4f0739c3659abe44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Wait for live OFF and verify closed runtime
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in $(seq 1 60); do
            curl -fsSL "$EASYSTORE_URL/config.js?a29off=$GITHUB_RUN_ID-$i" > /tmp/config.js
            if grep -Eq "EASYSTORE_ACCOUNTING_D1_WRITE_MODE[[:space:]]*=[[:space:]]*'OFF'" /tmp/config.js               && grep -Eq "EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS[[:space:]]*=[[:space:]]*\[\]" /tmp/config.js; then
              OK=1
              break
            fi
            sleep 5
          done
          [ "$OK" = "1" ] || { echo "frontend OFF did not propagate" >&2; exit 1; }

          curl -fsS "$API_URL/v1/employee/accounting/health?a29off=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1 WHERE active=1) AS activeMaterials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1 WHERE active=1) AS activeTemplates;
            SELECT request_key,operation,actor,status,entity_id
              FROM employee_accounting_request_ledger_v1
             WHERE request_key='A29-RECALC-muxaasiz-yihe2m4t';
            SELECT entity_type,entity_id,event_type,actor,request_key,payload_json AS payloadJson
              FROM employee_accounting_events_v1
             WHERE request_key='A29-RECALC-muxaasiz-yihe2m4t';
          " > /tmp/evidence.json

          curl -fsSL -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/fawakhry/EasyStore/actions/runs?head_sha=$FRONTEND_COMMIT&per_page=10"             > /tmp/pages-runs.json || echo '{"workflow_runs":[]}' > /tmp/pages-runs.json

          node <<'NODE' > /tmp/result.txt
          const fs=require('fs');
          const cfg=fs.readFileSync('/tmp/config.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/evidence.json','utf8'));
          const groups=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Array.isArray(v.results))groups.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}};
          walk(x);
          const all=groups.flat(),c=all.find(r=>r.materials!==undefined)||{};
          const q=all.find(r=>r.request_key==='A29-RECALC-muxaasiz-yihe2m4t'&&r.operation);
          const e=all.find(r=>r.request_key==='A29-RECALC-muxaasiz-yihe2m4t'&&r.entity_type);
          const expected={materials:1,templates:1,deptLines:0,finalInvoices:0,partyLedger:0,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:0,requestLedger:3,events:3,activeMaterials:0,activeTemplates:0};
          if(!/EASYSTORE_ACCOUNTING_D1_READONLY\s*=\s*true/.test(cfg))throw Error('D1_READONLY not true');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*false/.test(cfg))throw Error('legacy writes not false');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg))throw Error('frontend not OFF');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\[\]/.test(cfg))throw Error('frontend actions not empty');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw Error('backend not closed');
          if(Number(h.writeCanaryAllowedUserCount||0)||Number(h.writeCanaryAllowedActionCount||0)||Number(h.writeCanaryMaxCommands||0)||Number(h.writeCanaryCommandsStarted||0))throw Error('server canary not cleared');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('google calls nonzero');
          for(const [k,v] of Object.entries(expected))if(Number(c[k]||0)!==v)throw Error('baseline drift '+k+'='+c[k]);
          if(!q||q.operation!=='material-cost-cascade'||q.actor!=='ضياء'||q.status!=='COMMITTED')throw Error('request drift');
          if(!e||e.entity_type!=='material-cost-cascade'||e.entity_id!=='all'||e.event_type!=='recalculate'||e.actor!=='ضياء')throw Error('event drift');
          const p=JSON.parse(e.payloadJson||'{}');
          for(const k of ['materialCount','templateCount','changedMaterials','changedTemplates'])if(Number(p[k]||0)!==0)throw Error('recalc result drift');
          let pagesRun='';
          try{
            const rr=JSON.parse(fs.readFileSync('/tmp/pages-runs.json','utf8'));
            const runs=(rr.workflow_runs||[]).filter(r=>r.head_sha===process.env.FRONTEND_COMMIT);
            const success=runs.find(r=>r.conclusion==='success')||runs[0];
            if(success) pagesRun=String(success.id||'');
          }catch{}
          console.log('A29_FRONTEND_OFF_CLOSURE=PASS');
          console.log('RUN_ID='+process.env.GITHUB_RUN_ID);
          console.log('FRONTEND_COMMIT='+process.env.FRONTEND_COMMIT);
          console.log('PAGES_RUN_ID='+(pagesRun||'UNAVAILABLE'));
          console.log('FRONTEND_MODE=OFF');
          console.log('FRONTEND_CANARY_ACTIONS=[]');
          console.log('D1_READONLY=true');
          console.log('LEGACY_D1_WRITES=false');
          console.log('BACKEND_MODE=READONLY');
          console.log('POLICY_EPOCH='+Number(h.policyEpoch||0));
          console.log('SERVER_USERS_ACTIONS=0/0');
          console.log('COMMAND_BUDGET=0/0');
          console.log('GOOGLE_BUSINESS_CALLS=0');
          console.log('MATERIALS=1');
          console.log('TEMPLATES=1');
          console.log('REQUEST_LEDGER=3');
          console.log('EVENTS=3');
          console.log('OTHER_TRACKED_TABLES=0');
          console.log('REQUEST_KEY=A29-RECALC-muxaasiz-yihe2m4t');
          console.log('RECALC_RESULT=ZERO_MASTER_SCOPE');
          console.log('PRODUCTION_MUTATION=NO');
          console.log('GENERAL_OPENED=NO');
          NODE

      - name: Persist closure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            cp /tmp/result.txt .github/a29-frontend-off-closure-result.txt
          else
            {
              echo "A29_FRONTEND_OFF_CLOSURE=FAIL"
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "FRONTEND_COMMIT=$FRONTEND_COMMIT"
              echo "PRODUCTION_MUTATION=NO"
              echo "GENERAL_OPENED=NO"
            } > .github/a29-frontend-off-closure-result.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/a29-frontend-off-closure-result.txt
          git commit -m "A2.9: persist frontend OFF closure evidence" || exit 0
          git push origin HEAD:candidate/easystore-accounting-a2-20261005

      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
