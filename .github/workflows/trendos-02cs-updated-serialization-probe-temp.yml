name: TrendOS 02CS Updated Serialization Probe TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-updated-serialization-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://cs-orderfix-trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Static GET-only gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-updated-serialization-probe-temp.yml').read_text(encoding='utf-8').splitlines()
          bad=[x.strip() for x in lines if x.strip().startswith(('npx --yes wrangler@','wrangler ','git push','git commit','curl -X','curl --request'))]
          if bad: raise SystemExit('Mutation/tooling command forbidden: '+repr(bad))
          print('PERF_CF_02CS_UPDATED_SERIALIZATION_STATIC_GET_ONLY_PASS')
          PY
      - name: Inspect safe timestamp serialization flags only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PREVIEW_URL;
          const targets=[297,303,314,330];
          async function one(offset){
            const u=new URL(base+'/v1/mirror/sheet');
            u.searchParams.set('name','بنود الأوردرات');u.searchParams.set('limit','1');u.searchParams.set('offset',String(offset));
            const r=await fetch(u,{cache:'no-store',headers:{accept:'application/json'}});const b=JSON.parse(await r.text()||'{}');
            assert.equal(r.status,200);assert.equal(b.success,true);const row=b.sheet&&b.sheet.rows&&b.sheet.rows[0];assert.ok(row);
            const values=Array.isArray(row.values)?row.values:[],display=Array.isArray(row.display)?row.display:[];
            const orderId=String(display[0]||values[0]||'').trim();
            const lineId=String(display[5]||values[5]||'').trim();
            const status=String(display[10]||values[10]||'').trim();
            const raw=String(values[12]||'').trim(),shown=String(display[12]||'').trim();
            const rawMs=Date.parse(raw),shownMs=Date.parse(shown);
            const rawValid=Number.isFinite(rawMs),displayNativeValid=Number.isFinite(shownMs);
            const sameDay=rawValid&&displayNativeValid?Math.abs(rawMs-shownMs)<36*60*60*1000:false;
            console.log('PERF_CF_02CS_UPDATED_SERIALIZATION='+JSON.stringify({orderId,lineId,status,rawValid,displayNativeValid,sameDay}));
          }
          (async()=>{for(const o of targets)await one(o);console.log('PERF_CF_02CS_UPDATED_SERIALIZATION_PROBE_PASS_NO_MUTATION');})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
