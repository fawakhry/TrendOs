name: BOOK19 Delivery Debt Reconciliation Preview (FAKE SQLITE NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  debt-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Native Core Worker in disposable SQLite, fake owner auth, zero real business writes
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book19_delivery_debt_reconciliation_readonly_sqlite_no_go.test.mjs
          node --test tests/book19_delivery_debt_reconciliation_readonly_sqlite_no_go.test.mjs
          echo 'BOOK19_DEBT_RECONCILIATION_SOURCE_ONLY=YES'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_MUTATION=NO'
