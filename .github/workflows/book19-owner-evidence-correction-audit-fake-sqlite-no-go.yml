name: BOOK19 Owner Evidence Correction Audit (FAKE SQLITE NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  owner-evidence-correction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute immutable correction and withdrawal chain on disposable Node SQLite only
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check tests/book19_customer_review_correction_audit_sqlite_no_go.test.mjs
          node --test tests/book19_customer_review_correction_audit_sqlite_no_go.test.mjs
          echo 'BOOK19_OWNER_CORRECTION_OFFLINE_ONLY=YES'
          echo 'BOOK19_ACCOUNT_IDENTITY_ATTESTED=NO'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_CHANGES=ZERO'
