name: TrendOS Customer Portal Native Browser Transport OFF
on:
  push:
    branches:
      - feat/zero-google-customer-ui-native-dispatch-off-20261023
  pull_request:
    paths:
      - 'customer-native-browser-transport-v0.js'
      - 'app.js'
      - 'index.html'
      - 'config.js'
      - 'tests/customer_native_browser_transport_off.test.mjs'
      - '.github/workflows/trendos-customer-native-browser-transport-off-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-native-customer-only-source-off:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original browser and customer-only adapter syntax
        run: |
          set -euo pipefail
          node --check customer-native-browser-transport-v0.js
          node --check app.js
          node --check config.js
      - name: Prove OFF, employee preservation and no Google fallback when Native selected
        env:
          CLOUDFLARE_API_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          node --test tests/customer_native_browser_transport_off.test.mjs
      - name: Native order source regression without Worker deployment
        run: |
          set -euo pipefail
          node --test tests/entry660_customer_native_orders_off.test.mjs
          python3 tests/entry660_customer_native_orders_sqlite.test.py -v
      - name: Enforce no live customer change
        run: |
          echo 'CUSTOMER_MASTER_REBUILD=NO'
          echo 'CUSTOMER_NATIVE_BROWSER_DEFAULT=OFF'
          echo 'NATIVE_LOGIN_HTTP_ROUTE=NOT_DEPLOYED'
          echo 'LIVE_CUSTOMER_ACTIONS_RETIRED=0_OF_9'
          echo 'CLOUDFLARE_DEPLOY=NO'
          echo 'ZERO_GOOGLE_COMPLETE=NO'
