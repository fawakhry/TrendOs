name: ACC213 Wael Gaber Customer Invoice Native SQLite NO_GO
on:
  pull_request:
permissions:
  contents: read
jobs:
  invoice-identity-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual checked-in Worker and run fake SQLite invoice lifecycle
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FINANCE_RELEASE: 'NO_GO'
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = 'NO_GO'
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --check tests/easystore_acc213_wael_gaber_customer_invoice_native_sqlite_no_go.test.mjs
          node --test tests/easystore_acc213_wael_gaber_customer_invoice_native_sqlite_no_go.test.mjs
          node --check cloudflare-d1/src/t12-order-customer-finance-fence-sourceonly.mjs
          node --check tests/t12_order_customer_finance_fence_sourceonly.test.mjs
          node --test tests/t12_order_customer_finance_fence_sourceonly.test.mjs
          node --check cloudflare-d1/src/t12-general-create.mjs
          node --check tests/t12_general_create.test.mjs
          node --test tests/t12_general_create.test.mjs
          echo 'ACC223_ISOLATED_TRANSACTIONAL_AT_CREATE_CUSTOMER_CAPTURE=TESTED'
          echo 'ACC223_REAL_CUSTOMER_OWNER_ATTESTATION=NOT_VERIFIED'
          echo 'ACC223_NEW_PRODUCTION_ROUTE_OR_DEPLOY=NONE'
          echo 'ACC222_T12_NATIVE_ORDER_CUSTOMER_FK_ATTESTED=NO'
          echo 'ACC222_FINANCE_RELEASE=NO_GO'
          echo 'ACC213_REAL_WORKER_DISPOSABLE_SQLITE_ONLY=YES'
          echo 'ACC213_D1_DEPLOY=NO'
          echo 'ACC213_EASYSTORE_MONEY_WRITES=ZERO'
