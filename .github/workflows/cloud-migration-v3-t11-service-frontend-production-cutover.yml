name: TrendOS T11 Service Frontend Production Cutover

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t11-service-frontend-production-cutover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendos-t11-service-frontend-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_HEAD: 44e0b01dd636ec81ef2a298b714a329cd3f828c9
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PAGES_BASE: https://fawakhry.github.io/TrendOs
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard T11 frontend scope and Production authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "cloud-migration-v3-t6b-auth-shadow-canary-20260913"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/edge/health" > /tmp/t11-pre-edge.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/cloud/write/health" > /tmp/t11-pre-write.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/t11-pre-edge.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/t11-pre-write.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('T11_FRONTEND_PRE_AUTHORITY_BOUNDARY=PASS');
          NODE

          service_code="$(curl --silent --show-error --output /tmp/t11-service-unauth.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/service/page?screen=service&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          test "$service_code" = '401'
          existing_code="$(curl --silent --show-error --output /tmp/t11-existing-unauth.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          test "$existing_code" = '401'
          echo 'T11_FRONTEND_WORKER_ROUTE_BOUNDARIES=PASS'
          echo 'D1_WRITE_AUTHORITY_CHANGE=NO'
          echo 'APPS_SCRIPT_DEPLOY=NO'
          echo 'TASK_MUTATION=NO'
          echo 'SECRET_CHANGE=NO'

      - name: Live authenticated Service readiness before frontend mutation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const apps=process.env.APPS_SCRIPT_URL;
          const base=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          async function req(url,opt={},timeoutMs=45000){
            const c=new AbortController();
            const timer=setTimeout(()=>c.abort(),timeoutMs);
            try{
              const t=Date.now();
              const r=await fetch(url,{redirect:'follow',cache:'no-store',signal:c.signal,...opt});
              const raw=await r.text();
              let b={}; try{b=JSON.parse(raw||'{}')}catch{}
              return {status:r.status,body:b,ms:Date.now()-t};
            } finally { clearTimeout(timer); }
          }
          (async()=>{
            let edgeToken='';
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const login=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})},45000);
                const employeeToken=text(login.body?.user?.token);
                if(login.status!==200||login.body?.success!==true||!employeeToken){
                  console.log('T11_FRONTEND_SESSION_ATTEMPT='+JSON.stringify({attempt,loginHttp:login.status,loginMs:login.ms,exchangeHttp:0}));
                  continue;
                }
                console.log('::add-mask::'+employeeToken);
                const exchange=await req(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},30000);
                edgeToken=text(exchange.body?.edgeToken);
                console.log('T11_FRONTEND_SESSION_ATTEMPT='+JSON.stringify({attempt,loginHttp:login.status,loginMs:login.ms,exchangeHttp:exchange.status,exchangeMs:exchange.ms,success:exchange.body?.success===true,authSource:text(exchange.body?.authSource)}));
                if(exchange.status===200&&exchange.body?.success===true&&edgeToken) break;
                edgeToken='';
              } catch(err) {
                console.log('T11_FRONTEND_SESSION_ATTEMPT='+JSON.stringify({attempt,error:String(err&&err.name||'request-error')}));
              }
            }
            if(!edgeToken) throw new Error('could not acquire qualification Edge session');
            console.log('::add-mask::'+edgeToken);
            fs.writeFileSync('/tmp/t11-frontend-edge-token',edgeToken,{mode:0o600});

            const path='/v1/edge/orders/service/page?screen=service&page=1&pageSize=100&statusFilter='+encodeURIComponent('__ACTIVE__');
            let ready=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const r=await req(base+path,{method:'GET',headers:{accept:'application/json',authorization:'Bearer '+edgeToken}},20000);
                console.log('T11_FRONTEND_SERVICE_READINESS='+JSON.stringify({attempt,http:r.status,ms:r.ms,success:r.body?.success===true,dataSource:text(r.body?.dataSource),freshnessOk:r.body?.freshness?.ok===true,freshnessMode:text(r.body?.freshness?.mode),code:text(r.body?.code)}));
                if(r.status===200&&r.body?.success===true&&text(r.body?.dataSource)==='d1-edge-orders-service-v1'&&r.body?.freshness?.ok===true){ready=r;break;}
              } catch(err) {
                console.log('T11_FRONTEND_SERVICE_READINESS='+JSON.stringify({attempt,error:String(err&&err.name||'request-error')}));
              }
              if(attempt<3) await new Promise(resolve=>setTimeout(resolve,3000));
            }
            if(!ready) throw new Error('Service Worker route is not live-ready for frontend cutover');
            console.log('T11_FRONTEND_SERVICE_PRECUTOVER_READINESS=PASS');
          })().catch(err=>{console.error(err.message||err);process.exit(1)});
          NODE

      - name: Promote exact qualified Service frontend patch on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"
          git checkout -B main origin/main

          python - <<'PY'
          from pathlib import Path

          cfg=Path('config.js')
          js=Path('trendos-edge-orders-read-v1.js')

          c=cfg.read_text()
          old="window.MATBAGY_EDGE_ORDERS_ALLOWED_SCREENS = ['print','laser','press'];"
          new="window.MATBAGY_EDGE_ORDERS_ALLOWED_SCREENS = ['print','laser','press','service'];"
          if c.count(old)!=1: raise SystemExit('unexpected allowed-screen baseline')
          c=c.replace(old,new,1)
          old_cache='trendos-edge-orders-read-v1.js?v=20260913-t10-print-laser-press1'
          new_cache='trendos-edge-orders-read-v1.js?v=20260914-t11-print-laser-press-service1'
          if c.count(old_cache)!=1: raise SystemExit('unexpected loader cache baseline')
          c=c.replace(old_cache,new_cache,1)
          cfg.write_text(c)

          s=js.read_text()
          old_version="var VERSION = 'EDGE_ORDERS_READ_T8_PRINT_GLOBAL_20260913';"
          new_version="var VERSION = 'EDGE_ORDERS_READ_T11_SERVICE_20260914';"
          if s.count(old_version)!=1: raise SystemExit('unexpected loader version baseline')
          s=s.replace(old_version,new_version,1)

          old_path="var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';"
          new_path=old_path+"\n  var SERVICE_PAGE_PATH = '/v1/edge/orders/service/page';"
          if s.count(old_path)!=1: raise SystemExit('unexpected 02CR path baseline')
          s=s.replace(old_path,new_path,1)

          anchor="  async function edgePage(params) {\n"
          helper_lines=[
              "  function isServiceScreen(params) {",
              "    return text(params && params.screen).toLowerCase() === 'service';",
              "  }",
              "",
              "  function pagePathFor(params) {",
              "    return isServiceScreen(params) ? SERVICE_PAGE_PATH : QUALIFIED_PAGE_PATH;",
              "  }",
              "",
              "  function validateServiceResponse(body) {",
              "    if (text(body && body.dataSource) !== 'd1-edge-orders-service-v1') {",
              "      throw mirrorFreshnessError('Service D1 data source mismatch', 'EDGE_SERVICE_SOURCE');",
              "    }",
              "    if (!body || !body.freshness || body.freshness.ok !== true) {",
              "      throw mirrorFreshnessError('Service D1 freshness proof missing', 'EDGE_SERVICE_FRESHNESS');",
              "    }",
              "    return body;",
              "  }",
              ""
          ]
          helper="\n".join(helper_lines)+"\n"
          if s.count(anchor)!=1: raise SystemExit('unexpected edgePage anchor')
          s=s.replace(anchor,helper+anchor,1)

          old_request="    var requestKey = QUALIFIED_PAGE_PATH + '?' + key;"
          new_request="    var requestKey = pagePathFor(params || {}) + '?' + key;"
          if s.count(old_request)!=1: raise SystemExit('unexpected request path baseline')
          s=s.replace(old_request,new_request,1)

          old_return="      return normalizeEdgeLineIdentities(validateRequiredMirrors(await jsonResponse(response)));"
          new_return="      var body = await jsonResponse(response);\n      return isServiceScreen(params) ? validateServiceResponse(body) : normalizeEdgeLineIdentities(validateRequiredMirrors(body));"
          if s.count(old_return)!=1: raise SystemExit('unexpected response validation baseline')
          s=s.replace(old_return,new_return,1)
          js.write_text(s)
          PY

          node --check trendos-edge-orders-read-v1.js
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'config.js'
          test "${changed[1]}" = 'trendos-edge-orders-read-v1.js'

          grep -Fq "MATBAGY_EDGE_ORDERS_ALLOWED_SCREENS = ['print','laser','press','service']" config.js
          grep -Fq 'MATBAGY_EDGE_ORDERS_CANARY_ONLY = false' config.js
          grep -Fq 'trendos-edge-orders-read-v1.js?v=20260914-t11-print-laser-press-service1' config.js
          grep -Fq "QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page'" trendos-edge-orders-read-v1.js
          grep -Fq "SERVICE_PAGE_PATH = '/v1/edge/orders/service/page'" trendos-edge-orders-read-v1.js
          grep -Fq "text(params && params.statusFilter) === '__DEBT__'" trendos-edge-orders-read-v1.js
          grep -Fq "return original.apply(this, args);" trendos-edge-orders-read-v1.js

          git diff -U0 origin/main -- trendos-edge-orders-read-v1.js > /tmp/t11-loader.diff
          if grep -E '^[+-].*(updateLine|postWriteBarrier|claimNext|completeTask|EDGE_SESSION_SECRET|TRENDOS_OPERATOR_TASK_PROXY_SECRET)' /tmp/t11-loader.diff; then
            echo 'forbidden write/task/secret-adjacent loader diff detected' >&2
            exit 1
          fi

          git config user.name trendos-cloud-migration
          git config user.email actions@users.noreply.github.com
          git add config.js trendos-edge-orders-read-v1.js
          git commit -m 'prod: add qualified service D1 orders reads'
          echo "T11_SERVICE_FRONTEND_CUTOVER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
          echo 'T11_SERVICE_FRONTEND_PUSHED=1' >> "$GITHUB_ENV"
          echo 'T11_SERVICE_FRONTEND_MAIN_PUSH=PASS'

      - name: Verify GitHub Pages Service frontend propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            stamp="$(date +%s)-$i"
            curl -fsS "$PAGES_BASE/config.js?t11=$stamp" -o /tmp/t11-pages-config.js || true
            curl -fsS "$PAGES_BASE/trendos-edge-orders-read-v1.js?v=20260914-t11-print-laser-press-service1&t11=$stamp" -o /tmp/t11-pages-loader.js || true
            if grep -Fq "MATBAGY_EDGE_ORDERS_ALLOWED_SCREENS = ['print','laser','press','service']" /tmp/t11-pages-config.js 2>/dev/null \
              && grep -Fq 'trendos-edge-orders-read-v1.js?v=20260914-t11-print-laser-press-service1' /tmp/t11-pages-config.js 2>/dev/null \
              && grep -Fq "VERSION = 'EDGE_ORDERS_READ_T11_SERVICE_20260914'" /tmp/t11-pages-loader.js 2>/dev/null \
              && grep -Fq "SERVICE_PAGE_PATH = '/v1/edge/orders/service/page'" /tmp/t11-pages-loader.js 2>/dev/null \
              && grep -Fq "QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page'" /tmp/t11-pages-loader.js 2>/dev/null \
              && grep -Fq "text(params && params.statusFilter) === '__DEBT__'" /tmp/t11-pages-loader.js 2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'T11_SERVICE_FRONTEND_PAGES=PASS'

      - name: Post-cutover Production authority and route boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/edge/health" > /tmp/t11-post-edge.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/cloud/write/health" > /tmp/t11-post-write.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/t11-post-edge.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/t11-post-write.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('T11_FRONTEND_POST_AUTHORITY_BOUNDARY=PASS');
          NODE

          service_code="$(curl --silent --show-error --output /tmp/t11-service-post-unauth.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/service/page?screen=service&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          test "$service_code" = '401'
          existing_code="$(curl --silent --show-error --output /tmp/t11-existing-post-unauth.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          test "$existing_code" = '401'
          echo 'T11_FRONTEND_POST_ROUTE_BOUNDARIES=PASS'
          echo 'WRITE_AUTHORITY_CHANGED=NO'
          echo 'TASK_MUTATION=NO'
          echo 'SECRET_CHANGE=NO'

      - name: Automatic frontend rollback on post-push failure
        if: ${{ failure() && env.T11_SERVICE_FRONTEND_PUSHED == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo 'T11 Service frontend qualification failed after main push; reverting exact cutover commit.'
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git config user.name trendos-cloud-migration
          git config user.email actions@users.noreply.github.com
          git revert --no-edit "$T11_SERVICE_FRONTEND_CUTOVER_SHA"
          git push origin HEAD:main
          echo 'T11_SERVICE_FRONTEND_AUTOMATIC_ROLLBACK=COMMITTED'
          rollback_ok=0
          for i in $(seq 1 24); do
            curl -fsS "$PAGES_BASE/config.js?rollback=$(date +%s)-$i" -o /tmp/t11-rollback-config.js || true
            if grep -Fq "MATBAGY_EDGE_ORDERS_ALLOWED_SCREENS = ['print','laser','press']" /tmp/t11-rollback-config.js 2>/dev/null \
              && grep -Fq 'trendos-edge-orders-read-v1.js?v=20260913-t10-print-laser-press1' /tmp/t11-rollback-config.js 2>/dev/null; then
              rollback_ok=1
              break
            fi
            sleep 5
          done
          if [ "$rollback_ok" = 1 ]; then
            echo 'T11_SERVICE_FRONTEND_ROLLBACK_PAGES=PASS'
          else
            echo 'T11_SERVICE_FRONTEND_ROLLBACK_PAGES=NOT_CONFIRMED'
          fi

      - name: Cleanup ephemeral qualification token
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f /tmp/t11-frontend-edge-token
          echo 'T11_FRONTEND_EPHEMERAL_TOKEN_CLEANED=YES'

      - name: T11 Service frontend success conclusion
        if: ${{ success() }}
        shell: bash
        run: |
          echo 'T11_SERVICE_FRONTEND_PRODUCTION_CUTOVER=PASS'
          echo "T11_SERVICE_FRONTEND_MAIN_SHA=$T11_SERVICE_FRONTEND_CUTOVER_SHA"
          echo 'PRINT_LASER_PRESS_SERVICE=D1_FIRST_WITH_APPS_SCRIPT_FALLBACK'
          echo 'DEBT=APPS_SCRIPT'
          echo 'WRITES=APPS_SCRIPT_SHEETS_AUTHORITATIVE'
          echo 'WORKER_DEPLOY=NO'
          echo 'APPS_SCRIPT_DEPLOY=NO'
          echo 'TASK_MUTATION=NO'
          echo 'EDGE_SESSION_SECRET_CHANGED=NO'
          echo 'TASK_PROXY_SECRET_CHANGED=NO'
          echo 'GABER_GATE_CHANGED=NO'
