name: ONE SHOT TrendOS Customer Private Stage Access DENY ALL — New Scoped Token
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-customer-stage-access-deny-new-token-20261101.yml'

permissions:
  contents: read

concurrency:
  group: trendos-one-time-customer-access-stage-deny-20261101
  cancel-in-progress: false

jobs:
  owner-authorized-access-deny-only:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-access-deny-only-new-token-once-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: \${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout this explicit one-shot private Access test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable original candidate OFF Worker source separately
        uses: actions/checkout@v4
        with:
          ref: ff4004ef8e32d328dbb1b5707c7d427359e8be6e
          path: .stage-original
          persist-credentials: false
      - name: Check scope, credentials and pinned OFF source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = ops/customer-stage-access-deny-only-new-token-once-20261101
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          test "$(git -C .stage-original rev-parse HEAD)" = ff4004ef8e32d328dbb1b5707c7d427359e8be6e
          test "$(git -C .stage-original hash-object cloudflare-d1/wrangler.customer-stage.toml)" = 4e0c7f8275ff9cd89740f97b9f00c6d4d6cc75dd
          python3 -m py_compile tools/one_shot_customer_access_new_token_deny_off_20261101.py
          echo 'ISOLATED_STAGE_EXACT_REPO_SOURCE_AND_NEW_ACCESS_SECRET_PRESENT=PASS'
      - name: Read existing private Stage and attempt exactly ONE scoped Access DENY ALL only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one_shot_customer_access_new_token_deny_off_20261101.py
      - name: Never enable real customer traffic
        run: |
          echo 'CUSTOMER_GO_LIVE=NO_GO'
          echo 'PUBLIC_WORKER_ROUTE_CHANGE=NONE'
          echo 'PRODUCTION_D1_R2_WRITE=NONE'
