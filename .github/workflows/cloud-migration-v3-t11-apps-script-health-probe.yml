name: TrendOS T11 Apps Script Health Probe

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - .github/workflows/cloud-migration-v3-t11-apps-script-health-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require two consecutive healthy production pings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url=process.env.APPS_SCRIPT_URL;
          const MAX_HEALTHY_MS=15000;
          async function once(attempt){
            const c=new AbortController(); const timer=setTimeout(()=>c.abort(),45000); const t=Date.now();
            try{
              const r=await fetch(url,{method:'POST',redirect:'follow',cache:'no-store',signal:c.signal,headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ping'})});
              const raw=await r.text(); let b={}; try{b=JSON.parse(raw||'{}')}catch{}
              const ms=Date.now()-t;
              const contentType=String(r.headers.get('content-type')||'');
              const healthy=r.status===200 && b?.success===true && /^application\/json/i.test(contentType) && ms<MAX_HEALTHY_MS;
              const out={attempt,http:r.status,ms,success:b?.success===true,contentType,healthy};
              console.log('T11_APPS_SCRIPT_STABILITY_ATTEMPT='+JSON.stringify(out));
              return out;
            } catch(err){
              const out={attempt,http:0,ms:Date.now()-t,success:false,healthy:false,error:String(err&&err.name||'request-error')};
              console.log('T11_APPS_SCRIPT_STABILITY_ATTEMPT='+JSON.stringify(out));
              return out;
            } finally { clearTimeout(timer); }
          }
          (async()=>{
            const results=[]; let consecutive=0;
            for(let i=1;i<=5;i++){
              const r=await once(i); results.push(r);
              consecutive=r.healthy ? consecutive+1 : 0;
              if(consecutive>=2) break;
              if(i<5) await new Promise(resolve=>setTimeout(resolve,5000));
            }
            const stable=consecutive>=2;
            console.log('T11_APPS_SCRIPT_STABILITY='+JSON.stringify({stable,attempts:results.length,requiredConsecutive:2,maxHealthyMs:MAX_HEALTHY_MS}));
            console.log('PRODUCTION_MUTATION=NO');
            if(!stable) process.exit(42);
            console.log('T11_APPS_SCRIPT_STABILITY_GATE=PASS');
          })().catch(err=>{console.error(String(err&&err.message||err));process.exit(1)});
          NODE
