name: EasyStore A2.10 Supplier Deploy Execution Qualification

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - 'cloudflare-d1/src/employee-accounting-native-v1.mjs'
      - 'tests/easystore_a2_write_canary_policy_v1.test.mjs'
      - 'tests/easystore_a210_supplier_canary.test.mjs'
      - 'tests/easystore_a210_supplier_workflow_invariants.test.mjs'
      - '.github/workflows/easystore-a210-supplier-guard-readonly-deploy.yml'
      - '.github/workflows/easystore-a210-supplier-canary-execution.yml'
      - '.github/workflows/easystore-a210-supplier-deploy-execution-ci.yml'

permissions:
  contents: read

concurrency:
  group: easystore-a210-supplier-deploy-execution-ci
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify supplier guard and manual-only workflows
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/easystore_a2_write_canary_policy_v1.test.mjs
          node tests/easystore_a210_supplier_canary.test.mjs
          node tests/easystore_a210_supplier_workflow_invariants.test.mjs
          echo "A210_SUPPLIER_DEPLOY_EXECUTION_QUALIFICATION=PASS"
          echo "SERVER_GUARD=PASS"
          echo "DEPLOY_WORKFLOW=MANUAL_ONLY"
          echo "EXECUTION_WORKFLOW=MANUAL_ONLY"
          echo "HISTORICAL_BASELINE=materials1_templates1_parties0_partyBalances0_requestLedger3_events3"
          echo "A210_STATUS=COMPLETED_UNDER_ACC_107_ACC_108"
          echo "CI_PERSISTENCE_WRITE=DISABLED_TO_AVOID_BRANCH_PUSH_RACES"
          echo "PRODUCTION_MUTATION=NO"
