name: EasyStore A0 D1 Accounting Purge Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/easystore-a0-d1-accounting-purge-controlled.yml'

permissions:
  contents: read

concurrency:
  group: easystore-a0-d1-accounting-purge-controlled
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Fail-closed Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a0pre=$GITHUB_SHA" > /tmp/accounting-health-pre.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-health-pre.json','utf8'));
          if(x.mode!=='READONLY') throw new Error('accounting-mode-not-readonly');
          if(x.schemaReady!==true) throw new Error('accounting-schema-not-ready');
          if(x.authoritativeWrites!==false) throw new Error('accounting-authoritative-writes-must-be-false');
          if(Number(x.googleBusinessCalls||0)!==0) throw new Error('d1-accounting-google-call-drift');
          console.log('A0_D1_PREFLIGHT=PASS');
          console.log('A0_D1_MODE=READONLY');
          NODE

      - name: Snapshot existing tables and bounded pre-purge counts
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command             "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"             > /tmp/tables.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/tables.json','utf8')), names=[];
          const walk=v=>{
            if(Array.isArray(v)) return v.forEach(walk);
            if(v&&typeof v==='object'){
              if(typeof v.name==='string') names.push(v.name);
              Object.values(v).forEach(walk);
            }
          };
          walk(x);
          fs.writeFileSync('/tmp/tables.txt',[...new Set(names)].sort().join('\n')+'\n');
          console.log('A0_D1_TABLE_DISCOVERY=PASS');
          console.log('A0_D1_TABLE_COUNT='+new Set(names).size);
          NODE

          for t in             employee_accounting_control_v1             employee_accounting_request_ledger_v1             employee_accounting_materials_v1             employee_accounting_templates_v1             employee_accounting_dept_lines_v1             employee_accounting_final_invoices_v1             employee_accounting_party_ledger_v1             employee_accounting_stock_moves_v1             employee_accounting_events_v1             employee_zero_google_legacy_rows_v1             employee_zero_google_parity_v1
          do
            grep -Fxq "$t" /tmp/tables.txt || { echo "MISSING_REQUIRED_TABLE=$t" >&2; exit 1; }
          done
          echo 'A0_D1_REQUIRED_ACCOUNTING_TABLES=PASS'

          count_query() {
            local label="$1"
            local sql="$2"
            local out="$3"
            local tmp="/tmp/count-${label}.json"
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "$sql" > "$tmp"
            node - "$label" "$out" "$tmp" <<'NODE'
          const fs=require('fs');
          const label=process.argv[2], out=process.argv[3], path=process.argv[4];
          const x=JSON.parse(fs.readFileSync(path,'utf8')), vals=[];
          const walk=v=>{
            if(Array.isArray(v)) return v.forEach(walk);
            if(v&&typeof v==='object'){
              if(v.row_count!==undefined) vals.push(Number(v.row_count));
              Object.values(v).forEach(walk);
            }
          };
          walk(x);
          if(vals.length!==1 || !Number.isFinite(vals[0])) throw new Error('count-parse-'+label);
          fs.appendFileSync(out,label+'\t'+vals[0]+'\n');
          console.log('A0_COUNT_'+label.toUpperCase()+'='+vals[0]);
          NODE
          }

          : > /tmp/sentinel-pre.tsv
          sentinel_count=0
          for t in customers orders t12_customers employee_auth_users_v1 employee_core_orders_v1 employee_core_lines_v1 employee_attendance_days_v1 employee_hr_employees_v1 employee_zero_google_backfill_runs_v1
          do
            if grep -Fxq "$t" /tmp/tables.txt; then
              count_query "$t" "SELECT COUNT(*) AS row_count FROM \"$t\";" /tmp/sentinel-pre.tsv
              sentinel_count=$((sentinel_count+1))
            fi
          done
          test "$sentinel_count" -ge 5
          echo "A0_D1_SENTINELS_PRE_COUNT=$sentinel_count"

          : > /tmp/accounting-pre.tsv
          count_query request_ledger "SELECT COUNT(*) AS row_count FROM employee_accounting_request_ledger_v1;" /tmp/accounting-pre.tsv
          count_query materials "SELECT COUNT(*) AS row_count FROM employee_accounting_materials_v1;" /tmp/accounting-pre.tsv
          count_query templates "SELECT COUNT(*) AS row_count FROM employee_accounting_templates_v1;" /tmp/accounting-pre.tsv
          count_query dept_lines "SELECT COUNT(*) AS row_count FROM employee_accounting_dept_lines_v1;" /tmp/accounting-pre.tsv
          count_query final_invoices "SELECT COUNT(*) AS row_count FROM employee_accounting_final_invoices_v1;" /tmp/accounting-pre.tsv
          count_query party_ledger "SELECT COUNT(*) AS row_count FROM employee_accounting_party_ledger_v1;" /tmp/accounting-pre.tsv
          count_query stock_moves "SELECT COUNT(*) AS row_count FROM employee_accounting_stock_moves_v1;" /tmp/accounting-pre.tsv
          count_query events "SELECT COUNT(*) AS row_count FROM employee_accounting_events_v1;" /tmp/accounting-pre.tsv
          count_query legacy_accounting_rows "SELECT COUNT(*) AS row_count FROM employee_zero_google_legacy_rows_v1 WHERE source_sheet LIKE 'حسابات -%' OR source_sheet='عملاء منع التسليم بالمديونية';" /tmp/accounting-pre.tsv
          count_query parity_accounting_rows "SELECT COUNT(*) AS row_count FROM employee_zero_google_parity_v1 WHERE lower(family) LIKE '%account%';" /tmp/accounting-pre.tsv

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command             "SELECT mode,policy_epoch AS policy_epoch,next_invoice_number AS next_invoice_number
             FROM employee_accounting_control_v1
             WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1';"             > /tmp/control-pre.json

          node <<'NODE'
          const fs=require('fs');
          const rows=fs.readFileSync('/tmp/accounting-pre.tsv','utf8').trim().split(/\r?\n/).filter(Boolean).map(x=>x.split('\t'));
          const total=rows.reduce((s,r)=>s+Number(r[1]),0);
          fs.writeFileSync('/tmp/accounting-pre-sanitized.json',JSON.stringify(rows.map(([table,row_count])=>({table,row_count:Number(row_count)})),null,2));
          const srows=fs.readFileSync('/tmp/sentinel-pre.tsv','utf8').trim().split(/\r?\n/).filter(Boolean).map(x=>x.split('\t'));
          fs.writeFileSync('/tmp/sentinel-pre-sanitized.json',JSON.stringify(srows.map(([table,row_count])=>({table,row_count:Number(row_count)})),null,2));
          console.log('A0_D1_ACCOUNTING_ROWS_PRE='+total);
          console.log('A0_D1_PRE_SNAPSHOT=PASS');
          NODE

      - name: Purge accounting business data only
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/accounting-purge.sql <<'SQL'
          PRAGMA foreign_keys = ON;
          DELETE FROM employee_accounting_stock_moves_v1;
          DELETE FROM employee_accounting_final_invoices_v1;
          DELETE FROM employee_accounting_dept_lines_v1;
          DELETE FROM employee_accounting_party_ledger_v1;
          DELETE FROM employee_accounting_templates_v1;
          DELETE FROM employee_accounting_materials_v1;
          DELETE FROM employee_accounting_events_v1;
          DELETE FROM employee_accounting_request_ledger_v1;
          DELETE FROM employee_zero_google_legacy_rows_v1
            WHERE source_sheet LIKE 'حسابات -%' OR source_sheet='عملاء منع التسليم بالمديونية';
          DELETE FROM employee_zero_google_parity_v1
            WHERE lower(family) LIKE '%account%';
          DELETE FROM sqlite_sequence WHERE name='employee_accounting_events_v1';
          UPDATE employee_accounting_control_v1
             SET next_invoice_number=1,
                 updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1
             AND marker='ENTRY614_ACCOUNTING_V1'
             AND mode='READONLY';
          SQL

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --file /tmp/accounting-purge.sql
          echo 'A0_D1_ACCOUNTING_PURGE_EXECUTED=YES'

      - name: Verify clean accounting baseline and non-accounting sentinels
        shell: bash
        run: |
          set -euo pipefail

          count_query() {
            local label="$1"
            local sql="$2"
            local out="$3"
            local tmp="/tmp/post-count-${label}.json"
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "$sql" > "$tmp"
            node - "$label" "$out" "$tmp" <<'NODE'
          const fs=require('fs');
          const label=process.argv[2], out=process.argv[3], path=process.argv[4];
          const x=JSON.parse(fs.readFileSync(path,'utf8')), vals=[];
          const walk=v=>{
            if(Array.isArray(v)) return v.forEach(walk);
            if(v&&typeof v==='object'){
              if(v.row_count!==undefined) vals.push(Number(v.row_count));
              Object.values(v).forEach(walk);
            }
          };
          walk(x);
          if(vals.length!==1 || !Number.isFinite(vals[0])) throw new Error('count-parse-'+label);
          fs.appendFileSync(out,label+'\t'+vals[0]+'\n');
          NODE
          }

          : > /tmp/accounting-post.tsv
          count_query request_ledger "SELECT COUNT(*) AS row_count FROM employee_accounting_request_ledger_v1;" /tmp/accounting-post.tsv
          count_query materials "SELECT COUNT(*) AS row_count FROM employee_accounting_materials_v1;" /tmp/accounting-post.tsv
          count_query templates "SELECT COUNT(*) AS row_count FROM employee_accounting_templates_v1;" /tmp/accounting-post.tsv
          count_query dept_lines "SELECT COUNT(*) AS row_count FROM employee_accounting_dept_lines_v1;" /tmp/accounting-post.tsv
          count_query final_invoices "SELECT COUNT(*) AS row_count FROM employee_accounting_final_invoices_v1;" /tmp/accounting-post.tsv
          count_query party_ledger "SELECT COUNT(*) AS row_count FROM employee_accounting_party_ledger_v1;" /tmp/accounting-post.tsv
          count_query stock_moves "SELECT COUNT(*) AS row_count FROM employee_accounting_stock_moves_v1;" /tmp/accounting-post.tsv
          count_query events "SELECT COUNT(*) AS row_count FROM employee_accounting_events_v1;" /tmp/accounting-post.tsv
          count_query legacy_accounting_rows "SELECT COUNT(*) AS row_count FROM employee_zero_google_legacy_rows_v1 WHERE source_sheet LIKE 'حسابات -%' OR source_sheet='عملاء منع التسليم بالمديونية';" /tmp/accounting-post.tsv
          count_query parity_accounting_rows "SELECT COUNT(*) AS row_count FROM employee_zero_google_parity_v1 WHERE lower(family) LIKE '%account%';" /tmp/accounting-post.tsv

          : > /tmp/sentinel-post.tsv
          while IFS=$'\t' read -r t pre_count; do
            [ -n "$t" ] || continue
            count_query "$t" "SELECT COUNT(*) AS row_count FROM \"$t\";" /tmp/sentinel-post.tsv
          done < /tmp/sentinel-pre.tsv

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command             "SELECT mode,policy_epoch AS policy_epoch,next_invoice_number AS next_invoice_number
             FROM employee_accounting_control_v1
             WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1';"             > /tmp/control-post.json

          node <<'NODE'
          const fs=require('fs');
          function tsv(path){
            return Object.fromEntries(fs.readFileSync(path,'utf8').trim().split(/\r?\n/).filter(Boolean).map(x=>{const [k,v]=x.split('\t');return[k,Number(v)]}));
          }
          function control(path){
            const x=JSON.parse(fs.readFileSync(path,'utf8')), out=[];
            const walk=v=>{
              if(Array.isArray(v)) return v.forEach(walk);
              if(v&&typeof v==='object'){
                if(v.mode!==undefined && v.policy_epoch!==undefined && v.next_invoice_number!==undefined) out.push(v);
                Object.values(v).forEach(walk);
              }
            };
            walk(x); return out[0];
          }
          const acc=tsv('/tmp/accounting-post.tsv');
          const nonZero=Object.entries(acc).filter(([,v])=>v!==0);
          if(nonZero.length) throw new Error('accounting-post-not-zero:'+JSON.stringify(nonZero));

          const pre=tsv('/tmp/sentinel-pre.tsv'), post=tsv('/tmp/sentinel-post.tsv');
          const drift=Object.keys(pre).filter(k=>pre[k]!==post[k]).map(k=>({table:k,pre:pre[k],post:post[k]}));
          if(drift.length) throw new Error('non-accounting-sentinel-drift:'+JSON.stringify(drift));

          const c0=control('/tmp/control-pre.json'), c1=control('/tmp/control-post.json');
          if(!c0||!c1) throw new Error('accounting-control-missing');
          if(c0.mode!=='READONLY'||c1.mode!=='READONLY') throw new Error('accounting-control-mode-drift');
          if(Number(c0.policy_epoch)!==Number(c1.policy_epoch)) throw new Error('accounting-policy-epoch-drift');
          if(Number(c1.next_invoice_number)!==1) throw new Error('accounting-next-invoice-not-reset');

          console.log('A0_D1_ACCOUNTING_ROWS_POST=0');
          console.log('A0_D1_NON_ACCOUNTING_SENTINELS_INVARIANT=PASS');
          console.log('A0_D1_ACCOUNTING_MODE_PRESERVED=READONLY');
          console.log('A0_D1_POLICY_EPOCH_PRESERVED='+c1.policy_epoch);
          console.log('A0_D1_NEXT_INVOICE_NUMBER=1');
          console.log('A0_D1_PURGE_VERIFICATION=PASS');
          NODE

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a0post=$GITHUB_SHA" > /tmp/accounting-health-post.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-health-post.json','utf8'));
          if(x.mode!=='READONLY'||x.schemaReady!==true||x.authoritativeWrites!==false) throw new Error('accounting-health-post-fail');
          console.log('A0_D1_POST_HEALTH=PASS');
          console.log('A0_D1_SCHEMA_READY=YES');
          console.log('A0_D1_AUTHORITATIVE_WRITES=NO');
          NODE

      - name: Upload sanitized count evidence
        uses: actions/upload-artifact@v4
        with:
          name: easystore-a0-d1-accounting-purge-counts
          path: |
            /tmp/accounting-pre-sanitized.json
            /tmp/sentinel-pre-sanitized.json
          retention-days: 14
          if-no-files-found: error
