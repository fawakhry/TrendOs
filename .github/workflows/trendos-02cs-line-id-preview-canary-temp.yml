name: TrendOS 02CS Line ID Preview Canary TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-line-id-preview-canary-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-line-id-preview-canary-temp
  cancel-in-progress: false

jobs:
  preview-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PREVIEW_URL: https://cs-lineid-trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4

      - name: Static zero-production-traffic gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-line-id-preview-canary-temp.yml').read_text(encoding='utf-8').splitlines()
          commands=[x.strip() for x in lines if x.strip().startswith('npx --yes wrangler@')]
          upload='npx --yes wrangler@${WRANGLER_VERSION} versions upload --config cloudflare-d1/wrangler.toml --preview-alias cs-lineid --message "TrendOS 02CS semantic Line ID preview"'
          if commands.count(upload) != 1 or len(commands) != 1:
            raise SystemExit('Expected exactly one versions upload and no deployment command: '+repr(commands))
          print('PERF_CF_02CS_PREVIEW_ZERO_TRAFFIC_STATIC_PASS')
          PY

      - name: Re-run focused contracts before upload
        shell: bash
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
          echo 'PERF_CF_02CS_PREVIEW_CONTRACTS_PASS'

      - name: Production boundary before preview upload GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200);assert.equal(edge.body.success,true);assert.equal(edge.body.database,true);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.cutover,false);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);
            assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_PREVIEW_PRE_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Upload Worker version only — no traffic deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions upload --config cloudflare-d1/wrangler.toml --preview-alias cs-lineid --message "TrendOS 02CS semantic Line ID preview" | tee /tmp/upload.txt
          echo 'PERF_CF_02CS_PREVIEW_VERSION_UPLOAD_DONE_NO_TRAFFIC_DEPLOY'
          sleep 8

      - name: Preview session stability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PREVIEW_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const token=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          async function one(){return read(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token})});}
          (async()=>{
            const timings=[];
            for(let i=0;i<3;i++){
              let ok=null;
              for(let retry=0;retry<4;retry++){
                const started=Date.now(); const x=await one();
                if(x.status===200&&x.body&&x.body.success===true&&x.body.edgeToken){timings.push(Date.now()-started);ok=x;break;}
                await sleep(3000);
              }
              assert.ok(ok,'preview session did not stabilize');
            }
            console.log('PERF_CF_02CS_PREVIEW_SESSION_STABILITY_PASS='+JSON.stringify({attempts:3,timingsMs:timings}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Full preview D1 vs Apps Script parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PREVIEW_URL;
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function read(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{throw new Error('invalid JSON http='+r.status)}return{status:r.status,body:b};}
          async function session(){const x=await read(edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body.edgeToken;}
          async function collectEdge(screen,bearer){
            let out=[],page=1,totalPages=1,mirrors=[];
            do{
              const p=new URLSearchParams({screen,page:String(page),pageSize:'5',statusFilter:'__ACTIVE__'});
              const x=await read(edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
              assert.equal(x.status,200,screen+' edge http');assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
              out.push(...(x.body.rows||[]));totalPages=Number(x.body.pagination&&x.body.pagination.totalPages||1);mirrors=x.body.mirrors||[];page++;
            }while(page<=totalPages);
            return {rows:out,mirrors,totalPages};
          }
          async function collectApps(screen){
            let out=[],page=1,totalPages=1;
            do{
              const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:String(page),pageSize:'5',statusFilter:'__ACTIVE__'};
              const x=await read(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
              assert.equal(x.status,200,screen+' apps http');assert.equal(x.body.success,true);
              out.push(...(x.body.rows||[]));totalPages=Number(x.body.pagination&&x.body.pagination.totalPages||1);page++;
            }while(page<=totalPages);
            return {rows:out,totalPages};
          }
          (async()=>{
            let last=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const bearer=await session(); const result=[];
                for(const screen of ['print','laser']){
                  const edge=await collectEdge(screen,bearer); const app=await collectApps(screen);
                  const ek=edge.rows.map(key),ak=app.rows.map(key);
                  assert.deepEqual(ek,ak,screen+' Order ID + Line ID + status parity');
                  for(const m of edge.mirrors){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
                  result.push({screen,totalRows:ek.length,pages:edge.totalPages});
                }
                const p=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});
                const debt=await read(edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
                assert.equal(debt.status,409);assert.equal(debt.body.code,'apps-script-required');assert.equal(debt.body.fallback,'apps-script');
                console.log('PERF_CF_02CS_PREVIEW_FULL_PARITY_PASS='+JSON.stringify({attempt,result,debtFallback:true}));
                return;
              }catch(e){last=e;if(attempt<3) await sleep(5000);}
            }
            throw last;
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Production boundary after preview canary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.cutover,false);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);
            assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_PREVIEW_FINAL_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Safety conclusion
        run: echo 'PERF_CF_02CS_LINE_ID_PREVIEW_CANARY_PASS_NO_PRODUCTION_TRAFFIC_CHANGE'
