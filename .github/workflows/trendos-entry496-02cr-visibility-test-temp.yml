name: TrendOS Entry496 02CR visibility test TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry496-02cr-visibility-test-temp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and 02CR regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node tests/cloudflare_edge_orders_02cr_idle_freshness_02cu.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          node tests/frontend_edge_orders_cutover_02ct.test.mjs
          node tests/frontend_no_direct_google_transport_a61.test.mjs
          echo 'ENTRY496_02CR_VISIBILITY_TEST=PASS_V2'
