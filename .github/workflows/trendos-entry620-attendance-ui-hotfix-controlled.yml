name: TrendOS Entry620 Attendance UI Hotfix Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry620-attendance-ui-hotfix-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry620-attendance-ui-hotfix-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      EXPECTED_API_VERSION: de2c825d-ef63-407d-90dc-8059a9d4f192
      EXPECTED_FRONTEND_VERSION: 1f4a4faa-b532-45d5-8ea7-f5f79c8d2ac7
      EXPECTED_LIVE_ATTENDANCE_BLOB: 4472b66306a31c365a5a3e2b98e73dece85e93f1
      EXPECTED_PATCH_ATTENDANCE_BLOB: d7f2625aa03c18486069ee274d960adbf8cdcee4
      OLD_ATTENDANCE_TAG: 20260930-a61-cloud-transport
      NEW_ATTENDANCE_TAG: 20261004-entry620-d1-state-contract

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Qualify hotfix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object attendance-v1.js)" = "$EXPECTED_PATCH_ATTENDANCE_BLOB"
          node --check attendance-v1.js
          node tests/attendance_d1_ui_contract_entry620.test.mjs
          grep -Fq 'normalizeAttendanceBackendResponse' attendance-v1.js
          grep -Fq 'return normalizeAttendanceBackendResponse(out);' attendance-v1.js
          echo ENTRY620_SOURCE_LOCK=PASS

      - name: Exact Production preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json > /tmp/api.json
          npx wrangler deployments list --name trendos-ui --json > /tmp/ui.json
          node <<'NODE'
          const fs=require('fs');
          function active(path,label,expected,out){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
            if(full.length!==1||full[0].id!==expected)throw new Error(label+' version drift: '+JSON.stringify(full));
            if(out)fs.writeFileSync(out,full[0].id);
            console.log('ENTRY620_'+label+'_VERSION_LOCK=PASS');
          }
          active('/tmp/api.json','API',process.env.EXPECTED_API_VERSION);
          active('/tmp/ui.json','FRONTEND',process.env.EXPECTED_FRONTEND_VERSION,'/tmp/pre-ui-version.txt');
          NODE

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry620pre=$GITHUB_SHA" -o "/tmp/$f.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=r('/tmp/accounting.json'),o=r('/tmp/ops.json'),au=r('/tmp/auth.json'),b=r('/tmp/legacy-action.json');
          if(a.mode!=='READONLY'||Number(a.policyEpoch||0)!==2||a.authoritativeWrites!==false)throw new Error('accounting drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7)throw new Error('ops drift');
          if(au.mode!=='OFF'||au.envEnabled!==false)throw new Error('auth drift');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0)throw new Error('bridge drift');
          for(const f of ['content','comms','core'])if(r('/tmp/'+f+'.json').mode!=='OFF')throw new Error(f+' drift');
          console.log('ENTRY620_CONTROL_PREFLIGHT=PASS');
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry620pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry620pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry620pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry620pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry620pre=$suffix" -o /tmp/live-attendance.js

          test "$(git hash-object /tmp/live-attendance.js)" = "$EXPECTED_LIVE_ATTENDANCE_BLOB"
          grep -Fq "attendance-v1.js?v=$OLD_ATTENDANCE_TAG" /tmp/live-config.js
          grep -Fq "MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'" /tmp/live-config.js
          grep -Fq "MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY'" /tmp/live-config.js
          grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false" /tmp/live-config.js
          grep -Fq "MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false" /tmp/live-config.js
          ! grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1" /tmp/live-config.js
          grep -Fq "TRENDOS_EMPLOYEE_SSO_V1" /tmp/live-app.js
          grep -Fq "T12_ENTRY619_ACCOUNTING_READONLY_V1_20261004" /tmp/live-dispatcher.js
          grep -Fq "postWriteBarrierRecoveries" /tmp/live-edge.js
          grep -Fq "recoverPostWriteBarrier" /tmp/live-edge.js
          echo ENTRY620_LIVE_BASELINE=PASS

      - name: Build exact-live frontend patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-dispatcher.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp attendance-v1.js cloudflare-d1/frontend-dist/attendance-v1.js

          OLD="$OLD_ATTENDANCE_TAG" NEW="$NEW_ATTENDANCE_TAG" python3 <<'PY'
          from pathlib import Path
          import os
          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()
          old='attendance-v1.js?v='+os.environ['OLD']
          new='attendance-v1.js?v='+os.environ['NEW']
          if s.count(old)!=1:
              raise SystemExit('entry620-attendance-tag-anchor-count='+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check cloudflare-d1/frontend-dist/attendance-v1.js
          grep -Fq 'normalizeAttendanceBackendResponse' cloudflare-d1/frontend-dist/attendance-v1.js
          grep -Fq "attendance-v1.js?v=$NEW_ATTENDANCE_TAG" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY'" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false" cloudflare-d1/frontend-dist/config.js
          ! grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1" cloudflare-d1/frontend-dist/config.js
          echo ENTRY620_EXACT_LIVE_PATCH=PASS

      - name: Deploy frontend only with rollback
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry620 attendance UI hotfix automatic rollback" --config "$FRONTEND_CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry620post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry620post=$suffix" -o /tmp/post-attendance.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry620post=$suffix" -o /tmp/post-app.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry620post=$suffix" -o /tmp/post-dispatcher.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry620post=$suffix" -o /tmp/post-edge.js \
              && grep -Fq "attendance-v1.js?v=$NEW_ATTENDANCE_TAG" /tmp/post-config.js \
              && grep -Fq 'normalizeAttendanceBackendResponse' /tmp/post-attendance.js \
              && grep -Fq 'return normalizeAttendanceBackendResponse(out);' /tmp/post-attendance.js \
              && grep -Fq "TRENDOS_EMPLOYEE_SSO_V1" /tmp/post-app.js \
              && grep -Fq "T12_ENTRY619_ACCOUNTING_READONLY_V1_20261004" /tmp/post-dispatcher.js \
              && grep -Fq "postWriteBarrierRecoveries" /tmp/post-edge.js; then
                OK=1
                echo "ENTRY620_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry620post=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=r('/tmp/accounting-post.json'),o=r('/tmp/ops-post.json'),au=r('/tmp/auth-post.json'),b=r('/tmp/legacy-action-post.json');
          if(a.mode!=='READONLY'||Number(a.policyEpoch||0)!==2||a.authoritativeWrites!==false)throw new Error('accounting post drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7)throw new Error('ops post drift');
          if(au.mode!=='OFF'||au.envEnabled!==false)throw new Error('auth post drift');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0)throw new Error('bridge post drift');
          for(const f of ['content','comms','core'])if(r('/tmp/'+f+'-post.json').mode!=='OFF')throw new Error(f+' post drift');
          console.log('ENTRY620_POSTCUTOVER_HEALTH=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1)throw new Error('frontend post version');
          console.log('ENTRY620_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY620_STATUS=ATTENDANCE_UI_HOTFIX_DEPLOY_PASS
          echo ENTRY620_API_DEPLOY=NO
          echo ENTRY620_D1_MUTATION=NO
          echo ENTRY620_APPS_SCRIPT_TOUCHED=NO
          echo ENTRY620_AUTH_CHANGED=NO
          echo ENTRY620_BRIDGE_CHANGED=NO
