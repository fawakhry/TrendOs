name: Customer Access Effective Host Policy READONLY ONCE
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/customer-access-effective-policy-readonly-once.yml']
permissions:
  contents: read
jobs:
  readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/customer-access-effective-policy-readonly-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b31228887f9073c1aa8c6f2c06597b194f567df
      - name: Exact existing isolated Stage GET only - no public HTTP or writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN }}
          CF_STAGE_ACCESS_CLIENT_ID: ${{ secrets.CF_STAGE_ACCESS_CLIENT_ID }}
          CF_STAGE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_STAGE_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os,re,json,sys,datetime,importlib.util,hashlib,urllib.request,urllib.error
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("original","tools/zg_customer_stage_d1_binding_resolver_v1.py")
          original=importlib.util.module_from_spec(spec);spec.loader.exec_module(original)
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not re.fullmatch(r"[a-fA-F0-9]{32}",account) or len(token)<20:
              raise SystemExit("RELEASE_PREFLIGHT_CREDENTIALS_MISSING")
          print("PREFLIGHT_UTC="+datetime.datetime.now(datetime.timezone.utc).isoformat())
          root="/workers/scripts/"+original.WORKER
          sub=original.api_get(account,token,root+"/subdomain")["result"]
          settings=original.api_get(account,token,root+"/settings")["result"]
          databases=original.read_d1_inventory(account,token)
          original.resolved_config(original.SOURCE.read_text(),settings,sub,databases)
          print("EXACT_EXISTING_STAGE_WORKER_SYNTHETIC_D1=PASS")
          print("WORKERS_DEV_AND_PREVIEW=OFF")
          bindings=settings["bindings"]
          flags={x.get("name"):x.get("text") for x in bindings if x.get("type")=="plain_text"}
          enabled=[k for k in original.REQUIRED_OFF if flags.get(k)!="false"]
          print("REMOTE_CUSTOMER_FLAGS_ALL_OFF="+str(not enabled))
          print("REMOTE_R2_BINDINGS="+str(sum(x.get("type")=="r2_bucket" for x in bindings)))
          access=os.environ.get("CLOUDFLARE_ACCESS_API_TOKEN","")
          try:
              apps=original.api_get(account,access,"/access/apps?per_page=100")["result"]
              matches=[x for x in apps if hashlib.sha256(str(x.get("id","")).encode()).hexdigest().startswith("34134951077e")]
              print("PINNED_STAGE_ACCESS_APP_MATCHES="+str(len(matches)))
              if len(matches)==1:
                  app=matches[0]
                  print("ACCESS_SINGLE_HEADER_MODE="+str(bool(app.get("read_service_tokens_from_header"))))
                  policies=original.api_get(account,access,"/access/apps/"+app["id"]+"/policies")["result"]
                  print("ACCESS_POLICY_COUNT="+str(len(policies)))
                  print("ACCESS_HAS_DENY_EVERYONE="+str(any(p.get("decision")=="deny" and p.get("include")==[{"everyone":{}}] for p in policies)))
                  print("ACCESS_SERVICE_AUTH_POLICY_COUNT="+str(sum(p.get("decision")=="non_identity" for p in policies)))
          except ValueError as e:
              print("ACCESS_READ_STATUS="+str(e))

          import fnmatch,urllib.parse
          host_sub=original.api_get(account,token,"/workers/subdomain")["result"].get("subdomain")
          if not isinstance(host_sub,str) or not re.fullmatch(r"[a-z0-9-]+",host_sub):
              raise SystemExit("EXACT_WORKERS_HOST_NOT_RESOLVED")
          host=original.WORKER+"."+host_sub+".workers.dev"
          def host_matches(value):
              if not isinstance(value,str) or not value: return False
              u=urllib.parse.urlsplit(value if "://" in value else "https://"+value)
              return fnmatch.fnmatchcase(host,(u.hostname or "").lower()) and u.path in ("","/","/*")
          candidates=[]
          for app in apps:
              destinations=app.get("destinations") or []
              values=[app.get("domain")]+(app.get("self_hosted_domains") or [])
              values += [d.get("uri") for d in destinations if isinstance(d,dict) and d.get("type")=="public"]
              hostname_match=any(host_matches(x) for x in values)
              pinned=hashlib.sha256(str(app.get("id","")).encode()).hexdigest().startswith("34134951077e")
              if hostname_match or pinned: candidates.append((app,hostname_match,pinned))
          print("STAGE_ROOT_MATCHING_HOSTNAME_APPS="+str(sum(x[1] for x in candidates)))
          expected_tokens=set()
          for app,hostname_match,pinned in candidates:
              p=original.api_get(account,access,"/access/apps/"+app["id"]+"/policies")["result"]
              selected_tokens={i["service_token"]["token_id"] for x in p if x.get("decision")=="non_identity" for i in x.get("include",[]) if isinstance(i,dict) and isinstance(i.get("service_token"),dict) and "token_id" in i["service_token"]}
              if pinned: expected_tokens=selected_tokens
              print("ROOT_EFFECTIVE_APP="+json.dumps({"appFingerprint":hashlib.sha256(app["id"].encode()).hexdigest()[:12],"hostnameMatch":hostname_match,"pinnedWorkerApp":pinned,"policyDecisions":[x.get("decision") for x in p],"serviceTokenCount":len(selected_tokens),"singleHeaderMode":bool(app.get("read_service_tokens_from_header"))},sort_keys=True))
          dedicated=os.environ.get("CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN","")
          try:
              tokens=original.api_get(account,dedicated,"/access/service_tokens")["result"]
              matches=[t for t in tokens if t.get("id") in expected_tokens]
              print("PINNED_SERVICE_TOKEN_METADATA_MATCHES="+str(len(matches)))
              if len(matches)==1:
                  t=matches[0]; client=os.environ.get("CF_STAGE_ACCESS_CLIENT_ID","")
                  print("CLIENT_ID_RAW_MATCH="+str(client==t.get("client_id")))
                  print("TOKEN_ENABLED_METADATA="+str(t.get("enabled")))
                  print("TOKEN_EXPIRES_AT="+str(t.get("expires_at")))
          except ValueError as e: print("SERVICE_TOKEN_READ="+str(e))
          secret=os.environ.get("CF_STAGE_ACCESS_CLIENT_SECRET","")
          print("CLIENT_SECRET_PRESENT="+str(bool(secret)))
          print("CLIENT_SECRET_SURROUNDING_WHITESPACE="+str(secret!=secret.strip()))
          print("CLIENT_SECRET_WRAPPED_IN_QUOTES="+str(len(secret)>1 and secret[0] in chr(34)+chr(39) and secret[-1]==secret[0]))
          print("CLIENT_SECRET_CONTAINS_LINE_BREAK="+str(chr(10) in secret or chr(13) in secret))
          print("PUBLIC_HTTP_AND_CONTROL_PLANE_MUTATIONS=NONE")
          print("CONTROL_PLANE_ONLY=YES")
          print("PUBLIC_HTTP_REQUESTS=NONE")
          print("REMOTE_WRITES_DEPLOY_OR_POLICY_CHANGES=NONE")
          print("CUSTOMER_PRODUCTION_RELEASE=NOT_QUALIFIED")
          PY
