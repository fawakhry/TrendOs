name: TrendOS 02CO Apps Row Shape Diagnostic TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02co-apps-row-shape-diagnostic-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-02co-apps-row-shape-diagnostic-temp
  cancel-in-progress: false

jobs:
  row-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRENDOS_PROD_QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      EDGE_BASE: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4
      - name: Static no-write boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false' config.js
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/trendos-02co-apps-row-shape-diagnostic-temp.yml').read_text(encoding='utf-8')
          forbidden = ['wrangler ' + 'deploy', 'wrangler d1 migrations ' + 'apply', 'd1 execute --' + 'file', 'secret ' + 'put', 'TRENDOS_PRODUCTION_' + 'CUTOVER', 'AUTHORITY_' + 'CUTOVER', '/v1/qualification/cloud-write/reconcile/' + 'order']
          for token in forbidden:
              if token in workflow:
                  raise SystemExit('Forbidden write/cutover token found: ' + token)
          print('PERF_CF_02CO_ROW_SHAPE_STATIC_NO_WRITE_PASS')
          PY
      - name: Apps and Edge row shape without PII
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRENDOS_PROD_QUALIFY_USERNAME"
          test -n "$TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN"
          node <<'NODE'
          (async function main(){
            const edgeBase = process.env.EDGE_BASE;
            const appsScriptUrl = process.env.APPS_SCRIPT_URL;
            const username = process.env.TRENDOS_PROD_QUALIFY_USERNAME;
            const token = process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN;
            const safeKeys = [
              'orderId','orderCode','lineId','id','rowNumber','row','sheetRow','department','assignedTo','priority','status','ready','updatedAt','receivedAt','expectedDeliveryAt','expectedDeliveryText','heatPress','flyPrint','quickPrint','overdue','registrationSent','createdBy','updatedBy','screen','dataSource'
            ];
            function pick(row) {
              const out = {};
              for (const k of safeKeys) if (Object.prototype.hasOwnProperty.call(row || {}, k)) out[k] = row[k];
              out.keys = Object.keys(row || {}).filter(k => !/customer|phone|name|notes|message|whatsapp|folder|files|link/i.test(k)).sort();
              return out;
            }
            async function readJson(label, url, options = {}) {
              const started = Date.now();
              const res = await fetch(url, { cache: 'no-store', ...options });
              const raw = await res.text();
              let body = {};
              try { body = JSON.parse(raw || '{}'); } catch (err) { throw new Error(label + ' invalid JSON ' + raw.slice(0, 160)); }
              return { label, status: res.status, ms: Date.now() - started, body };
            }
            const boundary = await readJson('cloud-health', `${edgeBase}/v1/cloud/write/health`, { headers: { accept: 'application/json' } });
            if (boundary.status !== 200 || boundary.body.success !== true || boundary.body.cutover !== false || boundary.body.sheetsAuthoritative !== true || Number(boundary.body.pendingOutbox || 0) !== 0) throw new Error('authority boundary changed');
            const session = await readJson('edge-session', `${edgeBase}/v1/edge/orders/session`, { method: 'POST', headers: { accept: 'application/json', 'content-type': 'application/json' }, body: JSON.stringify({ username, token }) });
            if (session.status !== 200 || session.body.success !== true || !session.body.edgeToken) throw new Error('edge session failed http=' + session.status);
            const params = new URLSearchParams({ screen: 'print', page: '1', pageSize: '8' });
            const edge = await readJson('edge-print', `${edgeBase}/v1/edge/orders/page?${params}`, { headers: { accept: 'application/json', authorization: `Bearer ${session.body.edgeToken}` } });
            const app = await readJson('apps-print', appsScriptUrl, { method: 'POST', headers: { accept: 'application/json', 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'getRowsPageV1931', username, token, screen: 'print', page: '1', pageSize: '8' }) });
            const recon = await readJson('reconcile-health', `${edgeBase}/v1/qualification/cloud-write/reconcile/health`, { headers: { accept: 'application/json' } });
            if (recon.status !== 200 || recon.body.enabled !== false || recon.body.genericDrainEnabled !== false) throw new Error('02CL boundary changed');
            console.log('PERF_CF_02CO_ROW_SHAPE_DIAGNOSTIC=' + JSON.stringify({
              sessionUser: session.body.user && { role: session.body.user.role, department: session.body.user.department, screens: session.body.user.screens },
              edge: { status: edge.status, ms: edge.ms, success: edge.body.success, totalRows: edge.body.pagination && edge.body.pagination.totalRows, version: edge.body.version, rows: (edge.body.rows || []).slice(0, 8).map(pick) },
              apps: { status: app.status, ms: app.ms, success: app.body.success, totalRows: app.body.pagination && app.body.pagination.totalRows, rows: (app.body.rows || []).slice(0, 8).map(pick) },
              boundary: { pendingOutbox: boundary.body.pendingOutbox, cutover: boundary.body.cutover, sheetsAuthoritative: boundary.body.sheetsAuthoritative, reconcileEnabled: recon.body.enabled, genericDrainEnabled: recon.body.genericDrainEnabled }
            }));
            console.log('PERF_CF_02CO_ROW_SHAPE_DIAGNOSTIC_DONE');
          })().catch((err)=>{ console.error(err && err.stack || err); process.exit(1); });
          NODE
