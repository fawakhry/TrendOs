name: EasyStore A2.9 Post-Canary Readonly Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a29-post-canary-readonly-audit.yml'

permissions:
  contents: write

concurrency:
  group: easystore-a29-post-canary-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Read-only exact post-A2.9 verification
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$API_URL/v1/employee/accounting/health?a29postaudit=$GITHUB_RUN_ID" > /tmp/health.json
          curl -fsSL "$EASYSTORE_URL/config.js?a29postaudit=$GITHUB_RUN_ID" > /tmp/config.js
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1 WHERE active=1) AS activeMaterials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1 WHERE active=1) AS activeTemplates;
            SELECT request_key,operation,actor,status,entity_id
              FROM employee_accounting_request_ledger_v1
             WHERE request_key='A29-RECALC-muxaasiz-yihe2m4t';
            SELECT entity_type,entity_id,event_type,actor,request_key,payload_json AS payloadJson
              FROM employee_accounting_events_v1
             WHERE request_key='A29-RECALC-muxaasiz-yihe2m4t';
          " > /tmp/evidence.json
          node <<'NODE' > /tmp/result.txt
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const cfg=fs.readFileSync('/tmp/config.js','utf8');
          const x=JSON.parse(fs.readFileSync('/tmp/evidence.json','utf8'));
          const groups=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Array.isArray(v.results))groups.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}};
          walk(x);
          const all=groups.flat();
          const c=all.find(r=>r.materials!==undefined)||{};
          const q=all.find(r=>r.request_key==='A29-RECALC-muxaasiz-yihe2m4t'&&r.operation);
          const e=all.find(r=>r.request_key==='A29-RECALC-muxaasiz-yihe2m4t'&&r.entity_type);
          const expected={materials:1,templates:1,deptLines:0,finalInvoices:0,partyLedger:0,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:0,requestLedger:3,events:3,activeMaterials:0,activeTemplates:0};
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw Error('backend authority not READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0||Number(h.writeCanaryMaxCommands||0)!==0||Number(h.writeCanaryCommandsStarted||0)!==0)throw Error('server canary not cleared');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('google business calls nonzero');
          for(const [k,v] of Object.entries(expected))if(Number(c[k]||0)!==v)throw Error('baseline mismatch '+k+'='+c[k]);
          if(!q||q.operation!=='material-cost-cascade'||q.actor!=='ضياء'||q.status!=='COMMITTED'||String(q.entity_id||'')!=='')throw Error('request mismatch');
          if(!e||e.entity_type!=='material-cost-cascade'||e.entity_id!=='all'||e.event_type!=='recalculate'||e.actor!=='ضياء'||e.request_key!==q.request_key)throw Error('event mismatch');
          const p=JSON.parse(e.payloadJson||'{}');
          for(const k of ['materialCount','templateCount','changedMaterials','changedTemplates'])if(Number(p[k]||0)!==0)throw Error('recalc result nonzero '+k);
          console.log('A29_POST_AUDIT=PASS');
          console.log('RUN_ID='+process.env.GITHUB_RUN_ID);
          console.log('BACKEND_MODE='+h.mode);
          console.log('POLICY_EPOCH='+Number(h.policyEpoch||0));
          console.log('AUTHORITATIVE_WRITES='+String(h.authoritativeWrites));
          console.log('SERVER_USERS_ACTIONS='+Number(h.writeCanaryAllowedUserCount||0)+'/'+Number(h.writeCanaryAllowedActionCount||0));
          console.log('COMMAND_BUDGET='+Number(h.writeCanaryMaxCommands||0)+'/'+Number(h.writeCanaryCommandsStarted||0));
          console.log('GOOGLE_BUSINESS_CALLS='+Number(h.googleBusinessCalls||0));
          console.log('FRONTEND_MODE=' + (/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'CANARY'/.test(cfg)?'CANARY':(/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg)?'OFF':'OTHER')));
          console.log('MATERIALS=1');
          console.log('TEMPLATES=1');
          console.log('REQUEST_LEDGER=3');
          console.log('EVENTS=3');
          console.log('OTHER_TRACKED_TABLES=0');
          console.log('REQUEST_KEY='+q.request_key);
          console.log('EVENT=material-cost-cascade/all/recalculate');
          console.log('ACTOR=ضياء');
          console.log('RECALC_RESULT=ZERO_MASTER_SCOPE');
          console.log('PRODUCTION_MUTATION=NO');
          console.log('GENERAL_OPENED=NO');
          NODE

      - name: Persist audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            cp /tmp/result.txt .github/a29-post-canary-audit-result.txt
          else
            {
              echo "A29_POST_AUDIT=FAIL"
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "PRODUCTION_MUTATION=NO"
              echo "GENERAL_OPENED=NO"
            } > .github/a29-post-canary-audit-result.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/a29-post-canary-audit-result.txt
          git commit -m "A2.9: persist post-canary readonly audit evidence" || exit 0
          git push origin HEAD:candidate/easystore-accounting-a2-20261005

      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
