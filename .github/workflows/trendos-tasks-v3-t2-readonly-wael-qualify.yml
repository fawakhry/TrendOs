name: TrendOS Tasks V3 T2 Read-Only Wael Qualification

on:
  push:
    branches:
      - tasks-v3-t2-readonly-wael-canary-20260916
    paths:
      - 'cloudflare-d1/src/tasks-v3-t2-readonly-wael-worker.mjs'
      - 'cloudflare-d1/src/tasks-v3-readonly-preview.mjs'
      - 'cloudflare-d1/wrangler.tasks-v3-t2-readonly-wael-canary-20260916.toml'
      - 'cloudflare-d1/test/tasks-v3-t2-readonly-wael-contract.mjs'
      - 'cloudflare-d1/test/tasks-v3-t2-qualification.mjs'
      - '.github/workflows/trendos-tasks-v3-t2-readonly-wael-qualify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T2_SHARED_SECRET: ${{ secrets.TASKS_V3_SHARED_SECRET }}
      T2_NAME: trendos-tasks-v3-t2-readonly-wael-canary-20260916
      T2_CONFIG: cloudflare-d1/wrangler.tasks-v3-t2-readonly-wael-canary-20260916.toml
      T2_WORKER_URL: https://trendos-tasks-v3-t2-readonly-wael-canary-20260916.trendmall-contact.workers.dev
      T2_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzo6zcypF7mhECUrfqkP4u0NuzrV373vUQjLMk4o-TMbe4TyV93WkPnrsmeKVHSgCH1Bg/exec

    steps:
      - uses: actions/checkout@v4

      - name: Require protected credentials before any Cloudflare mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${T2_SHARED_SECRET:-}" || {
            echo 'Missing protected GitHub Actions secret TASKS_V3_SHARED_SECRET; refusing Cloudflare mutation.'
            exit 1
          }
          echo 'Protected credential preflight PASS; secret value was not printed.'

      - name: T2 source safety gate
        shell: bash
        run: |
          set -euo pipefail
          src='cloudflare-d1/src/tasks-v3-t2-readonly-wael-worker.mjs'
          adapter='cloudflare-d1/src/tasks-v3-readonly-preview.mjs'
          cfg="$T2_CONFIG"

          grep -F 'name = "trendos-tasks-v3-t2-readonly-wael-canary-20260916"' "$cfg"
          grep -F "TASKS_V3_APPS_SCRIPT_URL = \"$T2_APPS_SCRIPT_URL\"" "$cfg"
          grep -F "const T2_OPERATOR = 'وائل';" "$src"
          grep -F "const T2_ROLE = 'WAEL';" "$src"
          grep -F "if (request.method !== 'POST')" "$src"
          grep -F "'health'" "$adapter"
          grep -F "'status'" "$adapter"
          grep -F "'flyPrint'" "$adapter"
          grep -F "'pressCandidates'" "$adapter"

          if grep -nE 'claimNext|completeTask|APPS_SCRIPT_API_URL|TRENDOS_OPERATOR_TASK_PROXY_SECRET|EDGE_SESSION_SECRET|name[[:space:]]*=[[:space:]]*"trendos-main"' "$src" "$cfg"; then
            echo 'Forbidden production/mutation symbol found in T2 runtime scope.'
            exit 1
          fi
          if grep -nE '(^|[[:space:]])routes?[[:space:]]*=' "$cfg"; then
            echo 'Route declaration is forbidden during T2 qualification.'
            exit 1
          fi
          echo 'T2_SOURCE_SAFETY_GATE_PASS'

      - name: Run T2 contract tests
        run: node cloudflare-d1/test/tasks-v3-t2-readonly-wael-contract.mjs

      - name: Show Wrangler version
        run: npx --yes wrangler@4 --version

      - name: Audit T2 absence or prior isolated state
        shell: bash
        run: |
          set -u
          echo '=== T2 BEFORE ==='
          set +e
          npx --yes wrangler@4 deployments status --name "$T2_NAME" --json
          rc=$?
          set -e
          echo "T2_BEFORE_DEPLOYMENT_STATUS_RC=$rc"

      - name: Deploy isolated T2 Worker only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config "$T2_CONFIG" \
            --message "T2 read-only Wael canary ${GITHUB_SHA::8}"

      - name: Provision existing shared secret to T2 without exposing value
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$T2_SHARED_SECRET" | \
            npx --yes wrangler@4 secret put TASKS_V3_SHARED_SECRET --name "$T2_NAME"
          echo 'T2 secret binding provisioned; value was not printed or rotated.'

      - name: Verify T2 secret name only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name "$T2_NAME" --format json > /tmp/t2-secrets.json
          jq -e '.[] | select(.name == "TASKS_V3_SHARED_SECRET")' /tmp/t2-secrets.json >/dev/null
          jq -r '.[] | .name' /tmp/t2-secrets.json
          echo 'T2_SECRET_NAME_VERIFIED'

      - name: Verify isolated deployment and no T2 custom route/domain
        shell: bash
        run: |
          set -euo pipefail
          echo '=== T2 AFTER ==='
          npx --yes wrangler@4 deployments status --name "$T2_NAME" --json

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json')
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" > /tmp/domains.json
          if jq -e --arg name "$T2_NAME" '.result[]? | select(.service == $name)' /tmp/domains.json >/dev/null; then
            echo 'T2 custom domain attachment is forbidden.'
            exit 1
          fi

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones?account.id=${CLOUDFLARE_ACCOUNT_ID}&per_page=50" > /tmp/zones.json
          jq -r '.result[] | .id' /tmp/zones.json | while read -r zid; do
            curl -fsS "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/zones/${zid}/workers/routes" > /tmp/routes.json
            if jq -e --arg name "$T2_NAME" '.result[]? | select(.script == $name)' /tmp/routes.json >/dev/null; then
              echo 'T2 production zone route is forbidden.'
              exit 1
            fi
          done
          echo 'T2_ISOLATION_VERIFIED'

      - name: Negative method smoke test
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/t2-get.json -w '%{http_code}' "$T2_WORKER_URL")
          test "$code" = '405'
          jq -e '.code == "METHOD_NOT_ALLOWED"' /tmp/t2-get.json >/dev/null
          echo 'T2_GET_REJECTED_405'

      - name: Run 30-sample T2 read-only qualification
        id: qualification
        shell: bash
        run: |
          set -u
          set +e
          node cloudflare-d1/test/tasks-v3-t2-qualification.mjs
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo '### T2 qualification summary' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/t2-qualification.json ]; then
            jq '.summary' /tmp/t2-qualification.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "QUALIFICATION_RC=$rc"
          exit 0

      - name: Final Cloudflare safety audit
        if: always()
        shell: bash
        run: |
          set -u
          echo '=== T2 FINAL DEPLOYMENT ==='
          npx --yes wrangler@4 deployments status --name "$T2_NAME" --json || true
          echo '=== T1 SECRET NAMES ONLY ==='
          npx --yes wrangler@4 secret list --name trendos-tasks-v3-t1-preview-20260914 --format json 2>/dev/null | jq -r '.[] | .name' || true
          echo '=== T2 SECRET NAMES ONLY ==='
          npx --yes wrangler@4 secret list --name "$T2_NAME" --format json 2>/dev/null | jq -r '.[] | .name' || true
          echo 'No main Apps Script deployment/property action exists in this workflow.'
          echo 'No production route/frontend/D1 mutation action exists in this workflow.'

      - name: Enforce T2 qualification acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc='${{ steps.qualification.outputs.rc }}'
          test -n "$rc" || { echo 'Qualification did not run to completion.'; exit 1; }
          if [ "$rc" != '0' ]; then
            echo 'T2 qualification did not meet acceptance p95 <= 2s and/or success requirements.'
            exit 1
          fi
          echo 'T2_QUALIFICATION_ACCEPTED'
