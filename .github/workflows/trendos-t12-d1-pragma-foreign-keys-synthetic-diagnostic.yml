name: TrendOS T12 D1 PRAGMA foreign_keys Synthetic Diagnostic

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-t12-d1-pragma-foreign-keys-synthetic-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: trendos-t12-d1-pragma-foreign-keys-synthetic-diagnostic
  cancel-in-progress: false

jobs:
  pragma-foreign-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DB_NAME: trendos-t12-synthetic-test
      TEST_DB_UUID: 54a3c05e-cde9-4979-814f-d40f941edcd5
      PROD_DB_NAME: trendos-main
      PROD_DB_UUID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fail-closed target identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$TEST_DB_NAME" = 'trendos-t12-synthetic-test'
          test "$TEST_DB_UUID" = '54a3c05e-cde9-4979-814f-d40f941edcd5'
          test "$TEST_DB_UUID" != "$PROD_DB_UUID"
          test "$TEST_DB_NAME" != "$PROD_DB_NAME"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_UUID" \
            > /tmp/test-db.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/test-db.json','utf8')); if(x.success!==true||x.result?.name!==process.env.TEST_DB_NAME) process.exit(1); console.log('TEST_D1_IDENTITY=PASS name='+x.result.name);"

      - name: Install exact Wrangler used by latest diagnostic
        run: npm install --no-save wrangler@4.142.0

      - name: Build TEST-only runtime config
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/t12-pragma-test.toml <<EOF
          name = "trendos-t12-pragma-synthetic-diagnostic"
          main = "cloudflare-d1/t12-preview/t12-cloud-native-synthetic-test-worker.mjs"
          compatibility_date = "2026-09-27"

          [[d1_databases]]
          binding = "T12_SYNTHETIC_DB"
          database_name = "$TEST_DB_NAME"
          database_id = "$TEST_DB_UUID"
          EOF
          grep -F "database_name = \"$TEST_DB_NAME\"" /tmp/t12-pragma-test.toml
          grep -F "database_id = \"$TEST_DB_UUID\"" /tmp/t12-pragma-test.toml
          ! grep -q "$PROD_DB_NAME" /tmp/t12-pragma-test.toml
          ! grep -q "$PROD_DB_UUID" /tmp/t12-pragma-test.toml

      - name: Baseline schema count read-only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote --config /tmp/t12-pragma-test.toml \
            --command "SELECT COUNT(*) AS schema_objects FROM sqlite_master;" \
            > /tmp/before.txt
          cat /tmp/before.txt

      - name: Diagnostic A1 - PRAGMA foreign_keys ON only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote --config /tmp/t12-pragma-test.toml \
            --command "PRAGMA foreign_keys = ON;" \
            > /tmp/pragma.txt
          cat /tmp/pragma.txt
          echo "DIAG_A1_PRAGMA_FOREIGN_KEYS_ON=PASS"

      - name: Post schema count read-only
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote --config /tmp/t12-pragma-test.toml \
            --command "SELECT COUNT(*) AS schema_objects FROM sqlite_master;" \
            > /tmp/after.txt
          cat /tmp/after.txt

      - name: Sanitized summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### T12 D1 7500 diagnostic A1'
            echo '- Target: trendos-t12-synthetic-test only.'
            echo '- Production D1 name/UUID explicitly rejected by guards.'
            echo '- Wrangler: 4.142.0.'
            echo '- Tested construct only: PRAGMA foreign_keys = ON;'
            echo '- No migration apply, no migration bookkeeping, no production write, no Worker deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
