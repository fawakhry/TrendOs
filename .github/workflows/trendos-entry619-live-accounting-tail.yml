name: TrendOS Entry619 Live Accounting Authenticated Tail

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry619-live-accounting-tail.yml'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight remains Accounting READONLY
        shell: bash
        run: |
          set -euo pipefail
          for f in accounting ops auth legacy-action; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health" > "/tmp/$f.json"
          done
          node <<'NODE'
          const fs=require('fs'), read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=read('/tmp/accounting.json'), o=read('/tmp/ops.json'), au=read('/tmp/auth.json'), b=read('/tmp/legacy-action.json');
          if(a.mode!=='READONLY'||Number(a.policyEpoch||0)!==2||a.authoritativeWrites!==false) throw new Error('accounting-not-readonly');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7) throw new Error('ops-not-general');
          if(au.mode!=='OFF'||au.envEnabled!==false) throw new Error('auth-not-off');
          if(b.enabled!==false||b.secretConfigured!==false) throw new Error('bridge-not-off');
          console.log('ENTRY619_ACCOUNTING_TAIL_PREFLIGHT=PASS');
          NODE

      - name: Observe real Production Accounting traffic without credentials
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4.33.2 >/dev/null
          : > /tmp/tail.jsonl
          set +e
          timeout 120s npx wrangler tail trendos-d1-api --format json > /tmp/tail.jsonl 2>/tmp/tail.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/tail.err >&2
            exit "$rc"
          fi

          node <<'NODE'
          const fs=require('fs');
          const lines=fs.readFileSync('/tmp/tail.jsonl','utf8').split(/\r?\n/).filter(Boolean);
          let total=0, acc=0, ok=0, rejected=0, readonly=0, easystore200=0;
          for(const line of lines){
            let x; try{x=JSON.parse(line)}catch{continue}
            total++;
            const event=x.event||x;
            const req=event.request||event.event?.request||x.request||{};
            const res=event.response||event.event?.response||x.response||{};
            const url=String(req.url||event.url||'');
            let path=''; try{path=new URL(url).pathname}catch{}
            if(path!=='/v1/employee/accounting') continue;
            acc++;
            const status=Number(res.status||event.responseStatus||x.responseStatus||0);
            if(status===200) ok++;
            if(status===401) rejected++;
            if(status===503) readonly++;
            const h=req.headers||{};
            const origin=String(h.origin||h.Origin||'');
            const referer=String(h.referer||h.Referer||'');
            if(status===200 && (origin.includes('fawakhry.github.io')||referer.includes('fawakhry.github.io/EasyStore'))) easystore200++;
          }
          console.log('ENTRY619_TAIL_EVENTS_PARSED='+total);
          console.log('ENTRY619_ACCOUNTING_REQUESTS_OBSERVED='+acc);
          console.log('ENTRY619_ACCOUNTING_HTTP_200_OBSERVED='+ok);
          console.log('ENTRY619_ACCOUNTING_EASYSTORE_HTTP_200_OBSERVED='+easystore200);
          console.log('ENTRY619_ACCOUNTING_HTTP_401_OBSERVED='+rejected);
          console.log('ENTRY619_ACCOUNTING_HTTP_503_OBSERVED='+readonly);
          console.log('ENTRY619_CREDENTIALS_READ=NO');
          console.log('ENTRY619_PRODUCTION_MUTATION=NO');
          if(easystore200<1) throw new Error('no-authenticated-easystore-accounting-read-observed-in-tail-window');
          console.log('ENTRY619_AUTHENTICATED_ACCOUNTING_READONLY_LIVE_READ_SMOKE=PASS');
          NODE

# entry619 rerun trigger: secure EasyStore SSO live smoke retry-2
