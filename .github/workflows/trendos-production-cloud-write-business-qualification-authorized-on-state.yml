name: TrendOS Production Cloud Write Business Qualification Authorized On State

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-business-qualification-authorized-on-state.yml'

permissions:
  contents: read

concurrency:
  group: trendos-production-cloud-write-business-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event.head_commit.message == 'AUTHORIZED PROD CLOUD WRITE QUALIFICATION RETRY 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}

    steps:
      - name: Read-only Production preflight
        shell: bash
        run: |
          set -euo pipefail
          edge_code="$(curl --silent --show-error --output /tmp/edge-health.json --write-out '%{http_code}' "$PROD_URL/v1/edge/health")"
          write_code="$(curl --silent --show-error --output /tmp/write-health.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          shadow_code="$(curl --silent --show-error --output /tmp/shadow.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/v2/production-shadow")"
          test "$edge_code" = '200'
          test "$write_code" = '200'
          test "$shadow_code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/edge-health.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/write-health.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/shadow.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.database!==true||w.enabled!==true||w.writesAccepted!==true||w.authConfigured!==true||w.schemaReady!==true||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(1);
          if(!s.success||s.observerOnly!==true||s.readOnly!==true||s.mutationFree!==true||s.productionCutover!==false||s.d1Written!==false||s.sheetsWritten!==false) process.exit(1);
          fs.writeFileSync('/tmp/pre-pending.txt',String(Number(w.pendingOutbox||0)));
          console.log('PROD_QUAL_PRECHECK_PASS pendingOutbox='+Number(w.pendingOutbox||0));
          NODE
          anon_code="$(curl --silent --show-error --output /tmp/anon-write.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"clientRequestId":"prod-qual-anon-must-not-write"}' "$PROD_URL/v1/cloud/orders")"
          test "$anon_code" = '401'
          echo 'PROD_QUAL_ANON_FAIL_CLOSED_PASS'

      - name: Assert employee-auth qualification credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          echo 'PROD_QUAL_EMPLOYEE_AUTH_INPUT=READY'

      - name: Exchange employee session through canonical Production auth
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('/tmp/session-request.json',JSON.stringify({username:process.env.QUALIFY_USERNAME,token:process.env.QUALIFY_EMPLOYEE_TOKEN}),{mode:0o600});
          NODE
          code="$(curl --silent --show-error --output /tmp/session-response.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/session-request.json "$PROD_URL/v1/edge/session")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/session-response.json','utf8'));
          if(!x.success||!x.edgeToken||!x.user||!x.user.username) process.exit(1);
          fs.writeFileSync('/tmp/edge-token.txt',String(x.edgeToken),{mode:0o600});
          console.log('PROD_QUAL_CANONICAL_EMPLOYEE_SESSION_PASS user='+x.user.username);
          NODE
          rm -f /tmp/session-request.json

      - name: Execute exactly one bounded synthetic Production order and replay idempotently
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/edge-token.txt)"
          order_id="CW-PROD-QUAL-${GITHUB_RUN_ID}"
          request_id="prod-qual-${GITHUB_RUN_ID}"
          cat > /tmp/order.json <<JSON
          {"clientRequestId":"${request_id}","orderId":"${order_id}","customerName":"TrendOS Production Cloud Write Qualification","status":"cloud-qualification","department":"SYSTEM-QUALIFICATION","priority":"qualification","total":0,"remaining":0}
          JSON
          first_code="$(curl --silent --show-error --output /tmp/first.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $token" -H 'content-type: application/json' --data-binary @/tmp/order.json "$PROD_URL/v1/cloud/orders")"
          cat /tmp/first.json
          test "$first_code" = '201' -o "$first_code" = '200'
          ORDER_ID="$order_id" FIRST_CODE="$first_code" node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/first.json','utf8'));
          const id=process.env.ORDER_ID, code=process.env.FIRST_CODE;
          if(!x.success||x.dataSource!=='d1-cloud-write-v1'||x.sheetsSync!=='pending') process.exit(1);
          if(code==='201'){
            if(x.idempotent!==false||!x.order||x.order.orderId!==id) process.exit(1);
            fs.writeFileSync('/tmp/new-write.txt','1');
          }else{
            if(x.idempotent!==true||!x.result||x.result.orderId!==id) process.exit(1);
            fs.writeFileSync('/tmp/new-write.txt','0');
          }
          NODE
          second_code="$(curl --silent --show-error --output /tmp/second.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $token" -H 'content-type: application/json' --data-binary @/tmp/order.json "$PROD_URL/v1/cloud/orders")"
          cat /tmp/second.json
          test "$second_code" = '200'
          ORDER_ID="$order_id" node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/second.json','utf8'));
          if(!x.success||x.idempotent!==true||x.dataSource!=='d1-cloud-write-v1'||x.sheetsSync!=='pending'||!x.result||x.result.orderId!==process.env.ORDER_ID) process.exit(1);
          console.log('PROD_QUAL_IDEMPOTENT_REPLAY_PASS orderId='+process.env.ORDER_ID);
          NODE
          outbox_code="$(curl --silent --show-error --output /tmp/outbox.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/cloud/write/outbox?status=pending&limit=200")"
          test "$outbox_code" = '200'
          ORDER_ID="$order_id" node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/outbox.json','utf8'));
          const matches=(x.outbox||[]).filter(r=>r.entityId===process.env.ORDER_ID&&r.operation==='upsert_order_to_sheets'&&r.status==='pending');
          if(!x.success||matches.length!==1) process.exit(1);
          console.log('PROD_QUAL_SINGLE_PENDING_OUTBOX_PASS orderId='+process.env.ORDER_ID);
          NODE
          echo "QUALIFICATION_ORDER_ID=$order_id" >> "$GITHUB_ENV"
          unset token

      - name: Post-write safety verification
        shell: bash
        run: |
          set -euo pipefail
          write_code="$(curl --silent --show-error --output /tmp/post-write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          test "$write_code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/post-write.json','utf8'));
          if(!x.success||x.enabled!==true||x.writesAccepted!==true||x.schemaReady!==true||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1);
          const pre=Number(fs.readFileSync('/tmp/pre-pending.txt','utf8'));
          const now=Number(x.pendingOutbox||0);
          const isNew=fs.readFileSync('/tmp/new-write.txt','utf8').trim()==='1';
          if(isNew && now!==pre+1) process.exit(1);
          if(!isNew && now!==pre) process.exit(1);
          console.log('PROD_QUAL_POST_WRITE_BOUNDARY_PASS pendingBefore='+pre+' pendingAfter='+now+' newWrite='+isNew);
          NODE
          s1="$(curl --silent --show-error --output /tmp/shadow1.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/v2/production-shadow")"
          s2="$(curl --silent --show-error --output /tmp/shadow2.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/v2/production-shadow")"
          test "$s1" = '200'
          test "$s2" = '200'
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/shadow1.json','utf8')),b=JSON.parse(fs.readFileSync('/tmp/shadow2.json','utf8'));
          if(!a.success||a.observerOnly!==true||a.mutationFree!==true||a.d1Written!==false||a.sheetsWritten!==false||a.productionCutover!==false||a.shadowFingerprint!==b.shadowFingerprint) process.exit(1);
          console.log('PROD_QUAL_SHADOW_STILL_MUTATION_FREE_PASS fingerprint='+a.shadowFingerprint);
          NODE

      - name: Qualification success conclusion
        run: |
          echo "PROD_CLOUD_WRITE_BUSINESS_QUALIFICATION_PASS orderId=$QUALIFICATION_ORDER_ID"
          echo 'Cloud Write remains ON; cutover remains OFF; Sheets remain authoritative.'
          echo 'The qualification record remains synthetic and its Sheets outbox state is pending.'

      - name: Cleanup sensitive temporary files
        if: always()
        run: rm -f /tmp/edge-token.txt /tmp/session-request.json /tmp/session-response.json
