name: TrendOS 02CS Authoritative Order Preview V4 TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-authoritative-order-preview-v4-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-authoritative-order-preview-v4
  cancel-in-progress: false

jobs:
  preview-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PREVIEW_URL: https://cs-orderfix-trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - name: Static zero-production-traffic gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Fq 'function semanticUpdatedSortMs(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-authoritative-order-preview-v4-temp.yml').read_text(encoding='utf-8').splitlines()
          cmds=[x.strip() for x in lines if x.strip().startswith('npx --yes wrangler@')]
          if len(cmds)!=1 or ' versions upload ' not in cmds[0]:
              raise SystemExit('Expected exactly one versions upload command: '+repr(cmds))
          if any(x in cmds[0] for x in [' versions deploy ',' deploy --config',' rollback ',' secret ',' d1 ']):
              raise SystemExit('Traffic/secret/D1 mutation command forbidden')
          print('PERF_CF_02CS_ORDER_PREVIEW_V4_ZERO_TRAFFIC_STATIC_PASS')
          PY

      - name: Production boundary before preview upload GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false); assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_ORDER_PREVIEW_V4_PRE_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Upload qualified Worker version only — zero production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions upload --config cloudflare-d1/wrangler.toml --preview-alias cs-orderfix --message "TrendOS 02CS authoritative ordering preview V4" | tee /tmp/upload.txt
          echo 'PERF_CF_02CS_ORDER_PREVIEW_V4_UPLOAD_DONE_ZERO_TRAFFIC'
          sleep 8

      - name: Preview session stability and exact authoritative parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PREVIEW_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function readJson(label,url,opt={},attempts=5){let last;for(let i=1;i<=attempts;i++){try{const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let body;try{body=JSON.parse(raw||'{}')}catch{throw new Error(label+' invalid JSON http='+r.status)}return{status:r.status,body};}catch(e){last=e;if(i<attempts)await sleep(2500*i)}}throw last;}
          async function newSession(){for(let i=1;i<=5;i++){const x=await readJson('session',edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},1);if(x.status===200&&x.body.success&&x.body.edgeToken)return x.body.edgeToken;if(i<5)await sleep(3000*i)}throw new Error('preview session not ready');}
          async function edgeRows(screen,bearer){const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});const x=await readJson('edge-'+screen,edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');return x.body;}
          async function appRows(screen){const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};const x=await readJson('apps-'+screen,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body;}
          (async()=>{
            const sessionTimes=[];
            for(let i=0;i<3;i++){const started=Date.now();await newSession();sessionTimes.push(Date.now()-started);}
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const bearer=await newSession(),summary=[];
                for(const screen of ['print','laser']){
                  const e=await edgeRows(screen,bearer),a=await appRows(screen);
                  const ek=(e.rows||[]).map(key),ak=(a.rows||[]).map(key);
                  assert.deepEqual(ek,ak,screen+' exact ordered identity mismatch');
                  for(const m of e.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
                  summary.push({screen,totalRows:ek.length});
                }
                const p=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});
                const debt=await readJson('debt',edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
                assert.equal(debt.status,409); assert.equal(debt.body.code,'apps-script-required'); assert.equal(debt.body.fallback,'apps-script');
                console.log('PERF_CF_02CS_ORDER_PREVIEW_V4_FULL_PARITY_PASS='+JSON.stringify({attempt,sessionProbes:sessionTimes.length,summary,debtFallback:true}));
                return;
              }catch(e){last=e;if(attempt<3)await sleep(5000*attempt);}
            }
            throw last;
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Production boundary after preview canary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false); assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_ORDER_PREVIEW_V4_POST_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Safety conclusion
        run: echo 'PERF_CF_02CS_ORDER_PREVIEW_V4_PASS_ZERO_PRODUCTION_TRAFFIC'
