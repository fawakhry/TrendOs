name: TrendOS A61 browser Cloud transport regression
on:
  push:
    branches: [candidate/t12-full-cloud-cutover-a56-20260929]
    paths: ['Code.gs', '**/*.js', '**/*.html', 'tests/**', 'cloudflare-d1/src/legacy-browser-transport-v1.mjs', '.github/workflows/trendos-a61-browser-transport-ci.yml']
  pull_request:
    paths: ['Code.gs', '**/*.js', '**/*.html', 'tests/**', 'cloudflare-d1/src/legacy-browser-transport-v1.mjs', '.github/workflows/trendos-a61-browser-transport-ci.yml']
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          node --check cloudflare-d1/src/index_v2.js
          node --check cloudflare-d1/src/legacy-browser-transport-v1.mjs
          node --check cloudflare-d1/src/cloud-auth-shadow-v1.mjs
          node --check cloudflare-d1/src/cloud-session-bridge-v3.mjs
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Isolated transport, dispatcher, Orders and A61 regressions
        run: |
          set -e
          node tests/frontend_no_direct_google_transport_a61.test.mjs
          node tests/legacy_browser_transport_a61.test.mjs
          node tests/cloudflare_orders_session_shadow_handoff_entry497.test.mjs
          node tests/cloudflare_legacy_session_race_guard_entry504.test.mjs
          node tests/apps_script_employee_session_mismatch_non_destructive_entry531.test.mjs
          node tests/frontend_employee_session_isolation_entry533.test.mjs
          node tests/frontend_employee_api_dispatcher_a61.test.mjs
          node tests/frontend_legacy_module_dispatch_a61.test.mjs
          node tests/frontend_edge_orders_cutover_02ct.test.mjs
          node tests/frontend_order_status_write_consistency_02cv.test.mjs
          node tests/frontend_order_status_ux_02cv.test.mjs
          node tests/frontend_flyprint_lane_stability_02cv.test.mjs
          node tests/frontend_t12_customer_cloud_only_a56.test.mjs
          node tests/frontend_session_and_zero_google_read_entry499.test.mjs
          node tests/frontend_orders_initial_edge_ready_entry577.test.mjs
          node tests/employee_auth_native_a61.test.mjs
          node tests/employee_legacy_auth_bridge_a61.test.mjs
