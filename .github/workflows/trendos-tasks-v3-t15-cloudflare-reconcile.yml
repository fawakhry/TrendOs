name: TrendOS Tasks V3 T1.5 Cloudflare Preview Reconcile

on:
  push:
    branches:
      - tasks-v3-t15-d1-read-replica-preview-20260915
    paths:
      - '.github/workflows/trendos-tasks-v3-t15-cloudflare-reconcile.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Audit only or apply the isolated preview configuration
        required: true
        type: choice
        options:
          - audit
          - apply
        default: audit
      confirm:
        description: For apply mode type T15_PREVIEW_ONLY
        required: false
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T1_NAME: trendos-tasks-v3-t1-preview-20260914
      T15_NAME: trendos-tasks-v3-t15-preview-20260915
      T1_CONFIG: cloudflare-d1/wrangler.tasks-v3-t1-preview.toml
      T15_CONFIG: cloudflare-d1/wrangler.tasks-v3-t15-preview.toml

    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Safety gate - isolated preview only
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "trendos-tasks-v3-t1-preview-20260914"' "$T1_CONFIG"
          grep -F 'name = "trendos-tasks-v3-t15-preview-20260915"' "$T15_CONFIG"
          grep -F 'database_id = "4c4d48f2-8c5d-45f2-9d41-c426c17ed93c"' "$T15_CONFIG"
          grep -F 'binding = "TASKS_V3_T1_SERVICE"' "$T15_CONFIG"
          grep -F 'service = "trendos-tasks-v3-t1-preview-20260914"' "$T15_CONFIG"
          grep -F 'TASKS_V3_T15_MAX_SNAPSHOT_AGE_SECONDS = "180"' "$T15_CONFIG"
          grep -F 'crons = ["* * * * *"]' "$T15_CONFIG"

          if grep -R -F '5c4b92bf-e043-4f6e-bd6d-d514a92cd825' \
            "$T15_CONFIG" cloudflare-d1/src/tasks-v3-t15-*.mjs; then
            echo "Production D1 id is forbidden"
            exit 1
          fi

          if grep -R -E 'name[[:space:]]*=[[:space:]]*"trendos-main"|APPS_SCRIPT_API_URL|TRENDOS_OPERATOR_TASK_PROXY_SECRET|claimNext|completeTask' \
            "$T1_CONFIG" "$T15_CONFIG" cloudflare-d1/src/tasks-v3-t1-preview-worker.mjs cloudflare-d1/src/tasks-v3-readonly-preview.mjs cloudflare-d1/src/tasks-v3-t15-*.mjs; then
            echo "Production/mutation symbol found in reconcile scope"
            exit 1
          fi

      - name: Verify T1.5 contract before remote work
        run: node cloudflare-d1/test/tasks-v3-t15-preview-contract.mjs

      - name: Show Wrangler version
        run: npx --yes wrangler@4 --version

      - name: Audit current isolated deployments
        shell: bash
        run: |
          set -euo pipefail
          echo "### Before" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 deployments status --name "$T1_NAME" --json | tee /tmp/t1-before.json >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 deployments status --name "$T15_NAME" --json | tee /tmp/t15-before.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate apply confirmation
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || (github.event_name == 'push' && github.event.head_commit.message == 'T15_PREVIEW_APPLY') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.confirm }}" = "T15_PREVIEW_ONLY" || {
              echo "Apply blocked: confirmation must equal T15_PREVIEW_ONLY"
              exit 1
            }
          else
            test "${{ github.event.head_commit.message }}" = "T15_PREVIEW_APPLY" || {
              echo "Apply blocked: push marker mismatch"
              exit 1
            }
          fi

      - name: Apply canonical T1 source Worker
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || (github.event_name == 'push' && github.event.head_commit.message == 'T15_PREVIEW_APPLY') }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config "$T1_CONFIG" \
            --keep-vars \
            --message "T1 isolated source for T1.5 reconcile ${GITHUB_SHA::8}"

      - name: Apply canonical T1.5 preview Worker
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || (github.event_name == 'push' && github.event.head_commit.message == 'T15_PREVIEW_APPLY') }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config "$T15_CONFIG" \
            --message "T1.5 isolated preview reconcile ${GITHUB_SHA::8}"

      - name: Audit final isolated deployments
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || (github.event_name == 'push' && github.event.head_commit.message == 'T15_PREVIEW_APPLY') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### After" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 deployments status --name "$T1_NAME" --json | tee /tmp/t1-after.json >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 deployments status --name "$T15_NAME" --json | tee /tmp/t15-after.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Applied only to isolated Workers: $T1_NAME and $T15_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "No production Worker, production D1, Apps Script deployment, or secret mutation is in this workflow." >> "$GITHUB_STEP_SUMMARY"
