name: TrendOS Production Schema 0003 Authorized Apply Once

# One-shot authorization bridge for explicit user-approved Production migration 0003.
# It may run only on the exact authorization commit below, on the working branch,
# and keeps Cloud Write OFF before and after schema installation.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-schema-authorized-apply-once.yml'

permissions:
  contents: read

concurrency:
  group: trendos-production-schema-0003-authorized-once
  cancel-in-progress: false

jobs:
  apply-production-schema-0003-once:
    if: ${{ github.event.head_commit.message == 'AUTHORIZED PROD SCHEMA 0003 APPLY 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PROD_DB_NAME: trendos-main
      PROD_DB_ID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
      MIGRATION: cloudflare-d1/migrations/0003_cloud_write_lane.sql
      EXPECTED_BLOB_SHA: b4c81348f9b1e79519130033b5b1dffcc86eaa0b
      EXPECTED_SHADOW_FINGERPRINT: 66711d7eef8febed69fa59cbd8b5f20146ed82374de55595ae1a126291d3f4b1
      WRANGLER_VERSION: 4.33.2

    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4

      - name: Hard identity, authorization, and OFF-state gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/go-live-2026-09-01-integrity'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"$' cloudflare-d1/wrangler.toml
          grep -Eq '^migrations_dir = "migrations"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          actual="$(git hash-object "$MIGRATION")"
          echo "MIGRATION_BLOB_SHA=$actual"
          test "$actual" = "$EXPECTED_BLOB_SHA"
          echo 'AUTHORIZED_SCHEMA_0003_IDENTITY_OFF_GATE_PASS'

      - name: Exact migration schema-only allow-list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          sql=Path('cloudflare-d1/migrations/0003_cloud_write_lane.sql').read_text(encoding='utf-8')
          tables=re.findall(r'CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)',sql,re.I)
          indexes=re.findall(r'CREATE\s+(?:UNIQUE\s+)?INDEX\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)',sql,re.I)
          if tables != ['cloud_write_events','cloud_write_outbox']: raise SystemExit('UNEXPECTED_TABLES='+repr(tables))
          if indexes != ['idx_cloud_write_events_entity','idx_cloud_write_events_sheets_status','idx_cloud_write_outbox_event_unique','idx_cloud_write_outbox_pending']: raise SystemExit('UNEXPECTED_INDEXES='+repr(indexes))
          for protected in ['customers','orders','sheet_catalog','sheet_rows','sheet_migration_runs']:
              if re.search(rf'CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+{re.escape(protected)}\b',sql,re.I):
                  raise SystemExit('PROTECTED_TABLE_CREATE_REFUSED='+protected)
          for stmt in [s.strip() for s in sql.split(';') if s.strip()]:
              n=re.sub(r'\s+',' ',stmt).strip().upper()
              allowed=(n=='PRAGMA FOREIGN_KEYS = ON' or n.startswith('CREATE TABLE IF NOT EXISTS CLOUD_WRITE_') or n.startswith('CREATE INDEX IF NOT EXISTS IDX_CLOUD_WRITE_') or n.startswith('CREATE UNIQUE INDEX IF NOT EXISTS IDX_CLOUD_WRITE_'))
              if not allowed: raise SystemExit('NON_ALLOWLISTED_STATEMENT='+n[:180])
          print('AUTHORIZED_SCHEMA_0003_ALLOWLIST_PASS')
          PY

      - name: Production preflight — exact pending set, health OFF, Shadow read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list "$PROD_DB_NAME" --remote --config cloudflare-d1/wrangler.toml | tee /tmp/pre-pending.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/pre-pending.txt').read_text(encoding='utf-8',errors='replace')
          names=[]
          for name in re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',text):
              if name not in names: names.append(name)
          print('PRE_PENDING_MIGRATIONS='+repr(names))
          if names != ['0003_cloud_write_lane.sql']:
              raise SystemExit('PRE_PENDING_MIGRATIONS_REFUSED='+repr(names))
          PY
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/pre-write.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/pre-write.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.authConfigured===true && x.schemaReady===false && x.pendingOutbox===null && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('PRE_SCHEMA_HEALTH='+JSON.stringify({enabled:x.enabled,writesAccepted:x.writesAccepted,schemaReady:x.schemaReady,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/v2/production-shadow" > /tmp/pre-shadow.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/pre-shadow.json','utf8'));
          const pass=x.success===true && x.valid===true && x.readOnly===true && x.mutationFree===true && x.liveProductionDataRead===false && x.d1Read===false && x.d1Written===false && x.appsScriptCalled===false && x.sheetsWritten===false && Number(x.mutationCount||0)===0 && x.productionWriteEnabled===false && x.productionCutover===false && x.shadowFingerprint===process.env.EXPECTED_SHADOW_FINGERPRINT;
          console.log('PRE_SCHEMA_SHADOW='+JSON.stringify({fingerprint:x.shadowFingerprint,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Recheck exact pending 0003 and apply canonical D1 migration ledger
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list "$PROD_DB_NAME" --remote --config cloudflare-d1/wrangler.toml | tee /tmp/immediate-pending.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/immediate-pending.txt').read_text(encoding='utf-8',errors='replace')
          names=[]
          for name in re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',text):
              if name not in names: names.append(name)
          if names != ['0003_cloud_write_lane.sql']:
              raise SystemExit('IMMEDIATE_PENDING_MIGRATIONS_REFUSED='+repr(names))
          print('IMMEDIATE_PENDING_0003_EXACT_PASS')
          PY
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply "$PROD_DB_NAME" --remote --config cloudflare-d1/wrangler.toml
          echo 'AUTHORIZED_PRODUCTION_SCHEMA_0003_APPLY_COMMAND_COMPLETE'

      - name: Verify canonical migration ledger is clear
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list "$PROD_DB_NAME" --remote --config cloudflare-d1/wrangler.toml | tee /tmp/post-pending.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/post-pending.txt').read_text(encoding='utf-8',errors='replace')
          names=[]
          for name in re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',text):
              if name not in names: names.append(name)
          print('POST_PENDING_MIGRATIONS='+repr(names))
          if names: raise SystemExit('POST_PENDING_MIGRATIONS_REFUSED='+repr(names))
          print('POST_MIGRATION_LEDGER_CLEAR_PASS')
          PY

      - name: Post-apply health and exact schema object proof
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/post-write.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/post-write.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.authConfigured===true && x.schemaReady===true && Number(x.pendingOutbox||0)===0 && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('POST_SCHEMA_HEALTH='+JSON.stringify({enabled:x.enabled,writesAccepted:x.writesAccepted,schemaReady:x.schemaReady,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE
          SQL="SELECT type,name FROM sqlite_master WHERE (type='table' AND name IN ('cloud_write_events','cloud_write_outbox')) OR (type='index' AND name IN ('idx_cloud_write_events_entity','idx_cloud_write_events_sheets_status','idx_cloud_write_outbox_event_unique','idx_cloud_write_outbox_pending')) ORDER BY type,name"
          payload="$(node -e 'process.stdout.write(JSON.stringify({sql:process.argv[1]}))' "$SQL")"
          code="$(curl --silent --show-error --output /tmp/post-schema.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID/query")"
          echo "POST_SCHEMA_QUERY_HTTP=$code"
          test "$code" = '200'
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/post-schema.json','utf8'));
          if(x.success!==true) process.exit(1);
          const rows=(x.result||[]).flatMap(b=>Array.isArray(b.results)?b.results:[]);
          const names=new Set(rows.map(r=>String(r.name||'')));
          const expected=['cloud_write_events','cloud_write_outbox','idx_cloud_write_events_entity','idx_cloud_write_events_sheets_status','idx_cloud_write_outbox_event_unique','idx_cloud_write_outbox_pending'];
          const pass=expected.every(n=>names.has(n)) && names.size===expected.length;
          console.log('POST_SCHEMA_OBJECTS='+JSON.stringify({objects:[...names].sort(),pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Prove write lane remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          payload='{"clientRequestId":"schema-0003-authorized-postcheck","orderId":"CW-SCHEMA-0003-REFUSED","customerName":"TrendOS Schema Gate","customerPhone":"01000000000","status":"cloud-draft"}'
          code="$(curl --silent --show-error --output /tmp/write-refusal.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data "$payload" "$PROD_URL/v1/cloud/orders")"
          echo "POST_SCHEMA_WRITE_REFUSAL_HTTP=$code"
          test "$code" = '423'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/write-refusal.json','utf8')); if(x.success!==false||x.enabled!==false||x.cutover!==false) process.exit(1)"
          outbox_code="$(curl --silent --show-error --output /tmp/outbox-refusal.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/outbox?status=pending&limit=1")"
          echo "POST_SCHEMA_OUTBOX_REFUSAL_HTTP=$outbox_code"
          test "$outbox_code" = '423'
          echo 'POST_SCHEMA_WRITE_LANE_OFF_PASS'

      - name: Verify Orders Lines parity and Shadow invariants
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/orders.json
          curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/lines.json
          node <<'NODE'
          const fs=require('fs');
          for(const [label,file] of [['ORDERS','/tmp/orders.json'],['LINES','/tmp/lines.json']]){
            const x=JSON.parse(fs.readFileSync(file,'utf8')), s=x.sheet||{};
            const pass=x.success===true && x.schemaMutationFree===true && s.status==='ready' && Number(s.rowCount||0)===Number(s.sourceLastRow||0) && ['TrendOS orders live sync V1','TrendOS orders live sync V2 quota-aware'].includes(String(s.note||''));
            console.log(label+'_POST_SCHEMA_PARITY='+JSON.stringify({rowCount:s.rowCount,sourceLastRow:s.sourceLastRow,note:s.note,pass}));
            if(!pass) process.exit(1);
          }
          NODE
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/v2/production-shadow" > /tmp/post-shadow.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/post-shadow.json','utf8'));
          const pass=x.success===true && x.valid===true && x.readOnly===true && x.mutationFree===true && x.liveProductionDataRead===false && x.d1Read===false && x.d1Written===false && x.appsScriptCalled===false && x.sheetsWritten===false && Number(x.mutationCount||0)===0 && x.productionWriteEnabled===false && x.productionCutover===false && x.shadowFingerprint===process.env.EXPECTED_SHADOW_FINGERPRINT;
          console.log('POST_SCHEMA_SHADOW='+JSON.stringify({fingerprint:x.shadowFingerprint,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Authorized schema-only conclusion
        run: |
          echo 'PRODUCTION_SCHEMA_0003_AUTHORIZED_APPLY_PASS'
          echo 'Migration 0003 installed through canonical D1 migration ledger. Cloud Write remains OFF. Sheets remain authoritative. No Worker deploy, secret change, or frontend cutover.'
