name: ACC187 Owner Dual Refund Method Policy and Denial — NO_GO
on:
  pull_request:
    paths:
      - '.github/workflows/easystore-acc187-owner-dual-refund-source-no-go.yml'
      - 'scripts/easystore_acc187_owner_refund_method_contract_no_go.mjs'
      - 'tests/easystore_acc187_owner_refund_method_contract_no_go.test.mjs'
      - 'tests/easystore_acc187_personalized_eligibility_no_go.test.mjs'
      - 'tests/easystore_acc187_sale_refund_gap_purchase_reversal_sqlite.test.mjs'
      - 'tests/easystore_acc198_shared_ledger_refund_stop_sqlite.test.mjs'
      - 'tests/easystore_acc187_synthetic_dual_settlement_sqlite_no_go.test.mjs'
      - 'tests/easystore_acc187_customer_debt_adjustment_not_store_credit_no_go.test.py'
      - 'scripts/easystore_acc187_paid_items_compensation_cap_no_go.mjs'
      - 'tests/easystore_acc187_paid_items_compensation_cap_no_go.test.mjs'
      - 'scripts/easystore_acc187_returned_product_inspection_waste_no_go.mjs'
      - 'tests/easystore_acc187_return_inspection_waste_no_go.test.mjs'
      - 'tests/easystore_acc187_return_stock_waste_isolated_sqlite_no_go.test.mjs'
      - 'scripts/easystore_acc187_manufacturing_waste_cost_recovery_no_go.mjs'
      - 'tests/easystore_acc187_manufacturing_waste_cost_recovery_no_go.test.mjs'
      - 'tests/easystore_acc187_waste_cost_recovery_isolated_sqlite_no_go.test.mjs'
      - 'tests/easystore_acc187_legacy_waste_recovery_separation_source_no_go.test.py'
      - 'scripts/easystore_acc187_manufacturing_cost_components_no_go.mjs'
      - 'tests/easystore_acc187_manufacturing_cost_components_no_go.test.mjs'
      - 'tests/easystore_acc187_manufacturing_components_isolated_sqlite_no_go.test.mjs'
      - 'cloudflare-d1/src/employee-accounting-native-v1.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-financial-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove two owner-approved settlement methods are review-only and require management
        shell: bash
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          node --check scripts/easystore_acc187_owner_refund_method_contract_no_go.mjs
          node --test tests/easystore_acc187_owner_refund_method_contract_no_go.test.mjs
          node --test tests/easystore_acc187_personalized_eligibility_no_go.test.mjs
          echo 'ACC187_PERSONALIZED_ONLY_VERIFIED_DEFECT_OR_TREND_MALL_ERROR=OWNER_POLICY'
          echo 'ACC187_OWNER_METHOD_DECISION=DUAL_WITH_PER_CASE_MANAGEMENT_APPROVAL'
          echo 'ACC187_OWNER_OTHER_REFUND_RULES=UNDECIDED'
          echo 'ACC187_REAL_REFUND_OR_CREDIT_POST=NOT_EXECUTED'
      - name: Original native Worker retains unknown-action denial with zero fake DB changes
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-sqlite tests/easystore_acc187_sale_refund_gap_purchase_reversal_sqlite.test.mjs
          node --experimental-sqlite tests/easystore_acc198_shared_ledger_refund_stop_sqlite.test.mjs
          node --experimental-sqlite --test tests/easystore_acc187_synthetic_dual_settlement_sqlite_no_go.test.mjs
          python3 tests/easystore_acc187_customer_debt_adjustment_not_store_credit_no_go.test.py
          node --check scripts/easystore_acc187_paid_items_compensation_cap_no_go.mjs
          node --test tests/easystore_acc187_paid_items_compensation_cap_no_go.test.mjs
          node --check scripts/easystore_acc187_returned_product_inspection_waste_no_go.mjs
          node --test tests/easystore_acc187_return_inspection_waste_no_go.test.mjs
          node --experimental-sqlite --test tests/easystore_acc187_return_stock_waste_isolated_sqlite_no_go.test.mjs
          node --check scripts/easystore_acc187_manufacturing_waste_cost_recovery_no_go.mjs
          node --test tests/easystore_acc187_manufacturing_waste_cost_recovery_no_go.test.mjs
          node --experimental-sqlite --test tests/easystore_acc187_waste_cost_recovery_isolated_sqlite_no_go.test.mjs
          python3 tests/easystore_acc187_legacy_waste_recovery_separation_source_no_go.test.py
          node --check scripts/easystore_acc187_manufacturing_cost_components_no_go.mjs
          node --test tests/easystore_acc187_manufacturing_cost_components_no_go.test.mjs
          node --experimental-sqlite --test tests/easystore_acc187_manufacturing_components_isolated_sqlite_no_go.test.mjs
          echo 'ACC187_OWNER_MFG_COST_COMPONENTS=MATERIALS_PLUS_DIRECT_LABOR_PLUS_ALLOCATED_OVERHEAD'
          echo 'ACC187_OVERHEAD_ALLOCATION_DRIVER_AND_LABOR_UNIT_COST=OWNER_DETAIL_PENDING'
          echo 'ACC187_REAL_MANUFACTURING_COST_OR_WASTE_LEDGER_POSTING=NOT_IMPLEMENTED'
          echo 'ACC187_LEGACY_WASTE_RECOVERED_FIELD=NOT_SEPARATE_MANAGER_APPROVED_RECOVERY'
          echo 'ACC187_OWNER_GROSS_DAMAGED_WASTE=VERIFIED_ACTUAL_MANUFACTURING_COST_NOT_SALE_PRICE'
          echo 'ACC187_OWNER_SUPPLIER_OR_RESPONSIBLE_PARTY_RECOVERY=SEPARATE_MANAGER_APPROVAL_AND_SEPARATE_RECORD'
          echo 'ACC187_REAL_MANUFACTURING_COST_SOURCE_AND_RECOVERY_LEDGER=NOT_IMPLEMENTED'
          echo 'ACC187_RETURNED_ITEMS=QUARANTINED_UNTIL_VERIFIED_FIT_FOR_RESALE'
          echo 'ACC187_INSPECTED_DAMAGED=FAKE_WASTE_NO_SALEABLE_RESTOCK'
          echo 'ACC187_ACTUAL_FINISHED_GOODS_WASTE_AND_RESTOCK_HANDLERS=NOT_IMPLEMENTED'
          echo 'ACC187_OWNER_AMOUNT_RULE=PAID_RETURNED_ITEMS_MINUS_PRIOR_CASH_AND_STORE_CREDIT'
          echo 'ACC187_EXCEPTION_ABOVE_NET_PAID=SEPARATE_MANAGER_APPROVAL_REQUIRED'
          echo 'ACC187_ITEM_LEVEL_ALLOCATION_AND_REAL_CREDIT=NOT_IMPLEMENTED'
          echo 'ACC187_OWNER_NORMAL_COMPENSATION_CEILING=PAID_FOR_RETURNED_ITEMS_MINUS_PRIOR_CASH_AND_CREDIT_DECIDED'
          echo 'ACC187_REAL_ITEM_PAYMENT_ALLOCATION_AND_LEDGER_POSTING=NOT_IMPLEMENTED'
          echo 'ACC187_REAL_CUSTOMER_CREDIT_AND_CASH=NEVER_EXECUTED'
          echo 'ACC187_REAL_CASH_OR_CREDIT_HANDLERS=NOT_IMPLEMENTED'
          echo 'ACC187_ACCOUNTING_G1_TO_G5=OPEN'
          echo 'FINANCE_RELEASE=NO_GO'
