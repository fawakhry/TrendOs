name: TrendOS Accounting D1 Preview Create

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-accounting-d1-preview-create.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-accounting-preview-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DB_NAME: trendos-accounting-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Create exact isolated Accounting Preview D1 through REST if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/accounting-d1-evidence
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"

          list_code="$(curl -sS -o /tmp/d1-before.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$base")"

          if [ "$list_code" != "200" ]; then
            jq --arg http "$list_code" '{stage:"LIST_BEFORE",httpStatus:($http|tonumber),errors:(.errors // [] | map({code,message})),schemaApplied:false,bindingChanged:false,financialWritePerformed:false}' /tmp/d1-before.json > /tmp/accounting-d1-evidence/rest-diagnostic.json || true
            exit 1
          fi

          existing_id="$(jq -r --arg name "$TARGET_DB_NAME" '.result[]? | select(.name == $name) | .uuid' /tmp/d1-before.json | head -n1)"

          if [ -n "$existing_id" ]; then
            jq -n --arg name "$TARGET_DB_NAME" --arg uuid "$existing_id" '{name:$name,uuid:$uuid,status:"NOOP_ALREADY_EXISTS",isolated:true,production:false,schemaApplied:false,bindingChanged:false,financialWritePerformed:false}' > /tmp/accounting-d1-evidence/accounting-preview-d1.json
            echo 'ACCOUNTING_PREVIEW_D1_CREATE=NOOP_ALREADY_EXISTS'
          else
            create_code="$(curl -sS -o /tmp/d1-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${TARGET_DB_NAME}\"}" \
              "$base")"

            jq --arg http "$create_code" --arg target "$TARGET_DB_NAME" '{stage:"CREATE",httpStatus:($http|tonumber),success:(.success // false),errors:(.errors // [] | map({code,message})),result:(if .result then {name:(.result.name // $target),uuid:(.result.uuid // "")} else null end),schemaApplied:false,bindingChanged:false,financialWritePerformed:false}' /tmp/d1-create.json > /tmp/accounting-d1-evidence/rest-create-response.json || true

            if [ "$create_code" -lt 200 ] || [ "$create_code" -ge 300 ]; then
              exit 1
            fi
            echo 'ACCOUNTING_PREVIEW_D1_CREATE=CREATED'
          fi

      - name: Verify exact isolated database exists through REST
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/accounting-d1-evidence
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          code="$(curl -sS -o /tmp/d1-after.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$base")"
          test "$code" = "200"
          uuid="$(jq -r --arg name "$TARGET_DB_NAME" '.result[]? | select(.name == $name) | .uuid' /tmp/d1-after.json | head -n1)"
          test -n "$uuid"
          jq -n --arg name "$TARGET_DB_NAME" --arg uuid "$uuid" '{name:$name,uuid:$uuid,isolated:true,production:false,schemaApplied:false,bindingChanged:false,financialWritePerformed:false}' > /tmp/accounting-d1-evidence/accounting-preview-d1.json
          {
            echo '## Accounting Preview D1'
            echo
            echo "- Name: **${TARGET_DB_NAME}**"
            echo "- UUID: \`${uuid}\`"
            echo '- Isolated non-production resource: **true**'
            echo '- Schema applied: **false**'
            echo '- Binding changed: **false**'
            echo '- Financial write performed: **false**'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ACCOUNTING_PREVIEW_D1_VERIFY=PASS name=${TARGET_DB_NAME} uuid=${uuid}"

      - name: Upload sanitized creation or diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-preview-d1-create-evidence
          path: /tmp/accounting-d1-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Assert workflow scope is constrained
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/trendos-accounting-d1-preview-create.yml'
          test "$(grep -Ec '\-X POST' "$file")" -eq 1
          test "$(grep -Fc 'TARGET_DB_NAME: trendos-accounting-preview' "$file")" -eq 1
          test "$(grep -Fc 'financialWritePerformed:false' "$file")" -ge 3
          test "$(grep -Fc 'schemaApplied:false' "$file")" -ge 3
          test "$(grep -Fc 'bindingChanged:false' "$file")" -ge 3
          echo 'ACCOUNTING_PREVIEW_CREATE_SCOPE=PASS'
