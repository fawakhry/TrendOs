name: TrendOS Accounting D1 Preview Create

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-accounting-d1-preview-create.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-accounting-preview-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.33.2
      TARGET_DB_NAME: trendos-accounting-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Create isolated Accounting Preview D1 if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/accounting-d1-evidence
          npx --yes wrangler@${WRANGLER_VERSION} d1 list --json > /tmp/d1-before.json
          node <<'NODE' > /tmp/existing-id.txt
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-before.json','utf8'));
          const target = process.env.TARGET_DB_NAME;
          const hit = rows.find(x => (x.name || x.database_name || '') === target);
          process.stdout.write(hit ? (hit.uuid || hit.id || hit.database_id || '') : '');
          NODE
          existing_id="$(cat /tmp/existing-id.txt)"
          if [ -n "$existing_id" ]; then
            node <<'NODE'
            const fs = require('fs');
            fs.writeFileSync('/tmp/accounting-d1-evidence/create-status.json', JSON.stringify({
              name: process.env.TARGET_DB_NAME,
              uuid: process.env.EXISTING_ID || '',
              status: 'NOOP_ALREADY_EXISTS',
              isolated: true,
              production: false,
              schemaApplied: false,
              bindingChanged: false,
              financialWritePerformed: false
            }, null, 2));
            NODE
            echo "ACCOUNTING_PREVIEW_D1_CREATE=NOOP"
          else
            set +e
            npx --yes wrangler@${WRANGLER_VERSION} d1 create "$TARGET_DB_NAME" > /tmp/d1-create.stdout 2> /tmp/d1-create.stderr
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              CREATE_RC="$rc" node <<'NODE'
              const fs = require('fs');
              const redact = (s) => {
                let out = String(s || '');
                for (const secret of [process.env.CLOUDFLARE_API_TOKEN, process.env.CLOUDFLARE_ACCOUNT_ID]) {
                  if (secret) out = out.split(secret).join('[REDACTED]');
                }
                return out.slice(-4000);
              };
              const evidence = {
                name: process.env.TARGET_DB_NAME,
                status: 'CREATE_FAILED',
                exitCode: Number(process.env.CREATE_RC || 1),
                stdoutTail: redact(fs.existsSync('/tmp/d1-create.stdout') ? fs.readFileSync('/tmp/d1-create.stdout','utf8') : ''),
                stderrTail: redact(fs.existsSync('/tmp/d1-create.stderr') ? fs.readFileSync('/tmp/d1-create.stderr','utf8') : ''),
                schemaApplied: false,
                bindingChanged: false,
                financialWritePerformed: false
              };
              fs.writeFileSync('/tmp/accounting-d1-evidence/create-diagnostic.json', JSON.stringify(evidence, null, 2));
              NODE
              exit "$rc"
            fi
            echo "ACCOUNTING_PREVIEW_D1_CREATE=CREATED"
          fi

      - name: Verify exact isolated database exists
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/accounting-d1-evidence
          npx --yes wrangler@${WRANGLER_VERSION} d1 list --json > /tmp/d1-after.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-after.json','utf8'));
          const target = process.env.TARGET_DB_NAME;
          const hit = rows.find(x => (x.name || x.database_name || '') === target);
          if (!hit) process.exit(1);
          const uuid = hit.uuid || hit.id || hit.database_id || '';
          if (!uuid) process.exit(1);
          const evidence = {name: target, uuid, isolated: true, production: false, schemaApplied: false, bindingChanged: false, financialWritePerformed: false};
          fs.writeFileSync('/tmp/accounting-d1-evidence/accounting-preview-d1.json', JSON.stringify(evidence, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Accounting Preview D1\n\n- Name: **${target}**\n- UUID: \`${uuid}\`\n- Isolated non-production resource: **true**\n- Schema applied: **false**\n- Binding changed: **false**\n- Financial write performed: **false**\n`);
          console.log('ACCOUNTING_PREVIEW_D1_VERIFY=PASS name=' + target + ' uuid=' + uuid);
          NODE

      - name: Upload sanitized creation or diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-preview-d1-create-evidence
          path: /tmp/accounting-d1-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Assert workflow scope is constrained
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/trendos-accounting-d1-preview-create.yml'
          if grep -Eq 'd1 (delete|execute|migrations)' "$file"; then
            echo 'Forbidden D1 mutation command detected.' >&2
            exit 1
          fi
          count="$(grep -Ec 'wrangler@\$\{WRANGLER_VERSION\} d1 create' "$file")"
          test "$count" -eq 1
          echo 'ACCOUNTING_PREVIEW_CREATE_SCOPE=PASS'
