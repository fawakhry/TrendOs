name: TrendOS Entry496 Manual Worker Bundle TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry496-manual-bundle-temp.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be62004d0e6d27ff96cc0a6b7eaa76419c3d0830
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Entry496 Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=dist/trendos-entry496-worker.js
          node --check dist/trendos-entry496-worker.js
          grep -F '02CR_ENRICHMENT_STALE_ADVISORY' dist/trendos-entry496-worker.js >/dev/null
          grep -F 'stale-structurally-qualified' dist/trendos-entry496-worker.js >/dev/null
          grep -F '"/v1/legacy-api"' dist/trendos-entry496-worker.js >/dev/null
          sha256sum dist/trendos-entry496-worker.js | tee dist/trendos-entry496-worker.sha256
          echo 'ENTRY496_MANUAL_BUNDLE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: trendos-entry496-manual-worker
          path: |
            dist/trendos-entry496-worker.js
            dist/trendos-entry496-worker.sha256
          if-no-files-found: error
