name: TrendOS Tasks V3 T1.5 v5 Version Override

on:
  push:
    branches:
      - tasks-v3-t15-d1-read-replica-preview-20260915
    paths:
      - 'cloudflare-d1/dashboard/tasks-v3-t15-preview-worker-v5-version-override.single.mjs'
      - 'cloudflare-d1/test/tasks-v3-t15-v5-version-override.mjs'
      - '.github/workflows/trendos-tasks-v3-t15-v5-version-override.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v5 version-override contract
        run: node cloudflare-d1/test/tasks-v3-t15-v5-version-override.mjs
