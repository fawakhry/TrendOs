name: "ZG Stage private Access capability inventory — READ ONLY 20261101"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/zg-private-stage-access-readonly-preflight-20261101.yml"
permissions:
  contents: read
jobs:
  private-ingress-capability-readonly:
    if: ${{ github.repository == 'fawakhry/TrendOs' && github.event.pull_request.number == 316 && github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'chore/zero-google-direct-cloudflare-stage-upload-v1-20261101' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check exact isolated non-public Stage and Access inventory READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git hash-object cloudflare-d1/wrangler.customer-stage.toml)" = "4e0c7f8275ff9cd89740f97b9f00c6d4d6cc75dd"
          python3 - <<'PY'
          import os,urllib.request,urllib.parse,urllib.error,json,re
          a=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          t=os.environ["CLOUDFLARE_API_TOKEN"]
          worker="trendos-customer-portal-isolated-stage-v0"
          stage_db="trendos-zg-customer-stage-synthetic-20261101-v0"
          if not re.fullmatch("[0-9a-fA-F]{32}",a):raise SystemExit("INVALID_ACCOUNT_ID")
          origin="https://api.cloudflare.com/client/v4/accounts/"+a
          def get(label,path):
              req=urllib.request.Request(origin+path,headers={"Authorization":"Bearer "+t})
              try:
                  with urllib.request.urlopen(req,timeout=25) as h:
                      res=json.load(h);code=h.status
              except urllib.error.HTTPError as e:
                  return {"label":label,"http":e.code,"success":False,"data":None}
              except Exception:
                  return {"label":label,"http":0,"success":False,"data":None}
              return {"label":label,"http":code,"success":res.get("success") is True,
                      "data":res.get("result")}
          sub=get("stage_subdomain","/workers/scripts/"+worker+"/subdomain")
          sett=get("stage_settings","/workers/scripts/"+worker+"/settings")
          dbs=get("account_d1_inventory","/d1/database?page=1&per_page=100")
          apps=get("account_access_apps","/access/apps?per_page=50")
          service=get("account_access_service_tokens","/access/service_tokens?per_page=50")
          # No raw HTTP response body/identities/keys emitted or uploaded.
          for item in (sub,sett,dbs,apps,service):
              print("CF_READ_"+item["label"].upper()+"_HTTP="+str(item["http"]))
              print("CF_READ_"+item["label"].upper()+"_OK="+str(item["success"]).lower())
          if not sub["success"] or sub["data"].get("enabled") is not False or sub["data"].get("previews_enabled") is not False:
              raise SystemExit("ISOLATED_STAGE_PUBLIC_ROUTE_STATE_UNSAFE_STOP")
          if not sett["success"]:raise SystemExit("STAGE_BINDINGS_READ_UNAVAILABLE_STOP")
          binds=sett["data"].get("bindings") or []
          d1=[x for x in binds if x.get("type")=="d1"]
          if len(d1)!=1 or d1[0].get("name")!="DB":raise SystemExit("STAGE_D1_BINDING_NOT_EXACT")
          d1_id=d1[0].get("id")
          if not dbs["success"] or not any(x.get("name")==stage_db and x.get("uuid")==d1_id for x in dbs["data"]):
              raise SystemExit("STAGE_D1_ID_NOT_EXACT")
          print("STAGE_PRIVATE_OFF_AND_D1_EXACT=PASS")
          if apps["success"]:
              relevant=[]
              for app in apps["data"] if isinstance(apps["data"],list) else []:
                  for d in (app.get("destinations") or []):
                      if d.get("type") in ("worker","preview_worker"):
                          relevant.append(d.get("worker_id"))
              print("CF_ACCESS_WORKER_DESTINATION_COUNT="+str(len(relevant)))
          # A passing read does NOT imply any service-token approval.
          print("ACCESS_SETUP_OR_SERVICE_TOKEN_WRITE_AUTHORIZED=NOT_CHECKED")
          print("CLOUDFLARE_ACCESS_UBUNTU_CASE_02394197=UNCHANGED")
          print("STAGE_PUBLIC_URL=NONE")
          print("REMOTE_WRITES_PERFORMED=NO")
          PY
