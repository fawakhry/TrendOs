name: TrendOS 02CO Wrapper Post Failure Boundary TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02co-wrapper-post-failure-boundary-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDGE_BASE: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false' config.js
          node <<'NODE'
          (async function main(){
            const base = process.env.EDGE_BASE;
            async function get(path) {
              const started = Date.now();
              const res = await fetch(base + path, { headers: { accept: 'application/json' }, cache: 'no-store' });
              const body = JSON.parse(await res.text() || '{}');
              return { status: res.status, ms: Date.now() - started, body };
            }
            const cloud = await get('/v1/cloud/write/health');
            const recon = await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth = await get('/v1/edge/orders/page?screen=print&page=1&pageSize=5');
            if (cloud.status !== 200 || cloud.body.success !== true || cloud.body.cutover !== false || cloud.body.sheetsAuthoritative !== true || Number(cloud.body.pendingOutbox || 0) !== 0) throw new Error('cloud boundary changed');
            if (recon.status !== 200 || recon.body.enabled !== false || recon.body.genericDrainEnabled !== false) throw new Error('02CL boundary changed');
            if (unauth.status !== 401) throw new Error('orders page no-token protection changed');
            console.log('PERF_CF_02CO_WRAPPER_POST_FAILURE_BOUNDARY=' + JSON.stringify({ cloudWriteMs: cloud.ms, pendingOutbox: cloud.body.pendingOutbox, cutover: cloud.body.cutover, sheetsAuthoritative: cloud.body.sheetsAuthoritative, reconcileEnabled: recon.body.enabled, genericDrainEnabled: recon.body.genericDrainEnabled, ordersUnauthStatus: unauth.status }));
          })().catch((err)=>{ console.error(err && err.stack || err); process.exit(1); });
          NODE
