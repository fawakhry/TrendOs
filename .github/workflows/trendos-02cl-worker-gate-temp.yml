name: TrendOS 02CL Worker Gate TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/wrangler.toml'

permissions:
  contents: read

concurrency:
  group: trendos-02cl-worker-gate-temp
  cancel-in-progress: false

jobs:
  execute:
    if: contains(github.event.head_commit.message, 'PERF-CF-02CL enable worker gate and execute')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      TARGET_ORDER_ID: CW-PROD-QUAL-33975124471
      CONFIRMATION: QUALIFY_PRODUCTION_OUTBOX_TO_SHEETS_33975124471
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard gates before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$USERNAME" = 'wael'
          test -n "$EMPLOYEE_TOKEN"
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          ! grep -R "wrangler d1 migrations apply\|d1 execute --file\|secret put EDGE_SESSION_SECRET" .github/workflows/trendos-02cl-worker-gate-temp.yml
          echo '02CL_EXEC_HARD_GATES_PASS'

      - name: Deploy Worker with bounded 02CL gate ON
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml
          sleep 8
          echo '02CL_WORKER_GATE_ON_DEPLOYED'

      - name: Verify exact target ready with gate ON
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health-before.json --write-out '%{http_code}' "$PROD_URL/v1/qualification/cloud-write/reconcile/health")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health-before.json','utf8'));
          const pass=x.success===true && x.enabled===true && x.database===true && x.edgeAuthConfigured===true && x.appsScriptConfigured===true && x.reconcileSecretConfigured===true && x.exactTargetRows===1 && x.outboxStatus==='pending' && Number(x.attempts||0)===0 && x.genericDrainEnabled===false && x.productionCutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_GATE_ON_READY='+JSON.stringify({enabled:x.enabled,reconcileSecretConfigured:x.reconcileSecretConfigured,exactTargetRows:x.exactTargetRows,outboxStatus:x.outboxStatus,attempts:x.attempts,genericDrainEnabled:x.genericDrainEnabled,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Canonical employee auth exchange
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @- "$PROD_URL/v1/edge/session" <<JSON
          {"username":"$USERNAME","token":"$EMPLOYEE_TOKEN"}
          JSON
          )"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const token=String(x.edgeToken||x.token||'').trim();
          if(x.success!==true || !token) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, `EDGE_TOKEN=${token}\n`);
          console.log('02CL_EDGE_SESSION_EXCHANGE_PASS');
          NODE
          rm -f /tmp/session.json

      - name: Execute exact target reconciliation once
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/execute.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H "authorization: Bearer $EDGE_TOKEN" --data-binary @- "$PROD_URL/v1/qualification/cloud-write/reconcile/order" <<JSON
          {"orderId":"$TARGET_ORDER_ID","confirmation":"$CONFIRMATION"}
          JSON
          )"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/execute.json','utf8'));
          const pass=x.success===true && x.state==='synced' && x.processed===true && x.entityId==='CW-PROD-QUAL-33975124471' && x.targetOrderId==='CW-PROD-QUAL-33975124471' && x.sheetsWritten===true && x.qualificationOnly===true && x.genericDrainEnabled===false && x.productionCutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_EXACT_TARGET_RECONCILE='+JSON.stringify({success:x.success,state:x.state,processed:x.processed,entityId:x.entityId,targetOrderId:x.targetOrderId,sheetsWritten:x.sheetsWritten,genericDrainEnabled:x.genericDrainEnabled,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Verify D1 target synced
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health-after.json --write-out '%{http_code}' "$PROD_URL/v1/qualification/cloud-write/reconcile/health")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health-after.json','utf8'));
          const pass=x.success===true && x.enabled===true && x.exactTargetRows===1 && x.outboxStatus==='synced' && x.eventStatus==='reconciled' && x.sheetsStatus==='synced' && Number(x.attempts||0)===1 && x.genericDrainEnabled===false && x.productionCutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_D1_TARGET_SYNCED='+JSON.stringify({enabled:x.enabled,exactTargetRows:x.exactTargetRows,outboxStatus:x.outboxStatus,eventStatus:x.eventStatus,sheetsStatus:x.sheetsStatus,attempts:x.attempts,genericDrainEnabled:x.genericDrainEnabled,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Replay proof is no-op
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/replay.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H "authorization: Bearer $EDGE_TOKEN" --data-binary @- "$PROD_URL/v1/qualification/cloud-write/reconcile/order/replay-proof" <<JSON
          {"orderId":"$TARGET_ORDER_ID","confirmation":"$CONFIRMATION"}
          JSON
          )"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/replay.json','utf8'));
          const pass=x.success===true && x.replayProof===true && x.idempotent===true && x.targetOrderId==='CW-PROD-QUAL-33975124471' && x.d1Written===false && x.sheetsWritten===false && Number(x.mutationCount||0)===0 && x.productionCutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_REPLAY_NOOP='+JSON.stringify({success:x.success,replayProof:x.replayProof,idempotent:x.idempotent,targetOrderId:x.targetOrderId,d1Written:x.d1Written,sheetsWritten:x.sheetsWritten,mutationCount:x.mutationCount,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Verify shadow and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/v2/production-shadow" > /tmp/shadow.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/shadow.json','utf8'));
          const pass=x.success===true && x.readOnly===true && x.mutationFree===true && x.d1Written===false && x.appsScriptCalled===false && x.sheetsWritten===false && Number(x.mutationCount||0)===0 && x.productionCutover===false;
          console.log('02CL_SHADOW_BOUNDARY='+JSON.stringify({success:x.success,readOnly:x.readOnly,mutationFree:x.mutationFree,d1Written:x.d1Written,appsScriptCalled:x.appsScriptCalled,sheetsWritten:x.sheetsWritten,mutationCount:x.mutationCount,productionCutover:x.productionCutover,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Execution conclusion
        shell: bash
        run: |
          echo 'PERF_CF_02CL_BOUNDED_EXECUTION_PASS_BEFORE_DISABLE'
          echo 'Exactly one target reconciliation executed, replay was no-op, generic drain stayed disabled, cutover stayed false.'

      - name: Cleanup edge token material
        if: ${{ always() }}
        run: rm -f /tmp/session.json /tmp/execute.json /tmp/replay.json

  disable:
    if: contains(github.event.head_commit.message, 'PERF-CF-02CL disable worker gate')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard gates before disable deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          ! grep -R "wrangler d1 migrations apply\|d1 execute --file\|secret put EDGE_SESSION_SECRET" .github/workflows/trendos-02cl-worker-gate-temp.yml
          echo '02CL_DISABLE_HARD_GATES_PASS'
      - name: Deploy Worker with 02CL gate OFF
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml
          sleep 8
          code="$(curl --silent --show-error --output /tmp/health-off.json --write-out '%{http_code}' "$PROD_URL/v1/qualification/cloud-write/reconcile/health")"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health-off.json','utf8'));
          const pass=x.success===true && x.enabled===false && x.reconcileSecretConfigured===true && x.exactTargetRows===1 && x.outboxStatus==='synced' && x.eventStatus==='reconciled' && x.sheetsStatus==='synced' && Number(x.attempts||0)===1 && x.genericDrainEnabled===false && x.productionCutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_WORKER_GATE_OFF_AFTER_PASS='+JSON.stringify({enabled:x.enabled,reconcileSecretConfigured:x.reconcileSecretConfigured,exactTargetRows:x.exactTargetRows,outboxStatus:x.outboxStatus,eventStatus:x.eventStatus,sheetsStatus:x.sheetsStatus,attempts:x.attempts,genericDrainEnabled:x.genericDrainEnabled,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE
          echo 'PERF_CF_02CL_WORKER_GATE_DISABLED_AFTER_PASS'
