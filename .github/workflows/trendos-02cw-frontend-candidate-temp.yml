name: TrendOS 02CW Frontend Candidate Temp

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cw-frontend-candidate-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_PROD_MAIN: 3934fa363b113a4bd494ec501fb5f289f2c48ec1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/go-live-2026-09-01-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact Production candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_PROD_MAIN"
          rm -rf /tmp/trendos-02cw-frontend
          git worktree add --detach /tmp/trendos-02cw-frontend "$EXPECTED_PROD_MAIN"
          python3 "$GITHUB_WORKSPACE/tools/patch_02cw_global_counters.py" --root /tmp/trendos-02cw-frontend

      - name: Run candidate contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trendos-02cw-frontend
          node tests/frontend_global_counters_filters_press_02cw.test.mjs
          node --check app.js
          node --check press-control-v1.js
          TRENDOS_TEST_ROOT=/tmp/trendos-02cw-frontend node "$GITHUB_WORKSPACE/tests/frontend_flyprint_lane_stability_02cv.test.mjs"
          TRENDOS_TEST_ROOT=/tmp/trendos-02cw-frontend node "$GITHUB_WORKSPACE/tests/frontend_order_status_write_consistency_02cv.test.mjs"

      - name: Assert exact bounded Production diff
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trendos-02cw-frontend
          git add -N tests/frontend_global_counters_filters_press_02cw.test.mjs
          git diff --check
          mapfile -t files < <(git diff --name-only)
          printf 'CHANGED_FILES=%s\n' "${files[*]}"
          test "${#files[@]}" -eq 5
          printf '%s\n' "${files[@]}" | grep -qx 'app.js'
          printf '%s\n' "${files[@]}" | grep -qx 'index.html'
          printf '%s\n' "${files[@]}" | grep -qx 'config.js'
          printf '%s\n' "${files[@]}" | grep -qx 'press-control-v1.js'
          printf '%s\n' "${files[@]}" | grep -qx 'tests/frontend_global_counters_filters_press_02cw.test.mjs'
          echo 'PERF_CF_02CW_FRONTEND_CANDIDATE_PASS'

# rerun: production press-control anchor aligned
