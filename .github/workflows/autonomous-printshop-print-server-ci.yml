name: Autonomous Printshop Print Server CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/print-server/**'
      - '.github/workflows/autonomous-printshop-print-server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: autonomous-printshop/print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: autonomous-printshop/print-server/requirements.txt
      - name: Install preview engines
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python 3.8 syntax gate
        shell: python
        run: |
          import ast
          from pathlib import Path
          files = list(Path('src').glob('*.py')) + [Path('run.py')] + list(Path('tests').glob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path), feature_version=(3, 8))
              print('PY38_PARSE_PASS', path)
