name: TrendOS T12 A60 Force Password Change CI

on:
  push:
    branches:
      - candidate/t12-a60-force-password-change-20260929
    paths:
      - 'app.js'
      - 'index.html'
      - 'tests/frontend_t12_force_password_change_a60.test.mjs'
      - '.github/workflows/trendos-t12-a60-force-password-change-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check app.js
      - name: Forced first-login password change contract
        run: node tests/frontend_t12_force_password_change_a60.test.mjs
      - name: Boundary
        run: |
          echo 'EMPLOYEE_TEMP_PASSWORD_RESET=0000'
          echo 'EMPLOYEE_MUST_CHANGE_FIRST_LOGIN=YES'
          echo 'EMPLOYEE_OLD_SESSIONS_REVOKED=YES'
          echo 'PRODUCTION_MUTATION=NO'
