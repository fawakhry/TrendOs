name: EasyStore A2.11 Waste Guard Readonly Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-a211-waste-guard-readonly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge current shared base without accounting overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fawakhry"
          git config user.email "87904105+fawakhry@users.noreply.github.com"
          git fetch origin candidate/t12-full-cloud-cutover-a56-20260929
          BASE="$(git merge-base HEAD FETCH_HEAD)"
          git diff --name-only "$BASE" FETCH_HEAD > /tmp/shared
          git diff --name-only "$BASE" HEAD > /tmp/accounting
          python3 <<'PY'
          from pathlib import Path
          shared=set(Path('/tmp/shared').read_text().splitlines())
          accounting=set(Path('/tmp/accounting').read_text().splitlines())
          allowed={
            '.github/workflows/easystore-a211-waste-guard-readonly-deploy.yml',
            '.github/workflows/easystore-a2-sync-shared-base.yml'
          }
          risky=sorted((shared & accounting)-allowed)
          if risky:
              raise SystemExit('shared/accounting overlap: '+','.join(risky))
          print('A211_DEPLOY_SHARED_OVERLAP=NONE')
          PY
          git merge --no-edit FETCH_HEAD

      - name: Qualify A2.11 Waste guard source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/easystore_a2_write_canary_policy_v1.test.mjs
          node tests/easystore_a211_waste_canary.test.mjs
          echo A211_DEPLOY_SOURCE_TESTS=PASS

      - run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Snapshot closed four-canary Production baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json > /tmp/predep.json
          curl -fsS "$API_URL/v1/employee/accounting/health?a211deploypre=$GITHUB_RUN_ID" > /tmp/h-pre.json
          curl -fsSL "$EASYSTORE_URL/config.js?a211deploypre=$GITHUB_RUN_ID" > /tmp/cfg.js
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1 WHERE active=1) AS activeMaterials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1 WHERE active=1) AS activeTemplates;
          " > /tmp/counts-pre.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/predep.json','utf8'));
          const ds=(Array.isArray(d)?d:d.items||[]).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(ds[0]?.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1)throw Error('single active version required');
          fs.writeFileSync('/tmp/pre-version',full[0].id);
          const h=JSON.parse(fs.readFileSync('/tmp/h-pre.json','utf8')),cfg=fs.readFileSync('/tmp/cfg.js','utf8');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw Error('accounting not closed');
          if(Number(h.writeCanaryAllowedUserCount||0)||Number(h.writeCanaryAllowedActionCount||0)||Number(h.writeCanaryMaxCommands||0)||Number(h.writeCanaryCommandsStarted||0))throw Error('server canary not cleared');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('google calls');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg)||!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\[\]/.test(cfg))throw Error('frontend not closed');
          fs.writeFileSync('/tmp/pre-epoch',String(Number(h.policyEpoch||0)));
          const x=JSON.parse(fs.readFileSync('/tmp/counts-pre.json','utf8')),rows=[];
          const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(v.materials!==undefined)rows.push(v);Object.values(v).forEach(w)}};w(x);
          if(rows.length!==1)throw Error('count parse');const r=rows[0];
          const exp={materials:1,templates:1,parties:1,partyBalances:1,requestLedger:4,events:4,waste:0,stockMoves:0,partyLedger:0,cashbox:0,purchases:0,dailyPurchases:0,deptLines:0,finalInvoices:0,custodyEvents:0,custodyCloses:0,dayCloses:0,activeMaterials:0,activeTemplates:0};
          for(const [k,v] of Object.entries(exp))if(Number(r[k]||0)!==v)throw Error('baseline '+k+'='+r[k]);
          console.log('A211_DEPLOY_PRE=READONLY_FOUR_CANARY_ZERO_WASTE_BASELINE');
          NODE

      - name: Build keep-vars deploy config
        shell: python
        run: |
          from pathlib import Path
          src=Path('cloudflare-d1/wrangler.toml'); dst=Path('cloudflare-d1/.wrangler.a211.toml')
          out=[]; inv=False; inserted=False
          for line in src.read_text().splitlines():
              s=line.strip()
              if s=='[vars]': inv=True; continue
              if inv and s.startswith('['): inv=False
              if inv: continue
              out.append(line)
              if s=='workers_dev = true': out.append('keep_vars = true'); inserted=True
          if not inserted: raise SystemExit('workers_dev anchor missing')
          dst.write_text('\n'.join(out)+'\n')

      - name: Deploy code only and rollback on any postflight drift
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-version)"; CONFIG=cloudflare-d1/.wrangler.a211.toml; DEPLOYED=0
          rollback(){ rc=$?; trap - ERR; if [ "$DEPLOYED" = "1" ]; then npx wrangler rollback "$PRE" --message "A2.11 Waste guard automatic rollback" --config "$CONFIG" || true; fi; exit "$rc"; }
          trap rollback ERR
          npx wrangler deploy --config "$CONFIG" >/tmp/deploy.log
          DEPLOYED=1
          sleep 3
          curl -fsS "$API_URL/v1/employee/accounting/health?a211deploypost=$GITHUB_RUN_ID" > /tmp/h-post.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1 WHERE active=1) AS activeMaterials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1 WHERE active=1) AS activeTemplates;
          " > /tmp/counts-post.json
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync('/tmp/h-post.json','utf8'));
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false||Number(h.policyEpoch||0)!==Number(fs.readFileSync('/tmp/pre-epoch','utf8')))throw Error('post authority drift');
          if(Number(h.writeCanaryAllowedUserCount||0)||Number(h.writeCanaryAllowedActionCount||0)||Number(h.writeCanaryMaxCommands||0)||Number(h.writeCanaryCommandsStarted||0))throw Error('post canary drift');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('post google calls');
          function row(p){const x=JSON.parse(fs.readFileSync(p,'utf8')),a=[];const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(v.materials!==undefined)a.push(v);Object.values(v).forEach(w)}};w(x);if(a.length!==1)throw Error('count parse');return Object.fromEntries(Object.entries(a[0]).map(([k,v])=>[k,Number(v||0)]));}
          const pre=row('/tmp/counts-pre.json'),post=row('/tmp/counts-post.json');
          if(JSON.stringify(pre)!==JSON.stringify(post))throw Error('row drift');
          console.log('A211_DEPLOY_POST=READONLY');
          console.log('A211_DEPLOY_ROW_COUNTS_INVARIANT=PASS');
          console.log('A211_DEPLOY_WASTE_GUARD_LIVE=YES');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO');
          console.log('GENERAL_OPENED=NO');
          NODE
          trap - ERR
