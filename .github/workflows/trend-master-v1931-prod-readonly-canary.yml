name: Trend Master V1931 Production Read-Only Canary

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trend-master-v1931-prod-readonly-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - name: Validate canary credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"

      - name: Probe safe bounded Trend Master core panels
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const url = process.env.APPS_SCRIPT_URL;
          const username = String(process.env.QUALIFY_USERNAME || '').trim();
          const token = String(process.env.QUALIFY_EMPLOYEE_TOKEN || '').trim();
          const panels = ['summary','archive','employee','stock','messages','debt'];
          const timeouts = {summary:30000,archive:60000,employee:30000,stock:30000,messages:30000,debt:30000};
          const maxConcurrency = 2;
          let active = 0;
          let maxActive = 0;
          const waiters = [];

          async function acquire() {
            if (active < maxConcurrency) { active++; maxActive = Math.max(maxActive, active); return; }
            await new Promise(resolve => waiters.push(resolve));
            active++; maxActive = Math.max(maxActive, active);
          }
          function release() {
            active = Math.max(0, active - 1);
            const next = waiters.shift();
            if (next) next();
          }
          async function probe(panel) {
            await acquire();
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeouts[panel]);
            const started = Date.now();
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: {accept:'application/json','content-type':'text/plain;charset=utf-8'},
                body: JSON.stringify({action:'getTrendMasterPanelV1931', panel, username, token, archivePage:1, archiveQuery:''}),
                cache: 'no-store',
                signal: controller.signal
              });
              const raw = await response.text();
              let body = {};
              try { body = JSON.parse(raw || '{}'); } catch { body = {success:false,message:'invalid-json'}; }
              return {
                panel,
                elapsedMs: Date.now() - started,
                httpStatus: response.status,
                success: body.success === true,
                version: String(body.version || '').slice(0,80),
                message: String(body.message || body.error || '').slice(0,160)
              };
            } catch (error) {
              return {panel, elapsedMs:Date.now()-started, httpStatus:0, success:false, version:'', message:error && error.name === 'AbortError' ? 'timeout' : String(error && error.message || error).slice(0,160)};
            } finally {
              clearTimeout(timer);
              release();
            }
          }

          (async () => {
            const results = await Promise.all(panels.map(probe));
            console.log('TREND_MASTER_SAFE_BOUNDED=' + JSON.stringify({maxActive,results}));
            assert.equal(maxActive, 2, 'Unexpected concurrency cap');
            assert.ok(results.every(x => x.httpStatus === 200 && x.success), 'A core panel failed under safe bounded loading');
            assert.ok(results.every(x => x.version === 'V1931_TREND_MASTER_PANEL_READ_V1'), 'Unexpected backend version');
            assert.equal(results.some(x => x.panel === 'dayclose'), false, 'Day-close must not be auto-probed');
            console.log('TREND_MASTER_SAFE_BOUNDED_CANARY_PASS');
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE
