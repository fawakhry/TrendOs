name: Trend Master V1931 Production Read-Only Canary

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trend-master-v1931-prod-readonly-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - name: Validate canary credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"

      - name: Probe all Trend Master panels sequentially and concurrently
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const url = process.env.APPS_SCRIPT_URL;
          const username = String(process.env.QUALIFY_USERNAME || '').trim();
          const token = String(process.env.QUALIFY_EMPLOYEE_TOKEN || '').trim();
          const panels = ['summary','archive','messages','stock','employee','debt','dayclose'];

          async function probe(panel, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const started = Date.now();
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: {accept:'application/json','content-type':'text/plain;charset=utf-8'},
                body: JSON.stringify({action:'getTrendMasterPanelV1931', panel, username, token, archivePage:1, archiveQuery:''}),
                cache: 'no-store',
                signal: controller.signal
              });
              const raw = await response.text();
              let body = {};
              try { body = JSON.parse(raw || '{}'); } catch { body = {success:false,message:'invalid-json'}; }
              return {
                panel,
                elapsedMs: Date.now() - started,
                httpStatus: response.status,
                success: body.success === true,
                version: String(body.version || '').slice(0,80),
                message: String(body.message || body.error || '').slice(0,160),
                shape: {
                  system: !!body.system,
                  archive: !!body.archive,
                  messageQueue: Array.isArray(body.messageQueue),
                  stockAlerts: Array.isArray(body.stockAlerts),
                  employeePerformance: Array.isArray(body.employeePerformance),
                  debtControl: !!body.debtControl,
                  dayClose: body.dayClose !== undefined
                }
              };
            } catch (error) {
              return {panel, elapsedMs: Date.now()-started, httpStatus:0, success:false, version:'', message:error && error.name === 'AbortError' ? 'timeout' : String(error && error.message || error).slice(0,160), shape:{}};
            } finally {
              clearTimeout(timer);
            }
          }

          (async () => {
            const sequential = [];
            for (const panel of panels) sequential.push(await probe(panel, 60000));
            console.log('TREND_MASTER_SEQ=' + JSON.stringify(sequential));

            const concurrent = await Promise.all(panels.map(panel => probe(panel, 25000)));
            console.log('TREND_MASTER_CONCURRENT=' + JSON.stringify(concurrent));

            assert.ok(sequential.every(x => x.httpStatus === 200 && x.success), 'At least one panel fails even sequentially');
            assert.ok(sequential.every(x => x.version === 'V1931_TREND_MASTER_PANEL_READ_V1'), 'Unexpected backend version');
            console.log('TREND_MASTER_ALL_PANELS_SEQUENTIAL_PASS');
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE
