name: TrendOS Book28 PREPARED Read-Only Reconciliation — Fake D1
on:
  push:
    branches:
      - fix/book28-legacy-prepared-readonly-audit-20261016
    paths:
      - 'cloudflare-d1/src/employee-core-native-v1.mjs'
      - 'cloudflare-d1/src/employee-core-prepared-audit-v1.mjs'
      - 'tests/book28_legacy_prepared_readonly_audit.test.mjs'
      - '.github/workflows/trendos-book28-prepared-readonly-audit-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-d1/src/employee-core-native-v1.mjs'
      - 'cloudflare-d1/src/employee-core-prepared-audit-v1.mjs'
      - 'tests/book28_legacy_prepared_readonly_audit.test.mjs'
      - '.github/workflows/trendos-book28-prepared-readonly-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepared-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax
        run: |
          node --check cloudflare-d1/src/employee-core-prepared-audit-v1.mjs
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book28_legacy_prepared_readonly_audit.test.mjs
      - name: PREPARED audit privileges, data minimization and no mutations — synthetic
        run: node --test tests/book28_legacy_prepared_readonly_audit.test.mjs
      - name: Core recovery, scope and manager authentication regressions
        run: |
          node --test tests/book28_bulk_500_result_truth_synthetic.test.mjs
          node --test tests/book28_core_line_write_scope_synthetic.test.mjs
          node --test tests/book25_26_p0_auth_synthetic.test.mjs
          node tests/entry644_employee_core_general_dispatch.test.mjs
          node tests/entry650_employee_core_order_page_read.test.mjs
      - name: Repository SQL statement allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('cloudflare-d1/src/employee-core-prepared-audit-v1.mjs').read_text()
          assert s.count('env.DB.prepare(')==2, 'ONLY count and paged data queries allowed'
          assert 'async function readCorePreparedRequestsV1' in s
          assert '.run(' not in s and '.batch(' not in s
          assert "status='PREPARED'" in s
          assert 'canonical_json' not in s and 'response_json' not in s
          assert 'actor' not in s.lower().split('export async function',1)[-1]
          print('READONLY_SQL_STATIC_ALLOWLIST=PASS')
          PY
      - name: Prohibit runtime operations
        run: |
          echo 'REAL_D1=NO'
          echo 'LEDGER_CLEANUP=NO'
          echo 'REPLAY=NO'
          echo 'REAL_GOOGLE=NO'
          echo 'DEPLOY=NO'
          echo 'MERGE=NO'
          echo 'PRODUCTION_VERIFIED=NO'
