name: Autonomous Printshop Structured Owner Design Approval

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Existing Design artifact ID
        required: true
        type: string
      line_id:
        description: Exact line ID bound to the artifact
        required: true
        type: string
      decision:
        description: Structured owner decision
        required: true
        type: choice
        options: [APPROVE, REJECT]
      subject_sha256:
        description: Exact SHA-256 of artifact bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-structured-owner-design-approval
  cancel-in-progress: false

jobs:
  structured-owner-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      LINE_ID: ${{ inputs.line_id }}
      DECISION: ${{ inputs.decision }}
      SUBJECT_SHA256: ${{ inputs.subject_sha256 }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Owner-only gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTOR}" != "${GITHUB_REPOSITORY_OWNER}" ]; then
            echo "STRUCTURED_OWNER_APPROVAL=FORBIDDEN_NON_OWNER"
            exit 1
          fi
          echo "STRUCTURED_OWNER_APPROVAL_OWNER_GATE=PASS"

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pre.sql <<'SQL'
          SELECT
            (SELECT mode FROM autonomous_design_control WHERE singleton_id=1) AS designMode,
            (SELECT mode FROM autonomous_readiness_control WHERE singleton_id=1) AS readinessMode,
            (SELECT mode FROM autonomy_control WHERE singleton_id=1) AS autonomyMode,
            (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
            (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          SQL
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "${DB_NAME}" --remote --config "${CONFIG}" --json --file /tmp/pre.sql > /tmp/pre.json
          node <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'))?.[0]?.results?.[0]||{};
          if(String(r.designMode)!=='SHADOW') throw new Error('DESIGN_NOT_SHADOW');
          if(String(r.readinessMode)!=='SHADOW') throw new Error('READINESS_NOT_SHADOW');
          if(String(r.autonomyMode)!=='SHADOW') throw new Error('AUTONOMY_NOT_SHADOW');
          if(String(r.operatorTaskMode)!=='OFF'||Number(r.operatorTasks||0)!==0) throw new Error('OPERATOR_TASK_NOT_OFF');
          console.log('STRUCTURED_OWNER_APPROVAL_PREFLIGHT=PASS');
          NODE

      - name: Build deterministic structured approval SQL
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { buildStructuredOwnerDesignApprovalSqlV1 } from './autonomous-printshop/core/structured-owner-design-approval-command-v1.mjs';

          const observedAtMs=Date.now();
          const receiptId='design-approval-receipt-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT;
          const approvalEventId='design-approval-event-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT;
          const sourceRef='github:'+process.env.GITHUB_REPOSITORY+':'+process.env.GITHUB_RUN_ID+':'+process.env.GITHUB_RUN_ATTEMPT;
          const canonical=JSON.stringify({
            receiptId,
            artifactId:process.env.ARTIFACT_ID,
            lineId:process.env.LINE_ID,
            decision:process.env.DECISION,
            subjectSha256:String(process.env.SUBJECT_SHA256||'').toLowerCase(),
            sourceRef,
            observedAtMs
          });
          const receiptSha256=crypto.createHash('sha256').update(canonical).digest('hex');

          const sql=buildStructuredOwnerDesignApprovalSqlV1({
            receiptId,approvalEventId,
            artifactId:process.env.ARTIFACT_ID,
            lineId:process.env.LINE_ID,
            decision:process.env.DECISION,
            sourceRef,
            sourceVersion:'github-run-'+process.env.GITHUB_RUN_ID,
            subjectSha256:process.env.SUBJECT_SHA256,
            receiptSha256,
            observedAtMs,
            evidence:{structuredOwnerAction:true}
          });
          const q=v=>"'"+String(v||'').replace(/'/g,"''")+"'";
          const verify=[
            'SELECT',
            ' (SELECT COUNT(*) FROM autonomous_design_approval_receipts WHERE receipt_id='+q(receiptId)+') AS receiptExact,',
            ' (SELECT COUNT(*) FROM autonomous_design_approval_events WHERE approval_event_id='+q(approvalEventId)+') AS approvalExact,',
            ' (SELECT COUNT(*) FROM autonomous_design_preflight_runs WHERE artifact_id='+q(process.env.ARTIFACT_ID)+') AS preflightRowsForArtifact,',
            " (SELECT COUNT(*) FROM autonomous_readiness_evidence WHERE evidence_kind='DESIGN' AND json_extract(evidence_json,'$.artifactId')="+q(process.env.ARTIFACT_ID)+") AS readinessRowsForArtifact,",
            ' (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,',
            ' (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;'
          ].join('\\n');

          fs.writeFileSync('/tmp/approval.sql',sql+'\\n');
          fs.writeFileSync('/tmp/verify.sql',verify+'\\n');
          console.log('STRUCTURED_OWNER_APPROVAL_SQL_VALIDATED=PASS');
          NODE

      - name: Write receipt and approval event only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "${DB_NAME}" --remote --config "${CONFIG}" --file /tmp/approval.sql

      - name: Verify exact write boundary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "${DB_NAME}" --remote --config "${CONFIG}" --json --file /tmp/verify.sql > /tmp/verify.json
          node <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/verify.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.receiptExact)!==1) throw new Error('RECEIPT_NOT_WRITTEN');
          if(Number(r.approvalExact)!==1) throw new Error('APPROVAL_EVENT_NOT_WRITTEN');
          if(Number(r.preflightRowsForArtifact)!==0) throw new Error('PREFLIGHT_WRITE_FORBIDDEN');
          if(Number(r.readinessRowsForArtifact)!==0) throw new Error('READINESS_WRITE_FORBIDDEN');
          if(String(r.operatorTaskMode)!=='OFF'||Number(r.operatorTasks||0)!==0) throw new Error('OPERATOR_TASK_DRIFT');
          console.log('STRUCTURED_OWNER_APPROVAL_WRITE_BOUNDARY=PASS');
          NODE

      - name: Safety conclusion
        run: |
          echo 'DESIGN_APPROVAL_RECEIPT_WRITE=YES'
          echo 'DESIGN_APPROVAL_EVENT_WRITE=YES'
          echo 'DESIGN_PREFLIGHT_WRITE=NO'
          echo 'DESIGN_READY_EVIDENCE_WRITE=NO'
          echo 'ACCOUNTING_WRITE=NO'
          echo 'ORDER_LINE_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
          echo 'OPERATOR_TASK_CONTROL=OFF'
