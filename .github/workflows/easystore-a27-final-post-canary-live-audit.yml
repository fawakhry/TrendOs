name: EasyStore A2.7 Final Post-canary Live Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a27-final-post-canary-live-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Verify final closed Production state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$EASYSTORE_URL/config.js?a27final=$GITHUB_RUN_ID" > /tmp/config.js
          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27final=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT template_id,department,category,item_name,fixed_cost,computed_cost,suggested_sale_price,active,updated_by
              FROM employee_accounting_templates_v1;
            SELECT request_key,operation,actor,status,entity_id
              FROM employee_accounting_request_ledger_v1;
            SELECT entity_type,entity_id,event_type,actor,request_key
              FROM employee_accounting_events_v1;
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events;
          " > /tmp/state.json
          node <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('/tmp/config.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/state.json','utf8')), groups=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Array.isArray(v.results))groups.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}};walk(x);
          const all=groups.flat();
          const t=all.filter(r=>r.template_id), q=all.filter(r=>r.request_key&&r.operation), e=all.filter(r=>r.entity_type), c=all.find(r=>r.templates!==undefined)||{};
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg))throw new Error('live frontend write mode not OFF');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\[\]/.test(cfg))throw new Error('live frontend canary actions not empty');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*false/.test(cfg))throw new Error('legacy D1 write flag drift');
          if(!/EASYSTORE_ACCOUNTING_D1_READONLY\s*=\s*true/.test(cfg))throw new Error('readonly reads unexpectedly disabled');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw new Error('backend not READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0)throw new Error('server allowlists not empty');
          if(Number(h.writeCanaryMaxCommands||0)!==0||Number(h.writeCanaryCommandsStarted||0)!==0)throw new Error('server command budget not cleared');
          if(t.length!==1||q.length!==1||e.length!==1)throw new Error('evidence multiplicity drift');
          const T=t[0],Q=q[0],E=e[0];
          if(T.template_id!=='TPL-69C7D9A49828'||Number(T.active)!==0||Number(T.fixed_cost)!==0||Number(T.computed_cost)!==0||Number(T.suggested_sale_price)!==0||T.updated_by!=='ضياء')throw new Error('template evidence drift');
          if(Q.request_key!=='A27-TPL-muwyw80u-1fuz9v20'||Q.operation!=='template-upsert'||Q.actor!=='ضياء'||Q.status!=='COMMITTED')throw new Error('request evidence drift');
          if(E.entity_type!=='template'||E.entity_id!==T.template_id||E.event_type!=='create'||E.actor!=='ضياء'||E.request_key!==Q.request_key)throw new Error('event evidence drift');
          const expected={materials:0,templates:1,deptLines:0,finalInvoices:0,partyLedger:0,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:0,requestLedger:1,events:1};
          for(const [k,v] of Object.entries(expected))if(Number(c[k]||0)!==v)throw new Error('final count drift '+k+'='+c[k]);
          console.log('A27_FINAL_FRONTEND_WRITE_MODE=OFF');
          console.log('A27_FINAL_FRONTEND_CANARY_ACTIONS=EMPTY');
          console.log('A27_FINAL_BACKEND_MODE=READONLY');
          console.log('A27_FINAL_SERVER_CANARY=CLEARED');
          console.log('A27_FINAL_EVIDENCE_ROWS=templates:1,requestLedger:1,events:1,all_other_accounting:0');
          console.log('A27_FINAL_TEST_TEMPLATE=INACTIVE_ZERO_VALUE');
          console.log('GENERAL_OPENED=NO');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO_NEW_MUTATION');
          NODE
