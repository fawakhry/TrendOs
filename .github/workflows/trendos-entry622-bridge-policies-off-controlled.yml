name: TrendOS Entry622 Bridge Policies OFF Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry622-bridge-policies-off-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry622-bridge-policies-off-controlled
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      UI_URL: https://trendos-ui.trendmall-contact.workers.dev
      API_WORKER: trendos-d1-api
      UI_WORKER: trendos-ui
      CONFIG: cloudflare-d1/wrangler.toml
      EXPECTED_API_VERSION: de2c825d-ef63-407d-90dc-8059a9d4f192
      EXPECTED_UI_VERSION: bfcc6f85-a748-4b66-a334-b605c72108f7
      POLICY_MANIFEST: docs/trendos/staging/ENTRY622_TRENDOS_BRIDGE_READONLY_POLICIES.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Qualify exact policy manifest
        shell: bash
        run: |
          set -euo pipefail
          node tests/entry622_trendos_bridge_readonly_policies.test.mjs
          POLICIES="$(node -e "const x=require('./$POLICY_MANIFEST');process.stdout.write(x.policies.join(','))")"
          test "$(printf '%s' "$POLICIES" | tr ',' '\n' | sed '/^$/d' | wc -l | tr -d ' ')" = "17"
          case ",$POLICIES," in
            *,getAccounting,*|*,getDeptInvoiceDraftV1887,*|*,getPartyAccountV1858,*) exit 20 ;;
          esac
          printf '%s' "$POLICIES" > /tmp/policies.txt
          echo ENTRY622_MANIFEST_QUALIFICATION=PASS

      - name: Exact Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          npx wrangler deployments list --name "$API_WORKER" --json > /tmp/api-deployments.json
          npx wrangler deployments list --name "$UI_WORKER" --json > /tmp/ui-deployments.json

          node <<'NODE'
          const fs=require('fs');
          function active(path,label,expected){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
            if(full.length!==1||full[0].id!==expected) throw new Error(label+' version drift '+JSON.stringify(full));
            console.log('ENTRY622_PRE_'+label+'_VERSION='+full[0].id);
          }
          active('/tmp/api-deployments.json','API',process.env.EXPECTED_API_VERSION);
          active('/tmp/ui-deployments.json','UI',process.env.EXPECTED_UI_VERSION);
          NODE

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry622pre=$GITHUB_SHA" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync('/tmp/'+f+'-pre.json','utf8'));
          const au=r('auth'),b=r('legacy-action'),op=r('ops'),ac=r('accounting');
          if(au.mode!=='OFF'||au.envEnabled!==false||Number(au.userCount||0)!==0) throw new Error('auth preflight');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge preflight');
          if(op.mode!=='GENERAL'||Number(op.policyEpoch||0)!==7) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||Number(ac.policyEpoch||0)!==2) throw new Error('accounting drift');
          for(const f of ['content','comms','core']) if(r(f).mode!=='OFF') throw new Error(f+' drift');
          console.log('ENTRY622_PRECONTROL=PASS');
          NODE

      - name: Install TrendOS-only read-only bridge policies while bridge remains OFF
        id: policy
        shell: bash
        run: |
          set -eEuo pipefail
          POLICIES="$(cat /tmp/policies.txt)"
          printf '%s' "$POLICIES" | npx wrangler secret put EMPLOYEE_LEGACY_BRIDGE_ACTIONS --config "$CONFIG"
          echo ENTRY622_POLICY_BINDING_INSTALLED=YES

      - name: Postflight and fail-closed proof
        shell: bash
        run: |
          set -euo pipefail
          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry622post=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync('/tmp/'+f+'-post.json','utf8'));
          const au=r('auth'),b=r('legacy-action'),op=r('ops'),ac=r('accounting');
          if(au.mode!=='OFF'||au.envEnabled!==false||Number(au.userCount||0)!==0) throw new Error('auth changed');
          if(b.enabled!==false) throw new Error('bridge enabled unexpectedly');
          if(b.secretConfigured!==false) throw new Error('shared secret unexpectedly configured');
          if(Number(b.allowedPolicyCount||0)!==17) throw new Error('policy count '+b.allowedPolicyCount);
          if(b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false) throw new Error('bridge invariant drift');
          if(op.mode!=='GENERAL'||Number(op.policyEpoch||0)!==7) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||Number(ac.policyEpoch||0)!==2) throw new Error('accounting drift');
          for(const f of ['content','comms','core']) if(r(f).mode!=='OFF') throw new Error(f+' drift');
          console.log('ENTRY622_POLICY_COUNT=17');
          console.log('ENTRY622_BRIDGE_ENABLED=NO');
          console.log('ENTRY622_SHARED_SECRET_CONFIGURED=NO');
          console.log('ENTRY622_AUTH=OFF');
          console.log('ENTRY622_ACCOUNTING=READONLY_UNTOUCHED');
          console.log('ENTRY622_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name "$API_WORKER" --json > /tmp/api-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/api-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('api active version');
          console.log('ENTRY622_POST_API_VERSION='+full[0].id);
          NODE

      - name: Roll back policy binding on failure after install
        if: ${{ failure() && steps.policy.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          yes | npx wrangler secret delete EMPLOYEE_LEGACY_BRIDGE_ACTIONS --config "$CONFIG"
          curl --silent --show-error "$API_URL/v1/employee/legacy-action/health?entry622rollback=$GITHUB_SHA" -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json'); if(x.enabled!==false||Number(x.allowedPolicyCount||0)!==0) process.exit(1);"
          echo ENTRY622_POLICY_ROLLBACK=PASS

      - name: Boundary
        shell: bash
        run: |
          echo ENTRY622_API_CODE_DEPLOY=NO
          echo ENTRY622_D1_MUTATION=NO
          echo ENTRY622_FRONTEND_DEPLOY=NO
          echo ENTRY622_APPS_SCRIPT_TOUCHED=NO
          echo ENTRY622_AUTH_MODE_CHANGED=NO
          echo ENTRY622_BRIDGE_ENABLED=NO
          echo ENTRY622_ACCOUNTING_TOUCHED=NO
