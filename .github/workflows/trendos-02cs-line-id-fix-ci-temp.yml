name: TrendOS 02CS Line ID Fix CI TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-line-id-fix-ci-temp.yml'

permissions:
  contents: read

jobs:
  line-id-fix-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify semantic Line ID patch exists
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Fq "rawFormattedLine[5] = '3899-01-01T08:00:00.000Z'" tests/cloudflare_edge_orders_read_v1.test.mjs
          grep -Fq "assert.equal(semanticMapped[0].lineId, '730122')" tests/cloudflare_edge_orders_read_v1.test.mjs
          echo 'PERF_CF_02CS_LINE_ID_PATCH_PRESENT'
      - name: Existing Edge Orders contract plus Line ID regression
        run: node tests/cloudflare_edge_orders_read_v1.test.mjs
      - name: 02CR duplicate-header regression
        run: node tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs
      - name: 02CR operational enrichment contract
        run: node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
      - name: 02CR operational canary contract
        run: node tests/cloudflare_edge_orders_02cr_canary.test.mjs
      - name: 02CR Worker route contract
        run: node tests/cloudflare_index_v2_02cr_route.test.mjs
      - name: 02CO wrapper safety contract
        run: node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
      - name: Safety conclusion
        run: echo 'PERF_CF_02CS_LINE_ID_FIX_CI_PASS_NO_PRODUCTION_MUTATION'
