name: EasyStore A2 Purchase Reversal CI

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - 'cloudflare-d1/src/employee-accounting-native-v1.mjs'
      - 'tests/easystore_a2_purchase_reversal_v1.test.mjs'
      - '.github/workflows/easystore-a2-purchase-reversal-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate A2 approved purchase reversal
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/easystore_a2_purchase_invoice_v1.test.mjs
          node tests/easystore_a2_purchase_reversal_v1.test.mjs
          echo EASYSTORE_A2_PURCHASE_REVERSAL_CI=PASS
          echo PRODUCTION_MUTATION=NO
