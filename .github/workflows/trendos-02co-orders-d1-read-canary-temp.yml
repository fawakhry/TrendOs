name: TrendOS 02CO Orders D1 Read Canary TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02co-orders-d1-read-canary-temp.yml'
      - 'cloudflare-d1/src/edge-orders-read-v1.mjs'
      - 'cloudflare-d1/production-shadow/index.js'
      - 'cloudflare-d1/wrangler.toml'
      - 'config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-02co-orders-d1-read-canary-temp
  cancel-in-progress: false

jobs:
  controlled-orders-read-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRENDOS_PROD_QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      EDGE_BASE: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4

      - name: Static 02CO safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false' config.js
          grep -Eq 'trendos-edge-orders-read-v1.js\?v=20260904a' config.js
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/trendos-02co-orders-d1-read-canary-temp.yml').read_text(encoding='utf-8')
          source = Path('cloudflare-d1/src/edge-orders-read-v1.mjs').read_text(encoding='utf-8')
          forbidden = ['secret'+' put', 'wrangler d1 migrations'+' apply', 'd1 execute --'+'file', '/v1/qualification/cloud-write/reconcile/'+'order', 'TRENDOS_PRODUCTION_'+'CUTOVER', 'AUTHORITY_'+'CUTOVER', 'generic outbox'+' drain']
          for token in forbidden:
              if token in workflow or token in source:
                  raise SystemExit(f'Forbidden token found in 02CO checked files: {token}')
          sql_forbidden = ['INSERT ', 'UPDATE ', 'DELETE ', 'DROP ', 'ALTER ', 'CREATE TABLE', 'PRAGMA ', 'REPLACE ']
          upper_source = source.upper()
          for token in sql_forbidden:
              if token in upper_source:
                  raise SystemExit(f'Forbidden SQL write token in orders read source: {token}')
          if workflow.count('wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml') != 1:
              raise SystemExit('Expected exactly one controlled Worker deploy command')
          print('PERF_CF_02CO_STATIC_SAFETY_BOUNDARY_PASS')
          PY

      - name: Required secrets presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TRENDOS_PROD_QUALIFY_USERNAME"
          test -n "$TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN"
          echo 'PERF_CF_02CO_REQUIRED_SECRETS_PRESENT'

      - name: Pre-deploy production boundary probes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const edgeBase = process.env.EDGE_BASE;
          async function jsonProbe(label, url, expectStatus = 200) {
            const started = Date.now();
            const res = await fetch(url, { headers: { accept: 'application/json' }, cache: 'no-store' });
            const text = await res.text();
            let body = {};
            try { body = JSON.parse(text || '{}'); } catch (err) { throw new Error(`${label} invalid JSON: ${text.slice(0, 120)}`); }
            const ms = Date.now() - started;
            if (res.status !== expectStatus) throw new Error(`${label} expected HTTP ${expectStatus}, got ${res.status}`);
            return { label, status: res.status, ms, body };
          }
          const health = await jsonProbe('worker-health', `${edgeBase}/health`);
          if (health.body.success !== true || health.body.database !== true) throw new Error('Worker health failed');
          const cloudWrite = await jsonProbe('cloud-write-health', `${edgeBase}/v1/cloud/write/health`);
          if (cloudWrite.body.success !== true || cloudWrite.body.enabled !== true || cloudWrite.body.writesAccepted !== true) throw new Error('Cloud Write health boundary failed');
          if (cloudWrite.body.cutover !== false || cloudWrite.body.sheetsAuthoritative !== true) throw new Error('Cloud Write authority boundary changed');
          const reconcile = await jsonProbe('02cl-reconcile-health', `${edgeBase}/v1/qualification/cloud-write/reconcile/health`);
          if (reconcile.body.enabled !== false || reconcile.body.genericDrainEnabled !== false) throw new Error('02CL reconcile boundary changed');
          console.log('PERF_CF_02CO_PRE_DEPLOY_BOUNDARY=' + JSON.stringify({ workerMs: health.ms, cloudWriteMs: cloudWrite.ms, pendingOutbox: cloudWrite.body.pendingOutbox, reconcileEnabled: reconcile.body.enabled, cutover: cloudWrite.body.cutover, sheetsAuthoritative: cloudWrite.body.sheetsAuthoritative }));
          NODE

      - name: Controlled Worker deploy for 02CN dashboard builder
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml
          echo 'PERF_CF_02CO_WORKER_DEPLOY_DONE'

      - name: Authenticated D1 read canary comparison
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const edgeBase = process.env.EDGE_BASE;
          const appsScriptUrl = process.env.APPS_SCRIPT_URL;
          const username = process.env.TRENDOS_PROD_QUALIFY_USERNAME;
          const token = process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN;
          function compactRow(row) {
            return [row && row.orderId || '', row && row.lineId || '', row && row.status || '', row && row.customer || ''].map(v => String(v || '').trim()).join('|');
          }
          function assert(cond, msg) { if (!cond) throw new Error(msg); }
          async function readJson(label, url, options = {}) {
            const started = Date.now();
            const res = await fetch(url, { cache: 'no-store', ...options });
            const raw = await res.text();
            let body = {};
            try { body = JSON.parse(raw || '{}'); } catch (err) { throw new Error(`${label} invalid JSON: ${raw.slice(0, 160)}`); }
            return { label, status: res.status, ms: Date.now() - started, body };
          }
          const postDeployHealth = await readJson('post-deploy-cloud-write', `${edgeBase}/v1/cloud/write/health`, { headers: { accept: 'application/json' } });
          assert(postDeployHealth.status === 200 && postDeployHealth.body.success === true, 'post-deploy cloud-write health failed');
          assert(postDeployHealth.body.cutover === false && postDeployHealth.body.sheetsAuthoritative === true, 'authority boundary changed after deploy');
          assert(Number(postDeployHealth.body.pendingOutbox || 0) === 0, 'pending outbox is not zero after deploy');

          const session = await readJson('edge-session', `${edgeBase}/v1/edge/orders/session`, {
            method: 'POST',
            headers: { accept: 'application/json', 'content-type': 'application/json' },
            body: JSON.stringify({ username, token })
          });
          assert(session.status === 200 && session.body.success === true && session.body.edgeToken, `edge session failed http=${session.status}`);
          const screens = Array.isArray(session.body.user && session.body.user.screens) ? session.body.user.screens : [];
          const usableScreens = ['service', 'print', 'laser', 'press'].filter(s => screens.includes(s));
          assert(usableScreens.length > 0, 'No usable screens returned by edge session');
          const selectedScreens = usableScreens.slice(0, Math.min(2, usableScreens.length));
          const comparisons = [];
          const filterCases = ['', '__ACTIVE__'];
          for (const screen of selectedScreens) {
            for (const statusFilter of filterCases) {
              const params = new URLSearchParams({ screen, page: '1', pageSize: '20' });
              if (statusFilter) params.set('statusFilter', statusFilter);
              const edge = await readJson(`edge-${screen}-${statusFilter || 'all'}`, `${edgeBase}/v1/edge/orders/page?${params.toString()}`, { headers: { accept: 'application/json', authorization: `Bearer ${session.body.edgeToken}` } });
              assert(edge.status === 200 && edge.body.success === true, `edge read failed screen=${screen} filter=${statusFilter} http=${edge.status}`);
              assert(edge.body.dataSource === 'd1-edge-orders', `edge datasource missing screen=${screen}`);
              assert(edge.body.dashboard && edge.body.dashboard.dataSource === 'd1-edge-orders', `edge dashboard missing screen=${screen}`);
              const appPayload = { action: 'getRowsPageV1931', username, token, screen, page: '1', pageSize: '20' };
              if (statusFilter) appPayload.statusFilter = statusFilter;
              const app = await readJson(`apps-${screen}-${statusFilter || 'all'}`, appsScriptUrl, {
                method: 'POST',
                headers: { accept: 'application/json', 'content-type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(appPayload)
              });
              assert(app.status === 200 && app.body.success === true, `Apps Script read failed screen=${screen} filter=${statusFilter} http=${app.status} msg=${app.body && app.body.message}`);
              const edgeKeys = (edge.body.rows || []).map(compactRow);
              const appKeys = (app.body.rows || []).map(compactRow);
              assert(JSON.stringify(edgeKeys) === JSON.stringify(appKeys), `row identity mismatch screen=${screen} filter=${statusFilter}`);
              assert(Number(edge.body.pagination && edge.body.pagination.totalRows) === Number(app.body.pagination && app.body.pagination.totalRows), `pagination total mismatch screen=${screen} filter=${statusFilter}`);
              if (!statusFilter) {
                const edgeDash = edge.body.dashboard || {};
                const appDash = app.body.dashboard || {};
                const dashKeys = ['activeLines', 'activeOrders', 'readyForPickup', 'deliveredToday', 'duplicate', 'urgent', 'normal'];
                const dashCompare = {};
                for (const key of dashKeys) dashCompare[key] = [Number(edgeDash[key] || 0), Number(appDash[key] || 0)];
                comparisons.push({ screen, filter: 'all', edgeMs: edge.ms, appsMs: app.ms, totalRows: edge.body.pagination.totalRows, firstRows: edgeKeys.slice(0, 3), dashboard: dashCompare });
              } else {
                comparisons.push({ screen, filter: statusFilter, edgeMs: edge.ms, appsMs: app.ms, totalRows: edge.body.pagination.totalRows, firstRows: edgeKeys.slice(0, 3) });
              }
            }
          }
          const debtParams = new URLSearchParams({ screen: selectedScreens[0], page: '1', pageSize: '20', statusFilter: '__DEBT__' });
          const debt = await readJson('edge-debt-fallback', `${edgeBase}/v1/edge/orders/page?${debtParams.toString()}`, { headers: { accept: 'application/json', authorization: `Bearer ${session.body.edgeToken}` } });
          assert(debt.status === 409 && debt.body.code === 'apps-script-required' && debt.body.fallback === 'apps-script', 'Debt filter did not stay on Apps Script fallback boundary');
          console.log('PERF_CF_02CO_CANARY_COMPARISON=' + JSON.stringify({ screens: selectedScreens, role: session.body.user && session.body.user.role, postDeployPendingOutbox: postDeployHealth.body.pendingOutbox, comparisons, debtFallback: { status: debt.status, code: debt.body.code, fallback: debt.body.fallback } }));
          console.log('PERF_CF_02CO_AUTHENTICATED_D1_READ_CANARY_PASS');
          NODE

      - name: Post-canary safety boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const edgeBase = process.env.EDGE_BASE;
          async function probe(path) {
            const res = await fetch(edgeBase + path, { headers: { accept: 'application/json' }, cache: 'no-store' });
            const body = JSON.parse(await res.text() || '{}');
            return { status: res.status, body };
          }
          const cloudWrite = await probe('/v1/cloud/write/health');
          if (cloudWrite.status !== 200 || cloudWrite.body.success !== true) throw new Error('Cloud Write health failed post-canary');
          if (cloudWrite.body.cutover !== false || cloudWrite.body.sheetsAuthoritative !== true) throw new Error('Authority boundary changed post-canary');
          if (Number(cloudWrite.body.pendingOutbox || 0) !== 0) throw new Error('pending outbox changed post-canary');
          const reconcile = await probe('/v1/qualification/cloud-write/reconcile/health');
          if (reconcile.status !== 200 || reconcile.body.enabled !== false || reconcile.body.genericDrainEnabled !== false) throw new Error('02CL boundary changed post-canary');
          console.log('PERF_CF_02CO_POST_CANARY_BOUNDARY=' + JSON.stringify({ pendingOutbox: cloudWrite.body.pendingOutbox, cutover: cloudWrite.body.cutover, sheetsAuthoritative: cloudWrite.body.sheetsAuthoritative, reconcileEnabled: reconcile.body.enabled, genericDrainEnabled: reconcile.body.genericDrainEnabled }));
          NODE
