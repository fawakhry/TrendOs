name: Autonomous Printshop Machine Evidence Manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: REGISTER_MACHINE | RECORD_OBSERVATION | MAP_LINE
        required: true
        type: choice
        options:
          - REGISTER_MACHINE
          - RECORD_OBSERVATION
          - MAP_LINE
      machine_id:
        description: Stable machine ID
        required: true
        type: string
      display_name:
        description: REGISTER_MACHINE only
        required: false
        type: string
      department:
        description: REGISTER_MACHINE only
        required: false
        type: string
      machine_class:
        description: REGISTER_MACHINE only
        required: false
        type: string
      capabilities_csv:
        description: REGISTER_MACHINE only
        required: false
        type: string
      line_id:
        description: MAP_LINE only; must already exist in TrendOS
        required: false
        type: string
      machine_state:
        description: RECORD_OBSERVATION only
        required: false
        type: choice
        default: UNKNOWN
        options:
          - UNKNOWN
          - READY
          - BLOCKED
          - MAINTENANCE
      source_kind:
        description: Observation source or mapping source
        required: false
        type: string
      source_ref:
        description: Evidence/check reference
        required: false
        type: string
      direct_check:
        description: READY only; must be true with OPERATOR_CHECK or SELF_TEST
        required: false
        type: boolean
        default: false
      ttl_minutes:
        description: Observation TTL; READY max 15, BLOCKED/MAINTENANCE max 480
        required: false
        type: string
        default: "10"
      evidence_note:
        description: Short evidence note; no customer PII
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-machine-evidence-manual
  cancel-in-progress: false

jobs:
  controlled-machine-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      OPERATION: ${{ inputs.operation }}
      MACHINE_ID: ${{ inputs.machine_id }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      DEPARTMENT: ${{ inputs.department }}
      MACHINE_CLASS: ${{ inputs.machine_class }}
      CAPABILITIES_CSV: ${{ inputs.capabilities_csv }}
      LINE_ID: ${{ inputs.line_id }}
      MACHINE_STATE: ${{ inputs.machine_state }}
      SOURCE_KIND: ${{ inputs.source_kind }}
      SOURCE_REF: ${{ inputs.source_ref }}
      DIRECT_CHECK: ${{ inputs.direct_check }}
      TTL_MINUTES: ${{ inputs.ttl_minutes }}
      EVIDENCE_NOTE: ${{ inputs.evidence_note }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pre.sql <<'SQL'
          SELECT
            (SELECT mode FROM autonomous_machine_control WHERE singleton_id=1) AS machineMode,
            (SELECT mode FROM autonomous_readiness_control WHERE singleton_id=1) AS readinessMode,
            (SELECT mode FROM autonomy_control WHERE singleton_id=1) AS autonomyMode,
            (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
            (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          SQL
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --file /tmp/pre.sql > /tmp/pre.json
          cat /tmp/pre.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'))?.[0]?.results?.[0]||{};
          if(String(r.machineMode)!=='SHADOW') process.exit(1);
          if(String(r.readinessMode)!=='SHADOW') process.exit(2);
          if(String(r.autonomyMode)!=='SHADOW') process.exit(3);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(4);
          if(Number(r.operatorTasks)!==0) process.exit(5);
          console.log('MACHINE_EVIDENCE_PREFLIGHT=PASS');
          NODE

      - name: Build validated SQL
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            buildRegisterMachineSqlV1,
            buildRecordMachineObservationSqlV1,
            buildMapLineToMachineSqlV1
          } from './autonomous-printshop/core/machine-evidence-command-v1.mjs';

          const op=process.env.OPERATION;
          const machineId=process.env.MACHINE_ID;
          const sourceKind=process.env.SOURCE_KIND || '';
          const sourceRef=process.env.SOURCE_REF || '';
          const q=(v)=>"'" + String(v||'').replace(/'/g,"''") + "'";
          let sql='';
          let expectedId='';

          if(op==='REGISTER_MACHINE'){
            sql=buildRegisterMachineSqlV1({
              machineId,
              displayName:process.env.DISPLAY_NAME,
              department:process.env.DEPARTMENT,
              machineClass:process.env.MACHINE_CLASS,
              capabilities:String(process.env.CAPABILITIES_CSV||'').split(',').map(x=>x.trim()).filter(Boolean)
            });
            expectedId=machineId;
          }else if(op==='RECORD_OBSERVATION'){
            expectedId='obs-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT;
            sql=buildRecordMachineObservationSqlV1({
              observationId:expectedId,
              machineId,
              machineState:process.env.MACHINE_STATE,
              sourceKind,
              sourceRef,
              ttlMinutes:process.env.TTL_MINUTES,
              confidence:1,
              evidence:{
                directCheck:String(process.env.DIRECT_CHECK).toLowerCase()==='true',
                note:String(process.env.EVIDENCE_NOTE||'').slice(0,500),
                workflowRunId:process.env.GITHUB_RUN_ID
              }
            });
          }else if(op==='MAP_LINE'){
            expectedId='map-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT;
            sql=buildMapLineToMachineSqlV1({
              mappingEventId:expectedId,
              lineId:process.env.LINE_ID,
              machineId,
              mappingState:'ACTIVE',
              sourceKind:sourceKind || 'OPERATOR',
              sourceRef
            });
          }else{
            throw new Error('OPERATION_INVALID');
          }

          const post=[
            'SELECT',
            "  (SELECT mode FROM autonomous_machine_control WHERE singleton_id=1) AS machineMode,",
            "  (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,",
            "  (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks,",
            '  (SELECT COUNT(*) FROM autonomous_machines WHERE machine_id='+q(machineId)+') AS machineExact,',
            '  (SELECT COUNT(*) FROM autonomous_machine_observations WHERE observation_id='+q(expectedId)+') AS observationExact,',
            '  (SELECT COUNT(*) FROM autonomous_line_machine_mapping_events WHERE mapping_event_id='+q(expectedId)+') AS mappingExact;'
          ].join('\n');

          fs.writeFileSync('/tmp/machine-command.sql',sql+'\n');
          fs.writeFileSync('/tmp/post.sql',post+'\n');
          console.log('MACHINE_EVIDENCE_SQL_VALIDATED=PASS');
          console.log('OPERATION='+op);
          NODE

      - name: Execute machine-evidence-only command
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file /tmp/machine-command.sql

      - name: Verify exact result and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --file /tmp/post.sql > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'))?.[0]?.results?.[0]||{};
          const op=process.env.OPERATION;
          if(String(r.machineMode)!=='SHADOW') process.exit(1);
          if(String(r.operatorTaskMode)!=='OFF'||Number(r.operatorTasks)!==0) process.exit(2);
          if(op==='REGISTER_MACHINE'&&Number(r.machineExact)!==1) process.exit(3);
          if(op==='RECORD_OBSERVATION'&&Number(r.observationExact)!==1) process.exit(4);
          if(op==='MAP_LINE'&&Number(r.mappingExact)!==1) process.exit(5);
          console.log('MACHINE_EVIDENCE_RESULT=VERIFIED');
          console.log('OPERATOR_TASK_CONTROL=OFF');
          console.log('LIVE_EMPLOYEE_ASSIGNMENT=NO');
          NODE

      - name: Safety conclusion
        run: |
          echo 'ONLY_MACHINE_EVIDENCE_TABLES_MUTATED=YES'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'ACCOUNTING_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
          echo 'READY_REQUIRES_EXPLICIT_DIRECT_CHECK=YES'
