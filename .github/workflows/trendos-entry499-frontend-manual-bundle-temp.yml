name: TrendOS Entry499 Frontend Manual Bundle TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry499-frontend-manual-bundle-temp.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 229ab05fc8203e1ad77f10cfc6e6ca2169868787
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualify and package Entry499 frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check trendos-edge-orders-read-v1.js
          node --check press-control-v1.js
          node tests/frontend_session_and_zero_google_read_entry499.test.mjs
          node tests/frontend_no_direct_google_transport_a61.test.mjs
          node tests/frontend_edge_orders_cutover_02ct.test.mjs

          rm -rf entry499-ui
          mkdir -p entry499-ui/frontend-dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" entry499-ui/frontend-dist/
          cp cloudflare-d1/src/frontend-static-worker.mjs entry499-ui/frontend-static-worker.mjs
          cat > entry499-ui/wrangler.frontend.toml <<'TOML'
          name = "trendos-ui"
          main = "frontend-static-worker.mjs"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [assets]
          directory = "./frontend-dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          TOML

          grep -F 'function zeroGoogleSnapshotStalenessAccepted' entry499-ui/frontend-dist/trendos-edge-orders-read-v1.js >/dev/null
          grep -F 'Data/read failures must never destroy the employee browser session.' entry499-ui/frontend-dist/app.js >/dev/null
          grep -F 'employee-session-unavailable' entry499-ui/frontend-dist/press-control-v1.js >/dev/null
          if grep -F 'indexOf("انتهت الجلسة") !== -1) logout();' entry499-ui/frontend-dist/app.js; then exit 31; fi

          cat > entry499-ui/DEPLOY_ENTRY499.txt <<'TXT'
          TrendOS Entry499 — FRONTEND ONLY
          1) Open CMD/PowerShell in this folder.
          2) Run:
             npx --yes wrangler@4.142.0 deploy --config wrangler.frontend.toml
          3) Cloudflare target must be trendos-ui.
          4) Do NOT deploy trendos-d1-api for Entry499.
          5) Preserve the ASSETS binding.
          6) After deploy: Ctrl+F5, login once, open Customer Service.
          TXT

          tar -czf trendos-entry499-frontend-manual.tar.gz entry499-ui
          echo "ENTRY499_FRONTEND_MANUAL_BUNDLE=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: trendos-entry499-frontend-manual
          path: |
            entry499-ui/
            trendos-entry499-frontend-manual.tar.gz
          if-no-files-found: error
