name: Autonomous Printshop Cloud Design Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/core/cloud-order-file-design-discovery-v1.mjs'
      - 'autonomous-printshop/tests/cloud_order_file_design_discovery_v1.test.mjs'
      - 'autonomous-printshop/tests/cloud_design_discovery_workflow_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-cloud-design-discovery.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-cloud-design-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contract test
        run: node autonomous-printshop/tests/cloud_order_file_design_discovery_v1.test.mjs

      - name: Read aggregate cloud design source state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/discovery.sql <<'SQL'
          SELECT
            (SELECT mode FROM employee_comms_control_v1 WHERE singleton=1) AS commsMode,
            (SELECT mode FROM autonomous_design_control WHERE singleton_id=1) AS designMode,
            (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
            (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks,
            (SELECT COUNT(*) FROM employee_order_conversation_files_v1) AS totalFiles,
            (SELECT COUNT(*) FROM employee_order_conversation_files_v1 WHERE trim(line_id)<>'') AS lineLinkedFiles,
            (
              SELECT COUNT(*)
              FROM employee_order_conversation_files_v1 f
              WHERE lower(f.mime_type) LIKE 'image/%'
                 OR lower(f.mime_type) IN ('application/pdf','application/postscript')
            ) AS designMimeFiles,
            (
              SELECT COUNT(*)
              FROM employee_order_conversation_files_v1 f
              WHERE trim(f.order_id)<>''
                AND trim(f.line_id)<>''
                AND trim(f.file_id)<>''
                AND trim(f.r2_key)<>''
                AND (
                  lower(f.mime_type) LIKE 'image/%'
                  OR lower(f.mime_type) IN ('application/pdf','application/postscript')
                )
                AND NOT EXISTS(
                  SELECT 1 FROM employee_core_archive_lines_v1 a
                  WHERE a.line_id=f.line_id
                )
                AND (
                  EXISTS(
                    SELECT 1 FROM employee_core_lines_v1 l
                    WHERE l.line_id=f.line_id
                      AND l.order_id=f.order_id
                      AND l.active=1
                      AND l.status NOT IN ('تم التسليم','جاهز للاستلام','ملغي','ملغى','مكرر','مدمج','مغلق','ملغي/مغلق')
                  )
                  OR EXISTS(
                    SELECT 1
                    FROM t12_prod_lines l
                    LEFT JOIN t12_prod_line_runtime r ON r.line_id=l.line_id
                    WHERE l.line_id=f.line_id
                      AND l.order_id=f.order_id
                      AND COALESCE(r.status,l.status) NOT IN ('تم التسليم','جاهز للاستلام','ملغي','ملغى','مكرر','مدمج','مغلق','ملغي/مغلق')
                  )
                )
            ) AS activeDesignProvenanceFiles,
            (
              SELECT COUNT(*)
              FROM pragma_table_info('employee_order_conversation_files_v1')
              WHERE lower(name) IN ('content_sha256','sha256','content_hash')
            ) AS hashColumns,
            (SELECT COUNT(*) FROM autonomous_design_artifacts) AS designArtifacts,
            (SELECT COUNT(*) FROM autonomous_design_approval_events) AS approvals,
            (SELECT COUNT(*) FROM autonomous_design_preflight_runs) AS preflights,
            (SELECT COUNT(*) FROM autonomous_design_asset_binding_events WHERE binding_status='LINKED') AS linkedBindings;
          SQL
          npx --yes wrangler@\${WRANGLER_VERSION} d1 execute "\${DB_NAME}" --remote --config "\${CONFIG}" --json --file /tmp/discovery.sql > /tmp/discovery.json

          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/discovery.json','utf8'))?.[0]?.results?.[0]||{};
          if(String(x.operatorTaskMode)!=='OFF') throw new Error('OPERATOR_TASK_NOT_OFF');
          if(Number(x.operatorTasks||0)!==0) throw new Error('OPERATOR_TASK_ROWS_NOT_ZERO');
          const out={
            commsMode:String(x.commsMode||'ABSENT'),
            designMode:String(x.designMode||'ABSENT'),
            totalFiles:Number(x.totalFiles||0),
            lineLinkedFiles:Number(x.lineLinkedFiles||0),
            designMimeFiles:Number(x.designMimeFiles||0),
            activeDesignProvenanceFiles:Number(x.activeDesignProvenanceFiles||0),
            contentHashColumnPresent:Number(x.hashColumns||0)>0,
            designArtifacts:Number(x.designArtifacts||0),
            approvals:Number(x.approvals||0),
            preflights:Number(x.preflights||0),
            linkedBindings:Number(x.linkedBindings||0),
            operatorTaskMode:String(x.operatorTaskMode),
            operatorTasks:Number(x.operatorTasks||0),
            piiExposed:false,
            businessWrites:false
          };
          console.log('CLOUD_DESIGN_DISCOVERY='+JSON.stringify(out));
          console.log('ACTIVE_DESIGN_PROVENANCE_FILES='+out.activeDesignProvenanceFiles);
          console.log('CONTENT_HASH_COLUMN_PRESENT='+String(out.contentHashColumnPresent));
          console.log('UPLOAD_EQUALS_READY=NO');
          console.log('PRODUCTION_MUTATION=NO');
          NODE

      - name: Safety conclusion
        run: |
          echo 'READ_ONLY_DIAGNOSTIC=YES'
          echo 'RAW_ORDER_IDS_EXPOSED=NO'
          echo 'RAW_LINE_IDS_EXPOSED=NO'
          echo 'CUSTOMER_PII_EXPOSED=NO'
          echo 'D1_MUTATION=NO'
          echo 'DESIGN_READY_WRITE=NO'
          echo 'OPERATOR_TASK_WRITE=NO'
