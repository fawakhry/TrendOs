name: TrendOS T7 Build Wael Print Canary

on:
  push:
    branches: [cloud-migration-v3-t7-print-wael-canary-20260913]
    paths: ['.github/workflows/cloud-migration-v3-t7-print-wael-canary-build.yml']

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-migration-v3-t7-print-wael-canary-20260913
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Patch canary scope only
        shell: python
        run: |
          from pathlib import Path
          p=Path('trendos-edge-orders-read-v1.js')
          s=p.read_text()
          s=s.replace("var VERSION = 'EDGE_ORDERS_READ_02CX_LINE_ID_GUARD_20260908';", "var VERSION = 'EDGE_ORDERS_READ_T7_PRINT_WAEL_CANARY_20260913';")
          old="""  function eligible(action, params) {
            if (action !== 'getRowsPageV1931') return false;
            if (text(params && params.statusFilter) === '__DEBT__') return false;
            return true;
          }
          """
          new="""  function canaryUserAllowed() {
            if (window.MATBAGY_EDGE_ORDERS_CANARY_ONLY !== true) return true;
            var user = currentUser();
            var username = text(user && user.username).toLowerCase();
            var allowed = Array.isArray(window.MATBAGY_EDGE_ORDERS_CANARY_USERS)
              ? window.MATBAGY_EDGE_ORDERS_CANARY_USERS.map(function (value) { return text(value).toLowerCase(); })
              : [];
            return !!username && allowed.indexOf(username) >= 0;
          }

          function eligible(action, params) {
            if (action !== 'getRowsPageV1931') return false;
            if (text(params && params.statusFilter) === '__DEBT__') return false;
            if (window.MATBAGY_EDGE_ORDERS_CANARY_ONLY === true) {
              if (!canaryUserAllowed()) return false;
              if (text(params && params.screen).toLowerCase() !== 'print') return false;
            }
            return true;
          }
          """
          if old not in s: raise SystemExit('eligible block not found')
          s=s.replace(old,new)
          old2="""      if (action === 'updateLine') {
                var safeParams = identitySafeUpdateLineParams(params || {});
                var writeResult = await original.call(this, action, safeParams);
                if (writeResult && writeResult.success === true) openPostWriteBarrier(safeParams);
                return writeResult;
              }

              if (!eligible(action, params || {})) return original.apply(this, args);
          """
          new2="""      if (action === 'updateLine') {
                if (!canaryUserAllowed()) return original.apply(this, args);
                var safeParams = identitySafeUpdateLineParams(params || {});
                var writeResult = await original.call(this, action, safeParams);
                if (writeResult && writeResult.success === true) openPostWriteBarrier(safeParams);
                return writeResult;
              }

              if (!eligible(action, params || {})) return original.apply(this, args);
          """
          if old2 not in s: raise SystemExit('updateLine block not found')
          s=s.replace(old2,new2)
          s=s.replace("mode: 'qualified-d1-orders-read-first-line-id-repaired-persisted-read-your-write-apps-script-authoritative',", "mode: 't7-print-wael-canary-d1-read-first-apps-script-authoritative',\n      canaryOnly: window.MATBAGY_EDGE_ORDERS_CANARY_ONLY === true,\n      canaryUsers: Array.isArray(window.MATBAGY_EDGE_ORDERS_CANARY_USERS) ? window.MATBAGY_EDGE_ORDERS_CANARY_USERS.slice() : [],")
          p.write_text(s)

          c=Path('config.js'); x=c.read_text()
          x=x.replace('window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false;', "window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;\nwindow.MATBAGY_EDGE_ORDERS_CANARY_ONLY = true;\nwindow.MATBAGY_EDGE_ORDERS_CANARY_USERS = ['وائل','wael'];")
          x=x.replace("trendos-edge-orders-read-v1.js?v=20260908a", "trendos-edge-orders-read-v1.js?v=20260913-t7-wael1")
          c.write_text(x)
      - name: Static safety assertions
        run: |
          set -euo pipefail
          grep -q "EDGE_ORDERS_READ_T7_PRINT_WAEL_CANARY_20260913" trendos-edge-orders-read-v1.js
          grep -q "MATBAGY_EDGE_ORDERS_CANARY_ONLY = true" config.js
          grep -q "MATBAGY_EDGE_ORDERS_CANARY_USERS = \['وائل','wael'\]" config.js
          grep -q "screen).toLowerCase() !== 'print'" trendos-edge-orders-read-v1.js
          grep -q "statusFilter) === '__DEBT__'" trendos-edge-orders-read-v1.js
          grep -q "original.apply(this, args)" trendos-edge-orders-read-v1.js
          grep -q "trendos-edge-orders-read-v1.js?v=20260913-t7-wael1" config.js
          echo T7_CANARY_SCOPE_STATIC=PASS
      - name: Runtime routing contract
        run: |
          cat > /tmp/t7-test.mjs <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm'; import assert from 'node:assert/strict';
          const code=fs.readFileSync('trendos-edge-orders-read-v1.js','utf8');
          async function scenario(username, action, params, edgeOk=true){
            const calls={original:[],fetch:[]};
            const storage=new Map([['trendos_session',JSON.stringify({user:{username,token:'employee-token'}})]]);
            const now=new Date().toISOString();
            const ctx={console,URL,URLSearchParams,Map,Date,Promise,setInterval,clearInterval,
              sessionStorage:{getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v),removeItem:k=>storage.delete(k)},
              window:{MATBAGY_EDGE_ORDERS_READ_V1_ENABLED:true,MATBAGY_EDGE_ORDERS_CANARY_ONLY:true,MATBAGY_EDGE_ORDERS_CANARY_USERS:['وائل','wael'],MATBAGY_EDGE_ORDERS_API_URL:'https://edge.test',trendosSecureApiV1922:async function(a,p){calls.original.push({a,p});return {success:true,source:'apps-script'}}},
              fetch:async(url,opt)=>{calls.fetch.push(String(url)); if(String(url).includes('/session')) return new Response(JSON.stringify({success:true,edgeToken:'edge-token',expiresIn:600}),{status:200}); if(!edgeOk)return new Response(JSON.stringify({success:false,code:'02cr-mirror-stale',fallback:'apps-script',message:'stale'}),{status:503}); return new Response(JSON.stringify({success:true,rows:[{orderId:'4122',lineId:'4122-01',status:'طلب جديد'}],mirrors:[{sheetName:'بنود الأوردرات',status:'ready',rowCount:2,sourceLastRow:2,syncedAt:now},{sheetName:'العملاء',status:'ready',rowCount:2,sourceLastRow:2,syncedAt:now},{sheetName:'عملاء منع التسليم بالمديونية',status:'ready',rowCount:2,sourceLastRow:2,syncedAt:now}]}),{status:200});},Response,Headers};
            ctx.window.window=ctx.window; vm.createContext(ctx); vm.runInContext(code,ctx); const result=await ctx.window.trendosSecureApiV1922(action,params); return {calls,result};
          }
          let s=await scenario('wael','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'}); assert.equal(s.calls.original.length,0); assert.ok(s.calls.fetch.some(x=>x.includes('/02cr/page')));
          s=await scenario('رحمه','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'}); assert.equal(s.calls.original.length,1); assert.equal(s.calls.fetch.length,0);
          s=await scenario('وائل','getRowsPageV1931',{screen:'laser',statusFilter:'__ACTIVE__'}); assert.equal(s.calls.original.length,1); assert.equal(s.calls.fetch.length,0);
          s=await scenario('wael','getRowsPageV1931',{screen:'print',statusFilter:'__DEBT__'}); assert.equal(s.calls.original.length,1); assert.equal(s.calls.fetch.length,0);
          s=await scenario('wael','updateLine',{orderId:'4122',lineId:'4122-01',rowNumber:9,status:'بدأ التنفيذ'}); assert.equal(s.calls.original.length,1); assert.equal(s.calls.fetch.length,0); assert.equal(s.calls.original[0].p.rowNumber,undefined);
          s=await scenario('wael','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'},false); assert.equal(s.calls.original.length,1); assert.ok(s.calls.fetch.some(x=>x.includes('/02cr/page')));
          console.log('T7_CANARY_RUNTIME_ROUTING=PASS');
          console.log('NON_CANARY_APPS_SCRIPT=PASS'); console.log('LASER_APPS_SCRIPT=PASS'); console.log('DEBT_APPS_SCRIPT=PASS'); console.log('WRITES_APPS_SCRIPT=PASS'); console.log('EDGE_FAILURE_FALLBACK=PASS');
          NODE
          node /tmp/t7-test.mjs
      - name: Commit qualified candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js trendos-edge-orders-read-v1.js
          git diff --cached --check
          git commit -m 'cloud migration: enable Wael print read canary'
          git push origin HEAD:cloud-migration-v3-t7-print-wael-canary-20260913
