name: TrendOS RP-07 Remediation Containment CI

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'trendos-rp07-legacy-containment-v1.gs'
      - 'v1932-router.gs'
      - 'trendos-integrity-router-v1.gs'
      - 'trendos-press-integrity-v1.gs'
      - 'trendos-invoice-integrity-v1.gs'
      - 'press-control-v1.js'
      - 'tests/rp07_legacy_attendance_cleaning_containment_v1.test.mjs'
      - 'tests/rp07_v1932_integrity_bridge_v1.test.mjs'
      - 'tests/rp07_press_frontend_exact_line_v1.test.mjs'
      - 'tests/trendos_integrity_router_v1.test.js'
      - 'tests/trendos_press_integrity_v1.test.js'
      - 'tests/trendos_invoice_integrity_v1.test.js'
      - '.github/workflows/trendos-rp07-remediation-containment-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify RP-07 legacy containment contract
        run: node tests/rp07_legacy_attendance_cleaning_containment_v1.test.mjs
      - name: Verify V1932 guarded Integrity cutover bridge
        run: node tests/rp07_v1932_integrity_bridge_v1.test.mjs
      - name: Verify guarded Integrity legacy aliases
        run: node tests/trendos_integrity_router_v1.test.js .
      - name: Verify Press backend exact-Line contract
        run: node tests/trendos_press_integrity_v1.test.js .
      - name: Verify Press frontend exact-Line compatibility
        run: node tests/rp07_press_frontend_exact_line_v1.test.mjs
      - name: Verify Invoice closed-order lifecycle prevention
        run: node tests/trendos_invoice_integrity_v1.test.js .
      - name: Assert candidate remains runtime-inert
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "setProperty(" trendos-rp07-legacy-containment-v1.gs
          ! grep -q "deleteRow(" trendos-rp07-legacy-containment-v1.gs
          ! grep -q "deleteRows(" trendos-rp07-legacy-containment-v1.gs
          ! grep -q "ScriptApp.newDeployment" trendos-rp07-legacy-containment-v1.gs
          ! grep -q "setProperty(" trendos-press-integrity-v1.gs
          ! grep -q "setProperty(" trendos-invoice-integrity-v1.gs
          ! grep -q "setProperty(" v1932-router.gs
          echo "RP-07 candidate is GitHub-only and contains no activation/deletion primitive."
