name: TrendOS Accounting Native CI

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/accounting-native-module.mjs'
      - 'cloudflare-d1/src/accounting-preview.mjs'
      - 'cloudflare-d1/src/accounting-capabilities-v1.mjs'
      - 'cloudflare-d1/src/accounting-contract-v1.mjs'
      - 'cloudflare-d1/src/accounting-foundation-v1.mjs'
      - 'cloudflare-d1/src/accounting-foundation-api-v1.mjs'
      - 'cloudflare-d1/src/accounting-operations-read-v1.mjs'
      - 'cloudflare-d1/src/accounting-finance-core-v1.mjs'
      - 'cloudflare-d1/src/accounting-finance-safe-v1.mjs'
      - 'cloudflare-d1/src/accounting-finance-api-v1.mjs'
      - 'cloudflare-d1/src/accounting-persistence-readiness-v1.mjs'
      - 'cloudflare-d1/src/accounting-persistence-schema-preflight-v1.mjs'
      - 'cloudflare-d1/schema-prep/accounting-finance-v1.sql'
      - 'cloudflare-d1/schema-prep/accounting-operations-v1.sql'
      - 'accounting/domain-core-v1.js'
      - 'accounting/transaction-contract-v1.js'
      - 'accounting/d1-persistence-adapter-v1.js'
      - 'accounting/d1-persistence-adapter-v1.test.js'
      - 'accounting/persistence-composition-v1.js'
      - 'accounting/persistence-composition-v1.test.js'
      - 'accounting/preview-persistence-caller-v1.js'
      - 'accounting/preview-persistence-caller-v1.test.js'
      - 'cloudflare-d1/src/index_v2.js'
      - 'tests/cloudflare_accounting_native_v1.test.mjs'
      - 'tests/cloudflare_accounting_contract_v1.test.mjs'
      - 'tests/cloudflare_accounting_f1_foundation_v1.test.mjs'
      - 'tests/cloudflare_accounting_f2_finance_core_v1.test.mjs'
      - 'tests/cloudflare_accounting_f2_finance_safe_v1.test.mjs'
      - 'tests/cloudflare_accounting_f2_finance_api_v1.test.mjs'
      - 'tests/cloudflare_accounting_f2_schema_prep_v1.test.mjs'
      - 'tests/cloudflare_accounting_f2_operations_schema_prep_v1.test.mjs'
      - 'tests/cloudflare_accounting_persistence_readiness_v1.test.mjs'
      - 'tests/cloudflare_accounting_persistence_readiness_runtime_v1.test.mjs'
      - 'tests/cloudflare_accounting_persistence_schema_preflight_v1.test.mjs'
      - 'tests/cloudflare_accounting_persistence_schema_preflight_runtime_v1.test.mjs'
      - 'tests/cloudflare_preview_safety_v1.test.mjs'
      - '.github/workflows/trendos-accounting-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native-accounting-module:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check cloudflare-d1/src/accounting-contract-v1.mjs
          node --check cloudflare-d1/src/accounting-foundation-v1.mjs
          node --check cloudflare-d1/src/accounting-foundation-api-v1.mjs
          node --check cloudflare-d1/src/accounting-operations-read-v1.mjs
          node --check cloudflare-d1/src/accounting-finance-core-v1.mjs
          node --check cloudflare-d1/src/accounting-finance-safe-v1.mjs
          node --check cloudflare-d1/src/accounting-finance-api-v1.mjs
          node --check cloudflare-d1/src/accounting-persistence-readiness-v1.mjs
          node --check cloudflare-d1/src/accounting-persistence-schema-preflight-v1.mjs
          node --check cloudflare-d1/src/accounting-native-module.mjs
          node --check cloudflare-d1/src/accounting-preview.mjs
          node --check cloudflare-d1/src/index_v2.js
          node --check accounting/d1-persistence-adapter-v1.js
          node --check accounting/persistence-composition-v1.js
          node --check accounting/preview-persistence-caller-v1.js
      - name: Native module tests
        run: node tests/cloudflare_accounting_native_v1.test.mjs
      - name: Accounting V1 contract tests
        run: node tests/cloudflare_accounting_contract_v1.test.mjs
      - name: Accounting F1 foundation tests
        run: node tests/cloudflare_accounting_f1_foundation_v1.test.mjs
      - name: Accounting F2 finance core tests
        run: node tests/cloudflare_accounting_f2_finance_core_v1.test.mjs
      - name: Accounting F2 safe finance tests
        run: node tests/cloudflare_accounting_f2_finance_safe_v1.test.mjs
      - name: Accounting F2 planning API tests
        run: node tests/cloudflare_accounting_f2_finance_api_v1.test.mjs
      - name: Accounting F2 prepared finance schema tests
        run: node --experimental-sqlite tests/cloudflare_accounting_f2_schema_prep_v1.test.mjs
      - name: Accounting F2 prepared operations schema tests
        run: node --experimental-sqlite tests/cloudflare_accounting_f2_operations_schema_prep_v1.test.mjs
      - name: Accounting F2 isolated D1 persistence adapter tests
        run: node accounting/d1-persistence-adapter-v1.test.js
      - name: Accounting F2 persistence composition safety tests
        run: node accounting/persistence-composition-v1.test.js
      - name: Accounting F2 preview persistence caller tests
        run: node accounting/preview-persistence-caller-v1.test.js
      - name: Accounting persistence runtime readiness safety tests
        run: node tests/cloudflare_accounting_persistence_readiness_v1.test.mjs
      - name: Accounting runtime readiness diagnostic tests
        run: node tests/cloudflare_accounting_persistence_readiness_runtime_v1.test.mjs
      - name: Accounting persistence schema preflight tests
        run: node tests/cloudflare_accounting_persistence_schema_preflight_v1.test.mjs
      - name: Accounting persistence schema preflight runtime endpoint tests
        run: node tests/cloudflare_accounting_persistence_schema_preflight_runtime_v1.test.mjs
      - name: Preview zero-write safety gate
        run: node tests/cloudflare_preview_safety_v1.test.mjs
