name: TrendOS T12 Duplicate Order Guard Production Preflight

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-duplicate-order-guard-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      DATABASE: trendos-main
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
      BASELINE_REF: b7f44623d5b8051df84b7fefea96e61b50e46e4b

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify guard delta scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASELINE_REF"..HEAD -- cloudflare-d1/ | sort > /tmp/cloud-delta.txt
          cat > /tmp/expected-cloud-delta.txt <<'EOF'
          cloudflare-d1/migrations/0010_t12_duplicate_order_guard.sql
          cloudflare-d1/src/t12-general-create-handler.mjs
          cloudflare-d1/src/t12-general-create.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-cloud-delta.txt
          diff -u /tmp/expected-cloud-delta.txt /tmp/cloud-delta.txt
          node --check cloudflare-d1/src/t12-general-create.mjs
          node --check cloudflare-d1/src/t12-general-create-handler.mjs
          echo 'GUARD_SOURCE_DELTA_SCOPE=PASS_EXACT_3_FILES'

      - name: Read live deployment and bundle without mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1) throw new Error('active deployment is not one version at 100%');
          console.log('ACTIVE_DEPLOYMENT_ID='+d.id);
          console.log('ACTIVE_VERSION_ID='+full[0].id);
          fs.writeFileSync('/tmp/active-version.txt',full[0].id);
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/live-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/live-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          hs=Path('/tmp/live-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/live-content.body').read_bytes()
          payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              candidates=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower()
                  n=(p.get_param('name',header='content-disposition') or '').lower()
                  t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')):
                      candidates.append(d)
              if candidates: payload=max(candidates,key=len)
          else:
              payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          Path('/tmp/live-worker.js').write_bytes(payload)
          PY

      - name: Compare live bundle to pre-guard baseline and target
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/guard-baseline "$BASELINE_REF" >/tmp/worktree.log 2>&1
          (
            cd /tmp/guard-baseline
            npx --yes wrangler@4.33.2 deploy --dry-run --outdir /tmp/guard-baseline-bundle --config cloudflare-d1/wrangler.toml >/tmp/base-dryrun.log 2>&1
          )
          npx --yes wrangler@4.33.2 deploy --dry-run --outdir /tmp/guard-target-bundle --config "$CONFIG" >/tmp/target-dryrun.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def choose(root):
              fs=[p for p in Path(root).rglob('*') if p.is_file() and p.suffix.lower() in ('.js','.mjs')]
              if not fs: raise SystemExit(2)
              p=max(fs,key=lambda x:x.stat().st_size)
              return p.read_bytes().replace(b'\r\n',b'\n').rstrip()+b'\n'
          live=Path('/tmp/live-worker.js').read_bytes()
          base=choose('/tmp/guard-baseline-bundle')
          target=choose('/tmp/guard-target-bundle')
          for name,data in [('live',live),('base',base),('target',target)]:
              Path('/tmp/'+name+'.sha').write_text(hashlib.sha256(data).hexdigest())
          if live!=base:
              raise SystemExit('LIVE_WORKER_DOES_NOT_MATCH_ENTRY589_BASELINE')
          if target==base:
              raise SystemExit('TARGET_BUNDLE_UNCHANGED')
          PY

          echo "LIVE_BUNDLE_SHA256=$(cat /tmp/live.sha)"
          echo "BASELINE_BUNDLE_SHA256=$(cat /tmp/base.sha)"
          echo "TARGET_BUNDLE_SHA256=$(cat /tmp/target.sha)"
          echo 'LIVE_EQUALS_ENTRY589_BASELINE=YES'
          echo 'TARGET_DIFFERS_FROM_BASELINE=YES'

      - name: Verify current public create health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/order-health.json --write-out '%{http_code}' "$PROD_URL/v1/t12/orders/create/health")"
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/order-health.json','utf8'));
          if(x.success!==true||x.schemaReady!==true||x.mode!=='GENERAL'||x.generalCutover!==true) {
            throw new Error('Order create health mismatch');
          }
          console.log('ORDER_CREATE_MODE=GENERAL');
          console.log('ORDER_CREATE_HEALTH=PASS');
          NODE

      - name: Read D1 guard schema state only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type='table' AND name='t12_prod_duplicate_order_guard';"             > /tmp/guard-schema.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/guard-schema.json','utf8'));
          const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'present'))rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(rows.length<1) throw new Error('guard schema result missing');
          const present=Number(rows[0].present||0);
          if(present!==0) throw new Error('duplicate guard table already exists unexpectedly');
          console.log('DUPLICATE_GUARD_TABLE_PRESENT=NO');
          console.log('D1_REMOTE_MUTATION=NO');
          NODE

      - name: Preflight result
        run: |
          echo 'ENTRY591_DUPLICATE_GUARD_PRODUCTION_PREFLIGHT=PASS'
          echo 'CLOUDFLARE_DEPLOY=NO'
          echo 'D1_REMOTE_MUTATION=NO'
          echo 'ORDER_DATA_MUTATED=NO'
          echo 'SECRETS_CHANGED=NO'
          echo 'VARIABLES_CHANGED=NO'
          echo 'BINDINGS_CHANGED=NO'
          echo 'ROUTES_CHANGED=NO'
