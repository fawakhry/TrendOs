name: TrendOS T12 Order 4324 Readback A48

on:
  push:
    branches:
      - diagnostic/t12-order-4324-readback-a48-20260928
    paths:
      - '.github/workflows/trendos-t12-order-4324-readback-a48.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only D1 order 4324
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          ACCOUNT='aeadb43110dbb950f8b1ed7683ad9ce0'
          DBID='5c4b92bf-e043-4f6e-bd6d-d514a92cd825'
          token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/d1/database/{DBID}/query'
          sql="""SELECT
            o.order_id AS orderId,
            o.customer_mode AS customerMode,
            o.customer_name AS customerName,
            o.customer_phone AS customerPhone,
            o.external_customer_id AS externalCustomerId,
            o.department AS orderDepartment,
            o.priority AS orderPriority,
            o.status AS orderStatus,
            o.source,
            o.notes AS orderNotes,
            o.created_at AS orderCreatedAt,
            l.line_id AS lineId,
            l.department AS lineDepartment,
            l.item_name AS itemName,
            l.qty,
            l.priority AS linePriority,
            l.status AS baseLineStatus,
            l.heat_press AS heatPress,
            l.fly_print AS flyPrint,
            COALESCE(r.status,'') AS runtimeStatus,
            COALESCE(r.notes,'') AS runtimeNotes,
            COALESCE(r.updated_by,'') AS runtimeUpdatedBy,
            (SELECT COUNT(*) FROM t12_prod_orders WHERE order_id='4324') AS orderRows,
            (SELECT COUNT(*) FROM t12_prod_lines WHERE order_id='4324') AS lineRows,
            (SELECT COUNT(*) FROM t12_prod_request_ledger WHERE order_id='4324' AND status='COMMITTED') AS committedLedgerRows,
            (SELECT COUNT(*) FROM t12_prod_outbox WHERE order_id='4324') AS outboxRows,
            (SELECT status FROM t12_prod_outbox WHERE order_id='4324' LIMIT 1) AS outboxStatus,
            (SELECT next_order_number FROM t12_prod_create_control WHERE singleton=1) AS nextOrderNumber,
            (SELECT mode FROM t12_prod_general_create_control WHERE singleton=1) AS generalMode
          FROM t12_prod_orders o
          JOIN t12_prod_lines l ON l.order_id=o.order_id
          LEFT JOIN t12_prod_line_runtime r ON r.line_id=l.line_id
          WHERE o.order_id='4324'
          ORDER BY l.ordinal;"""
          req=urllib.request.Request(url,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as rr:
            data=json.loads(rr.read())
          if data.get('success') is not True:
            print('READBACK=FAIL');sys.exit(1)
          rows=data['result'][0]['results']
          print('ORDER_4324_ROWS='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          print('PRODUCTION_MUTATION=NO')
          PY
