name: TrendOS Edge Orders Production Deploy V2

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-edge-orders-production-deploy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-edge-orders-production-deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify production dual-signal payload
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Eq '^EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_freshness_gate_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_heartbeat_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_freshness_integration_v1.test.mjs
          node tests/d1_orders_low_usage_heartbeat_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_verifier_v1.test.mjs
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_mirror_safety_v1.test.mjs
          echo 'PASS: dual-signal payload qualified; Cloud Write OFF.'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Install production Edge session secret
        run: |
          set -euo pipefail
          node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))" > /tmp/prod-edge-secret.txt
          chmod 600 /tmp/prod-edge-secret.txt
          cat /tmp/prod-edge-secret.txt | npx wrangler secret put EDGE_SESSION_SECRET --config cloudflare-d1/wrangler.toml
          echo 'PASS: production Edge auth configured; secret value not logged.'

      - name: Deploy Worker without D1 migrations
        run: |
          npx wrangler deploy --config cloudflare-d1/wrangler.toml
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5

      - name: Verify production Worker health
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/health.json --write-out '%{http_code}' "$PROD_URL/v1/edge/health")"
          cat /tmp/health.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"

      - name: Verify mirror remains read-ready
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/orders.json
          curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/lines.json
          node <<'NODE'
          const fs=require('fs');
          for(const [label,file] of [['ORDERS','/tmp/orders.json'],['LINES','/tmp/lines.json']]){
            const x=JSON.parse(fs.readFileSync(file,'utf8')),s=x.sheet||{};
            const pass=x.success===true&&x.schemaMutationFree===true&&s.status==='ready'&&Number(s.rowCount||0)===Number(s.sourceLastRow||0)&&['TrendOS orders live sync V1','TrendOS orders live sync V2 quota-aware'].includes(String(s.note||''));
            console.log(label+'_PROD='+JSON.stringify({rowCount:s.rowCount,sourceLastRow:s.sourceLastRow,syncedAt:s.syncedAt,note:s.note,pass}));
            if(!pass) process.exit(1);
          }
          NODE

      - name: Verify signed production dual-signal D1 Orders read
        run: |
          set -euo pipefail
          anon="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5")"
          test "$anon" = '401'
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const secret=fs.readFileSync('/tmp/prod-edge-secret.txt','utf8').trim(),now=Math.floor(Date.now()/1000);
          const p={aud:'trendos-orders-edge',sub:'ci-prod-admin',role:'admin',department:'إدارة',screens:['service','print','laser','press',''],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const b=Buffer.from(JSON.stringify(p)).toString('base64url'),i='v1.'+b,s=crypto.createHmac('sha256',secret).update(i).digest('base64url');
          fs.writeFileSync('/tmp/prod-token.txt',i+'.'+s,{mode:0o600});
          NODE
          token="$(cat /tmp/prod-token.txt)"
          pass=0
          for attempt in $(seq 1 15); do
            code="$(curl --silent --show-error --output /tmp/page.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__ACTIVE__" || true)"
            echo "ORDERS_DUAL_SIGNAL_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = '200' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/page.json','utf8')); if(!x.success||x.dataSource!=='d1-edge-orders'||!Array.isArray(x.rows)||!x.pagination) process.exit(1); console.log('PROD_D1_ORDERS_READ_PASS rows='+x.rows.length+' total='+x.pagination.totalRows)"; then pass=1; break; fi
            sleep 3
          done
          test "$pass" = '1'
          debt_code="$(curl --silent --show-error --output /tmp/debt.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__DEBT__")"
          test "$debt_code" = '409'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/debt.json','utf8')); if(x.code!=='apps-script-required'||x.fallback!=='apps-script') process.exit(1)"

      - name: Verify Cloud Write remains OFF
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          cat /tmp/write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true||x.schemaMutationFree!==true) process.exit(1)"
          echo 'PRODUCTION_ORDERS_DUAL_SIGNAL_BACKEND_PASS'

      - name: Automatic rollback on post-deploy failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        run: |
          echo 'Post-deploy verification failed; rolling back to immediately previous Worker version.'
          npx wrangler rollback --config cloudflare-d1/wrangler.toml --message "TrendOS automatic rollback after failed Orders dual-signal verification"

      - name: Cleanup temporary signing material
        if: ${{ always() }}
        run: rm -f /tmp/prod-token.txt /tmp/prod-edge-secret.txt
