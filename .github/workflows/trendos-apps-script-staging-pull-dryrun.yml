name: TrendOS Apps Script Staging Pull Dry-Run Gate

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'apps-script/patches/CLOUD_WRITE_STAGING_PULL_DRYRUN_V1.gs'
      - 'tests/apps_script_cloud_write_staging_pull_dryrun_v1.test.mjs'
      - '.github/workflows/trendos-apps-script-staging-pull-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apps-script-staging-pull-dryrun-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed staging pull + internal secret + no mutation
        run: node tests/apps_script_cloud_write_staging_pull_dryrun_v1.test.mjs
      - name: Safety conclusion
        run: |
          echo 'PASS: Apps Script makes one GET to the fixed trendos-d1-staging synthetic sample route.'
          echo 'PASS: reconciliation secret remains internal to Apps Script and is never logged/returned/transferred.'
          echo 'PASS: only the exact synthetic qualification identity is accepted.'
          echo 'PASS: no Sheet, D1, Drive, Script Property, or production Worker mutation is performed.'
