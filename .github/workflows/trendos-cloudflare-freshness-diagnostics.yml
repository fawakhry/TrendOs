name: TrendOS Cloudflare Freshness Diagnostics

# Diagnostic refresh marker: 2026-09-04T12:18Z — read-only; no D1 writes or production cutover.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'tests/cloudflare_control_plane_diagnostics.mjs'
      - '.github/workflows/trendos-cloudflare-freshness-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-cloudflare-freshness-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_WORKER_NAME: trendos-d1-api
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      MAX_LIVE_MIRROR_AGE_SECONDS: '180'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Inspect production Worker binding names only
        run: node tests/cloudflare_control_plane_diagnostics.mjs

      - name: Probe production Apps Script status routes read-only
        shell: bash
        run: |
          set -euo pipefail
          actions=(
            ping
            getD1OrdersLiveSyncStatus
            getD1OrdersPrimaryReadStatus
            getD1OrdersPrimaryRuntimeStatusV1
            getD1FullMigrationStatus
          )
          for action in "${actions[@]}"; do
            safe="$(printf '%s' "$action" | tr -c 'A-Za-z0-9_' '_')"
            file="/tmp/apps-${safe}.txt"
            code="$(curl -L --silent --show-error --output "$file" --write-out '%{http_code}' --get --data-urlencode "action=$action" "$APPS_SCRIPT_URL" || true)"
            echo "APPS_SCRIPT_ACTION=$action HTTP=$code"
            head -c 5000 "$file" || true
            echo
            echo "APPS_SCRIPT_ACTION_END=$action"
          done
          echo 'Read-only GET probes only; no Apps Script state was changed.'

      - name: Inspect both live mirror sheets before judging freshness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            --data-urlencode 'name=الأوردرات' \
            --data-urlencode 'limit=1' \
            "$PREVIEW_URL/v1/mirror/sheet" > /tmp/orders-mirror.json
          curl --fail --silent --show-error --get \
            --data-urlencode 'name=بنود الأوردرات' \
            --data-urlencode 'limit=1' \
            "$PREVIEW_URL/v1/mirror/sheet" > /tmp/lines-mirror.json

          node <<'NODE'
          const fs = require('fs');
          const maxAge = Number(process.env.MAX_LIVE_MIRROR_AGE_SECONDS || 180);
          function parseSqliteUtc(value) {
            const raw = String(value || '').trim();
            const normalized = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)
              ? raw.replace(' ', 'T') + 'Z'
              : raw;
            const ms = Date.parse(normalized);
            return Number.isFinite(ms) ? ms : 0;
          }
          function inspect(file, label) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!payload.success || !payload.sheet || payload.schemaMutationFree !== true) {
              return { label, valid: false, reason: 'invalid-mirror-response' };
            }
            const s = payload.sheet;
            const syncedMs = parseSqliteUtc(s.syncedAt);
            const ageSeconds = syncedMs
              ? Math.max(0, Math.round((Date.now() - syncedMs) / 1000))
              : Number.MAX_SAFE_INTEGER;
            return {
              label,
              valid: true,
              sheetName: String(s.sheetName || ''),
              rowCount: Number(s.rowCount || 0),
              sourceLastRow: Number(s.sourceLastRow || 0),
              sourceLastCol: Number(s.sourceLastCol || 0),
              status: String(s.status || ''),
              syncedAt: String(s.syncedAt || ''),
              ageSeconds,
              note: String(s.note || ''),
              rowParitySelf: Number(s.rowCount || 0) === Number(s.sourceLastRow || 0),
              liveSyncNote: String(s.note || '') === 'TrendOS orders live sync V1',
              fresh: ageSeconds <= maxAge
            };
          }
          const orders = inspect('/tmp/orders-mirror.json', 'ORDERS');
          const lines = inspect('/tmp/lines-mirror.json', 'LINES');
          console.log('ORDERS_MIRROR=' + JSON.stringify(orders));
          console.log('LINES_MIRROR=' + JSON.stringify(lines));
          const sameFreezePoint = orders.valid && lines.valid && orders.syncedAt === lines.syncedAt;
          console.log('FRESHNESS_DIAGNOSTIC=' + JSON.stringify({
            maxAgeSeconds: maxAge,
            sameFreezePoint,
            ordersFresh: !!orders.fresh,
            linesFresh: !!lines.fresh,
            bothFresh: !!orders.fresh && !!lines.fresh
          }));
          NODE

      - name: Read-only diagnostic conclusion
        run: |
          echo 'Diagnostic only: no D1 migration, no import, no Apps Script mutation, no production cutover.'
