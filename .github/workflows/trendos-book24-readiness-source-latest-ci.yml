name: TrendOS Book24 Readiness Source Latest-Observation Guard — Fake CI
on:
  push:
    branches:
      - fix/book24-readiness-adapter-latest-source-20261016
    paths:
      - 'autonomous-printshop/core/readiness-source-adapters-v1.mjs'
      - 'autonomous-printshop/tests/book24_readiness_source_latest_sql_guard.test.mjs'
      - 'autonomous-printshop/tests/book24_readiness_source_latest_sqlite.py'
      - '.github/workflows/trendos-book24-readiness-source-latest-ci.yml'
  pull_request:
    paths:
      - 'autonomous-printshop/core/readiness-source-adapters-v1.mjs'
      - 'autonomous-printshop/tests/book24_readiness_source_latest_sql_guard.test.mjs'
      - 'autonomous-printshop/tests/book24_readiness_source_latest_sqlite.py'
      - '.github/workflows/trendos-book24-readiness-source-latest-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-source-no-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check autonomous-printshop/core/readiness-source-adapters-v1.mjs
          node --check autonomous-printshop/tests/book24_readiness_source_latest_sql_guard.test.mjs
          python3 -m py_compile autonomous-printshop/tests/book24_readiness_source_latest_sqlite.py
      - name: Fake design timestamps and machine readiness parity
        run: node --test autonomous-printshop/tests/book24_readiness_source_latest_sql_guard.test.mjs
      - name: Execute source SELECT against in-memory SQLite migration
        run: python3 autonomous-printshop/tests/book24_readiness_source_latest_sqlite.py
      - name: Inherited readiness, adapter and machine regressions
        run: |
          node autonomous-printshop/tests/readiness_source_adapters_v1.test.mjs
          node autonomous-printshop/tests/readiness_evidence_v1.test.mjs
          node autonomous-printshop/tests/machine_readiness_v1.test.mjs
          node autonomous-printshop/tests/readiness_collector_v1.test.mjs
          node autonomous-printshop/tests/readiness_evidence_writer_v1.test.mjs
          node autonomous-printshop/tests/production_shadow_worker_v1.test.mjs
          node --test autonomous-printshop/tests/book24_readiness_expiry_resurrection_guard.test.mjs
      - name: No deploy or live effects
        run: |
          echo 'REAL_MACHINE=NO'
          echo 'REAL_D1=NO'
          echo 'REAL_GOOGLE=NO'
          echo 'ASSIGN_TASKS=NO'
          echo 'ACCOUNTING_MUTATION=NO'
          echo 'MERGE=NO'
          echo 'DEPLOY=NO'
          echo 'PRODUCTION_VERIFIED=NO'
