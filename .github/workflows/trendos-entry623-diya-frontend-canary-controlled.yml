
name: TrendOS Entry623 Diya Frontend Canary Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry623-diya-frontend-canary-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry623-diya-frontend-canary-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      EXPECTED_FRONTEND_VERSION: bfcc6f85-a748-4b66-a334-b605c72108f7
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      EXPECTED_DISPATCHER_BLOB: 23ba13b20203c93feb3d37d4e1c3982158d4f3bd
      CANARY_TAG: 20261005-entry623-diya-canary

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Qualify Entry623 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object employee-api-dispatcher-v1.js)" = "$EXPECTED_DISPATCHER_BLOB"
          node --check employee-api-dispatcher-v1.js
          node tests/entry623_diya_login_canary_17_policy.test.mjs
          node <<'NODE'
          const m=require('./docs/trendos/staging/ENTRY623_DIYA_LOGIN_CANARY_17_POLICY_MANIFEST.json');
          if(m.canaryUsername!=='ضياء'||m.globalNativeAuth!==false) throw new Error('canary contract');
          if(m.frontendCanaryTarget!==true||m.frontendBridgeTarget!==true) throw new Error('frontend target');
          if(Number(m.frontendMinimumBridgePolicies)!==17||Number(m.bridgePolicyCount)!==17) throw new Error('policy count');
          if(!Array.isArray(m.policies)||m.policies.length!==17||new Set(m.policies).size!==17) throw new Error('policies');
          if(m.opsMode!=='GENERAL'||m.accountingMode!=='READONLY') throw new Error('family modes');
          console.log('ENTRY623_FRONTEND_SOURCE_QUALIFICATION=PASS');
          NODE

      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx wrangler deployments list --name trendos-ui --json > /tmp/ui.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1||full[0].id!==process.env.EXPECTED_FRONTEND_VERSION) throw new Error('frontend version drift '+JSON.stringify(full));
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY623_FRONTEND_VERSION_LOCK=PASS');
          NODE

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry623frontendpre=$GITHUB_SHA" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync('/tmp/'+f+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==true||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==false) throw new Error('auth drift');
          if(Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0||a.plaintextStored!==false) throw new Error('auth rows drift');
          if(b.enabled!==true||b.secretConfigured!==true||Number(b.allowedPolicyCount||0)!==17) throw new Error('bridge drift');
          if(b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false) throw new Error('bridge hygiene');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||Number(ac.policyEpoch||0)!==2||ac.authoritativeWrites!==false) throw new Error('accounting drift');
          for(const f of ['content','comms','core']) if(r(f).mode!=='OFF') throw new Error(f+' drift');
          console.log('ENTRY623_FRONTEND_RUNTIME_PREFLIGHT=PASS');
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry623pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry623pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry623pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry623pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry623pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry623pre=$suffix" -o /tmp/live-attendance.js

          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          ! grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "T12_ENTRY619_ACCOUNTING_READONLY_V1_20261004" /tmp/live-dispatcher.js
          ! grep -Fq "canaryMinimumBridgePolicies" /tmp/live-dispatcher.js
          grep -Fq "TRENDOS_EMPLOYEE_SSO_V1" /tmp/live-app.js
          grep -Fq "postWriteBarrierRecoveries" /tmp/live-edge.js
          grep -Fq "normalizeAttendanceBackendResponse" /tmp/live-attendance.js
          grep -Fq "config.js?v=20261002-login-fast-surface" /tmp/live-index.html
          grep -Fq "employee-api-dispatcher-v1.js?v=20260930-a61-cloud-transport" /tmp/live-index.html
          echo ENTRY623_EXACT_LIVE_BASELINE=PASS

      - name: Build exact-live canary bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js
          cp employee-api-dispatcher-v1.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          node <<'NODE'
          const fs=require('fs');
          const p='cloudflare-d1/frontend-dist/config.js';
          const m=require('./docs/trendos/staging/ENTRY623_DIYA_LOGIN_CANARY_17_POLICY_MANIFEST.json');
          let s=fs.readFileSync(p,'utf8');
          const native='window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;';
          const bridge='window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;';
          const policies='window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];';
          if(s.split(native).length-1!==1) throw new Error('native anchor');
          if(s.split(bridge).length-1!==1) throw new Error('bridge anchor');
          if(s.split(policies).length-1!==1) throw new Error('policies anchor');
          if(s.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1')) throw new Error('canary already present');
          s=s.replace(native,[
            native,
            'window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;',
            "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = ['ضياء'];",
            'window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 17;'
          ].join('\n'));
          s=s.replace(bridge,'window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = true;');
          s=s.replace(policies,'window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = '+JSON.stringify(m.policies)+';');
          fs.writeFileSync(p,s);
          NODE

          OLD_CONFIG='config.js?v=20261002-login-fast-surface'
          NEW_CONFIG="config.js?v=$CANARY_TAG"
          OLD_DISPATCHER='employee-api-dispatcher-v1.js?v=20260930-a61-cloud-transport'
          NEW_DISPATCHER="employee-api-dispatcher-v1.js?v=$CANARY_TAG"
          export OLD_CONFIG NEW_CONFIG OLD_DISPATCHER NEW_DISPATCHER
          python3 <<'PY'
          from pathlib import Path
          import os
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          for old,new in [(os.environ['OLD_CONFIG'],os.environ['NEW_CONFIG']),(os.environ['OLD_DISPATCHER'],os.environ['NEW_DISPATCHER'])]:
              if s.count(old)!=1:
                  raise SystemExit('index anchor '+old+' count='+str(s.count(old)))
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check cloudflare-d1/frontend-dist/config.js
          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          test "$(git hash-object cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js)" = "$EXPECTED_DISPATCHER_BLOB"
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = ['ضياء'];" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 17;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = true;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "canaryMinimumBridgePolicies" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "config.js?v=$CANARY_TAG" cloudflare-d1/frontend-dist/index.html
          grep -Fq "employee-api-dispatcher-v1.js?v=$CANARY_TAG" cloudflare-d1/frontend-dist/index.html

          node <<'NODE'
          const fs=require('fs'),m=require('./docs/trendos/staging/ENTRY623_DIYA_LOGIN_CANARY_17_POLICY_MANIFEST.json');
          const s=fs.readFileSync('cloudflare-d1/frontend-dist/config.js','utf8');
          const mm=s.match(/window\.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES\s*=\s*(\[[^;]*\]);/);
          if(!mm) throw new Error('policy assignment');
          const p=JSON.parse(mm[1]);
          if(p.length!==17||JSON.stringify(p)!==JSON.stringify(m.policies)) throw new Error('policy mismatch');
          console.log('ENTRY623_CANARY_BUNDLE=PASS');
          NODE

      - name: Deploy frontend canary with rollback
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry623 Diya frontend canary automatic rollback" --config "$FRONTEND_CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry623post=$suffix" -o /tmp/post-index.html \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry623post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry623post=$suffix" -o /tmp/post-dispatcher.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry623post=$suffix" -o /tmp/post-app.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry623post=$suffix" -o /tmp/post-edge.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry623post=$suffix" -o /tmp/post-attendance.js \
              && grep -Fq "config.js?v=$CANARY_TAG" /tmp/post-index.html \
              && grep -Fq "employee-api-dispatcher-v1.js?v=$CANARY_TAG" /tmp/post-index.html \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = ['ضياء'];" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 17;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = true;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" /tmp/post-config.js \
              && grep -Fq "canaryMinimumBridgePolicies" /tmp/post-dispatcher.js \
              && test "$(git hash-object /tmp/post-dispatcher.js)" = "$EXPECTED_DISPATCHER_BLOB" \
              && grep -Fq "TRENDOS_EMPLOYEE_SSO_V1" /tmp/post-app.js \
              && grep -Fq "postWriteBarrierRecoveries" /tmp/post-edge.js \
              && grep -Fq "normalizeAttendanceBackendResponse" /tmp/post-attendance.js; then
                OK=1
                echo "ENTRY623_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          node <<'NODE'
          const fs=require('fs'),m=require('./docs/trendos/staging/ENTRY623_DIYA_LOGIN_CANARY_17_POLICY_MANIFEST.json');
          const s=fs.readFileSync('/tmp/post-config.js','utf8');
          const mm=s.match(/window\.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES\s*=\s*(\[[^;]*\]);/);
          if(!mm) throw new Error('live policy assignment');
          const p=JSON.parse(mm[1]);
          if(p.length!==17||JSON.stringify(p)!==JSON.stringify(m.policies)) throw new Error('live policies');
          console.log('ENTRY623_LIVE_17_POLICY_CONFIG=PASS');
          NODE

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry623frontendpost=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync('/tmp/'+f+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==true||a.nativeOnly!==false) throw new Error('auth post drift');
          if(Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0||a.plaintextStored!==false) throw new Error('auth rows changed');
          if(b.enabled!==true||b.secretConfigured!==true||Number(b.allowedPolicyCount||0)!==17) throw new Error('bridge post drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7) throw new Error('ops post drift');
          if(ac.mode!=='READONLY'||Number(ac.policyEpoch||0)!==2||ac.authoritativeWrites!==false) throw new Error('accounting post drift');
          for(const f of ['content','comms','core']) if(r(f).mode!=='OFF') throw new Error(f+' post drift');
          console.log('ENTRY623_FRONTEND_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend post version');
          console.log('ENTRY623_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY623_FRONTEND_CANARY_DEPLOY=PASS
          echo ENTRY623_CANARY_USER=ضياء
          echo ENTRY623_GLOBAL_NATIVE_AUTH=OFF
          echo ENTRY623_FRONTEND_BRIDGE=ON
          echo ENTRY623_FRONTEND_BRIDGE_POLICY_COUNT=17
          echo ENTRY623_API_CODE_DEPLOY=NO
          echo ENTRY623_D1_MUTATION=NO
          echo ENTRY623_ACCOUNTING_TOUCHED=NO
          echo ENTRY623_EASYSTORE_TOUCHED=NO
