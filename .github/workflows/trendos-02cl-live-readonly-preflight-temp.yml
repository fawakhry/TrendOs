name: TrendOS 02CL Live Read-Only Preflight TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cl-live-readonly-preflight-temp.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_DB_ID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      TARGET: CW-PROD-QUAL-33975124471

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify live Apps Script dry-run lineage without secret
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/^APPS_SCRIPT_API_URL = "\(.*\)"$/\1/p' cloudflare-d1/wrangler.toml | head -n1)"
          test -n "$base"
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/apps.json --write-out '%{http_code}' "${base}?action=cloudWriteReconcileDryRunV1&dryRun=true&_probe=02cl-live-readonly")"
          test "$code" = '200'
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/apps.json','utf8'));
          const locked=new Set(['dry-run-secret-not-configured','unauthorized']);
          const pass=x.success===false && locked.has(String(x.code||'')) && x.sheetsWritten===false && Number(x.mutationCount||0)===0;
          console.log('02CL_APPS_ROUTE='+JSON.stringify({http:200,code:String(x.code||''),sheetsWritten:x.sheetsWritten,mutationCount:Number(x.mutationCount||0),pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Verify Production safety health read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/health.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===true && x.writesAccepted===true && x.schemaReady===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('02CL_PROD_HEALTH='+JSON.stringify({pendingOutbox:Number(x.pendingOutbox||0),cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Query exact synthetic outbox target read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY' > /tmp/query.json
          import json
          sql="SELECT id,event_key,entity_type,entity_id,operation,status,attempts FROM cloud_write_outbox WHERE entity_type='order' AND entity_id='CW-PROD-QUAL-33975124471' AND operation='upsert_order_to_sheets' ORDER BY id"
          print(json.dumps({'sql':sql}))
          PY
          code="$(curl --silent --show-error --output /tmp/d1.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/query.json "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID/query")"
          test "$code" = '200'
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8'));
          if(x.success!==true) process.exit(1);
          const rows=(x.result||[]).flatMap(b=>b.results||[]);
          const pass=rows.length===1 && rows[0].entity_type==='order' && rows[0].entity_id===process.env.TARGET && rows[0].operation==='upsert_order_to_sheets' && rows[0].status==='pending';
          console.log('02CL_EXACT_OUTBOX='+JSON.stringify({count:rows.length,status:rows[0]&&rows[0].status,attempts:Number(rows[0]&&rows[0].attempts||0),eventKey:rows[0]&&rows[0].event_key,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Read-only conclusion
        run: |
          echo 'PERF_CF_02CL_LIVE_READONLY_PREFLIGHT_PASS'
          echo 'No D1 mutation, no Sheet write, no Apps Script property mutation, no deployment, no cutover.'
