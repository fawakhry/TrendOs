name: TrendOS Entry616 Zero-Google Backend OFF Deploy

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry616-zero-google-backend-off-deploy.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry616-zero-google-backend-off-deploy
  cancel-in-progress: false

jobs:
  qualify-deploy-postflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
      DATABASE: trendos-main
      EXPECTED_PRE_VERSION: 62cad27e-76c4d-4f56-9b37-849f2e7256c7
      EXPECTED_PARENT: 76c600a447a903189d047939a22e207494ef9a8a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock exact pre-deploy lineage and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          check_blob() {
            local file="$1" expected="$2"
            test "$(git hash-object "$file")" = "$expected"
          }

          check_blob cloudflare-d1/production-shadow/index.js cabf0237c3aea2479b56ab237eeb9877c86254a4
          check_blob cloudflare-d1/src/index_v2.js 9ac5a4575067700f3ddbc7863f00b45f5e611115
          check_blob cloudflare-d1/src/cloud-auth-shadow-v1.mjs 96d1a8ea0925d8594ead3a282757d7f8da723a63
          check_blob cloudflare-d1/wrangler.toml 7ade68ce256f82f72cb2db14ab8e115f82c1106a
          check_blob cloudflare-d1/src/employee-ops-native-v1.mjs 1a6e8c3a42cf9283cf21e0a23b0dec7f51ff710c
          check_blob cloudflare-d1/src/employee-content-native-v1.mjs fab5eeeca0ecc9312380054b32f01a44639f4664
          check_blob cloudflare-d1/src/employee-comms-native-v1.mjs 74f46c83282f925b7f8697c11cf657bc4a222efd
          check_blob cloudflare-d1/src/employee-accounting-native-v1.mjs cba333ae0363e8179bfb12727757c019fb1746e9
          check_blob cloudflare-d1/src/employee-core-native-v1.mjs 56db6f578cb1e96ac8d24cc3bbee414172fc755a
          check_blob tests/entry614_employee_content_native.test.mjs f8bf077f9f03eacdf660a81f5a2e3f2582fac98b

          grep -Fx 'CLOUD_AUTH_SHADOW_TTL_SECONDS = "43200"' cloudflare-d1/wrangler.toml
          grep -Fx 'TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fx 'TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -F 'const DEFAULT_TTL_SECONDS = 43200;' cloudflare-d1/src/cloud-auth-shadow-v1.mjs
          grep -F 'const MAX_TTL_SECONDS = 43200;' cloudflare-d1/src/cloud-auth-shadow-v1.mjs

          echo ENTRY616_EXACT_SOURCE_LOCK=PASS
          echo ENTRY616_SHADOW_TTL_12H_PRESERVED=YES
          echo ENTRY616_AUTH_ENV_OFF=YES
          echo ENTRY616_BRIDGE_ENV_OFF=YES

      - name: Full source qualification
        shell: bash
        run: |
          set -euo pipefail

          node --check cloudflare-d1/production-shadow/index.js
          node --check cloudflare-d1/src/index_v2.js
          node --check cloudflare-d1/src/cloud-auth-shadow-v1.mjs
          node --check cloudflare-d1/src/employee-ops-native-v1.mjs
          node --check cloudflare-d1/src/employee-content-native-v1.mjs
          node --check cloudflare-d1/src/employee-comms-native-v1.mjs
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --check cloudflare-d1/src/employee-core-native-v1.mjs

          node tests/entry614_employee_ops_native.test.mjs
          node tests/entry614_employee_content_native.test.mjs
          node tests/entry614_employee_comms_native.test.mjs
          node tests/entry614_employee_accounting_native.test.mjs
          node tests/entry614_zero_google_employee_business_coverage.test.mjs
          node tests/cloud_auth_shadow_idle_ttl_entry615a.test.mjs
          node tests/legacy_browser_transport_a61.test.mjs
          node tests/frontend_no_direct_google_transport_a61.test.mjs

          node tests/t12_general_create.test.mjs
          node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs
          node tests/t12_customer_master_a53.test.mjs
          node tests/frontend_t12_customer_cloud_only_a56.test.mjs
          node tests/frontend_orders_initial_edge_ready_entry577.test.mjs

          echo ENTRY616_ZERO_GOOGLE_BACKEND_QUALIFICATION=PASS
          echo ENTRY616_ORDERS_CUSTOMERS_REFRESH_REGRESSION=PASS

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Pre-deploy production gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx wrangler deployments list --name trendos-d1-api --json > /tmp/pre-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/pre-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('active-version-not-single-100');
          fs.writeFileSync('/tmp/pre-version.txt',full[0].id);
          console.log('ENTRY616_PRE_VERSION='+full[0].id);
          NODE
          test "$(cat /tmp/pre-version.txt)" = "$EXPECTED_PRE_VERSION"

          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --json --command "
          SELECT 'ops' AS family, mode FROM employee_ops_control_v1 WHERE singleton=1
          UNION ALL SELECT 'content', mode FROM employee_content_control_v1 WHERE singleton=1
          UNION ALL SELECT 'comms', mode FROM employee_comms_control_v1 WHERE singleton=1
          UNION ALL SELECT 'accounting', mode FROM employee_accounting_control_v1 WHERE singleton=1
          UNION ALL SELECT 'core', mode FROM employee_core_control_v1 WHERE singleton=1;
          " > /tmp/family-controls.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/family-controls.json','utf8'));
          const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(typeof v.family==='string'&&typeof v.mode==='string')rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          const expected=['ops','content','comms','accounting','core'];
          for(const f of expected){
            const r=rows.find(x=>x.family===f);
            if(!r||r.mode!=='OFF') throw new Error('family-control-not-off:'+f+':'+(r&&r.mode));
          }
          console.log('ENTRY616_ALL_FAMILY_CONTROLS_PREDEPLOY=OFF');
          NODE

          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" -o /tmp/auth-pre.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" -o /tmp/bridge-pre.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" -o /tmp/orders-pre.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" -o /tmp/customers-pre.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/line-runtime/health" -o /tmp/line-pre.json

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-pre.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge-pre.json'));
          const o=JSON.parse(fs.readFileSync('/tmp/orders-pre.json'));
          const c=JSON.parse(fs.readFileSync('/tmp/customers-pre.json'));
          const l=JSON.parse(fs.readFileSync('/tmp/line-pre.json'));
          if(a.mode!=='OFF'||a.envEnabled!==false) throw new Error('auth-pre-drift');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge-pre-drift');
          if(o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders-pre-drift');
          if(c.mode!=='GENERAL') throw new Error('customers-pre-drift');
          if(l.schemaReady!==true||l.legacySchemaReady!==true||l.writeMode!=='cloud-native+legacy-overlay') throw new Error('line-pre-drift');
          console.log('ENTRY616_PREDEPLOY_RUNTIME_BASELINE=PASS');
          NODE

          for p in ops content comms accounting core; do
            code="$(curl --silent --show-error --output /tmp/family-pre-$p.json --write-out '%{http_code}' "$PROD_URL/v1/employee/$p/health")"
            test "$code" = "404"
          done
          echo ENTRY616_FAMILY_HANDLERS_NOT_LIVE_PREDEPLOY=YES

      - name: Deploy code only and enforce postflight with rollback
        shell: bash
        run: |
          set -eEuo pipefail
          PRE_VERSION="$(cat /tmp/pre-version.txt)"
          DEPLOYED=0

          rollback_on_error() {
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              echo "ENTRY616_POSTFLIGHT_FAILED_ROLLING_BACK_TO=$PRE_VERSION"
              npx wrangler rollback "$PRE_VERSION" --message "Entry616 automatic rollback after failed Zero-Google OFF postflight" --config "$CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback_on_error ERR

          # Code-only: no migrations apply, no D1 writes, no secret writes, no Apps Script mutation.
          npx wrangler deploy --config "$CONFIG" | tee /tmp/entry616-deploy.log
          DEPLOYED=1

          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" -o /tmp/auth-post.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" -o /tmp/bridge-post.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" -o /tmp/orders-post.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" -o /tmp/customers-post.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/line-runtime/health" -o /tmp/line-post.json

          for p in ops content comms accounting core; do
            curl --fail --silent --show-error "$PROD_URL/v1/employee/$p/health" -o "/tmp/family-post-$p.json"
          done

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-post.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge-post.json'));
          const o=JSON.parse(fs.readFileSync('/tmp/orders-post.json'));
          const c=JSON.parse(fs.readFileSync('/tmp/customers-post.json'));
          const l=JSON.parse(fs.readFileSync('/tmp/line-post.json'));
          if(a.success!==true||a.mode!=='OFF'||a.envEnabled!==false) throw new Error('auth-post-drift');
          if(b.success!==true||b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge-post-drift');
          if(o.success!==true||o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders-post-drift');
          if(c.success!==true||c.mode!=='GENERAL') throw new Error('customers-post-drift');
          if(l.success!==true||l.schemaReady!==true||l.legacySchemaReady!==true||l.writeMode!=='cloud-native+legacy-overlay') throw new Error('line-post-drift');

          for(const f of ['ops','content','comms','accounting','core']){
            const x=JSON.parse(fs.readFileSync('/tmp/family-post-'+f+'.json'));
            if(x.success!==true||x.schemaReady!==true||String(x.mode||'')!=='OFF') throw new Error('family-health:'+f);
            if(Number(x.googleBusinessCalls||0)!==0||x.appsScriptBusinessAuthority!==false) throw new Error('family-google-authority:'+f);
          }
          console.log('ENTRY616_AUTH_OFF=PASS');
          console.log('ENTRY616_BRIDGE_OFF=PASS');
          console.log('ENTRY616_ORDERS_GENERAL_DUPLICATE_GUARD=PASS');
          console.log('ENTRY616_CUSTOMERS_GENERAL=PASS');
          console.log('ENTRY616_LINE_RUNTIME=PASS');
          console.log('ENTRY616_ALL_FAMILY_HANDLERS_LIVE_MODE_OFF=PASS');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --json --command "
          SELECT 'ops' AS family, mode FROM employee_ops_control_v1 WHERE singleton=1
          UNION ALL SELECT 'content', mode FROM employee_content_control_v1 WHERE singleton=1
          UNION ALL SELECT 'comms', mode FROM employee_comms_control_v1 WHERE singleton=1
          UNION ALL SELECT 'accounting', mode FROM employee_accounting_control_v1 WHERE singleton=1
          UNION ALL SELECT 'core', mode FROM employee_core_control_v1 WHERE singleton=1;
          " > /tmp/family-controls-post.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/family-controls-post.json','utf8'));
          const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(typeof v.family==='string'&&typeof v.mode==='string')rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          for(const f of ['ops','content','comms','accounting','core']){
            const r=rows.find(x=>x.family===f);
            if(!r||r.mode!=='OFF') throw new Error('post-family-control-not-off:'+f);
          }
          console.log('ENTRY616_ALL_FAMILY_CONTROLS_POSTDEPLOY=OFF');
          NODE

          curl --fail --silent --show-error "$FRONTEND_URL/trendos-edge-orders-read-v1.js" -o /tmp/frontend-edge.js
          grep -F 'postWriteBarrierRecoveries' /tmp/frontend-edge.js
          grep -F 'recoverPostWriteBarrier' /tmp/frontend-edge.js
          echo ENTRY616_REFRESH_FIX_PRESERVED=PASS

          npx wrangler deployments list --name trendos-d1-api --json > /tmp/post-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/post-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('post-active-version-not-single-100');
          if(full[0].id===process.env.EXPECTED_PRE_VERSION) throw new Error('deploy-did-not-create-new-active-version');
          console.log('ENTRY616_POST_VERSION='+full[0].id);
          console.log('ENTRY616_ZERO_GOOGLE_BACKEND_OFF_DEPLOY=PASS');
          NODE

          trap - ERR
          echo ENTRY616_PRODUCTION_MUTATION=API_CODE_ONLY
          echo ENTRY616_D1_MUTATION=NO
          echo ENTRY616_FAMILY_CONTROL_MUTATION=NO
          echo ENTRY616_APPS_SCRIPT_TOUCHED=NO
          echo ENTRY616_SECRET_WRITE=NO
