name: Printshop Ubuntu Offline Diagnostic Envelope V0 — NO_GO
on:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-ubuntu-no-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      PRINTSHOP_RUNTIME_ENABLED: 'false'
      PRINTSHOP_DIAGNOSTIC_REAL_HOST_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline diagnostic contract + negative proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test "$PRINTSHOP_RUNTIME_ENABLED" = 'false'
          test "$PRINTSHOP_DIAGNOSTIC_REAL_HOST_ALLOWED" = 'false'
          node --check autonomous-printshop/core/ubuntu-offline-diagnostic-envelope-v0.mjs
          node --check autonomous-printshop/core/ubuntu-signed-mock-evidence-v1.mjs
          node --test autonomous-printshop/tests/ubuntu_offline_diagnostic_envelope_v0.test.mjs
          node --test autonomous-printshop/tests/ubuntu_signed_mock_evidence_v1.test.mjs
          node --check autonomous-printshop/local-ubuntu/read-only-process-preview-v0.mjs
          node --check autonomous-printshop/local-ubuntu/manual-readonly-preview-v0.mjs
          node --test autonomous-printshop/tests/ubuntu_local_readonly_preview_v0.test.mjs
          echo 'LOCAL_UBUNTU_MANUAL_PREVIEW_NOT_RUN_IN_CI=TRUE'
          node --test autonomous-printshop/tests/trendos_autonomy_policy_v1.test.mjs
          echo 'PRINTSHOP_UBUNTU_DIAGNOSTIC=MOCK_ONLY_NOT_CONNECTED'
          echo 'PRINTSHOP_PRINTSERVER_REAL_PRODUCTION_QUALIFIED=FALSE'
          echo 'PRINTSHOP_REAL_HOST_COMMAND_EXECUTION=ZERO'
          echo 'FINANCE_RELEASE=NO_GO'
