name: ACC-157 A2.13 Timeout Monitor Offline Verification

on:
  push:
    branches:
      - fix/a213-custody-monitor-settlement-20261010
    paths:
      - 'tests/easystore_a213_timeout_monitor_regression.test.mjs'
      - 'tests/easystore_a213_custody_handler_mock_execution.test.mjs'
      - 'tests/easystore_a213_sqlite_migration_integration.test.mjs'
      - '.github/workflows/easystore-a213-custody-close-canary-execution.yml'
      - '.github/workflows/easystore-a213-timeout-regression-readonly.yml'

permissions:
  contents: read

jobs:
  no-finance-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original A2.13 financial guard and bounded monitor offline
        shell: bash
        run: |
          set -euo pipefail
          node tests/easystore_a213_custody_close_canary.test.mjs
          node tests/easystore_a213_custody_close_workflow_invariants.test.mjs
          node tests/easystore_a213_timeout_monitor_regression.test.mjs
          node tests/easystore_a213_custody_handler_mock_execution.test.mjs
          node --experimental-sqlite tests/easystore_a213_sqlite_migration_integration.test.mjs
          echo ACC157_D1_COMMANDS=ZERO
          echo ACC157_PRODUCTION_MUTATION=NO
      - name: Verify actual D1 accounting mode remains READONLY (GET only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --max-time 25 'https://trendos-d1-api.trendmall-contact.workers.dev/v1/employee/accounting/health' -o /tmp/a213-health.json
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const h=JSON.parse(fs.readFileSync('/tmp/a213-health.json','utf8'));
          assert.equal(h.success,true);
          assert.equal(h.mode,'READONLY');
          assert.equal(h.authoritativeWrites,false);
          assert.equal(Number(h.writeCanaryAllowedUserCount||0),0);
          assert.equal(Number(h.writeCanaryAllowedActionCount||0),0);
          assert.equal(Number(h.writeCanaryMaxCommands||0),0);
          assert.equal(Number(h.writeCanaryCommandsStarted||0),0);
          console.log('ACC157_DEPLOYED_READONLY_MODE=PASS');
          console.log('ACC157_DEPLOYED_FINANCE_WRITE_BUDGET=ZERO');
          console.log('ACC157_API_FINANCIAL_MUTATION=NO');
          NODE
