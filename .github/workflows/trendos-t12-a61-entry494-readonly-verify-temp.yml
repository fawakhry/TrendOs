name: TrendOS T12 A61 Entry494 ReadOnly Verify TEMP

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-entry494-readonly-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WORKER_NAME: trendos-d1-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current OFF checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" >/tmp/auth.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" >/tmp/bridge.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" >/tmp/customers.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" >/tmp/orders.json

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/customers.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/orders.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false||a.legacySessionEnrollEnabled!==false)process.exit(11);
          if(Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0)process.exit(12);
          if(!b.success||b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0)process.exit(13);
          if(!c.success||c.mode!=='GENERAL'||Number(c.customerCount||0)!==247)process.exit(14);
          if(!o.success||o.mode!=='GENERAL')process.exit(15);
          console.log('ENTRY494_AUTH_OFF=PASS');
          console.log('ENTRY494_NATIVE_USER_COUNT=0');
          console.log('ENTRY494_NATIVE_READY_COUNT=0');
          console.log('ENTRY494_BRIDGE_DISABLED=PASS');
          console.log('ENTRY494_CUSTOMER_MODE=GENERAL');
          console.log('ENTRY494_CUSTOMER_COUNT=247');
          console.log('ENTRY494_ORDER_CREATE_MODE=GENERAL');
          NODE

          cd cloudflare-d1
          npx --yes wrangler@4.33.2 d1 execute trendos-main --remote --config wrangler.toml --json             --command "SELECT marker,mode,policy_epoch FROM employee_auth_control_v1 WHERE singleton=1;" >/tmp/control.json
          cd ..
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/control.json','utf8'));const f=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.marker==='T12_EMPLOYEE_AUTH_V1')f.push(v);Object.values(v).forEach(walk)}};
          walk(x);if(f.length!==1||f[0].mode!=='OFF')process.exit(21);
          console.log('ENTRY494_D1_CONTROL=OFF');
          NODE

          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json >/tmp/deployments.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1)process.exit(31);
          console.log('ENTRY494_ACTIVE_DEPLOYMENT='+d.id);
          console.log('ENTRY494_ACTIVE_VERSION='+full[0].id);
          console.log('ENTRY494_VERIFY=SUCCESS');
          NODE
