name: T12 blocked order visible controlled UI release
on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Publish only the qualified four UI assets
permissions:
  contents: read
concurrency:
  group: trendos-controlled-release
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T12_WRANGLER_BIN: /tmp/t12-blocked-ui-tools/node_modules/.bin/wrangler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/t12-blocked-ui-tools --no-save wrangler@4.33.2
      - name: Qualify exact live UI or publish bounded patch
        env:
          DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        run: |
          if [ "$DEPLOY" = true ]; then
            python3 scripts/t12_blocked_order_frontend_release.py --deploy
          else
            python3 scripts/t12_blocked_order_frontend_release.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t12-blocked-order-ui-evidence
          path: /tmp/t12-blocked-order-ui-sanitized.json
          retention-days: 3
