name: "OWNER GO — disposable Zero Google customer Stage D1 create, migrate, bind; OFF"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/zg-owner-go-disposable-customer-d1-stage-provision-20261101.yml"
permissions:
  contents: read
concurrency:
  group: "zg-customer-stage-d1-20261101-one-time-unique"
  cancel-in-progress: false
jobs:
  create-isolated-d1-only:
    if: ${{ github.repository == 'fawakhry/TrendOs' && github.event.pull_request.number == 316 && github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'chore/zero-google-direct-cloudflare-stage-upload-v1-20261101' && github.base_ref == 'integration/zero-google-one-package-v1-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
      ZG_STAGE_D1_NAME: "trendos-zg-customer-stage-synthetic-20261101-v0"
      ZG_STAGE_WORKER: "trendos-customer-portal-isolated-stage-v0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard exact original Stage, absence of production access, and source tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git hash-object cloudflare-d1/wrangler.customer-stage.toml)" = "4e0c7f8275ff9cd89740f97b9f00c6d4d6cc75dd"
          test "$(git hash-object cloudflare-d1/customer-stage/index.mjs)" = "e5a4999934c774f70e555790b39f7eb0a19d9ddc"
          python3 tools/zero_google_direct_stage_upload_guard_v1.py > "$RUNNER_TEMP/zg-stage-d1-source-policy.json"
          python3 tests/zero_google_direct_stage_upload_guard_v1.test.py -v
          node tools/zero_google_one_package_v1.mjs > "$RUNNER_TEMP/zg-stage-one-package.json"
          ! grep -Eq '^\s*(route|routes|custom_domains|database_id|account_id)\s*=' cloudflare-d1/wrangler.customer-stage.toml
          echo "ZG_ISOLATED_STAGE_D1_PREWRITE_SAFETY=PASS"
      - name: Install Wrangler and independently verify existing Worker not public, no existing D1 binding
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/zg-stage-d1-wrangler" --no-save --no-audit --no-fund wrangler@4
          echo "ZG_WRANGLER=$RUNNER_TEMP/zg-stage-d1-wrangler/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,urllib.request,json
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; w=os.environ['ZG_STAGE_WORKER']
          base='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+w
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          sub=get(base+'/subdomain')
          if sub.get('success') is not True or sub.get('result',{}).get('enabled') is not False or sub.get('result',{}).get('previews_enabled') is not False:
              raise SystemExit('ISOLATED_WORKER_NOT_CONFIRMED_NONPUBLIC')
          settings=get(base+'/settings')
          if settings.get('success') is not True:raise SystemExit('ISOLATED_WORKER_SETTINGS_NOT_ACCESSIBLE')
          bindings=settings.get('result',{}).get('bindings') or []
          if any(b.get('type') in ('d1','r2_bucket','kv_namespace','service') or b.get('name')=='DB' for b in bindings):
              raise SystemExit('ISOLATED_WORKER_ALREADY_HAS_DATA_BINDINGS_STOP')
          print('EXISTING_ISOLATED_WORKER_NO_PUBLIC_TRAFFIC_AND_NO_D1_R2=VERIFIED')
          PY
      - name: Create only a new unique disposable synthetic D1 database (exact account)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.parse,urllib.error,json,re,pathlib,hashlib
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];n=os.environ['ZG_STAGE_D1_NAME']
          if not re.fullmatch(r'trendos-zg-customer-stage-synthetic-20261101-v0',n):
              raise SystemExit('UNAUTHORIZED_D1_NAME')
          url='https://api.cloudflare.com/client/v4/accounts/'+a+'/d1/database'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def call(url,body=None):
              req=urllib.request.Request(url,data=(json.dumps(body).encode() if body is not None else None),headers=headers,method='POST' if body is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:raw=json.load(r)
              except urllib.error.HTTPError as e:
                  print('D1_REMOTE_HTTP_STATUS='+str(e.code));raise SystemExit('D1_REMOTE_FAILED_NO_CROSS_DB_FALLBACK')
              if raw.get('success') is not True:
                  print('D1_REMOTE_API_ERROR_CODES='+','.join(str(x.get('code','?')) for x in raw.get('errors',[])))
                  raise SystemExit('D1_API_FAILED_NO_FALLBACK')
              return raw
          # Explicitly walk the account's paginated database inventory; never
          # overwrite or reuse a pre-existing name, even in other projects.
          found=[];page=1
          while True:
              raw=call(url+'?'+urllib.parse.urlencode({'page':page,'per_page':100}))
              found.extend(raw.get('result') or [])
              p=raw.get('result_info') or {}
              pages=int(p.get('total_pages') or 1)
              if page>=pages:break
              if page>=30:raise SystemExit('D1_LIST_TOO_MANY_PAGES_FAIL_CLOSED')
              page+=1
          if any(d.get('name')==n for d in found):
              raise SystemExit('D1_STAGE_NAME_ALREADY_EXISTS_STOP_NO_REUSE')
          raw=call(url,{'name':n,'read_replication':{'mode':'disabled'}})
          obj=raw.get('result') or {};ident=obj.get('uuid','')
          if obj.get('name')!=n or not re.fullmatch(r'[0-9a-fA-F-]{36}',ident) or any(d.get('uuid')==ident for d in found):
              raise SystemExit('D1_CREATED_IDENTITY_NOT_CERTIFIED_STOP')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'zg-stage-d1-created.json'
          p.write_text(json.dumps({'uuid':ident,'name':n}),encoding='utf8')
          p.chmod(0o600)
          print('ISOLATED_SYNTHETIC_D1_CREATED=YES')
          print('ISOLATED_D1_ID_SHA256_PREFIX='+hashlib.sha256(ident.encode()).hexdigest()[:12])
          print('EXISTING_D1_DATABASES_MODIFIED=NO')
          PY
      - name: Apply ten original customer portal/T12 isolated-only migrations to NEW D1
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          cfg=".wrangler-zg-stage-customer-d1-${GITHUB_RUN_ID}.toml"
          trap 'rm -f "$cfg"' EXIT
          python3 - "$cfg" <<'PY'
          import json,pathlib,sys
          original=pathlib.Path('wrangler.customer-stage.toml').read_text()
          j=json.loads((pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'zg-stage-d1-created.json').read_text())
          add='\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "'+j['name']+'"\ndatabase_id = "'+j['uuid']+'"\nmigrations_dir = "migrations"\n'
          pathlib.Path(sys.argv[1]).write_text(original+add)
          PY
          for m in             0005_t12_production_create_canary.sql             0006_t12_operational_runtime.sql             0008_t12_customer_master.sql             0013_employee_content_zero_google_v1.sql             0032_customer_portal_identity_foundation_v1.sql             0033_customer_portal_native_order_ownership_v1.sql             0036_customer_portal_native_draft_create_v1.sql             0037_customer_portal_native_draft_items_v1.sql             0038_customer_portal_native_draft_file_r2_v1.sql             0040_customer_portal_native_file_quarantine_v1.sql; do
            test -f "migrations/$m"
            "$ZG_WRANGLER" d1 execute "$ZG_STAGE_D1_NAME" --remote --yes               --config "$cfg" --file "migrations/$m"               > "$RUNNER_TEMP/zg-migration-$m.log" 2>&1 || {
                echo "::error::Failed scoped migration $m on NEW isolated D1 only"; exit 1;
              }
            echo "ISOLATED_NEW_D1_MIGRATION_APPLIED=$m"
          done
          echo "TEN_ORIGINAL_MIGRATIONS_ON_NEW_SYNTHETIC_D1=PASS"
      - name: Insert one explicitly fake customer in isolated database and verify source counters
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          cfg=".wrangler-zg-stage-customer-d1-${GITHUB_RUN_ID}.toml"
          trap 'rm -f "$cfg"' EXIT
          python3 - "$cfg" <<'PY'
          import json,pathlib,sys,os
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'zg-stage-d1-created.json').read_text())
          original=pathlib.Path('wrangler.customer-stage.toml').read_text()
          pathlib.Path(sys.argv[1]).write_text(original+'\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "'+j['name']+'"\ndatabase_id = "'+j['uuid']+'"\n')
          PY
          "$ZG_WRANGLER" d1 execute "$ZG_STAGE_D1_NAME" --remote --yes --config "$cfg"             --command "INSERT INTO t12_customers(customer_id,customer_name,customer_name_key,source,legacy_chat_code) VALUES('ZG-STAGE-SYNTHETIC-C1','SYNTHETIC ONLY','zg_stage_synthetic_only','cloud-native','ZG-STAGE-FAKE-PC-CODE');"             > "$RUNNER_TEMP/zg-insert-synthetic.log" 2>&1
          "$ZG_WRANGLER" d1 execute "$ZG_STAGE_D1_NAME" --remote --json --config "$cfg"             --command "SELECT (SELECT COUNT(*) FROM t12_customers WHERE customer_id='ZG-STAGE-SYNTHETIC-C1') AS fake_customer_count, (SELECT COUNT(*) FROM customer_portal_native_accounts_v1) AS real_enrolled_accounts, (SELECT mode FROM customer_portal_native_control_v1 WHERE singleton=1) AS portal_mode, (SELECT mode FROM t12_customer_control WHERE singleton=1) AS t12_mode;"              > "$RUNNER_TEMP/zg-remote-fixture-readback.json"
          python3 - <<'PY'
          import json,pathlib,os
          v=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'zg-remote-fixture-readback.json').read_text())
          rows=v if isinstance(v,list) else [v]
          data=[r for b in rows if isinstance(b,dict) for r in (b.get('results') or [])]
          if not any(r.get('fake_customer_count')==1 and r.get('real_enrolled_accounts')==0 and r.get('portal_mode')=='OFF' and r.get('t12_mode')=='OFF' for r in data):
              raise SystemExit('ISOLATED_D1_REMOTE_SYNTHETIC_FIXTURE_PARITY_FAILED')
          print('REMOTE_NEW_D1_ONLY_FAKE_CUSTOMER_COUNT=1')
          print('REAL_ENROLLED_CUSTOMERS_IN_NEW_D1=0')
          print('PORTAL_CONTROL_AND_T12_CONTROL=OFF')
          PY
      - name: Re-deploy ONLY existing nonpublic isolated Worker with exact NEW D1 binding
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          cfg=".wrangler-zg-stage-customer-d1-${GITHUB_RUN_ID}.toml"
          trap 'rm -f "$cfg"' EXIT
          python3 - "$cfg" <<'PY'
          import json,pathlib,sys,os
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'zg-stage-d1-created.json').read_text())
          original=pathlib.Path('wrangler.customer-stage.toml').read_text()
          pathlib.Path(sys.argv[1]).write_text(original+'\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "'+j['name']+'"\ndatabase_id = "'+j['uuid']+'"\n')
          PY
          "$ZG_WRANGLER" deploy --dry-run --config "$cfg" --outdir "$RUNNER_TEMP/zg-stage-d1-worker-bundle"             > "$RUNNER_TEMP/zg-stage-d1-worker-dry-run.log" 2>&1
          "$ZG_WRANGLER" deploy --config "$cfg"             > "$RUNNER_TEMP/zg-stage-d1-worker-deployed.log" 2>&1 || {
              echo "::error::Only isolated Worker binding deploy failed; NEW D1 still isolated, stop";exit 1;
            }
          echo "EXISTING_NONPUBLIC_CUSTOMER_STAGE_BOUND_TO_NEW_D1=YES"
      - name: Cloudflare independent post-deploy D1 UUID and nonpublic settings readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,json,pathlib
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];w=os.environ['ZG_STAGE_WORKER'];t=os.environ['CLOUDFLARE_API_TOKEN']
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'zg-stage-d1-created.json').read_text())
          head={'Authorization':'Bearer '+t}
          def get(p):
              with urllib.request.urlopen(urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+a+p,headers=head),timeout=30) as r:
                  v=json.load(r)
              if v.get('success') is not True:raise SystemExit('CLOUDFLARE_STAGE_REMOTE_READBACK_FAILED')
              return v.get('result')
          db=get('/d1/database/'+j['uuid'])
          if db.get('uuid')!=j['uuid'] or db.get('name')!=j['name']:
              raise SystemExit('ISOLATED_D1_REMOTE_IDENTITY_MISMATCH')
          sub=get('/workers/scripts/'+w+'/subdomain')
          if sub.get('enabled') is not False or sub.get('previews_enabled') is not False:
              raise SystemExit('WORKER_PUBLIC_OR_PREVIEW_MUST_BE_DISABLED')
          settings=get('/workers/scripts/'+w+'/settings')
          bindings=settings.get('bindings') or []
          db_bindings=[b for b in bindings if b.get('type')=='d1' or b.get('name')=='DB']
          if len(db_bindings)!=1 or db_bindings[0].get('name')!='DB' or db_bindings[0].get('id')!=j['uuid']:
              raise SystemExit('WORKER_BINDING_NOT_EXACTLY_CREATED_ISOLATED_D1')
          if any(b.get('type') in ('r2_bucket','kv_namespace','service') for b in bindings):
              raise SystemExit('OTHER_UNAPPROVED_BINDING_PRESENT')
          print('CLOUDFLARE_WORKER_D1_IDENTITY_VERIFIED_EXACT_REMOTE=YES')
          print('CLOUDFLARE_WORKERS_DEV_AND_PREVIEW_REMOTE_DISABLED=YES')
          print('CLOUDFLARE_PRODUCTION_D1_R2_NOT_TARGETED=YES')
          print('TEST_CUSTOMER_ONLY=YES')
          print('ACTUAL_CUSTOMER_GOOGLE_ACTIONS_RETIRED_LAST_PROVEN=0/9')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Isolated Zero Google customer Stage D1 successfully created, original schema imported and one fake customer only. Exact Worker DB binding ID verified via Cloudflare API. workers.dev/preview OFF. No production D1/R2 or Google cutover.\n')
          PY
