name: EasyStore A2.11 Post Frontend Publish Readonly Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a211-post-frontend-publish-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Verify live A2.11 closed state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$EASYSTORE_URL/config.js?a211post=$GITHUB_RUN_ID" > /tmp/config.js
          curl -fsSL "$EASYSTORE_URL/app.js?a211post=$GITHUB_RUN_ID" > /tmp/app.js
          curl -fsS "$API_URL/v1/employee/accounting/health?a211post=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses;
          " > /tmp/d1.json
          node <<'NODE'
          const fs=require('fs'),cfg=fs.readFileSync('/tmp/config.js','utf8'),app=fs.readFileSync('/tmp/app.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')),rows=[];
          const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(v.materials!==undefined)rows.push(v);Object.values(v).forEach(w)}};w(x);
          if(rows.length!==1)throw Error('count parse');const r=rows[0];
          const exp={materials:1,templates:1,parties:1,partyBalances:1,requestLedger:4,events:4,waste:0,stockMoves:0,partyLedger:0,cashbox:0,purchases:0,dailyPurchases:0,deptLines:0,finalInvoices:0,custodyEvents:0,custodyCloses:0,dayCloses:0};
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg))throw Error('frontend not OFF');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\[\]/.test(cfg))throw Error('frontend actions not empty');
          if(!/EASYSTORE_ACCOUNTING_D1_READONLY\s*=\s*true/.test(cfg)||!/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*false/.test(cfg))throw Error('frontend safety flags');
          if(!app.includes("const D1_ACCOUNTING_WRITE_ACTIONS = new Set(['saveAccountingWaste']);"))throw Error('A2.11 app not live');
          if(!app.includes("newAccountingRequestId('A211-WASTE')")||!app.includes("'A2-CANARY-WASTE-'")||!app.includes("amount:0.01"))throw Error('A2.11 synthetic path missing');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw Error('backend not READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)||Number(h.writeCanaryAllowedActionCount||0)||Number(h.writeCanaryMaxCommands||0)||Number(h.writeCanaryCommandsStarted||0))throw Error('server canary not cleared');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('google calls');
          for(const [k,v] of Object.entries(exp))if(Number(r[k]||0)!==v)throw Error('baseline '+k+'='+r[k]);
          console.log('A211_POST_FRONTEND_PUBLISH=PASS');
          console.log('A211_ISOLATED_FRONTEND_LIVE=YES');
          console.log('FRONTEND_MODE=OFF');
          console.log('FRONTEND_CANARY_ACTIONS=[]');
          console.log('BACKEND_MODE=READONLY');
          console.log('SERVER_USERS_ACTIONS=0/0');
          console.log('COMMAND_BUDGET=0/0');
          console.log('FOUR_CANARY_BASELINE=1/1/1/1/4/4');
          console.log('WASTE=0');
          console.log('GENERAL_OPENED=NO');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO');
          NODE
