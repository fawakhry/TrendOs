name: TrendOS Cloudflare Freshness Stability

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-cloudflare-freshness-stability.yml'
      - 'tests/cloudflare_freshness_sample.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      MAX_LIVE_MIRROR_AGE_SECONDS: '180'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Observe four consecutive live-sync windows
        shell: bash
        run: |
          set -euo pipefail
          for sample in 1 2 3 4; do
            curl --fail --silent --show-error --get \
              --data-urlencode 'name=الأوردرات' \
              --data-urlencode 'limit=1' \
              "$PREVIEW_URL/v1/mirror/sheet" > /tmp/orders.json
            curl --fail --silent --show-error --get \
              --data-urlencode 'name=بنود الأوردرات' \
              --data-urlencode 'limit=1' \
              "$PREVIEW_URL/v1/mirror/sheet" > /tmp/lines.json

            SAMPLE="$sample" \
            ORDERS_FILE=/tmp/orders.json \
            LINES_FILE=/tmp/lines.json \
            node tests/cloudflare_freshness_sample.mjs

            if [ "$sample" != '4' ]; then sleep 70; fi
          done

      - name: Stability conclusion
        run: |
          echo 'PASS: Orders + Lines stayed fresh and synchronized across four observation windows.'
          echo 'Read-only observation only; no D1 import/migration and no Apps Script mutation.'
