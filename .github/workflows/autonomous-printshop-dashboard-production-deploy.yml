# dashboard deployment recovery after interrupted/cancelled queue
name: Autonomous Printshop Dashboard Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/dashboard/**'
      - 'autonomous-printshop/core/owner-exception-model-v1.mjs'
      - 'autonomous-printshop/tests/dashboard_v1.test.mjs'
      - 'autonomous-printshop/tests/owner_exception_model_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-dashboard-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-dashboard-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/dashboard/wrangler.toml
      DASHBOARD_URL: https://autonomous-printshop-dashboard.trendmall-contact.workers.dev
      TRENDOS_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify dashboard read-only boundary
        run: |
          node autonomous-printshop/tests/owner_exception_model_v1.test.mjs
          node autonomous-printshop/tests/dashboard_v1.test.mjs

      - name: Main TrendOS pre-deploy health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/main-pre.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/main-pre.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_PREDEPLOY=PASS');
          NODE

      - name: Wrangler dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autonomous-printshop-dashboard-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config "$CONFIG" --outdir /tmp/autonomous-printshop-dashboard-build
          test -d /tmp/autonomous-printshop-dashboard-build
          echo 'DASHBOARD_DRYRUN=PASS'

      - name: Deploy isolated dashboard
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config "$CONFIG"
          sleep 5
          echo 'DASHBOARD_DEPLOYED=YES'

      - name: Verify dashboard health and upstream state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$DASHBOARD_URL/health" > /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$DASHBOARD_URL/state" > /tmp/state.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$DASHBOARD_URL/" > /tmp/page.html
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const page=fs.readFileSync('/tmp/page.html','utf8');
          if(h.success!==true||h.service!=='autonomous-printshop-dashboard') process.exit(1);
          if(h.mode!=='READ_ONLY_OWNER_EXCEPTION_CONSOLE') process.exit(2);
          if(h.businessWrites!==false||h.employeeAssignment!==false) process.exit(3);
          if(s.success!==true||s.mode!=='CONTROL_TOWER_SHADOW') process.exit(4);
          if(s.writesAccepted!==false||s.d1Mutation!==false||s.employeeAssignment!==false) process.exit(5);
          if(!s.employees||!s.employees.blockers||s.employees.blockers.control.mode!=='SHADOW') process.exit(8);
          if(Number(s.employees.blockers.eventRows||0)!==0) process.exit(9);
          if(Number(s.attentionSignals&&s.attentionSignals.employeeOpenBlockers||0)!==0) process.exit(10);
          const sig=s.attentionSignals||{};
          const model=s.ownerExceptionModel||{};
          const exceptions=Array.isArray(model.exceptions)?model.exceptions:[];
          const pending=Number(sig.commsPendingSignals||0);
          const commsException=exceptions.find(x=>x&&x.id==='COMMS_PENDING_RESPONSE');
          if(pending>0&&(!commsException||Number(commsException.count||0)!==pending||commsException.ownerActionRequired!==false||String(commsException.responsibleActor||'')!=='COMMS_AGENT')) process.exit(11);
          if(Number(sig.commsFeedbackDormantBacklog||0)>0&&Number(sig.commsFeedbackPending||0)!==0) process.exit(12);
          if(!model.authorityBoundaries||model.authorityBoundaries.commsSend!==false) process.exit(13);
          if(!page.includes('مركز إدارة المطبعة الذاتية')||!page.includes('قرارات تحتاج تدخلك')||!page.includes('رسائل تنتظر رد')) process.exit(6);
          console.log('DASHBOARD_LIVE=PASS');
          console.log('OWNER_CONSOLE_COMMS_PENDING='+String(pending));
          console.log('OWNER_CONSOLE_COMMS_SEND_AUTHORITY=NO');
          console.log('OWNER_CONSOLE_FEEDBACK_DORMANT_BACKLOG='+String(Number(sig.commsFeedbackDormantBacklog||0)));
          console.log('CONTROL_TOWER_UPSTREAM=PASS');
          console.log('DASHBOARD_MODE=READ_ONLY_OWNER_EXCEPTION_CONSOLE');
          console.log('OWNER_EXCEPTION_CONSOLE=PASS');
          NODE

      - name: Main TrendOS post-deploy health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/main-post.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/main-post.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_POSTDEPLOY=PASS');
          NODE

      - name: Safety conclusion
        run: |
          echo 'DASHBOARD=LIVE'
          echo 'OWNER_EXCEPTION_CONSOLE=LIVE'
          echo 'TRENDOS_MANAGER_CENTER_ROLE=MIGRATED_UI_RESPONSIBILITY'
          echo 'DATA_SOURCE=CONTROL_TOWER_SHADOW'
          echo 'D1_BINDING=NONE'
          echo 'BUSINESS_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
          echo 'AUTOPILOT_EXECUTION=NO'
