name: TrendOS Entry497 Manual Worker Bundle TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry497-manual-bundle-temp.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee3126404ff9afaa8b7cb09c19139732e84d69f6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Entry497 Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=dist/trendos-entry497-worker.js
          node --check dist/trendos-entry497-worker.js
          grep -F 'd1-auth-shadow-v1' dist/trendos-entry497-worker.js >/dev/null
          grep -F 'ORDERS_SESSION_MAX_TTL_SECONDS = 240' dist/trendos-entry497-worker.js >/dev/null
          grep -F '02CR_ENRICHMENT_STALE_ADVISORY' dist/trendos-entry497-worker.js >/dev/null
          sha256sum dist/trendos-entry497-worker.js | tee dist/trendos-entry497-worker.sha256
          echo 'ENTRY497_MANUAL_BUNDLE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: trendos-entry497-manual-worker
          path: |
            dist/trendos-entry497-worker.js
            dist/trendos-entry497-worker.sha256
          if-no-files-found: error
