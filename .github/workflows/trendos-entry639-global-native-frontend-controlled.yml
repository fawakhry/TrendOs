        run: |
          set -euo pipefail
          echo "ENTRY639_PRE_FRONTEND_VERSION=$(cat /tmp/pre-ui-version.txt)"
          echo "ENTRY639_POST_FRONTEND_VERSION=$(cat /tmp/post-ui-version.txt)"
          echo ENTRY639=PASS
          echo ENTRY639_GLOBAL_NATIVE_AUTH=true
          echo ENTRY639_NATIVE_READY=6_OF_6
          echo ENTRY639_BACKEND_NATIVE_ONLY=true
          echo ENTRY639_BACKEND_BOOTSTRAP=false
          echo ENTRY639_BACKEND_BRIDGE=false
          echo ENTRY639_FRONTEND_BRIDGE=false
          echo ENTRY639_ACCOUNTING=READONLY
