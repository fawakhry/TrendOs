name: TrendOS Entry639 Global Native Frontend Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry639-global-native-frontend-controlled.yml'

permissions:
  contents: write

concurrency:
  group: trendos-entry639-global-native-frontend-controlled
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      NEW_CONFIG_TAG: 20261007-entry639-global-native
      TARGET_BRANCH: candidate/t12-full-cloud-cutover-a56-20260929

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Exact Runtime and repository preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry639pre=$GITHUB_SHA-$(date +%s%N)" -o "/tmp/$f-pre.json"
          done

          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.success!==true||a.schemaReady!==true||a.mode!=='TRANSITIONAL'||a.envEnabled!==true||
             a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==true||
             Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||Number(a.mustChangeCount||0)!==0||
             a.plaintextStored!==false) throw new Error('auth preflight drift');
          if(b.success!==true||b.enabled!==false||b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false) throw new Error('bridge preflight drift');
          if(co.mode!=='READONLY'||Number(co.policyEpoch||0)!==1) throw new Error('core drift');
          if(ct.mode!=='READONLY'||Number(ct.policyEpoch||0)!==2) throw new Error('content drift');
          if(cm.mode!=='READONLY'||Number(cm.policyEpoch||0)!==2) throw new Error('comms drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting safety drift');
          console.log('ENTRY639_RUNTIME_PREFLIGHT=PASS');
          console.log('ENTRY639_NATIVE_READY=6_OF_6');
          console.log('ENTRY639_BACKEND_NATIVE_ONLY=true');
          console.log('ENTRY639_BACKEND_BOOTSTRAP=false');
          console.log('ENTRY639_BACKEND_BRIDGE=false');
          NODE

          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [];" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 69;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 0;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'OFF';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'OFF';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'OFF';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'OFF';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'OFF';" config.js
          git rev-parse HEAD:config.js > /tmp/repo-config-start.txt
          echo ENTRY639_REPO_DRIFT_BASELINE=PASS

      - name: Capture exact live frontend baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend active version shape '+JSON.stringify(full));
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY639_PRE_FRONTEND_VERSION='+full[0].id);
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry639pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry639pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry639pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry639pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry639pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry639pre=$suffix" -o /tmp/live-attendance.js

          cmp -s /tmp/live-dispatcher.js employee-api-dispatcher-v1.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;" /tmp/live-config.js
          grep -Fq "'شريف'" /tmp/live-config.js
          grep -Fq "'sherif'" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 0;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          echo ENTRY639_EXACT_LIVE_BASELINE=PASS

      - name: Build exact-live Global Native bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-dispatcher.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js

          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()

          replacements=[
            ("window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;","window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;"),
            ("window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;","window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;"),
            ("window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 0;","window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 0;"),
            ("window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;","window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 6;")
          ]
          for old,new in replacements:
              if s.count(old)!=1: raise SystemExit('anchor count '+old+'='+str(s.count(old)))
              s=s.replace(old,new,1)

          pat=r"window\.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS\s*=\s*\[[^;]*\];"
          if len(re.findall(pat,s))!=1: raise SystemExit('canary user list assignment count')
          s=re.sub(pat,"window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [];",s,count=1)

          if s.count("window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;")!=1: raise SystemExit('bridge flag drift')
          if s.count("window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];")!=1: raise SystemExit('bridge policies drift')

          p.write_text(s)
          PY

          export NEW_CONFIG="config.js?v=$NEW_CONFIG_TAG"
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          pat=r'config[.]js[?]v=[^"]+'
          if len(re.findall(pat,s))!=1: raise SystemExit('config cache tag count='+str(len(re.findall(pat,s))))
          p.write_text(re.sub(pat,os.environ['NEW_CONFIG'],s,count=1))
          PY

          node --check cloudflare-d1/frontend-dist/config.js
          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          cmp -s cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js /tmp/live-dispatcher.js

          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [];" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES = 0;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 6;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "config.js?v=$NEW_CONFIG_TAG" cloudflare-d1/frontend-dist/index.html
          echo ENTRY639_GLOBAL_NATIVE_BUNDLE=PASS

      - name: Deploy Global Native with automatic rollback
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry639 Global Native frontend automatic rollback" --config "$FRONTEND_CONFIG" || true
              echo ENTRY639_AUTOMATIC_ROLLBACK_ATTEMPTED=YES
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 25); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry639post=$suffix" -o /tmp/post-index.html \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry639post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry639post=$suffix" -o /tmp/post-dispatcher.js \
              && grep -Fq "config.js?v=$NEW_CONFIG_TAG" /tmp/post-index.html \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [];" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 6;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];" /tmp/post-config.js \
              && cmp -s /tmp/post-dispatcher.js /tmp/live-dispatcher.js; then
                OK=1
                echo "ENTRY639_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('/tmp/post-dispatcher.js','utf8');
          const calls=[];
          const realFetch=globalThis.fetch;
          const downstream=async(action,params)=>({success:true,source:'legacy-downstream',action});
          downstream.__trendosEdgeOrdersReadV1=true;
          const windowObject={
            MATBAGY_EMPLOYEE_NATIVE_AUTH_V1:true,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1:false,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS:[],
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES:0,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT:6,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1:false,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES:[],
            MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE:'GENERAL',
            MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_API_URL:process.env.API_URL,
            MATBAGY_EDGE_ORDERS_API_URL:process.env.API_URL,
            trendosSecureApiV1922:downstream
          };
          const tracked=async(url,options={})=>{calls.push(String(url));return realFetch(url,options);};
          const sandbox={window:windowObject,console,URL,Set,Map,JSON,Error,Number,Date,Promise,AbortController,TextEncoder,setTimeout,clearTimeout,setInterval,clearInterval,Response,fetch:tracked};
          vm.runInNewContext(source,sandbox,{filename:'entry639-live-dispatcher.js'});

          (async()=>{
            const username=String(process.env.QUALIFY_USERNAME||'').trim();
            const password=String(process.env.QUALIFY_PASSWORD||'');
            const out=await windowObject.trendosEmployeeApiV1('login',{username,password});
            const token=String(out&&out.user&&out.user.token||'').trim();
            if(out.success!==true||String(out.authSource||'')!=='d1-native-employee-v1'||!token) throw new Error('global Native login smoke failed');
            console.log('::add-mask::'+token);
            if(calls.some(u=>u.includes('/v1/employee/legacy-action'))) throw new Error('legacy bridge endpoint was called');
            console.log('ENTRY639_GLOBAL_NATIVE_LOGIN=PASS');
            console.log('ENTRY639_LEGACY_BRIDGE_CALLS=0');
            const logout=await windowObject.trendosEmployeeApiV1('logout',{username,token});
            if(logout.success!==true) throw new Error('global Native logout failed');
            console.log('ENTRY639_GLOBAL_NATIVE_LOGOUT=PASS');
          })().catch(e=>{console.error('ENTRY639_GLOBAL_NATIVE_SMOKE=FAIL '+String(e&&e.message||e));process.exit(31);});
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry639post=$GITHUB_SHA-$(date +%s%N)" -o "/tmp/$f-post.json"
          done

          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==true||
             Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||a.plaintextStored!==false) throw new Error('auth postflight drift');
          if(b.enabled!==false) throw new Error('bridge postflight drift');
          if(co.mode!=='READONLY'||Number(co.policyEpoch||0)!==1) throw new Error('core post drift');
          if(ct.mode!=='READONLY'||Number(ct.policyEpoch||0)!==2) throw new Error('content post drift');
          if(cm.mode!=='READONLY'||Number(cm.policyEpoch||0)!==2) throw new Error('comms post drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7) throw new Error('ops post drift');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting post safety drift');
          console.log('ENTRY639_RUNTIME_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend post version shape');
          fs.writeFileSync('/tmp/post-ui-version.txt',full[0].id);
          console.log('ENTRY639_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY639_GLOBAL_NATIVE_FRONTEND=PASS
          echo ENTRY639_GLOBAL_NATIVE_AUTH=ON
          echo ENTRY639_FRONTEND_CANARY=OFF
          echo ENTRY639_FRONTEND_BRIDGE=OFF
          echo ENTRY639_REQUIRED_NATIVE_READY=6
          echo ENTRY639_D1_MUTATION=NO
          echo ENTRY639_ACCOUNTING_TOUCHED=NO
          echo ENTRY639_EASYSTORE_TOUCHED=NO

      - name: Reconcile repository config with deployed Global Native state
        shell: bash
        run: |
          set -euo pipefail

          START_CFG="$(cat /tmp/repo-config-start.txt)"
          git fetch --quiet origin "$TARGET_BRANCH"
          REMOTE_CFG="$(git rev-parse "origin/$TARGET_BRANCH:config.js")"
          if [ "$REMOTE_CFG" != "$START_CFG" ]; then
            echo "ENTRY639_REPO_CONFIG_CONCURRENT_CHANGE=YES"
            exit 41
          fi

          cp /tmp/post-config.js config.js
          node --check config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [];" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 6;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" config.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "config: reconcile Entry639 Global Native frontend state"

          git fetch --quiet origin "$TARGET_BRANCH"
          REMOTE_CFG2="$(git rev-parse "origin/$TARGET_BRANCH:config.js")"
          if [ "$REMOTE_CFG2" != "$START_CFG" ]; then
            echo "ENTRY639_REPO_CONFIG_RACE=YES"
            exit 42
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

          echo ENTRY639_REPO_CONFIG_RECONCILED=PASS

