name: EasyStore A2 Schema No-pending Preflight

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a2-schema-no-pending-preflight.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Prove no repository migration is pending
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list "$DATABASE" --remote --config "$API_CONFIG" > /tmp/migrations.txt
          cat /tmp/migrations.txt
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT COUNT(*) AS n
              FROM pragma_table_info('employee_accounting_write_canary_v1')
             WHERE name IN ('max_commands','commands_started');
          " > /tmp/schema.json
          node <<'NODE'
          const fs=require('fs'),t=fs.readFileSync('/tmp/migrations.txt','utf8');
          if(!/No migrations to apply!/i.test(t))throw new Error('wrangler did not prove zero pending migrations');
          const x=JSON.parse(fs.readFileSync('/tmp/schema.json','utf8')), vals=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.n!==undefined)vals.push(Number(v.n));Object.values(v).forEach(walk);}};walk(x);
          if(vals.length!==1||vals[0]!==2)throw new Error('0030 canary budget schema not live');
          console.log('A2_SCHEMA_PENDING_MIGRATIONS=0');
          console.log('A2_SCHEMA_0030_COLUMNS=LIVE');
          console.log('PRODUCTION_MUTATION=NO');
          NODE
