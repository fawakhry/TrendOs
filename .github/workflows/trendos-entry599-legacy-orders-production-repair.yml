name: TrendOS Entry599 Legacy Orders Production Repair
# Owner authorized 2026-10-02: 0011 + API + reconcile exact 15 + frontend only

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry599-legacy-orders-production-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-entry599-legacy-orders-production-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_WORKER: trendos-d1-api
      UI_WORKER: trendos-ui
      CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
      PROD_API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PROD_UI_URL: https://trendos-ui.trendmall-contact.workers.dev
      TARGET_MIGRATION: 0011_t12_legacy_line_runtime.sql

      PRE_API_SOURCE: e7c61d1d6b1e5e7e3f5e9fef9d65077086fff534
      TARGET_SOURCE: c491d3ed9b7e87c5d5f7d7ee0a57e02c3e530281
      EXPECTED_PRE_API_VERSION: 23be0ab2-0a2b-4b81-bf54-e2f05f847989
      EXPECTED_PRE_API_SHA256: 2b78dea01c7e5892460ead4581915da9982208d60a41a95ce903beb742698f67
      EXPECTED_TARGET_API_SHA256: 7550c3a82b30acf0f34c52565568df8d7e7d6092ca322b36bbac7726256a0bc6
      EXPECTED_PRE_UI_VERSION: a26589a4-e2e0-4ed5-9abf-e1b19b56ce0e

    steps:
      - name: Checkout workflow branch tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact qualified target source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SOURCE }}
          path: qualified-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight exact authorized source and qualification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd qualified-source
          test "$(git rev-parse HEAD)" = "$TARGET_SOURCE"

          git diff --name-only "$PRE_API_SOURCE".."$TARGET_SOURCE" -- cloudflare-d1/ | sort > /tmp/api-delta.txt
          cat > /tmp/expected-api-delta.txt <<'EOF'
          cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql
          cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          cloudflare-d1/src/t12-legacy-line-runtime.mjs
          cloudflare-d1/src/t12-operational-runtime-handler.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-api-delta.txt
          diff -u /tmp/expected-api-delta.txt /tmp/api-delta.txt

          node --check cloudflare-d1/src/t12-legacy-line-runtime.mjs
          node --check cloudflare-d1/src/t12-operational-runtime-handler.mjs
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node --check trendos-edge-orders-read-v1.js
          node tests/t12_legacy_line_runtime_entry597.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/t12_read_overlay.test.mjs
          node tests/frontend_order_status_write_consistency_02cv.test.mjs
          node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs
          node tests/frontend_orders_initial_edge_ready_entry577.test.mjs

          grep -F 'MATBAGY_T12_LEGACY_LINE_RUNTIME_V1_ENABLED = true' config.js
          grep -F 'trendos-edge-orders-read-v1.js?v=20261002-legacy-line-runtime' config.js
          grep -F 'config.js?v=20261002-legacy-line-runtime' index.html
          grep -F "BASE+'/legacy-update'" cloudflare-d1/src/t12-operational-runtime-handler.mjs
          grep -F 'delivery-debt-restricted' cloudflare-d1/src/t12-operational-runtime-handler.mjs
          ! grep -Eiq '\b(DROP|ALTER)\b' cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql
          echo 'ENTRY599_SOURCE_QUALIFICATION=PASS'

      - name: Build exact API target
        shell: bash
        run: |
          set -euo pipefail
          cd qualified-source
          mkdir -p cloudflare-d1/dist
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js             --bundle --format=esm --platform=browser --target=es2022             --outfile=cloudflare-d1/dist/entry599-api-target.js
          node --check cloudflare-d1/dist/entry599-api-target.js
          sha="$(sha256sum cloudflare-d1/dist/entry599-api-target.js | awk '{print $1}')"
          test "$sha" = "$EXPECTED_TARGET_API_SHA256"
          echo "ENTRY599_TARGET_API_SHA256=$sha"

      - name: Preflight current Production versions settings and D1 invariants
        shell: bash
        run: |
          set -euo pipefail

          cd qualified-source
          npx --yes wrangler@$WRANGLER_VERSION deployments list --name "$API_WORKER" --json > /tmp/api-deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/api-deployments-before.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1||full[0].id!==process.env.EXPECTED_PRE_API_VERSION) throw new Error('API Production drift');
          fs.writeFileSync('/tmp/pre-api-deployment.txt',String(d.id));
          console.log('PRE_API_VERSION='+full[0].id);
          console.log('PRE_API_TRAFFIC=100');
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/pre-api-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER/content/v2"             -o /tmp/pre-api-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib,os
          hs=Path('/tmp/pre-api-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/pre-api-content.body').read_bytes(); payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower()
                  n=(p.get_param('name',header='content-disposition') or '').lower()
                  t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')): cand.append(d)
              if cand: payload=max(cand,key=len)
          else: payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          sha=hashlib.sha256(payload).hexdigest()
          if sha!=os.environ['EXPECTED_PRE_API_SHA256']: raise SystemExit('PRE_API_SHA_DRIFT')
          print('PRE_API_SHA256='+sha)
          PY

          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments"             > /tmp/ui-deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/ui-deployments-before.json','utf8'));
          const list=Array.isArray(body?.result?.deployments)?body.result.deployments:(Array.isArray(body?.result)?body.result:[]);
          if(!list.length) throw new Error('No UI deployment');
          const v=(list[0].versions||[]).map(x=>({id:String(x?.version_id||x?.id||''),p:Number(x?.percentage ?? x?.traffic_percentage ?? NaN)}));
          if(v.length!==1||v[0].id!==process.env.EXPECTED_PRE_UI_VERSION||v[0].p!==100) throw new Error('UI Production drift');
          fs.writeFileSync('/tmp/pre-ui-deployment.txt',String(list[0].id||''));
          console.log('PRE_UI_VERSION='+v[0].id);
          console.log('PRE_UI_TRAFFIC=100');
          NODE

          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER/settings"             -o /tmp/api-settings-before.json

          python3 - <<'PY'
          import json,tomllib
          from pathlib import Path
          x=json.loads(Path('/tmp/api-settings-before.json').read_text())
          if x.get('success') is not True or not x.get('result'): raise SystemExit('API_SETTINGS_INVALID')
          bindings=x['result'].get('bindings') or []
          by={str(b.get('name','')):b for b in bindings}
          cfg=tomllib.loads(Path('cloudflare-d1/wrangler.toml').read_text())
          for name,val in (cfg.get('vars') or {}).items():
              b=by.get(name)
              if not b or b.get('type') not in ('plain_text','json'): raise SystemExit('VAR_MISSING:'+name)
              live=str(b.get('text',b.get('value','')))
              if live!=str(val): raise SystemExit('VAR_DRIFT:'+name)
          db=by.get('DB')
          if not db or db.get('type')!='d1' or str(db.get('id',db.get('database_id','')))!='5c4b92bf-e043-4f6e-bd6d-d514a92cd825': raise SystemExit('DB_BINDING_DRIFT')
          normalized=[]
          for b in bindings:
              item={'name':str(b.get('name','')),'type':str(b.get('type',''))}
              if item['type'] in ('plain_text','json'): item['value']=str(b.get('text',b.get('value','')))
              elif item['type']=='d1': item['id']=str(b.get('id',b.get('database_id','')))
              normalized.append(item)
          normalized.sort(key=lambda z:(z['name'],z['type']))
          Path('/tmp/api-bindings-before.json').write_text(json.dumps(normalized,sort_keys=True,separators=(',',':')))
          print('PRE_API_BINDINGS=PASS')
          PY

          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/pre-migrations.txt 2>&1
          mapfile -t pending < <(grep -oE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/pre-migrations.txt | sort -u || true)
          test "${#pending[@]}" -eq 1
          test "${pending[0]}" = "$TARGET_MIGRATION"

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS legacy_runtime_present FROM sqlite_master WHERE type='table' AND name='t12_legacy_line_runtime'; SELECT headers_json AS headersJson,synced_at AS syncedAt,row_count AS rowCount,source_last_row AS sourceLastRow FROM sheet_catalog WHERE sheet_name='بنود الأوردرات' LIMIT 1; SELECT row_number AS rowNumber,display_json AS displayJson FROM sheet_rows WHERE sheet_name='بنود الأوردرات' ORDER BY row_number;"             > /tmp/pre-d1.json

          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/pre-d1.json','utf8'));let present=[],catalog=null,rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'legacy_runtime_present'))present.push(v);if(v.headersJson)catalog=v;if(v.displayJson)rows.push(v);Object.values(v).forEach(walk)}};
          walk(raw);
          if(!present.length||Number(present[0].legacy_runtime_present)!==0) throw new Error('legacy runtime table already exists');
          if(!catalog||String(catalog.syncedAt)!=='2026-09-26 18:33:08'||Number(catalog.rowCount)!==768||Number(catalog.sourceLastRow)!==768) throw new Error('mirror baseline drift');
          const hidden=new Set(['جاهز للاستلام','تم التسليم','مكرر','تم التنفيذ','جاهز للطباعة','ملغى','ملغي']);
          const active=[];
          for(const r of rows){
            if(Number(r.rowNumber||0)<=1) continue;
            const d=JSON.parse(r.displayJson||'[]');
            const status=String(d[10]??'').trim()||'طلب جديد';
            if(!hidden.has(status)) active.push({row:Number(r.rowNumber),orderId:String(d[0]??'').trim(),lineId:String(d[5]??'').trim(),status});
          }
          const expected=['TM2606150097','TM2606150098','TM2606150105','TM2606160146','4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321'].sort();
          const got=active.map(x=>x.orderId).sort();
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('stale active set drift '+JSON.stringify(active));
          fs.writeFileSync('/tmp/stale-active-before.json',JSON.stringify(active));
          console.log('PRE_STALE_ACTIVE_EXACT_15=YES');
          NODE

          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/create/health" > /tmp/pre-create-health.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pre-create-health.json','utf8'));
          if(x.success!==true||x.mode!=='GENERAL'||x.duplicateGuardReady!==true) throw new Error('create health drift');
          console.log('PRE_CREATE_HEALTH=PASS');
          NODE

      - name: Apply only migration 0011
        shell: bash
        run: |
          set -euo pipefail
          cd qualified-source
          npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply "$DATABASE" --remote --config "$CONFIG" | tee /tmp/migration-0011.txt

          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/post-migrations.txt 2>&1
          if grep -qE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/post-migrations.txt; then
            cat /tmp/post-migrations.txt
            exit 1
          fi

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('t12_legacy_line_runtime','t12_legacy_line_runtime_events') ORDER BY name; SELECT COUNT(*) AS runtime_rows FROM t12_legacy_line_runtime; SELECT COUNT(*) AS event_rows FROM t12_legacy_line_runtime_events;"             > /tmp/post-migration.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/post-migration.json','utf8'));const names=[],counts={};
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.name)names.push(String(v.name));for(const k of ['runtime_rows','event_rows'])if(Object.prototype.hasOwnProperty.call(v,k))counts[k]=Number(v[k]);Object.values(v).forEach(walk)}};
          walk(x);
          if(JSON.stringify(names.sort())!==JSON.stringify(['t12_legacy_line_runtime','t12_legacy_line_runtime_events'])) throw new Error('0011 tables missing');
          if(counts.runtime_rows!==0||counts.event_rows!==0) throw new Error('0011 tables unexpectedly nonempty');
          console.log('MIGRATION_0011_APPLIED=YES');
          console.log('LEGACY_RUNTIME_INITIAL_ROWS=0');
          NODE

      - name: Deploy exact API target only preserving settings
        shell: bash
        run: |
          set -euo pipefail
          cd qualified-source/cloudflare-d1
          python3 - <<'PY'
          from pathlib import Path
          c=Path('wrangler.toml').read_text()
          c=c.replace('main = "production-shadow/index.js"','main = "dist/entry599-api-target.js"')
          c=c.replace('workers_dev = true','workers_dev = true\nkeep_vars = true\nno_bundle = true')
          if 'main = "dist/entry599-api-target.js"' not in c: raise SystemExit(2)
          if 'keep_vars = true' not in c or 'no_bundle = true' not in c: raise SystemExit(3)
          Path('wrangler.entry599-prod.toml').write_text(c)
          PY

          npx --yes wrangler@$WRANGLER_VERSION deploy             --config wrangler.entry599-prod.toml             --keep-vars --no-bundle | tee /tmp/api-deploy.txt
          echo 'ENTRY599_API_DEPLOY_COMMAND=PASS'

      - name: Verify API exact target live before business reconcile
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          cd qualified-source

          npx --yes wrangler@$WRANGLER_VERSION deployments list --name "$API_WORKER" --json > /tmp/api-deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/api-deployments-after.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1||full[0].id===process.env.EXPECTED_PRE_API_VERSION) throw new Error('API target not active');
          fs.writeFileSync('/tmp/post-api-version.txt',full[0].id);
          fs.writeFileSync('/tmp/post-api-deployment.txt',String(d.id));
          console.log('POST_API_VERSION='+full[0].id);
          console.log('POST_API_TRAFFIC=100');
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/post-api-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER/content/v2"             -o /tmp/post-api-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib,os
          hs=Path('/tmp/post-api-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/post-api-content.body').read_bytes();payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower(); n=(p.get_param('name',header='content-disposition') or '').lower(); t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')): cand.append(d)
              if cand: payload=max(cand,key=len)
          else: payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          sha=hashlib.sha256(payload).hexdigest()
          if sha!=os.environ['EXPECTED_TARGET_API_SHA256']: raise SystemExit('TARGET_API_SHA_MISMATCH')
          print('POST_API_SHA256='+sha)
          PY

          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/line-runtime/health" > /tmp/runtime-health-before-reconcile.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/create/health" > /tmp/create-health-after-api.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/runtime-health-before-reconcile.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/create-health-after-api.json','utf8'));
          if(r.success!==true||r.schemaReady!==true||r.nativeSchemaReady!==true||r.legacySchemaReady!==true||r.writeMode!=='cloud-native+legacy-overlay') throw new Error('legacy runtime health not ready');
          if(c.success!==true||c.mode!=='GENERAL'||c.duplicateGuardReady!==true) throw new Error('create health regressed');
          console.log('POST_API_LEGACY_RUNTIME_HEALTH=PASS');
          console.log('POST_API_DUPLICATE_GUARD=PASS');
          NODE

      - name: Reconcile exactly the verified 15 delivered legacy lines
        shell: bash
        run: |
          set -euo pipefail
          cd qualified-source

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS runtime_rows FROM t12_legacy_line_runtime; SELECT COUNT(*) AS matching_rows FROM sheet_rows WHERE sheet_name='بنود الأوردرات' AND CAST(json_extract(display_json,'\$[0]') AS TEXT) IN ('TM2606150097','TM2606150098','TM2606150105','TM2606160146','4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321');"             > /tmp/reconcile-pre.json

          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/reconcile-pre.json','utf8'));let runtime=null,matching=null;
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'runtime_rows'))runtime=Number(v.runtime_rows);if(Object.prototype.hasOwnProperty.call(v,'matching_rows'))matching=Number(v.matching_rows);Object.values(v).forEach(walk)}};
          walk(x);
          if(runtime!==0) throw new Error('legacy runtime not empty before reconcile');
          if(matching!==15) throw new Error('exact mirror target count drift: '+matching);
          console.log('RECONCILE_PRECHECK=PASS');
          NODE

          cat > /tmp/reconcile-runtime.sql <<'SQL'
          INSERT INTO t12_legacy_line_runtime
          (line_id,order_id,status,notes,source_row_number,source_mirror_synced_at,updated_by,update_source,version,updated_at)
          SELECT
            CAST(json_extract(display_json,'$[5]') AS TEXT),
            CAST(json_extract(display_json,'$[0]') AS TEXT),
            'تم التسليم',
            CASE CAST(json_extract(display_json,'$[0]') AS TEXT)
              WHEN '4317' THEN '@koko.1072'
              ELSE ''
            END,
            row_number,
            (SELECT synced_at FROM sheet_catalog WHERE sheet_name='بنود الأوردرات'),
            'owner-authorized-entry599',
            'verified-reconciliation',
            1,
            CURRENT_TIMESTAMP
          FROM sheet_rows
          WHERE sheet_name='بنود الأوردرات'
            AND CAST(json_extract(display_json,'$[0]') AS TEXT) IN (
              'TM2606150097','TM2606150098','TM2606150105','TM2606160146',
              '4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321'
            );
          SQL

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --file /tmp/reconcile-runtime.sql

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS runtime_rows,COUNT(DISTINCT order_id) AS order_count,SUM(CASE WHEN status='تم التسليم' THEN 1 ELSE 0 END) AS delivered_count,SUM(CASE WHEN update_source='verified-reconciliation' THEN 1 ELSE 0 END) AS reconcile_count FROM t12_legacy_line_runtime; SELECT order_id AS orderId,line_id AS lineId,status,notes,source_row_number AS sourceRowNumber,update_source AS updateSource FROM t12_legacy_line_runtime ORDER BY source_row_number;"             > /tmp/reconcile-runtime-post.json

          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/reconcile-runtime-post.json','utf8'));let summary=null,rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'runtime_rows'))summary=v;if(v.orderId)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(!summary||Number(summary.runtime_rows)!==15||Number(summary.order_count)!==15||Number(summary.delivered_count)!==15||Number(summary.reconcile_count)!==15) throw new Error('runtime reconcile count mismatch');
          const expected=['TM2606150097','TM2606150098','TM2606150105','TM2606160146','4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321'].sort();
          if(JSON.stringify(rows.map(r=>String(r.orderId)).sort())!==JSON.stringify(expected)) throw new Error('runtime reconcile identity mismatch');
          const r4317=rows.find(r=>String(r.orderId)==='4317');
          if(!r4317||String(r4317.notes)!=='@koko.1072') throw new Error('4317 note not preserved');
          console.log('LEGACY_RUNTIME_RECONCILED=15');
          console.log('LEGACY_RUNTIME_DELIVERED=15');
          console.log('ORDER_4317_NOTE_PRESERVED=YES');
          NODE

          cat > /tmp/reconcile-events.sql <<'SQL'
          INSERT INTO t12_legacy_line_runtime_events
          (order_id,line_id,event_type,old_status,new_status,actor,source_row_number,payload_json)
          SELECT
            order_id,line_id,'verified-reconciliation','طلب جديد','تم التسليم',
            'owner-authorized-entry599',source_row_number,
            '{"entry":"Entry599","reason":"owner-confirmed-delivered-during-platform-outage"}'
          FROM t12_legacy_line_runtime
          WHERE update_source='verified-reconciliation';
          SQL

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --file /tmp/reconcile-events.sql

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS event_rows,SUM(CASE WHEN event_type='verified-reconciliation' AND new_status='تم التسليم' THEN 1 ELSE 0 END) AS verified_events FROM t12_legacy_line_runtime_events;"             > /tmp/reconcile-events-post.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/reconcile-events-post.json','utf8'));let row=null;
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'event_rows'))row=v;Object.values(v).forEach(walk)}};
          walk(x);
          if(!row||Number(row.event_rows)!==15||Number(row.verified_events)!==15) throw new Error('event reconciliation mismatch');
          console.log('LEGACY_RUNTIME_RECONCILE_EVENTS=15');
          NODE

      - name: Build exact frontend package and adapted direct version uploader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/entry599
          mkdir -p dist/entry599/frontend-dist
          for f in qualified-source/*.html qualified-source/*.js qualified-source/*.css; do
            if [ -f "$f" ]; then cp "$f" dist/entry599/frontend-dist/; fi
          done
          cp qualified-source/cloudflare-d1/src/frontend-static-worker.mjs dist/entry599/frontend-static-worker.mjs

          cp qualified-source/tools/trendos-entry594-direct-version-upload.mjs /tmp/entry599-upload.mjs
          sed -i "s/20261001-duplicate-order-guard-ui/20261002-legacy-line-runtime/g" /tmp/entry599-upload.mjs
          sed -i "s/6a9cd90649cfa0ac75b25b725d53e9f779bb2c61/c491d3ed9b7e87c5d5f7d7ee0a57e02c3e530281/g" /tmp/entry599-upload.mjs
          sed -i "s/TrendOS duplicate-order guard UI/TrendOS legacy-line runtime UI/g" /tmp/entry599-upload.mjs

          grep -F 'config.js?v=20261002-legacy-line-runtime' dist/entry599/frontend-dist/index.html
          grep -F 'trendos-edge-orders-read-v1.js?v=20261002-legacy-line-runtime' dist/entry599/frontend-dist/config.js
          grep -F 'MATBAGY_T12_LEGACY_LINE_RUNTIME_V1_ENABLED = true' dist/entry599/frontend-dist/config.js
          grep -F "T12_LEGACY_RUNTIME_UPDATE_PATH = '/v1/t12/orders/line-runtime/legacy-update'" dist/entry599/frontend-dist/trendos-edge-orders-read-v1.js
          grep -F 'تم منع إنشاء أوردر مكرر' dist/entry599/frontend-dist/trendos-edge-orders-read-v1.js
          grep -F 'recoverPostWriteBarrier' dist/entry599/frontend-dist/trendos-edge-orders-read-v1.js
          echo 'ENTRY599_FRONTEND_PACKAGE=PASS'

      - name: Recheck current frontend then create target version with zero traffic
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments"             > /tmp/ui-deployments-mid.json
          node <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/ui-deployments-mid.json','utf8'));
          const list=Array.isArray(b?.result?.deployments)?b.result.deployments:(Array.isArray(b?.result)?b.result:[]);
          if(!list.length) throw new Error('No UI deployment');
          const v=(list[0].versions||[]).map(x=>({id:String(x?.version_id||x?.id||''),p:Number(x?.percentage ?? x?.traffic_percentage ?? NaN)}));
          if(v.length!==1||v[0].id!==process.env.EXPECTED_PRE_UI_VERSION||v[0].p!==100) throw new Error('UI drift before version create');
          console.log('FRONTEND_PRECREATE_GUARD=PASS');
          NODE

          node /tmp/entry599-upload.mjs dist/entry599 | tee /tmp/ui-version-create.txt
          grep -F 'ENTRY594_VERSION_CREATED=YES' /tmp/ui-version-create.txt
          grep -F 'TRAFFIC_CHANGED=NO' /tmp/ui-version-create.txt
          version_id="$(grep -E '^VERSION_ID=[0-9a-f-]+$' /tmp/ui-version-create.txt | tail -1 | cut -d= -f2)"
          test -n "$version_id"
          echo "$version_id" > /tmp/target-ui-version.txt
          echo "TARGET_UI_VERSION=$version_id"

      - name: Promote exact frontend target to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat /tmp/target-ui-version.txt)"

          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments"             > /tmp/ui-deployments-prepromote.json

          TARGET="$target" node <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/ui-deployments-prepromote.json','utf8'));
          const list=Array.isArray(b?.result?.deployments)?b.result.deployments:(Array.isArray(b?.result)?b.result:[]);
          const v=(list[0]?.versions||[]).map(x=>({id:String(x?.version_id||x?.id||''),p:Number(x?.percentage ?? x?.traffic_percentage ?? NaN)}));
          if(v.length!==1||v[0].id!==process.env.EXPECTED_PRE_UI_VERSION||v[0].p!==100) throw new Error('UI drift before promote');
          console.log('FRONTEND_PREPROMOTE_GUARD=PASS');
          NODE

          cat > /tmp/ui-promote.json <<JSON
          {"strategy":"percentage","versions":[{"version_id":"$target","percentage":100}]}
          JSON

          code="$(curl --silent --show-error --output /tmp/ui-promote-response.json --write-out '%{http_code}'             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/ui-promote.json             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments")"
          test "$code" -ge 200
          test "$code" -lt 300
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/ui-promote-response.json','utf8'));
          if(x.success!==true) throw new Error('UI promote failed');
          if(x?.result?.id) fs.writeFileSync('/tmp/post-ui-deployment.txt',String(x.result.id));
          console.log('FRONTEND_PROMOTE_ACCEPTED=YES');
          NODE

      - name: Final read-only Production postflight
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          cd qualified-source

          target_ui="$(cat /tmp/target-ui-version.txt)"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments"             > /tmp/ui-deployments-after.json

          TARGET_UI="$target_ui" node <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/ui-deployments-after.json','utf8'));
          const list=Array.isArray(b?.result?.deployments)?b.result.deployments:(Array.isArray(b?.result)?b.result:[]);
          if(!list.length) throw new Error('No post UI deployment');
          const v=(list[0].versions||[]).map(x=>({id:String(x?.version_id||x?.id||''),p:Number(x?.percentage ?? x?.traffic_percentage ?? NaN)}));
          if(v.length!==1||v[0].id!==process.env.TARGET_UI||v[0].p!==100) throw new Error('UI target not sole active version');
          fs.writeFileSync('/tmp/post-ui-version.txt',v[0].id);
          fs.writeFileSync('/tmp/post-ui-deployment-final.txt',String(list[0].id||''));
          console.log('POST_UI_VERSION='+v[0].id);
          console.log('POST_UI_TRAFFIC=100');
          NODE

          root_code="$(curl --silent --show-error --output /tmp/live-root.html --write-out '%{http_code}' "$PROD_UI_URL/?entry599=1")"
          config_code="$(curl --silent --show-error --output /tmp/live-config.js --write-out '%{http_code}' "$PROD_UI_URL/config.js?v=20261002-legacy-line-runtime")"
          edge_code="$(curl --silent --show-error --output /tmp/live-edge.js --write-out '%{http_code}' "$PROD_UI_URL/trendos-edge-orders-read-v1.js?v=20261002-legacy-line-runtime")"
          app_code="$(curl --silent --show-error --output /tmp/live-app.js --write-out '%{http_code}' "$PROD_UI_URL/app.js?v=20261001-initial-edge-ready")"
          test "$root_code" = 200
          test "$config_code" = 200
          test "$edge_code" = 200
          test "$app_code" = 200

          grep -F 'config.js?v=20261002-legacy-line-runtime' /tmp/live-root.html
          grep -F 'trendos-edge-orders-read-v1.js?v=20261002-legacy-line-runtime' /tmp/live-config.js
          grep -F 'MATBAGY_T12_LEGACY_LINE_RUNTIME_V1_ENABLED = true' /tmp/live-config.js
          grep -F "T12_LEGACY_RUNTIME_UPDATE_PATH = '/v1/t12/orders/line-runtime/legacy-update'" /tmp/live-edge.js
          grep -F 'تم منع إنشاء أوردر مكرر' /tmp/live-edge.js
          grep -F 'recoverPostWriteBarrier' /tmp/live-edge.js
          grep -F 'function loadInitialRowsWhenEdgeReady()' /tmp/live-app.js

          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/line-runtime/health" > /tmp/final-runtime-health.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/create/health" > /tmp/final-create-health.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/customers/write/health" > /tmp/final-customer-health.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/employee/auth/health" > /tmp/final-auth-health.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/employee/legacy-action/health" > /tmp/final-bridge-health.json

          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/final-runtime-health.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/final-create-health.json','utf8'));
          const cu=JSON.parse(fs.readFileSync('/tmp/final-customer-health.json','utf8'));
          const a=JSON.parse(fs.readFileSync('/tmp/final-auth-health.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/final-bridge-health.json','utf8'));
          if(r.success!==true||r.legacySchemaReady!==true||r.writeMode!=='cloud-native+legacy-overlay') throw new Error('runtime health failed');
          if(c.success!==true||c.mode!=='GENERAL'||c.duplicateGuardReady!==true) throw new Error('create health failed');
          if(cu.success!==true||cu.mode!=='GENERAL') throw new Error('customer health failed');
          if(a.success!==true||a.mode!=='OFF'||a.envEnabled!==false||a.nativeOnly!==false) throw new Error('auth state changed');
          if(b.success!==true||b.enabled!==false) throw new Error('bridge state changed');
          console.log('FINAL_HEALTHS=PASS');
          NODE

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS runtime_rows,COUNT(DISTINCT order_id) AS order_count,SUM(CASE WHEN status='تم التسليم' THEN 1 ELSE 0 END) AS delivered_count,SUM(CASE WHEN update_source='verified-reconciliation' THEN 1 ELSE 0 END) AS reconcile_count FROM t12_legacy_line_runtime; SELECT COUNT(*) AS event_rows,SUM(CASE WHEN event_type='verified-reconciliation' AND new_status='تم التسليم' THEN 1 ELSE 0 END) AS verified_events FROM t12_legacy_line_runtime_events; SELECT synced_at AS mirrorSyncedAt,row_count AS rowCount,source_last_row AS sourceLastRow FROM sheet_catalog WHERE sheet_name='بنود الأوردرات'; SELECT order_id AS orderId,line_id AS lineId,status,notes FROM t12_legacy_line_runtime ORDER BY source_row_number;"             > /tmp/final-d1.json

          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/final-d1.json','utf8'));let runtime=null,events=null,catalog=null,rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'runtime_rows'))runtime=v;if(Object.prototype.hasOwnProperty.call(v,'event_rows'))events=v;if(v.mirrorSyncedAt)catalog=v;if(v.orderId)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(!runtime||Number(runtime.runtime_rows)!==15||Number(runtime.order_count)!==15||Number(runtime.delivered_count)!==15||Number(runtime.reconcile_count)!==15) throw new Error('final runtime mismatch');
          if(!events||Number(events.event_rows)!==15||Number(events.verified_events)!==15) throw new Error('final events mismatch');
          if(!catalog||String(catalog.mirrorSyncedAt)!=='2026-09-26 18:33:08'||Number(catalog.rowCount)!==768||Number(catalog.sourceLastRow)!==768) throw new Error('base mirror changed');
          const expected=['TM2606150097','TM2606150098','TM2606150105','TM2606160146','4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321'].sort();
          if(JSON.stringify(rows.map(r=>String(r.orderId)).sort())!==JSON.stringify(expected)) throw new Error('final identity mismatch');
          if(rows.some(r=>String(r.status)!=='تم التسليم')) throw new Error('final status mismatch');
          const x4317=rows.find(r=>String(r.orderId)==='4317');
          if(!x4317||String(x4317.notes)!=='@koko.1072') throw new Error('4317 note lost');
          console.log('FINAL_LEGACY_RUNTIME_ROWS=15');
          console.log('FINAL_LEGACY_RUNTIME_DELIVERED=15');
          console.log('FINAL_RECONCILE_EVENTS=15');
          console.log('FINAL_BASE_MIRROR_UNCHANGED=YES');
          console.log('FINAL_4317_NOTE_PRESERVED=YES');
          NODE

          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER/settings"             -o /tmp/api-settings-after.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/api-settings-after.json').read_text())
          if x.get('success') is not True or not x.get('result'): raise SystemExit('POST_API_SETTINGS_INVALID')
          bindings=x['result'].get('bindings') or []
          normalized=[]
          for b in bindings:
              item={'name':str(b.get('name','')),'type':str(b.get('type',''))}
              if item['type'] in ('plain_text','json'): item['value']=str(b.get('text',b.get('value','')))
              elif item['type']=='d1': item['id']=str(b.get('id',b.get('database_id','')))
              normalized.append(item)
          normalized.sort(key=lambda z:(z['name'],z['type']))
          post=json.dumps(normalized,sort_keys=True,separators=(',',':'))
          pre=Path('/tmp/api-bindings-before.json').read_text()
          if post!=pre: raise SystemExit('API_BINDINGS_CHANGED')
          print('FINAL_API_BINDINGS_VARIABLES_SECRET_PRESENCE_UNCHANGED=YES')
          PY

          echo 'ENTRY599_PRODUCTION_REPAIR=PASS'
          echo "ACTIVE_API_VERSION=$(cat /tmp/post-api-version.txt)"
          echo "ACTIVE_API_DEPLOYMENT=$(cat /tmp/post-api-deployment.txt)"
          echo "ACTIVE_API_SHA256=$EXPECTED_TARGET_API_SHA256"
          echo "ACTIVE_UI_VERSION=$(cat /tmp/post-ui-version.txt)"
          echo "ACTIVE_UI_DEPLOYMENT=$(cat /tmp/post-ui-deployment-final.txt)"
          echo 'MIGRATION_0011_APPLIED=YES'
          echo 'LEGACY_RUNTIME_RECONCILED=15'
          echo 'LEGACY_RUNTIME_DELIVERED=15'
          echo 'FRONTEND_LEGACY_RUNTIME_ENABLED=YES'
          echo 'GOOGLE_SHEETS_WRITE=NO'
          echo 'APPS_SCRIPT_TOUCHED=NO'
          echo 'ORDER_IDS_CHANGED=NO'
          echo 'BUSINESS_CREATE_TEST_SENT=NO'
          echo 'ROUTE_COMMANDS_EXECUTED=NO'

      - name: Cleanup runner-only files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf qualified-source/cloudflare-d1/dist
          rm -f qualified-source/cloudflare-d1/wrangler.entry599-prod.toml
          rm -rf dist/entry599
          rm -f /tmp/entry599-upload.mjs /tmp/reconcile-runtime.sql /tmp/reconcile-events.sql
