name: Autonomous Printshop Machine Readiness Apply Controlled
# append-only DELETE trigger guards are allowed; data DELETE FROM remains forbidden

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/migrations/0027_machine_readiness_v1.sql'
      - 'autonomous-printshop/tests/machine_readiness_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-machine-readiness-apply-controlled.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-machine-readiness-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      SQL: autonomous-printshop/migrations/0027_machine_readiness_v1.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify machine readiness contract
        run: node autonomous-printshop/tests/machine_readiness_v1.test.mjs

      - name: Hard safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "mode TEXT NOT NULL DEFAULT 'OFF'" "$SQL"
          grep -q 'AUTONOMOUS_MACHINE_OBSERVATIONS_APPEND_ONLY' "$SQL"
          grep -q 'AUTONOMOUS_MACHINE_MAPPING_APPEND_ONLY' "$SQL"
          ! grep -Eiq '\b(DROP|ALTER|VACUUM)\b' "$SQL"
          ! grep -Eiq '\bDELETE[[:space:]]+FROM\b' "$SQL"
          ! grep -Eiq '\bREPLACE[[:space:]]+INTO\b' "$SQL"
          ! grep -Eiq '(INSERT|UPDATE|DELETE|REPLACE)[^;]*(t12_prod_|employee_|operator_tasks|autonomous_readiness_evidence)' "$SQL"
          echo 'MACHINE_READINESS_SCHEMA_SAFETY=PASS'

      - name: Apply additive machine readiness schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file "$SQL"

      - name: Verify Default-OFF empty foundation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master
                WHERE type='table'
                  AND name IN (
                    'autonomous_machine_control',
                    'autonomous_machines',
                    'autonomous_machine_observations',
                    'autonomous_line_machine_mapping_events',
                    'autonomous_machine_control_events'
                  )) AS machineTables,
              (SELECT mode FROM autonomous_machine_control WHERE singleton_id=1) AS machineMode,
              (SELECT COUNT(*) FROM autonomous_machines) AS machines,
              (SELECT COUNT(*) FROM autonomous_machine_observations) AS observations,
              (SELECT COUNT(*) FROM autonomous_line_machine_mapping_events) AS mappings,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode;
          " > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.machineTables)!==5) process.exit(1);
          if(String(r.machineMode)!=='OFF') process.exit(2);
          if(Number(r.machines)!==0||Number(r.observations)!==0||Number(r.mappings)!==0) process.exit(3);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(4);
          console.log('MACHINE_READINESS_FOUNDATION=PASS');
          console.log('MACHINE_CONTROL=OFF');
          console.log('OPERATOR_TASK_CONTROL=OFF');
          NODE

      - name: Safety conclusion
        run: |
          echo 'MACHINE_READINESS_SCHEMA=APPLIED_DEFAULT_OFF'
          echo 'MACHINE_READY_SYNTHESIS=NO'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
