name: TrendOS Entry644 Core GENERAL Frontend Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry644-core-general-frontend-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry644-core-general-frontend-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      API_CONFIG: cloudflare-d1/wrangler.toml
      DATABASE: trendos-main
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      PRE_ENTRY644_DISPATCHER_COMMIT: 2e8e223aef407b1a1253f023b9b39527292a2301
      NEW_CONFIG_TAG: 20261007-entry644-core-general

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Exact staged Runtime and repo preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"

          node --check employee-api-dispatcher-v1.js
          node tests/entry644_employee_core_general_dispatch.test.mjs
          grep -Fq "T12_ENTRY644_CORE_GENERAL_READY_V1_20261007" employee-api-dispatcher-v1.js

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry644frontpre=$GITHUB_SHA-$(date +%s%N)" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.success!==true||a.schemaReady!==true||a.mode!=='NATIVE'||a.envEnabled!==true||
             a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==true||
             Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||Number(a.mustChangeCount||0)!==0||
             a.plaintextStored!==false) throw new Error('auth preflight drift');
          if(b.success!==true||b.enabled!==false||Number(b.allowedPolicyCount||0)!==0||
             b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false) throw new Error('bridge preflight drift');
          if(co.success!==true||co.schemaReady!==true||co.mode!=='GENERAL'||Number(co.policyEpoch||0)!==2||
             Number(co.googleBusinessCalls||0)!==0||co.appsScriptBusinessAuthority!==false) throw new Error('core staged drift');
          if(ct.mode!=='READONLY'||Number(ct.googleBusinessCalls||0)!==0||ct.appsScriptBusinessAuthority!==false) throw new Error('content drift');
          if(cm.mode!=='READONLY'||Number(cm.googleBusinessCalls||0)!==0||cm.appsScriptBusinessAuthority!==false) throw new Error('comms drift');
          if(o.mode!=='GENERAL'||Number(o.googleBusinessCalls||0)!==0||o.appsScriptBusinessAuthority!==false) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||
             Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting safety drift');
          console.log('ENTRY644_FRONTEND_RUNTIME_PREFLIGHT=PASS');
          NODE

      - name: Capture exact live frontend baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend active version shape '+JSON.stringify(full));
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY644_PRE_FRONTEND_VERSION='+full[0].id);
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry644pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry644pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry644pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry644pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry644pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry644pre=$suffix" -o /tmp/live-attendance.js

          git show "$PRE_ENTRY644_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" >/tmp/pre-entry644-dispatcher.js
          cmp -s /tmp/live-dispatcher.js /tmp/pre-entry644-dispatcher.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" /tmp/live-config.js
          echo ENTRY644_EXACT_LIVE_FRONTEND_BASELINE=PASS

      - name: Build exact-live Core GENERAL bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp employee-api-dispatcher-v1.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js

          python3 <<'PY'
          from pathlib import Path
          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()
          old="window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY';"
          new="window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'GENERAL';"
          if s.count(old)!=1:
              raise SystemExit('core readonly anchor count='+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          export NEW_CONFIG="config.js?v=$NEW_CONFIG_TAG"
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          pat=r'config[.]js[?]v=[^"]+'
          if len(re.findall(pat,s))!=1:
              raise SystemExit('config cache tag count='+str(len(re.findall(pat,s))))
          p.write_text(re.sub(pat,os.environ['NEW_CONFIG'],s,count=1))
          PY

          node --check cloudflare-d1/frontend-dist/config.js
          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'GENERAL';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';" cloudflare-d1/frontend-dist/config.js
          grep -Fq "T12_ENTRY644_CORE_GENERAL_READY_V1_20261007" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "var CORE_WRITE_ACTIONS = new Set" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "config.js?v=$NEW_CONFIG_TAG" cloudflare-d1/frontend-dist/index.html
          echo ENTRY644_CORE_GENERAL_BUNDLE=PASS

      - name: Deploy Core GENERAL frontend with automatic rollback
        id: deploy
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          FRONTEND_DEPLOYED=0

          rollback(){
            rc=$?
            trap - ERR
            if [ "$FRONTEND_DEPLOYED" = "1" ]; then
              echo "ENTRY644_ROLLBACK_FRONTEND_TO=$PRE"
              npx wrangler rollback "$PRE" --message "Entry644 Core GENERAL frontend automatic rollback" --config "$FRONTEND_CONFIG" || true
            fi
            echo "ENTRY644_ROLLBACK_CORE_TO=READONLY_EPOCH1"
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
              UPDATE employee_core_control_v1
                 SET mode='READONLY',policy_epoch=1,updated_at=CURRENT_TIMESTAMP
               WHERE singleton=1
                 AND marker='ENTRY614_EMPLOYEE_CORE_V1'
                 AND mode='GENERAL'
                 AND policy_epoch=2;
              SELECT mode,policy_epoch AS policyEpoch FROM employee_core_control_v1 WHERE singleton=1;" >/tmp/core-rollback.json || true
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          FRONTEND_DEPLOYED=1

          OK=0
          for attempt in $(seq 1 25); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry644post=$suffix" -o /tmp/post-index.html \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry644post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry644post=$suffix" -o /tmp/post-dispatcher.js \
              && grep -Fq "config.js?v=$NEW_CONFIG_TAG" /tmp/post-index.html \
              && grep -Fq "window.MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'GENERAL';" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY';" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY';" /tmp/post-config.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY';" /tmp/post-config.js \
              && grep -Fq "T12_ENTRY644_CORE_GENERAL_READY_V1_20261007" /tmp/post-dispatcher.js \
              && grep -Fq "var CORE_WRITE_ACTIONS = new Set" /tmp/post-dispatcher.js; then
                OK=1
                echo "ENTRY644_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('/tmp/post-dispatcher.js','utf8');
          const calls=[];
          const realFetch=globalThis.fetch;
          const downstream=async(action,params)=>({success:true,source:'downstream',action});
          downstream.__trendosEdgeOrdersReadV1=true;
          const windowObject={
            MATBAGY_EMPLOYEE_NATIVE_AUTH_V1:true,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1:false,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS:[],
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES:0,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT:6,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1:false,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES:[],
            MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE:'GENERAL',
            MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE:'GENERAL',
            MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_API_URL:process.env.API_URL,
            MATBAGY_EDGE_ORDERS_API_URL:process.env.API_URL,
            trendosSecureApiV1922:downstream
          };
          const tracked=async(url,options={})=>{calls.push(String(url));return realFetch(url,options);};
          const sandbox={window:windowObject,console,URL,Set,Map,JSON,Error,Number,Date,Promise,AbortController,TextEncoder,setTimeout,clearTimeout,setInterval,clearInterval,Response,fetch:tracked};
          vm.runInNewContext(source,sandbox,{filename:'entry644-live-dispatcher.js'});

          (async()=>{
            const username=String(process.env.QUALIFY_USERNAME||'').trim();
            const password=String(process.env.QUALIFY_PASSWORD||'');
            const login=await windowObject.trendosEmployeeApiV1('login',{username,password});
            const token=String(login&&login.user&&login.user.token||'').trim();
            if(login.success!==true||String(login.authSource||'')!=='d1-native-employee-v1'||!token) throw new Error('Native login failed');
            console.log('::add-mask::'+token);
            console.log('ENTRY644_NATIVE_LOGIN=PASS');

            const lineId='entry644-'+String(process.env.GITHUB_SHA||'probe')+'-nonexistent';
            let writeProof=false;
            try{
              await windowObject.trendosEmployeeApiV1('updateLine',{
                username,token,lineId,status:'طلب جديد'
              });
              throw new Error('synthetic missing-line write unexpectedly succeeded');
            }catch(err){
              if(err&&err.code==='line-not-found'&&Number(err.status||0)===400) writeProof=true;
              else throw err;
            }
            if(!writeProof) throw new Error('Core GENERAL write route proof missing');
            const coreCalls=calls.filter(u=>u.includes('/v1/employee/core'));
            const legacyCalls=calls.filter(u=>u.includes('/v1/employee/legacy-action'));
            if(coreCalls.length<1) throw new Error('Core route not called');
            if(legacyCalls.length!==0) throw new Error('Legacy bridge called during Core smoke');
            console.log('ENTRY644_AUTHENTICATED_CORE_WRITE_ROUTE=PASS');
            console.log('ENTRY644_SYNTHETIC_LINE_NOT_FOUND=PASS');
            console.log('ENTRY644_BUSINESS_WRITE_EXECUTED=NO');
            console.log('ENTRY644_LEGACY_BRIDGE_CALLS=0');

            const logout=await windowObject.trendosEmployeeApiV1('logout',{username,token});
            if(logout.success!==true) throw new Error('logout failed');
            console.log('ENTRY644_NATIVE_LOGOUT=PASS');
          })().catch(e=>{console.error('ENTRY644_LIVE_SMOKE=FAIL '+String(e&&e.message||e));process.exit(31);});
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry644post=$GITHUB_SHA-$(date +%s%N)" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='NATIVE'||a.nativeOnly!==true||Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||
             a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.plaintextStored!==false) throw new Error('auth post');
          if(b.enabled!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge post');
          if(co.mode!=='GENERAL'||Number(co.policyEpoch||0)!==2||Number(co.googleBusinessCalls||0)!==0||co.appsScriptBusinessAuthority!==false) throw new Error('core post');
          if(ct.mode!=='READONLY'||cm.mode!=='READONLY') throw new Error('content/comms post');
          if(o.mode!=='GENERAL') throw new Error('ops post');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||
             Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting safety post');
          console.log('ENTRY644_RUNTIME_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend post version shape '+JSON.stringify(full));
          fs.writeFileSync('/tmp/post-ui-version.txt',full[0].id);
          console.log('ENTRY644_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY644_CORE_GENERAL_FRONTEND=PASS
          echo ENTRY644_ROLLBACK_USED=NO

      - name: Failure safety rollback for pre-deploy/build failure
        if: ${{ failure() && steps.deploy.outcome == 'skipped' }}
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            UPDATE employee_core_control_v1
               SET mode='READONLY',policy_epoch=1,updated_at=CURRENT_TIMESTAMP
             WHERE singleton=1
               AND marker='ENTRY614_EMPLOYEE_CORE_V1'
               AND mode='GENERAL'
               AND policy_epoch=2;
            SELECT mode,policy_epoch AS policyEpoch FROM employee_core_control_v1 WHERE singleton=1;" >/tmp/core-failure-safety.json
          echo ENTRY644_FAILURE_SAFETY_CORE_ROLLBACK_ATTEMPTED=YES

      - name: Final
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ENTRY644_PRE_FRONTEND_VERSION=$(cat /tmp/pre-ui-version.txt)"
          echo "ENTRY644_POST_FRONTEND_VERSION=$(cat /tmp/post-ui-version.txt)"
          echo ENTRY644=FRONTEND_CUTOVER_PASS
          echo ENTRY644_CORE=GENERAL_EPOCH_2
          echo ENTRY644_CONTENT=READONLY
          echo ENTRY644_COMMS=READONLY
          echo ENTRY644_OPS=GENERAL
          echo ENTRY644_ACCOUNTING=READONLY
          echo ENTRY644_ACCOUNTING_MUTATION=NO
          echo ENTRY644_EASYSTORE_MUTATION=NO
