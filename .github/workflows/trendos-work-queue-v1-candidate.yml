name: TrendOS Work Queue V1 Candidate CI

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'work-queue-backend-v1.gs'
      - 'work-queue-v1.js'
      - 'v1932-router.gs'
      - 'tests/work_queue_v1_contract.test.mjs'
      - '.github/workflows/trendos-work-queue-v1-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check candidate
        run: |
          cp work-queue-backend-v1.gs /tmp/work-queue-backend-v1.js
          cp v1932-router.gs /tmp/v1932-router.js
          node --check /tmp/work-queue-backend-v1.js
          node --check work-queue-v1.js
          node --check /tmp/v1932-router.js
      - name: Run Work Queue contract
        run: node --test tests/work_queue_v1_contract.test.mjs
