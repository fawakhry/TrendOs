name: TrendOS Entry646 Manager Center Recorder

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry646-master-book-record.yml'

permissions:
  contents: write

concurrency:
  group: trendos-entry646-master-book-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: candidate/t12-full-cloud-cutover-a56-20260929
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Append Entry646 evidence and Master Book
        shell: bash
        run: |
          set -euo pipefail
          test -f TrendOS_MASTER_BOOK.md
          if grep -Fq '#### Entry646 — Manager Center Core-direct stabilization — PASS' TrendOS_MASTER_BOOK.md; then
            echo ENTRY646_ALREADY_RECORDED=YES
            exit 0
          fi

          START_BOOK="$(git rev-parse HEAD:TrendOS_MASTER_BOOK.md)"
          mkdir -p docs/trendos/staging
          cat > docs/trendos/staging/ENTRY646_MANAGER_CENTER_CORE_DIRECT_20261007.md <<'EOF'
          # Entry646 — Manager Center Core-direct stabilization — 2026-10-07

          ## Scope
          Stabilize the TrendOS Manager Center only. No D1 mutation, no Content mutation, no Comms mutation, no Accounting/EasyStore mutation.

          ## Diagnosis
          Live `config.js` loads `trend-master-resilience-v1931.js` before `manager-center-v1932.js`.
          The resilience layer requests `getTrendMasterPanelV1931`.
          The live Employee dispatcher and D1 Core native route do not qualify `getTrendMasterPanelV1931`; they do qualify `getTrendMasterCenterV1931`.
          Because Manager Center preferred the resilience object whenever present, the center could choose an unqualified route instead of its existing qualified D1 Core fallback.

          ## Controlled fix
          Workflow source commit: `eda1828f0c6b6b17617b7649a048d414635ef293`.
          Workflow run: `37554583893`.
          Job: `112577762263`.
          Repo patch commit: `463a2523a9ddf1457f113112254f7bc5176d082a`.

          The Manager Center `load()` path now calls one qualified Cloud/D1 Core snapshot:
          `getTrendMasterCenterV1931`.
          The historical progressive resilience code remains in the repository for the separate Trend Master surface; Entry646 changes only the Manager Center selection path.

          Frontend version:
          - previous: `9c84a8ca-49f9-458a-9714-8a0dc03cfcd6`
          - current: `cfff20f6-5a9d-46cb-8dfb-6c378c4f0eb5`
          - propagation: attempt 4

          ## Live proof
          - `ENTRY646_RUNTIME_PREFLIGHT=PASS`
          - `ENTRY646_CENTER_ROUTE_MISMATCH_CONFIRMED=PASS`
          - `ENTRY646_MANAGER_CENTER_CORE_DIRECT_REPO=PASS`
          - authenticated Native login succeeded
          - `getTrendMasterCenterV1931` returned a complete Manager Center snapshot from `/v1/employee/core`
          - `ENTRY646_MANAGER_CENTER_CORE_SNAPSHOT=PASS`
          - `ENTRY646_LEGACY_BRIDGE_CALLS=0`
          - `ENTRY646_BUSINESS_WRITE=NO`
          - Native logout PASS
          - `ENTRY646_RUNTIME_POSTFLIGHT=PASS`
          - rollback not used

          ## Final production truth
          ```ini
          ENTRY646=PASS
          MANAGER_CENTER_ROUTE=CORE_DIRECT
          MANAGER_CENTER_ACTION=getTrendMasterCenterV1931
          AUTH_MODE=NATIVE
          D1_NATIVE_READY=6/6
          BACKEND_BRIDGE=false
          CORE=GENERAL
          CORE_POLICY_EPOCH=2
          CONTENT=READONLY
          COMMS=READONLY
          OPS=GENERAL
          ACCOUNTING=READONLY
          D1_MUTATION=NO
          BUSINESS_WRITE=NO
          CONTENT_MUTATION=NO
          COMMS_MUTATION=NO
          ACCOUNTING_MUTATION=NO
          EASYSTORE_MUTATION=NO
          ROLLBACK_USED=NO
          ```
          EOF

          cat >> TrendOS_MASTER_BOOK.md <<'EOF'

          #### Entry646 — Manager Center Core-direct stabilization — PASS
          - الاسم العربي للبحث: **المركز / مركز الإدارة / لوحة المدير / Manager Center / Trend Master Center**.
          - التاريخ: 2026-10-07 Cairo.
          - التشخيص الحي: `config.js` يحمل `trend-master-resilience-v1931.js` قبل `manager-center-v1932.js`. الـResilience يطلب `getTrendMasterPanelV1931`، لكن الـDispatcher والـD1 Core الحاليين لا يؤهلان هذا action، بينما `getTrendMasterCenterV1931` مؤهل Native على `/v1/employee/core`.
          - لذلك كان Manager Center يفضّل مسار Progressive غير مؤهل لمجرد وجود `trendMasterPanelResilienceV1` بدل fallback السحابي الصحيح.
          - Entry646 غيّر **المركز فقط** ليستخدم Snapshot واحد مباشر من `getTrendMasterCenterV1931`. لم يتم تغيير D1 أو Backend API أو Content أو Comms أو Accounting/EasyStore.
          - Workflow source commit: `eda1828f0c6b6b17617b7649a048d414635ef293`.
          - Run `37554583893` / Job `112577762263` = SUCCESS.
          - Repo patch commit: `463a2523a9ddf1457f113112254f7bc5176d082a`.
          - Frontend version: `9c84a8ca-49f9-458a-9714-8a0dc03cfcd6` → `cfff20f6-5a9d-46cb-8dfb-6c378c4f0eb5`; propagation attempt 4.
          - Authenticated Production smoke: Native login PASS؛ Manager Center snapshot من Core PASS؛ Legacy Bridge calls=0؛ Business write=NO؛ Native logout PASS.
          - Runtime postflight: Auth=NATIVE 6/6، Core=GENERAL/2، Ops=GENERAL، Content=READONLY، Comms=READONLY، Accounting=READONLY/writeAuthorityMode=OFF؛ rollback لم يُستخدم.
          - Evidence: `docs/trendos/staging/ENTRY646_MANAGER_CENTER_CORE_DIRECT_20261007.md`.
          ```ini
          ENTRY646=PASS
          MANAGER_CENTER_ROUTE=CORE_DIRECT
          MANAGER_CENTER_ACTION=getTrendMasterCenterV1931
          AUTH_MODE=NATIVE
          D1_NATIVE_READY=6/6
          BACKEND_BRIDGE=false
          CORE=GENERAL
          CORE_POLICY_EPOCH=2
          CONTENT=READONLY
          COMMS=READONLY
          OPS=GENERAL
          ACCOUNTING=READONLY
          D1_MUTATION=NO
          BUSINESS_WRITE=NO
          CONTENT_MUTATION=NO
          COMMS_MUTATION=NO
          ACCOUNTING_MUTATION=NO
          EASYSTORE_MUTATION=NO
          ROLLBACK_USED=NO
          MASTER_BOOK_RECORDED=YES
          ```
          EOF

          git fetch --quiet origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH:TrendOS_MASTER_BOOK.md)" = "$START_BOOK"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TrendOS_MASTER_BOOK.md docs/trendos/staging/ENTRY646_MANAGER_CENTER_CORE_DIRECT_20261007.md
          git commit -m 'docs: record Entry646 Manager Center PASS'

          git fetch --quiet origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH:TrendOS_MASTER_BOOK.md)" = "$START_BOOK"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          echo ENTRY646_MASTER_BOOK_RECORDED=PASS
          echo ENTRY646_RECORDER_COMMIT="$(git rev-parse HEAD)"
