name: TrendOS T12 A57B Cloudflare Worker Frontend Cutover

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'docs/trendos/staging/A57B_CLOUDFLARE_WORKER_FRONTEND.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-t12-a57b-cloudflare-worker-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_WORKER_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact source and target guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fx 'name = "trendos-d1-api"' cloudflare-d1/wrangler.toml
          grep -Fx 'name = "trendos-ui"' cloudflare-d1/wrangler.frontend.toml
          grep -F 'https://trendos-ui.trendmall-contact.workers.dev' cloudflare-d1/wrangler.toml
          git fetch --quiet origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "A57B_MAIN_SHA=$MAIN_SHA"
          echo 'A57B_GOOGLE_MUTATION=NO'
          echo 'A57B_D1_MUTATION=NO'

      - name: Qualify API Worker customer source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/index_v2.js
          node --check cloudflare-d1/src/frontend-static-worker.mjs
          node --check cloudflare-d1/src/t12-customer-master.mjs
          node --experimental-sqlite tests/t12_customer_master_a53.test.mjs
          node --experimental-sqlite tests/t12_customer_native_search_a54.test.mjs
          node --experimental-sqlite tests/t12_customer_legacy_projection_a55.test.mjs
          echo 'A57B_SOURCE_QUALIFIED=PASS'

      - name: Build exact-main static frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trendos-main cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/trendos-main "$MAIN_SHA"
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/trendos-main -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0             | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/
          test -f cloudflare-d1/frontend-dist/index.html
          test -f cloudflare-d1/frontend-dist/app.js
          test -f cloudflare-d1/frontend-dist/config.js
          test -f cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          grep -F '20260929-t12-a56-customer-cloud-only-live' cloudflare-d1/frontend-dist/config.js
          grep -F "customerAuthority: 'cloud-only'" cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          echo 'A57B_STATIC_BUILD=PASS'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.142.0

      - name: Deploy API Worker code/config for frontend CORS
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/wrangler.toml | tee /tmp/a57b_api_deploy.log
          echo 'A57B_API_WORKER_DEPLOY=PASS'

      - name: Deploy Cloudflare Worker frontend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/wrangler.frontend.toml | tee /tmp/a57b_frontend_deploy.log
          echo 'A57B_FRONTEND_WORKER_DEPLOY=PASS'

      - name: Verify frontend production and API CORS
        shell: bash
        run: |
          set -euo pipefail
          frontend_ok=0
          cors_ok=0
          for attempt in $(seq 1 30); do
            root_code="$(curl --silent --show-error --location --output /tmp/a57b_index.html --write-out '%{http_code}' "$FRONTEND_URL/?a57b=$MAIN_SHA" || true)"
            cfg_code="$(curl --silent --show-error --location --output /tmp/a57b_config.js --write-out '%{http_code}' "$FRONTEND_URL/config.js?a57b=$MAIN_SHA" || true)"
            edge_code="$(curl --silent --show-error --location --output /tmp/a57b_edge.js --write-out '%{http_code}' "$FRONTEND_URL/trendos-edge-orders-read-v1.js?a57b=$MAIN_SHA" || true)"
            if [ "$root_code" = '200' ] && [ "$cfg_code" = '200' ] && [ "$edge_code" = '200' ]                && grep -Fq '20260929-t12-a56-customer-cloud-only-live' /tmp/a57b_config.js                && grep -Fq "customerAuthority: 'cloud-only'" /tmp/a57b_edge.js; then
              frontend_ok=1
            fi

            curl --silent --show-error -i -X OPTIONS               -H "Origin: $FRONTEND_URL"               -H 'Access-Control-Request-Method: GET'               -H 'Access-Control-Request-Headers: authorization'               "$API_WORKER_URL/v1/edge/customers/search" > /tmp/a57b_cors.txt || true
            if grep -qi "access-control-allow-origin: $FRONTEND_URL" /tmp/a57b_cors.txt; then
              cors_ok=1
            fi

            if [ "$frontend_ok" = '1' ] && [ "$cors_ok" = '1' ]; then
              echo 'A57B_FRONTEND_LIVE=PASS'
              echo 'A57B_API_CORS=PASS'
              exit 0
            fi
            sleep 3
          done
          echo "frontend_ok=$frontend_ok cors_ok=$cors_ok"
          cat /tmp/a57b_cors.txt || true
          exit 1

      - name: Verify customer authority remains GENERAL
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/a57b_customer_health.json --write-out '%{http_code}' "$API_WORKER_URL/v1/t12/customers/write/health")"
          cat /tmp/a57b_customer_health.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/a57b_customer_health.json','utf8')); if(!x.success||x.mode!=='GENERAL'||x.generalCutover!==true||Number(x.customerCount)<247) process.exit(1)"
          echo 'A57B_CUSTOMER_GENERAL=PASS'

      - name: Final
        run: |
          echo "A57B_FRONTEND_URL=$FRONTEND_URL"
          echo "A57B_FRONTEND_MAIN_SHA=$MAIN_SHA"
          echo 'A57B_FRONTEND_HOSTING=CLOUDFLARE_WORKER_ASSETS'
          echo 'A57B_CUSTOMER_SEARCH=D1'
          echo 'A57B_CUSTOMER_WRITE=D1'
          echo 'A57B_GOOGLE_MUTATION=NO'
          echo 'A57B_D1_MUTATION=NO'
