name: TrendOS T12 A56 Full Cloud Cutover Audit

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a56-full-cloud-cutover-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Runtime Google dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== A56 RUNTIME GOOGLE DEPENDENCY INVENTORY ==='
          grep -RInE --exclude='*.md' --exclude-dir='.git' --exclude-dir='docs'             --exclude='apps-script-importer.gs' --exclude='D1_Full_Migration.gs' --exclude='D1_Orders_Read_Cutover.gs'             '(script\.google\.com|docs\.google\.com|WEB_APP_URL|TREND_API_URL|API_URL|TRENDOS_SHEET_ID|TRENDOS_SHEET_URL|SpreadsheetApp|PropertiesService|getSheetByName|openById)' .             | tee /tmp/a56_google_runtime.txt || true

          echo '=== A56 FRONTEND/API CALLS ==='
          find . -type f \( -name '*.js' -o -name '*.html' \) -not -path './.git/*' -print0             | xargs -0 grep -nHE '(api\(|fetch\(|TREND_API_URL|API_URL|WEB_APP_URL|MATBAGY_EDGE_ORDERS_API_URL|MATBAGY_EDGE_API_URL)'             | tee /tmp/a56_frontend_calls.txt || true

          echo '=== A56 CLOUD ROUTES ==='
          find cloudflare-d1/src cloudflare-d1/production-shadow -type f \( -name '*.js' -o -name '*.mjs' \) -print0             | xargs -0 grep -nHE '(/v1/|pathname|is[A-Za-z0-9_]*Path|handle[A-Za-z0-9_]*Request)'             | tee /tmp/a56_cloud_routes.txt || true

          runtime_google="$(wc -l < /tmp/a56_google_runtime.txt | tr -d ' ')"
          frontend_calls="$(wc -l < /tmp/a56_frontend_calls.txt | tr -d ' ')"
          cloud_routes="$(wc -l < /tmp/a56_cloud_routes.txt | tr -d ' ')"

          echo "A56_RUNTIME_GOOGLE_MATCHES=$runtime_google"
          echo "A56_FRONTEND_API_MATCHES=$frontend_calls"
          echo "A56_CLOUD_ROUTE_MATCHES=$cloud_routes"

          echo '=== A56 FILE SUMMARY ==='
          awk -F: '{print $1}' /tmp/a56_google_runtime.txt | sort | uniq -c | sort -nr | head -100

          echo 'PRODUCTION_MUTATION=NO'
          echo 'GOOGLE_MUTATION=NO'
          echo 'A56_AUDIT=PASS'
