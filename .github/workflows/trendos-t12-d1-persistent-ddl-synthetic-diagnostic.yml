name: TrendOS T12 D1 Persistent DDL Synthetic Diagnostic

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-t12-d1-persistent-ddl-synthetic-diagnostic.yml'

permissions:
  contents: read

jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DB_NAME: trendos-t12-synthetic-test
      TEST_DB_UUID: 54a3c05e-cde9-4979-814f-d40f941edcd5
      DIAG_TABLE: t12_diag_a3_persistent_write_20260927
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify TEST D1 identity
        run: |
          set -euo pipefail
          test "$TEST_DB_NAME" = "trendos-t12-synthetic-test"
          test "$TEST_DB_UUID" = "54a3c05e-cde9-4979-814f-d40f941edcd5"
          test "$TEST_DB_UUID" != "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_UUID" > /tmp/db.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/db.json')); if(!x.success||x.result?.name!=='trendos-t12-synthetic-test') process.exit(1)"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.142.0

      - name: Build TEST-only config
        run: |
          set -euo pipefail
          cat > cloudflare-d1/t12-preview/.diag-a3.toml <<EOF
          name = "trendos-t12-a3-synthetic"
          compatibility_date = "2026-09-27"
          [[d1_databases]]
          binding = "T12_SYNTHETIC_DB"
          database_name = "trendos-t12-synthetic-test"
          database_id = "54a3c05e-cde9-4979-814f-d40f941edcd5"
          EOF
          ! grep -q 'trendos-main' cloudflare-d1/t12-preview/.diag-a3.toml
          ! grep -q '5c4b92bf-e043-4f6e-bd6d-d514a92cd825' cloudflare-d1/t12-preview/.diag-a3.toml

      - name: Preflight table absence
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote \
            --config cloudflare-d1/t12-preview/.diag-a3.toml \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='$DIAG_TABLE';" \
            > /tmp/pre.txt
          cat /tmp/pre.txt
          grep -F '"n": 0' /tmp/pre.txt

      - name: A3 persistent CREATE TABLE direct execute
        id: create
        continue-on-error: true
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote \
            --config cloudflare-d1/t12-preview/.diag-a3.toml \
            --command "CREATE TABLE $DIAG_TABLE (id INTEGER PRIMARY KEY, marker TEXT NOT NULL);" \
            > /tmp/create.txt 2>&1
          cat /tmp/create.txt

      - name: Reconcile CREATE by read
        if: ${{ always() }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$TEST_DB_NAME" --remote \
            --config cloudflare-d1/t12-preview/.diag-a3.toml \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='$DIAG_TABLE';" \
            > /tmp/reconcile.txt
          cat /tmp/reconcile.txt

      - name: Cleanup confirmed TEST table only
        if: ${{ always() && steps.create.outcome == 'success' }}
        run: |
          set -euo pipefail
          grep -F '"n": 1' /tmp/reconcile.txt
          npx wrangler d1 execute "$TEST_DB_NAME" --remote \
            --config cloudflare-d1/t12-preview/.diag-a3.toml \
            --command "DROP TABLE $DIAG_TABLE;" \
            > /tmp/drop.txt
          cat /tmp/drop.txt
          npx wrangler d1 execute "$TEST_DB_NAME" --remote \
            --config cloudflare-d1/t12-preview/.diag-a3.toml \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='$DIAG_TABLE';" \
            > /tmp/post.txt
          cat /tmp/post.txt
          grep -F '"n": 0' /tmp/post.txt
          echo 'DIAG_A3_PERSISTENT_DDL=PASS'

      - name: Fail if direct persistent CREATE was denied
        if: ${{ always() && steps.create.outcome != 'success' }}
        run: |
          set -euo pipefail
          grep -F '"n": 0' /tmp/reconcile.txt
          echo 'DIAG_A3_PERSISTENT_DDL=FAIL'
          exit 1
