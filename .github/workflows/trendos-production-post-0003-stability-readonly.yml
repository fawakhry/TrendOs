name: TrendOS Production Post-0003 Stability Read-Only

# PERF-CF-02CF: read-only stability/ledger observation after exact-file installation of migration 0003.
# No D1 DDL/DML, migration apply, Worker deploy, Cloud Write enablement, or frontend cutover.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-post-0003-stability-readonly.yml'
      - 'cloudflare-d1/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-production-post-0003-stability-readonly
  cancel-in-progress: false

jobs:
  observe-production-post-0003:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PROD_DB_NAME: trendos-main
      PROD_DB_ID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
      WRANGLER_VERSION: 4.33.2
      EXPECTED_SHADOW_FINGERPRINT: 66711d7eef8febed69fa59cbd8b5f20146ed82374de55595ae1a126291d3f4b1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hard Production identity and Cloud Write OFF gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"$' cloudflare-d1/wrangler.toml
          grep -Eq '^migrations_dir = "migrations"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          echo 'POST_0003_PRODUCTION_IDENTITY_OFF_GATE_PASS'

      - name: Five-sample health, shadow, and mirror stability observation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fingerprints.txt
          for sample in 1 2 3 4 5; do
            curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > "/tmp/health-$sample.json"
            curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/v2/production-shadow" > "/tmp/shadow-$sample.json"
            curl --fail --silent --show-error --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > "/tmp/orders-$sample.json"
            curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > "/tmp/lines-$sample.json"

            SAMPLE="$sample" EXPECTED_SHADOW_FINGERPRINT="$EXPECTED_SHADOW_FINGERPRINT" node <<'NODE'
          const fs=require('fs');
          const i=process.env.SAMPLE;
          const health=JSON.parse(fs.readFileSync(`/tmp/health-${i}.json`,'utf8'));
          const shadow=JSON.parse(fs.readFileSync(`/tmp/shadow-${i}.json`,'utf8'));
          const orders=JSON.parse(fs.readFileSync(`/tmp/orders-${i}.json`,'utf8'));
          const lines=JSON.parse(fs.readFileSync(`/tmp/lines-${i}.json`,'utf8'));

          const healthPass=health.success===true && health.database===true && health.enabled===false && health.writesAccepted===false && health.authConfigured===true && health.schemaReady===true && Number(health.pendingOutbox||0)===0 && health.schemaMutationFree===true && health.cutover===false && health.sheetsAuthoritative===true;
          if(!healthPass){ console.error('HEALTH_FAIL='+JSON.stringify(health)); process.exit(1); }

          const shadowPass=shadow.success===true && shadow.valid===true && shadow.readOnly===true && shadow.mutationFree===true && shadow.liveProductionDataRead===false && shadow.d1Read===false && shadow.d1Written===false && shadow.appsScriptCalled===false && shadow.sheetsWritten===false && Number(shadow.mutationCount||0)===0 && shadow.productionWriteEnabled===false && shadow.productionCutover===false && shadow.shadowFingerprint===process.env.EXPECTED_SHADOW_FINGERPRINT;
          if(!shadowPass){ console.error('SHADOW_FAIL='+JSON.stringify(shadow)); process.exit(1); }

          function mirrorPass(x){
            const s=x.sheet||{};
            return x.success===true && x.schemaMutationFree===true && s.status==='ready' && Number(s.rowCount||0)===Number(s.sourceLastRow||0) && ['TrendOS orders live sync V1','TrendOS orders live sync V2 quota-aware'].includes(String(s.note||''));
          }
          if(!mirrorPass(orders)){ console.error('ORDERS_MIRROR_FAIL='+JSON.stringify(orders)); process.exit(1); }
          if(!mirrorPass(lines)){ console.error('LINES_MIRROR_FAIL='+JSON.stringify(lines)); process.exit(1); }

          console.log('POST_0003_SAMPLE_'+i+'_PASS='+JSON.stringify({
            schemaReady:health.schemaReady,
            enabled:health.enabled,
            writesAccepted:health.writesAccepted,
            pendingOutbox:health.pendingOutbox,
            cutover:health.cutover,
            sheetsAuthoritative:health.sheetsAuthoritative,
            shadowFingerprint:shadow.shadowFingerprint,
            orders:[orders.sheet?.rowCount,orders.sheet?.sourceLastRow],
            lines:[lines.sheet?.rowCount,lines.sheet?.sourceLastRow]
          }));
          fs.appendFileSync('/tmp/fingerprints.txt',shadow.shadowFingerprint+'\n');
          NODE
            sleep 2
          done
          test "$(sort -u /tmp/fingerprints.txt | wc -l | tr -d ' ')" = '1'
          test "$(sort -u /tmp/fingerprints.txt)" = "$EXPECTED_SHADOW_FINGERPRINT"
          echo 'POST_0003_FIVE_SAMPLE_STABILITY_PASS'

      - name: Write-facing routes remain fail-closed without authorization
        shell: bash
        run: |
          set -euo pipefail
          # The POST is deliberately unauthenticated and structurally invalid. Even if the feature flag changed unexpectedly,
          # it cannot be accepted as a valid business write. Current expected OFF-state response is 423.
          code="$(curl --silent --show-error --output /tmp/order-write-refusal.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$PROD_URL/v1/cloud/orders")"
          echo "POST_0003_ORDER_WRITE_REFUSAL_HTTP=$code"
          test "$code" = '423'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/order-write-refusal.json','utf8')); if(x.success!==false||x.enabled!==false||x.cutover!==false) process.exit(1)"

          outbox_code="$(curl --silent --show-error --output /tmp/outbox-refusal.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/outbox?status=pending&limit=1")"
          echo "POST_0003_OUTBOX_REFUSAL_HTTP=$outbox_code"
          test "$outbox_code" = '423'
          echo 'POST_0003_WRITE_LANE_FAIL_CLOSED_PASS'

      - name: Qualify and list Production migration ledger read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list --help > /tmp/migrations-list-help.txt
          grep -q -- '--remote' /tmp/migrations-list-help.txt
          grep -q -- '--config' /tmp/migrations-list-help.txt
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list "$PROD_DB_NAME" --remote --config cloudflare-d1/wrangler.toml | tee /tmp/pending-migrations.txt
          test -s /tmp/pending-migrations.txt
          echo 'POST_0003_MIGRATION_LEDGER_READ_PASS'

      - name: Assert observed historical ledger drift is unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0001_init.sql' /tmp/pending-migrations.txt
          grep -q '0002_full_sheet_mirror.sql' /tmp/pending-migrations.txt
          grep -q '0003_cloud_write_lane.sql' /tmp/pending-migrations.txt
          echo 'POST_0003_LEDGER_DRIFT_STILL_PRESENT=0001,0002,0003'

      - name: Final health state unchanged after read-only observation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/final-health.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/final-health.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.schemaReady===true && Number(x.pendingOutbox||0)===0 && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('POST_0003_FINAL_HEALTH='+JSON.stringify({schemaReady:x.schemaReady,enabled:x.enabled,writesAccepted:x.writesAccepted,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Read-only conclusion
        run: |
          echo 'PERF_CF_02CF_POST_0003_STABILITY_READONLY_PASS'
          echo 'Production Cloud Write schema remains ready while Cloud Write stays OFF and Sheets stay authoritative.'
          echo 'Migration ledger observation was read-only; no reconciliation, migration apply, D1 write, Worker deploy, or cutover occurred.'
