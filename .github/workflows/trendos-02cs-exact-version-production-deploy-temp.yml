name: TrendOS 02CS Exact Version Production Deploy TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-exact-version-production-deploy-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-exact-version-production-deploy
  cancel-in-progress: false

jobs:
  deploy-qualified-version:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WORKER_NAME: trendos-d1-api
      TARGET_VERSION: c77bf453-c590-4cff-a55b-fd9c625b6d76
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static production safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          test "$TARGET_VERSION" = 'c77bf453-c590-4cff-a55b-fd9c625b6d76'
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          git fetch origin main --depth=1
          git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false'
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Fq 'export function sortOperationalRows(rows, screen)' cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          node tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          echo 'PERF_CF_02CS_PROD_STATIC_GATE_PASS'

      - name: Capture current production Worker version — GET only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$api" > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(x.success!==true || !Array.isArray(x.result) || !x.result.length) throw new Error('Cloudflare deployments GET failed');
          const d=x.result[0]||{};
          const versions=Array.isArray(d.versions)?d.versions:[];
          const active=versions.slice().sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]||{};
          const id=String(active.version_id||active.id||'').trim();
          if(!id) throw new Error('Could not determine active production version');
          fs.appendFileSync(process.env.GITHUB_ENV,`PREVIOUS_VERSION=${id}\n`);
          console.log('PERF_CF_02CS_PREVIOUS_VERSION='+id);
          NODE
          test -n "$TARGET_VERSION"

      - name: Production boundary before deployment — GET only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200);assert.equal(edge.body.success,true);assert.equal(edge.body.database,true);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(cloud.body.cutover,false);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);
            assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_PROD_PRE_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Verify exact deployment command syntax — no mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy --help > /tmp/versions-deploy-help.txt
          grep -qi 'version' /tmp/versions-deploy-help.txt
          echo 'PERF_CF_02CS_VERSIONS_DEPLOY_HELP_PASS'

      - name: Deploy exact qualified Worker version to production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${TARGET_VERSION}@100%" --yes --config cloudflare-d1/wrangler.toml --message "TrendOS 02CS qualified D1 read route; frontend remains OFF"
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          echo 'PERF_CF_02CS_EXACT_VERSION_DEPLOYED='​"$TARGET_VERSION"
          sleep 10

      - name: Production authenticated canary with propagation retries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const critical=['rowNumber','orderId','orderCode','lineId','customer','customerPhone','customerSource','source','externalCustomerId','customerMode','department','itemName','qty','assignedTo','priority','status','ready','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','updatedAt','notes','customerNotified','notifiedAt','notifiedBy','lastWhatsAppMessage','lastWhatsAppAt','lastWhatsAppBy','receivedAt','expectedDeliveryAt','expectedDeliveryText','overdue','registrationSent'];
          function text(v){return String(v==null?'':v).trim();}
          function key(r){return [text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');}
          function fly(v){v=text(v).toLowerCase();return ['نعم','true','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير'].includes(v);}
          function prio(v){v=text(v)||'عادي';if(v==='عاجل'||v==='VIP')return 0;if(v==='عادي')return 1;if(v==='مؤجل')return 2;return 9;}
          function tier(row,screen){if(screen==='print'&&fly(row.flyPrint||row.quickPrint))return 0;return (screen==='print'?1:0)+prio(row.priority);}
          function assertOrdering(rows,screen){let prev=-Infinity;for(const row of rows){const t=tier(row,screen);assert.ok(t>=prev,screen+' operational tier regression');prev=t;}}
          async function readJson(label,url,opt={},attempts=4){let last;for(let i=1;i<=attempts;i++){try{const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let body;try{body=JSON.parse(raw||'{}')}catch{throw new Error(label+' invalid JSON http='+r.status)}return{status:r.status,body};}catch(e){last=e;if(i<attempts)await sleep(2000*i)}}throw last;}
          async function newSession(){let last;for(let i=1;i<=12;i++){try{const x=await readJson('session',base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},1);if(x.status===200&&x.body.success&&x.body.edgeToken){console.log('PERF_CF_02CS_PROD_SESSION_PASS_ATTEMPT='+i);return x.body.edgeToken;}last=new Error('session http='+x.status);}catch(e){last=e}await sleep(Math.min(12000,2000*i));}throw last||new Error('production session failed');}
          async function edgeRows(screen,bearer){const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});const x=await readJson('edge-'+screen,base+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}},5);assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');return x.body;}
          async function appRows(screen){const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};const x=await readJson('apps-'+screen,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)},5);assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body;}
          (async()=>{
            const bearer=await newSession(),summary=[];
            for(const screen of ['print','laser']){
              const e=await edgeRows(screen,bearer),a=await appRows(screen);
              const ek=(e.rows||[]).map(key),ak=(a.rows||[]).map(key);
              assert.deepEqual([...ek].sort(),[...ak].sort(),screen+' production identity set mismatch');
              assertOrdering(e.rows||[],screen);
              for(const row of e.rows||[]) for(const k of critical) assert.ok(Object.prototype.hasOwnProperty.call(row,k),screen+' missing field '+k);
              for(const m of e.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
              summary.push({screen,totalRows:ek.length,ordered:true,fieldContract:critical.length});
            }
            const p=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});
            const debt=await readJson('debt',base+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}},3);
            assert.equal(debt.status,409);assert.equal(debt.body.code,'apps-script-required');assert.equal(debt.body.fallback,'apps-script');
            console.log('PERF_CF_02CS_PROD_CANARY_PASS='+JSON.stringify({summary,debtFallback:true}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Final production boundary — frontend still OFF
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false'
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health'),cloud=await get('/v1/cloud/write/health'),recon=await get('/v1/qualification/cloud-write/reconcile/health'),unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200);assert.equal(edge.body.success,true);assert.equal(edge.body.database,true);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(cloud.body.cutover,false);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_PROD_FINAL_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          echo 'PERF_CF_02CS_PRODUCTION_WORKER_ROUTE_PASS_FRONTEND_OFF'

      - name: Automatic exact-version rollback on persistent post-deploy failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIOUS_VERSION:-}"
          echo "PERF_CF_02CS_ROLLBACK_TO=$PREVIOUS_VERSION"
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${PREVIOUS_VERSION}@100%" --yes --config cloudflare-d1/wrangler.toml --message "TrendOS 02CS automatic rollback after failed production canary"
          sleep 10
          curl --fail --silent --show-error "$PROD_URL/v1/edge/health" > /tmp/rollback-health.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/rollback-health.json','utf8'));if(!x.success||x.cutover!==false)process.exit(1)"
          echo 'PERF_CF_02CS_AUTOMATIC_ROLLBACK_PASS'
