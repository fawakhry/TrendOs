
name: TrendOS Entry623 Deployed Auth Source Readonly

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry623-deployed-auth-source-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT: trendos-d1-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch deployed script content read only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT/content/v2"             -o /tmp/deployed-content
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, re
          raw=Path('/tmp/deployed-content').read_bytes()
          print('ENTRY623_DEPLOYED_CONTENT_BYTES='+str(len(raw)))
          text=raw.decode('utf-8','replace')
          needles=[
            "async function legacyLoginBootstrap",
            "async function upsertBootstrappedUser",
            "employeeAuthStage = 'password-hash'",
            "employeeAuthStage = 'd1-user-upsert'",
            "d1-native-bootstrap-v1",
            "LEGACY_BOOTSTRAP_TIMEOUT_MS = 90000"
          ]
          for n in needles:
            if n not in text:
              raise SystemExit('missing deployed auth marker: '+n)
          repo=Path('cloudflare-d1/src/employee-auth-native-v1.mjs').read_text()
          # Compare the exact auth module when multipart content preserves module boundaries.
          target='employee-auth-native-v1.mjs'
          idx=text.find(target)
          print('ENTRY623_DEPLOYED_AUTH_MODULE_NAME_PRESENT='+('YES' if idx>=0 else 'NO'))
          print('ENTRY623_DEPLOYED_AUTH_MARKERS=PASS')
          print('ENTRY623_DEPLOYED_CONTENT_SECRET_VALUES_PRINTED=NO')
          PY
      - name: Runtime unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://trendos-d1-api.trendmall-contact.workers.dev/v1/employee/auth/health?entry623source=$GITHUB_SHA" -o /tmp/auth.json
          node <<'NODE'
          const a=require('/tmp/auth.json');
          if(a.mode!=='TRANSITIONAL'||Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0) throw new Error('auth runtime changed');
          console.log('ENTRY623_DEPLOYED_SOURCE_RUNTIME_UNCHANGED=PASS');
          NODE
