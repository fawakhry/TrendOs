name: TrendOS Production Cloud Write Schema Migration Candidate

# PERF-CF-02CD: CI qualification only for migration 0003.
# This workflow never connects to Production D1 for mutation and never deploys a Worker.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-schema-migration-candidate.yml'
      - 'cloudflare-d1/migrations/0003_cloud_write_lane.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-production-cloud-write-schema-migration-candidate
  cancel-in-progress: false

jobs:
  qualify-schema-only-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MIGRATION: cloudflare-d1/migrations/0003_cloud_write_lane.sql
      EXPECTED_BLOB_SHA: b4c81348f9b1e79519130033b5b1dffcc86eaa0b
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin exact migration content
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object "$MIGRATION")"
          echo "MIGRATION_BLOB_SHA=$actual"
          test "$actual" = "$EXPECTED_BLOB_SHA"
          echo 'MIGRATION_CONTENT_PIN_PASS'

      - name: Static schema-only allow-list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          path = Path('cloudflare-d1/migrations/0003_cloud_write_lane.sql')
          sql = path.read_text(encoding='utf-8')
          upper = sql.upper()

          forbidden = [r'\bDROP\b', r'\bALTER\b', r'\bINSERT\b', r'\bUPDATE\b', r'\bDELETE\b', r'\bREPLACE\b', r'\bTRIGGER\b', r'\bVIEW\b', r'\bATTACH\b', r'\bDETACH\b', r'\bVACUUM\b']
          for pat in forbidden:
              if re.search(pat, upper):
                  raise SystemExit(f'FORBIDDEN_SQL_TOKEN={pat}')

          table_names = re.findall(r'CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)', sql, flags=re.I)
          index_names = re.findall(r'CREATE\s+(?:UNIQUE\s+)?INDEX\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)', sql, flags=re.I)

          expected_tables = ['cloud_write_events', 'cloud_write_outbox']
          expected_indexes = [
              'idx_cloud_write_events_entity',
              'idx_cloud_write_events_sheets_status',
              'idx_cloud_write_outbox_event_unique',
              'idx_cloud_write_outbox_pending',
          ]
          if table_names != expected_tables:
              raise SystemExit(f'UNEXPECTED_TABLES={table_names}')
          if index_names != expected_indexes:
              raise SystemExit(f'UNEXPECTED_INDEXES={index_names}')

          for protected in ['customers', 'orders', 'sheet_catalog', 'sheet_rows', 'sheet_migration_runs']:
              if re.search(rf'CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+{re.escape(protected)}\b', sql, flags=re.I):
                  raise SystemExit(f'PROTECTED_TABLE_CREATE_REFUSED={protected}')

          statements = [s.strip() for s in sql.split(';') if s.strip()]
          for stmt in statements:
              normalized = re.sub(r'\s+', ' ', stmt).strip().upper()
              allowed = (
                  normalized == 'PRAGMA FOREIGN_KEYS = ON'
                  or normalized.startswith('CREATE TABLE IF NOT EXISTS CLOUD_WRITE_')
                  or normalized.startswith('CREATE INDEX IF NOT EXISTS IDX_CLOUD_WRITE_')
                  or normalized.startswith('CREATE UNIQUE INDEX IF NOT EXISTS IDX_CLOUD_WRITE_')
              )
              if not allowed:
                  raise SystemExit('NON_ALLOWLISTED_STATEMENT=' + normalized[:160])

          print('SCHEMA_ONLY_STATIC_ALLOWLIST_PASS')
          print('TABLES=' + ','.join(table_names))
          print('INDEXES=' + ','.join(index_names))
          PY

      - name: Isolated SQLite apply and idempotency proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3, pathlib, json

          migration = pathlib.Path('cloudflare-d1/migrations/0003_cloud_write_lane.sql').read_text(encoding='utf-8')
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          db.execute('CREATE TABLE customers (phone TEXT PRIMARY KEY, customer_name TEXT NOT NULL)')
          db.execute('CREATE TABLE orders (order_id TEXT PRIMARY KEY, customer_name TEXT NOT NULL)')
          db.execute("INSERT INTO customers(phone,customer_name) VALUES('01000000000','SENTINEL CUSTOMER')")
          db.execute("INSERT INTO orders(order_id,customer_name) VALUES('SENTINEL-ORDER','SENTINEL CUSTOMER')")
          db.commit()

          baseline = {
              'customers': db.execute('SELECT phone,customer_name FROM customers ORDER BY phone').fetchall(),
              'orders': db.execute('SELECT order_id,customer_name FROM orders ORDER BY order_id').fetchall(),
          }

          def verify(label):
              objects = dict(db.execute("SELECT name,type FROM sqlite_master WHERE name LIKE 'cloud_write_%' OR name LIKE 'idx_cloud_write_%'").fetchall())
              expected = {
                  'cloud_write_events': 'table',
                  'cloud_write_outbox': 'table',
                  'idx_cloud_write_events_entity': 'index',
                  'idx_cloud_write_events_sheets_status': 'index',
                  'idx_cloud_write_outbox_event_unique': 'index',
                  'idx_cloud_write_outbox_pending': 'index',
              }
              if objects != expected:
                  raise SystemExit(f'{label}_OBJECT_MISMATCH={objects}')
              if db.execute('SELECT COUNT(*) FROM cloud_write_events').fetchone()[0] != 0:
                  raise SystemExit(f'{label}_EVENTS_NOT_EMPTY')
              if db.execute('SELECT COUNT(*) FROM cloud_write_outbox').fetchone()[0] != 0:
                  raise SystemExit(f'{label}_OUTBOX_NOT_EMPTY')
              current = {
                  'customers': db.execute('SELECT phone,customer_name FROM customers ORDER BY phone').fetchall(),
                  'orders': db.execute('SELECT order_id,customer_name FROM orders ORDER BY order_id').fetchall(),
              }
              if current != baseline:
                  raise SystemExit(f'{label}_BUSINESS_SENTINEL_CHANGED={current}')
              print(label + '_PASS=' + json.dumps({'objects': sorted(objects), 'businessSentinelsUnchanged': True, 'cloudRows': 0}))

          db.executescript(migration)
          verify('FIRST_APPLY')
          db.executescript(migration)
          verify('SECOND_APPLY_IDEMPOTENT')
          print('ISOLATED_SCHEMA_MIGRATION_IDEMPOTENCY_PASS')
          PY

      - name: Live Production preflight remains OFF and unready
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/health.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.authConfigured===true && x.schemaReady===false && x.pendingOutbox===null && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('PRODUCTION_PRE_MIGRATION_HEALTH='+JSON.stringify({database:x.database,enabled:x.enabled,writesAccepted:x.writesAccepted,schemaReady:x.schemaReady,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Candidate conclusion
        run: |
          echo 'PERF_CF_02CD_SCHEMA_MIGRATION_CANDIDATE_PASS'
          echo 'Migration 0003 is pinned, schema-only, isolated-tested, and idempotent.'
          echo 'No Production D1 mutation, Worker deploy, secret change, Cloud Write enablement, or frontend cutover occurred.'
