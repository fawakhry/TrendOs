name: SERVER-170 Recent Stage Exact-Ray GraphQL Offline Safety

on:
  push:
    branches:
      - release/server68-staging-qualification-20261016
    paths:
      - autonomous-printshop/print-server/src/server170_recent_stage_ray_graphql.py
      - autonomous-printshop/print-server/tests/test_server170_recent_stage_ray_graphql.py
      - .github/workflows/server170-recent-stage-ray-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCESS_CLIENT_ID: ''
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run SERVER-170 fake-only tests, NO live API
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s autonomous-printshop/print-server/tests \
            -p 'test_server170_recent_stage_ray_graphql.py' -v
          echo 'SERVER170_CI=FAKE_ONLY; LIVE_GRAPHQL_CALLS=0'
          echo 'ORDERS_READ=0; PRODUCTION_WORKER_TOUCHED=NO; PRINT_LASER=OFF'
