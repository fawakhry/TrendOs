name: T12 Archive UI Live Function Match Readonly 20261102 (lease refresh)
on:
  push:
    branches: [candidate/t12-full-cloud-cutover-a56-20260929]
    paths: ['.github/workflows/t12-archive-ui-live-scope-readonly-20261102.yml']
permissions: {contents: read}
jobs:
  pre:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare only archived button function, and pinned active UI worker version
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 30 'https://trendos-ui.trendmall-contact.workers.dev/app.js' >/tmp/live-app.js
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          f=lambda x: re.search(r'  async function archiveDeliveredDepartment\(\) \{[\s\S]*?\n  \}\n\n  function applyFiltersAndRender', x).group(0)
          src=Path('app.js').read_text()
          live=Path('/tmp/live-app.js').read_text()
          print('LIVE_APP_MATCH_CANDIDATE='+str(src==live))
          print('LIVE_ARCHIVE_FUNC_MATCH='+str(f(src)==f(live)))
          print('LIVE_ARCHIVE_FUNC_SHA='+hashlib.sha256(f(live).encode()).hexdigest())
          print('CANDIDATE_ARCHIVE_FUNC_SHA='+hashlib.sha256(f(src).encode()).hexdigest())
          print('LIVE_APP_SHA='+hashlib.sha256(live.encode()).hexdigest())
          print('CANDIDATE_APP_SHA='+hashlib.sha256(src.encode()).hexdigest())
          PY
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/trendos-ui/deployments" >/tmp/ui.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/ui.json','utf8'));
          if(x.success!==true)throw Error('UI deployments read failed');
          const a=Array.isArray(x.result)?x.result:x.result?.deployments||[],v=a[0]?.versions||[];
          console.log('UI_ACTIVE_VERSION='+JSON.stringify({versions:v.map(x=>({id:x.version_id,pct:x.percentage}))}));
          NODE
          echo UI_LIVE_SCOPE_PROBE_READONLY=PASS
