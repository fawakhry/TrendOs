name: TrendOS Employee Username Case Probe

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-employee-Username-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.head_commit.message == 'PROBE EMPLOYEE USERNAME Username 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe literal Username safely
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec'
          BODY="$(curl -fsSL --get "$URL" \
            --data-urlencode 'action=verifyEmployeeSession' \
            --data-urlencode 'username=Username' \
            --data-urlencode 'token=__trendos_readonly_probe__')"
          echo "PROBE_RESPONSE=$BODY"
          echo 'READ_ONLY_USERNAME_CASE_PROBE_ONLY'
