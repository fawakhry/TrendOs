name: ONE SHOT Scoped Customer Stage Service Auth — Preserve DENY ALL
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-customer-stage-service-auth-20261102.yml'
permissions:
  contents: read
concurrency:
  group: trendos-customer-access-single-service-auth-20261102
  cancel-in-progress: false
jobs:
  authorize-only-dedicated-client:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-service-auth-bind-once-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_STAGE_ACCESS_CLIENT_ID: ${{ secrets.CF_STAGE_ACCESS_CLIENT_ID }}
      CF_STAGE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_STAGE_ACCESS_CLIENT_SECRET }}
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout one-time service auth operator, no Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact PR, secret presence and source-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = ops/customer-stage-service-auth-bind-once-20261102
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          test -n "$CF_STAGE_ACCESS_CLIENT_ID"
          test -n "$CF_STAGE_ACCESS_CLIENT_SECRET"
          python3 -m py_compile tools/one_shot_customer_stage_service_auth_bind_20261102.py
          python3 tests/customer_stage_service_auth_policy_gate_off_v1.test.py
          echo 'STAGE_DEDICATED_SECRETS_PRESENT_AND_SOURCE_GATE=PASS'
      - name: Verify exact isolated Worker/D1 and token, add one Service Auth rule then read back
        run: |
          set -euo pipefail
          python3 tools/one_shot_customer_stage_service_auth_bind_20261102.py
      - name: Keep all public entry points disabled
        run: |
          echo 'CUSTOMER_GO_LIVE=NO_GO'
          echo 'STAGE_WORKERS_DEV_AND_PREVIEW=OFF'
          echo 'CUSTOMER_PRODUCTION_WRITES=NONE'
