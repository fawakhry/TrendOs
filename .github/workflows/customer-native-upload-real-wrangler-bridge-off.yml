name: Customer Portal Original Wrangler D1 R2 Upload Bridge (OFF)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/customer_native_upload_real_wrangle_bridge_off.cjs'
      - 'tests/customer_native_upload_real_wrangle_bridge_off.py'
      - 'customer-native-upload-loopback-http-stage-off-v0.cjs'
      - 'customer-native-upload-coordinator-off-v0.js'
      - '.github/workflows/customer-native-upload-real-wrangler-bridge-off.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-worker-d1-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OPENAI_API_KEY: ''
      CUSTOMER_UPLOAD_REAL_LOCAL_E2E: '1'
      CUSTOMER_STAGE_LOCAL_E2E: '1'
      CUSTOMER_UPLOAD_ZERO_GOOGLE_CHECKOUT: ${{ github.workspace }}/.customer-pr311
    steps:
      - name: Checkout tested Customer Portal coordinator (main proposal)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout original immutable Zero Google Stage source for local test only
        uses: actions/checkout@v4
        with:
          ref: 0ff6ce9f1dfcc5d9dba319c13bd6a6c553f40009
          path: .customer-pr311
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert immutable original test source and default-OFF stage
        run: |
          set -euo pipefail
          test "$(git -C .customer-pr311 rev-parse HEAD)" = "0ff6ce9f1dfcc5d9dba319c13bd6a6c553f40009"
          grep -q 'workers_dev = false' .customer-pr311/cloudflare-d1/wrangler.customer-stage.toml
          grep -q 'main = "customer-stage/index.mjs"' .customer-pr311/cloudflare-d1/wrangler.customer-stage.toml
          ! grep -Eq '\[\[d1_databases\]\]|\[\[r2_buckets\]\]|database_id' .customer-pr311/cloudflare-d1/wrangler.customer-stage.toml
          node --check tests/customer_native_upload_real_wrangle_bridge_off.cjs
          node --check customer-native-upload-loopback-http-stage-off-v0.cjs
          node --check customer-native-upload-coordinator-off-v0.js
          python3 -m py_compile tests/customer_native_upload_real_wrangle_bridge_off.py
      - name: Install isolated disposable Wrangler runtime only
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/customer-upload-wrangler-local" --no-save --no-audit --no-fund wrangler@4
          echo "CUSTOMER_STAGE_LOCAL_WRANGLER=$RUNNER_TEMP/customer-upload-wrangler-local/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
      - name: Main coordinator + original Workerd/SQLite D1/private R2 actual LOCAL HTTP E2E
        run: |
          set -euo pipefail
          python3 tests/customer_native_upload_real_wrangle_bridge_off.py
      - name: Assert no deployment, no production binding and no residual config
        run: |
          set -euo pipefail
          test ! -f .customer-pr311/cloudflare-d1/.wrangler-customer-upload-bridge-local-ci.toml
          ! grep -q 'customer-native-upload-loopback-http-stage-off-v0.cjs' index.html
          ! grep -q 'customer-native-upload-loopback-http-stage-off-v0.cjs' app.js
          ! grep -q 'customer-native-upload-coordinator-off-v0.js' index.html
          echo 'REAL_LOCAL_WORKER_D1_R2_BRIDGE=PASS'
          echo 'REAL_CLOUDFLARE_DEPLOY=NO'
          echo 'CUSTOMER_PRODUCTION_RELEASE=NO_GO'
