name: A2.12 Forensic Readonly Check

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a212-forensic-readonly-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@4.33.2
      - name: Read exact A2.12 post-attempt state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$API_URL/v1/employee/accounting/health?a212forensic=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox;
            SELECT request_key,operation,actor,status,response_json
              FROM employee_accounting_request_ledger_v1
             WHERE request_key LIKE 'A212-DLINE-%'
             ORDER BY created_at DESC;
            SELECT entity_type,entity_id,event_type,actor,request_key,payload_json
              FROM employee_accounting_events_v1
             WHERE request_key LIKE 'A212-DLINE-%'
             ORDER BY created_at_ms DESC;
            SELECT accounting_line_id,order_id,line_id,customer_name,department,item_type,item_name,qty,
                   material_name,material_consumption,material_cost,operating_cost,other_cost,total_cost,
                   system_cost,system_sale_price,sale_price,profit,billing_status,approval_status,
                   stock_deducted,final_invoice_no,notes,updated_by,version,raw_json
              FROM employee_accounting_dept_lines_v1
             WHERE accounting_line_id LIKE 'A212-DLINE-%'
             ORDER BY created_at DESC;
          " > /tmp/d1.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')),groups=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Array.isArray(v.results))groups.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}};walk(x);
          const all=groups.flat();
          const c=all.find(r=>r.materials!==undefined)||{};
          const qs=all.filter(r=>r.request_key&&r.operation);
          const es=all.filter(r=>r.entity_type);
          const ds=all.filter(r=>r.accounting_line_id);
          console.log('A212_FORENSIC=PASS');
          console.log('BACKEND_MODE='+h.mode);
          console.log('AUTHORITATIVE_WRITES='+String(h.authoritativeWrites));
          console.log('SERVER_USERS_ACTIONS='+Number(h.writeCanaryAllowedUserCount||0)+'/'+Number(h.writeCanaryAllowedActionCount||0));
          console.log('COMMAND_BUDGET='+Number(h.writeCanaryCommandsStarted||0)+'/'+Number(h.writeCanaryMaxCommands||0));
          for(const k of ['materials','templates','parties','partyBalances','waste','deptLines','requestLedger','events','stockMoves','partyLedger','cashbox']) console.log(k.toUpperCase()+'='+Number(c[k]||0));
          console.log('A212_REQUEST_ROWS='+qs.length);
          console.log('A212_EVENT_ROWS='+es.length);
          console.log('A212_DEPT_LINE_ROWS='+ds.length);
          for(const q of qs) console.log('A212_REQUEST='+JSON.stringify(q));
          for(const e of es) console.log('A212_EVENT='+JSON.stringify(e));
          for(const d of ds) console.log('A212_DEPT_LINE='+JSON.stringify(d));
          NODE
