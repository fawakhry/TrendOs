
name: TrendOS Entry637 Sherif Canary Frontend Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry637-sherif-canary-frontend-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry637-sherif-canary-frontend-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      EXPECTED_FRONTEND_VERSION: 31e2c68d-6bb0-49bb-8535-7b8fecdb7458
      PRE_DISPATCHER_COMMIT: 53743a876a0ec04a22705e9b597db127e12b3480
      SHERIF_DISPATCHER_COMMIT: e95f4d59dd6b98b445b4cd468d22d5901f061931
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      NEW_CONFIG_TAG: 20261006-entry637-sherif-canary
      NEW_DISPATCHER_TAG: 20261006-entry637-sherif-alias

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Exact live preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1||full[0].id!==process.env.EXPECTED_FRONTEND_VERSION) throw new Error('frontend version drift '+JSON.stringify(full));
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY637_FRONTEND_VERSION_LOCK=PASS');
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry637frontpre=$GITHUB_SHA" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==true||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5||a.plaintextStored!==false) throw new Error('auth drift');
          if(b.enabled!==false) throw new Error('bridge drift');
          if(co.mode!=='READONLY'||ct.mode!=='READONLY'||cm.mode!=='READONLY'||o.mode!=='GENERAL'||ac.mode!=='READONLY') throw new Error('family drift');
          console.log('ENTRY637_FRONTEND_RUNTIME_PREFLIGHT=PASS');
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry637pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry637pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry637pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry637pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry637pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry637pre=$suffix" -o /tmp/live-attendance.js

          git show "$PRE_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" >/tmp/repo-pre.js
          cmp -s /tmp/live-dispatcher.js /tmp/repo-pre.js

          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = true;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          ! grep -Fq "'شريف'" /tmp/live-config.js
          ! grep -Fq "['شريف','شريف']" /tmp/live-dispatcher.js
          echo ENTRY637_EXACT_LIVE_BASELINE=PASS

      - name: Build exact-live Sherif canary bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js
          git show "$SHERIF_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" > cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()
          pat=r"window\.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS\s*=\s*\[([^\]]*)\];"
          m=re.search(pat,s)
          if not m: raise SystemExit('canary list not found')
          if 'شريف' in m.group(1): raise SystemExit('Sherif unexpectedly already present')
          body=m.group(1).rstrip()
          addition="'شريف','sherif','sheriff','sharif'"
          if body.strip():
              body=body+','+addition
          else:
              body=addition
          s=s[:m.start()]+f"window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS = [{body}];"+s[m.end():]
          p.write_text(s)
          PY

          export NEW_CONFIG="config.js?v=$NEW_CONFIG_TAG"
          export NEW_DISPATCHER="employee-api-dispatcher-v1.js?v=$NEW_DISPATCHER_TAG"
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          for pat,new,label in [
            (r'config[.]js[?]v=[^"]+',os.environ['NEW_CONFIG'],'config'),
            (r'employee-api-dispatcher-v1[.]js[?]v=[^"]+',os.environ['NEW_DISPATCHER'],'dispatcher')
          ]:
              if len(re.findall(pat,s))!=1: raise SystemExit(label+' cache tag count')
              s=re.sub(pat,new,s,count=1)
          p.write_text(s)
          PY

          node --check cloudflare-d1/frontend-dist/config.js
          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "'شريف'" cloudflare-d1/frontend-dist/config.js
          grep -Fq "'sherif'" cloudflare-d1/frontend-dist/config.js
          grep -Fq "['شريف','شريف']" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "['sherif','شريف']" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" cloudflare-d1/frontend-dist/config.js
          echo ENTRY637_SHERIF_CANARY_BUNDLE=PASS

      - name: Deploy with rollback and fail-closed Sherif proof
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry637 Sherif canary automatic rollback" --config "$FRONTEND_CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry637post=$suffix" -o /tmp/post-index.html \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry637post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry637post=$suffix" -o /tmp/post-dispatcher.js \
              && grep -Fq "'شريف'" /tmp/post-config.js \
              && grep -Fq "'sherif'" /tmp/post-config.js \
              && grep -Fq "['شريف','شريف']" /tmp/post-dispatcher.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" /tmp/post-config.js; then
                OK=1
                echo "ENTRY637_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          HTTP="$(curl --silent --show-error -o /tmp/sherif-pre-enroll.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST "$API_URL/v1/employee/auth/login" \
            --data '{"username":"شريف","password":"entry637-not-a-real-password"}')"
          node - "$HTTP" <<'NODE'
          const fs=require('fs');
          const status=Number(process.argv[2]);
          const b=JSON.parse(fs.readFileSync('/tmp/sherif-pre-enroll.json','utf8')||'{}');
          if(status!==409||b.code!=='employee-native-migration-required') throw new Error('Sherif pre-enroll did not fail closed');
          console.log('ENTRY637_SHERIF_PRE_ENROLL_FAIL_CLOSED=PASS');
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry637stable=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action');
          if(a.nativeOnly!==true||a.legacyBootstrapEnabled!==false||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5) throw new Error('auth post drift');
          if(b.enabled!==false) throw new Error('bridge post drift');
          console.log('ENTRY637_FRONTEND_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).filter(v=>Number(v.percentage||0)===100);
          if(full.length!==1) throw new Error('post version shape');
          console.log('ENTRY637_FRONTEND_VERSION='+String(full[0].version_id||full[0].id||''));
          NODE

          trap - ERR
          echo ENTRY637_SHERIF_CANARY_FRONTEND=PASS
          echo ENTRY637_BACKEND_NATIVE_ONLY=true
          echo ENTRY637_BACKEND_BOOTSTRAP=false
          echo ENTRY637_BACKEND_BRIDGE=false
          echo ENTRY637_D1_USER_COUNT=5
          echo ENTRY637_PRODUCTION_BUSINESS_MUTATION=NO
