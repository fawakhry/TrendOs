name: TrendOS Production Cloud Write Pending Migrations Read-Only

# PERF-CF-02CD: canonical read-only inspection of unapplied Production D1 migrations.
# This workflow MUST NOT apply migrations, execute schema files, deploy Workers, or enable Cloud Write.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-pending-migrations-readonly.yml'
      - 'cloudflare-d1/wrangler.toml'
      - 'cloudflare-d1/migrations/*.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-production-cloud-write-pending-migrations-readonly
  cancel-in-progress: false

jobs:
  inspect-production-pending-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PROD_DB_NAME: trendos-main
      PROD_DB_ID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
      WRANGLER_VERSION: 4.33.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hard Production identity and Cloud Write OFF gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"$' cloudflare-d1/wrangler.toml
          grep -Eq '^migrations_dir = "migrations"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          echo 'PRODUCTION_PENDING_MIGRATIONS_IDENTITY_OFF_GATE_PASS'

      - name: Live Production health before migration-list read
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/pre-health.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/pre-health.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.authConfigured===true && x.schemaReady===false && x.pendingOutbox===null && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('PRE_PENDING_LIST_HEALTH='+JSON.stringify({database:x.database,enabled:x.enabled,writesAccepted:x.writesAccepted,schemaReady:x.schemaReady,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Qualify Wrangler migrations-list command shape
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list --help > /tmp/wrangler-migrations-list-help.txt
          grep -q -- '--remote' /tmp/wrangler-migrations-list-help.txt
          grep -q -- '--config' /tmp/wrangler-migrations-list-help.txt
          echo 'WRANGLER_D1_MIGRATIONS_LIST_COMMAND_SHAPE_PASS'

      - name: List unapplied Production D1 migrations only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations list "$PROD_DB_NAME" \
            --remote \
            --config cloudflare-d1/wrangler.toml | tee /tmp/pending-migrations.txt
          test -s /tmp/pending-migrations.txt
          echo 'PRODUCTION_D1_PENDING_MIGRATIONS_LIST_READ_PASS'

      - name: Live Production health after migration-list read
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/post-health.json
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/pre-health.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/post-health.json','utf8'));
          const fields=['database','enabled','writesAccepted','authConfigured','schemaReady','pendingOutbox','schemaMutationFree','cutover','sheetsAuthoritative'];
          const same=fields.every(k=>JSON.stringify(before[k])===JSON.stringify(after[k]));
          const pass=same && after.success===true && after.database===true && after.enabled===false && after.writesAccepted===false && after.schemaReady===false && after.pendingOutbox===null && after.cutover===false && after.sheetsAuthoritative===true;
          console.log('POST_PENDING_LIST_HEALTH='+JSON.stringify({database:after.database,enabled:after.enabled,writesAccepted:after.writesAccepted,schemaReady:after.schemaReady,pendingOutbox:after.pendingOutbox,cutover:after.cutover,sheetsAuthoritative:after.sheetsAuthoritative,stateUnchanged:same,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Read-only conclusion
        run: |
          echo 'PERF_CF_02CD_PENDING_MIGRATIONS_READONLY_PASS'
          echo 'Only the canonical Wrangler migrations list command was used against Production D1.'
          echo 'No migration apply, SQL file execution, Worker deploy, Cloud Write enablement, or frontend cutover occurred.'
