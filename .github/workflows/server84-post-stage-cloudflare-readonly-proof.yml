name: SERVER-84 Post-Stage Real Cloudflare Safety Receipt (GET Only)

# Immutable-stage binding confirmation. ZERO Cloudflare mutations.
on:
  push:
    branches:
      - release/server68-staging-qualification-20261016
    paths:
      - .github/workflows/server84-post-stage-cloudflare-readonly-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage-vs-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: GET only script versions, stage bindings, public URL flags and fake D1 name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request, build_opener, HTTPSHandler, HTTPRedirectHandler, ProxyHandler
          from urllib.error import HTTPError,URLError
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',account) or len(token)<16:
              raise SystemExit('SERVER84_CREDENTIALS_UNAVAILABLE')
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          stage='trendos-server68-isolated-stage'
          expected={
              'trendos':'803aa6a2-bb4',
              'trendos-d1-api':'2b40f622-60c',
              stage:'d1a19c15-b745-405f-a926-38148eb12688'
          }
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          client=build_opener(ProxyHandler({}),HTTPSHandler(),NoRedirect())
          def get(path):
              if path not in {
                  '/workers/scripts/'+name+'/deployments' for name in expected
              } | {
                  '/workers/scripts/'+stage+'/settings',
                  '/workers/scripts/'+stage+'/subdomain'
              } and not re.fullmatch(r'/d1/database/[a-f0-9-]{36}',path):
                  raise SystemExit('SERVER84_ENDPOINT_NOT_ALLOWED')
              req=Request(base+path,method='GET',headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json'
              })
              try:
                  with client.open(req,timeout=15) as r:
                      raw=r.read(65537)
                      if r.status!=200 or len(raw)>65536:
                          raise SystemExit('SERVER84_RESPONSE_INVALID')
                  result=json.loads(raw)
                  if not isinstance(result,dict) or result.get('success') is not True:
                      raise SystemExit('SERVER84_METADATA_UNVERIFIED')
                  return result.get('result')
              except (HTTPError,URLError,TimeoutError,ValueError,TypeError,OSError):
                  raise SystemExit('SERVER84_CLOUDFLARE_GET_FAILED') from None
          for name,prefix in expected.items():
              info=get('/workers/scripts/'+name+'/deployments')
              dep=info.get('deployments') if isinstance(info,dict) else None
              if not isinstance(dep,list) or not dep or not isinstance(dep[0],dict):
                  raise SystemExit('SERVER84_WORKER_DEPLOYMENT_MISSING')
              versions=dep[0].get('versions')
              if not isinstance(versions,list) or len(versions)!=1 or versions[0].get('percentage')!=100:
                  raise SystemExit('SERVER84_ACTIVE_VERSION_AMBIGUOUS')
              version=versions[0].get('version_id','')
              if name==stage and version!='d1a19c15-b745-405f-a926-38148eb12688':
                  raise SystemExit('SERVER84_STAGE_CHANGED_UNEXPECTEDLY')
              if name!=stage and not version.startswith(prefix):
                  raise SystemExit('SERVER84_PRODUCTION_VERSION_CHANGED_MANUAL_REVIEW')
              print('SERVER84_VERSION='+name+';PREFIX='+version[:12]+';VERIFIED=YES')
          s=get('/workers/scripts/'+stage+'/settings')
          bindings=s.get('bindings') if isinstance(s,dict) else None
          if not isinstance(bindings,list): raise SystemExit('SERVER84_BINDINGS_UNQUALIFIED')
          names={i.get('name'):i for i in bindings if isinstance(i,dict)}
          b=names.get('DB')
          dbid=b.get('id',b.get('database_id')) if isinstance(b,dict) else None
          if (not isinstance(b,dict) or b.get('type')!='d1' or
              not isinstance(dbid,str) or not re.fullmatch(r'[a-f0-9-]{36}',dbid)):
              raise SystemExit('SERVER84_STAGE_D1_BINDING_UNVERIFIED')
          if (names.get('TRENDOSSHOP_SERVICE_READ_ENABLED',{}).get('text')!='false' or
              names.get('MIRROR_SERVICE_READ_ENABLED',{}).get('text')!='false' or
              names.get('TRENDOSSHOP_READER_TOKEN_SHA256_HEX')):
              raise SystemExit('SERVER84_STAGE_READER_NOT_OFF')
          public=get('/workers/scripts/'+stage+'/subdomain')
          if not isinstance(public,dict) or public.get('enabled') is not False or public.get('previews_enabled') is not False:
              raise SystemExit('SERVER84_STAGE_PUBLICATION_UNSAFE')
          meta=get('/d1/database/'+dbid)
          if not isinstance(meta,dict) or meta.get('name')!='trendos-server82-synthetic-20261021':
              raise SystemExit('SERVER84_WRONG_STAGE_D1_NAME')
          print('SERVER84_STAGE_D1=EXACT_SYNTHETIC_NAME;PUBLIC_LINKS_OFF=YES;READERS_OFF=YES')
          print('SERVER84_PRODUCTION_VERSION_PARITY=UNCHANGED;D1_PRODUCTION_QUERIES=NO;CUSTOMER_ROWS=NO')
          print('SERVER84_LIVE_UBUNTU=NO;D01_D06_FULL_GO=NO')
          PY
