name: TrendOS 02CR Field Parity Probe TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - .github/workflows/trendos-02cr-field-parity-probe-temp.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EDGE_BASE: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      TRENDOS_PROD_QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only field parity probe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base = process.env.EDGE_BASE;
          const apps = process.env.APPS_SCRIPT_URL;
          async function jf(url, opts={}) {
            const r = await fetch(url, {cache:'no-store', ...opts});
            const raw = await r.text(); let body={}; try { body=JSON.parse(raw||'{}'); } catch {}
            return {status:r.status, body};
          }
          function filled(v){ return !(v === null || v === undefined || String(v).trim() === ''); }
          function counts(rows){
            const keys = new Set(); for (const r of rows||[]) Object.keys(r||{}).forEach(k=>keys.add(k));
            const out={}; for (const k of [...keys].sort()) out[k]=(rows||[]).reduce((n,r)=>n+(filled(r&&r[k])?1:0),0);
            return out;
          }
          (async()=>{
            assert.ok(process.env.TRENDOS_PROD_QUALIFY_USERNAME);
            assert.ok(process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN);
            const app = await jf(apps, {method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username:process.env.TRENDOS_PROD_QUALIFY_USERNAME,token:process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN,screen:'print',page:'1',pageSize:'100'})});
            assert.equal(app.status,200); assert.equal(app.body.success,true);
            const session = await jf(base + '/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username:process.env.TRENDOS_PROD_QUALIFY_USERNAME,token:process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN})});
            assert.equal(session.status,200); assert.ok(session.body.edgeToken);
            const d1 = await jf(base + '/v1/edge/orders/page?screen=print&page=1&pageSize=100',{headers:{accept:'application/json',authorization:'Bearer '+session.body.edgeToken}});
            assert.equal(d1.status,200); assert.equal(d1.body.success,true);
            const ac=counts(app.body.rows||[]), dc=counts(d1.body.rows||[]);
            const all=[...new Set([...Object.keys(ac),...Object.keys(dc)])].sort();
            const deficits=all.filter(k=>(ac[k]||0)>(dc[k]||0)).map(k=>({field:k,appsNonEmpty:ac[k]||0,d1NonEmpty:dc[k]||0}));
            const extra=all.filter(k=>(dc[k]||0)>(ac[k]||0)).map(k=>({field:k,appsNonEmpty:ac[k]||0,d1NonEmpty:dc[k]||0}));
            console.log('PERF_CF_02CR_ROW_COUNTS='+JSON.stringify({apps:(app.body.rows||[]).length,d1:(d1.body.rows||[]).length}));
            console.log('PERF_CF_02CR_FIELD_DEFICITS='+JSON.stringify(deficits));
            console.log('PERF_CF_02CR_FIELD_EXTRA='+JSON.stringify(extra));
            console.log('PERF_CF_02CR_FIELD_PARITY_PROBE_PASS_NO_VALUES');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
