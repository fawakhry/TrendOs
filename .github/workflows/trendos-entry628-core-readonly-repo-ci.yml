name: TrendOS Entry628 Core Readonly Repo CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'employee-api-dispatcher-v1.js'
      - 'config.js'
      - 'docs/trendos/staging/ENTRY628_CORE_READONLY_BRIDGE_REDUCTION_MANIFEST.json'
      - 'tests/entry628_employee_core_readonly_dispatch.test.mjs'
      - 'cloudflare-d1/src/employee-core-native-v1.mjs'
      - '.github/workflows/trendos-entry628-core-readonly-repo-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Entry628 Core read-only contract
        shell: bash
        run: |
          set -euo pipefail
          node --check employee-api-dispatcher-v1.js
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node tests/entry628_employee_core_readonly_dispatch.test.mjs
          node tests/entry614_zero_google_employee_business_coverage.test.mjs
          node tests/entry627_employee_native_alias_canary.test.mjs
          echo ENTRY628_REPO_GATE=PASS
      - name: No runtime mutation
        shell: bash
        run: |
          echo ENTRY628_PRODUCTION_MUTATION=NO
          echo ENTRY628_D1_CONTROL_MUTATION=NO
          echo ENTRY628_BRIDGE_POLICY_MUTATION=NO
          echo ENTRY628_ACCOUNTING_TOUCHED=NO
          echo ENTRY628_EASYSTORE_TOUCHED=NO
