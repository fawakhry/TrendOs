name: TrendOS Entry647 Employee Auth Attendance Frontend Repair Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry647-auth-attendance-frontend-repair-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry647-auth-attendance-frontend-repair-controlled
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      D1_CONFIG: cloudflare-d1/wrangler.toml
      DATABASE: trendos-main
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      EXPECTED_PRE_FRONTEND_VERSION: e2717f15-5166-43ac-b1df-702d0e76642a
      EXPECTED_STALE_ATTENDANCE_HASH: 4472b66306a31c365a5a3e2b98e73dece85e93f1
      CACHE_TAG: 20261007-entry647-auth-attendance-repair

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Source qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check employee-api-dispatcher-v1.js
          node --check attendance-v1.js
          node --check attendance-clockin-ui-v1.js
          node --check config.js
          node --check cloudflare-d1/src/frontend-static-worker.mjs
          node tests/attendance_d1_ui_contract_entry620.test.mjs
          node tests/entry647_employee_login_attendance_runtime_repair.test.mjs
          echo ENTRY647_SOURCE_QUALIFICATION=PASS

      - name: Exact Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend active version shape '+JSON.stringify(full));
          if(full[0].id!==process.env.EXPECTED_PRE_FRONTEND_VERSION) throw new Error('frontend version drift '+full[0].id);
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY647_PRE_FRONTEND_VERSION='+full[0].id);
          NODE

          suffix="$GITHUB_SHA-$(date +%s%N)"
          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health?entry647pre=$suffix" -o /tmp/auth-pre.json
          curl --fail --silent --show-error "$API_URL/v1/employee/ops/health?entry647pre=$suffix" -o /tmp/ops-pre.json
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry647pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry647pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry647pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry647pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry647pre=$suffix" -o /tmp/live-attendance.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-clockin-ui-v1.js?entry647pre=$suffix" -o /tmp/live-clockin.js

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-pre.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/ops-pre.json','utf8'));
          const c=fs.readFileSync('/tmp/live-config.js','utf8');
          const d=fs.readFileSync('/tmp/live-dispatcher.js','utf8');
          if(a.mode!=='NATIVE'||a.nativeOnly!==true||a.envEnabled!==true||
             Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||
             a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||
             a.plaintextStored!==false) throw new Error('auth preflight drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7||
             Number(o.googleBusinessCalls||0)!==0||o.appsScriptBusinessAuthority!==false) throw new Error('ops preflight drift');
          if(!c.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true')||
             !c.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false')||
             !c.includes("MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'")) throw new Error('frontend config preflight drift');
          if(!d.includes('T12_ENTRY644_CORE_GENERAL_READY_V1_20261007')) throw new Error('unexpected live dispatcher prestate');
          console.log('ENTRY647_RUNTIME_PREFLIGHT=PASS');
          NODE

          test "$(git hash-object /tmp/live-attendance.js)" = "$EXPECTED_STALE_ATTENDANCE_HASH"
          test "$(git hash-object /tmp/live-app.js)" = "$(git hash-object app.js)"
          echo ENTRY647_STALE_ATTENDANCE_RUNTIME_CONFIRMED=PASS
          echo ENTRY647_APP_RUNTIME_MATCH=PASS

          TODAY="$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()))")"
          echo "$TODAY" >/tmp/cairo-date.txt
          npx wrangler d1 execute "$DATABASE" --remote --config "$D1_CONFIG" --json --command "
            SELECT COUNT(*) AS attendanceDays,
                   COUNT(*) FILTER (WHERE clock_in_time IS NOT NULL AND TRIM(clock_in_time)<>'') AS clockins
              FROM employee_attendance_days_v1
             WHERE date_key='$TODAY';
            SELECT COUNT(*) AS startPulses
              FROM employee_attendance_pulses_v1 p
              JOIN employee_attendance_days_v1 d ON d.attendance_id=p.attendance_id
             WHERE d.date_key='$TODAY' AND p.pulse_type='start';
          " >/tmp/attendance-before.json
          cp /tmp/attendance-before.json /tmp/attendance-before-lock.json
          echo ENTRY647_ATTENDANCE_D1_BASELINE_CAPTURED=PASS

      - name: Rebuild from exact current live asset snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist

          # Entry646 was built from this same root asset set. Re-fetch every root
          # HTML/JS/CSS file from the currently active Production version so this
          # repair cannot silently reintroduce an older sibling asset.
          while IFS= read -r src; do
            name="$(basename "$src")"
            curl --fail --silent --show-error --location               "$FRONTEND_URL/$name?entry647snapshot=$GITHUB_SHA-$(date +%s%N)"               -o "cloudflare-d1/frontend-dist/$name"
          done < <(find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) | sort)

          # Restore the qualified attendance contract and the hardened dispatcher.
          cp attendance-v1.js cloudflare-d1/frontend-dist/attendance-v1.js
          cp employee-api-dispatcher-v1.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          # Patch cache tags on the exact live index/config snapshots only.
          CACHE_TAG="$CACHE_TAG" python3 <<'PY'
          from pathlib import Path
          import os,re
          tag=os.environ['CACHE_TAG']

          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          for name in ['config.js','app.js','employee-api-dispatcher-v1.js']:
              pat=re.escape(name)+r'\?v=[^"]+'
              found=re.findall(pat,s)
              if len(found)!=1:
                  raise SystemExit(f'{name} index tag count={len(found)}')
              s=re.sub(pat,name+'?v='+tag,s,count=1)
          p.write_text(s)

          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()
          for name in ['attendance-v1.js','attendance-clockin-ui-v1.js']:
              pat=re.escape(name)+r"\?v=[^']+"
              found=re.findall(pat,s)
              if len(found)!=1:
                  raise SystemExit(f'{name} config tag count={len(found)}')
              s=re.sub(pat,name+'?v='+tag,s,count=1)
          p.write_text(s)
          PY

          node --check cloudflare-d1/frontend-dist/app.js
          node --check cloudflare-d1/frontend-dist/config.js
          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          node --check cloudflare-d1/frontend-dist/attendance-v1.js
          node --check cloudflare-d1/frontend-dist/attendance-clockin-ui-v1.js

          grep -Fq "config.js?v=$CACHE_TAG" cloudflare-d1/frontend-dist/index.html
          grep -Fq "app.js?v=$CACHE_TAG" cloudflare-d1/frontend-dist/index.html
          grep -Fq "employee-api-dispatcher-v1.js?v=$CACHE_TAG" cloudflare-d1/frontend-dist/index.html
          grep -Fq "attendance-v1.js?v=$CACHE_TAG" cloudflare-d1/frontend-dist/config.js
          grep -Fq "attendance-clockin-ui-v1.js?v=$CACHE_TAG" cloudflare-d1/frontend-dist/config.js
          grep -Fq "normalizeAttendanceBackendResponse" cloudflare-d1/frontend-dist/attendance-v1.js
          grep -Fq "T12_ENTRY647_AUTH_ATTENDANCE_RUNTIME_REPAIR_V1_20261007" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          echo ENTRY647_EXACT_LIVE_REPAIR_BUNDLE=PASS

      - name: Deploy frontend repair with exact rollback
        id: deploy
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry647 auth attendance automatic rollback" --config "$FRONTEND_CONFIG" || true
              echo ENTRY647_AUTOMATIC_ROLLBACK_ATTEMPTED=YES
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 30); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s%N)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry647post=$suffix" -o /tmp/post-index.html               && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry647post=$suffix" -o /tmp/post-config.js               && curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry647post=$suffix" -o /tmp/post-app.js               && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry647post=$suffix" -o /tmp/post-dispatcher.js               && curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry647post=$suffix" -o /tmp/post-attendance.js               && curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-clockin-ui-v1.js?entry647post=$suffix" -o /tmp/post-clockin.js               && grep -Fq "config.js?v=$CACHE_TAG" /tmp/post-index.html               && grep -Fq "app.js?v=$CACHE_TAG" /tmp/post-index.html               && grep -Fq "employee-api-dispatcher-v1.js?v=$CACHE_TAG" /tmp/post-index.html               && grep -Fq "attendance-v1.js?v=$CACHE_TAG" /tmp/post-config.js               && grep -Fq "attendance-clockin-ui-v1.js?v=$CACHE_TAG" /tmp/post-config.js               && grep -Fq "normalizeAttendanceBackendResponse" /tmp/post-attendance.js               && grep -Fq "T12_ENTRY647_AUTH_ATTENDANCE_RUNTIME_REPAIR_V1_20261007" /tmp/post-dispatcher.js; then
                OK=1
                echo "ENTRY647_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          test "$(git hash-object /tmp/post-attendance.js)" = "$(git hash-object attendance-v1.js)"
          test "$(git hash-object /tmp/post-dispatcher.js)" = "$(git hash-object employee-api-dispatcher-v1.js)"
          test "$(git hash-object /tmp/post-app.js)" = "$(git hash-object /tmp/live-app.js)"
          test "$(git hash-object /tmp/post-clockin.js)" = "$(git hash-object /tmp/live-clockin.js)"
          echo ENTRY647_LIVE_ATTENDANCE_RESTORED=PASS
          echo ENTRY647_LIVE_DISPATCHER_HARDENED=PASS
          echo ENTRY647_UNRELATED_APP_CLOCKIN_PRESERVED=PASS

          for asset in index.html config.js app.js employee-api-dispatcher-v1.js attendance-v1.js attendance-clockin-ui-v1.js; do
            curl --fail --silent --show-error -D "/tmp/h-$asset" -o /dev/null               "$FRONTEND_URL/$asset?entry647headers=$GITHUB_SHA-$(date +%s%N)"
            grep -Eiq '^cache-control:.*no-store' "/tmp/h-$asset"
          done
          echo ENTRY647_CRITICAL_ASSET_NO_STORE_RUNTIME=PASS

          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health?entry647post=$GITHUB_SHA-$(date +%s%N)" -o /tmp/auth-post.json
          curl --fail --silent --show-error "$API_URL/v1/employee/ops/health?entry647post=$GITHUB_SHA-$(date +%s%N)" -o /tmp/ops-post.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-post.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/ops-post.json','utf8'));
          if(a.mode!=='NATIVE'||a.nativeOnly!==true||a.envEnabled!==true||
             Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||
             a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||
             a.plaintextStored!==false) throw new Error('auth post drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7||
             Number(o.googleBusinessCalls||0)!==0||o.appsScriptBusinessAuthority!==false) throw new Error('ops post drift');
          console.log('ENTRY647_RUNTIME_POSTFLIGHT=PASS');
          NODE

          TODAY="$(cat /tmp/cairo-date.txt)"
          npx wrangler d1 execute "$DATABASE" --remote --config "$D1_CONFIG" --json --command "
            SELECT COUNT(*) AS attendanceDays,
                   COUNT(*) FILTER (WHERE clock_in_time IS NOT NULL AND TRIM(clock_in_time)<>'') AS clockins
              FROM employee_attendance_days_v1
             WHERE date_key='$TODAY';
            SELECT COUNT(*) AS startPulses
              FROM employee_attendance_pulses_v1 p
              JOIN employee_attendance_days_v1 d ON d.attendance_id=p.attendance_id
             WHERE d.date_key='$TODAY' AND p.pulse_type='start';
          " >/tmp/attendance-after.json
          cmp -s /tmp/attendance-before-lock.json /tmp/attendance-after.json
          echo ENTRY647_ATTENDANCE_D1_MUTATION=NO

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend post version shape');
          fs.writeFileSync('/tmp/post-ui-version.txt',full[0].id);
          console.log('ENTRY647_POST_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY647=PASS
          echo ENTRY647_ROLLBACK_USED=NO
          echo ENTRY647_ACCOUNTING_MUTATION=NO
          echo ENTRY647_EASYSTORE_MUTATION=NO

      - name: Final
        if: ${{ success() }}
        shell: bash
        run: |
          echo "ENTRY647_PRE_FRONTEND_VERSION=$(cat /tmp/pre-ui-version.txt)"
          echo "ENTRY647_POST_FRONTEND_VERSION=$(cat /tmp/post-ui-version.txt)"
          echo ENTRY647_AUTH_MODE=NATIVE
          echo ENTRY647_D1_NATIVE_READY=6/6
          echo ENTRY647_CANARY_FRONTEND=false
          echo ENTRY647_ATTENDANCE_UI_CONTRACT=RESTORED
          echo ENTRY647=PASS
