name: Customer isolated private R2 empty bootstrap ONCE
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/customer-stage-private-r2-bootstrap-once.yml']
permissions:
  contents: read
jobs:
  readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/customer-stage-private-r2-bootstrap-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b31228887f9073c1aa8c6f2c06597b194f567df
      - name: Exact existing isolated Stage GET only - no public HTTP or writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,json,sys,datetime,importlib.util,hashlib,urllib.request,urllib.error
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("original","tools/zg_customer_stage_d1_binding_resolver_v1.py")
          original=importlib.util.module_from_spec(spec);spec.loader.exec_module(original)
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not re.fullmatch(r"[a-fA-F0-9]{32}",account) or len(token)<20:
              raise SystemExit("RELEASE_PREFLIGHT_CREDENTIALS_MISSING")
          print("PREFLIGHT_UTC="+datetime.datetime.now(datetime.timezone.utc).isoformat())
          root="/workers/scripts/"+original.WORKER
          sub=original.api_get(account,token,root+"/subdomain")["result"]
          settings=original.api_get(account,token,root+"/settings")["result"]
          databases=original.read_d1_inventory(account,token)
          original.resolved_config(original.SOURCE.read_text(),settings,sub,databases)
          print("EXACT_EXISTING_STAGE_WORKER_SYNTHETIC_D1=PASS")
          print("WORKERS_DEV_AND_PREVIEW=OFF")
          bindings=settings["bindings"]
          flags={x.get("name"):x.get("text") for x in bindings if x.get("type")=="plain_text"}
          enabled=[k for k in original.REQUIRED_OFF if flags.get(k)!="false"]
          print("REMOTE_CUSTOMER_FLAGS_ALL_OFF="+str(not enabled))
          print("REMOTE_R2_BINDINGS="+str(sum(x.get("type")=="r2_bucket" for x in bindings)))
          access=os.environ.get("CLOUDFLARE_ACCESS_API_TOKEN","")
          try:
              apps=original.api_get(account,access,"/access/apps?per_page=100")["result"]
              matches=[x for x in apps if hashlib.sha256(str(x.get("id","")).encode()).hexdigest().startswith("34134951077e")]
              print("PINNED_STAGE_ACCESS_APP_MATCHES="+str(len(matches)))
              if len(matches)==1:
                  app=matches[0]
                  print("ACCESS_SINGLE_HEADER_MODE="+str(bool(app.get("read_service_tokens_from_header"))))
                  policies=original.api_get(account,access,"/access/apps/"+app["id"]+"/policies")["result"]
                  print("ACCESS_POLICY_COUNT="+str(len(policies)))
                  print("ACCESS_HAS_DENY_EVERYONE="+str(any(p.get("decision")=="deny" and p.get("include")==[{"everyone":{}}] for p in policies)))
                  print("ACCESS_SERVICE_AUTH_POLICY_COUNT="+str(sum(p.get("decision")=="non_identity" for p in policies)))
          except ValueError as e:
              print("ACCESS_READ_STATUS="+str(e))

          bucket_name="trendos-customer-stage-private-synthetic-20261103-v0"
          r2root="/r2/buckets"
          def r2api(method,path,payload=None):
              if method not in ("GET","POST") or not path.startswith(r2root) or (method=="POST" and (path!=r2root or payload!={"name":bucket_name})):
                  raise SystemExit("R2_ENDPOINT_NOT_AUTHORIZED")
              request=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+account+path,method=method,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","User-Agent":"TrendOS-Customer-Stage-Qualification/1.0"},data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:value=json.load(response)
              except urllib.error.HTTPError as error:
                  try: codes=[x.get("code") for x in json.loads(error.read(12000)).get("errors",[]) if isinstance(x,dict)]
                  except Exception:codes=[]
                  print("R2_API_HTTP="+str(error.code))
                  print("R2_API_ERROR_CODES="+json.dumps(codes))
                  raise SystemExit("R2_STAGE_BOOTSTRAP_BLOCKED")
              if not isinstance(value,dict) or value.get("success") is not True:raise SystemExit("R2_API_RESULT_NOT_VERIFIED")
              return value.get("result")
          inventory=r2api("GET",r2root+"?per_page=1000")
          entries=inventory.get("buckets") if isinstance(inventory,dict) else None
          if not isinstance(entries,list):raise SystemExit("R2_BUCKET_INVENTORY_SHAPE_UNKNOWN")
          if any(x.get("name")==bucket_name for x in entries):raise SystemExit("R2_STAGE_NAME_ALREADY_EXISTS_STOP")
          created=r2api("POST",r2root,{"name":bucket_name})
          if not isinstance(created,dict) or created.get("name")!=bucket_name:raise SystemExit("R2_CREATE_READBACK_NAME_UNPROVEN")
          print("ONE_NEW_EMPTY_STAGE_R2_BUCKET_CREATED=YES")
          managed=r2api("GET",r2root+"/"+bucket_name+"/domains/managed")
          custom=r2api("GET",r2root+"/"+bucket_name+"/domains/custom")
          if not isinstance(managed,dict) or managed.get("enabled") is not False:raise SystemExit("STAGE_R2_PUBLIC_MANAGED_NOT_CONFIRMED_OFF")
          domains=custom.get("domains") if isinstance(custom,dict) else None
          if domains!=[]:raise SystemExit("STAGE_R2_CUSTOM_DOMAINS_NOT_CONFIRMED_EMPTY")
          print("STAGE_R2_PUBLIC_DEVELOPMENT_URL=OFF_VERIFIED")
          print("STAGE_R2_CUSTOM_DOMAINS=NONE_VERIFIED")
          print("STAGE_R2_WORKER_BINDING=NOT_CHANGED")
          print("R2_OBJECT_WRITES=NONE")
          print("CONTROL_PLANE_SCOPE=STAGE_EMPTY_PRIVATE_R2_ONLY")
          print("PUBLIC_HTTP_REQUESTS=NONE")
          print("WORKER_DEPLOY_POLICY_TOKEN_OR_PRODUCTION_CHANGES=NONE")
          print("CUSTOMER_PRODUCTION_RELEASE=NOT_QUALIFIED")
          PY
