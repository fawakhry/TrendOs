name: Autonomous Printshop T12 Order Schedule Apply Controlled

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-t12-order-schedule-apply-controlled.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-t12-order-schedule-apply
  cancel-in-progress: false

jobs:
  apply-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      SQL: autonomous-printshop/migrations/0021_t12_order_schedule_v1.sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify migration contract
        run: node autonomous-printshop/tests/t12_order_schedule_v1.test.mjs

      - name: Hard additive-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SQL"
          grep -Eq 'CREATE TABLE IF NOT EXISTS t12_prod_order_schedule' "$SQL"
          grep -Eq 'INSERT OR IGNORE INTO t12_prod_order_schedule' "$SQL"
          ! grep -Eiq '\b(DROP|ALTER|DELETE|UPDATE|REPLACE|VACUUM)\b' "$SQL"
          ! grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+(t12_prod_orders|t12_prod_lines|t12_prod_line_runtime|employee_core_)' "$SQL"
          echo 'ORDER_SCHEDULE_ADDITIVE_ONLY=PASS'

      - name: Pre-apply source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              COUNT(*) AS nativeOrders,
              MIN(created_at) AS firstCreatedAt,
              MAX(created_at) AS lastCreatedAt,
              SUM(CASE WHEN EXISTS(
                SELECT 1 FROM t12_prod_lines l
                 WHERE l.order_id=o.order_id AND l.fly_print=1
              ) THEN 1 ELSE 0 END) AS flyOrders
            FROM t12_prod_orders o;
          " > /tmp/pre.json
          cat /tmp/pre.json
          node - <<'NODE'
          const raw=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'));
          const r=raw?.[0]?.results?.[0]||{};
          if(Number(r.nativeOrders)<=0) process.exit(1);
          console.log('NATIVE_ORDERS='+r.nativeOrders);
          console.log('FLY_ORDERS='+r.flyOrders);
          NODE

      - name: Apply additive schedule table/backfill
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file "$SQL"

      - name: Verify complete deterministic schedule coverage
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM t12_prod_orders) AS nativeOrders,
              (SELECT COUNT(*) FROM t12_prod_order_schedule) AS scheduleRows,
              (SELECT COUNT(*)
                 FROM t12_prod_orders o
                 LEFT JOIN t12_prod_order_schedule s ON s.order_id=o.order_id
                WHERE s.order_id IS NULL) AS missingSchedule,
              (SELECT COUNT(*)
                 FROM t12_prod_orders o
                 JOIN t12_prod_order_schedule s ON s.order_id=o.order_id
                WHERE s.expected_delivery_date <>
                  CASE
                    WHEN EXISTS(
                      SELECT 1 FROM t12_prod_lines l
                       WHERE l.order_id=o.order_id AND l.fly_print=1
                    )
                    THEN date(datetime(o.created_at,'+3 hours'))
                    ELSE date(datetime(o.created_at,'+3 hours'),'+2 days')
                  END) AS policyMismatches,
              (SELECT COUNT(*) FROM t12_prod_order_schedule
                WHERE policy_code='LEGACY_D0_FLY_D2_STANDARD_V1') AS policyRows
          " > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const raw=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'));
          const r=raw?.[0]?.results?.[0]||{};
          const native=Number(r.nativeOrders||0);
          if(native<=0) process.exit(1);
          if(Number(r.scheduleRows)!==native) process.exit(2);
          if(Number(r.missingSchedule)!==0) process.exit(3);
          if(Number(r.policyMismatches)!==0) process.exit(4);
          if(Number(r.policyRows)!==native) process.exit(5);
          console.log('ORDER_SCHEDULE_COVERAGE=PASS');
          console.log('ORDER_SCHEDULE_ROWS='+native);
          NODE

      - name: Business behavior boundary
        run: |
          echo 'ORDER_OR_LINE_STATUS_CHANGED=NO'
          echo 'EMPLOYEE_ASSIGNMENT_CHANGED=NO'
          echo 'AUTOPILOT=OFF'
          echo 'OPERATOR_TASK_AUTHORITY=OFF'
          echo 'SCHEDULE_METADATA_ONLY=YES'
