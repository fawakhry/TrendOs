name: TrendOS T12 A55 Customer Projection Production Deploy

on:
  push:
    branches:
      - candidate/t12-customer-legacy-projection-a55-20260929
    paths:
      - 'docs/trendos/staging/A55_CUSTOMER_PROJECTION_DEPLOY.trigger'

permissions:
  contents: read

concurrency:
  group: trendos-t12-a55-customer-projection-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify exact A55 source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fx 'name = "trendos-d1-api"' cloudflare-d1/wrangler.toml
          grep -Fx 'main = "production-shadow/index.js"' cloudflare-d1/wrangler.toml
          grep -F "/v1/t12/customers/legacy-projection" cloudflare-d1/src/t12-customer-write-handler.mjs
          grep -F "projection-requires-customer-write-off" cloudflare-d1/src/t12-customer-legacy-projection.mjs
          node --experimental-sqlite tests/t12_customer_legacy_projection_a55.test.mjs
          node --experimental-sqlite tests/t12_customer_master_a53.test.mjs
          node --experimental-sqlite tests/t12_customer_native_search_a54.test.mjs
          echo 'A55_PREDEPLOY=PASS'

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.142.0

      - name: Verify customer control remains OFF
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --json --command             "SELECT marker,mode,canary_remaining,next_customer_number FROM t12_customer_control WHERE singleton=1;              SELECT COUNT(*) AS totalCustomers,SUM(CASE WHEN source='legacy-mirror' THEN 1 ELSE 0 END) AS legacyCustomers,SUM(CASE WHEN source='cloud-native' THEN 1 ELSE 0 END) AS cloudCustomers FROM t12_customers;"             > /tmp/a55_pre.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/a55_pre.json','utf8'));
          const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v?.results)?v.results:[]);
          const ctl=rows.find(r=>r.marker==='T12_CUSTOMER_MASTER_V1')||{};
          const cnt=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'totalCustomers'))||{};
          const pass=ctl.mode==='OFF'&&Number(ctl.canary_remaining)===0&&Number(cnt.totalCustomers)>=247&&Number(cnt.cloudCustomers||0)===0;
          console.log('A55_CONTROL_GUARD='+JSON.stringify({mode:ctl.mode,canaryRemaining:ctl.canary_remaining,total:cnt.totalCustomers,legacy:cnt.legacyCustomers,cloud:cnt.cloudCustomers,pass}));
          if(!pass)process.exit(1);
          NODE

      - name: Deploy Worker code only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/wrangler.toml
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5

      - name: Verify protected projection route and unchanged authorities
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            hcode="$(curl --silent --show-error --output /tmp/a55_health.json --write-out '%{http_code}' "$PROD_URL/v1/t12/customers/write/health" || true)"
            pcode="$(curl --silent --show-error --output /tmp/a55_projection.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$PROD_URL/v1/t12/customers/legacy-projection" || true)"
            echo "A55_PROPAGATION_ATTEMPT=$attempt HEALTH=$hcode PROJECTION=$pcode"
            if [ "$hcode" = '200' ] && [ "$pcode" = '401' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/a55_health.json','utf8'));if(!x.success||x.mode!=='OFF'||Number(x.customerCount)<247||x.generalCutover!==false)process.exit(1)"; then ready=1;break;fi
            sleep 3
          done
          test "$ready" = '1'
          order_code="$(curl --silent --show-error --output /tmp/a55_order.json --write-out '%{http_code}' "$PROD_URL/v1/t12/orders/create/health")"
          test "$order_code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/a55_order.json','utf8'));if(!x.success||x.generalCutover!==true)process.exit(1)"
          echo 'A55_PROJECTION_ROUTE=PROTECTED_READY'
          echo 'CUSTOMER_WRITE_AUTHORITY=APPS_SCRIPT'
          echo 'CUSTOMER_NATIVE_GENERAL_WRITE=OFF'
          echo 'GOOGLE_SHEETS_MUTATION=NO'
          echo 'ORDER_CREATE_UNCHANGED=YES'
          echo 'A55_PRODUCTION=PASS'

      - name: Automatic Worker rollback on verification failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        run: npx wrangler rollback --config cloudflare-d1/wrangler.toml --message "TrendOS A55 rollback after failed customer projection verification"
