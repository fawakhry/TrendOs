name: TrendOS Integrity V1

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
  pull_request:
    paths:
      - 'trendos-integrity-v1.gs'
      - 'trendos-integrity-runtime-tools-v1.gs'
      - 'trendos-core-p0-remediation-v1.gs'
      - 'trendos-core-p0-registry-writer-v1.gs'
      - 'trendos-order-line-integrity-v1.gs'
      - 'trendos-attendance-cleaning-integrity-v1.gs'
      - 'trendos-press-integrity-v1.gs'
      - 'trendos-invoice-integrity-v1.gs'
      - 'trendos-whatsapp-integrity-v1.gs'
      - 'trendos-handover-ops-integrity-v1.gs'
      - 'trendos-andon-integrity-v1.gs'
      - 'trendos-integrity-dashboard-v1.gs'
      - 'trendos-integrity-router-v1.gs'
      - 'D1_Fast_Auth_V2_5_Safe.gs'
      - 'customer-manager-send-integrity-v1.js'
      - 'trendos-integrity-v1.package.json'
      - 'tests/trendos_integrity_v1.test.js'
      - 'tests/trendos_integrity_runtime_tools_v1.test.js'
      - 'tests/trendos_core_p0_remediation_v1.test.js'
      - 'tests/trendos_core_p0_registry_writer_v1.test.js'
      - 'tests/trendos_order_line_integrity_v1.test.js'
      - 'tests/trendos_attendance_cleaning_integrity_v1.test.js'
      - 'tests/trendos_press_integrity_v1.test.js'
      - 'tests/trendos_invoice_integrity_v1.test.js'
      - 'tests/trendos_whatsapp_integrity_v1.test.js'
      - 'tests/trendos_handover_ops_integrity_v1.test.js'
      - 'tests/trendos_andon_integrity_v1.test.js'
      - 'tests/trendos_integrity_dashboard_v1.test.js'
      - 'tests/d1_fast_auth_v25_safe.test.js'
      - 'tests/trendos_integrity_router_v1.test.js'
      - 'tests/trendos_integrity_composition_v1.test.js'
      - 'tests/trendos_predeploy_package_v1.test.js'
      - 'tests/customer_manager_send_integrity_v1.test.js'
      - '.github/workflows/trendos-integrity-v1.yml'

permissions:
  contents: read

jobs:
  integrity-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TrendOS integrity foundation tests
        run: node tests/trendos_integrity_v1.test.js .
      - name: Run TrendOS public runtime tools tests
        run: node tests/trendos_integrity_runtime_tools_v1.test.js .
      - name: Run TrendOS CORE-P0 remediation tests
        run: node tests/trendos_core_p0_remediation_v1.test.js .
      - name: Run TrendOS CORE-P0 registry writer tests
        run: node tests/trendos_core_p0_registry_writer_v1.test.js .
      - name: Run TrendOS Phase 2 Order and Line tests
        run: node tests/trendos_order_line_integrity_v1.test.js .
      - name: Run TrendOS Attendance and Cleaning integrity tests
        run: node tests/trendos_attendance_cleaning_integrity_v1.test.js .
      - name: Run TrendOS Press integrity tests
        run: node tests/trendos_press_integrity_v1.test.js .
      - name: Run TrendOS Invoice integrity tests
        run: node tests/trendos_invoice_integrity_v1.test.js .
      - name: Run TrendOS WhatsApp backend integrity tests
        run: node tests/trendos_whatsapp_integrity_v1.test.js .
      - name: Run Customer Manager stable send ID tests
        run: node tests/customer_manager_send_integrity_v1.test.js .
      - name: Run TrendOS Handover and OPS integrity tests
        run: node tests/trendos_handover_ops_integrity_v1.test.js .
      - name: Run TrendOS ANDON integrity tests
        run: node tests/trendos_andon_integrity_v1.test.js .
      - name: Run TrendOS Integrity Dashboard tests
        run: node tests/trendos_integrity_dashboard_v1.test.js .
      - name: Run TrendOS Fast Auth V2.5 SAFE tests
        run: node tests/d1_fast_auth_v25_safe.test.js .
      - name: Run TrendOS Integrity Router tests
        run: node tests/trendos_integrity_router_v1.test.js .
      - name: Run composed Apps Script module syntax/collision test
        run: node tests/trendos_integrity_composition_v1.test.js .
      - name: Run pre-deploy package safety gate
        run: node tests/trendos_predeploy_package_v1.test.js .
