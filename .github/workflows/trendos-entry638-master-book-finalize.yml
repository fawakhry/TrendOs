name: TrendOS Entry638 Master Book Finalize

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry638-master-book-finalize.yml'

permissions:
  contents: write

concurrency:
  group: trendos-master-book-record
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - name: Sync latest branch
        run: git pull --ff-only origin candidate/t12-full-cloud-cutover-a56-20260929

      - name: Finalize book header and recording evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("TrendOS_MASTER_BOOK.md")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'(?m)^> إصدار الكتاب: \*\*.*?\*\* · تاريخ التحديث: .*? · المستودع:',
              '> إصدار الكتاب: **4.18-ZERO-GOOGLE-COMPACT — Entry638 post-Sherif Native readiness** · تاريخ التحديث: 2026-10-06 · المستودع:',
              s,
              count=1
          )

          marker = 'ENTRY638_DOCUMENTATION_CLOSURE=PASS'
          if marker not in s:
              s += """
          
#### Entry638 — Documentation closure and recording integrity
- Entry637 final public evidence commit: `e0feeeb4a59bb8d35920be875212d2ffbea1725c`.
- Entry638 public Runtime readiness evidence commit: `612b9ef911d407faa504c3e291f600291734120a`.
- First Master Book recorder workflow creation commit: `a249164a247fd9235fba0a7472469b705e38d910`.
- First recorder Run `37521916964` failed before creating a job because the generated YAML had invalid block indentation. No Runtime/Production/D1 mutation occurred from that failed documentation run.
- Recorder YAML was corrected in commit `a2d73a462203df12777753b0febf133eb91a9bfe`.
- Corrected recorder Run `37522117630` = SUCCESS; every job step passed.
- Master Book content commit produced by that successful run: `e9b2a74b15a8960ecc09f289695899088b3a142c`.
- Verification after commit confirmed the book contains:
  - strict mandatory recording rule;
  - Attempt 4 failure record;
  - `ENTRY637_FINAL=PASS_6_OF_6`;
  - `ENTRY638_RUNTIME_READINESS_6_OF_6=PASS`;
  - `ENTRY638_COMPLETENESS_GATE=PASS`.
- Recording policy now explicitly requires logging every success, failure, Runtime drift, rollback/restore, hardening repair, workflow/run/job, deploy, diagnosis and gate transition.
- Secrets, passwords, Tokens, password hashes and session secrets remain prohibited from documentation.
- `ENTRY638_DOCUMENTATION_CLOSURE=PASS`
"""
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit final documentation state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- TrendOS_MASTER_BOOK.md; then
            echo ENTRY638_MASTER_BOOK_FINAL_ALREADY_RECORDED=YES
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TrendOS_MASTER_BOOK.md
          git commit -m "docs: finalize Entry638 master book recording"
          git push origin HEAD:candidate/t12-full-cloud-cutover-a56-20260929
          echo ENTRY638_MASTER_BOOK_FINAL_RECORDED=PASS
