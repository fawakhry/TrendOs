name: TrendOS Operator Task V2 Proxy Secret Verify

on:
  push:
    branches:
      - operator-task-v2-production-activation-20260913
    paths:
      - '.github/workflows/trendos-operator-task-proxy-secret-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proxy-secret-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPS_SCRIPT_API_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Apps Script proxy secret is configured — invalid signature only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --silent --show-error --output /tmp/proxy.json --write-out '%{http_code}' --get \
            --data-urlencode 'action=operatorTaskEdgeProxyV2' \
            --data-urlencode 'protocol=TRENDOS_OT_EDGE_V1' \
            --data-urlencode 'method=GET' \
            --data-urlencode 'op=status' \
            --data-urlencode 'operator=secret-verify-probe' \
            --data-urlencode 'sessionJti=secret-verify-probe' \
            --data-urlencode 'assertedAt=0' \
            --data-urlencode 'payloadJson={}' \
            --data-urlencode 'signature=invalid' \
            "$APPS_SCRIPT_API_URL")"
          echo "APPS_SCRIPT_HTTP=$code"
          cat /tmp/proxy.json
          echo
          test "$code" = '200'
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/proxy.json','utf8'));
          const code=String(x&&x.code||'');
          if(code==='EDGE_PROXY_SECRET_NOT_CONFIGURED') process.exit(10);
          if(String(x&&x.message||'').includes('Action غير معروف.')) process.exit(11);
          console.log('APPS_SCRIPT_PROXY_SECRET_PRESENT=YES');
          console.log('FAIL_CLOSED_RESPONSE=' + JSON.stringify(x));
          NODE

      - name: Verify Cloudflare Worker proxy secret name exists — value unreadable
        shell: bash
        working-directory: cloudflare-d1
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@${WRANGLER_VERSION} secret list --config wrangler.toml > /tmp/secrets.txt
          cat /tmp/secrets.txt
          grep -q 'TRENDOS_OPERATOR_TASK_PROXY_SECRET' /tmp/secrets.txt
          echo 'CLOUDFLARE_PROXY_SECRET_PRESENT=YES'

      - name: Verify production Operator Task Edge gate is still OFF
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/ot.json --write-out '%{http_code}' https://trendos-d1-api.trendmall-contact.workers.dev/v1/operator/tasks/status)"
          cat /tmp/ot.json
          echo
          test "$code" = '503'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/ot.json','utf8')); if(x.code!=='OPERATOR_TASK_EDGE_DISABLED') process.exit(1); console.log('EDGE_GATE_STILL_OFF=YES')"

      - name: Safety conclusion
        run: |
          echo 'PROXY_SECRET_BINDINGS_VERIFY=PASS'
          echo 'NO_SECRET_VALUE_PRINTED=YES'
          echo 'NO_FLAGS_CHANGED=YES'
          echo 'NO_TASK_MUTATION=YES'
