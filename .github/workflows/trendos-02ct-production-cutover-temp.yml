name: TrendOS 02CT Production Frontend Cutover TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02ct-production-cutover-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_MAIN: f82c76fc9421e5f8021b94bbd64244a5fde24061
  CANDIDATE_COMMIT: d072a86e3ac57a72096b46096efc8c4a52af9da8
  CACHE_TAG: trendos-d1-cutover-20260906a
  PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
  PAGES_BASE: https://fawakhry.github.io/TrendOs
  QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
  QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pre-cutover fail-closed boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          if grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' config.js; then
            echo 'main D1 frontend flag already ON'; exit 1
          fi
          grep -Fq 'trendosSecureApiV1922' app.js
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(p){const r=await fetch(base+p,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{const e=await get('/v1/edge/health'),c=await get('/v1/cloud/write/health'),q=await get('/v1/qualification/cloud-write/reconcile/health'),u=await get('/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1');
            assert.equal(e.status,200);assert.equal(e.body.cutover,false);
            assert.equal(c.status,200);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);
            assert.equal(q.status,200);assert.equal(q.body.enabled,false);assert.equal(q.body.genericDrainEnabled,false);assert.equal(u.status,401);
            console.log('PERF_CF_02CT_PRE_CUTOVER_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Apply exact qualified frontend patch locally
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_COMMIT" --depth=1
          git show "$CANDIDATE_COMMIT:trendos-edge-orders-read-v1.js" > trendos-edge-orders-read-v1.js
          git show "$CANDIDATE_COMMIT:tests/frontend_edge_orders_cutover_02ct.test.mjs" > /tmp/frontend_edge_orders_cutover_02ct.test.mjs
          cp /tmp/frontend_edge_orders_cutover_02ct.test.mjs tests/frontend_edge_orders_cutover_02ct.test.mjs
          python3 <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          anchor='window.MATBAGY_SECURE_API_PROXY_URL = "";\n\n'
          block=(
            '// Production Orders read cutover 02CT: qualified D1 route first for getRowsPageV1931 only.\n'
            '// Writes, debt reads, unsupported reads, and every Edge failure stay/fall back to Apps Script.\n'
            'window.MATBAGY_EDGE_ORDERS_API_URL = "https://trendos-d1-api.trendmall-contact.workers.dev";\n'
            'window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;\n\n'
          )
          if 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED' in s:
              raise SystemExit('Unexpected existing D1 frontend flag in main config')
          if anchor not in s:
              raise SystemExit('Config insertion anchor missing')
          s=s.replace(anchor, anchor+block, 1)
          loader_anchor="}\n\nwindow.MATBAGY_ATTENDANCE_V1 = true;"
          loader="}\n\ntrendLoadModuleV1932('trendEdgeOrdersReadV1Loader','trendos-edge-orders-read-v1.js?v=20260906c');\n\nwindow.MATBAGY_ATTENDANCE_V1 = true;"
          if loader_anchor not in s:
              raise SystemExit('Loader insertion anchor missing')
          s=s.replace(loader_anchor, loader, 1)
          p.write_text(s,encoding='utf-8')
          for name in ('index.html','reset-cache.html'):
              q=Path(name); t=q.read_text(encoding='utf-8')
              old='trendos-runtime-recovery-20260906a'
              if old not in t: raise SystemExit(f'{name}: cache tag anchor missing')
              q.write_text(t.replace(old,'trendos-d1-cutover-20260906a'),encoding='utf-8')
          PY
          node tests/frontend_edge_orders_cutover_02ct.test.mjs
          node --check trendos-edge-orders-read-v1.js
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' config.js
          grep -Fq "trendos-edge-orders-read-v1.js?v=20260906c" config.js
          grep -Fq "var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';" trendos-edge-orders-read-v1.js
          ! grep -Fq 'MATBAGY_TREND_MASTER_RESILIENCE_V1' config.js
          grep -Fq "$CACHE_TAG" index.html
          grep -Fq "$CACHE_TAG" reset-cache.html
          rm tests/frontend_edge_orders_cutover_02ct.test.mjs
          git diff --check
          echo PERF_CF_02CT_LOCAL_PATCH_PASS

      - name: Commit and push production cutover
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js trendos-edge-orders-read-v1.js index.html reset-cache.html
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Enable qualified D1 Orders frontend read with Apps Script fallback'
          echo "CUTOVER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
          echo PERF_CF_02CT_MAIN_PUSH_PASS

      - name: Wait for GitHub Pages production assets
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 45); do
            stamp="$(date +%s)-$i"
            if curl -fsS "$PAGES_BASE/config.js?02ct=$stamp" -o /tmp/live-config.js \
              && curl -fsS "$PAGES_BASE/trendos-edge-orders-read-v1.js?02ct=$stamp" -o /tmp/live-wrapper.js \
              && curl -fsS "$PAGES_BASE/?02ct=$stamp" -o /tmp/live-index.html \
              && grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' /tmp/live-config.js \
              && grep -Fq "trendos-edge-orders-read-v1.js?v=20260906c" /tmp/live-config.js \
              && grep -Fq "var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';" /tmp/live-wrapper.js \
              && grep -Fq "$CACHE_TAG" /tmp/live-index.html; then
                ok=1; echo "PERF_CF_02CT_PAGES_PROPAGATION_PASS_ATTEMPT=$i"; break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Live frontend wrapper authenticated cutover canary
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME" && test -n "$QUALIFY_EMPLOYEE_TOKEN"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const source=fs.readFileSync('/tmp/live-wrapper.js','utf8');
          let fallbackCalls=0;
          const window={MATBAGY_EDGE_ORDERS_READ_V1_ENABLED:true,MATBAGY_EDGE_ORDERS_API_URL:process.env.PROD_URL,state:{user:{username:process.env.QUALIFY_USERNAME,token:process.env.QUALIFY_EMPLOYEE_TOKEN}},trendosSecureApiV1922:async(action,params)=>{fallbackCalls++;return{success:true,source:'apps-script-fallback',action,params}}};
          const context={window,console:{warn(){},log(){},error(){}},Map,Date,Math,JSON,String,Object,URLSearchParams,setInterval,clearInterval,sessionStorage:{getItem(){return''}},fetch,globalThis:null};context.globalThis=context;vm.createContext(context);vm.runInContext(source,context,{filename:'live-trendos-edge-orders-read-v1.js'});
          (async()=>{assert.equal(window.TrendOSEdgeOrdersReadV1.pagePath,'/v1/edge/orders/02cr/page');const r=await window.trendosSecureApiV1922('getRowsPageV1931',{screen:'print',page:1,pageSize:5,statusFilter:'__ACTIVE__'});assert.equal(r.success,true);assert.equal(r.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');assert.ok(Array.isArray(r.rows));assert.ok(r.rows.length>0);assert.equal(fallbackCalls,0);const d=await window.trendosSecureApiV1922('getRowsPageV1931',{screen:'print',page:1,pageSize:5,statusFilter:'__DEBT__'});assert.equal(d.source,'apps-script-fallback');assert.equal(fallbackCalls,1);const w=await window.trendosSecureApiV1922('updateRowV1931',{screen:'print'});assert.equal(w.source,'apps-script-fallback');assert.equal(fallbackCalls,2);console.log('PERF_CF_02CT_LIVE_FRONTEND_WRAPPER_PASS rows='+r.rows.length);})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Final production boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');const base=process.env.PROD_URL;async function get(p){const r=await fetch(base+p,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{const e=await get('/v1/edge/health'),c=await get('/v1/cloud/write/health'),q=await get('/v1/qualification/cloud-write/reconcile/health');assert.equal(e.status,200);assert.equal(e.body.cutover,false);assert.equal(c.status,200);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);assert.equal(q.status,200);assert.equal(q.body.enabled,false);assert.equal(q.body.genericDrainEnabled,false);console.log('PERF_CF_02CT_FINAL_BOUNDARY_PASS');})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          echo "PERF_CF_02CT_PRODUCTION_FRONTEND_CUTOVER_PASS=$CUTOVER_COMMIT"

      - name: Roll back four frontend files on failure
        if: failure() && env.CUTOVER_COMMIT != ''
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout -B rollback-02ct origin/main
          git checkout "$EXPECTED_MAIN" -- config.js trendos-edge-orders-read-v1.js index.html reset-cache.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add config.js trendos-edge-orders-read-v1.js index.html reset-cache.html
            git commit -m 'Rollback 02CT frontend D1 cutover after failed production validation'
            git push origin HEAD:main
            echo PERF_CF_02CT_AUTOMATIC_ROLLBACK_PUSHED
          fi
