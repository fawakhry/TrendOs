name: TrendOS Tasks V3 T2 Auth Separation Diagnostic

on:
  push:
    branches:
      - tasks-v3-t2-readonly-wael-canary-20260916
    paths:
      - '.github/workflows/trendos-tasks-v3-t2-auth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only ASCII vs Arabic HMAC comparison
        shell: bash
        env:
          T1_URL: https://trendos-tasks-v3-t1-preview-20260914.trendmall-contact.workers.dev
          T2_URL: https://69b3737c-trendos-tasks-v3-t1-preview-20260914.trendmall-contact.workers.dev
        run: |
          set -euo pipefail
          node <<'NODE'
          const targets = [
            {
              name: 'T1_ASCII_OPERATOR',
              url: process.env.T1_URL,
              payload: { op: 'health', operator: 'wael-preview', role: 'WAEL', payloadJson: '{}' }
            },
            {
              name: 'T1_ARABIC_OPERATOR',
              url: process.env.T1_URL,
              payload: { op: 'health', operator: 'وائل', role: 'WAEL', payloadJson: '{}' }
            },
            {
              name: 'T2_ARABIC_OPERATOR',
              url: process.env.T2_URL,
              payload: { op: 'health', operator: 'وائل', role: 'WAEL', payloadJson: '{}' }
            }
          ];

          async function call(target, attempt) {
            const started = Date.now();
            let response;
            try {
              response = await fetch(target.url, {
                method: 'POST',
                headers: { 'content-type': 'application/json', accept: 'application/json' },
                body: JSON.stringify(target.payload),
                signal: AbortSignal.timeout(12000)
              });
            } catch (err) {
              console.log(JSON.stringify({ target: target.name, attempt, transportError: String(err && err.name || err), elapsedMs: Date.now() - started }));
              return { ok: false, code: 'TRANSPORT_ERROR' };
            }

            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch (_) {}
            const record = {
              target: target.name,
              attempt,
              httpStatus: response.status,
              elapsedMs: Date.now() - started,
              serverTiming: response.headers.get('server-timing') || '',
              success: !!(body && body.success === true),
              code: body && body.code || '',
              upstreamSuccess: !!(body && body.body && body.body.success === true),
              upstreamCode: body && body.body && body.body.code || '',
              upstreamVersion: body && body.body && body.body.version || ''
            };
            console.log(JSON.stringify(record));
            return { ok: record.success, code: record.code };
          }

          const summary = {};
          for (const target of targets) {
            summary[target.name] = [];
            for (let i = 1; i <= 3; i++) summary[target.name].push(await call(target, i));
          }

          const anySuccess = name => summary[name].some(x => x.ok === true);
          const anySigInvalid = name => summary[name].some(x => x.code === 'SIGNATURE_INVALID');
          const result = {
            t1AsciiSuccess: anySuccess('T1_ASCII_OPERATOR'),
            t1ArabicSuccess: anySuccess('T1_ARABIC_OPERATOR'),
            t1ArabicSignatureInvalid: anySigInvalid('T1_ARABIC_OPERATOR'),
            t2ArabicSuccess: anySuccess('T2_ARABIC_OPERATOR'),
            t2ArabicSignatureInvalid: anySigInvalid('T2_ARABIC_OPERATOR')
          };
          console.log('DIAGNOSTIC_SUMMARY=' + JSON.stringify(result));

          if (!result.t1AsciiSuccess) {
            console.error('Inconclusive: T1 ASCII control had no successful sample.');
            process.exit(2);
          }
          if (!result.t1ArabicSuccess && result.t1ArabicSignatureInvalid) {
            console.log('DIAGNOSTIC_RESULT=ARABIC_CANONICAL_HMAC_MISMATCH_CONFIRMED');
            process.exit(0);
          }
          if (result.t1ArabicSuccess && !result.t2ArabicSuccess && result.t2ArabicSignatureInvalid) {
            console.log('DIAGNOSTIC_RESULT=ARABIC_HMAC_OK_T2_DEPLOYED_VERIFIER_DIFFERS');
            process.exit(0);
          }
          if (result.t2ArabicSuccess) {
            console.log('DIAGNOSTIC_RESULT=T2_NOW_ACCEPTS_ARABIC_ASSERTION');
            process.exit(0);
          }

          console.error('Diagnostic inconclusive; inspect recorded response codes.');
          process.exit(3);
          NODE
