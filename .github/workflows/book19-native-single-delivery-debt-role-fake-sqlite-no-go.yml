name: BOOK19 Native Single Delivery Debt and Role (FAKE SQLITE NO_GO)
on:
  pull_request:

permissions:
  contents: read

jobs:
  native-single-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22 fake SQLite only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only single-line delivery and department isolation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book19_employee_core_delivery_single_sqlite_no_go.test.mjs
          node --test tests/book19_employee_core_delivery_single_sqlite_no_go.test.mjs
          echo 'BOOK19_NATIVE_DELIVERY_FAKE_SQLITE_ONLY=YES'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_MUTATION=NO'
