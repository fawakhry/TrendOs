name: TrendOS T12 Runtime Frontend Qualification A31

on:
  push:
    branches:
      - diagnostic/t12-runtime-main-a31-20260928
    paths:
      - '.github/workflows/trendos-t12-runtime-main-a31.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify runtime routing
        shell: bash
        run: |
          set -euo pipefail
          node --check trendos-edge-orders-read-v1.js
          node --check config.js
          node tests/t12_runtime_frontend.test.mjs
          grep -F "var VERSION = 'EDGE_ORDERS_T12_RUNTIME_20260928';" trendos-edge-orders-read-v1.js
          grep -F "T12_RUNTIME_UPDATE_PATH" trendos-edge-orders-read-v1.js
          grep -F "T12_RUNTIME_NOTIFY_PATH" trendos-edge-orders-read-v1.js
          grep -F "trendos-edge-orders-read-v1.js?v=20260928-t12-runtime1" config.js
          echo 'RUNTIME_FRONTEND_QUALIFICATION=PASS'
