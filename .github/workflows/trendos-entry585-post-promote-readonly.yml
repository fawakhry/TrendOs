name: TrendOS Entry585 Post Promote Readonly Verify

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry585-post-promote-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: trendos-ui
      TARGET_VERSION_ID: b6674156-5f8f-4d57-b94b-e0b5422ae6c1
      PROD_URL: https://trendos-ui.trendmall-contact.workers.dev
    steps:
      - name: Verify active deployment exact target
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments"             > /tmp/deployments.json

          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const list=Array.isArray(body?.result?.deployments)
            ? body.result.deployments
            : (Array.isArray(body?.result) ? body.result : []);
          if (!list.length) throw new Error('No deployments returned');
          const versions=Array.isArray(list[0]?.versions) ? list[0].versions : [];
          const normalized=versions.map(v=>({
            version_id:String(v?.version_id||v?.id||''),
            percentage:Number(v?.percentage ?? v?.traffic_percentage ?? NaN)
          }));
          if (normalized.length!==1 ||
              normalized[0].version_id!==process.env.TARGET_VERSION_ID ||
              normalized[0].percentage!==100) {
            throw new Error('Active deployment mismatch: '+JSON.stringify(normalized));
          }
          console.log('ENTRY585_ACTIVE_DEPLOYMENT=PASS');
          console.log('ACTIVE_VERSION_ID='+normalized[0].version_id);
          console.log('ACTIVE_TRAFFIC_PERCENT='+normalized[0].percentage);
          NODE

      - name: Verify public frontend HTTP and markers
        shell: bash
        run: |
          set -euo pipefail

          root_code="$(curl --silent --show-error --output /tmp/root.html --write-out '%{http_code}' "$PROD_URL/")"
          config_code="$(curl --silent --show-error --output /tmp/config.js --write-out '%{http_code}' "$PROD_URL/config.js")"
          edge_code="$(curl --silent --show-error --output /tmp/edge.js --write-out '%{http_code}' "$PROD_URL/trendos-edge-orders-read-v1.js")"
          app_code="$(curl --silent --show-error --output /tmp/app.js --write-out '%{http_code}' "$PROD_URL/app.js")"

          test "$root_code" = 200
          test "$config_code" = 200
          test "$edge_code" = 200
          test "$app_code" = 200

          grep -F 'app.js?v=20261001-initial-edge-ready' /tmp/root.html >/dev/null
          grep -F '20261001-post-refresh-recovery' /tmp/config.js >/dev/null
          grep -F 'recoverPostWriteBarrier' /tmp/edge.js >/dev/null
          grep -F 'postWriteBarrierRecoveries' /tmp/edge.js >/dev/null
          grep -F 'function loadInitialRowsWhenEdgeReady()' /tmp/app.js >/dev/null
          grep -F 'function secureApiChainHasEdgeOrdersRouter(fn)' /tmp/app.js >/dev/null

          echo 'ENTRY585_PUBLIC_HTTP=PASS'
          echo 'FRONTEND_HTTP_200=YES'
          echo 'CONFIG_CACHE_TAG_PRESENT=YES'
          echo 'RECOVER_POST_WRITE_BARRIER_PRESENT=YES'
          echo 'POST_WRITE_BARRIER_RECOVERIES_PRESENT=YES'
          echo 'INITIAL_EDGE_READY_HELPER_PRESENT=YES'
          echo 'APP_CACHE_TAG_PRESENT=YES'
