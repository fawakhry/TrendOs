name: TrendOS Entry668 EasyStore Customer Finance Exact ID OFF
on:
  push:
    branches:
      - feat/zero-google-customer-finance-easystore-id-read-off-20261021
  pull_request:
    paths:
      - 'cloudflare-d1/src/customer-portal-easystore-finance-id-read-v0.mjs'
      - 'tests/entry668_customer_finance_id_read_off.test.mjs'
      - 'tests/entry668_customer_finance_id_read_sqlite.test.py'
      - '.github/workflows/trendos-entry668-customer-finance-id-off-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-id-finance-read-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact native D1 session, EasyStore proof and finance read guards
        env:
          CLOUDFLARE_API_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          OPENAI_API_KEY: ''
          TRENDOS_CUSTOMER_PORTAL_SESSION_HMAC_SECRET: ''
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/customer-portal-easystore-finance-id-read-v0.mjs
          node --test tests/entry668_customer_finance_id_read_off.test.mjs
      - name: Actual EasyStore D1 schema and source session via disposable SQLite
        run: |
          set -euo pipefail
          python3 tests/entry668_customer_finance_id_read_sqlite.test.py -v
          python3 tests/entry660_customer_native_orders_sqlite.test.py -v
      - name: Preserve all previous native portal stages and no new finance writer
        run: |
          set -euo pipefail
          node --test tests/entry667_customer_draft_submit_preflight_off.test.mjs
          node --test tests/entry666_customer_native_r2_file_off.test.mjs
          node --test tests/entry665_customer_native_draft_item_off.test.mjs
          node --test tests/entry664_customer_native_draft_create_off.test.mjs
          node --test tests/entry663_customer_native_change_password_off.test.mjs
          node --test tests/entry662_customer_native_login_off.test.mjs
          node --test tests/entry661_customer_native_logout_off.test.mjs
          node --test tests/entry660_customer_native_orders_off.test.mjs
      - name: Demonstrate no live finance cutover or false Google retirement
        run: |
          echo 'EASYSTORE_ACCOUNT_SOURCE=EXISTING_PARTY_BALANCES_D1'
          echo 'CUSTOMER_FINANCE_VIEW=SOURCE_PREVIEW_OFF'
          echo 'ACCOUNTING_PARITY_AND_ID_MAPPING=UNVERIFIED'
          echo 'LIVE_CUSTOMER_ACTIONS_GOOGLE_RETIRED=0_OF_9'
          echo 'FINANCE_MUTATIONS=0'
          echo 'CLOUDFLARE_DEPLOY=NO'
          echo 'ZERO_GOOGLE_COMPLETE=NO'
