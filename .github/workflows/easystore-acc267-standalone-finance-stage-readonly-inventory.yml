name: ACC267 EasyStore ACCOUNTS-FIRST finance D1 Stage aggregate read-only inventory
on:
  push:
    branches: ['audit/acc267-accounts-first-finance-d1-inventory-20261030']
    paths: ['.github/workflows/easystore-acc267-standalone-finance-stage-readonly-inventory.yml']
  pull_request:
    branches: ['audit/acc266-native-employee-stage-counts-readonly-20261030']
permissions:
  contents: read
concurrency:
  group: acc267-original-finance-stage-read-only
  cancel-in-progress: false
jobs:
  authenticated-stage-aggregate-only:
    if: >-
      github.repository == 'fawakhry/TrendOs' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/audit/acc267-accounts-first-finance-d1-inventory-20261030') ||
       (github.event_name == 'pull_request' && github.head_ref == 'audit/acc267-accounts-first-finance-d1-inventory-20261030' && github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINANCE_WRITES: OFF
      FINANCE_RELEASE: NO_GO
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only original finance route and isolated Stage identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,tomllib
          base=pathlib.Path('cloudflare-d1/easystore-finance-stage')
          cfg=tomllib.loads((base/'wrangler.toml').read_text())
          assert cfg['name']=='easystore-accounting-staging-api' and cfg['workers_dev'] is False
          assert cfg['d1_databases']==[{'binding':'DB','database_name':'easystore-accounting-staging','database_id':'c2fe1a54-90f5-4e6f-9d51-80ce23e21328'}]
          assert cfg['vars']['FINANCE_RELEASE']=='NO_GO' and cfg['vars']['FINANCE_WRITES']=='OFF'
          assert cfg['vars']['EASYSTORE_STAGE_READONLY_API_V1']=='OFF'
          assert cfg['vars']['EASYSTORE_ACCOUNTING_D1_WRITE_MODE']=='OFF'
          assert cfg['vars']['ACCOUNTING_FINANCE_GRANTS_V1']=='{"version":1,"grants":[]}'
          code=pathlib.Path('cloudflare-d1/src/employee-accounting-native-v1.mjs').read_text()
          assert 'async function saveEasyStoreSaleV2A2(' in code
          assert 'async function resolvePartyV1(' in code
          assert "FROM t12_customers WHERE customer_id=?" in code
          assert 'employee_accounting_parties_v1' in code
          print('ACC267_EXISTING_DIRECT_SALE_PATH_PRESENT=YES')
          print('ACC267_EXISTING_ACCOUNTING_CUSTOMER_PARTY_TABLE_PRESENT=YES')
          print('ACC267_DIRECT_SALE_CURRENT_T12_CUSTOMER_DEPENDENCY=YES')
          print('ACC267_ALL_FINANCE_WRITES_REMAIN_OFF=PASS')
          PY
      - name: Actual original Cloudflare finance Stage SQL SELECT aggregates ONLY
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const acc=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(acc||'')||!token)throw Error('ACC267_CREDENTIALS_UNAVAILABLE');
          if(process.env.FINANCE_WRITES!=='OFF'||process.env.FINANCE_RELEASE!=='NO_GO')
            throw Error('ACC267_FINANCE_GUARDS_NOT_OFF');
          const id='c2fe1a54-90f5-4e6f-9d51-80ce23e21328';
          const base='https://api.cloudflare.com/client/v4/accounts/'+acc+'/d1/database/'+id;
          const headers={authorization:'Bearer '+token,'content-type':'application/json'};
          async function request(path, method='GET', body){
            const response=await fetch(base+path,{
              method,headers,body:body?JSON.stringify(body):undefined,
              signal:AbortSignal.timeout(16000)
            });
            if(!response.ok)throw Error('ACC267_PROVIDER_HTTP_'+response.status);
            const json=await response.json();
            if(json.success!==true)throw Error('ACC267_PROVIDER_REJECTED');
            return json.result;
          }
          const meta=await request('');
          if(meta.uuid!==id||meta.name!=='easystore-accounting-staging')
            throw Error('ACC267_NONFINANCE_STAGE_REFUSED');
          async function scalar(sql){
            if(!/^SELECT\s/i.test(sql)||/;|\b(?:INSERT|UPDATE|DELETE|REPLACE|DROP|CREATE|ALTER|ATTACH|PRAGMA|VACUUM)\b/i.test(sql))
              throw Error('ACC267_ONLY_SELECT_ALLOWED');
            const results=await request('/query','POST',{sql});
            if(!Array.isArray(results)||results.length!==1||results[0]?.success!==true||
               !Array.isArray(results[0]?.results)||results[0].results.length!==1)
              throw Error('ACC267_SCHEMA_OR_QUERY_INVALID');
            if(Number(results[0].meta?.rows_written||0)!==0||Number(results[0].meta?.changes||0)!==0)
              throw Error('ACC267_WRITE_OBSERVED_ABORT');
            return results[0].results[0];
          }
          const c=await scalar("SELECT mode FROM employee_accounting_control_v1 WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1'");
          const t=await scalar("SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name LIKE 'employee_accounting_%'");
          if(c.mode!=='OFF'||Number(t.n)!==22)
            throw Error('ACC267_FINANCE_SCHEMA_OR_MODE_NOT_OFF');
          const defs=[
            ['INVOICES','SELECT COUNT(*) AS n FROM employee_accounting_final_invoices_v1'],
            ['CASHBOX_ENTRIES','SELECT COUNT(*) AS n FROM employee_accounting_cashbox_v1'],
            ['PARTY_LEDGER_ENTRIES','SELECT COUNT(*) AS n FROM employee_accounting_party_ledger_v1'],
            ['CUSTOMER_PARTIES','SELECT COUNT(*) AS n FROM employee_accounting_parties_v1 WHERE party_type=\'customer\''],
            ['SUPPLIER_PARTIES','SELECT COUNT(*) AS n FROM employee_accounting_parties_v1 WHERE party_type=\'supplier\''],
            ['BALANCE_ENTRIES','SELECT COUNT(*) AS n FROM employee_accounting_party_balances_v1'],
            ['MATERIALS','SELECT COUNT(*) AS n FROM employee_accounting_materials_v1'],
            ['REQUEST_LEDGER','SELECT COUNT(*) AS n FROM employee_accounting_request_ledger_v1']
          ];
          console.log('ACC267_REAL_FINANCE_STAGE_NAME_UUID=PASS');
          console.log('ACC267_REAL_FINANCE_STAGE_TABLES=22');
          console.log('ACC267_REAL_FINANCE_STAGE_MODE=OFF');
          let summary='## ACC267 Accounts-first Stage-only aggregate inspection\n\n';
          for(const [name,sql] of defs){
            const n=Number((await scalar(sql)).n);
            if(!Number.isSafeInteger(n)||n<0)throw Error('ACC267_INVALID_AGGREGATE_'+name);
            console.log('ACC267_STAGE_'+name+'='+n);
            summary+='- '+name+': '+n+'\n';
          }
          console.log('ACC267_REAL_FINANCE_STAGE_WRITE_OPERATIONS=NONE');
          console.log('ACC267_ACCOUNTING_PRODUCTION_RELEASE=NO_GO');
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            summary+'\nFinance mode OFF, 22 original tables. Reads ONLY aggregate counts; '+
            'no real customer/user names, amounts, tokens, invoice contents or secrets. '+
            'No database mutation; Stage results are not proof of opening balances or production status.\n');
          JS
