name: TrendOS Production Shadow Controlled Deploy

# PREPARED ONLY. This workflow has no push trigger.
# It may deploy Production only after an explicit workflow_dispatch confirmation.
# Shadow and Cloud Write must remain OFF before and after deployment.
on:
  workflow_dispatch:
    inputs:
      confirm_production_shadow_off_deploy:
        description: 'Type DEPLOY_PRODUCTION_SHADOW_OFF to deploy the wrapper with Shadow OFF and Cloud Write OFF.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trendos-production-shadow-controlled-deploy
  cancel-in-progress: false

jobs:
  deploy-production-shadow-wrapper-off:
    if: ${{ github.event.inputs.confirm_production_shadow_off_deploy == 'DEPLOY_PRODUCTION_SHADOW_OFF' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      SHADOW_PATH: /v1/cloud/write/v2/production-shadow
      STAGING_BRIDGE_PATH: /v1/staging/cloud-write/v2/bridge/health
      WRANGLER_VERSION: 4.33.2

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard safety gate — exact Production OFF configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index\.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml

          workflow=.github/workflows/trendos-cloud-write-v2-production-shadow-controlled-deploy.yml
          if grep -Eq '^[[:space:]]+npx .*wrangler.*d1[[:space:]]+migrations[[:space:]]+apply' "$workflow"; then
            echo 'Blocked: controlled deployment workflow must never apply D1 migrations.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]+(cat .*\|[[:space:]]*)?npx .*wrangler.*secret[[:space:]]+(put|bulk)' "$workflow"; then
            echo 'Blocked: controlled wrapper deployment must not rotate or replace Worker secrets.'
            exit 1
          fi
          echo 'PRODUCTION_SHADOW_OFF_CONFIG_PASS'

      - name: Re-run wrapper and Orders safety contracts
        run: |
          set -euo pipefail
          node tests/cloud_write_order_v2_production_shadow.test.mjs
          node tests/cloudflare_production_shadow_observer_candidate_v1.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_freshness_gate_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_heartbeat_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_freshness_integration_v1.test.mjs
          node tests/d1_orders_low_usage_heartbeat_v1.test.mjs
          node tests/cloudflare_edge_orders_idle_verifier_v1.test.mjs
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_mirror_safety_v1.test.mjs
          echo 'PRODUCTION_SHADOW_AND_ORDERS_SAFETY_CONTRACTS_PASS'

      - name: Compile exact Production payload with Wrangler dry-run
        run: |
          set -euo pipefail
          rm -rf /tmp/trendos-production-shadow-controlled-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --dry-run \
            --config cloudflare-d1/wrangler.toml \
            --outdir /tmp/trendos-production-shadow-controlled-build
          test -d /tmp/trendos-production-shadow-controlled-build
          echo 'PRODUCTION_SHADOW_WRAPPER_DRY_RUN_PASS'

      - name: Live Production preflight — GET only
        shell: bash
        run: |
          set -euo pipefail

          write_code="$(curl --silent --show-error --output /tmp/pre-write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          test "$write_code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/pre-write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"

          shadow_code="$(curl --silent --show-error --output /tmp/pre-shadow.json --write-out '%{http_code}' "$PROD_URL$SHADOW_PATH")"
          test "$shadow_code" = '404'

          bridge_code="$(curl --silent --show-error --output /tmp/pre-bridge.json --write-out '%{http_code}' "$PROD_URL$STAGING_BRIDGE_PATH")"
          test "$bridge_code" = '404'

          echo 'LIVE_PRODUCTION_PREDEPLOY_OFF_BOUNDARY_PASS'

      - name: Deploy Production wrapper only — no migration, no secret rotation
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare-d1/wrangler.toml
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5
          echo 'PRODUCTION_SHADOW_WRAPPER_DEPLOYED_WITH_FLAGS_OFF'

      - name: Post-deploy verify existing runtime remains healthy
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/post-health.json --write-out '%{http_code}' "$PROD_URL/v1/edge/health")"
          cat /tmp/post-health.json
          test "$health_code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/post-health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"

          anon_code="$(curl --silent --show-error --output /tmp/post-anon.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=1")"
          test "$anon_code" = '401'
          echo 'PRODUCTION_CORE_RUNTIME_HEALTH_PASS'

      - name: Post-deploy verify Shadow remains disabled and Cloud Write remains OFF
        shell: bash
        run: |
          set -euo pipefail

          shadow_code="$(curl --silent --show-error --output /tmp/post-shadow.json --write-out '%{http_code}' "$PROD_URL$SHADOW_PATH")"
          cat /tmp/post-shadow.json
          test "$shadow_code" = '404'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/post-shadow.json','utf8')); if(x.success!==false||x.code!=='production-shadow-disabled'||x.readOnly!==true||x.mutationFree!==true||x.d1Written!==false||x.sheetsWritten!==false||Number(x.mutationCount||0)!==0||x.productionWriteEnabled!==false||x.productionCutover!==false) process.exit(1)"

          write_code="$(curl --silent --show-error --output /tmp/post-write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          cat /tmp/post-write.json
          test "$write_code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/post-write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true||x.schemaMutationFree!==true) process.exit(1)"

          bridge_code="$(curl --silent --show-error --output /tmp/post-bridge.json --write-out '%{http_code}' "$PROD_URL$STAGING_BRIDGE_PATH")"
          test "$bridge_code" = '404'
          echo 'PRODUCTION_SHADOW_DISABLED_AND_CLOUD_WRITE_OFF_PASS'

      - name: Post-deploy verify Orders and Lines mirror parity read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/post-orders.json
          curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/post-lines.json
          node <<'NODE'
          const fs=require('fs');
          const notes=['TrendOS orders live sync V1','TrendOS orders live sync V2 quota-aware'];
          for(const [label,file] of [['ORDERS','/tmp/post-orders.json'],['LINES','/tmp/post-lines.json']]){
            const x=JSON.parse(fs.readFileSync(file,'utf8')),s=x.sheet||{};
            const pass=x.success===true&&x.schemaMutationFree===true&&s.status==='ready'&&Number(s.rowCount||0)===Number(s.sourceLastRow||0)&&notes.includes(String(s.note||''));
            console.log(label+'_POST_DEPLOY='+JSON.stringify({rowCount:s.rowCount,sourceLastRow:s.sourceLastRow,syncedAt:s.syncedAt,note:s.note,pass}));
            if(!pass) process.exit(1);
          }
          NODE
          echo 'PRODUCTION_MIRROR_PARITY_READONLY_PASS'

      - name: Automatic rollback on post-deploy failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        run: |
          echo 'Post-deploy verification failed; rolling back to the immediately previous Worker version.'
          npx --yes wrangler@${WRANGLER_VERSION} rollback \
            --config cloudflare-d1/wrangler.toml \
            --message "TrendOS rollback after failed Production Shadow OFF wrapper verification"

      - name: Safety conclusion
        if: ${{ success() }}
        run: |
          echo 'PRODUCTION_SHADOW_CONTROLLED_DEPLOY_PASS'
          echo 'Production wrapper deployed only after explicit manual confirmation.'
          echo 'Shadow remains OFF. Cloud Write remains OFF. Sheets remain authoritative.'
          echo 'No D1 migration command or Worker secret rotation is permitted by this workflow.'
