name: ONE SHOT Customer Stage HTTP descriptive client — RESTORE OFF
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_customer_stage_http_trace_20261103.yml'
permissions:
  contents: read
concurrency:
  group: trendos-unique-private-stage-http-trace-20261103
  cancel-in-progress: false
jobs:
  protected-stage-ephemeral-http:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-http-trace-once-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN }}
      CF_STAGE_ACCESS_CLIENT_ID: ${{ secrets.CF_STAGE_ACCESS_CLIENT_ID }}
      CF_STAGE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_STAGE_ACCESS_CLIENT_SECRET }}
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout one-shot private Stage test without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict local preflight and private Stage test script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = ops/customer-stage-http-trace-once-20261103
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          test -n "$CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN"
          test -n "$CF_STAGE_ACCESS_CLIENT_ID"
          test -n "$CF_STAGE_ACCESS_CLIENT_SECRET"
          python3 -m py_compile tools/one_shot_customer_stage_http_trace_20261103.py
          python3 tests/customer_stage_service_auth_policy_gate_off_v1.test.py
          echo 'ISOLATED_STAGE_HTTP_GATES=PASS'
      - name: Temporarily route isolated OFF Stage behind verified Access; negative/positive auth; restore OFF
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 tools/one_shot_customer_stage_http_trace_20261103.py
      - name: Independent fail-safe restore of isolated Stage workers.dev OFF
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one_shot_customer_stage_http_trace_20261103.py --cleanup-only
          echo 'FINAL_PUBLIC_INGRESS=OFF'
          echo 'CUSTOMER_GO_LIVE=NO_GO'
