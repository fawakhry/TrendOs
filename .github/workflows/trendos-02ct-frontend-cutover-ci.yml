name: TrendOS 02CT Frontend D1 Read Regression

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'trendos-edge-orders-read-v1.js'
      - 'config.js'
      - 'tests/frontend_edge_orders_cutover_02ct.test.mjs'
      - 'tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs'
      - 'cloudflare-d1/src/edge-orders-read-02cr-canary.mjs'
      - '.github/workflows/trendos-02ct-frontend-cutover-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-cutover-regression:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PAGES_BASE: https://fawakhry.github.io/TrendOs
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transitional working-branch route contract
        run: |
          set -euo pipefail
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*(true|false)' config.js
          grep -Fq "var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';" trendos-edge-orders-read-v1.js
          if grep -Fq "var requestKey = '/v1/edge/orders/page?'" trendos-edge-orders-read-v1.js; then
            echo 'Legacy unqualified route is forbidden'; exit 1
          fi
          echo PERF_CF_02CT_TRANSITIONAL_WORKING_PASS

      - name: Frontend wrapper fallback regression
        run: node tests/frontend_edge_orders_cutover_02ct.test.mjs

      - name: D1 operational ordering regression
        run: node tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs

      - name: Main and published Pages are cut over to qualified route
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true'
          git show origin/main:trendos-edge-orders-read-v1.js | grep -Fq "var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';"
          stamp="$(date +%s)"
          curl -fsS "$PAGES_BASE/config.js?02ct-ci=$stamp" -o /tmp/live-config.js
          curl -fsS "$PAGES_BASE/trendos-edge-orders-read-v1.js?02ct-ci=$stamp" -o /tmp/live-wrapper.js
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' /tmp/live-config.js
          grep -Fq "var QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page';" /tmp/live-wrapper.js
          echo PERF_CF_02CT_MAIN_PAGES_POSTCUTOVER_PASS

      - name: Production authority boundary remains safe
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{const e=await get('/v1/edge/health'),c=await get('/v1/cloud/write/health'),q=await get('/v1/qualification/cloud-write/reconcile/health'),u=await get('/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1');
            assert.equal(e.status,200);assert.equal(e.body.success,true);assert.equal(e.body.cutover,false);
            assert.equal(c.status,200);assert.equal(c.body.success,true);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);
            assert.equal(q.status,200);assert.equal(q.body.enabled,false);assert.equal(q.body.genericDrainEnabled,false);assert.equal(u.status,401);
            console.log('PERF_CF_02CT_POSTCUTOVER_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Authenticated D1 vs Apps Script identity and field parity
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME" && test -n "$QUALIFY_EMPLOYEE_TOKEN"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const critical=['rowNumber','orderId','orderCode','lineId','customer','customerPhone','customerSource','source','externalCustomerId','customerMode','department','itemName','qty','assignedTo','priority','status','ready','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','updatedAt','notes','customerNotified','notifiedAt','notifiedBy','lastWhatsAppMessage','lastWhatsAppAt','lastWhatsAppBy','receivedAt','expectedDeliveryAt','expectedDeliveryText','overdue','registrationSent'];
          const text=v=>String(v==null?'':v).trim(),key=r=>[text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');
          async function json(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          async function session(){const x=await json(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});assert.equal(x.status,200);assert.equal(x.body.success,true);assert.ok(x.body.edgeToken);return x.body.edgeToken;}
          async function edge(screen,t){const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});const x=await json(base+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+t}});assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');return x.body;}
          async function app(screen){const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};const x=await json(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body;}
          (async()=>{const t=await session(),summary=[];for(const screen of ['print','laser']){const e=await edge(screen,t),a=await app(screen);const ek=(e.rows||[]).map(key),ak=(a.rows||[]).map(key);assert.deepEqual([...ek].sort(),[...ak].sort(),screen+' identity mismatch');for(const r of e.rows||[])for(const k of critical)assert.ok(Object.prototype.hasOwnProperty.call(r,k),screen+' missing '+k);summary.push({screen,rows:ek.length,fieldContract:critical.length});}console.log('PERF_CF_02CT_POSTCUTOVER_LIVE_PARITY_PASS='+JSON.stringify(summary));})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
