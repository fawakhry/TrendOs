name: TrendOS Cloud Migration V3 T7 Orders Read Parity Qualification

on:
  push:
    branches: [cloud-migration-v3-t7-orders-read-canary-20260913]
    paths: ['.github/workflows/cloud-migration-v3-t7-orders-parity-qualification.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-cloud-migration-v3-t7-orders-parity
  cancel-in-progress: false

jobs:
  qualify-print:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PAGES_BASE: https://fawakhry.github.io/TrendOs
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Production safety baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"; test -n "$QUALIFY_PASSWORD"
          curl -fsS "$PROD_URL/v1/edge/health" -o /tmp/e.json
          curl -fsS "$PROD_URL/v1/cloud/write/health" -o /tmp/w.json
          node -e "const e=require('/tmp/e.json'),w=require('/tmp/w.json');if(!e.success||e.cutover!==false||!w.success||w.cutover!==false||w.sheetsAuthoritative!==true)process.exit(1)"
          curl -fsS "$PAGES_BASE/config.js?t7=$(date +%s)" | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false'
          echo T7_PRODUCTION_BOUNDARY=PASS
          echo T7_FRONTEND_STILL_OFF=PASS
      - name: Compare Print D1 lanes against synchronized Apps Script snapshot
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL.replace(/\/$/,'');
          const apps=process.env.APPS_SCRIPT_URL, username=process.env.QUALIFY_USERNAME, password=process.env.QUALIFY_PASSWORD;
          const text=v=>String(v==null?'':v).trim(), EPOCH=Date.UTC(1899,11,30), DAY=86400000;
          async function json(url,opt={}){const t=Date.now(),r=await fetch(url,{cache:'no-store',redirect:'follow',...opt}),raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms:Date.now()-t}}
          async function login(){const x=await json(apps,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});const token=text(x.body?.user?.token);assert.equal(x.status,200);assert.equal(x.body.success,true);assert.ok(token);console.log('::add-mask::'+token);return token}
          function repair(orderId,lineId){const o=text(orderId),l=text(lineId);if(!/^\d{3,6}$/.test(o)||!/^\d{5,8}$/.test(l))return l;const n=Number(l),d=new Date(EPOCH+n*DAY);if(!Number.isSafeInteger(n)||String(d.getUTCFullYear())!==o||d.getUTCDate()!==1)return l;return o+'-'+String(d.getUTCMonth()+1).padStart(2,'0')}
          const key=r=>[text(r?.orderId),repair(r?.orderId,r?.lineId),text(r?.status)].join('|');
          function diff(rows,appRows){const a=rows.map(key).sort(),b=appRows.map(key).sort(),as=new Set(a),bs=new Set(b);return{onlyD1:a.filter(x=>!bs.has(x)),onlyApps:b.filter(x=>!as.has(x)),equal:JSON.stringify(a)===JSON.stringify(b)}}
          (async()=>{
            const t1=await login();
            const sess=await json(base+'/v1/edge/orders/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,token:t1})});
            console.log('T7_SESSION='+JSON.stringify({status:sess.status,ms:sess.ms,success:sess.body.success===true,source:text(sess.body.authSource),code:text(sess.body.code),message:text(sess.body.message)}));
            assert.equal(sess.status,200);assert.equal(sess.body.success,true);const edgeToken=text(sess.body.edgeToken);assert.ok(edgeToken);console.log('::add-mask::'+edgeToken);
            const t2=await login();
            const q=new URLSearchParams({screen:'print',page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
            const payload={action:'getRowsPageV1931',username,token:t2,screen:'print',page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};
            const [app,rich,view]=await Promise.all([
              json(apps,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}),
              json(base+'/v1/edge/orders/02cr/page?'+q,{headers:{authorization:'Bearer '+edgeToken}}),
              json(base+'/v1/edge/orders/page?'+q,{headers:{authorization:'Bearer '+edgeToken}})
            ]);
            console.log('T7_LANE_STATUS='+JSON.stringify({apps:{status:app.status,ms:app.ms,success:app.body.success===true,code:text(app.body.code),message:text(app.body.message)},rich:{status:rich.status,ms:rich.ms,success:rich.body.success===true,code:text(rich.body.code),message:text(rich.body.message)},view:{status:view.status,ms:view.ms,success:view.body.success===true,code:text(view.body.code),message:text(view.body.message)}}));
            assert.equal(app.status,200);assert.equal(app.body.success,true);
            const appRows=app.body.rows||[];
            let richPass=false,viewPass=false;
            if(rich.status===200&&rich.body.success===true){const dr=diff(rich.body.rows||[],appRows);richPass=dr.equal;console.log('T7_RICH='+JSON.stringify({rows:(rich.body.rows||[]).length,ms:rich.ms,dataSource:text(rich.body.dataSource),diff:dr}));}
            if(view.status===200&&view.body.success===true){const dv=diff(view.body.rows||[],appRows);viewPass=dv.equal;console.log('T7_VIEW='+JSON.stringify({rows:(view.body.rows||[]).length,ms:view.ms,dataSource:text(view.body.dataSource),diff:dv,mirror:view.body.mirror||null}));}
            console.log('T7_02CR_PRINT_PARITY='+(richPass?'PASS':'FAIL'));
            console.log('T7_VIEW_PRINT_PARITY='+(viewPass?'PASS':'FAIL'));
            console.log('T7_BUSINESS_MUTATION=NO');console.log('T7_FRONTEND_CUTOVER=NO');
            assert.ok(richPass||viewPass,'no D1 print lane has exact normalized parity');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
