name: TrendOS Cloud Migration V3 T7 Orders Read Parity Qualification

on:
  push:
    branches:
      - cloud-migration-v3-t7-orders-read-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t7-orders-parity-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-cloud-migration-v3-t7-orders-parity
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PAGES_BASE: https://fawakhry.github.io/TrendOs
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scope and production safety baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"; test -n "$QUALIFY_PASSWORD"
          curl -fsS "$PROD_URL/v1/edge/health" -o /tmp/edge-health.json
          curl -fsS "$PROD_URL/v1/cloud/write/health" -o /tmp/write-health.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/edge-health.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/write-health.json','utf8'));
          if(!e.success||e.cutover!==false||!e.database||!e.authConfigured) process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('T7_PRODUCTION_BOUNDARY=PASS');
          NODE
          curl -fsS "$PAGES_BASE/config.js?t7=$(date +%s)" -o /tmp/live-config.js
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' /tmp/live-config.js
          echo 'T7_FRONTEND_STILL_OFF=PASS'

      - name: Fresh login and D1 versus Apps Script parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=String(process.env.PROD_URL).replace(/\/$/,'');
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          const key=r=>[text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');
          const critical=['orderId','lineId','status','department','itemName','qty','priority','customer','updatedAt'];
          async function json(url,opt={}){
            const started=Date.now();
            const r=await fetch(url,{cache:'no-store',redirect:'follow',...opt});
            const raw=await r.text(); let body={}; try{body=JSON.parse(raw||'{}')}catch{}
            return {status:r.status,body,ms:Date.now()-started};
          }
          (async()=>{
            const login=await json(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});
            const employeeToken=text(login.body&&login.body.user&&login.body.user.token);
            assert.equal(login.status,200); assert.equal(login.body.success,true); assert.ok(employeeToken);
            console.log('::add-mask::'+employeeToken);
            console.log('T7_LOGIN_MS='+login.ms);

            const sess=await json(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});
            console.log('T7_SESSION_RESULT='+JSON.stringify({status:sess.status,ms:sess.ms,success:sess.body.success===true,authSource:text(sess.body.authSource),message:text(sess.body.message),code:text(sess.body.code)}));
            assert.equal(sess.status,200); assert.equal(sess.body.success,true); assert.ok(sess.body.edgeToken);
            assert.ok(['apps-script-post','d1-auth-shadow-v1'].includes(text(sess.body.authSource)));
            const edgeToken=text(sess.body.edgeToken); console.log('::add-mask::'+edgeToken);
            console.log('T7_ORDERS_SESSION_MS='+sess.ms);
            console.log('T7_ORDERS_SESSION_SOURCE='+text(sess.body.authSource));

            let screens=Array.isArray(sess.body&&sess.body.user&&sess.body.user.screens)?sess.body.user.screens.map(text).filter(Boolean):[];
            screens=[...new Set(screens.filter(s=>['service','print','laser','press'].includes(s)))];
            if(!screens.length) screens=['service'];
            console.log('T7_QUALIFIED_SCREENS='+JSON.stringify(screens));
            const summary=[];
            for(const screen of screens){
              const q=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
              const edge=await json(base+'/v1/edge/orders/02cr/page?'+q,{headers:{accept:'application/json',authorization:'Bearer '+edgeToken}});
              console.log('T7_EDGE_RESULT='+JSON.stringify({screen,status:edge.status,ms:edge.ms,success:edge.body.success===true,code:text(edge.body.code),message:text(edge.body.message),rows:Array.isArray(edge.body.rows)?edge.body.rows.length:null,dataSource:text(edge.body.dataSource)}));
              assert.equal(edge.status,200,screen+' edge status'); assert.equal(edge.body.success,true,screen+' edge success');
              assert.equal(edge.body.dataSource,'d1-edge-orders-02cr-operational');
              assert.ok(Array.isArray(edge.body.mirrors)&&edge.body.mirrors.length>=3,screen+' mirrors missing');
              for(const m of edge.body.mirrors){
                assert.equal(text(m.status),'ready',screen+' mirror not ready');
                assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0),screen+' mirror parity');
              }
              const appPayload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};
              const app=await json(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(appPayload)});
              console.log('T7_APPS_RESULT='+JSON.stringify({screen,status:app.status,ms:app.ms,success:app.body.success===true,code:text(app.body.code),message:text(app.body.message),rows:Array.isArray(app.body.rows)?app.body.rows.length:null}));
              assert.equal(app.status,200,screen+' apps status'); assert.equal(app.body.success,true,screen+' apps success');
              const eRows=edge.body.rows||[], aRows=app.body.rows||[];
              const ek=eRows.map(key).sort(), ak=aRows.map(key).sort();
              assert.deepEqual(ek,ak,screen+' identity mismatch');
              for(const r of eRows) for(const f of critical) assert.ok(Object.prototype.hasOwnProperty.call(r,f),screen+' missing '+f);
              summary.push({screen,rows:eRows.length,d1Ms:edge.ms,appsMs:app.ms,d1Faster:edge.ms<app.ms});
            }
            console.log('T7_ORDERS_PARITY=PASS');
            console.log('T7_ORDERS_PARITY_SUMMARY='+JSON.stringify(summary));
            console.log('T7_BUSINESS_MUTATION=NO');
            console.log('T7_FRONTEND_CUTOVER=NO');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
