name: BOOK19 Immutable Official Customer-ID Review FK (FAKE SQLITE NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  immutable-customer-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dormant official customer-ID FK review and immutable fail-closed contract
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book19_official_customer_id_review_immutable_sqlite_no_go.test.mjs
          node --test tests/book19_official_customer_id_review_immutable_sqlite_no_go.test.mjs
          echo 'BOOK19_FK_REVIEW_SCHEMA_SOURCE_ONLY=YES'
          echo 'BOOK19_IMMUTABLE_ORDER_ACCOUNT_BINDING_ATTESTED=NO'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_CHANGES=ZERO'
