name: TrendOS 02CR Preview Source Parity TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cr-preview-source-parity-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Static read-only guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/trendos-02cr-preview-source-parity-temp.yml').read_text(encoding='utf-8')
          forbidden=['wrangler'+' deploy','secret'+' put','d1 execute --'+'file','/v1/import/'+'sheet','/v1/mirror/'+'delta','/v1/mirror/'+'heartbeat','reconcile/'+'order']
          for token in forbidden:
            if token in s: raise SystemExit('Forbidden mutation token: '+token)
          print('PERF_CF_02CR_PREVIEW_SOURCE_PARITY_STATIC_PASS')
          PY
      - name: Read Preview 02CR safe source, pagination, filters, and field contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDGE_SESSION_SECRET"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const crypto=require('crypto');
          const base=process.env.PREVIEW_URL;
          const now=Math.floor(Date.now()/1000);
          const claims={aud:'trendos-orders-edge',sub:'02cr-source-parity',role:'ops',department:'qualification',screens:['print','laser','press','service'],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const body=Buffer.from(JSON.stringify(claims)).toString('base64url');
          const input='v1.'+body;
          const token=input+'.'+crypto.createHmac('sha256',process.env.EDGE_SESSION_SECRET).update(input).digest('base64url');
          const headers={authorization:'Bearer '+token,accept:'application/json'};
          async function call(screen,params={}){
            const q=new URLSearchParams({screen,page:'1',pageSize:'100',...params});
            const r=await fetch(base+'/v1/edge/orders/02cr/page?'+q.toString(),{headers,cache:'no-store'});
            const t=await r.text(); let b={}; try{b=JSON.parse(t||'{}')}catch{}
            return {status:r.status,body:b};
          }
          const contract=['rowNumber','orderId','orderCode','lineId','customer','customerPhone','customerSource','source','externalCustomerId','customerMode','department','itemName','qty','assignedTo','priority','status','ready','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','updatedAt','notes','customerNotified','notifiedAt','notifiedBy','lastWhatsAppMessage','lastWhatsAppAt','lastWhatsAppBy','receivedAt','expectedDeliveryAt','expectedDeliveryText','overdue','registrationSent'];
          function safeKey(r){return [String(r.orderId||''),String(r.lineId||''),String(r.status||'')].join('|');}
          function safeRows(rows){return (rows||[]).map(r=>({orderId:String(r.orderId||''),lineId:String(r.lineId||''),status:String(r.status||'')}));}
          function assertContract(rows,screen){
            for(const r of rows||[]){
              for(const k of contract) assert.ok(Object.prototype.hasOwnProperty.call(r,k),screen+' missing contract key '+k+' on '+safeKey(r));
              assert.ok(String(r.orderId||''),screen+' empty orderId');
              assert.ok(String(r.lineId||''),screen+' empty lineId');
              assert.ok(String(r.department||''),screen+' empty department');
              assert.ok(String(r.status||''),screen+' empty status');
            }
          }
          async function pageReconstruct(screen,baseline){
            const expected=(baseline.body.rows||[]).map(safeKey);
            const totalPages=Math.max(1,Math.ceil(expected.length/5));
            const got=[];
            for(let page=1;page<=totalPages;page++){
              const p=await call(screen,{statusFilter:'__ACTIVE__',page:String(page),pageSize:'5'});
              assert.equal(p.status,200,screen+' page '+page+' HTTP'); assert.equal(p.body.success,true);
              assert.equal(Number(p.body.pagination?.page||0),page);
              assert.equal(Number(p.body.pagination?.pageSize||0),5);
              assert.equal(Number(p.body.pagination?.totalRows||0),expected.length);
              assert.equal(Number(p.body.pagination?.totalPages||0),totalPages);
              got.push(...(p.body.rows||[]).map(safeKey));
            }
            assert.deepEqual(got,expected,screen+' pagination reconstruction/order parity');
            assert.equal(new Set(got).size,got.length,screen+' pagination duplicate identity');
            return totalPages;
          }
          async function partitionExactStatus(screen,baseline){
            const rows=baseline.body.rows||[];
            const statuses=[...new Set(rows.map(r=>String(r.status||'')))];
            const got=[];
            const counts={};
            for(const st of statuses){
              const x=await call(screen,{statusFilter:st});
              assert.equal(x.status,200,screen+' status '+st+' HTTP'); assert.equal(x.body.success,true);
              counts[st]=Number(x.body.pagination?.totalRows||0);
              got.push(...(x.body.rows||[]).map(safeKey));
            }
            assert.deepEqual(got.slice().sort(),rows.map(safeKey).sort(),screen+' exact status partition parity');
            return counts;
          }
          async function partitionPriority(screen,baseline){
            const rows=baseline.body.rows||[];
            const priorities=[...new Set(rows.map(r=>String(r.priority||'عادي')))];
            const got=[]; const counts={};
            for(const p of priorities){
              const x=await call(screen,{statusFilter:'__ACTIVE__',priorityFilter:p});
              assert.equal(x.status,200,screen+' priority '+p+' HTTP'); assert.equal(x.body.success,true);
              counts[p]=Number(x.body.pagination?.totalRows||0);
              got.push(...(x.body.rows||[]).map(safeKey));
            }
            assert.deepEqual(got.slice().sort(),rows.map(safeKey).sort(),screen+' priority partition parity');
            return counts;
          }
          async function partitionHeat(screen,baseline){
            const rows=baseline.body.rows||[];
            const only=await call(screen,{statusFilter:'__ACTIVE__',heatPressFilter:'only'});
            const without=await call(screen,{statusFilter:'__ACTIVE__',heatPressFilter:'without'});
            assert.equal(only.status,200); assert.equal(without.status,200);
            const got=[...(only.body.rows||[]),...(without.body.rows||[])].map(safeKey).sort();
            assert.deepEqual(got,rows.map(safeKey).sort(),screen+' heat partition parity');
            return {only:Number(only.body.pagination?.totalRows||0),without:Number(without.body.pagination?.totalRows||0)};
          }
          (async()=>{
            const summary={};
            for(const screen of ['print','laser']){
              const active=await call(screen,{statusFilter:'__ACTIVE__'});
              assert.equal(active.status,200,screen+' active HTTP');
              assert.equal(active.body.success,true,screen+' active success');
              assert.equal(String(active.body.version||''),'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
              assertContract(active.body.rows,screen);
              const pages=await pageReconstruct(screen,active);
              const statusPartition=await partitionExactStatus(screen,active);
              const priorityPartition=await partitionPriority(screen,active);
              const heatPartition=await partitionHeat(screen,active);
              if((active.body.rows||[]).length){
                const first=active.body.rows[0];
                const q=await call(screen,{statusFilter:'__ACTIVE__',query:String(first.orderId||'')});
                assert.equal(q.status,200); assert.equal(q.body.success,true);
                assert.ok((q.body.rows||[]).some(r=>safeKey(r)===safeKey(first)),screen+' orderId query misses seed identity');
                assert.ok((q.body.rows||[]).every(r=>String(r.orderId||'').includes(String(first.orderId||''))),screen+' orderId query leakage');
              }
              const ready=await call(screen,{statusFilter:'__READY_PICKUP__'});
              assert.equal(ready.status,200); assert.equal(ready.body.success,true);
              summary[screen]={activeTotal:Number(active.body.pagination?.totalRows||0),activeRows:safeRows(active.body.rows),paginationPagesAt5:pages,statusPartition,priorityPartition,heatPartition,readyPickup:Number(ready.body.pagination?.totalRows||0),fieldContractKeys:contract.length,statusCounts:active.body.statusCounts,statusOrderCounts:active.body.statusOrderCounts,mirrors:(active.body.mirrors||[]).map(m=>({sheetName:m.sheetName,sourceLastRow:m.sourceLastRow,rowCount:m.rowCount,status:m.status,note:m.note}))};
            }
            const debt=await call('print',{statusFilter:'__DEBT__'});
            assert.equal(debt.status,409); assert.equal(debt.body.code,'apps-script-required'); assert.equal(debt.body.fallback,'apps-script');
            console.log('PERF_CF_02CR_PREVIEW_SAFE='+JSON.stringify(summary));
            console.log('PERF_CF_02CR_DEBT_FALLBACK='+JSON.stringify({status:debt.status,code:debt.body.code,fallback:debt.body.fallback}));
            console.log('PERF_CF_02CR_PREVIEW_PAGINATION_FILTER_FIELD_CONTRACT_PASS_NO_PII');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
      - name: Conclusion
        run: echo 'PERF_CF_02CR_PREVIEW_SOURCE_PARITY_TEMP_PASS_NO_MUTATION'
