name: TrendOS Tasks V3 T1 Qualified Singlefile

on:
  push:
    branches:
      - tasks-v3-t15-d1-read-replica-preview-20260915
    paths:
      - 'cloudflare-d1/dashboard/tasks-v3-t1-qualified-singlefile-20260915.mjs'
      - 'cloudflare-d1/test/tasks-v3-t1-qualified-singlefile.test.mjs'
      - '.github/workflows/trendos-tasks-v3-t1-qualified-singlefile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run T1 single-file contract
        run: node cloudflare-d1/test/tasks-v3-t1-qualified-singlefile.test.mjs
