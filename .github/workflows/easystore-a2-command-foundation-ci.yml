name: EasyStore A2 Command Foundation CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'cloudflare-d1/migrations/0023_employee_accounting_command_audit_v1.sql'
      - 'cloudflare-d1/src/employee-accounting-native-v1.mjs'
      - 'tests/easystore_a2_command_foundation_v1.test.mjs'
      - '.github/workflows/easystore-a2-command-foundation-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate A2 idempotent command foundation
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/easystore_a2_command_foundation_v1.test.mjs
          node tests/easystore_a1_day_ops_reads_v1.test.mjs
          echo EASYSTORE_A2_COMMAND_FOUNDATION_CI=PASS
