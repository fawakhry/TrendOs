name: EasyStore A2 Sync Shared TrendOS Base
# Resync marker before A2 readonly API deployment
# sync-round-2
# sync-round-3

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a2-sync-shared-base.yml'

permissions:
  contents: write

concurrency:
  group: easystore-a2-sync-shared-base
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
          fetch-depth: 0

      - name: Merge current shared TrendOS candidate into isolated accounting branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fawakhry"
          git config user.email "87904105+fawakhry@users.noreply.github.com"
          git fetch origin candidate/t12-full-cloud-cutover-a56-20260929
          SHARED="$(git rev-parse FETCH_HEAD)"
          ACCOUNTING_BEFORE="$(git rev-parse HEAD)"
          BASE="$(git merge-base HEAD FETCH_HEAD)"
          echo "A2_SYNC_ACCOUNTING_BEFORE=$ACCOUNTING_BEFORE"
          echo "A2_SYNC_SHARED_HEAD=$SHARED"
          echo "A2_SYNC_MERGE_BASE=$BASE"

          git diff --name-only "$BASE" FETCH_HEAD > /tmp/shared-files.txt
          git diff --name-only "$BASE" HEAD > /tmp/accounting-files.txt
          python3 <<'PY'
          from pathlib import Path
          shared=set(Path('/tmp/shared-files.txt').read_text().splitlines())
          accounting=set(Path('/tmp/accounting-files.txt').read_text().splitlines())
          overlap=sorted(shared & accounting)
          allowed={
            '.github/workflows/easystore-a2-sync-shared-base.yml'
          }
          risky=[x for x in overlap if x not in allowed]
          if risky:
              print('A2_SYNC_OVERLAP='+','.join(risky))
              raise SystemExit('shared/accounting source overlap requires explicit review')
          print('A2_SYNC_OVERLAP=NONE')
          PY

          git merge --no-edit FETCH_HEAD
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node tests/easystore_a2_command_foundation_v1.test.mjs
          node tests/easystore_a2_party_writes_v1.test.mjs
          node tests/easystore_a2_daily_purchase_custody_v1.test.mjs
          node tests/easystore_a2_purchase_invoice_v1.test.mjs
          node tests/easystore_a2_purchase_reversal_v1.test.mjs
          node tests/easystore_a2_waste_stock_recalc_v1.test.mjs
          node tests/easystore_a2_final_day_close_v1.test.mjs
          node tests/easystore_a2_direct_sale_v1.test.mjs
          git push origin HEAD:candidate/easystore-accounting-a2-20261005
          echo A2_SYNC_SHARED_BASE=PASS
          echo PRODUCTION_MUTATION=NO
