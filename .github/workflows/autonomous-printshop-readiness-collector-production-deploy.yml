name: Autonomous Printshop Readiness Collector Production Deploy
# design schema refresh after 0024/0025 qualification

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/readiness-collector/**'
      - 'autonomous-printshop/core/readiness-evidence-writer-v1.mjs'
      - 'autonomous-printshop/core/readiness-source-adapters-v1.mjs'
      - 'autonomous-printshop/tests/readiness_collector_v1.test.mjs'
      - 'autonomous-printshop/core/design-readiness-collector-v1.mjs'
      - 'autonomous-printshop/core/design-production-evidence-v1.mjs'
      - 'autonomous-printshop/core/design-asset-linking-v1.mjs'
      - 'autonomous-printshop/tests/design_readiness_collector_v1.test.mjs'
      - 'autonomous-printshop/tests/design_production_evidence_v1.test.mjs'
      - 'autonomous-printshop/tests/design_asset_linking_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-readiness-collector-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-readiness-collector-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/readiness-collector/wrangler.toml
      COLLECTOR_URL: https://autonomous-printshop-readiness-collector.trendmall-contact.workers.dev
      TRENDOS_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify collector contracts
        run: |
          set -euo pipefail
          node autonomous-printshop/tests/readiness_evidence_writer_v1.test.mjs
          node autonomous-printshop/tests/readiness_source_adapters_v1.test.mjs
          node autonomous-printshop/tests/readiness_collector_v1.test.mjs
          node autonomous-printshop/tests/design_asset_linking_v1.test.mjs
          node autonomous-printshop/tests/design_production_evidence_v1.test.mjs
          node autonomous-printshop/tests/design_readiness_collector_v1.test.mjs

      - name: Hard write-boundary gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTONOMOUS_READINESS_EVIDENCE_ONLY' autonomous-printshop/readiness-collector/worker.mjs
          grep -q 'INSERT OR IGNORE INTO autonomous_readiness_evidence' autonomous-printshop/core/readiness-evidence-writer-v1.mjs
          ! grep -Eiq '(INSERT|UPDATE|DELETE|REPLACE)[^;]*(t12_prod_|employee_|operator_tasks|autonomy_events)' autonomous-printshop/readiness-collector/worker.mjs
          ! grep -Eiq '(INSERT|UPDATE|DELETE|REPLACE)[^;]*(t12_prod_|employee_|operator_tasks|autonomy_events)' autonomous-printshop/core/readiness-source-adapters-v1.mjs
          ! grep -Eiq '(INSERT|UPDATE|DELETE|REPLACE)[^;]*(t12_prod_|employee_|operator_tasks|autonomy_events)' autonomous-printshop/core/readiness-evidence-writer-v1.mjs
          echo 'READINESS_COLLECTOR_WRITE_BOUNDARY=PASS'

      - name: Main TrendOS pre-deploy health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/main-pre.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/main-pre.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_PREDEPLOY=PASS');
          NODE

      - name: Wrangler dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autonomous-printshop-readiness-collector-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config "$CONFIG" --outdir /tmp/autonomous-printshop-readiness-collector-build
          test -d /tmp/autonomous-printshop-readiness-collector-build
          echo 'READINESS_COLLECTOR_DRYRUN=PASS'

      - name: Deploy isolated readiness collector
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config "$CONFIG"
          sleep 5
          echo 'READINESS_COLLECTOR_DEPLOYED=YES'

      - name: Verify collector health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$COLLECTOR_URL/health" > /tmp/collector.json
          cat /tmp/collector.json
          echo
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/collector.json','utf8'));
          if(x.success!==true||x.service!=='autonomous-printshop-readiness-collector') process.exit(1);
          if(x.mode!=='READINESS_EVIDENCE_COLLECTOR') process.exit(2);
          if(x.readinessMode!=='SHADOW') process.exit(3);
          if(x.writeAuthority!=='AUTONOMOUS_READINESS_EVIDENCE_ONLY') process.exit(4);
          if(x.businessWrites!==false||x.employeeAssignment!==false) process.exit(5);
          if(Number(x.operatorTasks)!==0) process.exit(6);
          console.log('READINESS_COLLECTOR_HEALTH=PASS');
          console.log('READINESS_EVIDENCE_ROWS_BEFORE_CRON='+String(x.evidenceRows||0));
          NODE

      - name: Main TrendOS post-deploy health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/main-post.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/main-post.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_POSTDEPLOY=PASS');
          NODE

      - name: Safety conclusion
        run: |
          echo 'READINESS_COLLECTOR=LIVE'
          echo 'CRON=EVERY_10_MINUTES'
          echo 'WRITE_AUTHORITY=AUTONOMOUS_READINESS_EVIDENCE_ONLY'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'MATERIAL_LEDGER_WRITE=NO'
          echo 'OPERATOR_TASK_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
