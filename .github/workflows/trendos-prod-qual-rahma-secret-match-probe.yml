name: TrendOS PROD Qual Rahma Secret Match Probe

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-prod-qual-rahma-secret-match-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.head_commit.message == 'PROBE PROD QUALIFY RAHMA SECRET MATCH 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - name: Check Rahma username match and token presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          if [ "$QUALIFY_USERNAME" = 'رحمه' ]; then
            echo 'RAHMA_USERNAME_MATCH=RAHMA_HEH'
            exit 0
          fi
          if [ "$QUALIFY_USERNAME" = 'رحمة' ]; then
            echo 'RAHMA_USERNAME_MATCH=RAHMA_TAA_MARBUTA'
            exit 0
          fi
          echo 'RAHMA_USERNAME_MATCH=NO'
          exit 2
