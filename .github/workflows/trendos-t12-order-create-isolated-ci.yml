name: TrendOS T12 Order Create Isolated CI

on:
  push:
    branches:
      - cloud-migration-v3-t12-order-create-ci-20260919
    paths:
      - 'cloudflare-d1/src/t12-order-create-preflight.mjs'
      - 'tests/t12_order_create_preflight.test.mjs'
      - 'tests/t12_order_create_repo_parity.test.mjs'
      - 'cloudflare-d1/src/t12-order-create-shadow-intent.mjs'
      - 'tests/t12_order_create_shadow_intent.test.mjs'
      - 'cloudflare-d1/schema-prep/t12-order-create-shadow-v1.sql'
      - 'tests/t12_order_create_shadow_schema.test.mjs'
      - 'cloudflare-d1/src/t12-order-create-shadow-store.mjs'
      - 'tests/t12_order_create_shadow_store.test.mjs'
      - 'cloudflare-d1/t12-preview/order-create-shadow-handler.mjs'
      - 'tests/t12_order_create_shadow_handler.test.mjs'
      - 'cloudflare-d1/schema-prep/t12-order-id-authority-v1.sql'
      - 'cloudflare-d1/src/t12-order-id-authority-candidate.mjs'
      - 'tests/t12_order_id_authority_candidate.test.mjs'
      - 'tests/t12_scope_guard.test.mjs'
      - 'Code.gs'
      - '.github/workflows/trendos-t12-order-create-isolated-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t12-pure-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated T12 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check pure preflight and test
        run: |
          node --check cloudflare-d1/src/t12-order-create-preflight.mjs
          node --check tests/t12_order_create_preflight.test.mjs
          node --check tests/t12_order_create_repo_parity.test.mjs
          node --check cloudflare-d1/src/t12-order-create-shadow-intent.mjs
          node --check tests/t12_order_create_shadow_intent.test.mjs
          node --check tests/t12_order_create_shadow_schema.test.mjs
          node --check cloudflare-d1/src/t12-order-create-shadow-store.mjs
          node --check tests/t12_order_create_shadow_store.test.mjs
          node --check cloudflare-d1/t12-preview/order-create-shadow-handler.mjs
          node --check tests/t12_order_create_shadow_handler.test.mjs
          node --check cloudflare-d1/src/t12-order-id-authority-candidate.mjs
          node --check tests/t12_order_id_authority_candidate.test.mjs
          node --check tests/t12_scope_guard.test.mjs
      - name: Run T12 hard scope guard
        run: node tests/t12_scope_guard.test.mjs
      - name: Run isolated no-mutation tests
        run: |
          node tests/t12_order_create_preflight.test.mjs
          node tests/t12_order_create_repo_parity.test.mjs
          node tests/t12_order_create_shadow_intent.test.mjs
          node --experimental-sqlite tests/t12_order_create_shadow_schema.test.mjs
          node --experimental-sqlite tests/t12_order_create_shadow_store.test.mjs
          node --experimental-sqlite tests/t12_order_create_shadow_handler.test.mjs
          node --experimental-sqlite tests/t12_order_id_authority_candidate.test.mjs
