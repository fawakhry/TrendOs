name: BOOK19 Legacy Bulk Recheck (FAKE SHEET NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  legacy-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy Code.gs actual bulk function in fake Google Sheet and no-network VM
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check tests/book19_legacy_bulk_recheck_debt_rows_no_go.test.mjs
          node --test tests/book19_legacy_bulk_recheck_debt_rows_no_go.test.mjs
          echo 'BOOK19_LEGACY_BULK_SOURCE_ONLY=YES'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_MUTATION=NO'
