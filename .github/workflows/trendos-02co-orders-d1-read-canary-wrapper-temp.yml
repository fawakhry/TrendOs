name: TrendOS 02CO Orders D1 Read Canary Wrapper TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02co-orders-d1-read-canary-wrapper-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-02co-orders-d1-read-canary-wrapper-temp
  cancel-in-progress: false

jobs:
  wrapper-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANARY_SOURCE: view-mirror-v2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRENDOS_PROD_QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      EDGE_BASE: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4

      - name: Static safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false' config.js
          grep -Eq 'edge-orders-read-v1-canary.mjs' cloudflare-d1/src/index_v2.js
          grep -Eq 'D1_ORDERS_READ_V1_02CO_VIEW_CANARY' cloudflare-d1/src/edge-orders-read-v1-canary.mjs
          grep -Eq 'واجهة الطباعة' cloudflare-d1/src/edge-orders-read-v1-canary.mjs
          python - <<'PY'
          from pathlib import Path
          checked = [
            Path('cloudflare-d1/src/edge-orders-read-v1-canary.mjs'),
            Path('cloudflare-d1/src/index_v2.js'),
            Path('.github/workflows/trendos-02co-orders-d1-read-canary-wrapper-temp.yml'),
          ]
          forbidden = ['secret'+' put', 'wrangler d1 migrations'+' apply', 'd1 execute --'+'file', '/v1/qualification/cloud-write/reconcile/'+'order', 'TRENDOS_PRODUCTION_'+'CUTOVER', 'AUTHORITY_'+'CUTOVER', 'generic outbox'+' drain']
          deploy_cmd = 'npx --yes ' + 'wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml'
          for path in checked:
            data = path.read_text(encoding='utf-8')
            for token in forbidden:
              if token in data:
                raise SystemExit(f'Forbidden token {token} in {path}')
          if Path('.github/workflows/trendos-02co-orders-d1-read-canary-wrapper-temp.yml').read_text(encoding='utf-8').count(deploy_cmd) != 1:
            raise SystemExit('Expected exactly one controlled Worker deploy command')
          print('PERF_CF_02CO_WRAPPER_CANARY_STATIC_BOUNDARY_PASS')
          PY

      - name: Secrets readiness
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TRENDOS_PROD_QUALIFY_USERNAME"
          test -n "$TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN"
          echo 'PERF_CF_02CO_WRAPPER_CANARY_SECRETS_READY'

      - name: Pre-deploy read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async function main(){
            const base = process.env.EDGE_BASE;
            async function get(path) {
              const started = Date.now();
              const res = await fetch(base + path, { headers: { accept: 'application/json' }, cache: 'no-store' });
              const body = JSON.parse(await res.text() || '{}');
              return { status: res.status, ms: Date.now() - started, body };
            }
            const health = await get('/health');
            const cloud = await get('/v1/cloud/write/health');
            const recon = await get('/v1/qualification/cloud-write/reconcile/health');
            if (health.status !== 200 || health.body.success !== true || health.body.database !== true) throw new Error('worker health failed');
            if (cloud.status !== 200 || cloud.body.success !== true || cloud.body.cutover !== false || cloud.body.sheetsAuthoritative !== true || Number(cloud.body.pendingOutbox || 0) !== 0) throw new Error('cloud write boundary changed');
            if (recon.status !== 200 || recon.body.enabled !== false || recon.body.genericDrainEnabled !== false) throw new Error('02CL boundary changed');
            console.log('PERF_CF_02CO_WRAPPER_CANARY_PRE_BOUNDARY=' + JSON.stringify({ workerMs: health.ms, cloudWriteMs: cloud.ms, pendingOutbox: cloud.body.pendingOutbox, cutover: cloud.body.cutover, sheetsAuthoritative: cloud.body.sheetsAuthoritative, reconcileEnabled: recon.body.enabled }));
          })().catch((err)=>{ console.error(err && err.stack || err); process.exit(1); });
          NODE

      - name: Controlled Worker deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deploy --config cloudflare-d1/wrangler.toml
          echo 'PERF_CF_02CO_WRAPPER_CANARY_DEPLOY_DONE'

      - name: Authenticated print comparison
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async function main(){
            const edgeBase = process.env.EDGE_BASE;
            const appsScriptUrl = process.env.APPS_SCRIPT_URL;
            const username = process.env.TRENDOS_PROD_QUALIFY_USERNAME;
            const token = process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN;
            function key(row) { return [row && row.orderId || '', row && row.lineId || '', row && row.status || ''].map(v => String(v || '').trim()).join('|'); }
            async function readJson(label, url, options = {}) {
              const started = Date.now();
              const res = await fetch(url, { cache: 'no-store', ...options });
              const raw = await res.text();
              let body = {};
              try { body = JSON.parse(raw || '{}'); } catch (err) { throw new Error(label + ' invalid JSON ' + raw.slice(0, 160)); }
              return { label, status: res.status, ms: Date.now() - started, body };
            }
            function assert(cond, msg) { if (!cond) throw new Error(msg); }
            const health = await readJson('cloud-health', `${edgeBase}/v1/cloud/write/health`, { headers: { accept: 'application/json' } });
            assert(health.status === 200 && health.body.success === true && health.body.cutover === false && health.body.sheetsAuthoritative === true && Number(health.body.pendingOutbox || 0) === 0, 'post-deploy boundary changed');
            const session = await readJson('edge-session', `${edgeBase}/v1/edge/orders/session`, { method: 'POST', headers: { accept: 'application/json', 'content-type': 'application/json' }, body: JSON.stringify({ username, token }) });
            assert(session.status === 200 && session.body.success === true && session.body.edgeToken, 'edge session failed http=' + session.status);
            assert((session.body.user && session.body.user.screens || []).includes('print'), 'canary user does not have print screen');
            const comparisons = [];
            for (const statusFilter of ['', '__ACTIVE__']) {
              const params = new URLSearchParams({ screen: 'print', page: '1', pageSize: '20' });
              if (statusFilter) params.set('statusFilter', statusFilter);
              const edge = await readJson('edge-print-' + (statusFilter || 'all'), `${edgeBase}/v1/edge/orders/page?${params}`, { headers: { accept: 'application/json', authorization: `Bearer ${session.body.edgeToken}` } });
              assert(edge.status === 200 && edge.body.success === true && edge.body.dataSource === 'd1-edge-orders', 'edge print read failed http=' + edge.status);
              const appPayload = { action: 'getRowsPageV1931', username, token, screen: 'print', page: '1', pageSize: '20' };
              if (statusFilter) appPayload.statusFilter = statusFilter;
              const app = await readJson('apps-print-' + (statusFilter || 'all'), appsScriptUrl, { method: 'POST', headers: { accept: 'application/json', 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify(appPayload) });
              assert(app.status === 200 && app.body.success === true, 'Apps print read failed http=' + app.status);
              const edgeKeys = (edge.body.rows || []).map(key);
              const appKeys = (app.body.rows || []).map(key);
              if (JSON.stringify(edgeKeys) !== JSON.stringify(appKeys)) {
                const mismatch = [];
                for (let i = 0; i < Math.max(edgeKeys.length, appKeys.length) && mismatch.length < 5; i++) {
                  if (edgeKeys[i] !== appKeys[i]) mismatch.push({ index: i, edge: edgeKeys[i] || null, app: appKeys[i] || null });
                }
                throw new Error('row identity mismatch ' + JSON.stringify({ filter: statusFilter || 'all', edgeTotalRows: edge.body.pagination && edge.body.pagination.totalRows, appTotalRows: app.body.pagination && app.body.pagination.totalRows, mismatch, edgeVersion: edge.body.version, edgeMirror: edge.body.mirror }));
              }
              assert(Number(edge.body.pagination && edge.body.pagination.totalRows) === Number(app.body.pagination && app.body.pagination.totalRows), 'pagination total mismatch filter=' + (statusFilter || 'all'));
              comparisons.push({ filter: statusFilter || 'all', edgeMs: edge.ms, appsMs: app.ms, totalRows: edge.body.pagination.totalRows, version: edge.body.version, mirror: edge.body.mirror });
            }
            const debtParams = new URLSearchParams({ screen: 'print', page: '1', pageSize: '20', statusFilter: '__DEBT__' });
            const debt = await readJson('edge-debt-fallback', `${edgeBase}/v1/edge/orders/page?${debtParams}`, { headers: { accept: 'application/json', authorization: `Bearer ${session.body.edgeToken}` } });
            assert(debt.status === 409 && debt.body.code === 'apps-script-required' && debt.body.fallback === 'apps-script', 'Debt fallback changed');
            console.log('PERF_CF_02CO_WRAPPER_CANARY_COMPARISON=' + JSON.stringify({ role: session.body.user && session.body.user.role, screens: session.body.user && session.body.user.screens, comparisons, debtFallback: { status: debt.status, code: debt.body.code, fallback: debt.body.fallback } }));
            console.log('PERF_CF_02CO_WRAPPER_CANARY_PASS');
          })().catch((err)=>{ console.error(err && err.stack || err); process.exit(1); });
          NODE

      - name: Post-canary boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async function main(){
            const base = process.env.EDGE_BASE;
            async function get(path) {
              const res = await fetch(base + path, { headers: { accept: 'application/json' }, cache: 'no-store' });
              return { status: res.status, body: JSON.parse(await res.text() || '{}') };
            }
            const cloud = await get('/v1/cloud/write/health');
            const recon = await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth = await get('/v1/edge/orders/page?screen=print&page=1&pageSize=5');
            if (cloud.status !== 200 || cloud.body.success !== true || cloud.body.cutover !== false || cloud.body.sheetsAuthoritative !== true || Number(cloud.body.pendingOutbox || 0) !== 0) throw new Error('cloud boundary changed post-canary');
            if (recon.status !== 200 || recon.body.enabled !== false || recon.body.genericDrainEnabled !== false) throw new Error('02CL boundary changed post-canary');
            if (unauth.status !== 401) throw new Error('orders page no-token protection changed');
            console.log('PERF_CF_02CO_WRAPPER_CANARY_POST_BOUNDARY=' + JSON.stringify({ pendingOutbox: cloud.body.pendingOutbox, cutover: cloud.body.cutover, sheetsAuthoritative: cloud.body.sheetsAuthoritative, reconcileEnabled: recon.body.enabled, genericDrainEnabled: recon.body.genericDrainEnabled, ordersUnauthStatus: unauth.status }));
          })().catch((err)=>{ console.error(err && err.stack || err); process.exit(1); });
          NODE
