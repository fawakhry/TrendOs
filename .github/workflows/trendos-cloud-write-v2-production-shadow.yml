name: TrendOS Cloud Write V2 Production Shadow Gate

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/cloud-write-order-v2-production-shadow.mjs'
      - 'cloudflare-d1/src/cloud-write-order-contract-v2.mjs'
      - 'cloudflare-d1/production-shadow/index.js'
      - 'cloudflare-d1/production-shadow/observer.mjs'
      - 'tests/cloud_write_order_v2_production_shadow.test.mjs'
      - 'tests/cloudflare_production_shadow_observer_candidate_v1.test.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/src/cloud-write.mjs'
      - 'cloudflare-d1/wrangler.toml'
      - '.github/workflows/trendos-cloud-write-v2-production-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-shadow-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify mutation-free production shadow contract
        run: |
          node tests/cloud_write_order_v2_production_shadow.test.mjs
          node tests/cloudflare_production_shadow_observer_candidate_v1.test.mjs

      - name: Verify Production remains write-off and shadow is absent or default-OFF
        run: |
          set -euo pipefail
          ! grep -Fq 'cloud-write-order-v2-production-shadow' cloudflare-d1/src/index_v2.js
          ! grep -Fq 'cloud-write-order-v2-production-shadow' cloudflare-d1/src/cloud-write.mjs
          grep -Eq 'TRENDOS_CLOUD_WRITE_V1_ENABLED[[:space:]]*=[[:space:]]*"false"' cloudflare-d1/wrangler.toml
          ! grep -Eq 'TRENDOS_CLOUD_WRITE_V1_ENABLED[[:space:]]*=[[:space:]]*"true"' cloudflare-d1/wrangler.toml

          if grep -Eq '^main = "production-shadow/index\.js"$' cloudflare-d1/wrangler.toml; then
            grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "false"$' cloudflare-d1/wrangler.toml
            ! grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
            echo 'PRODUCTION_SHADOW_WRAPPER_DEFAULT_OFF_PASS'
          else
            grep -Eq '^main = "src/index_v2\.js"$' cloudflare-d1/wrangler.toml
            ! grep -Fq 'TRENDOS_PRODUCTION_SHADOW_V2_ENABLED' cloudflare-d1/wrangler.toml
            echo 'PRODUCTION_SHADOW_NOT_YET_INTEGRATED_PASS'
          fi

      - name: Compile current Production wrapper with Wrangler dry-run only
        run: |
          set -euo pipefail
          rm -rf /tmp/trendos-prod-shadow-wrapper-build
          npx --yes wrangler@4.33.2 deploy --dry-run \
            --config cloudflare-d1/wrangler.toml \
            --outdir /tmp/trendos-prod-shadow-wrapper-build
          test -d /tmp/trendos-prod-shadow-wrapper-build
          echo 'PRODUCTION_SHADOW_CURRENT_WRANGLER_DRY_RUN_PASS'

      - name: Safety conclusion
        run: |
          echo 'CLOUD_WRITE_ORDER_V2_PRODUCTION_SHADOW_GATE_PASS'
          echo 'Production Shadow remains planning-only, deterministic, mutation-free, and credential-free.'
          echo 'Working-branch Production integration is accepted only when the shadow flag is explicitly OFF.'
          echo 'The current Production wrapper compiled with Wrangler dry-run only; no Cloudflare credentials were loaded and no Worker was deployed.'
          echo 'Production Cloud Write remains OFF; this workflow performs no deployment or cutover.'
