name: TrendOS Zero Google T12 full customer draft inventory — READ ONLY OFF
on:
  pull_request:
    paths:
      - 'cloudflare-d1/customer-stage/t12-draft-lossless-inventory-ro-internal-v0.mjs'
      - 'tests/customer_t12_draft_lossless_inventory_ro_off.test.mjs'
      - 'tests/customer_t12_draft_inventory_real_sqlite_ro.test.py'
      - '.github/workflows/trendos-customer-t12-draft-inventory-ro-off-ci.yml'
      - 'cloudflare-d1/src/customer-portal-native-submit-preflight-v0.mjs'
      - 'cloudflare-d1/customer-stage/index.mjs'
      - 'cloudflare-d1/production-shadow/index.js'
      - 'cloudflare-d1/src/index_v2.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-no-t12-create:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete owner-scoped inventory read-only source
        run: |
          set -euo pipefail
          node --check cloudflare-d1/customer-stage/t12-draft-lossless-inventory-ro-internal-v0.mjs
          node --test tests/customer_t12_draft_lossless_inventory_ro_off.test.mjs
          python3 tests/customer_t12_draft_inventory_real_sqlite_ro.test.py -v
          ! grep -q 't12-draft-lossless-inventory-ro-internal-v0' cloudflare-d1/customer-stage/index.mjs
          ! grep -q 't12-draft-lossless-inventory-ro-internal-v0' cloudflare-d1/production-shadow/index.js
          ! grep -q 't12-draft-lossless-inventory-ro-internal-v0' cloudflare-d1/src/index_v2.js
          grep -Eq 'TRENDOS_CUSTOMER_PORTAL_STAGING_ENABLED[[:space:]]*=[[:space:]]*"false"' cloudflare-d1/wrangler.customer-stage.toml
          ! grep -q 'createT12GeneralOrder(' cloudflare-d1/customer-stage/t12-draft-lossless-inventory-ro-internal-v0.mjs
          ! grep -q 'db.prepare.*\.run(' cloudflare-d1/customer-stage/t12-draft-lossless-inventory-ro-internal-v0.mjs
          echo 'ZERO_GOOGLE_T12_INVENTORY_READ_ONLY=YES'
          echo 'T12_SINGLE_WRITER_CALLED=NO'
          echo 'CUSTOMER_DRAFT_MULTI_ITEM_FILE_INVENTORY_SOURCE_ONLY=YES'
          echo 'GOOGLE_CUSTOMER_ACTIONS_RETIRED_LAST_PROVEN=0/9'
          echo 'PRINT_RELEASE=NO_GO'
          echo 'NO_CLOUDFLARE_DEPLOY_OR_REAL_DB=YES'
