name: TrendOS 02CV Fly Print D1 Read-Only Temp

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cv-flyprint-d1-readonly-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: trendos-main
    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read Orders Lines mirror catalog only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 d1 execute "$DB_NAME" --remote --json --command "SELECT sheet_name, source_last_row, source_last_col, row_count, status, synced_at, note, headers_json FROM sheet_catalog WHERE sheet_name='بنود الأوردرات' LIMIT 1;" > /tmp/catalog.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const block=Array.isArray(raw)?raw[0]:raw;
          const rows=(block&&block.results)||[];
          if(rows.length!==1) throw new Error('Lines catalog row missing');
          const row=rows[0];
          const headers=JSON.parse(row.headers_json||'[]').map(v=>String(v==null?'':v).trim());
          const aliases=['طباعة على الطاير','طباعة ع الطاير','طباعة فورية','Ready Print','Fly Print','Quick Print'];
          let idx=-1, matched='';
          for(const a of aliases){ const x=headers.lastIndexOf(a); if(x>=0){idx=x;matched=a;break;} }
          console.log('LINES_CATALOG='+JSON.stringify({sourceLastRow:Number(row.source_last_row||0),sourceLastCol:Number(row.source_last_col||0),rowCount:Number(row.row_count||0),status:row.status,syncedAt:row.synced_at,note:row.note,headerCount:headers.length,flyIndex:idx,flyHeader:matched,tailHeaders:headers.slice(Math.max(0,headers.length-12))}));
          if(idx<0) process.exitCode=2;
          fs.writeFileSync('/tmp/fly-index.txt',String(idx));
          NODE

      - name: Count Fly Print values without exposing business rows
        shell: bash
        run: |
          set -euo pipefail
          idx="$(cat /tmp/fly-index.txt)"
          test "$idx" -ge 0
          sql="SELECT COUNT(*) AS total_rows, SUM(CASE WHEN TRIM(COALESCE(json_extract(display_json, '$[$idx]'),'')) IN ('نعم','true','TRUE','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير') THEN 1 ELSE 0 END) AS fly_rows, SUM(CASE WHEN TRIM(COALESCE(json_extract(display_json, '$[$idx]'),'')) <> '' THEN 1 ELSE 0 END) AS nonempty_fly_values FROM sheet_rows WHERE sheet_name='بنود الأوردرات' AND row_number>1;"
          npx --yes wrangler@4.33.2 d1 execute "$DB_NAME" --remote --json --command "$sql" > /tmp/counts.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/counts.json','utf8'));
          const block=Array.isArray(raw)?raw[0]:raw;
          const row=((block&&block.results)||[])[0]||{};
          console.log('FLY_VALUE_COUNTS='+JSON.stringify({totalRows:Number(row.total_rows||0),flyRows:Number(row.fly_rows||0),nonemptyFlyValues:Number(row.nonempty_fly_values||0)}));
          if(Number(row.fly_rows||0)<1) throw new Error('D1 has no fly-print affirmative rows');
          NODE

      - name: Read-only pass
        run: echo '02CV_FLYPRINT_D1_READONLY_PASS'
