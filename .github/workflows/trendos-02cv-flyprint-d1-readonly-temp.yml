# rerun-after-user-sheet-edit-20260906
name: TrendOS 02CV Fly Print D1 Read-Only Temp

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cv-flyprint-d1-readonly-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: trendos-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read Orders Lines mirror catalog only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 d1 execute "$DB_NAME" --remote --json --command "SELECT sheet_name, source_last_row, source_last_col, row_count, status, synced_at, note, headers_json FROM sheet_catalog WHERE sheet_name='بنود الأوردرات' LIMIT 1;" > /tmp/catalog.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const block=Array.isArray(raw)?raw[0]:raw;
          const rows=(block&&block.results)||[];
          if(rows.length!==1) throw new Error('Lines catalog row missing');
          const row=rows[0];
          const headers=JSON.parse(row.headers_json||'[]').map(v=>String(v==null?'':v).trim());
          const aliases=['طباعة على الطاير','طباعة ع الطاير','طباعة فورية','Ready Print','Fly Print','Quick Print'];
          let idx=-1, matched='';
          for(const a of aliases){ const x=headers.lastIndexOf(a); if(x>=0){idx=x;matched=a;break;} }
          console.log('LINES_CATALOG='+JSON.stringify({sourceLastRow:Number(row.source_last_row||0),sourceLastCol:Number(row.source_last_col||0),rowCount:Number(row.row_count||0),status:row.status,syncedAt:row.synced_at,note:row.note,headerCount:headers.length,flyIndex:idx,flyHeader:matched}));
          if(idx<0) process.exitCode=2;
          fs.writeFileSync('/tmp/fly-index.txt',String(idx));
          fs.writeFileSync('/tmp/headers.json',JSON.stringify(headers));
          NODE

      - name: Count Fly Print values without exposing business rows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const idx=Number(fs.readFileSync('/tmp/fly-index.txt','utf8').trim());
          if(!Number.isInteger(idx)||idx<0) throw new Error('Invalid fly index');
          const path=`$[${idx}]`;
          const sql=`SELECT COUNT(*) AS total_rows,
            SUM(CASE WHEN TRIM(COALESCE(json_extract(display_json, '${path}'),'')) IN ('نعم','true','TRUE','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير') THEN 1 ELSE 0 END) AS fly_rows,
            SUM(CASE WHEN TRIM(COALESCE(json_extract(display_json, '${path}'),'')) <> '' THEN 1 ELSE 0 END) AS nonempty_fly_values
            FROM sheet_rows WHERE sheet_name='بنود الأوردرات' AND row_number>1;`;
          fs.writeFileSync('/tmp/fly-count.sql',sql);
          NODE
          npx --yes wrangler@4.33.2 d1 execute "$DB_NAME" --remote --json --command "$(cat /tmp/fly-count.sql)" > /tmp/counts.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/counts.json','utf8'));
          const block=Array.isArray(raw)?raw[0]:raw;
          const row=((block&&block.results)||[])[0]||{};
          console.log('FLY_VALUE_COUNTS='+JSON.stringify({totalRows:Number(row.total_rows||0),flyRows:Number(row.fly_rows||0),nonemptyFlyValues:Number(row.nonempty_fly_values||0)}));
          if(Number(row.fly_rows||0)<1) throw new Error('D1 has no fly-print affirmative rows');
          NODE

      - name: Verify live D1 rows survive the Worker mapper
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 d1 execute "$DB_NAME" --remote --json --command "SELECT row_number AS rowNumber, values_json AS valuesJson, display_json AS displayJson FROM sheet_rows WHERE sheet_name='بنود الأوردرات' ORDER BY row_number;" > /tmp/rows.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { mapMirrorRows } from './cloudflare-d1/src/edge-orders-read-v1.mjs';
          const headers=JSON.parse(fs.readFileSync('/tmp/headers.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/rows.json','utf8'));
          const block=Array.isArray(raw)?raw[0]:raw;
          const source=((block&&block.results)||[]).map(r=>({
            rowNumber:Number(r.rowNumber||0),
            values:JSON.parse(r.valuesJson||'[]'),
            display:JSON.parse(r.displayJson||'[]')
          }));
          const mapped=mapMirrorRows(headers,source,'print');
          const yes=v=>['نعم','true','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير'].includes(String(v==null?'':v).trim().toLowerCase());
          const fly=mapped.filter(r=>yes(r.flyPrint||r.quickPrint)).length;
          console.log('WORKER_MAPPER_COUNTS='+JSON.stringify({mappedPrintRows:mapped.length,mappedFlyRows:fly}));
          if(fly<1) throw new Error('Worker mapper dropped all fly-print values');
          NODE

      - name: Read-only pass
        run: echo '02CV_FLYPRINT_D1_READONLY_PASS'
