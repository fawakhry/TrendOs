name: TrendOS T11 Freshness Runtime Probe

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t11-freshness-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard read-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "cloud-migration-v3-t6b-auth-shadow-canary-20260913"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"
          echo 'T11_FRESHNESS_PROBE_SCOPE=READ_ONLY'
          echo 'PRODUCTION_MUTATION=NO'
          echo 'WORKER_DEPLOY=NO'
          echo 'APPS_SCRIPT_DEPLOY=NO'
          echo 'BUSINESS_WRITE=NO'
          echo 'TASK_MUTATION=NO'
          echo 'SECRET_CHANGE=NO'

      - name: Stable production baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/edge/health" > /tmp/t11-edge-health.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/cloud/write/health" > /tmp/t11-write-health.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/t11-edge-health.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/t11-write-health.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('T11_STABLE_PRODUCTION_BASELINE=PASS');
          NODE

      - name: Acquire read-only qualification Edge session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const apps=process.env.APPS_SCRIPT_URL;
          const base=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          async function req(url,opt={},timeoutMs=45000){const c=new AbortController();const timer=setTimeout(()=>c.abort(),timeoutMs);try{const t=Date.now();const r=await fetch(url,{redirect:'follow',cache:'no-store',signal:c.signal,...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms:Date.now()-t};}finally{clearTimeout(timer)}}
          (async()=>{
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const login=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})},45000);
                const employeeToken=text(login.body?.user?.token);
                if(login.status!==200||login.body?.success!==true||!employeeToken){console.log('T11_FRESHNESS_SESSION_ATTEMPT='+JSON.stringify({attempt,loginHttp:login.status,loginMs:login.ms,exchangeHttp:0}));continue;}
                console.log('::add-mask::'+employeeToken);
                const exchange=await req(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},30000);
                const edgeToken=text(exchange.body?.edgeToken);
                console.log('T11_FRESHNESS_SESSION_ATTEMPT='+JSON.stringify({attempt,loginHttp:login.status,loginMs:login.ms,exchangeHttp:exchange.status,exchangeMs:exchange.ms,success:exchange.body?.success===true,authSource:text(exchange.body?.authSource)}));
                if(exchange.status===200&&exchange.body?.success===true&&edgeToken){console.log('::add-mask::'+edgeToken);fs.writeFileSync('/tmp/t11-freshness-edge-token',edgeToken,{mode:0o600});console.log('T11_FRESHNESS_EDGE_SESSION=PASS');return;}
              } catch(err) {
                console.log('T11_FRESHNESS_SESSION_ATTEMPT='+JSON.stringify({attempt,error:String(err&&err.name||'request-error')}));
              }
            }
            throw new Error('could not acquire read-only qualification Edge session');
          })().catch(err=>{console.error(err.message||err);process.exit(1)});
          NODE

      - name: Probe stable Production Print 02CR freshness path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const token=fs.readFileSync('/tmp/t11-freshness-edge-token','utf8').trim();
          const text=v=>String(v==null?'':v).trim();
          async function req(url,opt={},timeoutMs=20000){const c=new AbortController();const timer=setTimeout(()=>c.abort(),timeoutMs);try{const t=Date.now();const r=await fetch(url,{redirect:'follow',cache:'no-store',signal:c.signal,...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms:Date.now()-t};}finally{clearTimeout(timer)}}
          (async()=>{
            const path='/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter='+encodeURIComponent('__ACTIVE__');
            const r=await req(base+path,{method:'GET',headers:{accept:'application/json',authorization:'Bearer '+token}},20000);
            const b=r.body||{};
            const mirrorMeta=Array.isArray(b.mirrors)?b.mirrors.map(m=>({sheetName:text(m.sheetName),fresh:m.fresh===true,ageSeconds:Number(m.ageSeconds||0),maxAgeSeconds:Number(m.maxAgeSeconds||0),structurallyReady:m.structurallyReady===true,statusReady:m.statusReady===true,parity:m.parity===true,noteReady:m.noteReady===true})):[];
            const result={http:r.status,ms:r.ms,success:b.success===true,code:text(b.code),dataSource:text(b.dataSource),logicalFreshnessOk:b.logicalFreshness?.ok===true,logicalFreshnessMode:text(b.logicalFreshness?.mode),idleHeartbeatOk:b.idleHeartbeat?.ok===true,idleHeartbeatMode:text(b.idleHeartbeat?.mode),mirrors:mirrorMeta};
            console.log('T11_02CR_RUNTIME_RESULT='+JSON.stringify(result));
            if(r.status===200&&b.success===true&&b.logicalFreshness?.ok===true){
              console.log('T11_02CR_FRESHNESS_PATH=HEARTBEAT_EXTENDED');
            } else if(r.status===200&&b.success===true){
              console.log('T11_02CR_FRESHNESS_PATH=WRITE_AGE_FRESH');
            } else if(r.status===503){
              console.log('T11_02CR_FRESHNESS_PATH=FAIL_CLOSED_FALLBACK');
            } else {
              console.log('T11_02CR_FRESHNESS_PATH=UNEXPECTED_HTTP_'+r.status);
            }
            console.log('T11_02CR_RUNTIME_PROBE=COMPLETE');
            console.log('PRODUCTION_MUTATION=NO');
            console.log('WORKER_DEPLOY=NO');
            console.log('APPS_SCRIPT_DEPLOY=NO');
            console.log('BUSINESS_WRITE=NO');
            console.log('TASK_MUTATION=NO');
            console.log('SECRET_CHANGE=NO');
          })().catch(err=>{console.error(err.message||err);process.exit(1)});
          NODE

      - name: Cleanup ephemeral token
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f /tmp/t11-freshness-edge-token
          echo 'T11_FRESHNESS_EPHEMERAL_TOKEN_CLEANED=YES'
