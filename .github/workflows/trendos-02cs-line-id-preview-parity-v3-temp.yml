name: TrendOS 02CS Line ID Preview Parity V3 TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-line-id-preview-parity-v3-temp.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PREVIEW_URL: https://cs-lineid-trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4

      - name: Static read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-line-id-preview-parity-v3-temp.yml').read_text(encoding='utf-8').splitlines()
          bad=[x.strip() for x in lines if x.strip().startswith(('npx --yes wrangler@','wrangler ','git push','curl -X POST','curl --request POST'))]
          if bad: raise SystemExit('Mutation/tooling command forbidden: '+repr(bad))
          print('PERF_CF_02CS_PREVIEW_V3_STATIC_READONLY_PASS')
          PY

      - name: Preview exact identity parity with retry
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PREVIEW_URL;
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function readJson(label,url,opt={},attempts=4){
            let last=null;
            for(let i=1;i<=attempts;i++){
              try{
                const r=await fetch(url,{cache:'no-store',...opt});
                const raw=await r.text();
                let body;
                try{body=JSON.parse(raw||'{}');}catch(e){
                  console.log('PERF_CF_02CS_JSON_RETRY='+JSON.stringify({label,attempt:i,status:r.status,contentType:r.headers.get('content-type')||'',bytes:raw.length}));
                  throw new Error(label+' invalid JSON');
                }
                return {status:r.status,body};
              }catch(e){last=e;if(i<attempts)await sleep(3000*i);}
            }
            throw last;
          }
          async function session(){
            const x=await readJson('edge-session',edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},5);
            assert.equal(x.status,200);assert.equal(x.body.success,true);assert.ok(x.body.edgeToken);return x.body.edgeToken;
          }
          (async()=>{
            const sessionMs=[];
            for(let i=0;i<3;i++){const t=Date.now();await session();sessionMs.push(Date.now()-t);}
            let last=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const bearer=await session();
                const result=[];
                for(const screen of ['print','laser']){
                  const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
                  const edge=await readJson('edge-'+screen,edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}},4);
                  assert.equal(edge.status,200,screen+' edge http');assert.equal(edge.body.success,true,screen+' edge success');assert.equal(edge.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
                  const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};
                  const app=await readJson('apps-'+screen,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)},5);
                  assert.equal(app.status,200,screen+' Apps Script http');assert.equal(app.body.success,true,screen+' Apps Script success');
                  const ek=(edge.body.rows||[]).map(key),ak=(app.body.rows||[]).map(key);
                  assert.deepEqual(ek,ak,screen+' exact Order ID + Line ID + status mismatch');
                  assert.equal(Number(edge.body.pagination&&edge.body.pagination.totalRows),Number(app.body.pagination&&app.body.pagination.totalRows),screen+' totalRows mismatch');
                  assert.equal(ek.length,Number(edge.body.pagination&&edge.body.pagination.totalRows),screen+' pageSize100 did not cover all active rows');
                  for(const m of edge.body.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
                  result.push({screen,totalRows:ek.length});
                }
                const dp=new URLSearchParams({screen:'print',page:'1',pageSize:'20',statusFilter:'__DEBT__'});
                const debt=await readJson('edge-debt',edgeBase+'/v1/edge/orders/02cr/page?'+dp,{headers:{accept:'application/json',authorization:'Bearer '+bearer}},4);
                assert.equal(debt.status,409);assert.equal(debt.body.code,'apps-script-required');assert.equal(debt.body.fallback,'apps-script');
                console.log('PERF_CF_02CS_PREVIEW_V3_EXACT_PARITY_PASS='+JSON.stringify({attempt,sessionMs,result,debtFallback:true}));
                return;
              }catch(e){last=e;if(attempt<3)await sleep(5000);}
            }
            throw last;
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Final production boundary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health'),cloud=await get('/v1/cloud/write/health'),recon=await get('/v1/qualification/cloud-write/reconcile/health'),unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200);assert.equal(edge.body.success,true);assert.equal(edge.body.database,true);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.cutover,false);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_PREVIEW_V3_FINAL_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Conclusion
        run: echo 'PERF_CF_02CS_PREVIEW_V3_PASS_NO_MUTATION'
