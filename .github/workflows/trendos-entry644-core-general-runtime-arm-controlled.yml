name: TrendOS Entry644 Core GENERAL Runtime Arm Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry644-core-general-runtime-arm-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry644-core-general-runtime-arm-controlled
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Repo and exact Runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check employee-api-dispatcher-v1.js
          node tests/entry644_employee_core_general_dispatch.test.mjs

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry644arm=$GITHUB_SHA" -o "/tmp/$f.json"
          done
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry644arm=$GITHUB_SHA" -o /tmp/live-config.js

          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='NATIVE'||a.envEnabled!==true||a.nativeOnly!==true||a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||Number(a.userCount||0)!==6||Number(a.nativeReadyCount||0)!==6||a.plaintextStored!==false) throw new Error('auth drift');
          if(b.enabled!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge drift');
          if(co.schemaReady!==true||co.mode!=='READONLY'||Number(co.policyEpoch||0)!==1||Number(co.googleBusinessCalls||0)!==0||co.appsScriptBusinessAuthority!==false) throw new Error('core prestate drift');
          if(ct.mode!=='READONLY'||Number(ct.googleBusinessCalls||0)!==0||ct.appsScriptBusinessAuthority!==false) throw new Error('content drift');
          if(cm.mode!=='READONLY'||Number(cm.googleBusinessCalls||0)!==0||cm.appsScriptBusinessAuthority!==false) throw new Error('comms drift');
          if(o.mode!=='GENERAL'||Number(o.googleBusinessCalls||0)!==0||o.appsScriptBusinessAuthority!==false) throw new Error('ops drift');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting safety drift');
          const cfg=fs.readFileSync('/tmp/live-config.js','utf8');
          if(!cfg.includes("MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true")) throw new Error('frontend global native drift');
          if(!cfg.includes("MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false")) throw new Error('frontend bridge drift');
          if(!cfg.includes("MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE = 'READONLY'")) throw new Error('frontend core prestate drift');
          if(!cfg.includes("MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE = 'READONLY'")||!cfg.includes("MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE = 'READONLY'")) throw new Error('frontend other-family drift');
          console.log('ENTRY644_RUNTIME_ARM_PREFLIGHT=PASS');
          NODE

      - name: Lock D1 Core prestate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --json --command "
          SELECT singleton,marker,mode,policy_epoch AS policyEpoch,data_version AS dataVersion
            FROM employee_core_control_v1 WHERE singleton=1;" >/tmp/core-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/core-pre.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.marker)rows.push(v);Object.values(v).forEach(walk)}};walk(x);
          const c=rows.find(r=>r.marker==='ENTRY614_EMPLOYEE_CORE_V1');
          if(!c||c.mode!=='READONLY'||Number(c.policyEpoch||0)!==1) throw new Error('D1 Core prestate drift');
          console.log('ENTRY644_CORE_PRESTATE=READONLY_EPOCH_1');
          NODE

      - name: Promote Core GENERAL only
        id: mutate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --json --command "
          UPDATE employee_core_control_v1
             SET mode='GENERAL',policy_epoch=2,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1
             AND marker='ENTRY614_EMPLOYEE_CORE_V1'
             AND mode='READONLY'
             AND policy_epoch=1;
          SELECT changes() AS changed;
          SELECT singleton,marker,mode,policy_epoch AS policyEpoch,data_version AS dataVersion
            FROM employee_core_control_v1 WHERE singleton=1;" >/tmp/core-general.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/core-general.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.marker||Object.prototype.hasOwnProperty.call(v,'changed'))rows.push(v);Object.values(v).forEach(walk)}};walk(x);
          const ch=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'changed')),c=rows.find(r=>r.marker==='ENTRY614_EMPLOYEE_CORE_V1');
          if(Number(ch?.changed||0)!==1) throw new Error('Core mutation count');
          if(!c||c.mode!=='GENERAL'||Number(c.policyEpoch||0)!==2) throw new Error('Core GENERAL target not reached');
          console.log('ENTRY644_CORE_CONTROL=GENERAL_EPOCH_2');
          NODE

      - name: GENERAL write-policy no-business-mutation probe
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/write-probe.json --write-out '%{http_code}'             -X POST -H 'content-type: application/json'             --data '{"action":"updateLine","lineId":"entry644-no-auth-probe","status":"طلب جديد"}'             "$API_URL/v1/employee/core")"
          test "$code" = "401"
          grep -Fq 'username and employee session token are required' /tmp/write-probe.json
          echo ENTRY644_GENERAL_WRITE_POLICY_REACHES_AUTH=PASS
          echo ENTRY644_GENERAL_PROBE_BUSINESS_WRITE=NO

      - name: Postflight
        shell: bash
        run: |
          set -euo pipefail
          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry644post=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='NATIVE'||a.nativeOnly!==true||Number(a.nativeReadyCount||0)!==6||a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false) throw new Error('auth post drift');
          if(b.enabled!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge post drift');
          if(co.mode!=='GENERAL'||Number(co.policyEpoch||0)!==2||co.schemaReady!==true||Number(co.googleBusinessCalls||0)!==0||co.appsScriptBusinessAuthority!==false) throw new Error('core post');
          if(ct.mode!=='READONLY'||cm.mode!=='READONLY') throw new Error('content/comms post');
          if(o.mode!=='GENERAL') throw new Error('ops post');
          if(ac.mode!=='READONLY'||ac.authoritativeWrites!==false||String(ac.writeAuthorityMode||'')!=='OFF'||Number(ac.googleBusinessCalls||0)!==0||ac.appsScriptBusinessAuthority!==false) throw new Error('accounting post safety');
          console.log('ENTRY644_CORE_RUNTIME_ARM=PASS');
          console.log('ENTRY644_FRONTEND_CUTOVER=NOT_YET');
          console.log('ENTRY644_BUSINESS_DATA_MUTATION=NO');
          NODE

      - name: Roll back Core control on failure
        if: ${{ failure() && steps.mutate.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --json --command "
          UPDATE employee_core_control_v1
             SET mode='READONLY',policy_epoch=1,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1
             AND marker='ENTRY614_EMPLOYEE_CORE_V1'
             AND mode='GENERAL'
             AND policy_epoch=2;
          SELECT mode,policy_epoch AS policyEpoch
            FROM employee_core_control_v1 WHERE singleton=1;" >/tmp/core-rollback.json
          echo ENTRY644_CORE_ROLLBACK_ATTEMPTED=YES

      - name: Boundary
        if: ${{ always() }}
        shell: bash
        run: |
          echo ENTRY644_API_CODE_DEPLOY=NO
          echo ENTRY644_FRONTEND_DEPLOY=NO
          echo ENTRY644_ACCOUNTING_MUTATION=NO
          echo ENTRY644_EASYSTORE_MUTATION=NO
