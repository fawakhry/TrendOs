name: TrendOS Production Cloud Write Schema Read-Only

# PERF-CF-02CC: direct SELECT-only inspection of the Production D1 schema.
# No DDL, DML, migration, Worker deploy, secret change, or business-data read.
on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-schema-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-production-cloud-write-schema-readonly
  cancel-in-progress: false

jobs:
  production-cloud-write-schema-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EXPECTED_DB_ID: b6784934-3144-4c8d-b688-5c601c62885f

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hard read-only safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq "^database_id = \"$EXPECTED_DB_ID\"$" cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          ! grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml

          workflow=.github/workflows/trendos-production-cloud-write-schema-readonly.yml
          if grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|CREATE|ALTER|DROP|VACUUM|ATTACH|DETACH|PRAGMA[[:space:]]+[^;=]+[=])\b' "$workflow"; then
            echo 'Blocked: workflow contains a mutating SQL keyword.'
            exit 1
          fi
          if grep -Eiq 'wrangler.*(deploy|migrations[[:space:]]+apply|secret[[:space:]]+(put|bulk))' "$workflow"; then
            echo 'Blocked: workflow contains deploy/migration/secret mutation.'
            exit 1
          fi
          echo 'PRODUCTION_SCHEMA_READONLY_BOUNDARY_PASS'

      - name: Live Worker boundary before D1 inspection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/cloud-write-health.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/cloud-write-health.json','utf8'));
          const pass=x.success===true && x.database===true && x.enabled===false && x.writesAccepted===false && x.authConfigured===true && x.schemaMutationFree===true && x.cutover===false && x.sheetsAuthoritative===true;
          console.log('PRE_D1_CLOUD_WRITE_HEALTH='+JSON.stringify({database:x.database,enabled:x.enabled,writesAccepted:x.writesAccepted,schemaReady:x.schemaReady,pendingOutbox:x.pendingOutbox,cutover:x.cutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Query Production D1 sqlite_master — SELECT only
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT type,name FROM sqlite_master WHERE (type='table' AND name IN ('customers','orders','cloud_write_events','cloud_write_outbox')) OR (type='index' AND name IN ('idx_cloud_write_events_entity','idx_cloud_write_events_sheets_status','idx_cloud_write_outbox_event_unique','idx_cloud_write_outbox_pending')) ORDER BY type,name"
          payload="$(node -e 'process.stdout.write(JSON.stringify({sql:process.argv[1]}))' "$SQL")"
          code="$(curl --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            --output /tmp/d1-schema.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$EXPECTED_DB_ID/query")"
          echo "D1_SCHEMA_QUERY_HTTP=$code"
          test "$code" = '200'
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1-schema.json','utf8'));
          if(x.success!==true) { console.error(JSON.stringify({success:x.success,errors:x.errors||[]})); process.exit(1); }
          const blocks=Array.isArray(x.result)?x.result:[];
          const rows=blocks.flatMap(b=>Array.isArray(b.results)?b.results:[]);
          const names=new Set(rows.map(r=>String(r.name||'')));
          const requiredTables=['cloud_write_events','cloud_write_outbox'];
          const requiredIndexes=['idx_cloud_write_events_entity','idx_cloud_write_events_sheets_status','idx_cloud_write_outbox_event_unique','idx_cloud_write_outbox_pending'];
          const coreTables=['customers','orders'];
          const summary={
            coreTables:Object.fromEntries(coreTables.map(n=>[n,names.has(n)])),
            cloudWriteTables:Object.fromEntries(requiredTables.map(n=>[n,names.has(n)])),
            cloudWriteIndexes:Object.fromEntries(requiredIndexes.map(n=>[n,names.has(n)])),
            schemaReady:requiredTables.every(n=>names.has(n)),
            fullMigrationShapeReady:requiredTables.concat(requiredIndexes).every(n=>names.has(n))
          };
          console.log('PRODUCTION_D1_CLOUD_WRITE_SCHEMA='+JSON.stringify(summary));
          if(!coreTables.every(n=>names.has(n))) process.exit(1);
          fs.writeFileSync('/tmp/schema-summary.json',JSON.stringify(summary));
          NODE

      - name: Recheck live Worker boundary after D1 SELECT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/cloud-write-health-after.json
          node <<'NODE'
          const before=JSON.parse(require('fs').readFileSync('/tmp/cloud-write-health.json','utf8'));
          const after=JSON.parse(require('fs').readFileSync('/tmp/cloud-write-health-after.json','utf8'));
          const pass=after.success===true && after.database===true && after.enabled===false && after.writesAccepted===false && after.schemaMutationFree===true && after.cutover===false && after.sheetsAuthoritative===true && before.schemaReady===after.schemaReady && before.pendingOutbox===after.pendingOutbox;
          console.log('POST_D1_CLOUD_WRITE_HEALTH='+JSON.stringify({enabled:after.enabled,writesAccepted:after.writesAccepted,schemaReady:after.schemaReady,pendingOutbox:after.pendingOutbox,cutover:after.cutover,sheetsAuthoritative:after.sheetsAuthoritative,unchanged:pass}));
          if(!pass) process.exit(1);
          NODE

      - name: Read-only conclusion
        run: |
          echo 'PERF_CF_02CC_PRODUCTION_D1_SCHEMA_READONLY_PROBE_PASS'
          cat /tmp/schema-summary.json
          echo
          echo 'No DDL/DML, migration, deploy, secret change, business-row read, or cutover was performed.'
