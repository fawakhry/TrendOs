name: TrendOS T12 TEST Mirror 142 D1-Compatible Retry Once

on:
  push:
    branches:
      - cloud-migration-v3-t12-order-create-ci-20260919
    paths:
      - 'docs/trendos/staging/RUN_T12_TEST_MIRROR_142_D1COMPAT_RETRY_ONCE_20260926.trigger'

permissions:
  contents: read

concurrency:
  group: trendos-t12-test-mirror-142-d1compat-retry-once
  cancel-in-progress: false

jobs:
  retry142Once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DB_UUID: 54a3c05e-cde9-4979-814f-d40f941edcd5
      TEST_DB_NAME: trendos-t12-synthetic-test
      PROD_DB_UUID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact isolated sources and local contracts
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$TEST_DB_UUID" != "$PROD_DB_UUID"
          test "$(git hash-object cloudflare-d1/t12-preview/t12-existing-test-mirror-142-remote-dev-worker-20260926.mjs)" = "314ac2c0b47debced9a29a80275e4e7694a8c429"
          test "$(git hash-object cloudflare-d1/t12-preview/t12-d1-142-chunked-preimage-guard-isolated-v1.mjs)" = "ca0a28aca901466094a748c0e59b681328f7808c"
          test "$(git hash-object tests/t12_existing_test_mirror_142_remote_dev_worker_v1.test.mjs)" = "590bcd1d26677e7c34b22854fe1f48c566c83225"
          test "$(git hash-object tests/t12_d1_142_chunked_preimage_large_isolated_v1.test.mjs)" = "ff0a30f16dc1c0e68ad64727fff435f23e53c404"
          node --experimental-sqlite tests/t12_d1_142_chunked_preimage_large_isolated_v1.test.mjs
          node --experimental-sqlite tests/t12_existing_test_mirror_142_remote_dev_worker_v1.test.mjs

      - name: Verify exact remote TEST D1 identity read-only
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_UUID"             > /tmp/test-db.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/test-db.json','utf8'));if(x.success!==true||x.result?.name!==process.env.TEST_DB_NAME||String(x.result.uuid||x.result.id||process.env.TEST_DB_UUID)!==process.env.TEST_DB_UUID)process.exit(1);console.log('TEST_D1_IDENTITY_READ_ONLY_PASS name='+x.result.name)"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.141.0

      - name: Execute exactly one TEST-only 142 POST from exact LARGE_BASELINE
        run: |
          set -euo pipefail
          cat > cloudflare-d1/t12-preview/.t12-142-d1compat-retry-once.toml <<EOF
          name = "trendos-t12-mirror-142-d1compat-retry-once"
          main = "./t12-existing-test-mirror-142-remote-dev-worker-20260926.mjs"
          compatibility_date = "2026-09-26"

          [[d1_databases]]
          binding = "T12_SYNTHETIC_DB"
          database_name = "$TEST_DB_NAME"
          database_id = "$TEST_DB_UUID"
          remote = true
          EOF

          ! grep -q 'trendos-main' cloudflare-d1/t12-preview/.t12-142-d1compat-retry-once.toml
          ! grep -q "$PROD_DB_UUID" cloudflare-d1/t12-preview/.t12-142-d1compat-retry-once.toml

          CI=1 npx wrangler dev             --config cloudflare-d1/t12-preview/.t12-142-d1compat-retry-once.toml             --ip 127.0.0.1 --port 8787 >/tmp/t12-142-retry-once-wrangler.log 2>&1 &
          PID=$!
          cleanup(){
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
            rm -f cloudflare-d1/t12-preview/.t12-142-d1compat-retry-once.toml
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl --silent --show-error --max-time 15               http://127.0.0.1:8787/__t12/local/142-qualification               -o /tmp/preflight.json; then
              if node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/preflight.json','utf8'));const s=x.state;if(x.success===true&&s?.state==='LARGE_BASELINE'&&s.catalogRows===2&&s.mirrorRows===1360&&s.migrationRows===0&&s.controlMatches===1&&s.tabs?.length===2&&s.tabs.every((t,i)=>t.baseCatalog===1&&t.targetCatalog===0&&t.rows===[652,708][i]&&t.headerOk===1&&t.oldChanged===11&&t.newChanged===0&&t.tailRows===0))process.exit(0);process.exit(1)"; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "PRECHECK_NOT_EXACT_LARGE_BASELINE"
            tail -100 /tmp/t12-142-retry-once-wrangler.log || true
            exit 1
          fi

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/preflight.json','utf8'));console.log('T142_RETRY_PRE='+JSON.stringify(x.state))"

          set +e
          post_code="$(curl --silent --show-error --max-time 120             --output /tmp/post.json --write-out '%{http_code}'             -H 'content-type: application/json'             --data '{"action":"positive","confirmation":"RUN_142_POSITIVE_ON_EXISTING_TEST_ONLY"}'             http://127.0.0.1:8787/__t12/local/142-qualification)"
          post_rc=$?
          set -e
          echo "T142_RETRY_POST_ATTEMPTED=1 CURL_RC=$post_rc HTTP=$post_code"

          # NO RETRY. Reconcile outcome by GET only.
          curl --fail --silent --show-error --max-time 30             http://127.0.0.1:8787/__t12/local/142-qualification             -o /tmp/postflight.json

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/postflight.json','utf8'));console.log('T142_RETRY_POSTFLIGHT='+JSON.stringify(x.state));const s=x.state;if(!x.success||s?.state!=='LARGE_TARGET'||s.catalogRows!==2||s.mirrorRows!==1480||s.migrationRows!==0||s.controlMatches!==1||s.tabs?.length!==2||!s.tabs.every((t,i)=>t.baseCatalog===0&&t.targetCatalog===1&&t.rows===[712,768][i]&&t.headerOk===1&&t.oldChanged===0&&t.newChanged===11&&t.tailRows===60))process.exit(1)"

          echo "REAL_TEST_142_D1COMPAT_RETRY_DATA_PASS=1"
          if [ -s /tmp/post.json ]; then
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'));console.log('POST_RESPONSE_SUMMARY='+JSON.stringify({success:x.success,code:x.code,productionAuthorized:x.productionAuthorized,plan:x.publicPlan?{candidateUpserts:x.publicPlan.candidateUpserts,statements:x.publicPlan.statements,guardChunkCounts:x.publicPlan.guardChunkCounts,guardBindCounts:x.publicPlan.guardBindCounts}:null,afterState:x.after?.state}))"
          fi

      - name: Record scope
        if: ${{ always() }}
        run: |
          {
            echo '### TrendOS T12 142 D1-compatible single retry'
            echo '- Maximum one POST to existing isolated TEST D1.'
            echo '- No POST retry under any response condition.'
            echo '- Fresh exact LARGE_BASELINE required before POST.'
            echo '- Outcome reconciled by independent GET only.'
            echo '- No Worker deploy and no production database binding.'
          } >> "$GITHUB_STEP_SUMMARY"
