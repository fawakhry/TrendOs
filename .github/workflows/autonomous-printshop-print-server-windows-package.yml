name: Autonomous Printshop Print Server Windows Package

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/print-server/**'
      - '.github/workflows/autonomous-printshop-print-server-windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: autonomous-printshop/print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'
          cache-dependency-path: autonomous-printshop/print-server/requirements.txt
      - name: Install runtime and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==5.13.2
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name "TrendOS-Print-Server" --add-data "public;public" --collect-all PIL --collect-all ezdxf --collect-all certifi --collect-all requests --collect-all urllib3 run.py
          $app = Join-Path $PWD "dist\TrendOS-Print-Server"
          New-Item -ItemType Directory -Force -Path (Join-Path $app "config") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app "data\orders") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app "data\ready") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app "data\state") | Out-Null
          Copy-Item "config\default.json" (Join-Path $app "config\local.json") -Force
          $bat = '@echo off' + [Environment]::NewLine + 'cd /d "%~dp0"' + [Environment]::NewLine + 'start "" "TrendOS-Print-Server.exe"' + [Environment]::NewLine
          Set-Content -Encoding ascii -Path (Join-Path $app "Start-Print-Server.bat") -Value $bat
          $clean = '@echo off' + [Environment]::NewLine + 'taskkill /IM TrendOS-Print-Server.exe /F >nul 2>&1' + [Environment]::NewLine + 'timeout /t 1 /nobreak >nul' + [Environment]::NewLine + 'cd /d "%~dp0"' + [Environment]::NewLine + 'start "" "TrendOS-Print-Server.exe"' + [Environment]::NewLine
          Set-Content -Encoding ascii -Path (Join-Path $app "Start-Clean.bat") -Value $clean
          $readme = "TrendOS Print Server - Windows Portable`r`n`r`n1) Double-click TrendOS-Print-Server.exe (or Start-Print-Server.bat).`r`n2) The Arabic interface opens automatically at http://127.0.0.1:4782`r`n3) Settings are editable in config\local.json.`r`n4) Default data folders are under data\orders, data\ready, data\state.`r`n5) JPG/JPEG/PNG/WEBP/BMP/GIF/TIF/TIFF/DXF preview engines are bundled.`r`n6) TrendOS live claim integration remains fail-closed until the exact qualified claim event is wired.`r`n7) Closing the server window stops the local server.`r`n"
          Set-Content -Encoding utf8 -Path (Join-Path $app "README-WINDOWS.txt") -Value $readme
      - name: Smoke packaged EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\TrendOS-Print-Server\TrendOS-Print-Server.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $s = Invoke-RestMethod -Uri "http://127.0.0.1:4782/api/status" -TimeoutSec 2
                if ($s.ok -eq $true -and $s.preview.tiff -eq $true -and $s.preview.dxf -eq $true) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "PACKAGED_EXE_SMOKE_FAILED" }
            Write-Host "WINDOWS_PORTABLE_SMOKE=PASS"
            $probe = $null
            for ($i = 0; $i -lt 3; $i++) {
              try {
                $probe = Invoke-RestMethod -Uri "http://127.0.0.1:4782/api/trendos/probe" -TimeoutSec 15
                if ($probe.ok -eq $true -and $probe.probe.schemaReady -eq $true) { break }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $probe -or $probe.ok -ne $true -or $probe.probe.schemaReady -ne $true) {
              throw "PACKAGED_LIVE_TRENDOS_PROBE_FAILED"
            }
            Write-Host "WINDOWS_PACKAGED_LIVE_TRENDOS_PROBE=PASS"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $src = Join-Path $PWD "dist\TrendOS-Print-Server"
          $zip = Join-Path $PWD "TrendOS-Print-Server-Windows-Portable.zip"
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: TrendOS-Print-Server-Windows-Portable
          path: autonomous-printshop/print-server/TrendOS-Print-Server-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
