name: AP082 Dashboard panel provenance controlled release
on:
  push:
    branches: [audit/t12-customer-lane-runtime-20261008]
    paths:
      - scripts/ap082_dashboard_controlled_release.py
      - .github/workflows/ap082-dashboard-controlled-release.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the qualified read-only AP082 Dashboard only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: autonomous-printshop-dashboard-production-deploy
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/ap082-tools --no-save wrangler@4.33.2
      - name: Qualify exact runtime or execute bounded Dashboard release
        env:
          AP_WRANGLER_BIN: /tmp/ap082-tools/node_modules/.bin/wrangler
          DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        run: |
          if [ "$DEPLOY" = true ]; then
            python3 scripts/ap082_dashboard_controlled_release.py --deploy
          else
            python3 scripts/ap082_dashboard_controlled_release.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ap082-sanitized-evidence
          path: /tmp/ap082-sanitized-report.json
          retention-days: 3
