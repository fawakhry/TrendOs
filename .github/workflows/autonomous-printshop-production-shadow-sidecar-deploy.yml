name: Autonomous Printshop Production Shadow Sidecar Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/production-shadow/**'
      - 'autonomous-printshop/core/operational-reality-v1.mjs'
      - 'autonomous-printshop/core/deadline-risk-projection-v1.mjs'
      - 'autonomous-printshop/core/comms-pending-projection-v1.mjs'
      - 'autonomous-printshop/core/finance-warning-projection-v1.mjs'
      - 'autonomous-printshop/core/employee-supervisor-shadow-v1.mjs'
      - 'autonomous-printshop/core/employee-blocker-events-v1.mjs'
      - 'autonomous-printshop/tests/employee_supervisor_shadow_v1.test.mjs'
      - 'autonomous-printshop/tests/employee_blocker_events_v1.test.mjs'
      - 'autonomous-printshop/tests/production_shadow_worker_v1.test.mjs'
      - 'autonomous-printshop/tests/deadline_risk_projection_v1.test.mjs'
      - 'autonomous-printshop/tests/comms_pending_projection_v1.test.mjs'
      - 'autonomous-printshop/tests/finance_warning_projection_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-production-shadow-sidecar-deploy.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-production-shadow-sidecar
  cancel-in-progress: false

jobs:
  deploy-readonly-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      SHADOW_URL: https://autonomous-printshop-shadow.trendmall-contact.workers.dev
      TRENDOS_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Eq '^name = "autonomous-printshop-shadow"$' "$CONFIG"
          grep -Eq '^main = "worker\.mjs"$' "$CONFIG"
          grep -Eq '^database_name = "trendos-main"$' "$CONFIG"
          grep -Eq '^database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"$' "$CONFIG"

          worker='autonomous-printshop/production-shadow/worker.mjs'
          ! grep -Eiq "\\bINSERT[[:space:]]+INTO\\b|\\bDELETE[[:space:]]+FROM\\b|\\bREPLACE[[:space:]]+INTO\\b|\\bCREATE[[:space:]]+TABLE\\b|\\bDROP[[:space:]]+TABLE\\b|\\bALTER[[:space:]]+TABLE\\b" "$worker"
          ! grep -Eq '\.run[[:space:]]*\(|\.batch[[:space:]]*\(' "$worker"

          workflow='.github/workflows/autonomous-printshop-production-shadow-sidecar-deploy.yml'
          ! grep -Eq 'd1[[:space:]]+migrations[[:space:]]+apply|secret[[:space:]]+(put|bulk)' "$workflow"

          echo 'ISOLATED_WORKER=YES'
          echo 'D1_WRITE_CODE=NO'
          echo 'MIGRATION=NO'
          echo 'SECRET_CHANGE=NO'

      - name: Run shadow contracts
        run: |
          set -euo pipefail
          node autonomous-printshop/tests/operational_reality_v1.test.mjs
          node autonomous-printshop/tests/deadline_risk_projection_v1.test.mjs
          node autonomous-printshop/tests/comms_pending_projection_v1.test.mjs
          node autonomous-printshop/tests/finance_warning_projection_v1.test.mjs
          node autonomous-printshop/tests/employee_supervisor_shadow_v1.test.mjs
          node autonomous-printshop/tests/employee_blocker_events_v1.test.mjs
          node autonomous-printshop/tests/production_shadow_worker_v1.test.mjs
          node --check autonomous-printshop/production-shadow/worker.mjs

      - name: Main TrendOS production baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/trendos-pre.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/trendos-pre.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_PREDEPLOY_PASS');
          NODE

      - name: Wrangler dry-run isolated shadow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autonomous-printshop-shadow-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config "$CONFIG" --outdir /tmp/autonomous-printshop-shadow-build
          test -d /tmp/autonomous-printshop-shadow-build
          echo 'SHADOW_DRYRUN_PASS'

      - name: Deploy isolated production shadow
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config "$CONFIG"
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5
          echo 'AUTONOMOUS_PRINTSHOP_SHADOW_DEPLOYED'

      - name: Verify shadow health and real production snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$SHADOW_URL/health" > /tmp/shadow-health.json
          snapshot_code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/shadow-snapshot.json --write-out '%{http_code}' "$SHADOW_URL/snapshot")"
          export SNAPSHOT_CODE="$snapshot_code"
          cat /tmp/shadow-health.json
          echo
          cat /tmp/shadow-snapshot.json
          echo

          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/shadow-health.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/shadow-snapshot.json','utf8'));
          const code=process.env.SNAPSHOT_CODE;
          if(h.success!==true||h.database!==true||h.mode!=='PRODUCTION_SHADOW_READ_ONLY') process.exit(1);
          if(h.writesAccepted!==false||h.d1Mutation!==false||h.employeeAssignment!==false||h.piiExposed!==false) process.exit(2);
          if(code!=='200'||s.success!==true||s.mode!=='PRODUCTION_SHADOW_READ_ONLY') process.exit(3);
          if(s.writesAccepted!==false||s.d1Mutation!==false||s.employeeAssignment!==false) process.exit(4);
          if(s.piiExposed!==false||s.rawOrderIdsExposed!==false||s.rawLineIdsExposed!==false) process.exit(5);
          if(!s.source||s.source.authority!=='trendos-main-d1') process.exit(6);
          console.log('PRODUCTION_SHADOW_LIVE_SNAPSHOT_PASS');
          console.log('SHADOW_COUNTS='+JSON.stringify(s.counts||{}));
          console.log('SHADOW_RECOMMENDATION='+JSON.stringify(s.recommendation||{}));
          NODE

      - name: Verify employee supervisor shadow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$SHADOW_URL/supervisor" > /tmp/supervisor.json
          cat /tmp/supervisor.json
          echo
          node - <<'NODE'
          const s=JSON.parse(require('fs').readFileSync('/tmp/supervisor.json','utf8'));
          if(s.success!==true||s.mode!=='EMPLOYEE_SUPERVISOR_SHADOW') process.exit(1);
          if(s.routingMode!=='LEGACY_ASSIGNMENT_BASELINE_ONLY') process.exit(2);
          if(s.writesAccepted!==false||s.d1Mutation!==false||s.employeeAssignment!==false) process.exit(3);
          if(s.piiExposed!==false||s.employeeIdentityExposed!==false||s.rawOrderIdsExposed!==false||s.rawLineIdsExposed!==false) process.exit(4);
          if(!s.operatorTaskControl||!['OFF','SHADOW','CANARY','GENERAL'].includes(String(s.operatorTaskControl.mode||''))) process.exit(5);
          console.log('EMPLOYEE_SUPERVISOR_SHADOW_LIVE=PASS');
          console.log('SUPERVISOR_OPERATOR_COUNTS='+JSON.stringify(s.operatorCounts||{}));
          console.log('SUPERVISOR_ASSIGNMENT_COVERAGE='+JSON.stringify(s.assignmentCoverage||{}));
          console.log('SUPERVISOR_DEPARTMENTS='+JSON.stringify(s.departments||{}));
          NODE

      - name: Verify Control Tower Comms pending aggregate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$SHADOW_URL/control-tower" > /tmp/control-tower.json
          node - <<'NODE'
          const c=JSON.parse(require('fs').readFileSync('/tmp/control-tower.json','utf8'));
          const p=c.communications&&c.communications.pending;
          const s=p&&p.summary;
          if(c.success!==true||c.mode!=='CONTROL_TOWER_SHADOW') process.exit(1);
          if(!p||p.success!==true||p.mode!=='COMMS_PENDING_READ_ONLY') process.exit(2);
          if(!s||s.mode!=='READ_ONLY_AGGREGATE'||!s.control||s.control.mode!=='READONLY') process.exit(3);
          if(Number(s.control.policyEpoch||0)<1) process.exit(4);
          if(s.sendAuthority!==false||p.writesAccepted!==false||p.sendAuthority!==false||p.d1Mutation!==false) process.exit(5);
          if(s.rawPhoneExposed!==false||s.customerIdentityExposed!==false||s.rawOrderIdsExposed!==false||s.messageTextExposed!==false||s.employeeIdentityExposed!==false) process.exit(6);
          const sig=c.attentionSignals||{};
          for(const k of ['commsPendingSignals','commsWaitingReply','commsManagerEscalations','commsFeedbackPending','commsFeedbackFollowupRequired','commsFeedbackDormantBacklog']){
            if(!Number.isFinite(Number(sig[k]))) process.exit(7);
          }
          if(Number(s.control.feedbackEnabledAtMs||0)===0){
            if(s.control.feedbackOperational!==false) process.exit(8);
            if(Number(s.counts.feedbackSendPending||0)!==0||Number(s.counts.feedbackFollowupRequired||0)!==0) process.exit(9);
            if(Number(s.counts.totalPendingSignals||0)!==Number(s.counts.attentionConversations||0)) process.exit(10);
          }
          console.log('CONTROL_TOWER_COMMS_PENDING=PASS');
          console.log('COMMS_CONTROL_MODE='+String(s.control.mode));
          console.log('COMMS_POLICY_EPOCH='+String(s.control.policyEpoch));
          console.log('COMMS_PENDING_COUNTS='+JSON.stringify(s.counts||{}));
          console.log('COMMS_FEEDBACK_OPERATIONAL='+String(s.control.feedbackOperational===true));
          console.log('COMMS_FEEDBACK_DORMANT_BACKLOG='+String(Number(s.counts.feedbackDormantBacklog||0)));
          console.log('COMMS_SEND_AUTHORITY=NO');
          console.log('COMMS_PII_EXPOSED=NO');
          NODE

      - name: Verify Control Tower finance warning aggregate
        shell: bash
        run: |
          set -euo pipefail
          FINANCE_READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --retry 2 --retry-delay 1 --retry-all-errors "$SHADOW_URL/control-tower?financeVerify=$GITHUB_SHA-$attempt-$(date +%s%N)" > /tmp/control-tower-finance.json; then
              if node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/control-tower-finance.json','utf8'));const p=c.finance&&c.finance.warnings;process.exit(c.success===true&&c.mode==='CONTROL_TOWER_SHADOW'&&p&&p.success===true&&p.mode==='FINANCE_WARNING_READ_ONLY'?0:1)"; then
                FINANCE_READY=1
                echo "FINANCE_PROPAGATION_ATTEMPT=$attempt"
                break
              fi
            fi
            sleep 2
          done
          test "$FINANCE_READY" = "1"
          node - <<'NODE'
          const c=JSON.parse(require('fs').readFileSync('/tmp/control-tower-finance.json','utf8'));
          const p=c.finance&&c.finance.warnings;
          const s=p&&p.summary;
          if(c.success!==true||c.mode!=='CONTROL_TOWER_SHADOW') process.exit(1);
          if(!p||p.success!==true||p.mode!=='FINANCE_WARNING_READ_ONLY') process.exit(2);
          if(!s||s.mode!=='READ_ONLY_AGGREGATE'||!s.control||!['READONLY','CANARY'].includes(String(s.control.mode||''))) process.exit(3);
          if(s.control.readModeSafe!==true) process.exit(4);
          if(p.writesAccepted!==false||p.accountingWrite!==false||p.debtRestrictionWrite!==false||p.dayCloseWrite!==false||p.d1Mutation!==false) process.exit(5);
          if(s.accountingWrite!==false||s.debtRestrictionWrite!==false||s.dayCloseWrite!==false) process.exit(6);
          if(s.customerPiiExposed!==false||s.partyIdentityExposed!==false||s.rawOrderIdsExposed!==false||s.rawInvoiceIdsExposed!==false||s.employeeIdentityExposed!==false) process.exit(7);
          if(!s.source||s.source.absenceQualified!==false||s.dayClose.ready!==false) process.exit(8);
          if(s.source.sourceDataPresent!==true){
            if(s.source.positiveSignalsQualified!==false) process.exit(9);
            if(Number(s.debt.customerParties||0)!==0||Number(s.debt.customerAmount||0)!==0||Number(s.dayClose.blockers||0)!==0) process.exit(10);
            if(String(s.dayClose.state)!=='UNKNOWN_SOURCE_COMPLETENESS') process.exit(11);
          }
          const sig=c.attentionSignals||{};
          for(const k of ['customerDebtParties','customerDebtAmount','supplierPayableParties','supplierPayableAmount','dayCloseBlockers','dayCloseIntegrityFailures']){
            if(!Number.isFinite(Number(sig[k]))) process.exit(12);
          }
          console.log('CONTROL_TOWER_FINANCE_WARNINGS=PASS');
          console.log('FINANCE_ACCOUNTING_MODE='+String(s.control.mode));
          console.log('FINANCE_ACCOUNTING_EPOCH='+String(s.control.policyEpoch));
          console.log('FINANCE_SOURCE_DATA_PRESENT='+String(s.source.sourceDataPresent===true));
          console.log('FINANCE_SOURCE_REASON='+String(s.source.reason||''));
          console.log('FINANCE_SOURCE_BUSINESS_ROWS='+String(Number(s.source.sourceBusinessRows||0)));
          console.log('FINANCE_CANARY_ROWS_EXCLUDED='+String(Number(s.source.canaryRowsExcluded||0)));
          console.log('FINANCE_DEBT='+JSON.stringify(s.debt||{}));
          console.log('FINANCE_DAY_CLOSE='+JSON.stringify(s.dayClose||{}));
          console.log('FINANCE_ACCOUNTING_WRITE=NO');
          console.log('FINANCE_DEBT_RESTRICTION_WRITE=NO');
          console.log('FINANCE_DAY_CLOSE_WRITE=NO');
          console.log('FINANCE_PII_EXPOSED=NO');
          NODE

      - name: Verify main TrendOS remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRENDOS_URL/v1/edge/health" > /tmp/trendos-post.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/trendos-post.json','utf8'));
          if(x.success!==true||x.database!==true||x.cutover!==false) process.exit(1);
          console.log('MAIN_TRENDOS_POSTDEPLOY_PASS');
          NODE

      - name: Preserve fail-closed isolated worker on verification failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        shell: bash
        run: |
          echo 'Shadow verification failed.'
          echo 'The isolated worker remains deployed in fail-closed/read-only mode.'
          echo 'No main TrendOS worker rollback is required because it was never changed.'
          echo 'AUTO_DELETE_SKIPPED=YES'

      - name: Safety conclusion
        if: ${{ success() }}
        run: |
          echo 'AUTONOMOUS_PRINTSHOP_PRODUCTION_SHADOW=LIVE'
          echo 'AUTHORITY=READ_ONLY_D1'
          echo 'MAIN_TRENDOS_WORKER_CHANGED=NO'
          echo 'D1_MUTATION=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
