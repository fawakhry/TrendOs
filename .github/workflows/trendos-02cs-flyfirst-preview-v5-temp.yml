name: TrendOS 02CS Fly First Preview V5 TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-flyfirst-preview-v5-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-flyfirst-preview-v5
  cancel-in-progress: false

jobs:
  preview-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PREVIEW_URL: https://cs-flyfirst-trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - name: Zero-traffic and frontend-off static gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          grep -Fq 'export function sortOperationalRows(rows, screen)' cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          grep -Fq "lane === 'print'" cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-flyfirst-preview-v5-temp.yml').read_text(encoding='utf-8').splitlines()
          cmds=[x.strip() for x in lines if x.strip().startswith('npx --yes wrangler@')]
          if len(cmds) != 1 or ' versions upload ' not in cmds[0]:
              raise SystemExit('Expected exactly one zero-traffic versions upload command')
          forbidden=[' versions deploy ',' rollback ',' secret ',' d1 execute ',' d1 migrations ',' deploy --config']
          if any(x in cmds[0] for x in forbidden):
              raise SystemExit('Production traffic/data mutation command forbidden')
          print('PERF_CF_02CS_FLYFIRST_V5_STATIC_PASS')
          PY

      - name: Focused 02CS regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          node tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs
          echo 'PERF_CF_02CS_FLYFIRST_V5_FOCUSED_CI_PASS'

      - name: Production boundary before preview upload GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false);
            assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_FLYFIRST_V5_PRE_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Upload Worker version only — zero production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions upload --config cloudflare-d1/wrangler.toml --preview-alias cs-flyfirst --message "TrendOS 02CS fly-first operational ordering preview V5"
          echo 'PERF_CF_02CS_FLYFIRST_V5_UPLOAD_DONE_ZERO_TRAFFIC'
          sleep 8

      - name: Preview session, identity parity, field contract, and business ordering
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PREVIEW_URL, apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(), employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const critical=['rowNumber','orderId','orderCode','lineId','customer','customerPhone','customerSource','source','externalCustomerId','customerMode','department','itemName','qty','assignedTo','priority','status','ready','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','updatedAt','notes','customerNotified','notifiedAt','notifiedBy','lastWhatsAppMessage','lastWhatsAppAt','lastWhatsAppBy','receivedAt','expectedDeliveryAt','expectedDeliveryText','overdue','registrationSent'];
          function text(v){return String(v==null?'':v).trim();}
          function key(r){return [text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');}
          function fly(v){v=text(v).toLowerCase();return ['نعم','true','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير'].includes(v);}
          function prio(v){v=text(v)||'عادي';if(v==='عاجل'||v==='VIP')return 0;if(v==='عادي')return 1;if(v==='مؤجل')return 2;return 9;}
          function tier(row,screen){if(screen==='print'&&fly(row.flyPrint||row.quickPrint))return 0;return (screen==='print'?1:0)+prio(row.priority);}
          function assertOrdering(rows,screen){let prev=-Infinity;for(const row of rows){const t=tier(row,screen);assert.ok(t>=prev,screen+' operational tier regression');prev=t;}}
          async function readJson(label,url,opt={},attempts=5){let last;for(let i=1;i<=attempts;i++){try{const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let body;try{body=JSON.parse(raw||'{}')}catch{throw new Error(label+' invalid JSON http='+r.status)}return{status:r.status,body};}catch(e){last=e;if(i<attempts)await sleep(2500*i)}}throw last;}
          async function newSession(){for(let i=1;i<=5;i++){const x=await readJson('session',edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})},1);if(x.status===200&&x.body.success&&x.body.edgeToken)return x.body.edgeToken;if(i<5)await sleep(3000*i)}throw new Error('preview session not ready');}
          async function edgeRows(screen,bearer){const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});const x=await readJson('edge-'+screen,edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');return x.body;}
          async function appRows(screen){const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};const x=await readJson('apps-'+screen,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body;}
          (async()=>{
            for(let i=0;i<3;i++) await newSession();
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const bearer=await newSession(),summary=[];
                for(const screen of ['print','laser']){
                  const e=await edgeRows(screen,bearer), a=await appRows(screen);
                  const edgeKeys=(e.rows||[]).map(key), appKeys=(a.rows||[]).map(key);
                  assert.deepEqual([...edgeKeys].sort(),[...appKeys].sort(),screen+' identity set mismatch');
                  assert.equal(Number(e.pagination&&e.pagination.totalRows||0),edgeKeys.length);
                  assert.equal(Number(a.pagination&&a.pagination.totalRows||appKeys.length),appKeys.length);
                  assertOrdering(e.rows||[],screen);
                  for(const row of e.rows||[]) for(const k of critical) assert.ok(Object.prototype.hasOwnProperty.call(row,k),screen+' missing field '+k);
                  for(const m of e.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
                  summary.push({screen,totalRows:edgeKeys.length,ordered:true,fieldContract:critical.length});
                }
                const p=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});
                const debt=await readJson('debt',edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
                assert.equal(debt.status,409);assert.equal(debt.body.code,'apps-script-required');assert.equal(debt.body.fallback,'apps-script');
                console.log('PERF_CF_02CS_FLYFIRST_V5_PREVIEW_PASS='+JSON.stringify({attempt,summary,debtFallback:true}));
                return;
              }catch(e){last=e;if(attempt<3)await sleep(5000*attempt);}
            }
            throw last;
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Production boundary after preview canary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');const cloud=await get('/v1/cloud/write/health');const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            assert.equal(edge.status,200);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(cloud.body.cutover,false);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);
            console.log('PERF_CF_02CS_FLYFIRST_V5_POST_BOUNDARY_PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Safety conclusion
        run: echo 'PERF_CF_02CS_FLYFIRST_V5_PASS_ZERO_PRODUCTION_TRAFFIC'
