name: TrendOS Cloud Migration V3 T6C Orders Read Diagnostic

on:
  push:
    branches:
      - cloud-migration-v3-t6c-orders-read-qualification-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t6c-orders-read-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-cloud-migration-v3-t6c-orders-read-qualification
  cancel-in-progress: false

jobs:
  diagnose-orders-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T6B_BASE_COMMIT: e9cabf9d2c3f7a494464a12d6bec50fa71c7acf2
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      APPS_SCRIPT_API_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: T6C exact read-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"
          git fetch --no-tags --depth=1 origin "$T6B_BASE_COMMIT"
          git diff --name-only "$T6B_BASE_COMMIT" HEAD | sort > /tmp/t6c-files.txt
          printf '%s\n' '.github/workflows/cloud-migration-v3-t6c-orders-read-qualification.yml' > /tmp/t6c-allowed.txt
          diff -u /tmp/t6c-allowed.txt /tmp/t6c-files.txt
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:config.js | grep -Eq '^window\.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false;'
          git diff --exit-code "$T6B_BASE_COMMIT" HEAD -- config.js cloudflare-d1/src/index_v2.js cloudflare-d1/wrangler.toml
          echo 'T6C_SCOPE_GATE=PASS'
          echo 'PRODUCTION_MAIN_FRONTEND_EDGE_ORDERS_READ_ENABLED=NO'
          echo 'PRODUCTION_DEPLOYMENT=NO'
          echo 'BUSINESS_DATA_MUTATION=NO'

      - name: Production safety baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/edge/health" > /tmp/t6c-edge-health.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$PROD_URL/v1/cloud/write/health" > /tmp/t6c-write-health.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/t6c-edge-health.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/t6c-write-health.json','utf8'));
          if(!e.success||e.cutover!==false||!e.database||!e.authConfigured||!e.upstreamConfigured) process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('T6C_PRODUCTION_BASELINE=PASS');
          NODE

      - name: Diagnose Apps Script versus D1 Orders identity and filter parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const apps=String(process.env.APPS_SCRIPT_API_URL||'').trim();
          const edge=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          const hash=v=>crypto.createHash('sha256').update(text(v)).digest('hex').slice(0,12);
          const key=r=>`${text(r&&r.orderId)}|${text(r&&r.lineId)}`;
          const hkey=r=>hash(key(r));
          const pattern=v=>{const s=text(v);if(!s)return 'empty';if(/^\d+$/.test(s))return 'numeric';if(/^\d+-\d+$/.test(s))return 'dash-numeric';if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s))return 'date-like';return 'other';};
          const summarizeField=(rows,name)=>{
            const vals=rows.map(r=>text(r&&r[name]));
            const p={}; for(const v of vals)p[pattern(v)]=(p[pattern(v)]||0)+1;
            const lens=vals.map(v=>v.length);
            return {distinct:new Set(vals).size,patterns:p,minLen:lens.length?Math.min(...lens):0,maxLen:lens.length?Math.max(...lens):0};
          };
          const sortedObj=o=>Object.fromEntries(Object.entries(o||{}).sort(([a],[b])=>a.localeCompare(b,'ar')));
          async function jsonFetch(url,options){
            const started=Date.now();
            const r=await fetch(url,{cache:'no-store',redirect:'follow',...options});
            const ms=Date.now()-started;
            const raw=await r.text(); let body={}; try{body=JSON.parse(raw||'{}')}catch{}
            return {status:r.status,ms,body};
          }
          (async()=>{
            const login=await jsonFetch(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});
            const token=text(login.body&&login.body.user&&login.body.user.token);
            if(login.status!==200||login.body.success!==true||!token) throw new Error(`login failed status=${login.status}`);
            console.log('::add-mask::'+token);
            const session=await jsonFetch(edge+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token})});
            const edgeToken=text(session.body&&session.body.edgeToken);
            if(session.status!==200||session.body.success!==true||!edgeToken) throw new Error(`orders session failed status=${session.status}`);
            console.log('::add-mask::'+edgeToken);
            const screens=Array.isArray(session.body&&session.body.user&&session.body.user.screens)?session.body.user.screens.map(text):[];
            const screen=['service','print','laser','press'].find(x=>screens.includes(x))||screens.find(Boolean)||'service';
            const params={screen,page:1,pageSize:100,statusFilter:'__ACTIVE__'};

            const appPage=await jsonFetch(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username,token,...params})});
            if(appPage.status!==200||appPage.body.success!==true||!Array.isArray(appPage.body.rows)) throw new Error(`Apps Script page failed status=${appPage.status}`);
            const qs=new URLSearchParams(Object.entries(params).map(([k,v])=>[k,String(v)]));
            const d1Page=await jsonFetch(edge+'/v1/edge/orders/02cr/page?'+qs,{method:'GET',headers:{accept:'application/json',authorization:'Bearer '+edgeToken}});
            if(d1Page.status!==200||d1Page.body.success!==true||!Array.isArray(d1Page.body.rows)) throw new Error(`D1 02CR failed status=${d1Page.status} code=${text(d1Page.body&&d1Page.body.code)}`);
            const legacy=await jsonFetch(edge+'/v1/edge/orders/page?'+qs,{method:'GET',headers:{accept:'application/json',authorization:'Bearer '+edgeToken}});

            const a=appPage.body.rows, d=d1Page.body.rows;
            const aKeys=new Set(a.map(key)), dKeys=new Set(d.map(key));
            const aOrders=new Set(a.map(r=>text(r&&r.orderId)).filter(Boolean));
            const dOrders=new Set(d.map(r=>text(r&&r.orderId)).filter(Boolean));
            const aLines=new Set(a.map(r=>text(r&&r.lineId)).filter(Boolean));
            const dLines=new Set(d.map(r=>text(r&&r.lineId)).filter(Boolean));
            const commonKeys=[...aKeys].filter(x=>dKeys.has(x));
            const commonOrders=[...aOrders].filter(x=>dOrders.has(x));
            const commonLines=[...aLines].filter(x=>dLines.has(x));
            const onlyA=[...aKeys].filter(x=>!dKeys.has(x));
            const onlyD=[...dKeys].filter(x=>!aKeys.has(x));

            console.log('T6C_DIAG_SCREEN='+screen);
            console.log('T6C_DIAG_LOGIN_MS='+login.ms);
            console.log('T6C_DIAG_ORDERS_SESSION_MS='+session.ms);
            console.log('T6C_DIAG_AUTH_SOURCE='+text(session.body.authSource));
            console.log('T6C_DIAG_APPS_MS='+appPage.ms);
            console.log('T6C_DIAG_D1_02CR_MS='+d1Page.ms);
            console.log('T6C_DIAG_APPS_ROWS='+a.length);
            console.log('T6C_DIAG_D1_ROWS='+d.length);
            console.log('T6C_DIAG_APPS_TOTAL='+Number(appPage.body.pagination&&appPage.body.pagination.totalRows));
            console.log('T6C_DIAG_D1_TOTAL='+Number(d1Page.body.pagination&&d1Page.body.pagination.totalRows));
            console.log('T6C_DIAG_COMMON_KEYS='+commonKeys.length);
            console.log('T6C_DIAG_COMMON_ORDER_IDS='+commonOrders.length);
            console.log('T6C_DIAG_COMMON_LINE_IDS='+commonLines.length);
            console.log('T6C_DIAG_APPS_ORDER_SHAPE='+JSON.stringify(summarizeField(a,'orderId')));
            console.log('T6C_DIAG_D1_ORDER_SHAPE='+JSON.stringify(summarizeField(d,'orderId')));
            console.log('T6C_DIAG_APPS_LINE_SHAPE='+JSON.stringify(summarizeField(a,'lineId')));
            console.log('T6C_DIAG_D1_LINE_SHAPE='+JSON.stringify(summarizeField(d,'lineId')));
            console.log('T6C_DIAG_APPS_ROW_KEYS='+JSON.stringify(Object.keys(a[0]||{}).sort()));
            console.log('T6C_DIAG_D1_ROW_KEYS='+JSON.stringify(Object.keys(d[0]||{}).sort()));
            console.log('T6C_DIAG_APPS_STATUS_COUNTS='+JSON.stringify(sortedObj(appPage.body.statusCounts)));
            console.log('T6C_DIAG_D1_STATUS_COUNTS='+JSON.stringify(sortedObj(d1Page.body.statusCounts)));
            console.log('T6C_DIAG_ONLY_APPS_HASHES='+JSON.stringify(onlyA.slice(0,12).map(v=>hash(v))));
            console.log('T6C_DIAG_ONLY_D1_HASHES='+JSON.stringify(onlyD.slice(0,12).map(v=>hash(v))));
            console.log('T6C_DIAG_APPS_SAMPLE='+JSON.stringify(a.slice(0,8).map(r=>({k:hkey(r),order:hash(r.orderId),line:hash(r.lineId),orderPattern:pattern(r.orderId),linePattern:pattern(r.lineId),status:text(r.status),department:text(r.department),rowNumber:Number(r.rowNumber||0)}))));
            console.log('T6C_DIAG_D1_SAMPLE='+JSON.stringify(d.slice(0,8).map(r=>({k:hkey(r),order:hash(r.orderId),line:hash(r.lineId),orderPattern:pattern(r.orderId),linePattern:pattern(r.lineId),status:text(r.status),department:text(r.department),rowNumber:Number(r.rowNumber||0)}))));
            console.log('T6C_DIAG_LEGACY_D1='+JSON.stringify({status:legacy.status,ms:legacy.ms,success:legacy.body&&legacy.body.success===true,code:text(legacy.body&&legacy.body.code),total:Number(legacy.body&&legacy.body.pagination&&legacy.body.pagination.totalRows)||0,rows:Array.isArray(legacy.body&&legacy.body.rows)?legacy.body.rows.length:0}));
            console.log('T6C_DIAG_MIRRORS='+JSON.stringify((d1Page.body.mirrors||[]).map(m=>({sheetName:text(m.sheetName),rowCount:Number(m.rowCount||0),sourceLastRow:Number(m.sourceLastRow||0),status:text(m.status),note:text(m.note),syncedAt:text(m.syncedAt)}))));
            console.log('T6C_DIAG_LOGICAL_FRESHNESS='+(d1Page.body.logicalFreshness&&d1Page.body.logicalFreshness.ok===true?'YES':'NO'));
            console.log('T6C_DIAGNOSTIC_COMPLETE=YES');
            console.log('T6C_QUALIFICATION_PASS='+(Number(appPage.body.pagination.totalRows)===Number(d1Page.body.pagination.totalRows)&&commonKeys.length===a.length&&a.length===d.length&&d1Page.ms<2000?'YES':'NO'));
          })().catch(err=>{console.error('T6C_DIAG_FAILURE='+String(err&&err.message||err));process.exit(1)});
          NODE

      - name: Safety conclusion
        run: |
          echo 'T6C_DIAGNOSTIC_ONLY=YES'
          echo 'PRODUCTION_WORKER_DEPLOYMENT=NO'
          echo 'APPS_SCRIPT_DEPLOYMENT=NO'
          echo 'FRONTEND_EDGE_ORDERS_READ_ENABLED=NO'
          echo 'SHEETS_WRITE_AUTHORITY_CHANGED=NO'
          echo 'TASK_MUTATION=NO'
          echo 'SECRET_CHANGE=NO'
