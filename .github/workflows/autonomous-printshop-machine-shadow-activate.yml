name: Autonomous Printshop Machine Shadow Activate

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-machine-shadow-activate.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-machine-shadow-activate
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact control boundary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master
                WHERE type='table'
                  AND name IN (
                    'autonomous_machine_control',
                    'autonomous_machines',
                    'autonomous_machine_observations',
                    'autonomous_line_machine_mapping_events',
                    'autonomous_machine_control_events'
                  )) AS machineTables,
              (SELECT mode FROM autonomous_machine_control WHERE singleton_id=1) AS machineMode,
              (SELECT epoch FROM autonomous_machine_control WHERE singleton_id=1) AS machineEpoch,
              (SELECT mode FROM autonomous_readiness_control WHERE singleton_id=1) AS readinessMode,
              (SELECT mode FROM autonomy_control WHERE singleton_id=1) AS autonomyMode,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          " > /tmp/pre.json
          cat /tmp/pre.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.machineTables)!==5) process.exit(1);
          if(!['OFF','SHADOW'].includes(String(r.machineMode))) process.exit(2);
          if(String(r.readinessMode)!=='SHADOW') process.exit(3);
          if(String(r.autonomyMode)!=='SHADOW') process.exit(4);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(5);
          if(Number(r.operatorTasks)!==0) process.exit(6);
          console.log('MACHINE_SHADOW_PREFLIGHT=PASS');
          NODE

      - name: Activate Machine SHADOW only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --command "
            UPDATE autonomous_machine_control
               SET mode='SHADOW',
                   epoch=epoch+1,
                   updated_by='autonomous-printshop-machine-shadow',
                   change_reason='EXPLICIT_MACHINE_EVIDENCE_COLLECTION_SHADOW_ACTIVE',
                   updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
             WHERE singleton_id=1 AND mode='OFF';
          "

      - name: Verify shadow-only activation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT mode FROM autonomous_machine_control WHERE singleton_id=1) AS machineMode,
              (SELECT epoch FROM autonomous_machine_control WHERE singleton_id=1) AS machineEpoch,
              (SELECT COUNT(*) FROM autonomous_machine_control_events) AS machineControlEvents,
              (SELECT COUNT(*) FROM autonomous_machines) AS machines,
              (SELECT COUNT(*) FROM autonomous_machine_observations) AS observations,
              (SELECT COUNT(*) FROM autonomous_line_machine_mapping_events) AS mappings,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          " > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'))?.[0]?.results?.[0]||{};
          if(String(r.machineMode)!=='SHADOW') process.exit(1);
          if(Number(r.machineEpoch)<2) process.exit(2);
          if(Number(r.machineControlEvents)<1) process.exit(3);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(4);
          if(Number(r.operatorTasks)!==0) process.exit(5);
          console.log('MACHINE_CONTROL=SHADOW');
          console.log('MACHINE_REGISTRY_ROWS='+String(r.machines||0));
          console.log('MACHINE_OBSERVATIONS='+String(r.observations||0));
          console.log('MACHINE_MAPPINGS='+String(r.mappings||0));
          console.log('OPERATOR_TASK_CONTROL=OFF');
          NODE

      - name: Safety conclusion
        run: |
          echo 'MACHINE_CONTROL=SHADOW'
          echo 'READINESS_CONTROL=SHADOW'
          echo 'AUTONOMY_CONTROL=SHADOW'
          echo 'OPERATOR_TASK_CONTROL=OFF'
          echo 'READY_WITHOUT_EXPLICIT_OBSERVATION=FORBIDDEN'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
