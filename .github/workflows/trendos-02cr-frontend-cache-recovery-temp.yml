name: TrendOS 02CR Frontend Cache Recovery TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cr-frontend-cache-recovery-temp.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard production read lane and patch scope
        shell: bash
        run: |
          set -euo pipefail
          OLD='trendos-v1931-trend-master-20260812a'
          NEW='trendos-runtime-recovery-20260906a'
          grep -q "$OLD" index.html
          if grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' config.js; then
            echo 'REFUSE: production config unexpectedly enables D1 orders read'
            exit 1
          fi
          if grep -q 'trendos-edge-orders-read-v1.js' config.js; then
            echo 'REFUSE: production config unexpectedly loads Edge orders reader'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          old='trendos-v1931-trend-master-20260812a'
          new='trendos-runtime-recovery-20260906a'
          for name in ['index.html','reset-cache.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff -- index.html reset-cache.html
          test -n "$(git diff --name-only)"
          bad="$(git diff --name-only | grep -Ev '^(index\.html|reset-cache\.html)$' || true)"
          test -z "$bad"
          grep -q "$NEW" index.html
          if grep -q "$OLD" index.html; then
            echo 'REFUSE: old cache tag remains in index.html'
            exit 1
          fi
          echo 'PERF_CF_02CR_FRONTEND_CACHE_PATCH_GUARD_PASS'

      - name: Commit exact cache-bust to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html reset-cache.html
          git commit -m 'Bust TrendOS frontend cache after D1 read rollback'
          git push origin HEAD:main
          echo "PERF_CF_02CR_FRONTEND_CACHE_RECOVERY_COMMIT=$(git rev-parse HEAD)"
          echo 'No Apps Script, D1, Worker, secrets, or authority changes.'

# Triggered after workflow registration; exact production scope remains index/reset-cache cache tags only.
