name: TrendOS Entry598 Legacy Orders Production Preflight

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry598-legacy-orders-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_WORKER: trendos-d1-api
      UI_WORKER: trendos-ui
      DATABASE: trendos-main
      CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
      PROD_API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PROD_UI_URL: https://trendos-ui.trendmall-contact.workers.dev
      EXPECTED_API_VERSION: 23be0ab2-0a2b-4b81-bf54-e2f05f847989
      EXPECTED_API_SHA256: 2b78dea01c7e5892460ead4581915da9982208d60a41a95ce903beb742698f67
      EXPECTED_UI_VERSION: a26589a4-e2e0-4ed5-9abf-e1b19b56ce0e
      ACTIVE_API_SOURCE: e7c61d1d6b1e5e7e3f5e9fef9d65077086fff534
      QUALIFIED_TARGET_SOURCE: c491d3ed9b7e87c5d5f7d7ee0a57e02c3e530281

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_TARGET_SOURCE }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact qualified source and API delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_TARGET_SOURCE"
          git diff --name-only "$ACTIVE_API_SOURCE".."$QUALIFIED_TARGET_SOURCE" -- cloudflare-d1/ | sort > /tmp/api-delta.txt
          cat > /tmp/expected-api-delta.txt <<'EOF'
          cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql
          cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          cloudflare-d1/src/t12-legacy-line-runtime.mjs
          cloudflare-d1/src/t12-operational-runtime-handler.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-api-delta.txt
          diff -u /tmp/expected-api-delta.txt /tmp/api-delta.txt
          echo 'ENTRY598_API_DELTA=PASS_EXACT_4_FILES'

      - name: Build exact API target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-d1/dist
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js             --bundle --format=esm --platform=browser --target=es2022             --outfile=cloudflare-d1/dist/entry598-api-target.js
          node --check cloudflare-d1/dist/entry598-api-target.js
          sha="$(sha256sum cloudflare-d1/dist/entry598-api-target.js | awk '{print $1}')"
          echo "ENTRY598_API_TARGET_SHA256=$sha"
          test "$sha" != "$EXPECTED_API_SHA256"
          echo "$sha" > /tmp/target-api-sha.txt

      - name: Verify current API Production exact version and bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION deployments list --name "$API_WORKER" --json > /tmp/api-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/api-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1||full[0].id!==process.env.EXPECTED_API_VERSION) throw new Error('API Production drift');
          console.log('ENTRY598_ACTIVE_API_VERSION='+full[0].id);
          console.log('ENTRY598_ACTIVE_API_TRAFFIC=100');
          console.log('ENTRY598_ACTIVE_API_DEPLOYMENT='+d.id);
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/api-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$API_WORKER/content/v2"             -o /tmp/api-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib,os
          hs=Path('/tmp/api-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/api-content.body').read_bytes()
          payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower()
                  n=(p.get_param('name',header='content-disposition') or '').lower()
                  t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')):
                      cand.append(d)
              if cand: payload=max(cand,key=len)
          else:
              payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          sha=hashlib.sha256(payload).hexdigest()
          if sha!=os.environ['EXPECTED_API_SHA256']: raise SystemExit('API_BUNDLE_DRIFT')
          print('ENTRY598_LIVE_API_SHA256='+sha)
          PY

      - name: Verify current Frontend Production exact version and old cache marker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$UI_WORKER/deployments"             > /tmp/ui-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/ui-deployments.json','utf8'));
          const list=Array.isArray(body?.result?.deployments)?body.result.deployments:(Array.isArray(body?.result)?body.result:[]);
          if(!list.length) throw new Error('No UI deployment');
          const active=(list[0].versions||[]).map(v=>({id:String(v?.version_id||v?.id||''),p:Number(v?.percentage ?? v?.traffic_percentage ?? NaN)}));
          if(active.length!==1||active[0].id!==process.env.EXPECTED_UI_VERSION||active[0].p!==100) throw new Error('UI Production drift');
          console.log('ENTRY598_ACTIVE_UI_VERSION='+active[0].id);
          console.log('ENTRY598_ACTIVE_UI_TRAFFIC=100');
          console.log('ENTRY598_ACTIVE_UI_DEPLOYMENT='+String(list[0].id||''));
          NODE
          curl --fail --silent --show-error "$PROD_UI_URL/config.js?entry598=1" > /tmp/live-config.js
          grep -F 'trendos-edge-orders-read-v1.js?v=20261001-duplicate-order-guard-ui' /tmp/live-config.js
          ! grep -F 'MATBAGY_T12_LEGACY_LINE_RUNTIME_V1_ENABLED = true' /tmp/live-config.js
          echo 'ENTRY598_UI_LEGACY_RUNTIME_DEPLOYED=NO'

      - name: Verify migration 0011 absent and exact pending set
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type='table' AND name='t12_legacy_line_runtime';"             > /tmp/table.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/table.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'present'))rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);if(!rows.length||Number(rows[0].present)!==0) throw new Error('legacy runtime table unexpectedly present');
          console.log('ENTRY598_LEGACY_RUNTIME_TABLE_PRESENT=NO');
          NODE

          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/migrations.txt 2>&1
          mapfile -t pending < <(grep -oE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/migrations.txt | sort -u || true)
          test "${#pending[@]}" -eq 1
          test "${pending[0]}" = "0011_t12_legacy_line_runtime.sql"
          echo 'ENTRY598_PENDING_MIGRATION=0011_t12_legacy_line_runtime.sql'

      - name: Verify exact 15 stale-active rows remain in D1 mirror
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT headers_json AS headersJson,synced_at AS syncedAt FROM sheet_catalog WHERE sheet_name='بنود الأوردرات' LIMIT 1; SELECT row_number AS rowNumber,values_json AS valuesJson,display_json AS displayJson FROM sheet_rows WHERE sheet_name='بنود الأوردرات' ORDER BY row_number;"             > /tmp/mirror.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/mirror.json','utf8'));let catalog=null,mirrorRows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.headersJson)catalog=v;if(v.valuesJson)mirrorRows.push(v);Object.values(v).forEach(walk)}};
          walk(raw);if(!catalog||!mirrorRows.length)throw new Error('mirror query parse failed');
          const h=JSON.parse(catalog.headersJson||'[]').map(x=>String(x??'').trim());
          const idx=(names,fallback)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return fallback};
          const ci={order:idx(['رقم الأوردر','Order ID'],0),line:idx(['رقم البند','Line ID'],5),status:idx(['الحالة','Status'],10)};
          const hidden=new Set(['جاهز للاستلام','تم التسليم','مكرر','تم التنفيذ','جاهز للطباعة','ملغى','ملغي']);
          const active=[];
          for(const r of mirrorRows){
            if(Number(r.rowNumber||0)<=1)continue;
            const d=JSON.parse(r.displayJson||r.valuesJson||'[]');
            const status=String(d[ci.status]??'').trim()||'طلب جديد';
            if(hidden.has(status))continue;
            active.push({orderId:String(d[ci.order]??'').trim(),lineId:String(d[ci.line]??'').trim(),status});
          }
          const expected=['TM2606150097','TM2606150098','TM2606150105','TM2606160146','4310','4312','4313','4314','4315','4316','4317','4318','4319','4320','4321'].sort();
          const got=active.map(x=>x.orderId).sort();
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('stale-active set drift: '+JSON.stringify(active));
          console.log('ENTRY598_STALE_ACTIVE_COUNT='+active.length);
          console.log('ENTRY598_STALE_ACTIVE_SET=EXACT_15_CONFIRMED');
          console.log('ENTRY598_MIRROR_SYNCED_AT='+String(catalog.syncedAt||''));
          NODE

      - name: Public health read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/create/health" > /tmp/create.json
          curl --fail --silent --show-error "$PROD_API_URL/v1/t12/orders/line-runtime/health" > /tmp/runtime.json
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/create.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/runtime.json','utf8'));
          if(c.success!==true||c.mode!=='GENERAL'||c.duplicateGuardReady!==true) throw new Error('create health drift');
          if(r.success!==true||r.schemaReady!==true) throw new Error('native runtime health drift');
          console.log('ENTRY598_ORDER_CREATE_MODE=GENERAL');
          console.log('ENTRY598_DUPLICATE_GUARD_READY=YES');
          console.log('ENTRY598_CURRENT_RUNTIME_HEALTH=PASS');
          NODE
          echo 'ENTRY598_PRODUCTION_PREFLIGHT=PASS'
          echo 'D1_MUTATION=NO'
          echo 'CLOUDFLARE_DEPLOY=NO'
          echo 'FRONTEND_DEPLOY=NO'
          echo 'APPS_SCRIPT_MUTATION=NO'
          echo 'ORDER_STATUS_MUTATION=NO'
