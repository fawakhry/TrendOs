name: TrendOS T12 Optional Description Frontend Fix
on:
  push:
    branches: [audit/t12-customer-lane-runtime-20261008]
    paths:
      - '.github/workflows/trendos-t12-optional-description-controlled.yml'
      - 'scripts/t12_optional_description_frontend_release.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trendos-t12-optional-description-controlled
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T12_WRANGLER_BIN: /tmp/t12-release-tools/node_modules/.bin/wrangler
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/t12-release-tools --no-audit --no-fund wrangler@4.33.2
      - name: Optional description and duplicate/session protection
        run: |
          set -euo pipefail
          node --check app.js
          node --experimental-sqlite tests/t12_general_create.test.mjs
          node --experimental-sqlite tests/t12_customer_lane_partial.test.mjs
          node tests/t12_create_key_durability.test.mjs
          node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs
          node tests/entry652_employee_session_lifecycle_guard.test.mjs
          node tests/entry652_employee_session_runtime_401_dispatch.test.mjs
      - name: Exact-live frontend-only release and postflight
        run: python3 scripts/t12_optional_description_frontend_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t12-optional-description-sanitized-result
          path: /tmp/t12-qualified-release/optional-description-result.json
          retention-days: 3
