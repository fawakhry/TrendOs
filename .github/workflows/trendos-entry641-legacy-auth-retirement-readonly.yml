name: TrendOS Entry641 Legacy Auth Retirement Readonly

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry641-legacy-auth-retirement-readonly.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry641-legacy-auth-retirement-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_WORKER: trendos-d1-api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929

      - name: Prove final Native runtime and dormant Cloudflare bridge residue
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health?entry641=$GITHUB_SHA-$(date +%s%N)" -o /tmp/auth.json
          curl --fail --silent --show-error "$API_URL/v1/employee/legacy-action/health?entry641=$GITHUB_SHA-$(date +%s%N)" -o /tmp/bridge.json
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry641=$GITHUB_SHA-$(date +%s%N)" -o /tmp/frontend.js

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge.json','utf8'));
          if(a.mode!=='NATIVE'||Number(a.userCount||0)!==6||
             Number(a.nativeReadyCount||0)!==6||a.plaintextStored!==false) throw new Error('Native control/readiness drift');
          console.log('ENTRY641_CF_AUTH_ENV_ENABLED='+(a.envEnabled===true?'YES':'NO'));
          console.log('ENTRY641_CF_BOOTSTRAP_ENABLED='+(a.legacyBootstrapEnabled===true?'YES':'NO'));
          console.log('ENTRY641_CF_SESSION_ENROLL_ENABLED='+(a.legacySessionEnrollEnabled===true?'YES':'NO'));
          console.log('ENTRY641_CF_NATIVE_ONLY='+(a.nativeOnly===true?'YES':'NO'));
          if(b.enabled!==false) throw new Error('Cloudflare legacy bridge unexpectedly enabled');
          if(b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false) throw new Error('bridge hygiene drift');
          console.log('ENTRY641_AUTH_MODE=NATIVE');
          console.log('ENTRY641_NATIVE_READY=6_OF_6');
          console.log('ENTRY641_CF_BRIDGE_ENABLED=NO');
          console.log('ENTRY641_CF_BRIDGE_UPSTREAM_CONFIGURED='+(b.upstreamConfigured===true?'YES':'NO'));
          console.log('ENTRY641_CF_BRIDGE_SECRET_CONFIGURED='+(b.secretConfigured===true?'YES':'NO'));
          console.log('ENTRY641_CF_BRIDGE_POLICY_COUNT='+Number(b.allowedPolicyCount||0));
          NODE

          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" /tmp/frontend.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1 = false;" /tmp/frontend.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/frontend.js
          echo ENTRY641_FRONTEND_GLOBAL_NATIVE=PASS

      - name: Readonly Cloudflare deployment and settings drift inventory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker=process.env.API_WORKER;
          if(!token||!account) throw new Error('Cloudflare credentials unavailable');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker;
          const headers={authorization:'Bearer '+token};
          async function cf(path){
            const r=await fetch(base+path,{headers});
            const raw=await r.text(); let body={}; try{body=JSON.parse(raw||'{}')}catch{}
            if(!r.ok||body.success!==true) throw new Error('Cloudflare API '+r.status+' '+path);
            return body;
          }
          (async()=>{
            const d=await cf('/deployments');
            const deps=((d.result&&d.result.deployments)||d.result||[]).slice().sort((a,b)=>Date.parse(b.created_on||b.created_at||0)-Date.parse(a.created_on||a.created_at||0));
            console.log('ENTRY641_CF_DEPLOYMENT_RECORDS='+deps.length);
            deps.slice(0,12).forEach((x,i)=>{
              const vv=(x.versions||[]).map(v=>String(v.version_id||v.id||'')+'@'+Number(v.percentage||0)).join(',');
              console.log('ENTRY641_CF_DEPLOYMENT_'+(i+1)+'='+String(x.created_on||x.created_at||'')+'|'+vv);
            });
            const cur=deps[0]||{};
            const full=(cur.versions||[]).filter(v=>Number(v.percentage||0)===100);
            if(full.length!==1) throw new Error('active deployment shape');
            console.log('ENTRY641_CF_ACTIVE_VERSION='+String(full[0].version_id||full[0].id||''));

            const v=await cf('/versions?per_page=20');
            const vr=v.result;
            const items=(Array.isArray(vr)?vr:(vr&&Array.isArray(vr.items)?vr.items:(vr&&Array.isArray(vr.versions)?vr.versions:[]))).slice()
              .sort((a,b)=>Date.parse(b.created_on||b.created_at||0)-Date.parse(a.created_on||a.created_at||0));
            items.slice(0,12).forEach((x,i)=>{
              const ann=x.annotations||{};
              const msg=String(ann['workers/message']||ann.message||'').replace(/[\r\n|]/g,' ');
              console.log('ENTRY641_CF_VERSION_'+(i+1)+'='+String(x.id||'')+'|'+String(x.created_on||x.created_at||'')+'|'+msg);
            });

            const st=await cf('/settings');
            const bs=Array.isArray(st.result&&st.result.bindings)?st.result.bindings:[];
            const by=new Map(bs.map(b=>[String(b.name||''),b]));
            const plain=n=>{const b=by.get(n);return b&&b.type==='plain_text'?String(b.text||''):'<not-plain>';};
            console.log('ENTRY641_CF_LATEST_NATIVE_ONLY='+plain('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1'));
            console.log('ENTRY641_CF_LATEST_BOOTSTRAP='+plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED'));
            console.log('ENTRY641_CF_LATEST_SESSION_ENROLL='+plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED'));
            console.log('ENTRY641_CF_LATEST_BRIDGE_ENABLED='+plain('TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED'));
            const actions=plain('EMPLOYEE_LEGACY_BRIDGE_ACTIONS');
            console.log('ENTRY641_CF_LATEST_BRIDGE_ACTIONS_CONFIGURED='+(actions&&actions!=='<not-plain>'?'YES':'NO'));
            console.log('ENTRY641_CF_LATEST_BRIDGE_SECRET_BINDING='+(by.has('EMPLOYEE_LEGACY_BRIDGE_SECRET_V1')?'YES':'NO'));
            console.log('ENTRY641_CF_SECRET_VALUE_LOGGED=NO');
          })().catch(e=>{console.error('ENTRY641_CF_INVENTORY_FAIL '+String(e&&e.message||e));process.exit(1);});
          NODE

      - name: Readonly Apps Script bridge-state proof with invalid assertion
        shell: bash
        run: |
          set -euo pipefail
          APPS_URL="$(node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync(process.env.CONFIG,'utf8');
          const m=s.match(/^APPS_SCRIPT_API_URL\s*=\s*"([^"]+)"/m);
          if(!m) process.exit(2);
          process.stdout.write(m[1]);
          NODE
          )"
          test -n "$APPS_URL"

          body='{"action":"cloudEmployeeLegacyBridgeExecuteV1","targetAction":"getDashboard","username":"entry641-probe","targetPayload":{"action":"getDashboard","username":"entry641-probe"},"cloudEmployeeAssertionV1":"cfv1.invalid.invalid"}'
          code="$(curl --silent --show-error --location --output /tmp/apps.json --write-out '%{http_code}' \
            -H 'accept: application/json' -H 'content-type: text/plain;charset=utf-8' \
            --data-binary "$body" "$APPS_URL")"
          export APPS_HTTP="$code"

          node <<'NODE'
          const fs=require('fs');
          let x={}; try{x=JSON.parse(fs.readFileSync('/tmp/apps.json','utf8')||'{}')}catch{}
          const msg=String(x.message||'');
          if(Number(process.env.APPS_HTTP||0)!==200) throw new Error('Apps Script probe HTTP '+process.env.APPS_HTTP);
          console.log('ENTRY641_APPS_SCRIPT_HTTP=200');
          console.log('ENTRY641_APPS_SCRIPT_SECRET_VALUE_LOGGED=NO');
          if(msg==='اعتماد الموظف السحابي غير صالح.'){
            console.log('ENTRY641_APPS_SCRIPT_BRIDGE_ENABLED=YES');
            console.log('ENTRY641_APPS_SCRIPT_BRIDGE_SECRET_CONFIGURED=YES');
            console.log('ENTRY641_RETIREMENT_CANDIDATE=DISABLE_APPS_SCRIPT_BRIDGE_PROPERTY');
          } else if(msg==='مسار اعتماد الموظف السحابي غير مفعل.'){
            console.log('ENTRY641_APPS_SCRIPT_BRIDGE_ENABLED=NO');
            console.log('ENTRY641_RETIREMENT_CANDIDATE=APPS_SCRIPT_ALREADY_DISABLED');
          } else if(msg==='مسار اعتماد الموظف السحابي غير مضبوط.'){
            console.log('ENTRY641_APPS_SCRIPT_BRIDGE_ENABLED=YES');
            console.log('ENTRY641_APPS_SCRIPT_BRIDGE_SECRET_CONFIGURED=NO');
            console.log('ENTRY641_RETIREMENT_CANDIDATE=DISABLE_APPS_SCRIPT_BRIDGE_PROPERTY');
          } else {
            throw new Error('unexpected Apps Script bridge probe response');
          }
          NODE

      - name: Source residue inventory
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fq 'EMPLOYEE_LEGACY_BRIDGE_ACTIONS = ""' cloudflare-d1/wrangler.toml
          grep -Fq 'EMPLOYEE_LEGACY_BRIDGE_SECRET_V1' cloudflare-d1/src/employee-legacy-bridge-v1.mjs
          grep -Fq 'TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED' Code.gs
          grep -Fq 'EMPLOYEE_LEGACY_BRIDGE_SECRET_V1' Code.gs
          grep -Fq 'cloudEmployeeLegacyBridgeExecuteV1' Code.gs
          echo ENTRY641_REPO_DEFAULT_BRIDGE=OFF
          echo ENTRY641_REPO_BRIDGE_CODE_PRESENT=YES
          echo ENTRY641_REPO_APPS_SCRIPT_BRIDGE_ROUTE_PRESENT=YES

      - name: Boundary
        shell: bash
        run: |
          echo ENTRY641=READONLY_AUDIT_PASS
          echo ENTRY641_CLOUDFLARE_MUTATION=NO
          echo ENTRY641_D1_MUTATION=NO
          echo ENTRY641_APPS_SCRIPT_MUTATION=NO
          echo ENTRY641_FRONTEND_MUTATION=NO
          echo ENTRY641_ACCOUNTING_TOUCHED=NO
          echo ENTRY641_EASYSTORE_TOUCHED=NO
          echo ENTRY641_BUSINESS_DATA_MUTATION=NO
