name: TrendOS T12 Release Bundle And Time Travel Readonly Gate
on:
  push:
    branches: [release/t12-customer-lane-safe-20261008]
    paths:
      - '.github/workflows/trendos-t12-release-bundle-readonly-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      BASE_SHA: 467c5e5fcd0e538a5b57692e630943d6ab500710
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source baselines and bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t12-bundles
          git worktree add --detach /tmp/t12-base "$BASE_SHA" >/dev/null
          ( cd /tmp/t12-base && npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/t12-bundles/base.js >/dev/null )
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/t12-bundles/target.js >/dev/null
          node --check /tmp/t12-bundles/target.js
          echo SOURCE_BUNDLE_CHECK=PASS
      - name: Inspect current live worker exact code, no mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --compressed --fail --silent --show-error -D /tmp/t12-live-headers.txt -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2" -o /tmp/t12-live-content.bin
          python3 <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib
          head=Path('/tmp/t12-live-headers.txt').read_text(errors='ignore')
          ct=[line.split(':',1)[1].strip() for line in head.splitlines() if line.lower().startswith('content-type:')]
          ct=ct[-1] if ct else ''
          raw=Path('/tmp/t12-live-content.bin').read_bytes()
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              parts=[]
              for part in msg.iter_parts():
                  buf=part.get_payload(decode=True) or b''
                  typ=part.get_content_type().lower()
                  filename=(part.get_filename() or '').lower()
                  if 'javascript' in typ or filename.endswith(('.js','.mjs')):parts.append(buf)
              if not parts:raise SystemExit('NO_WORKER_MODULE')
              raw=max(parts,key=len)
          def norm(b):return b.replace(b'\r\n',b'\n').rstrip()+b'\n'
          live=norm(raw)
          base=norm(Path('/tmp/t12-bundles/base.js').read_bytes())
          target=norm(Path('/tmp/t12-bundles/target.js').read_bytes())
          for name,buf in [('LIVE',live),('BASE',base),('TARGET',target)]:
              print(name+'_SHA256='+hashlib.sha256(buf).hexdigest())
          if live!=base:
              import difflib
              prefix=0
              for a,b in zip(live,base):
                  if a!=b:break
                  prefix+=1
              print('LIVE_SIZE='+str(len(live)))
              print('BASE_SIZE='+str(len(base)))
              print('COMMON_PREFIX_BYTES='+str(prefix))
              for token in [b'ENTRY650',b'ENTRY652',b'ENTRY647',b'T12_GENERAL_CREATE_20261001_DUP_GUARD_V1']:
                  print('TOKEN_'+token.decode()+'_LIVE='+str(live.count(token))+'_BASE='+str(base.count(token)))
              raise SystemExit('LIVE_WORKER_BASELINE_DIFFERS_FROM_RELEASE_BASE; STOP_DEPLOY')
          if target==base:
              raise SystemExit('NO_WORKER_CHANGE')
          print('EXACT_LIVE_API_SOURCE_PARITY=PASS')
          PY
      - name: Cloudflare D1 Time Travel bookmark readiness only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4.142.0 >/dev/null
          date -u +D1_RECOVERY_TIMESTAMP_UTC=%Y-%m-%dT%H:%M:%SZ
          npx wrangler d1 time-travel info trendos-main --config cloudflare-d1/wrangler.toml --json > /tmp/t12-private-bookmark.json
          node <<'NODE'
          const fs=require('fs');
          const str=fs.readFileSync('/tmp/t12-private-bookmark.json','utf8');
          const data=JSON.parse(str);
          const bookmark=String(data.bookmark||data.result?.bookmark||'');
          if(!bookmark||bookmark.length<20)throw Error('D1_TIMETRAVEL_BOOKMARK_NOT_AVAILABLE');
          console.log('::add-mask::'+bookmark);
          console.log('D1_TIMETRAVEL_RECOVERY_BOOKMARK=AVAILABLE_MASKED');
          console.log('D1_TIMETRAVEL_RESTORE_WILL_NOT_BE_AUTOMATED=YES');
          NODE
      - name: Safety
        if: always()
        run: |
          echo DEPLOY=NO
          echo PRODUCTION_D1_WRITE=NO
          echo DATABASE_EXPORT_TO_PUBLIC_GITHUB=NO
          echo BUSINESS_CREATE=NO
