name: TrendOS Entry603 Login Fast Surface CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'config.js'
      - 'app.js'
      - 'index.html'
      - 'tests/frontend_login_fast_surface_entry603.test.mjs'
      - 'tests/frontend_orders_initial_edge_ready_entry577.test.mjs'
      - 'tests/frontend_t12_duplicate_order_guard_entry590.test.mjs'
      - '.github/workflows/trendos-entry603-login-fast-surface-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          node --check config.js
          node --check app.js
          node --check employee-api-dispatcher-v1.js
      - name: Login fast surface
        run: node tests/frontend_login_fast_surface_entry603.test.mjs
      - name: Preserve Edge initial readiness
        run: node tests/frontend_orders_initial_edge_ready_entry577.test.mjs
      - name: Preserve duplicate guard frontend
        run: node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs
      - name: Preserve A61 dispatcher routing contract
        run: node tests/frontend_employee_api_dispatcher_a61.test.mjs
      - name: Static boundaries
        run: |
          set -euo pipefail
          grep -F "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = true;" config.js
          grep -F "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" config.js
          grep -F "config.js?v=20261008-entry652-session-lifecycle" index.html
          grep -F "app.js?v=20261008-entry652-session-lifecycle" index.html
          grep -F "trendosLoadAuthenticatedModulesV1" app.js
          echo 'ENTRY603_STATIC=PASS'
          echo 'PRODUCTION_MUTATION=NO'
