name: TrendOS Entry618 Ops GENERAL Controlled Cutover

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry618-ops-general-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry618-ops-general-controlled
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      API_CONFIG: cloudflare-d1/wrangler.toml
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      DATABASE: trendos-main
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      EXPECTED_API_VERSION: de2c825d-ef63-407d-90dc-8059a9d4f192
      EXPECTED_FRONTEND_VERSION: ad121526-8f86-4ce9-b13e-757c89810b06

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Exact Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          npx wrangler deployments list --name trendos-d1-api --json > /tmp/api-deployments.json
          npx wrangler deployments list --name trendos-ui --json > /tmp/frontend-deployments.json

          node <<'NODE'
          const fs=require('fs');
          function active(path,label,expected,outPath){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice()
              .sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const d=ds[0]||{};
            const full=(d.versions||[])
              .map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)}))
              .filter(v=>v.id&&v.p===100);
            if(full.length!==1) throw new Error(label+'-active-version-not-single-100');
            if(full[0].id!==expected) throw new Error(label+'-version-drift:'+full[0].id);
            if(outPath) fs.writeFileSync(outPath,full[0].id);
            console.log('ENTRY618_'+label+'_VERSION_LOCK=PASS');
          }
          active('/tmp/api-deployments.json','API',process.env.EXPECTED_API_VERSION);
          active('/tmp/frontend-deployments.json','FRONTEND',process.env.EXPECTED_FRONTEND_VERSION,'/tmp/pre-frontend-version.txt');
          NODE

          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health" -o /tmp/auth-pre.json
          curl --fail --silent --show-error "$API_URL/v1/employee/legacy-action/health" -o /tmp/bridge-pre.json
          for f in ops content comms accounting core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health" -o "/tmp/$f-pre.json"
          done
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health" -o /tmp/orders-pre.json
          curl --fail --silent --show-error "$API_URL/v1/t12/customers/write/health" -o /tmp/customers-pre.json
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/line-runtime/health" -o /tmp/line-pre.json
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry618pre=$GITHUB_SHA" -o /tmp/live-config-pre.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry618pre=$GITHUB_SHA" -o /tmp/live-dispatcher-pre.js

          node <<'NODE'
          const fs=require('fs'), read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=read('/tmp/auth-pre.json'), b=read('/tmp/bridge-pre.json');
          if(a.mode!=='OFF'||a.envEnabled!==false) throw new Error('auth-not-off');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge-not-off');
          const ops=read('/tmp/ops-pre.json');
          if(ops.mode!=='READONLY'||ops.schemaReady!==true||Number(ops.googleBusinessCalls||0)!==0||ops.appsScriptBusinessAuthority!==false) throw new Error('ops-preflight');
          for(const f of ['content','comms','accounting','core']){
            const x=read('/tmp/'+f+'-pre.json');
            if(x.mode!=='OFF'||x.schemaReady!==true) throw new Error('other-family-preflight:'+f);
          }
          const o=read('/tmp/orders-pre.json'), c=read('/tmp/customers-pre.json'), l=read('/tmp/line-pre.json');
          if(o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders-preflight');
          if(c.mode!=='GENERAL') throw new Error('customers-preflight');
          if(l.schemaReady!==true||l.legacySchemaReady!==true||l.writeMode!=='cloud-native+legacy-overlay') throw new Error('line-preflight');
          const cfg=fs.readFileSync('/tmp/live-config-pre.js','utf8');
          const disp=fs.readFileSync('/tmp/live-dispatcher-pre.js','utf8');
          if(!cfg.includes("MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'READONLY'")) throw new Error('frontend-ops-not-readonly');
          if(!cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false')) throw new Error('frontend-auth-not-off');
          if(!cfg.includes('MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false')) throw new Error('frontend-bridge-not-off');
          if(cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1')) throw new Error('entry611-canary-live');
          if(!disp.includes('T12_ENTRY617_EMPLOYEE_OPS_READONLY_V1_20261004')||!disp.includes('shouldRouteOpsNative')) throw new Error('dispatcher-live-drift');
          if(disp.includes('canaryRouteEnabled')) throw new Error('entry611-dispatcher-canary-live');
          console.log('ENTRY618_PRECUTOVER_RUNTIME=PASS');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command \
            "SELECT mode,policy_epoch AS policyEpoch FROM employee_ops_control_v1 WHERE singleton=1 AND marker='ENTRY614_EMPLOYEE_OPS_V1';" \
            > /tmp/ops-control-pre.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/ops-control-pre.json','utf8')), rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.mode&&v.policyEpoch!==undefined)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(rows.length!==1||rows[0].mode!=='READONLY') throw new Error('ops-control-pre-not-readonly');
          const epoch=Number(rows[0].policyEpoch);
          if(!Number.isInteger(epoch)||epoch<1) throw new Error('ops-control-pre-epoch-invalid');
          fs.writeFileSync('/tmp/pre-ops-epoch.txt',String(epoch));
          console.log('ENTRY618_PRE_OPS_POLICY_EPOCH='+epoch);
          NODE

      - name: Prove authenticated Production UI READONLY smoke from live traffic
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/tail.json
          timeout 80s npx wrangler tail trendos-d1-api --format json > /tmp/tail.json 2>/tmp/tail.err &
          TPID=$!
          wait "$TPID" || true

          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/tail.json','utf8');
          const objects=[];
          let start=-1,depth=0,inStr=false,esc=false;
          for(let i=0;i<raw.length;i++){
            const ch=raw[i];
            if(start<0){ if(ch==='{'){start=i;depth=1;inStr=false;esc=false;} continue; }
            if(inStr){
              if(esc) esc=false;
              else if(ch==='\\') esc=true;
              else if(ch==='"') inStr=false;
              continue;
            }
            if(ch==='"'){inStr=true;continue;}
            if(ch==='{') depth++;
            else if(ch==='}'){
              depth--;
              if(depth===0){
                try{objects.push(JSON.parse(raw.slice(start,i+1)));}catch{}
                start=-1;
              }
            }
          }
          const base=process.env.API_URL.replace(/\/$/,'');
          const front=process.env.FRONTEND_URL.replace(/\/$/,'');
          const hits=objects.filter(x=>{
            const req=x&&x.event&&x.event.request||{};
            const res=x&&x.event&&x.event.response||{};
            const h=req.headers||{};
            const origin=String(h.origin||h.Origin||'').replace(/\/$/,'');
            const referer=String(h.referer||h.Referer||'');
            return req.method==='POST' &&
              req.url===base+'/v1/employee/ops' &&
              Number(res.status)===200 &&
              origin===front &&
              referer.startsWith(front+'/');
          });
          if(!hits.length) throw new Error('no-authenticated-production-ui-ops-read-200-observed');
          console.log('ENTRY618_AUTHENTICATED_OPS_READONLY_LIVE_READ_SMOKE=PASS');
          console.log('ENTRY618_AUTHENTICATED_UI_OPS_READ_200_COUNT='+hits.length);
          console.log('ENTRY618_SMOKE_CREDENTIALS_CREATED=NO');
          console.log('ENTRY618_EXISTING_EMPLOYEE_SESSION_DISRUPTED=NO');
          NODE

      - name: Build exact live frontend GENERAL candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/entry618-livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/entry618-livebase "$LIVE_BASE_COMMIT" >/dev/null

          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/entry618-livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-config-pre.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-dispatcher-pre.js cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          ENTRY617_DISPATCHER_PATH=cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js \
          ENTRY617_CONFIG_PATH=cloudflare-d1/frontend-dist/config.js \
            node tests/frontend_employee_ops_family_router_entry617_generated.test.mjs

          python3 <<'PY'
          from pathlib import Path
          p=Path('cloudflare-d1/frontend-dist/config.js')
          s=p.read_text()
          old="window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'READONLY';"
          new="window.MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL';"
          if s.count(old)!=1:
              raise SystemExit('entry618-config-readonly-anchor-count')
          s=s.replace(old,new,1)
          if 'MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1' in s:
              raise SystemExit('entry611-canary-must-not-be-deployed')
          p.write_text(s)
          PY

          grep -Fq "MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false" cloudflare-d1/frontend-dist/config.js
          grep -Fq "MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false" cloudflare-d1/frontend-dist/config.js
          ! grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1" cloudflare-d1/frontend-dist/config.js
          grep -Fq "shouldRouteOpsNative" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          ! grep -Fq "canaryRouteEnabled" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          echo 'ENTRY618_FRONTEND_GENERAL_CANDIDATE=PASS'

      - name: Promote Ops GENERAL and deploy frontend with rollback
        shell: bash
        run: |
          set -eEuo pipefail
          PRE_FRONTEND_VERSION="$(cat /tmp/pre-frontend-version.txt)"
          OPS_MUTATED=0
          FRONTEND_DEPLOYED=0

          rollback_on_error() {
            rc=$?
            trap - ERR
            echo "ENTRY618_FAILURE_RC=$rc"
            if [ "$FRONTEND_DEPLOYED" = "1" ]; then
              echo "ENTRY618_ROLLBACK_FRONTEND_TO=$PRE_FRONTEND_VERSION"
              npx wrangler rollback "$PRE_FRONTEND_VERSION" --message "Entry618 automatic rollback after Ops GENERAL failure" --config "$FRONTEND_CONFIG" || true
            fi
            if [ "$OPS_MUTATED" = "1" ]; then
              echo "ENTRY618_ROLLBACK_OPS_TO=READONLY"
              npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" \
                --command "UPDATE employee_ops_control_v1 SET mode='READONLY',policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP WHERE singleton=1 AND marker='ENTRY614_EMPLOYEE_OPS_V1' AND mode='GENERAL';" || true
            fi
            exit "$rc"
          }
          trap rollback_on_error ERR

          PRE_OPS_EPOCH="$(cat /tmp/pre-ops-epoch.txt)"
          NEXT_OPS_EPOCH="$((PRE_OPS_EPOCH + 1))"
          export NEXT_OPS_EPOCH
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command \
            "UPDATE employee_ops_control_v1
                SET mode='GENERAL',policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP
              WHERE singleton=1
                AND marker='ENTRY614_EMPLOYEE_OPS_V1'
                AND mode='READONLY'
                AND policy_epoch=$PRE_OPS_EPOCH;
             SELECT mode,policy_epoch AS policyEpoch FROM employee_ops_control_v1 WHERE singleton=1 AND marker='ENTRY614_EMPLOYEE_OPS_V1';" \
            > /tmp/ops-general.json
          OPS_MUTATED=1

          node <<'NODE'
          const fs=require('fs'), x=JSON.parse(fs.readFileSync('/tmp/ops-general.json','utf8')), rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.mode&&v.policyEpoch!==undefined)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          const r=rows.find(v=>v.mode==='GENERAL');
          const expected=Number(process.env.NEXT_OPS_EPOCH);
          if(!r||Number(r.policyEpoch)!==expected) throw new Error('ops-general-promotion-not-proven');
          console.log('ENTRY618_OPS_CONTROL=GENERAL');
          console.log('ENTRY618_OPS_POLICY_EPOCH='+expected);
          NODE

          # GENERAL policy proof without any valid employee session and without a business write:
          # the same write-shaped request now passes policy and stops at authentication.
          write_code="$(curl --silent --show-error --output /tmp/general-write-probe.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"action":"hrV1","op":"submitRequest","username":"entry618-general-probe","token":"invalid"}' \
            "$API_URL/v1/employee/ops")"
          test "$write_code" = "401"
          grep -Fq '"code":"employee-session-rejected"' /tmp/general-write-probe.json
          echo 'ENTRY618_GENERAL_WRITE_POLICY_REACHES_AUTH=PASS'
          echo 'ENTRY618_GENERAL_BUSINESS_WRITE_EXECUTED=NO'

          npx wrangler deploy --config "$FRONTEND_CONFIG" | tee /tmp/entry618-frontend-deploy.log
          FRONTEND_DEPLOYED=1

          FRONTEND_PROPAGATED=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry618post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry618post=$suffix" -o /tmp/post-dispatcher.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry618post=$suffix" -o /tmp/post-edge.js \
              && grep -Fq "MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'" /tmp/post-config.js \
              && grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false" /tmp/post-config.js \
              && grep -Fq "MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false" /tmp/post-config.js \
              && ! grep -Fq "MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1" /tmp/post-config.js \
              && grep -Fq "shouldRouteOpsNative" /tmp/post-dispatcher.js \
              && ! grep -Fq "canaryRouteEnabled" /tmp/post-dispatcher.js \
              && grep -Fq 'postWriteBarrierRecoveries' /tmp/post-edge.js \
              && grep -Fq 'recoverPostWriteBarrier' /tmp/post-edge.js; then
                FRONTEND_PROPAGATED=1
                echo "ENTRY618_FRONTEND_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$FRONTEND_PROPAGATED" = "1"
          echo 'ENTRY618_FRONTEND_GENERAL_PROPAGATION=PASS'

          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health" -o /tmp/auth-post.json
          curl --fail --silent --show-error "$API_URL/v1/employee/legacy-action/health" -o /tmp/bridge-post.json
          for f in ops content comms accounting core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health" -o "/tmp/$f-post.json"
          done
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health" -o /tmp/orders-post.json
          curl --fail --silent --show-error "$API_URL/v1/t12/customers/write/health" -o /tmp/customers-post.json
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/line-runtime/health" -o /tmp/line-post.json

          node <<'NODE'
          const fs=require('fs'), read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=read('/tmp/auth-post.json'), b=read('/tmp/bridge-post.json');
          if(a.mode!=='OFF'||a.envEnabled!==false) throw new Error('auth-post');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) throw new Error('bridge-post');
          const ops=read('/tmp/ops-post.json');
          if(ops.mode!=='GENERAL'||Number(ops.policyEpoch||0)!==Number(process.env.NEXT_OPS_EPOCH)||ops.schemaReady!==true||Number(ops.googleBusinessCalls||0)!==0||ops.appsScriptBusinessAuthority!==false) throw new Error('ops-post');
          for(const f of ['content','comms','accounting','core']){
            const x=read('/tmp/'+f+'-post.json');
            if(x.mode!=='OFF'||x.schemaReady!==true) throw new Error('other-family-post:'+f);
          }
          const o=read('/tmp/orders-post.json'), c=read('/tmp/customers-post.json'), l=read('/tmp/line-post.json');
          if(o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders-post');
          if(c.mode!=='GENERAL') throw new Error('customers-post');
          if(l.schemaReady!==true||l.legacySchemaReady!==true||l.writeMode!=='cloud-native+legacy-overlay') throw new Error('line-post');
          console.log('ENTRY618_POSTCUTOVER_HEALTH=PASS');
          console.log('ENTRY618_REFRESH_FIX_PRESERVED=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json > /tmp/frontend-post-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/frontend-post-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice()
            .sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend-post-version-not-single-100');
          fs.writeFileSync('/tmp/post-frontend-version.txt',full[0].id);
          console.log('ENTRY618_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo 'ENTRY618_STATUS=OPS_GENERAL_CUTOVER_PASS'
          echo 'ENTRY618_AUTH=OFF'
          echo 'ENTRY618_BRIDGE=OFF'
          echo 'ENTRY618_CONTENT=OFF'
          echo 'ENTRY618_COMMS=OFF'
          echo 'ENTRY618_ACCOUNTING=OFF'
          echo 'ENTRY618_CORE=OFF'
          echo 'ENTRY618_API_DEPLOY=NO'
          echo 'ENTRY618_APPS_SCRIPT_TOUCHED=NO'
          echo 'ENTRY618_EXISTING_EMPLOYEE_SESSION_DISRUPTED=NO'
          echo 'ENTRY618_ENTRY611_CANARY_DEPLOYED=NO'
