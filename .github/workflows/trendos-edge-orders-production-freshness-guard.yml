name: TrendOS Edge Orders Production Freshness Guard

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-edge-orders-production-freshness-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-edge-orders-production-freshness-guard
  cancel-in-progress: false

jobs:
  deploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      ORDERS_MAX_AGE_SECONDS: '600'
      ROLLBACK_VERSION: 58dda26b-b9b6-41a6-9d3f-5d0e76ae81d8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify fail-closed guard payload
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_freshness_gate_v1.test.mjs
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_mirror_safety_v1.test.mjs
          grep -Eq '^EDGE_ORDERS_MIRROR_MAX_AGE_SECONDS = "600"$' cloudflare-d1/wrangler.toml
          echo 'PASS: code-only Orders freshness guard qualified; no D1 migration command is executed by this workflow.'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Install short-lived production Edge signing secret
        run: |
          set -euo pipefail
          node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))" > /tmp/prod-orders-edge-secret.txt
          chmod 600 /tmp/prod-orders-edge-secret.txt
          cat /tmp/prod-orders-edge-secret.txt | npx wrangler secret put EDGE_SESSION_SECRET --config cloudflare-d1/wrangler.toml >/dev/null
          sleep 3
          echo 'PASS: production Edge signing secret installed; value not logged.'

      - name: Deploy production Worker code only
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/wrangler.toml | tee /tmp/wrangler-deploy.log
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5

      - name: Verify health
        run: |
          set -euo pipefail
          code=''
          for attempt in $(seq 1 10); do
            code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PROD_URL/v1/edge/health" || true)"
            echo "health attempt=$attempt http=$code"
            if [ "$code" = '200' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"; then
              break
            fi
            sleep 2
          done
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"

      - name: Verify signed Production Orders stale/fresh contract after propagation
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const secret=fs.readFileSync('/tmp/prod-orders-edge-secret.txt','utf8').trim(),now=Math.floor(Date.now()/1000);
          const p={aud:'trendos-orders-edge',sub:'ci-prod-orders-guard',role:'admin',department:'إدارة',screens:['service','print','laser','press',''],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const b=Buffer.from(JSON.stringify(p)).toString('base64url'),input='v1.'+b,sig=crypto.createHmac('sha256',secret).update(input).digest('base64url');
          fs.writeFileSync('/tmp/prod-token.txt',input+'.'+sig,{mode:0o600});
          NODE
          token="$(cat /tmp/prod-token.txt)"
          contract_pass='0'
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/lines.json
            code="$(curl --silent --show-error --output /tmp/page.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__ACTIVE__" || true)"
            printf '%s' "$code" > /tmp/orders-http-code.txt
            echo "orders-contract attempt=$attempt http=$code"
            if node <<'NODE'
          const fs=require('fs');
          const rawMirror=JSON.parse(fs.readFileSync('/tmp/lines.json','utf8')),m=rawMirror.sheet||{},x=JSON.parse(fs.readFileSync('/tmp/page.json','utf8')||'{}'),code=Number(fs.readFileSync('/tmp/orders-http-code.txt','utf8')),maxAge=Number(process.env.ORDERS_MAX_AGE_SECONDS||600);
          const raw=String(m.syncedAt||'').trim(),norm=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)?raw.replace(' ','T')+'Z':raw,ms=Date.parse(norm),age=Number.isFinite(ms)?Math.max(0,Math.round((Date.now()-ms)/1000)):Number.MAX_SAFE_INTEGER;
          const parity=Number(m.rowCount||0)===Number(m.sourceLastRow||0),live=['TrendOS orders live sync V1','TrendOS orders live sync V2 quota-aware'].includes(String(m.note||'')),ready=String(m.status||'')==='ready';
          const expectedFresh=ready&&parity&&live&&age<=maxAge;
          console.log('PROD_ORDERS_MIRROR='+JSON.stringify({syncedAt:raw,ageSeconds:age,rowCount:Number(m.rowCount||0),sourceLastRow:Number(m.sourceLastRow||0),status:String(m.status||''),note:String(m.note||''),expectedFresh}));
          if(expectedFresh){
            if(code!==200||x.success!==true||x.dataSource!=='d1-edge-orders'||!Array.isArray(x.rows)) process.exit(1);
            console.log('PROD_ORDERS_FRESH_SERVE_PASS rows='+x.rows.length);
          }else{
            if(code!==503||x.success!==false||x.fallback!=='apps-script'||!['stale-orders-mirror','mirror-not-ready'].includes(String(x.code||''))) process.exit(1);
            console.log('PROD_ORDERS_STALE_FAIL_CLOSED_PASS code='+x.code+' age='+age);
          }
          NODE
            then
              contract_pass='1'
              break
            fi
            sleep 3
          done
          test "$contract_pass" = '1'

          debt_code="$(curl --silent --show-error --output /tmp/debt.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__DEBT__")"
          rm -f /tmp/prod-token.txt /tmp/prod-orders-edge-secret.txt
          test "$debt_code" = '409'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/debt.json','utf8')); if(x.code!=='apps-script-required'||x.fallback!=='apps-script') process.exit(1)"

      - name: Verify anonymous closed and Cloud Write OFF
        run: |
          set -euo pipefail
          anon="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5")"
          test "$anon" = '401'
          code="$(curl --silent --show-error --output /tmp/write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true||x.schemaMutationFree!==true) process.exit(1)"
          echo 'PRODUCTION_ORDERS_FRESHNESS_GUARD_PASS'

      - name: Roll back Worker code on post-deploy failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        run: |
          set +e
          echo "Post-deploy gate failed. Attempting rollback to $ROLLBACK_VERSION"
          printf 'y\n' | npx wrangler rollback "$ROLLBACK_VERSION" --config cloudflare-d1/wrangler.toml
