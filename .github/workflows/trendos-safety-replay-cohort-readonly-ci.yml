name: TrendOS Safety Replay Cohort Read-Only CI

on:
  push:
    branches:
      - safety-properties-retention-cleanup-audit-20260920
    paths:
      - 'cloudflare-d1/t12-preview/t12-replay-new150-cohort-sheet-preflight-readonly-20260920.gs'
      - 'tests/t12_replay_new150_cohort_sheet_preflight_readonly_20260920.test.mjs'
      - '.github/workflows/trendos-safety-replay-cohort-readonly-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-safety-replay-cohort-readonly-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic read-only cohort tests (no production access)
        run: node tests/t12_replay_new150_cohort_sheet_preflight_readonly_20260920.test.mjs
