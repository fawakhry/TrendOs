name: Autonomous Printshop Design Shadow Activate

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-design-shadow-activate.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-design-shadow-activate
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact control boundary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master
                WHERE type='table'
                  AND name IN (
                    'autonomous_design_control',
                    'autonomous_design_artifacts',
                    'autonomous_design_approval_events',
                    'autonomous_design_preflight_runs',
                    'autonomous_design_asset_binding_events'
                  )) AS designTables,
              (SELECT mode FROM autonomous_design_control WHERE singleton_id=1) AS designMode,
              (SELECT epoch FROM autonomous_design_control WHERE singleton_id=1) AS designEpoch,
              (SELECT mode FROM autonomous_readiness_control WHERE singleton_id=1) AS readinessMode,
              (SELECT mode FROM autonomy_control WHERE singleton_id=1) AS autonomyMode,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          " > /tmp/pre.json
          cat /tmp/pre.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.designTables)!==5) process.exit(1);
          if(!['OFF','SHADOW'].includes(String(r.designMode))) process.exit(2);
          if(String(r.readinessMode)!=='SHADOW') process.exit(3);
          if(String(r.autonomyMode)!=='SHADOW') process.exit(4);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(5);
          if(Number(r.operatorTasks)!==0) process.exit(6);
          console.log('DESIGN_SHADOW_PREFLIGHT=PASS');
          NODE

      - name: Activate Design SHADOW only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --command "
            UPDATE autonomous_design_control
               SET mode='SHADOW',
                   epoch=epoch+1,
                   updated_by='autonomous-printshop-design-shadow',
                   change_reason='DESIGN_EVIDENCE_COLLECTION_SHADOW_ACTIVE',
                   updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
             WHERE singleton_id=1 AND mode='OFF';
          "

      - name: Verify shadow-only activation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT mode FROM autonomous_design_control WHERE singleton_id=1) AS designMode,
              (SELECT epoch FROM autonomous_design_control WHERE singleton_id=1) AS designEpoch,
              (SELECT COUNT(*) FROM autonomous_design_control_events) AS designControlEvents,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks;
          " > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'))?.[0]?.results?.[0]||{};
          if(String(r.designMode)!=='SHADOW') process.exit(1);
          if(Number(r.designEpoch)<2) process.exit(2);
          if(Number(r.designControlEvents)<1) process.exit(3);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(4);
          if(Number(r.operatorTasks)!==0) process.exit(5);
          console.log('DESIGN_CONTROL=SHADOW');
          console.log('OPERATOR_TASK_CONTROL=OFF');
          console.log('LIVE_ASSIGNMENT=NO');
          NODE

      - name: Safety conclusion
        run: |
          echo 'DESIGN_CONTROL=SHADOW'
          echo 'READINESS_CONTROL=SHADOW'
          echo 'AUTONOMY_CONTROL=SHADOW'
          echo 'OPERATOR_TASK_CONTROL=OFF'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
