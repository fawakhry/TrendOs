name: Autonomous Printshop D1 Backfill Readonly Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-d1-backfill-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  readonly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4

      - name: Hard gate — SELECT only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          self='.github/workflows/autonomous-printshop-d1-backfill-readonly-diagnostic.yml'
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|CREATE|DROP|ALTER|PRAGMA|VACUUM)\b' "$self"
          echo 'READONLY_SQL_GATE=PASS'

      - name: Inspect committed backfill runs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config "$CONFIG" --json --command "SELECT run_id AS runId, source_snapshot_sha256 AS sourceSnapshotSha256, mode, status, source_counts_json AS sourceCountsJson, target_counts_json AS targetCountsJson, dedupe_counts_json AS dedupeCountsJson, parity_json AS parityJson, started_at AS startedAt, completed_at AS completedAt FROM employee_zero_google_backfill_runs_v1 ORDER BY completed_at DESC LIMIT 5;" > /tmp/backfill-runs.json
          cat /tmp/backfill-runs.json

      - name: Inspect parity row grouping
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config "$CONFIG" --json --command "SELECT run_id AS runId, COUNT(*) AS total, SUM(CASE WHEN pass=1 THEN 1 ELSE 0 END) AS passed, SUM(CASE WHEN pass<>1 THEN 1 ELSE 0 END) AS failed, MIN(checked_at) AS firstCheckedAt, MAX(checked_at) AS lastCheckedAt FROM employee_zero_google_parity_v1 GROUP BY run_id ORDER BY lastCheckedAt DESC LIMIT 10;" > /tmp/parity-groups.json
          cat /tmp/parity-groups.json

      - name: Inspect latest parity metrics without business data
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config "$CONFIG" --json --command "SELECT run_id AS runId, family, metric, source_value AS sourceValue, target_value AS targetValue, pass, checked_at AS checkedAt FROM employee_zero_google_parity_v1 ORDER BY checked_at DESC LIMIT 50;" > /tmp/parity-metrics.json
          cat /tmp/parity-metrics.json

      - name: Conclusion
        run: |
          echo 'D1_MUTATION=NO'
          echo 'BUSINESS_ROW_CONTENT_READ=NO'
          echo 'BACKFILL_METADATA_ONLY=YES'
