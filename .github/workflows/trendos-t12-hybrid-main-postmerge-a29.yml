name: TrendOS T12 Hybrid Main Post-Merge Qualification A29

on:
  push:
    branches:
      - diagnostic/t12-hybrid-main-postmerge-a29-20260928
    paths:
      - '.github/workflows/trendos-t12-hybrid-main-postmerge-a29.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify exact main-derived frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check trendos-edge-orders-read-v1.js
          node --check config.js
          node tests/t12_hybrid_frontend_fallback.test.mjs
          grep -F "var VERSION = 'EDGE_ORDERS_READ_T12_HYBRID_20260928';" trendos-edge-orders-read-v1.js
          grep -F "var T12_OVERLAY_PATH = '/v1/t12/orders/read-overlay';" trendos-edge-orders-read-v1.js
          grep -F "T12_CLOUD_NATIVE_READ_ONLY" trendos-edge-orders-read-v1.js
          grep -F "apps-script+t12-native" trendos-edge-orders-read-v1.js
          grep -F "trendos-edge-orders-read-v1.js?v=20260928-t12-hybrid-overlay1" config.js
          echo 'POST_MERGE_FRONTEND_QUALIFICATION=PASS'
          echo 'BASE_MAIN_SHA=cdf127629c8bdea1210d304bb8bc460487beca74'
