name: TrendOS T12 A61 Post-Diya OFF Verify TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-post-diya-off-verify-temp.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{}; const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1)process.exit(2);
          console.log('ACTIVE_DEPLOYMENT_ID='+String(d.id));
          console.log('ACTIVE_VERSION_ID='+full[0].id);
          NODE

          curl --compressed --fail --silent --show-error -D /tmp/content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/content.body
          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib
          hs=Path('/tmp/content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'; body=Path('/tmp/content.body').read_bytes(); payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              c=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''; fn=(p.get_filename() or '').lower(); n=(p.get_param('name',header='content-disposition') or '').lower(); t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')): c.append(d)
              if c: payload=max(c,key=len)
          else: payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          print('LIVE_BUNDLE_SHA256='+hashlib.sha256(payload).hexdigest())
          PY

          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"             -o /tmp/settings.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/settings.json','utf8'));
          if(!x||x.success!==true||!x.result)process.exit(3);
          const b=Array.isArray(x.result.bindings)?x.result.bindings:[]; const by=new Map(b.map(v=>[String(v.name||''),v]));
          const val=n=>{const v=by.get(n);return v&&(v.type==='plain_text'||v.type==='json')?String(v.text??v.value??''):'';};
          const requiredFalse=['TRENDOS_EMPLOYEE_AUTH_V1_ENABLED','TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED','TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1','TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED','TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED'];
          for(const n of requiredFalse) if(val(n)!=='false') { console.error('SETTING_NOT_FALSE='+n); process.exit(4); }
          if(val('EMPLOYEE_AUTH_ENROLL_CANARY_USER')!=='')process.exit(5);
          if(val('EMPLOYEE_AUTH_ENROLL_NONCE')!=='')process.exit(6);
          if(val('EMPLOYEE_LEGACY_BRIDGE_ACTIONS')!=='')process.exit(7);
          if(by.has('EMPLOYEE_LEGACY_BRIDGE_SECRET_V1'))process.exit(8);
          console.log('SETTINGS_OFF_STATE=PASS');
          console.log('ENROLLMENT_GATE_DEFAULT_OFF=PASS');
          console.log('BRIDGE_SECRET_PRESENT=NO');
          NODE

          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" > /tmp/auth.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" > /tmp/bridge.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" > /tmp/customer.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" > /tmp/order.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/customer.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/order.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==false||a.enrollCanaryUserConfigured!==false||a.enrollNonceConfigured!==false)process.exit(11);
          if(Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0)process.exit(12);
          if(!b.success||b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0)process.exit(13);
          if(!c.success||c.mode!=='GENERAL'||Number(c.customerCount||0)<247)process.exit(14);
          if(!o.success||o.mode!=='GENERAL')process.exit(15);
          console.log('AUTH_HEALTH=PASS_OFF');
          console.log('NATIVE_USER_COUNT=0');
          console.log('NATIVE_READY_COUNT=0');
          console.log('BRIDGE_HEALTH=PASS_DISABLED');
          console.log('CUSTOMER_MODE='+c.mode);
          console.log('CUSTOMER_COUNT='+Number(c.customerCount||0));
          console.log('ORDER_CREATE_MODE='+o.mode);
          NODE

          cd cloudflare-d1
          npx --yes wrangler@4.33.2 d1 execute trendos-main --remote --config wrangler.toml --json             --command "SELECT marker,mode,policy_epoch FROM employee_auth_control_v1 WHERE singleton=1;" > /tmp/control.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/control.json','utf8')); const found=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk); if(v&&typeof v==='object'){if(v.marker==='T12_EMPLOYEE_AUTH_V1')found.push(v);Object.values(v).forEach(walk)}};
          walk(x); if(found.length!==1||found[0].mode!=='OFF')process.exit(21);
          console.log('D1_AUTH_CONTROL_MODE=OFF');
          console.log('POST_DIYA_OFF_VERIFY=SUCCESS');
          NODE
