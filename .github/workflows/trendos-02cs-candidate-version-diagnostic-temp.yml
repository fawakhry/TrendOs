name: TrendOS 02CS Candidate Version Diagnostic TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-candidate-version-diagnostic-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-candidate-version-diagnostic-temp
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      CANDIDATE_VERSION: 43e14620-35c5-47fb-870e-8eb2d6526ddd
      CANDIDATE_PREVIEW_URL: https://43e14620-trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4

      - name: Static read-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-candidate-version-diagnostic-temp.yml').read_text(encoding='utf-8').splitlines()
          commands=[x.strip() for x in lines if x.lstrip().startswith(('npx ','wrangler '))]
          allowed_prefix='npx --yes wrangler@${WRANGLER_VERSION} versions view '
          bad=[x for x in commands if not x.startswith(allowed_prefix)]
          if bad:
            raise SystemExit('Non-read-only wrangler command found: '+repr(bad))
          print('PERF_CF_02CS_CANDIDATE_DIAGNOSTIC_STATIC_PASS_NO_MUTATION')
          PY

      - name: Confirm production rollback boundary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200);assert.equal(edge.body.success,true);assert.equal(edge.body.database,true);assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200);assert.equal(cloud.body.success,true);assert.equal(cloud.body.cutover,false);assert.equal(cloud.body.sheetsAuthoritative,true);assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200);assert.equal(recon.body.enabled,false);assert.equal(recon.body.genericDrainEnabled,false);
            assert.equal(unauth.status,401);
            console.log('PERF_CF_02CS_POST_ROLLBACK_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Read candidate version metadata only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions view "$CANDIDATE_VERSION" --config cloudflare-d1/wrangler.toml --json > /tmp/version.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));
          const raw=JSON.stringify(x);
          const names=['EDGE_SESSION_SECRET','DB','APPS_SCRIPT_API_URL','CORS_ORIGINS','EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED','TRENDOS_CLOUD_WRITE_V1_ENABLED','TRENDOS_PRODUCTION_SHADOW_V2_ENABLED','TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED'];
          const present={}; for(const n of names) present[n]=raw.includes(n);
          console.log('PERF_CF_02CS_CANDIDATE_VERSION_META='+JSON.stringify({id:x.id||x.version_id||process.env.CANDIDATE_VERSION,bindingNamesPresent:present}));
          NODE

      - name: Candidate preview health and repeated session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.CANDIDATE_PREVIEW_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const token=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          async function jsonFetch(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const h=await jsonFetch(base+'/health',{headers:{accept:'application/json'}});
            const eh=await jsonFetch(base+'/v1/edge/health',{headers:{accept:'application/json'}});
            assert.equal(h.status,200);assert.equal(h.body.success,true);assert.equal(h.body.database,true);
            assert.equal(eh.status,200);assert.equal(eh.body.success,true);assert.equal(eh.body.database,true);assert.equal(eh.body.cutover,false);
            const timings=[];
            for(let i=0;i<3;i++){
              const started=Date.now();
              const s=await jsonFetch(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token})});
              assert.equal(s.status,200,'candidate preview session http');assert.equal(s.body.success,true);assert.ok(s.body.edgeToken);
              timings.push(Date.now()-started);
            }
            console.log('PERF_CF_02CS_CANDIDATE_SESSION_STABILITY_PASS='+JSON.stringify({attempts:3,timingsMs:timings}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Candidate preview full D1 vs Apps Script parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.CANDIDATE_PREVIEW_URL;
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function read(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{throw new Error('invalid JSON http='+r.status)}return{status:r.status,body:b};}
          async function session(){const x=await read(edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body.edgeToken;}
          async function collectEdge(screen,bearer){
            let out=[],page=1,totalPages=1,meta=null;
            do{
              const p=new URLSearchParams({screen,page:String(page),pageSize:'5',statusFilter:'__ACTIVE__'});
              const x=await read(edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
              assert.equal(x.status,200,screen+' edge http');assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
              out.push(...(x.body.rows||[]));totalPages=Number(x.body.pagination&&x.body.pagination.totalPages||1);meta=x.body.mirrors;page++;
            }while(page<=totalPages);
            return {rows:out,mirrors:meta};
          }
          async function collectApps(screen){
            let out=[],page=1,totalPages=1;
            do{
              const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:String(page),pageSize:'5',statusFilter:'__ACTIVE__'};
              const x=await read(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
              assert.equal(x.status,200,screen+' apps http');assert.equal(x.body.success,true);
              out.push(...(x.body.rows||[]));totalPages=Number(x.body.pagination&&x.body.pagination.totalPages||1);page++;
            }while(page<=totalPages);
            return out;
          }
          (async()=>{
            let lastErr=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const bearer=await session();
                const result=[];
                for(const screen of ['print','laser']){
                  const edge=await collectEdge(screen,bearer);
                  const appRows=await collectApps(screen);
                  const ek=edge.rows.map(key), ak=appRows.map(key);
                  assert.deepEqual(ek,ak,screen+' exact Order ID + Line ID + status parity');
                  for(const m of edge.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
                  result.push({screen,totalRows:ek.length,pages:Math.ceil(ek.length/5)});
                }
                const debt=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});
                const d=await read(edgeBase+'/v1/edge/orders/02cr/page?'+debt,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
                assert.equal(d.status,409);assert.equal(d.body.code,'apps-script-required');assert.equal(d.body.fallback,'apps-script');
                console.log('PERF_CF_02CS_CANDIDATE_FULL_PARITY_PASS='+JSON.stringify({attempt,result,debtFallback:true}));
                return;
              }catch(e){lastErr=e;if(attempt<3) await sleep(5000);}
            }
            throw lastErr;
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Conclusion
        run: echo 'PERF_CF_02CS_CANDIDATE_VERSION_FULL_DIAGNOSTIC_PASS_NO_MUTATION'
