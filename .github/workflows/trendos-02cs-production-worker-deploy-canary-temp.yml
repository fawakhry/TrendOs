name: TrendOS 02CS Production Worker Deploy + Canary TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-production-worker-deploy-canary-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-production-worker-deploy-canary-temp
  cancel-in-progress: false

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WRANGLER_VERSION: 4.33.2
      QUALIFIED_02CR_HEAD: c56a8d5c53e3fd149424834ddf64bf6d077cb872

    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static bounded-deploy safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"

          grep -Eq '^name = "trendos-d1-api"$' cloudflare-d1/wrangler.toml
          grep -Eq '^main = "production-shadow/index.js"$' cloudflare-d1/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Fq "edge-orders-read-02cr-canary.mjs" cloudflare-d1/src/index_v2.js
          grep -Fq "D1_ORDERS_READ_02CR_OPERATIONAL_CANARY" cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          ! grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' config.js

          changed_worker="$(git diff --name-only "$QUALIFIED_02CR_HEAD"...HEAD -- cloudflare-d1/ || true)"
          if [ -n "$changed_worker" ]; then
            echo 'Blocked: cloudflare-d1 changed after qualified 02CR head:'
            echo "$changed_worker"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/trendos-02cs-production-worker-deploy-canary-temp.yml')
          s=p.read_text(encoding='utf-8')
          forbidden=[
            'secret'+' put',
            'secret'+' bulk',
            'd1 execute --'+'file',
            'd1 migrations'+' apply',
            '/v1/import/'+'sheet',
            '/v1/mirror/'+'delta',
            '/v1/mirror/'+'heartbeat',
            '/v1/qualification/cloud-write/reconcile/'+'order',
            'TRENDOS_PRODUCTION_'+'CUTOVER',
            'AUTHORITY_'+'CUTOVER',
            'generic outbox'+' drain',
          ]
          for token in forbidden:
            if token in s:
              raise SystemExit('Forbidden mutation token in bounded deploy workflow: '+token)
          deploy='npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare-d1/wrangler.toml'
          actual=sum(1 for line in s.splitlines() if line.strip()==deploy)
          if actual != 1:
            raise SystemExit(f'Expected exactly one controlled Worker deploy command, found {actual}')
          print('PERF_CF_02CS_STATIC_BOUNDED_DEPLOY_PASS')
          PY

      - name: Re-run qualified 02CR contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          echo 'PERF_CF_02CS_02CR_CONTRACTS_PASS'

      - name: Pre-deploy production boundary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){
            const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});
            const t=await r.text(); let b={}; try{b=JSON.parse(t||'{}')}catch{}
            return {status:r.status,body:b};
          }
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false); assert.equal(recon.body.productionCutover,false); assert.equal(recon.body.sheetsAuthoritative,true);
            assert.equal(unauth.status,401);
            const mainCfg=await (await fetch('https://raw.githubusercontent.com/fawakhry/TrendOs/main/config.js',{cache:'no-store'})).text();
            assert.ok(!/MATBAGY_EDGE_ORDERS_READ_V1_ENABLED\s*=\s*true/.test(mainCfg),'main frontend D1 Orders read must remain OFF');
            console.log('PERF_CF_02CS_PRE_BOUNDARY='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401,frontendEdgeRead:false}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Authenticated production canary readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const token=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          (async()=>{
            const r=await fetch(base+'/v1/edge/orders/session',{method:'POST',cache:'no-store',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token})});
            const b=JSON.parse(await r.text()||'{}');
            assert.equal(r.status,200,'edge session http must be 200');
            assert.equal(b.success,true,'edge session must succeed');
            assert.ok(b.edgeToken,'edge token missing');
            const screens=(b.user&&b.user.screens)||[];
            assert.ok(screens.includes('print'),'qualification account must have print');
            assert.ok(screens.includes('laser'),'qualification account must have laser');
            console.log('PERF_CF_02CS_AUTH_READY='+JSON.stringify({screens:screens.filter(x=>['print','laser','service','press'].includes(x))}));
          })().catch(e=>{console.error(e&&e.message||e);process.exit(1)});
          NODE

      - name: Compile exact Worker payload dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trendos-02cs-worker-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config cloudflare-d1/wrangler.toml --outdir /tmp/trendos-02cs-worker-build
          test -d /tmp/trendos-02cs-worker-build
          echo 'PERF_CF_02CS_WORKER_DRY_RUN_PASS'

      - name: Controlled production Worker deploy only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare-d1/wrangler.toml
          echo 'DEPLOYED_02CS=1' >> "$GITHUB_ENV"
          sleep 5
          echo 'PERF_CF_02CS_PRODUCTION_WORKER_DEPLOY_DONE'

      - name: Authenticated D1 vs Apps Script production canary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PROD_URL;
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function read(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{throw new Error('invalid JSON http='+r.status)}return{status:r.status,body:b};}
          (async()=>{
            const session=await read(edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});
            assert.equal(session.status,200); assert.equal(session.body.success,true); assert.ok(session.body.edgeToken);
            const bearer='Bearer '+session.body.edgeToken;
            const results=[];
            for(const screen of ['print','laser']){
              const params=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
              const edge=await read(edgeBase+'/v1/edge/orders/02cr/page?'+params,{headers:{accept:'application/json',authorization:bearer}});
              assert.equal(edge.status,200,screen+' edge http');
              assert.equal(edge.body.success,true,screen+' edge success');
              assert.equal(edge.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
              assert.equal(edge.body.dataSource,'d1-edge-orders-02cr-operational');
              assert.ok(Array.isArray(edge.body.mirrors)&&edge.body.mirrors.length===3,screen+' mirror metadata');
              for(const m of edge.body.mirrors){
                assert.equal(m.status,'ready',screen+' mirror status');
                assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0),screen+' mirror row parity');
              }
              const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};
              const app=await read(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
              assert.equal(app.status,200,screen+' Apps Script http');
              assert.equal(app.body.success,true,screen+' Apps Script success');
              const ek=(edge.body.rows||[]).map(key);
              const ak=(app.body.rows||[]).map(key);
              assert.deepEqual(ek,ak,screen+' exact Order ID + Line ID + status parity');
              assert.equal(Number(edge.body.pagination&&edge.body.pagination.totalRows),Number(app.body.pagination&&app.body.pagination.totalRows),screen+' totalRows parity');
              results.push({screen,totalRows:ek.length,totalPages:Number(edge.body.pagination&&edge.body.pagination.totalPages||0)});
            }
            const debtParams=new URLSearchParams({screen:'print',page:'1',pageSize:'20',statusFilter:'__DEBT__'});
            const debt=await read(edgeBase+'/v1/edge/orders/02cr/page?'+debtParams,{headers:{accept:'application/json',authorization:bearer}});
            assert.equal(debt.status,409); assert.equal(debt.body.code,'apps-script-required'); assert.equal(debt.body.fallback,'apps-script');
            console.log('PERF_CF_02CS_PRODUCTION_CANARY_PASS='+JSON.stringify({results,debtFallback:true}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Final production boundary GET-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function get(path){const r=await fetch(base+path,{cache:'no-store',headers:{accept:'application/json'}});const t=await r.text();let b={};try{b=JSON.parse(t||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{
            const edge=await get('/v1/edge/health');
            const cloud=await get('/v1/cloud/write/health');
            const recon=await get('/v1/qualification/cloud-write/reconcile/health');
            const unauth=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false); assert.equal(recon.body.productionCutover,false); assert.equal(recon.body.sheetsAuthoritative,true);
            assert.equal(unauth.status,401);
            const mainCfg=await (await fetch('https://raw.githubusercontent.com/fawakhry/TrendOs/main/config.js',{cache:'no-store'})).text();
            assert.ok(!/MATBAGY_EDGE_ORDERS_READ_V1_ENABLED\s*=\s*true/.test(mainCfg),'main frontend D1 Orders read changed');
            console.log('PERF_CF_02CS_FINAL_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401,frontendEdgeRead:false}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Automatic rollback on post-deploy failure
        if: ${{ failure() && env.DEPLOYED_02CS == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo '02CS post-deploy verification failed; rolling back to immediately previous Worker version.'
          npx --yes wrangler@${WRANGLER_VERSION} rollback --config cloudflare-d1/wrangler.toml --message "TrendOS 02CS automatic rollback after failed production canary"

      - name: Safety conclusion
        if: ${{ success() }}
        run: |
          echo 'PERF_CF_02CS_WORKER_DEPLOY_CANARY_BOUNDARY_PASS'
          echo 'Frontend D1 Orders read remains OFF. Sheets/Apps Script remain authoritative.'
