
name: TrendOS Entry632 Backend Bridge Off Candidate

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry632-backend-bridge-off-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: trendos-d1-api
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EXPECTED_ACTIVE_VERSION: afff94be-d5e3-4506-a9ff-e48c251e974d

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929

      - name: Capture current deployment and settings
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/deployments" -o /tmp/deploy-pre.json
          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/settings" -o /tmp/settings-pre.json
          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/versions?per_page=100" -o /tmp/versions-pre.json

          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deploy-pre.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/settings-pre.json','utf8'));
          const deps=(d.result&&d.result.deployments)||d.result||[];
          const cur=Array.isArray(deps)?deps[0]:null;
          const full=(cur&&Array.isArray(cur.versions)?cur.versions:[]).filter(v=>Number(v.percentage||0)===100);
          if(full.length!==1) throw new Error('active deployment shape');
          const active=String(full[0].version_id||full[0].id||'');
          if(active!==process.env.EXPECTED_ACTIVE_VERSION) throw new Error('active version drift '+active);

          const bindings=(s.result&&Array.isArray(s.result.bindings))?s.result.bindings:[];
          if(bindings.length!==33) throw new Error('binding count drift '+bindings.length);
          const target=bindings.find(b=>b&&b.name==='TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED');
          if(!target||target.type!=='plain_text'||String(target.text||'')!=='true') throw new Error('bridge binding drift');
          if(bindings.filter(b=>b&&String(b.type||'').includes('secret')).length!==5) throw new Error('secret binding count drift');
          if(!bindings.some(b=>b&&b.name==='DB')) throw new Error('DB binding missing');

          const v=JSON.parse(fs.readFileSync('/tmp/versions-pre.json','utf8'));
          const vr=v.result;
          const versions=Array.isArray(vr)?vr:
            (vr&&Array.isArray(vr.versions)?vr.versions:
            (vr&&Array.isArray(vr.items)?vr.items:[]));
          if(!versions.length) throw new Error('version list shape unsupported');
          const ids=versions.map(x=>String(x.id||'')).filter(Boolean);
          if(!ids.length||ids[0]!==active) throw new Error('latest version is not active: '+String(ids[0]||''));
          fs.writeFileSync('/tmp/version-ids-pre.json',JSON.stringify(ids));
          console.log('ENTRY632_CANDIDATE_PREFLIGHT=PASS');
          console.log('ENTRY632_ACTIVE_VERSION='+active);
          console.log('ENTRY632_ACTIVE_BINDINGS=33');
          console.log('ENTRY632_ACTIVE_SECRET_BINDINGS=5');
          NODE

      - name: Create undeployed bridge-off settings version
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/settings-pre.json','utf8')).result||{};
          const bindings=Array.isArray(s.bindings)?s.bindings:[];
          const active=process.env.EXPECTED_ACTIVE_VERSION;
          const out=bindings.map(b=>{
            if(b.name==='TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED'){
              return {name:b.name,type:'plain_text',text:'false'};
            }
            return {name:b.name,type:'inherit',version_id:'latest'};
          });
          const settings={
            bindings:out,
            annotations:{
              "workers/message":"Entry632 candidate: backend legacy bridge OFF only"
            }
          };
          fs.writeFileSync('/tmp/settings-patch.json',JSON.stringify(settings));
          console.log('ENTRY632_PATCH_BINDINGS='+out.length);
          console.log('ENTRY632_PATCH_SECRET_VALUES_INCLUDED=NO');
          NODE

          HTTP="$(curl --silent --show-error -o /tmp/patch-response.json -w '%{http_code}' \
            "${AUTH[@]}" \
            -X PATCH "$BASE/settings" \
            -F 'settings=</tmp/settings-patch.json;type=application/json')"
          echo "ENTRY632_SETTINGS_PATCH_HTTP=$HTTP"
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/patch-response.json','utf8')||'{}');
          for(const e of (x.errors||[])) console.log('ENTRY632_CLOUDFLARE_ERROR='+String(e&&e.code||'')+':'+String(e&&e.message||''));
          for(const m of (x.messages||[])) console.log('ENTRY632_CLOUDFLARE_MESSAGE='+String(m&&m.code||'')+':'+String(m&&m.message||''));
          NODE
          test "$HTTP" -ge 200
          test "$HTTP" -lt 300

          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/versions?per_page=100" -o /tmp/versions-post.json
          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/deployments" -o /tmp/deploy-after-candidate.json

          node <<'NODE'
          const fs=require('fs');
          const pre=new Set(JSON.parse(fs.readFileSync('/tmp/version-ids-pre.json','utf8')));
          const raw=JSON.parse(fs.readFileSync('/tmp/versions-post.json','utf8')).result;
          const post=Array.isArray(raw)?raw:
            (raw&&Array.isArray(raw.versions)?raw.versions:
            (raw&&Array.isArray(raw.items)?raw.items:[]));
          if(!post.length) throw new Error('post version list shape unsupported');
          const fresh=post.filter(v=>v&&v.id&&!pre.has(String(v.id)));
          if(fresh.length!==1) throw new Error('expected exactly one new candidate version; got '+fresh.length);
          const candidate=String(fresh[0].id);

          const d=JSON.parse(fs.readFileSync('/tmp/deploy-after-candidate.json','utf8'));
          const deps=(d.result&&d.result.deployments)||d.result||[];
          const cur=Array.isArray(deps)?deps[0]:null;
          const full=(cur&&Array.isArray(cur.versions)?cur.versions:[]).filter(v=>Number(v.percentage||0)===100);
          if(full.length!==1||String(full[0].version_id||full[0].id||'')!==process.env.EXPECTED_ACTIVE_VERSION){
            throw new Error('candidate unexpectedly changed live deployment');
          }
          fs.writeFileSync('/tmp/candidate-version.txt',candidate);
          console.log('ENTRY632_CANDIDATE_VERSION='+candidate);
          console.log('ENTRY632_CANDIDATE_DEPLOYED=NO');
          NODE

      - name: Verify candidate exact code and bindings
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          CANDIDATE="$(cat /tmp/candidate-version.txt)"

          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/versions/$EXPECTED_ACTIVE_VERSION" -o /tmp/active-version.json
          curl --fail --silent --show-error "${AUTH[@]}" "$BASE/versions/$CANDIDATE" -o /tmp/candidate-version.json

          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/active-version.json','utf8')).result||{};
          const c=JSON.parse(fs.readFileSync('/tmp/candidate-version.json','utf8')).result||{};
          const ar=a.resources||{},cr=c.resources||{};
          const ae=String(ar.script&&ar.script.etag||'');
          const ce=String(cr.script&&cr.script.etag||'');
          if(!ae||ae!==ce) throw new Error('script etag mismatch');

          const ab=Array.isArray(ar.bindings)?ar.bindings:[];
          const cb=Array.isArray(cr.bindings)?cr.bindings:[];
          if(ab.length!==33||cb.length!==33) throw new Error('version binding count mismatch');

          const names=x=>x.map(b=>String(b&&b.name||'')).filter(Boolean).sort();
          if(JSON.stringify(names(ab))!==JSON.stringify(names(cb))) throw new Error('binding name set mismatch');
          const target=cb.find(b=>b&&b.name==='TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED');
          if(!target||target.type!=='plain_text'||String(target.text||'')!=='false') throw new Error('candidate bridge binding is not false');
          if(cb.filter(b=>b&&String(b.type||'').includes('secret')).length!==5) throw new Error('candidate secret count mismatch');
          if(!cb.some(b=>b&&b.name==='DB')) throw new Error('candidate DB binding missing');

          console.log('ENTRY632_CANDIDATE_CODE_ETAG_MATCH=PASS');
          console.log('ENTRY632_CANDIDATE_BINDING_NAMES_MATCH=PASS');
          console.log('ENTRY632_CANDIDATE_BINDING_COUNT=33');
          console.log('ENTRY632_CANDIDATE_SECRET_BINDINGS=5');
          console.log('ENTRY632_CANDIDATE_DB_BINDING_PRESENT=YES');
          console.log('ENTRY632_CANDIDATE_BRIDGE_ENABLED=false');
          console.log('ENTRY632_CANDIDATE_SECRET_VALUES_LOGGED=NO');
          NODE

      - name: Final live no-mutation proof
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/v1/employee/legacy-action/health?entry632candidate=$GITHUB_SHA" -o /tmp/live-bridge.json
          node <<'NODE'
          const b=require('/tmp/live-bridge.json');
          if(b.enabled!==true||Number(b.allowedPolicyCount||0)!==17) throw new Error('live bridge changed unexpectedly');
          console.log('ENTRY632_CANDIDATE_GATE=PASS');
          console.log('ENTRY632_LIVE_BRIDGE_STILL_ON=YES');
          console.log('ENTRY632_PRODUCTION_MUTATION=NO');
          NODE
