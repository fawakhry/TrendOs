name: TrendOS Entry663 Native Customer Password OFF — SQLite
on:
  push:
    branches:
      - feat/zero-google-native-customer-password-change-off-20261020
  pull_request:
    paths:
      - 'cloudflare-d1/src/customer-portal-native-change-password-v0.mjs'
      - 'tests/entry663_customer_native_change_password_off.test.mjs'
      - 'tests/entry663_customer_native_change_password_sqlite.test.py'
      - '.github/workflows/trendos-entry663-customer-native-password-off-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-customer-password-rotation-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PBKDF2/HMAC and session scoped CAS Node tests
        env:
          CLOUDFLARE_API_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/customer-portal-native-change-password-v0.mjs
          node --test tests/entry663_customer_native_change_password_off.test.mjs
          node --test tests/entry662_customer_native_login_off.test.mjs
          node --test tests/entry661_customer_native_logout_off.test.mjs
          node --test tests/entry660_customer_native_orders_off.test.mjs
      - name: Real native SQL on disposable SQLite across all four actions
        run: |
          set -euo pipefail
          python3 tests/entry663_customer_native_change_password_sqlite.test.py -v
          python3 tests/entry662_customer_native_login_sqlite.test.py -v
          python3 tests/entry661_customer_native_logout_sqlite.test.py -v
          python3 tests/entry660_customer_native_orders_sqlite.test.py -v
      - name: Existing employee Legacy guard stays intact
        run: |
          set -euo pipefail
          node tests/entry653_zero_google_employee_legacy_proxy_retirement.test.mjs
      - name: Native source-only release status
        run: |
          echo 'CUSTOMER_NATIVE_PASSWORD_CHANGE=SOURCE_ONLY'
          echo 'NATIVE_CUSTOMER_HTTP_ENDPOINTS=NOT_WIRED'
          echo 'ENTRY660_661_662_663_SOURCE_TESTED=YES'
          echo 'CUSTOMER_GOOGLE_ACTIONS_DECOMMISSIONED=ZERO'
          echo 'OTP_ENROLLMENT_LIVE=NO'
          echo 'CLOUDFLARE_DEPLOY=NO'
          echo 'PRODUCTION_GO=NO'
