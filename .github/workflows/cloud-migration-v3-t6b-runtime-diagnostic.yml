name: TrendOS Cloud Migration V3 T6B Runtime Diagnostic

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t6b-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-cloud-migration-v3-t6b-runtime-diagnostic
  cancel-in-progress: false

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      APPS_SCRIPT_API_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime diagnostic safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"
          grep -Eq '^TRENDOS_CLOUD_AUTH_SHADOW_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_AUTH_SHADOW_DIAGNOSTIC_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          test ! -f cloudflare-d1/migrations/0005_operator_task_v3_read_projection.sql
          echo 'T6B_RUNTIME_DIAG_SAFETY=PASS'

      - name: Fresh qualification session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const r=await fetch(process.env.APPS_SCRIPT_API_URL,{method:'POST',redirect:'follow',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:String(process.env.QUALIFY_USERNAME||'').trim(),password:String(process.env.QUALIFY_PASSWORD||'')})});
            const raw=await r.text();let body={};try{body=JSON.parse(raw||'{}')}catch{}
            const token=String(body&&body.user&&body.user.token||'').trim();
            if(r.status!==200||body.success!==true||!token)process.exit(1);
            console.log('::add-mask::'+token);fs.writeFileSync('/tmp/t6b-diag-token',token,{mode:0o600});console.log('T6B_RUNTIME_DIAG_LOGIN=PASS');
          })().catch(()=>process.exit(1));
          NODE

      - name: Deploy diagnostic T6B Worker
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml | tee /tmp/t6b-runtime-deploy.txt
          echo 'T6B_RUNTIME_DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 4

      - name: One authenticated shadow-population probe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const token=fs.readFileSync('/tmp/t6b-diag-token','utf8').trim();
            const r=await fetch(String(process.env.PROD_URL).replace(/\/$/,'')+'/v1/edge/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username:String(process.env.QUALIFY_USERNAME||'').trim(),token})});
            const raw=await r.text();let body={};try{body=JSON.parse(raw||'{}')}catch{}
            const diag=body&&body.authShadowDiagnostic||{};
            console.log('T6B_RUNTIME_DIAG_RESULT='+JSON.stringify({status:r.status,success:body.success===true,authSource:String(body.authSource||''),lookup:String(diag.lookup||''),store:String(diag.store||'')}));
            if(r.status!==200||body.success!==true)process.exit(1);
            if(!diag.lookup||!diag.store)process.exit(2);
          })().catch(()=>process.exit(1));
          NODE

      - name: Read row count after probe
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config wrangler.toml --json --command "SELECT COUNT(*) AS total_rows FROM cloud_auth_sessions_v1" > /tmp/t6b-runtime-rows.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/t6b-runtime-rows.json','utf8'));let r=null;(function w(v){if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if('total_rows'in v)r=v;Object.values(v).forEach(w)}})(x);if(!r)process.exit(1);console.log('T6B_RUNTIME_DIAG_ROWS='+Number(r.total_rows||0))"

      - name: Always rollback diagnostic Worker
        if: ${{ always() && env.T6B_RUNTIME_DEPLOYED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} rollback --config wrangler.toml --message "End T6B runtime diagnostic; restore T6A"
          echo 'T6B_RUNTIME_DIAG_ROLLBACK=PASS'

      - name: Cleanup token
        if: ${{ always() }}
        run: rm -f /tmp/t6b-diag-token
