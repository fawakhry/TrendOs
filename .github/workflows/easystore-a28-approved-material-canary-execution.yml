name: EasyStore A2.8 Approved Material Canary Execution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/a28-one-shot-trigger'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-qualified-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch qualified candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/workflows/easystore-a28-approved-material-canary-execution.yml/dispatches"             -f ref='candidate/easystore-accounting-a2-20261005'
          echo "A28_DISPATCH_TARGET=candidate/easystore-accounting-a2-20261005"
          echo "A28_DISPATCH_CONTROL_PLANE_ONLY=YES"
          echo "PRODUCTION_BUSINESS_MUTATION=NO"
