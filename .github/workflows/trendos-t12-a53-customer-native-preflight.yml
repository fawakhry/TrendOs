name: TrendOS T12 A53 Customer Native Preflight

on:
  push:
    branches:
      - candidate/t12-customer-native-a53-20260929
    paths:
      - '.github/workflows/trendos-t12-a53-customer-native-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.142.0
      - name: Read-only production customer audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --json --command             "SELECT COUNT(*) AS normalized_customers FROM customers;              SELECT sheet_name,row_count,source_last_row,source_last_col,status,synced_at,note,headers_json FROM sheet_catalog WHERE sheet_name='العملاء' LIMIT 1;              SELECT COUNT(*) AS customer_mirror_rows FROM sheet_rows WHERE sheet_name='العملاء';              SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 't12%customer%' ORDER BY name;"             > /tmp/a53.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/a53.json','utf8'));
          const sets=Array.isArray(x)?x:[x];
          const resultSets=[];
          for(const item of sets){
            if(item && Array.isArray(item.results)) resultSets.push(item.results);
          }
          const flat=resultSets.flat();
          const normalized=flat.find(r=>Object.prototype.hasOwnProperty.call(r,'normalized_customers'))||{};
          const catalog=flat.find(r=>r.sheet_name==='العملاء')||{};
          const mirror=flat.find(r=>Object.prototype.hasOwnProperty.call(r,'customer_mirror_rows'))||{};
          const t12=flat.filter(r=>String(r.name||'').includes('customer'));
          const out={
            normalizedCustomers:Number(normalized.normalized_customers||0),
            mirrorRows:Number(mirror.customer_mirror_rows||0),
            catalog:{
              rowCount:Number(catalog.row_count||0),
              sourceLastRow:Number(catalog.source_last_row||0),
              sourceLastCol:Number(catalog.source_last_col||0),
              status:String(catalog.status||''),
              syncedAt:String(catalog.synced_at||''),
              note:String(catalog.note||''),
              headers:JSON.parse(catalog.headers_json||'[]')
            },
            existingT12CustomerTables:t12.map(r=>r.name)
          };
          console.log('A53_CUSTOMER_NATIVE_PREFLIGHT='+JSON.stringify(out));
          if(out.catalog.status!=='ready') process.exit(1);
          if(out.catalog.rowCount!==out.catalog.sourceLastRow) process.exit(1);
          if(out.mirrorRows!==out.catalog.rowCount) process.exit(1);
          console.log('A53_PREFLIGHT=PASS');
          console.log('PRODUCTION_MUTATION=NO');
          NODE
      - name: Audit safe customer identity collisions
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --json --command             "SELECT row_number,display_json FROM sheet_rows WHERE sheet_name='العملاء' ORDER BY row_number;" > /tmp/a53_customer_rows.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/a53_customer_rows.json','utf8'));
          const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v?.results)?v.results:[]);
          const normalizeArabic=v=>String(v??'').trim().toLowerCase().replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[ةه]/g,'ه').replace(/\s+/g,' ').trim();
          const cleanPhone=v=>{
            let d=String(v??'').replace(/[^0-9]/g,'');
            if(d.startsWith('0020')) d=d.slice(2);
            if(d.startsWith('20')&&d.length===12)d='0'+d.slice(2);
            if(/^1[0125]\d{8}$/.test(d))d='0'+d;
            return d;
          };
          const header=JSON.parse(rows.find(r=>Number(r.row_number)===1)?.display_json||'[]');
          const idx=(names,fb=-1)=>{for(const n of names){const i=header.lastIndexOf(n);if(i>=0)return i;}return fb};
          const ni=idx(['اسم الشات / المكتب','اسم العميل','Customer Name'],0);
          const pi=idx(['رقم العميل الأساسي','رقم العميل','رقم الهاتف','Phone'],-1);
          const xi=idx(['رقم إضافي','رقم إضافى','Extra Phone'],-1);
          const ai=idx(['مفعل؟','مفعل','Active'],-1);
          const names=new Map(), phones=new Map();
          let customers=0,active=0,inactive=0,noPhone=0;
          for(const r of rows){
            if(Number(r.row_number)<=1)continue;
            const a=JSON.parse(r.display_json||'[]');
            const name=normalizeArabic(a[ni]);
            const phone=cleanPhone(pi>=0?a[pi]:'');
            const extra=cleanPhone(xi>=0?a[xi]:'');
            if(!name&&!phone&&!extra)continue;
            customers++;
            const av=String(ai>=0?a[ai]:'').trim();
            if(!av||av==='نعم')active++; else inactive++;
            if(!phone&&!extra)noPhone++;
            if(name) names.set(name,(names.get(name)||0)+1);
            for(const p of [phone,extra].filter(Boolean)) phones.set(p,(phones.get(p)||0)+1);
          }
          const duplicateNames=[...names.values()].filter(v=>v>1).length;
          const duplicatePhones=[...phones.values()].filter(v=>v>1).length;
          console.log('A53_IDENTITY_AUDIT='+JSON.stringify({customers,active,inactive,noPhone,duplicateNames,duplicatePhones}));
          if(duplicateNames||duplicatePhones) console.log('A53_IDENTITY_COLLISIONS_REQUIRE_MERGE_POLICY=YES');
          else console.log('A53_IDENTITY_COLLISIONS_REQUIRE_MERGE_POLICY=NO');
          console.log('PRODUCTION_MUTATION=NO');
          NODE
