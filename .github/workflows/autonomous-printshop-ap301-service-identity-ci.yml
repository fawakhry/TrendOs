name: AP-301 Service Reader Identity Synthetic CI

on:
  push:
    branches:
      - feature/ap301-multiservice-reader-identity-20261016
    paths:
      - autonomous-printshop/print-server/src/trendos_service_identity_plan.py
      - autonomous-printshop/print-server/tests/test_ap301_service_identity_plan_synthetic.py
      - .github/workflows/autonomous-printshop-ap301-service-identity-ci.yml
  pull_request:
    paths:
      - autonomous-printshop/print-server/src/trendos_service_identity_plan.py
      - autonomous-printshop/print-server/tests/test_ap301_service_identity_plan_synthetic.py
      - .github/workflows/autonomous-printshop-ap301-service-identity-ci.yml

permissions:
  contents: read

jobs:
  fake-service-identity-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fake-only service identity and prior scope regressions
        working-directory: autonomous-printshop/print-server
        run: |
          python -m py_compile src/trendos_service_identity_plan.py tests/test_ap301_service_identity_plan_synthetic.py
          python -B -m unittest discover -s tests -p 'test_ap301_service_identity_plan_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap299_multiservice_scope_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap298_print_scope_gate_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap296_trendos_shadow_schema_synthetic.py' -v
          echo 'AP301_PROPOSED_IDENTITY=FAKE_ONLY; ACTIVE_ACCOUNT=NO; REAL_ROLE=UNVERIFIED'
          echo 'SECRETS_IMPORTED=NO; EXTERNAL_API=OFF; UBUNTU_CHANGED=NO; PRINTING=OFF'
