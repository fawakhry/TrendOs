name: EasyStore A2 Write Canary Preflight
# Rerun marker after Production A2 schema apply 0020..0028

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a2-write-canary-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Verify Production remains READONLY and frontend writes are off
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27pre=$GITHUB_SHA" > /tmp/accounting-health.json
          curl --fail --silent --show-error --location "$EASYSTORE_URL/config.js?a27pre=$GITHUB_SHA" > /tmp/es-config.js

          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/accounting-health.json','utf8'));
          const cfg=fs.readFileSync('/tmp/es-config.js','utf8');
          if(h.mode!=='READONLY') throw new Error('accounting-runtime-not-readonly');
          if(h.authoritativeWrites!==false) throw new Error('accounting-writes-already-authoritative');
          if(h.schemaReady!==true) throw new Error('base-accounting-schema-not-ready');
          if(Number(h.googleBusinessCalls||0)!==0) throw new Error('google-business-call-drift');
          const m=cfg.match(/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*(true|false)/);
          if(m && m[1]!=='false') throw new Error('live-easystore-write-flag-must-be-off');
          console.log('A2_7_RUNTIME_MODE=READONLY');
          console.log('A2_7_AUTHORITATIVE_WRITES=NO');
          console.log('A2_7_LIVE_EASYSTORE_WRITE_FLAG='+(m?m[1]:'ABSENT_SAFE'));
          console.log('A2_7_GOOGLE_BUSINESS_CALLS=0');
          NODE

      - name: Verify complete A2 Production schema
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local label="$1"
            local sql="$2"
            local expected="$3"
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "$sql" > "/tmp/$label.json"
            node - "$label" "$expected" "/tmp/$label.json" <<'NODE'
          const fs=require('fs');
          const label=process.argv[2], expected=Number(process.argv[3]), path=process.argv[4];
          const x=JSON.parse(fs.readFileSync(path,'utf8')), vals=[];
          const walk=v=>{
            if(Array.isArray(v)) return v.forEach(walk);
            if(v&&typeof v==='object'){
              if(v.n!==undefined) vals.push(Number(v.n));
              Object.values(v).forEach(walk);
            }
          };
          walk(x);
          if(vals.length!==1 || vals[0]!==expected) throw new Error(label+' expected='+expected+' actual='+JSON.stringify(vals));
          console.log('A2_7_SCHEMA_'+label.toUpperCase()+'=PASS');
          NODE
          }

          q tables "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name IN (
            'employee_accounting_parties_v1',
            'employee_accounting_purchase_invoices_v1',
            'employee_accounting_daily_purchases_v1',
            'employee_accounting_cashbox_v1',
            'employee_accounting_waste_v1',
            'employee_accounting_custody_events_v1',
            'employee_accounting_custody_closes_v1',
            'employee_accounting_day_closes_v1',
            'employee_accounting_party_balances_v1',
            'employee_accounting_tx_guard_v1'
          );" 10

          q materials_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_materials_v1') WHERE name IN ('raw_width','raw_height');" 2
          q dept_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_dept_lines_v1') WHERE name='work_date';" 1
          q party_ledger_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_party_ledger_v1') WHERE name='party_id';" 1
          q request_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_request_ledger_v1') WHERE name IN ('request_hash','source_system','correlation_id','evidence_refs_json','policy_epoch','command_version');" 6
          q event_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_events_v1') WHERE name IN ('request_key','correlation_id','source_system','evidence_refs_json','policy_epoch','autonomy_level');" 6
          q final_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_final_invoices_v1') WHERE name IN ('work_date','customer_party_id','version','held_paid','replacement_invoice_no','reversed_at_ms','reversed_by','reversal_reason','reversal_ref','manual_cost');" 10
          q day_close_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_day_closes_v1') WHERE name IN ('report_hash','blockers_json');" 2

      - name: Snapshot sanitized accounting row counts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events;
          " > /tmp/a27-counts.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/a27-counts.json','utf8')), rows=[];
          const walk=v=>{
            if(Array.isArray(v)) return v.forEach(walk);
            if(v&&typeof v==='object'){
              if(v.materials!==undefined) rows.push(v);
              Object.values(v).forEach(walk);
            }
          };
          walk(x);
          if(rows.length!==1) throw new Error('count-snapshot-parse');
          const r=rows[0];
          for(const [k,v] of Object.entries(r)) console.log('A2_7_COUNT_'+k+'='+Number(v));
          console.log('A2_7_ACCOUNTING_ROW_COUNT_SNAPSHOT=PASS');
          NODE

      - name: Final fail-closed preflight marker
        run: |
          echo A2_7_WRITE_CANARY_PREFLIGHT=PASS
          echo A2_7_SCHEMA_READY=YES
          echo A2_7_RUNTIME_STILL_READONLY=YES
          echo A2_7_PRODUCTION_MUTATION=NO
