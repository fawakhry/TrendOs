name: TrendOS Entry619 Accounting Post-Success Reconcile

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry619-postsuccess-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      EXPECTED_API_VERSION: de2c825d-ef63-407d-90dc-8059a9d4f192
      EXPECTED_FRONTEND_VERSION: 494d279f-5f5a-4271-b1c0-be5997615501

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Reconcile current Production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json > /tmp/api.json
          npx wrangler deployments list --name trendos-ui --json > /tmp/ui.json
          node <<'NODE'
          const fs=require('fs');
          function active(path,label,expected){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
            if(full.length!==1||full[0].id!==expected) throw new Error(label+' version drift');
            console.log('ENTRY619_RECONCILE_'+label+'_VERSION='+full[0].id);
          }
          active('/tmp/api.json','API',process.env.EXPECTED_API_VERSION);
          active('/tmp/ui.json','FRONTEND',process.env.EXPECTED_FRONTEND_VERSION);
          NODE

          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry619reconcile=$GITHUB_SHA" -o "/tmp/$f.json"
          done
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health?entry619reconcile=$GITHUB_SHA" -o /tmp/orders.json
          curl --fail --silent --show-error "$API_URL/v1/t12/customers/write/health?entry619reconcile=$GITHUB_SHA" -o /tmp/customers.json
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/line-runtime/health?entry619reconcile=$GITHUB_SHA" -o /tmp/line.json
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry619reconcile=$GITHUB_SHA" -o /tmp/config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry619reconcile=$GITHUB_SHA" -o /tmp/dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry619reconcile=$GITHUB_SHA" -o /tmp/edge.js

          node <<'NODE'
          const fs=require('fs'), read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const auth=read('/tmp/auth.json'), bridge=read('/tmp/legacy-action.json');
          const ops=read('/tmp/ops.json'), acc=read('/tmp/accounting.json');
          if(auth.mode!=='OFF'||auth.envEnabled!==false) throw new Error('auth drift');
          if(bridge.enabled!==false||bridge.secretConfigured!==false||Number(bridge.allowedPolicyCount||0)!==0) throw new Error('bridge drift');
          if(ops.mode!=='GENERAL'||Number(ops.policyEpoch||0)!==7||ops.schemaReady!==true||Number(ops.googleBusinessCalls||0)!==0||ops.appsScriptBusinessAuthority!==false) throw new Error('ops drift');
          if(acc.mode!=='READONLY'||Number(acc.policyEpoch||0)!==2||acc.schemaReady!==true||acc.authoritativeWrites!==false||Number(acc.googleBusinessCalls||0)!==0||acc.appsScriptBusinessAuthority!==false) throw new Error('accounting drift');
          for(const f of ['content','comms','core']) if(read('/tmp/'+f+'.json').mode!=='OFF') throw new Error(f+' drift');
          const o=read('/tmp/orders.json'), c=read('/tmp/customers.json'), l=read('/tmp/line.json');
          if(o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders drift');
          if(c.mode!=='GENERAL') throw new Error('customers drift');
          if(l.writeMode!=='cloud-native+legacy-overlay'||l.schemaReady!==true||l.legacySchemaReady!==true) throw new Error('line drift');
          const cfg=fs.readFileSync('/tmp/config.js','utf8'), disp=fs.readFileSync('/tmp/dispatcher.js','utf8'), edge=fs.readFileSync('/tmp/edge.js','utf8');
          if(!cfg.includes("MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'GENERAL'")) throw new Error('ops frontend drift');
          if(!cfg.includes("MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE = 'READONLY'")) throw new Error('accounting frontend drift');
          if(!cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false')||!cfg.includes('MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false')) throw new Error('auth bridge frontend drift');
          if(cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1')||disp.includes('canaryRouteEnabled')) throw new Error('entry611 canary drift');
          if(!disp.includes('T12_ENTRY619_ACCOUNTING_READONLY_V1_20261004')||!disp.includes('shouldRouteAccountingNative')||!disp.includes('shouldRouteOpsNative')) throw new Error('dispatcher drift');
          if(!edge.includes('postWriteBarrierRecoveries')||!edge.includes('recoverPostWriteBarrier')) throw new Error('refresh fix drift');
          console.log('ENTRY619_POSTSUCCESS_RECONCILE=PASS');
          console.log('ENTRY619_OPS=GENERAL_EPOCH_7');
          console.log('ENTRY619_ACCOUNTING=READONLY_EPOCH_2');
          console.log('ENTRY619_AUTH=OFF');
          console.log('ENTRY619_BRIDGE=OFF');
          console.log('ENTRY619_CONTENT=OFF');
          console.log('ENTRY619_COMMS=OFF');
          console.log('ENTRY619_CORE=OFF');
          console.log('ENTRY619_ORDERS_CUSTOMERS_LINE=PASS');
          console.log('ENTRY619_REFRESH_FIX=PASS');
          console.log('ENTRY619_ENTRY611_CANARY_DEPLOYED=NO');
          NODE
