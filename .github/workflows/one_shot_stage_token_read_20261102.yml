name: ONE SHOT Customer Stage Service Token Read-Only Verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_stage_token_read_20261102.yml'
permissions:
  contents: read
jobs:
  stage-service-token-metadata-read:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-service-token-read-verify-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN }}
      CF_STAGE_ACCESS_CLIENT_ID: ${{ secrets.CF_STAGE_ACCESS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only exact dedicated Service Token ID match
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = 'ops/customer-stage-service-token-read-verify-20261102'
          python3 -m py_compile tools/one_shot_stage_token_meta_read_20261102.py
          python3 tools/one_shot_stage_token_meta_read_20261102.py
