name: TrendOS 02CU Resume No Auto Refresh Production TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cu-resume-no-autorefresh-prod-temp.yml'

permissions:
  contents: write

jobs:
  bounded-production-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact production boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "296fce971c52a7338a0ce1ded4c44b773af62d01"
          grep -Fq 'MATBAGY_EDGE_ORDERS_MAX_MIRROR_AGE_MS = 5 * 60 * 1000' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_CONCURRENCY = 2' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_ATTEMPTS = 1' config.js
          grep -Fq 'MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false' config.js
          grep -Fq 'MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false' config.js
          echo TRENDOS_02CU_RESUME_PREBOUNDARY_PASS

      - name: Import qualified resume hotfix only
        run: |
          set -euo pipefail
          git fetch origin agent/go-live-2026-09-01-integrity --depth=1
          git show origin/agent/go-live-2026-09-01-integrity:trendos-resume-no-autorefresh-v1.js > trendos-resume-no-autorefresh-v1.js
          node --check trendos-resume-no-autorefresh-v1.js
          grep -Fq 'TRENDOS_RESUME_NO_AUTO_REFRESH_V1_20260906' trendos-resume-no-autorefresh-v1.js
          grep -Fq "this.id === 'refreshBtn' && isLegacySafeRefreshStack()" trendos-resume-no-autorefresh-v1.js

      - name: Enable only the resume guard and bust frontend cache
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js'); s=p.read_text(encoding='utf-8')
          if 'trendResumeNoAutoRefreshV1Loader' not in s:
              anchor="trendLoadModuleV1932('trendEdgeOrdersReadV1Loader','trendos-edge-orders-read-v1.js?v=20260906-02cu-fresh1');\n"
              insert=anchor+"\n// 02CU resume guard: returning to the platform must not trigger legacy safeRefresh.\nwindow.MATBAGY_DISABLE_RETURN_AUTO_REFRESH_V1 = true;\ntrendLoadModuleV1932('trendResumeNoAutoRefreshV1Loader','trendos-resume-no-autorefresh-v1.js?v=20260906a');\n"
              if anchor not in s: raise SystemExit('qualified Edge loader anchor missing')
              s=s.replace(anchor,insert,1)
          p.write_text(s,encoding='utf-8')

          old='trendos-02cu-freshness-20260906a'
          new='trendos-02cu-resume-20260906a'
          for path in ['index.html','reset-cache.html']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'cache baseline missing in {path}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Scope and regression guard
        run: |
          set -euo pipefail
          grep -Fq 'window.MATBAGY_DISABLE_RETURN_AUTO_REFRESH_V1 = true' config.js
          grep -Fq "trendLoadModuleV1932('trendResumeNoAutoRefreshV1Loader','trendos-resume-no-autorefresh-v1.js?v=20260906a');" config.js
          grep -Fq 'trendos-02cu-resume-20260906a' index.html
          grep -Fq 'trendos-02cu-resume-20260906a' reset-cache.html
          grep -Fq 'MATBAGY_EDGE_ORDERS_MAX_MIRROR_AGE_MS = 5 * 60 * 1000' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_CONCURRENCY = 2' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_ATTEMPTS = 1' config.js
          grep -Fq 'MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false' config.js
          grep -Fq 'MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false' config.js
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'config.js\nindex.html\nreset-cache.html\ntrendos-resume-no-autorefresh-v1.js'
          if git diff --name-only | grep -Eq '\.gs$|cloudflare-d1/src/'; then echo forbidden-backend-change; exit 1; fi
          echo TRENDOS_02CU_RESUME_SCOPE_PASS

      - name: Commit production frontend hotfix
        run: |
          set -euo pipefail
          git config user.name 'trendos-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js index.html reset-cache.html trendos-resume-no-autorefresh-v1.js
          git commit -m 'Stop automatic data refresh when returning to TrendOS'
          git push origin HEAD:main
          echo "TRENDOS_02CU_RESUME_PROD_COMMIT=$(git rev-parse HEAD)"

      - name: Verify published assets
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            cfg="$(curl -fsSL --max-time 12 "https://fawakhry.github.io/TrendOs/config.js?t=$(date +%s)" || true)"
            js="$(curl -fsSL --max-time 12 "https://fawakhry.github.io/TrendOs/trendos-resume-no-autorefresh-v1.js?t=$(date +%s)" || true)"
            if printf '%s' "$cfg" | grep -Fq 'trendResumeNoAutoRefreshV1Loader' && printf '%s' "$js" | grep -Fq 'TRENDOS_RESUME_NO_AUTO_REFRESH_V1_20260906'; then
              echo TRENDOS_02CU_RESUME_PUBLISHED_PASS
              exit 0
            fi
            sleep 10
          done
          echo 'published assets did not propagate'; exit 1
