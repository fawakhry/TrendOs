name: TrendOS Cloud Write Order Contract V2 Gate

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/cloud-write-order-contract-v2.mjs'
      - 'cloudflare-d1/src/cloud-write-order-contract-v2-staging.mjs'
      - 'cloudflare-d1/src/cloud-write-order-v2-staging-bridge.mjs'
      - 'cloudflare-d1/staging/index.js'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/src/cloud-write.mjs'
      - 'cloudflare-d1/wrangler.toml'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_CANONICAL_ADAPTER_DRYRUN_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_RUNTIME_PREFLIGHT_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_AUTH_BRIDGE_QUALIFICATION_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_SIDE_EFFECT_QUALIFICATION_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_CANONICAL_TARGET_IDENTITY_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_FIRST_WRITE_HARNESS_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_FIRST_WRITE_RECOVERY_V1.gs'
      - 'apps-script/patches/CLOUD_WRITE_ORDER_V2_STAGING_BRIDGE_V1.gs'
      - 'tests/cloud_write_order_contract_v2.test.mjs'
      - 'tests/cloud_write_order_contract_v2_staging.test.mjs'
      - 'tests/cloud_write_order_v2_staging_bridge.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_canonical_adapter_dryrun_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_runtime_preflight_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_auth_bridge_qualification_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_side_effect_qualification_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_canonical_target_identity_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_first_write_harness_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_first_write_recovery_v1.test.mjs'
      - 'tests/apps_script_cloud_write_order_v2_staging_bridge_v1.test.mjs'
      - '.github/workflows/trendos-cloud-write-order-contract-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-order-create-contract-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pure canonical create-intent contract
        run: node tests/cloud_write_order_contract_v2.test.mjs

      - name: Verify staging-only fixed synthetic read-only intent-plan contract
        run: node tests/cloud_write_order_contract_v2_staging.test.mjs

      - name: Verify Apps Script canonical adapter dry-run boundary
        run: node tests/apps_script_cloud_write_order_v2_canonical_adapter_dryrun_v1.test.mjs

      - name: Verify isolated Apps Script staging runtime preflight
        run: node tests/apps_script_cloud_write_order_v2_staging_runtime_preflight_v1.test.mjs

      - name: Verify staging synthetic auth bridge qualification
        run: node tests/apps_script_cloud_write_order_v2_staging_auth_bridge_qualification_v1.test.mjs

      - name: Verify canonical staging side-effect shape
        run: node tests/apps_script_cloud_write_order_v2_staging_side_effect_qualification_v1.test.mjs

      - name: Verify active and canonical staging target identity
        run: node tests/apps_script_cloud_write_order_v2_staging_canonical_target_identity_v1.test.mjs

      - name: Verify isolated staging first canonical write harness
        run: node tests/apps_script_cloud_write_order_v2_staging_first_write_harness_v1.test.mjs

      - name: Verify isolated staging first-write recovery path
        run: node tests/apps_script_cloud_write_order_v2_staging_first_write_recovery_v1.test.mjs

      - name: Verify staging Cloudflare to Apps Script bridge token contract
        run: node tests/cloud_write_order_v2_staging_bridge.test.mjs

      - name: Verify staging Apps Script canonical bridge handler
        run: node tests/apps_script_cloud_write_order_v2_staging_bridge_v1.test.mjs

      - name: Production integration boundary
        run: |
          set -euo pipefail
          if grep -Fq 'cloud-write-order-contract-v2' cloudflare-d1/src/index_v2.js; then
            echo 'V2_CONTRACT_PRODUCTION_IMPORT_REFUSED'
            exit 1
          fi
          if grep -Fq 'cloud-write-order-contract-v2' cloudflare-d1/src/cloud-write.mjs; then
            echo 'V2_CONTRACT_V1_HANDLER_IMPORT_REFUSED'
            exit 1
          fi
          if grep -Fq 'cloud-write-order-v2-staging-bridge' cloudflare-d1/src/index_v2.js; then
            echo 'V2_STAGING_BRIDGE_PRODUCTION_IMPORT_REFUSED'
            exit 1
          fi
          if grep -Fq 'cloud-write-order-v2-staging-bridge' cloudflare-d1/src/cloud-write.mjs; then
            echo 'V2_STAGING_BRIDGE_V1_HANDLER_IMPORT_REFUSED'
            exit 1
          fi
          for marker in \
            CLOUD_WRITE_ORDER_V2_CANONICAL_ADAPTER_DRYRUN_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_RUNTIME_PREFLIGHT_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_AUTH_BRIDGE_QUALIFICATION_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_SIDE_EFFECT_QUALIFICATION_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_CANONICAL_TARGET_IDENTITY_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_FIRST_WRITE_HARNESS_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_FIRST_WRITE_RECOVERY_V1 \
            CLOUD_WRITE_ORDER_V2_STAGING_BRIDGE_V1
          do
            if grep -Fq "$marker" Code.gs; then
              echo "V2_APPS_SCRIPT_LIVE_CODEGS_INTEGRATION_REFUSED:$marker"
              exit 1
            fi
          done
          grep -Eq 'TRENDOS_CLOUD_WRITE_V1_ENABLED[[:space:]]*=[[:space:]]*"false"' cloudflare-d1/wrangler.toml
          ! grep -Eq 'TRENDOS_CLOUD_WRITE_V1_ENABLED[[:space:]]*=[[:space:]]*"true"' cloudflare-d1/wrangler.toml
          echo 'V2_PRODUCTION_INTEGRATION_BOUNDARY_PASS'

      - name: Safety conclusion
        run: |
          echo 'CLOUD_WRITE_ORDER_CONTRACT_V2_GATE_PASS'
          echo 'The V2 core remains pure planning logic and the staging intent-plan remains read-only.'
          echo 'The canonical adapter carries no credentials or Order ID and cannot invoke createManualOrder_.'
          echo 'The staging preflight validates the dedicated workbook/guard/baseline.'
          echo 'The synthetic staging auth qualification accepts no Cloud credentials and never returns the staging user token.'
          echo 'The current createManualOrder_ side-effect shape has no direct network/WhatsApp/D1 send; queueing is staging-sheet-only. Script Property writes are explicitly identified.'
          echo 'Because ss_() may honor TRENDOS_SPREADSHEET_ID, the target identity gate separately requires active spreadsheet == ss_() target == dedicated staging spreadsheet.'
          echo 'The first-write harness is manual/staging-only and verified one write plus an idempotent replay; the recovery path verified the pre-existing legacy Line ID date-format behavior without creating a second order.'
          echo 'The new staging bridge uses a 60-second Worker-minted Edge token and Apps Script callback validation; no shared bridge secret is copied into Apps Script, GitHub, or chat.'
          echo 'The bridge remains fixed-synthetic, Staging-only, has no D1 write, and is not imported by the Production Worker or Production Code.gs.'
          echo 'No V2 Apps Script patch is wired to production; Business Order ID allocation remains Apps Script-owned.'
          echo 'Production Cloud Write V1 remains OFF.'
