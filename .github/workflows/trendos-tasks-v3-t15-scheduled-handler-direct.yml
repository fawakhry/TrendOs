name: TrendOS Tasks V3 T1.5 Scheduled Handler Direct

on:
  push:
    branches:
      - tasks-v3-t15-d1-read-replica-preview-20260915
    paths:
      - 'cloudflare-d1/test/tasks-v3-t15-scheduled-handler-direct.mjs'
      - 'cloudflare-d1/dashboard/tasks-v3-t15-preview-worker-v3.single.mjs'
      - '.github/workflows/trendos-tasks-v3-t15-scheduled-handler-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-handler-direct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run direct scheduled handler test
        run: node cloudflare-d1/test/tasks-v3-t15-scheduled-handler-direct.mjs
