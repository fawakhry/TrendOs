name: TrendOS Cloud Write Isolated Integration

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/cloud-write.mjs'
      - 'cloudflare-d1/src/cloud-write-gate.mjs'
      - 'cloudflare-d1/src/cloud-write-reconcile-core.mjs'
      - 'cloudflare-d1/src/cloud-write-staging-reconcile.mjs'
      - 'cloudflare-d1/src/edge-gateway.mjs'
      - 'cloudflare-d1/migrations/0001_init.sql'
      - 'cloudflare-d1/migrations/0002_full_sheet_mirror.sql'
      - 'cloudflare-d1/migrations/0003_cloud_write_lane.sql'
      - 'cloudflare-d1/staging/index.js'
      - 'cloudflare-d1/staging/wrangler.toml'
      - 'tests/cloudflare_cloud_write_v1.test.mjs'
      - 'tests/cloudflare_cloud_write_sqlite_integration_v1.test.mjs'
      - 'tests/cloudflare_cloud_write_reconcile_sqlite_v1.test.mjs'
      - 'docs/trendos/staging/PROVISION_D1_STAGING.trigger'
      - '.github/workflows/trendos-cloud-write-isolated-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transactional-write-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify default-off Cloud Write contract
        run: node tests/cloudflare_cloud_write_v1.test.mjs
      - name: Verify real SQL success, idempotency, and rollback in isolated DB
        run: node --experimental-sqlite tests/cloudflare_cloud_write_sqlite_integration_v1.test.mjs
      - name: Verify isolated Sheets reconciliation state machine
        run: node --experimental-sqlite tests/cloudflare_cloud_write_reconcile_sqlite_v1.test.mjs
      - name: Isolation conclusion
        run: |
          echo 'PASS means Cloud Write and reconciliation state transitions passed against an isolated in-memory SQLite/D1-compatible database.'
          echo 'No remote D1 database, Google Sheet, Apps Script property, Production Worker, or production traffic is mutated by this job.'

  provision-and-qualify-staging:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[staging-d1]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://trendos-d1-staging.trendmall-contact.workers.dev
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging boundary and Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q 'name = "trendos-d1-staging"' cloudflare-d1/staging/wrangler.toml
          grep -q 'main = "./index.js"' cloudflare-d1/staging/wrangler.toml
          grep -q 'database_name = "trendos-staging"' cloudflare-d1/staging/wrangler.toml
          grep -q 'database_id = "__STAGING_DB_ID__"' cloudflare-d1/staging/wrangler.toml
          grep -q 'TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"' cloudflare-d1/staging/wrangler.toml
          grep -q 'TRENDOS_STAGING_RECONCILE_VERIFY_ENABLED = "true"' cloudflare-d1/staging/wrangler.toml
          if grep -Eq '^database_name = "trendos-main"$' cloudflare-d1/staging/wrangler.toml; then
            echo 'FAIL: staging config binds the production D1 name'
            exit 1
          fi
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2
      - name: Discover or create dedicated staging D1
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          STAGING_DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const db=(Array.isArray(rows)?rows:[]).find(x=>x && x.name==='trendos-staging');
          process.stdout.write(db ? String(db.uuid || db.id || '') : '');
          NODE
          )"
          if [ -z "$STAGING_DB_ID" ]; then
            echo 'Creating dedicated D1 database trendos-staging'
            npx wrangler d1 create trendos-staging
            sleep 2
            npx wrangler d1 list --json > /tmp/d1-list.json
            STAGING_DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const db=(Array.isArray(rows)?rows:[]).find(x=>x && x.name==='trendos-staging');
          process.stdout.write(db ? String(db.uuid || db.id || '') : '');
          NODE
            )"
          fi
          test -n "$STAGING_DB_ID"
          echo "STAGING_DB_ID=$STAGING_DB_ID" >> "$GITHUB_ENV"
          cp cloudflare-d1/staging/wrangler.toml cloudflare-d1/staging/wrangler.generated.toml
          sed -i "s/__STAGING_DB_ID__/$STAGING_DB_ID/g" cloudflare-d1/staging/wrangler.generated.toml
          grep -q "database_id = \"$STAGING_DB_ID\"" cloudflare-d1/staging/wrangler.generated.toml
          echo "STAGING_D1_READY id=$STAGING_DB_ID"
      - name: Apply staging D1 migrations only
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply trendos-staging --remote --config cloudflare-d1/staging/wrangler.generated.toml
          echo 'STAGING_MIGRATIONS_APPLIED'
      - name: Deploy isolated staging Worker
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/staging/wrangler.generated.toml
          sleep 3
      - name: Install isolated staging Edge secret
        run: |
          set -euo pipefail
          node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))" > /tmp/staging-edge-secret.txt
          chmod 600 /tmp/staging-edge-secret.txt
          cat /tmp/staging-edge-secret.txt | npx wrangler secret put EDGE_SESSION_SECRET --config cloudflare-d1/staging/wrangler.generated.toml
          sleep 8
          echo 'STAGING_EDGE_SECRET_INSTALLED'
      - name: Verify staging Cloud Write health
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/staging-health.json --write-out '%{http_code}' "$STAGING_URL/v1/cloud/write/health")"
          cat /tmp/staging-health.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/staging-health.json','utf8')); if(!x.success||x.database!==true||x.enabled!==true||x.authConfigured!==true||x.writesAccepted!==true||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
      - name: Create and idempotently repeat one staging-only order
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { issueEdgeSessionToken } from './cloudflare-d1/src/edge-gateway.mjs';
          const secret=fs.readFileSync('/tmp/staging-edge-secret.txt','utf8').trim();
          const token=await issueEdgeSessionToken({sub:'ci-staging-admin'},secret,Math.floor(Date.now()/1000),300);
          fs.writeFileSync('/tmp/staging-token.txt',token,{mode:0o600});
          NODE
          token="$(cat /tmp/staging-token.txt)"
          order_id="CW-STAGE-${GITHUB_RUN_ID}"
          cat > /tmp/staging-order.json <<JSON
          {"clientRequestId":"staging-${GITHUB_RUN_ID}","orderId":"${order_id}","customerPhone":"01001112233","customerName":"Staging Cloud Write Qualification","status":"cloud-draft","total":123.45,"remaining":23.45}
          JSON

          first_pass=0
          for attempt in $(seq 1 20); do
            first="$(curl --silent --show-error --output /tmp/first.json --write-out '%{http_code}' -H "authorization: Bearer $token" -H 'content-type: application/json' --data-binary @/tmp/staging-order.json "$STAGING_URL/v1/cloud/orders" || true)"
            echo "STAGING_WRITE_ATTEMPT=$attempt HTTP=$first"
            cat /tmp/first.json || true
            if [ "$first" = '201' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/first.json','utf8')); if(!x.success||x.idempotent!==false||x.dataSource!=='d1-cloud-write-v1'||x.sheetsSync!=='pending') process.exit(1)"; then
              first_pass=1
              break
            fi
            if [ "$first" = '200' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/first.json','utf8')); if(!x.success||x.idempotent!==true||x.dataSource!=='d1-cloud-write-v1'||x.sheetsSync!=='pending') process.exit(1)"; then
              first_pass=1
              break
            fi
            sleep 3
          done
          test "$first_pass" = '1'

          second_pass=0
          for attempt in $(seq 1 20); do
            second="$(curl --silent --show-error --output /tmp/second.json --write-out '%{http_code}' -H "authorization: Bearer $token" -H 'content-type: application/json' --data-binary @/tmp/staging-order.json "$STAGING_URL/v1/cloud/orders" || true)"
            echo "STAGING_IDEMPOTENCY_ATTEMPT=$attempt HTTP=$second"
            cat /tmp/second.json || true
            if [ "$second" = '200' ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/second.json','utf8')); if(!x.success||x.idempotent!==true||x.dataSource!=='d1-cloud-write-v1'||x.sheetsSync!=='pending') process.exit(1)"; then
              second_pass=1
              break
            fi
            sleep 3
          done
          test "$second_pass" = '1'

          outbox_pass=0
          for attempt in $(seq 1 20); do
            outbox="$(curl --silent --show-error --output /tmp/outbox.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$STAGING_URL/v1/cloud/write/outbox?status=pending&limit=50" || true)"
            echo "STAGING_OUTBOX_API_ATTEMPT=$attempt HTTP=$outbox"
            cat /tmp/outbox.json || true
            if [ "$outbox" = '200' ] && ORDER_ID="$order_id" node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/outbox.json','utf8')); const id=process.env.ORDER_ID; if(!x.success||!Array.isArray(x.outbox)||!x.outbox.some(r=>r.entityId===id&&r.status==='pending')) process.exit(1)"; then
              outbox_pass=1
              break
            fi
            sleep 3
          done
          test "$outbox_pass" = '1'
          echo 'STAGING_CLOUD_WRITE_IDEMPOTENCY_OUTBOX_API_PASS'
      - name: Verify staging rows directly in dedicated D1
        run: |
          set -euo pipefail
          order_id="CW-STAGE-${GITHUB_RUN_ID}"
          sql="SELECT (SELECT COUNT(*) FROM orders WHERE order_id='${order_id}') AS order_count, (SELECT COUNT(*) FROM cloud_write_events WHERE entity_id='${order_id}') AS event_count, (SELECT COUNT(*) FROM cloud_write_outbox WHERE entity_id='${order_id}') AS outbox_count;"
          npx wrangler d1 execute trendos-staging --remote --config cloudflare-d1/staging/wrangler.generated.toml --command "$sql" --json > /tmp/staging-db-check.json
          cat /tmp/staging-db-check.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/staging-db-check.json','utf8'));
          function findCounts(value){
            if(!value || typeof value!=='object') return null;
            if(Object.prototype.hasOwnProperty.call(value,'order_count') && Object.prototype.hasOwnProperty.call(value,'event_count') && Object.prototype.hasOwnProperty.call(value,'outbox_count')) return value;
            for(const child of Object.values(value)){
              const found=findCounts(child);
              if(found) return found;
            }
            return null;
          }
          const row=findCounts(payload);
          if(!row || Number(row.order_count)!==1 || Number(row.event_count)!==1 || Number(row.outbox_count)!==1){
            console.error('Unexpected staging D1 row counts', row);
            process.exit(1);
          }
          console.log('STAGING_D1_DIRECT_ROWS_PASS order=1 event=1 outbox=1');
          NODE
      - name: Verify staging-only reconciliation health
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/reconcile-health.json --write-out '%{http_code}' "$STAGING_URL/v1/staging/cloud-write/reconcile/health")"
          cat /tmp/reconcile-health.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/reconcile-health.json','utf8')); if(!x.success||x.stagingOnly!==true||x.enabled!==true||x.database!==true||x.completionState!=='staging_verified'||x.sheetsStatus!=='not_written_staging'||x.sheetsWritten!==false||x.productionCutover!==false) process.exit(1)"
          echo 'STAGING_RECONCILE_HEALTH_NO_SHEETS_PASS'
      - name: Run staging-only remote reconciliation verifier
        run: |
          set -euo pipefail
          token="$(cat /tmp/staging-token.txt)"
          target="CW-STAGE-${GITHUB_RUN_ID}"
          target_pass=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/reconcile-next.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $token" -H 'content-type: application/json' "$STAGING_URL/v1/staging/cloud-write/reconcile/next" || true)"
            echo "STAGING_RECONCILE_ATTEMPT=$attempt HTTP=$code"
            cat /tmp/reconcile-next.json || true
            if [ "$code" = '200' ]; then
              if TARGET="$target" node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/reconcile-next.json','utf8')); if(x.state==='staging_verified'&&x.entityId===process.env.TARGET&&x.stagingOnly===true&&x.sheetsWritten===false) process.exit(0); process.exit(1)"; then
                target_pass=1
                break
              fi
            fi
            sleep 2
          done
          test "$target_pass" = '1'
          echo 'STAGING_REMOTE_RECONCILE_TARGET_VERIFIED_NO_SHEETS_PASS'
      - name: Verify staging reconciliation state directly in dedicated D1
        run: |
          set -euo pipefail
          order_id="CW-STAGE-${GITHUB_RUN_ID}"
          sql="SELECT o.status AS outbox_status, o.attempts AS attempts, e.status AS event_status, e.sheets_status AS sheets_status, e.note AS note FROM cloud_write_outbox o JOIN cloud_write_events e ON e.idempotency_key=o.event_key WHERE o.entity_id='${order_id}' LIMIT 1;"
          npx wrangler d1 execute trendos-staging --remote --config cloudflare-d1/staging/wrangler.generated.toml --command "$sql" --json > /tmp/staging-reconcile-state.json
          cat /tmp/staging-reconcile-state.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/staging-reconcile-state.json','utf8'));
          function findState(value){
            if(!value || typeof value!=='object') return null;
            if(Object.prototype.hasOwnProperty.call(value,'outbox_status') && Object.prototype.hasOwnProperty.call(value,'sheets_status')) return value;
            for(const child of Object.values(value)){
              const found=findState(child);
              if(found) return found;
            }
            return null;
          }
          const row=findState(payload);
          if(!row || row.outbox_status!=='staging_verified' || row.event_status!=='staging_verified' || row.sheets_status!=='not_written_staging' || !String(row.note||'').includes('NO_SHEETS_WRITE')){
            console.error('Unexpected staging reconciliation state', row);
            process.exit(1);
          }
          console.log('STAGING_RECONCILE_DIRECT_STATE_PASS staging_verified + not_written_staging + NO_SHEETS_WRITE');
          NODE
      - name: Reconfirm production Cloud Write and staging-route isolation
        if: always()
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/prod-write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          cat /tmp/prod-write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/prod-write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
          route_code="$(curl --silent --show-error --output /tmp/prod-staging-route.json --write-out '%{http_code}' "$PROD_URL/v1/staging/cloud-write/reconcile/health")"
          cat /tmp/prod-staging-route.json
          test "$route_code" = '404'
          echo 'PRODUCTION_CLOUD_WRITE_STILL_OFF_AND_STAGING_ROUTE_ABSENT_PASS'
      - name: Staging qualification summary
        run: |
          echo "STAGING_DB_ID=$STAGING_DB_ID"
          echo "STAGING_URL=$STAGING_URL"
          echo 'PASS: dedicated staging D1 + authenticated idempotent Cloud Write.'
          echo 'PASS: remote staging reconciliation runtime completed target as staging_verified with NO_SHEETS_WRITE.'
          echo 'PASS: production Cloud Write remained OFF and staging reconciliation route is absent from Production.'
      - name: Cleanup temporary staging credentials
        if: always()
        run: rm -f /tmp/staging-edge-secret.txt /tmp/staging-token.txt /tmp/staging-order.json
