name: TrendOS 02CU Production Freshness Hotfix TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cu-prod-freshness-hotfix-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact production boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8fa24b90ece05658698564fb92b3b28c4ab1a6ef"
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_CONCURRENCY = 2' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_ATTEMPTS = 1' config.js
          grep -Fq 'MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false' config.js
          grep -Fq 'MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false' config.js
          echo PERF_CF_02CU_PROD_PREBOUNDARY_PASS

      - name: Apply only qualified frontend freshness gate
        run: |
          set -euo pipefail
          git fetch origin agent/go-live-2026-09-01-integrity --depth=1
          git show origin/agent/go-live-2026-09-01-integrity:trendos-edge-orders-read-v1.js > /tmp/candidate-wrapper.js
          grep -Fq 'EDGE_ORDERS_READ_02CU_FRESHNESS_20260906' /tmp/candidate-wrapper.js
          grep -Fq 'EDGE_MIRROR_STALE' /tmp/candidate-wrapper.js
          cp /tmp/candidate-wrapper.js trendos-edge-orders-read-v1.js
          python - <<'PY'
          from pathlib import Path

          p=Path('config.js'); s=p.read_text(encoding='utf-8')
          anchor='window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;\n'
          insert='window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;\n// 02CU: stale required D1 Orders mirrors fail open to authoritative Apps Script.\nwindow.MATBAGY_EDGE_ORDERS_MAX_MIRROR_AGE_MS = 5 * 60 * 1000;\n'
          if 'MATBAGY_EDGE_ORDERS_MAX_MIRROR_AGE_MS' not in s:
              if anchor not in s: raise SystemExit('D1 frontend flag anchor missing')
              s=s.replace(anchor,insert,1)
          old="trendLoadModuleV1932('trendEdgeOrdersReadV1Loader','trendos-edge-orders-read-v1.js?v=20260906c');"
          new="trendLoadModuleV1932('trendEdgeOrdersReadV1Loader','trendos-edge-orders-read-v1.js?v=20260906-02cu-fresh1');"
          if old not in s: raise SystemExit('edge wrapper loader baseline missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          oldtag='trendos-perf-hotfix2-20260906a'
          newtag='trendos-02cu-freshness-20260906a'
          for path in ['index.html','reset-cache.html']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              if oldtag not in s: raise SystemExit(f'cache baseline missing in {path}')
              p.write_text(s.replace(oldtag,newtag),encoding='utf-8')
          PY

      - name: Hotfix regression and scope guard
        run: |
          set -euo pipefail
          node --check trendos-edge-orders-read-v1.js
          grep -Fq 'MATBAGY_EDGE_ORDERS_MAX_MIRROR_AGE_MS = 5 * 60 * 1000' config.js
          grep -Fq 'EDGE_ORDERS_READ_02CU_FRESHNESS_20260906' trendos-edge-orders-read-v1.js
          grep -Fq 'EDGE_MIRROR_STALE' trendos-edge-orders-read-v1.js
          grep -Fq 'trendos-edge-orders-read-v1.js?v=20260906-02cu-fresh1' config.js
          grep -Fq 'trendos-02cu-freshness-20260906a' index.html
          grep -Fq 'trendos-02cu-freshness-20260906a' reset-cache.html
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_CONCURRENCY = 2' config.js
          grep -Fq 'MATBAGY_TREND_MASTER_MAX_ATTEMPTS = 1' config.js
          grep -Fq 'MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false' config.js
          grep -Fq 'MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false' config.js
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'config.js\nindex.html\nreset-cache.html\ntrendos-edge-orders-read-v1.js'
          if git diff --name-only | grep -Eq '\.gs$|cloudflare-d1/src/'; then
            echo 'Backend/Worker mutation forbidden'; exit 1
          fi
          echo PERF_CF_02CU_PROD_HOTFIX_SCOPE_PASS

      - name: Commit bounded frontend hotfix to production main
        run: |
          set -euo pipefail
          git config user.name 'trendos-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js index.html reset-cache.html trendos-edge-orders-read-v1.js
          git commit -m 'Hotfix stale D1 Orders reads to Apps Script fallback'
          git push origin HEAD:main
          echo "PERF_CF_02CU_PROD_FRESHNESS_HOTFIX_PASS=$(git rev-parse HEAD)"
