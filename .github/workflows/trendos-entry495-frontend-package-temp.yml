name: TrendOS Entry495 Frontend Manual Package TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry495-frontend-package-temp.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 420b3bf467c916a07f432207c752fa86c2096159
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact Entry495 frontend package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/entry495-ui
          mkdir -p /tmp/entry495-ui/frontend-dist /tmp/entry495-ui/src
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 -I{} cp "{}" /tmp/entry495-ui/frontend-dist/
          cp cloudflare-d1/src/frontend-static-worker.mjs /tmp/entry495-ui/src/
          cp cloudflare-d1/wrangler.frontend.toml /tmp/entry495-ui/
          test -f /tmp/entry495-ui/frontend-dist/index.html
          test -f /tmp/entry495-ui/frontend-dist/app.js
          test -f /tmp/entry495-ui/frontend-dist/config.js
          test -f /tmp/entry495-ui/frontend-dist/browser-api-transport-v1.js
          test -f /tmp/entry495-ui/frontend-dist/employee-api-dispatcher-v1.js
          node --check /tmp/entry495-ui/frontend-dist/app.js
          node --check /tmp/entry495-ui/frontend-dist/browser-api-transport-v1.js
          node --check /tmp/entry495-ui/frontend-dist/employee-api-dispatcher-v1.js
          grep -F '/v1/legacy-api' /tmp/entry495-ui/frontend-dist/browser-api-transport-v1.js >/dev/null
          printf '%s\n' \
            'TrendOS Entry495 frontend manual deploy package' \
            '' \
            'Do not edit Bindings, Variables, Secrets, or D1.' \
            '' \
            'From this folder run:' \
            'npx --yes wrangler@4.142.0 deploy --config wrangler.frontend.toml' \
            '' \
            'Target worker: trendos-ui' \
            'Assets binding: ASSETS' \
            > /tmp/entry495-ui/DEPLOY.txt
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/trendos-entry495-frontend-manual.zip" entry495-ui
          sha256sum "$GITHUB_WORKSPACE/trendos-entry495-frontend-manual.zip" > "$GITHUB_WORKSPACE/trendos-entry495-frontend-manual.sha256"
          echo 'ENTRY495_FRONTEND_PACKAGE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: trendos-entry495-frontend-manual
          path: |
            trendos-entry495-frontend-manual.zip
            trendos-entry495-frontend-manual.sha256
          if-no-files-found: error
