name: TrendOS 02CL Fresh Wael Auth TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cl-wael-auth-readiness-temp.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - name: Exact input readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$USERNAME" = 'wael'
          test -n "$EMPLOYEE_TOKEN"
          echo '02CL_WAEL_AUTH_INPUT_READY'

      - name: Canonical Production employee session exchange only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @- "$PROD_URL/v1/edge/session" <<JSON
          {"username":"$USERNAME","token":"$EMPLOYEE_TOKEN"}
          JSON
          )"
          test "$code" = '200'
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/session.json','utf8'));
          const token=String(x.edgeToken||x.token||'').trim();
          if(x.success!==true || !token) process.exit(1);
          console.log('02CL_WAEL_EDGE_SESSION_EXCHANGE_PASS');
          NODE
          rm -f /tmp/session.json

      - name: Safety conclusion
        run: |
          echo 'No reconciliation executed. No outbox claim. No Sheet write. No cutover.'
