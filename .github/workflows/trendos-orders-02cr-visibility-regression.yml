name: TrendOS Orders 02CR visibility regression
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs'
      - 'cloudflare-d1/src/edge-orders-read-02cr-canary.mjs'
      - 'cloudflare-d1/src/edge-orders-operational-enrichment-02cr.mjs'
      - 'cloudflare-d1/src/t12-read-overlay.mjs'
      - 'tests/cloudflare_edge_orders_02cr_idle_freshness_02cu.test.mjs'
      - 'tests/cloudflare_edge_orders_02cr_canary.test.mjs'
      - 'tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs'
      - 'tests/cloudflare_index_v2_02cr_route.test.mjs'
      - '.github/workflows/trendos-orders-02cr-visibility-regression.yml'
  pull_request:
    paths:
      - 'cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs'
      - 'cloudflare-d1/src/edge-orders-read-02cr-canary.mjs'
      - 'cloudflare-d1/src/edge-orders-operational-enrichment-02cr.mjs'
      - 'cloudflare-d1/src/t12-read-overlay.mjs'
      - 'tests/cloudflare_edge_orders_02cr_idle_freshness_02cu.test.mjs'
      - 'tests/cloudflare_edge_orders_02cr_canary.test.mjs'
      - 'tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs'
      - 'tests/cloudflare_index_v2_02cr_route.test.mjs'
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and 02CR regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node tests/cloudflare_edge_orders_02cr_idle_freshness_02cu.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          echo 'ORDERS_02CR_VISIBILITY_REGRESSION=PASS'
