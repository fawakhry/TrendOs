name: EasyStore A2.7 Post-timeout Safety Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a27-post-timeout-safety-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Prove timeout fail-safe state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27timeout=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT mode,policy_epoch AS policyEpoch FROM employee_accounting_control_v1 WHERE singleton=1;
            SELECT allowed_usernames_json AS allowedUsersJson,allowed_actions_json AS allowedActionsJson,
                   max_amount AS maxAmount,max_commands AS maxCommands,commands_started AS commandsStarted,
                   expires_at_ms AS expiresAtMs
              FROM employee_accounting_write_canary_v1 WHERE singleton=1;
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances;
          " > /tmp/state.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/state.json','utf8')), rows=[];
          const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(Array.isArray(v.results))rows.push(...v.results);for(const [k,z] of Object.entries(v))if(k!=='results')w(z);}};w(x);
          const c=rows.find(r=>r.mode!==undefined)||{};
          const p=rows.find(r=>r.allowedUsersJson!==undefined)||{};
          const d=rows.find(r=>r.templates!==undefined)||{};
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false||c.mode!=='READONLY')throw new Error('server not fail-closed READONLY');
          if(String(p.allowedUsersJson||'[]')!=='[]'||String(p.allowedActionsJson||'[]')!=='[]')throw new Error('allowlists not cleared');
          if(Number(p.maxCommands||0)!==0||Number(p.commandsStarted||0)!==0||Number(p.maxAmount||0)!==0||Number(p.expiresAtMs||0)!==0)throw new Error('canary budget not cleared');
          for(const [k,v] of Object.entries(d)) if(Number(v||0)!==0) throw new Error('unexpected accounting row after timeout '+k+'='+v);
          console.log('A27_TIMEOUT_FAILSAFE=PASS');
          console.log('A27_POST_TIMEOUT_MODE=READONLY');
          console.log('A27_POST_TIMEOUT_ALLOWLISTS=EMPTY');
          console.log('A27_POST_TIMEOUT_BUDGET=CLEARED');
          console.log('A27_POST_TIMEOUT_ACCOUNTING_ROWS=0');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO');
          NODE
