name: EasyStore A2 Canary User Preflight

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a2-canary-user-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Inspect eligible full accounting identities
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT canonical_username AS username,
                   role,
                   department,
                   active
              FROM employee_auth_users_v1
             WHERE active=1
               AND (
                 lower(role)='admin'
                 OR lower(canonical_username) LIKE '%diaa%'
                 OR canonical_username LIKE '%ضياء%'
               )
             ORDER BY canonical_username;
          " > /tmp/users.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/users.json','utf8')),rows=[];
          function walk(v){
            if(Array.isArray(v))for(const z of v)walk(z);
            else if(v&&typeof v==='object'){
              if(Array.isArray(v.results))rows.push(...v.results);
              for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);
            }
          }
          walk(x);
          console.log('A2_CANARY_ELIGIBLE_USER_COUNT='+rows.length);
          for(const r of rows){
            console.log('A2_CANARY_ELIGIBLE_USER='+JSON.stringify({
              username:String(r.username||''),
              role:String(r.role||''),
              department:String(r.department||''),
              active:Number(r.active||0)
            }));
          }
          console.log('PRODUCTION_MUTATION=NO');
          NODE
