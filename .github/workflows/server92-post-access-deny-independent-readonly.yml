name: SERVER-92 Independently Confirm Stage Access Deny-All (GET Only)

# GET-only Cloudflare application/policy + stage Worker metadata, no writes,
# no UUIDs, emails, domains, tokens, PII, D1 data or deployment on stdout.
on:
  push:
    branches:
      - release/server68-staging-qualification-20261016
    paths:
      - .github/workflows/server92-post-access-deny-independent-readonly.yml

permissions:
  contents: read

jobs:
  verify-stage-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read real Cloudflare Access deny policy and stage settings only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request, build_opener, HTTPSHandler, HTTPRedirectHandler, ProxyHandler
          from urllib.error import HTTPError,URLError
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          reader=os.environ.get('CLOUDFLARE_API_TOKEN','')
          writer=os.environ.get('CLOUDFLARE_ACCESS_API_TOKEN','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',account) or min(len(reader),len(writer))<16:
              raise SystemExit('SERVER92_REQUIRED_CREDENTIAL_MISSING')
          stage='trendos-server68-isolated-stage'
          appname='TrendOS isolated stage - DENY ALL - S87'
          base='/accounts/'+account
          scriptbase=base+'/workers/scripts/'+stage
          whitelist={scriptbase+'/deployments',scriptbase+'/settings',scriptbase+'/subdomain',
                     base+'/workers/workers',base+'/access/apps?page=1&per_page=100'}
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=build_opener(ProxyHandler({}),HTTPSHandler(),NoRedirect())
          def get(path):
              app_specific=re.fullmatch(re.escape(base)+r'/access/apps/[a-fA-F0-9-]{32,36}(?:/policies)?',path)
              if path not in whitelist and not app_specific:
                  raise SystemExit('SERVER92_ENDPOINT_NOT_ALLOWED')
              t=writer if '/access/' in path else reader
              req=Request('https://api.cloudflare.com/client/v4'+path,
                          method='GET',headers={'Authorization':'Bearer '+t,'Accept':'application/json'})
              try:
                  with opener.open(req,timeout=15) as resp:
                      b=resp.read(131073)
                      if resp.status!=200 or len(b)>131072:
                          raise SystemExit('SERVER92_CLOUDFLARE_BAD_RESPONSE')
              except (HTTPError,URLError,TimeoutError,OSError,ValueError):
                  raise SystemExit('SERVER92_CLOUDFLARE_GET_FAILURE') from None
              data=json.loads(b)
              if not isinstance(data,dict) or data.get('success') is not True:
                  raise SystemExit('SERVER92_CLOUDFLARE_RESULT_UNVERIFIED')
              return data.get('result')
          deploy=get(scriptbase+'/deployments')
          ds=deploy.get('deployments') if isinstance(deploy,dict) else None
          if not isinstance(ds,list) or not ds or not isinstance(ds[0],dict):
              raise SystemExit('SERVER92_STAGE_DEPLOYMENT_MISSING')
          vs=ds[0].get('versions')
          if (not isinstance(vs,list) or len(vs)!=1 or
              vs[0].get('version_id')!='d1a19c15-b745-405f-a926-38148eb12688' or
              vs[0].get('percentage')!=100):
              raise SystemExit('SERVER92_STAGE_VERSION_DRIFT')
          settings=get(scriptbase+'/settings')
          bindings=settings.get('bindings') if isinstance(settings,dict) else None
          if not isinstance(bindings,list): raise SystemExit('SERVER92_STAGE_SETTINGS_UNVERIFIED')
          names={x.get('name'):x for x in bindings if isinstance(x,dict)}
          if (names.get('DB',{}).get('type')!='d1' or
              names.get('TRENDOSSHOP_SERVICE_READ_ENABLED',{}).get('text')!='false' or
              names.get('MIRROR_SERVICE_READ_ENABLED',{}).get('text')!='false' or
              'TRENDOSSHOP_READER_TOKEN_SHA256_HEX' in names):
              raise SystemExit('SERVER92_STAGE_READERS_NOT_OFF')
          p=get(scriptbase+'/subdomain')
          if not isinstance(p,dict) or p.get('enabled') is not False or p.get('previews_enabled') is not False:
              raise SystemExit('SERVER92_PUBLICATION_UNSAFE')
          workers=get(base+'/workers/workers')
          chosen=[w for w in workers if isinstance(w,dict) and w.get('name')==stage] if isinstance(workers,list) else []
          if len(chosen)!=1 or not re.fullmatch(r'[a-fA-F0-9]{32}',str(chosen[0].get('id',''))):
              raise SystemExit('SERVER92_WORKER_ID_UNVERIFIED')
          wid=chosen[0]['id']
          apps=get(base+'/access/apps?page=1&per_page=100')
          if not isinstance(apps,list) or len(apps)>=100:
              raise SystemExit('SERVER92_ACCESS_APP_LIST_INCOMPLETE')
          selected=[a for a in apps if isinstance(a,dict) and a.get('name')==appname]
          if len(selected)!=1:
              raise SystemExit('SERVER92_ONE_EXACT_STAGE_APP_REQUIRED')
          aid=selected[0].get('id')
          if not isinstance(aid,str) or not re.fullmatch(r'[a-fA-F0-9-]{32,36}',aid):
              raise SystemExit('SERVER92_INVALID_APP_ID')
          app=get(base+'/access/apps/'+aid)
          if (not isinstance(app,dict) or app.get('type')!='self_hosted' or
              app.get('name')!=appname or
              app.get('destinations')!=[{'type':'worker','worker_id':wid}]):
              raise SystemExit('SERVER92_ACCESS_TARGET_MISMATCH')
          pol=get(base+'/access/apps/'+aid+'/policies')
          if (not isinstance(pol,list) or len(pol)!=1 or not isinstance(pol[0],dict) or
              pol[0].get('decision')!='deny' or
              pol[0].get('include')!=[{'everyone':{}}]):
              raise SystemExit('SERVER92_ACCESS_NOT_EXACT_DENY_ALL')
          print('SERVER92_STAGE_ACCESS=EXACT_DENY_EVERYONE;WORKER_SCOPE=ONE;POLICY=VERIFIED')
          print('SERVER92_WORKERS_DEV=OFF;PREVIEWS=OFF;READERS=OFF;D1=STAGE_ONLY')
          print('SERVER92_PRODUCTION_CHANGES=NONE;UBUNTU_SESSION=NO;REAL_ORDERS=NO')
          PY
