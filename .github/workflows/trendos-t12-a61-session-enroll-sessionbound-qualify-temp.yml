name: TrendOS T12 A61 Session-Bound Enrollment Qualify TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-session-enroll-sessionbound-qualify-temp.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare-d1/src/employee-auth-native-v1.mjs
      - run: node tests/employee_auth_native_a61.test.mjs
      - name: Fail-closed proof
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fx 'TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fx 'EMPLOYEE_AUTH_ENROLL_CANARY_USER = ""' cloudflare-d1/wrangler.toml
          grep -Fx 'EMPLOYEE_AUTH_ENROLL_NONCE = ""' cloudflare-d1/wrangler.toml
          grep -Fq 'enrollNonce.length < 32' cloudflare-d1/src/employee-auth-native-v1.mjs
          grep -Fq 'expectedNonce && !constantTimeEqual(enrollNonce, expectedNonce)' cloudflare-d1/src/employee-auth-native-v1.mjs
          echo 'A61_SESSION_BOUND_ENROLLMENT=QUALIFIED'
