name: TrendOS T12 A61 Native Bootstrap Canary TEMP

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-native-bootstrap-canary-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-t12-a61-native-bootstrap-canary-temp
  cancel-in-progress: false

jobs:
  native-bootstrap-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard scope and secret-presence gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "candidate/t12-full-cloud-cutover-a56-20260929"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${QUALIFY_USERNAME:-}"
          test -n "${QUALIFY_PASSWORD:-}"
          cfg='cloudflare-d1/wrangler.toml'
          grep -Eq '^name = "trendos-d1-api"$' "$cfg"
          grep -Eq '^TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "false"$' "$cfg"
          grep -Eq '^TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED = "false"$' "$cfg"
          grep -Eq '^TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1 = "false"$' "$cfg"
          grep -Eq '^TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED = "false"$' "$cfg"
          grep -Eq '^EMPLOYEE_LEGACY_BRIDGE_ACTIONS = ""$' "$cfg"
          echo 'A61_CANARY_SCOPE_GATE=PASS'
          echo 'BRIDGE_ENABLEMENT=NO'
          echo 'BRIDGE_SECRET_ACCESS=NO'

      - name: Fresh read-only production preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "$PROD_URL/v1/employee/auth/health" > /tmp/auth-pre.json
          curl --fail --silent --show-error --retry 3 "$PROD_URL/v1/employee/legacy-action/health" > /tmp/bridge-pre.json
          curl --fail --silent --show-error --retry 3 "$PROD_URL/v1/t12/customers/write/health" > /tmp/customer-pre.json
          curl --fail --silent --show-error --retry 3 "$PROD_URL/v1/t12/orders/create/health" > /tmp/order-pre.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-pre.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge-pre.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/customer-pre.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/order-pre.json','utf8'));
          if(!a.success||a.schemaReady!==true||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false) process.exit(11);
          if(!b.success||b.enabled!==false) process.exit(12);
          if(!c.success||String(c.mode||'').toUpperCase()!=='GENERAL') process.exit(13);
          if(!o.success||String(o.mode||'').toUpperCase()!=='GENERAL') process.exit(14);
          console.log('A61_CANARY_PREFLIGHT=PASS');
          console.log('PRE_NATIVE_READY_COUNT='+Number(a.nativeReadyCount||0));
          NODE
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config wrangler.toml --command "SELECT mode,marker,policy_epoch FROM employee_auth_control_v1 WHERE singleton=1;" > /tmp/d1-pre.txt
          grep -q 'OFF' /tmp/d1-pre.txt
          grep -q 'T12_EMPLOYEE_AUTH_V1' /tmp/d1-pre.txt
          echo 'A61_D1_CONTROL_PREFLIGHT=PASS'

      - name: Build runner-only transitional config
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('wrangler.toml','utf8');
          let out=src;
          out=out.replace('workers_dev = true','workers_dev = true\nkeep_vars = true');
          out=out.replace('TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "false"','TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "true"');
          out=out.replace('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED = "false"','TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED = "true"');
          if(!out.includes('TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "true"')) process.exit(21);
          if(!out.includes('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED = "true"')) process.exit(22);
          if(!out.includes('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1 = "false"')) process.exit(23);
          if(!out.includes('TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED = "false"')) process.exit(24);
          if(!out.includes('EMPLOYEE_LEGACY_BRIDGE_ACTIONS = ""')) process.exit(25);
          fs.writeFileSync('wrangler.a61-canary.runtime.toml',out);
          NODE
          echo 'A61_RUNNER_ONLY_CONFIG=PASS'

      - name: Open transitional control and deploy bootstrap-only Worker
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config wrangler.toml --command "UPDATE employee_auth_control_v1 SET mode='TRANSITIONAL', policy_epoch=policy_epoch+1, updated_at=CURRENT_TIMESTAMP WHERE singleton=1 AND marker='T12_EMPLOYEE_AUTH_V1' AND mode='OFF'; SELECT changes() AS changed;" | tee /tmp/d1-open.txt
          grep -Eq '1' /tmp/d1-open.txt
          echo 'CONTROL_OPENED=1' >> "$GITHUB_ENV"
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.a61-canary.runtime.toml
          echo 'CANARY_WORKER_DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 4
          echo 'A61_TRANSITIONAL_WORKER_DEPLOY=PASS'

      - name: Verify transitional health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/employee/auth/health" > /tmp/auth-open.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/employee/legacy-action/health" > /tmp/bridge-open.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-open.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge-open.json','utf8'));
          if(!a.success||a.schemaReady!==true||a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==true||a.nativeOnly!==false) process.exit(31);
          if(!b.success||b.enabled!==false) process.exit(32);
          console.log('A61_TRANSITIONAL_HEALTH=PASS');
          NODE

      - name: Bootstrap qualification employee into D1 native auth
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          (async()=>{
            const r=await fetch(base+'/v1/employee/auth/login',{
              method:'POST',
              headers:{accept:'application/json','content-type':'application/json'},
              body:JSON.stringify({username,password}),
              cache:'no-store'
            });
            const raw=await r.text(); let body={}; try{body=JSON.parse(raw||'{}')}catch{}
            const token=String(body&&body.user&&body.user.token||'').trim();
            if(r.status!==200||body.success!==true||!token){
              console.error('A61_NATIVE_BOOTSTRAP_LOGIN=FAIL status='+r.status+' code='+String(body.code||'')+' message='+String(body.message||'').slice(0,120));
              process.exit(41);
            }
            console.log('::add-mask::'+token);
            fs.writeFileSync('/tmp/a61-native-token',token,{mode:0o600});
            fs.writeFileSync('/tmp/a61-auth-source',String(body.authSource||''),{mode:0o600});
            console.log('A61_NATIVE_BOOTSTRAP_LOGIN=PASS');
            console.log('A61_AUTH_SOURCE='+String(body.authSource||''));
            console.log('A61_USERNAME_VALUE_LOGGED=NO');
            console.log('A61_PASSWORD_VALUE_LOGGED=NO');
          })().catch(()=>process.exit(42));
          NODE

      - name: Verify native session then revoke canary session
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=String(process.env.PROD_URL||'').replace(/\/$/,'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const token=fs.readFileSync('/tmp/a61-native-token','utf8').trim();
          (async()=>{
            let r=await fetch(base+'/v1/employee/auth/session',{
              method:'POST',headers:{accept:'application/json','content-type':'application/json'},
              body:JSON.stringify({username,token}),cache:'no-store'
            });
            let body={}; try{body=JSON.parse(await r.text()||'{}')}catch{}
            if(r.status!==200||body.success!==true||String(body.authSource||'')!=='d1-native-employee-v1') process.exit(51);
            console.log('A61_NATIVE_SESSION_VERIFY=PASS');
            r=await fetch(base+'/v1/employee/auth/logout',{
              method:'POST',headers:{accept:'application/json','content-type':'application/json'},
              body:JSON.stringify({username,token}),cache:'no-store'
            });
            body={}; try{body=JSON.parse(await r.text()||'{}')}catch{}
            if(r.status!==200||body.success!==true) process.exit(52);
            console.log('A61_NATIVE_SESSION_REVOKE=PASS');
          })().catch(()=>process.exit(53));
          NODE

      - name: Close control first and restore exact OFF-state Worker
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config wrangler.toml --command "UPDATE employee_auth_control_v1 SET mode='OFF', policy_epoch=policy_epoch+1, updated_at=CURRENT_TIMESTAMP WHERE singleton=1 AND marker='T12_EMPLOYEE_AUTH_V1';"
          echo 'CONTROL_OPENED=0' >> "$GITHUB_ENV"
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml
          echo 'CANARY_WORKER_DEPLOYED=0' >> "$GITHUB_ENV"
          sleep 4
          echo 'A61_OFF_STATE_RESTORED=PASS'

      - name: Final read-only proof
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/employee/auth/health" > /tmp/auth-final.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/employee/legacy-action/health" > /tmp/bridge-final.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/t12/customers/write/health" > /tmp/customer-final.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROD_URL/v1/t12/orders/create/health" > /tmp/order-final.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-final.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/bridge-final.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/customer-final.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/order-final.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false) process.exit(61);
          if(Number(a.nativeReadyCount||0)<1) process.exit(62);
          if(!b.success||b.enabled!==false) process.exit(63);
          if(!c.success||String(c.mode||'').toUpperCase()!=='GENERAL') process.exit(64);
          if(!o.success||String(o.mode||'').toUpperCase()!=='GENERAL') process.exit(65);
          console.log('A61_NATIVE_BOOTSTRAP_CANARY=SUCCESS');
          console.log('FINAL_NATIVE_READY_COUNT='+Number(a.nativeReadyCount||0));
          console.log('FINAL_AUTH_MODE=OFF');
          console.log('FINAL_BRIDGE_ENABLED=NO');
          console.log('CUSTOMER_MODE=GENERAL');
          console.log('ORDER_CREATE_MODE=GENERAL');
          NODE

      - name: Emergency rollback to OFF on any failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute trendos-main --remote --config wrangler.toml --command "UPDATE employee_auth_control_v1 SET mode='OFF', policy_epoch=policy_epoch+1, updated_at=CURRENT_TIMESTAMP WHERE singleton=1 AND marker='T12_EMPLOYEE_AUTH_V1';"
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml
          echo 'A61_EMERGENCY_OFF_RESTORE_ATTEMPTED=YES'

      - name: Cleanup ephemeral token and runner config
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f /tmp/a61-native-token /tmp/a61-auth-source
          rm -f cloudflare-d1/wrangler.a61-canary.runtime.toml
          echo 'A61_EPHEMERAL_DATA_CLEANED=YES'
