
name: TrendOS Entry633 Native Alias Frontend Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry633-native-alias-frontend-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry633-native-alias-frontend-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      EXPECTED_FRONTEND_VERSION: 8bcf0fe4-92db-4c2b-b32f-2dc418d0a03d
      PRE_DISPATCHER_COMMIT: a6c959d5f9c097e3005e194942cd1ae541b0c082
      ALIAS_DISPATCHER_COMMIT: 2dab878100c78b5e1db0e0fa1f157e1cbd44b2ca
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      NEW_DISPATCHER_TAG: 20261006-entry633-native-alias

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Repo qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/entry633_native_username_canonicalization.test.mjs
          test "$(git rev-parse "$ALIAS_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js")" = "$(git rev-parse HEAD:employee-api-dispatcher-v1.js)"
          echo ENTRY633_REPO_QUALIFICATION=PASS

      - name: Exact live preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_PASSWORD"
          test "$(printf '%s' "$QUALIFY_USERNAME")" = "ضياء"

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1||full[0].id!==process.env.EXPECTED_FRONTEND_VERSION) throw new Error('frontend version drift '+JSON.stringify(full));
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY633_FRONTEND_VERSION_LOCK=PASS');
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry633pre=$GITHUB_SHA" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='TRANSITIONAL'||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5||a.nativeOnly!==false||a.plaintextStored!==false) throw new Error('auth drift');
          if(b.enabled!==false) throw new Error('bridge unexpectedly enabled');
          if(co.mode!=='READONLY'||ct.mode!=='READONLY'||cm.mode!=='READONLY'||o.mode!=='GENERAL'||ac.mode!=='READONLY') throw new Error('family drift');
          console.log('ENTRY633_RUNTIME_PREFLIGHT=PASS');
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry633pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry633pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry633pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry633pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry633pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry633pre=$suffix" -o /tmp/live-attendance.js

          git show "$PRE_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" >/tmp/pre-dispatcher.js
          cmp -s /tmp/live-dispatcher.js /tmp/pre-dispatcher.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES = [];" /tmp/live-config.js
          echo ENTRY633_EXACT_LIVE_BASELINE=PASS

      - name: Build exact-live alias dispatcher bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js
          git show "$ALIAS_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" > cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          export NEW_DISPATCHER="employee-api-dispatcher-v1.js?v=$NEW_DISPATCHER_TAG"
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          pat=r'employee-api-dispatcher-v1[.]js[?]v=[^"]+'
          matches=re.findall(pat,s)
          if len(matches)!=1: raise SystemExit('dispatcher cache tag count='+str(len(matches)))
          p.write_text(re.sub(pat,os.environ['NEW_DISPATCHER'],s,count=1))
          PY

          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "T12_ENTRY633_NATIVE_USERNAME_CANONICALIZATION_V1_20261006" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "function nativeCanonicalUsername" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "employee-api-dispatcher-v1.js?v=$NEW_DISPATCHER_TAG" cloudflare-d1/frontend-dist/index.html
          echo ENTRY633_ALIAS_FRONTEND_BUNDLE=PASS

      - name: Deploy with rollback and live alias smoke
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry633 alias canonicalization automatic rollback" --config "$FRONTEND_CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry633post=$suffix" -o /tmp/post-index.html \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry633post=$suffix" -o /tmp/post-config.js \
              && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry633post=$suffix" -o /tmp/post-dispatcher.js \
              && grep -Fq "employee-api-dispatcher-v1.js?v=$NEW_DISPATCHER_TAG" /tmp/post-index.html \
              && grep -Fq "T12_ENTRY633_NATIVE_USERNAME_CANONICALIZATION_V1_20261006" /tmp/post-dispatcher.js \
              && grep -Fq "function nativeCanonicalUsername" /tmp/post-dispatcher.js \
              && grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/post-config.js; then
                OK=1
                echo "ENTRY633_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('/tmp/post-dispatcher.js','utf8');
          const calls=[];
          const realFetch=globalThis.fetch;
          const legacy=async(action,params)=>({success:true,source:'legacy',action});
          legacy.__trendosEdgeOrdersReadV1=true;
          const windowObject={
            MATBAGY_EMPLOYEE_NATIVE_AUTH_V1:false,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1:true,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS:['ضياء','diaa','وائل','wael','جابر','gaber','jaber','رحمه','رحمة','rahma','ريفان','ريڤان','revan','rivan'],
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES:0,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT:5,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1:false,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES:[],
            MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE:'GENERAL',
            MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_API_URL:process.env.API_URL,
            MATBAGY_EDGE_ORDERS_API_URL:process.env.API_URL,
            trendosSecureApiV1922:legacy
          };
          const trackedFetch=async(url,options={})=>{
            let body=null;try{body=options.body?JSON.parse(options.body):null}catch{}
            calls.push({url:String(url),body});
            return realFetch(url,options);
          };
          const sandbox={window:windowObject,console,URL,Set,Map,JSON,Error,Number,Date,Promise,AbortController,TextEncoder,setTimeout,clearTimeout,setInterval,clearInterval,Response,fetch:trackedFetch};
          vm.runInNewContext(source,sandbox,{filename:'live-entry633-dispatcher.js'});
          (async()=>{
            const password=String(process.env.QUALIFY_PASSWORD||'');
            const out=await windowObject.trendosEmployeeApiV1('login',{username:'diaa',password});
            const token=String(out&&out.user&&out.user.token||'').trim();
            if(out.success!==true||String(out.authSource||'')!=='d1-native-employee-v1'||!token) throw new Error('alias login failed');
            console.log('::add-mask::'+token);
            const loginCall=calls.find(x=>x.url.endsWith('/v1/employee/auth/login'));
            if(!loginCall||String(loginCall.body&&loginCall.body.username)!=='ضياء') throw new Error('alias was not canonicalized');
            if(calls.some(x=>x.url.includes('/v1/employee/legacy-action'))) throw new Error('bridge call observed');
            console.log('ENTRY633_LIVE_ALIAS_DIAA_TO_DIAA_AR=PASS');
            console.log('ENTRY633_LIVE_ALIAS_LOGIN_NATIVE=PASS');
            console.log('ENTRY633_LIVE_BRIDGE_CALLS=0');

            const logout=await windowObject.trendosEmployeeApiV1('logout',{username:'diaa',token});
            if(logout.success!==true) throw new Error('alias logout failed');
            console.log('ENTRY633_LIVE_ALIAS_LOGOUT=PASS');
          })().catch(e=>{console.error('ENTRY633_LIVE_ALIAS_SMOKE=FAIL '+String(e&&e.message||e));process.exit(31);});
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry633stable=$GITHUB_SHA" -o "/tmp/$f-post.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-post.json','utf8'));
          const a=r('auth'),b=r('legacy-action'),co=r('core'),ct=r('content'),cm=r('comms'),o=r('ops'),ac=r('accounting');
          if(a.mode!=='TRANSITIONAL'||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5||a.nativeOnly!==false||a.plaintextStored!==false) throw new Error('auth post drift');
          if(b.enabled!==false) throw new Error('bridge post drift');
          if(co.mode!=='READONLY'||ct.mode!=='READONLY'||cm.mode!=='READONLY'||o.mode!=='GENERAL'||ac.mode!=='READONLY') throw new Error('family post drift');
          console.log('ENTRY633_FRONTEND_POSTFLIGHT=PASS');
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1) throw new Error('frontend post version');
          console.log('ENTRY633_FRONTEND_VERSION='+full[0].id);
          NODE

          trap - ERR
          echo ENTRY633_NATIVE_ALIAS_FRONTEND=PASS
          echo ENTRY633_API_DEPLOY=NO
          echo ENTRY633_AUTH_FLAG_MUTATION=NO
          echo ENTRY633_D1_BUSINESS_MUTATION=NO
          echo ENTRY633_ACCOUNTING_TOUCHED=NO
          echo ENTRY633_EASYSTORE_TOUCHED=NO
