name: Autonomous Printshop Cloud Design Artifact Diagnostic

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: Existing cloud order-file ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      FILE_ID: ${{ inputs.file_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build validated read-only lookup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const id=String(process.env.FILE_ID||'').trim();
          if(!id||id.length>180||!/^[A-Za-z0-9_.:\/-]+$/.test(id)) throw new Error('FILE_ID_INVALID');
          const sql=[
            'SELECT COUNT(*) AS exactRows,',
            "SUM(CASE WHEN trim(order_id)<>'' AND trim(line_id)<>'' AND trim(r2_key)<>'' AND length(content_sha256)=64 THEN 1 ELSE 0 END) AS hashedLinkedRows",
            'FROM employee_order_conversation_files_v1',
            "WHERE file_id='"+id+"';"
          ].join('\\n');
          fs.writeFileSync('/tmp/q.sql',sql);
          console.log('FILE_ID_FORMAT=PASS');
          NODE

      - name: Read source candidate only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "${DB_NAME}" --remote --config "${CONFIG}" --json --file /tmp/q.sql > /tmp/q.json
          node <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/q.json','utf8'))?.[0]?.results?.[0]||{};
          console.log('CLOUD_DESIGN_SOURCE_EXACT_ROWS='+Number(r.exactRows||0));
          console.log('CLOUD_DESIGN_SOURCE_HASHED_LINKED_ROWS='+Number(r.hashedLinkedRows||0));
          console.log('PRODUCTION_MUTATION=NO');
          NODE

      - name: Safety conclusion
        run: |
          echo 'READ_ONLY_DIAGNOSTIC=YES'
          echo 'ARTIFACT_WRITE=NO'
          echo 'APPROVAL_WRITE=NO'
          echo 'PREFLIGHT_WRITE=NO'
          echo 'READINESS_WRITE=NO'
          echo 'OPERATOR_TASK_WRITE=NO'
