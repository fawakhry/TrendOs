name: TrendOS 02CS Exact Version Production Deploy V2 TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-exact-version-production-deploy-v2-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cs-exact-version-production-deploy
  cancel-in-progress: false

jobs:
  deploy-qualified-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      WORKER_NAME: trendos-d1-api
      TARGET_VERSION: c77bf453-c590-4cff-a55b-fd9c625b6d76
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static production safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$QUALIFY_USERNAME" && test -n "$QUALIFY_EMPLOYEE_TOKEN"
          test "$TARGET_VERSION" = 'c77bf453-c590-4cff-a55b-fd9c625b6d76'
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          git fetch origin main --depth=1
          if git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true'; then
            echo 'Production frontend D1 flag must remain OFF'; exit 1
          fi
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          node tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          echo 'PERF_CF_02CS_PROD_V2_STATIC_GATE_PASS'

      - name: Capture active production version — GET only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const deployments=x&&x.result&&Array.isArray(x.result.deployments)?x.result.deployments:[];
          if(x.success!==true||!deployments.length) throw new Error('No active Worker deployment returned');
          const versions=Array.isArray(deployments[0].versions)?deployments[0].versions:[];
          const active=versions.slice().sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]||{};
          const id=String(active.version_id||'').trim();
          if(!id) throw new Error('Active version ID missing');
          fs.appendFileSync(process.env.GITHUB_ENV,`PREVIOUS_VERSION=${id}\n`);
          console.log('PERF_CF_02CS_PREVIOUS_VERSION='+id);
          NODE

      - name: Production boundary before deploy — GET only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          async function get(path){const r=await fetch(process.env.PROD_URL+path,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{const e=await get('/v1/edge/health'),c=await get('/v1/cloud/write/health'),q=await get('/v1/qualification/cloud-write/reconcile/health'),u=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');
            assert.equal(e.status,200);assert.equal(e.body.success,true);assert.equal(e.body.database,true);assert.equal(e.body.cutover,false);
            assert.equal(c.status,200);assert.equal(c.body.success,true);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);
            assert.equal(q.status,200);assert.equal(q.body.enabled,false);assert.equal(q.body.genericDrainEnabled,false);assert.equal(u.status,401);
            console.log('PERF_CF_02CS_PROD_V2_PRE_BOUNDARY_PASS');})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Wrangler syntax guard — no mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy --help > /tmp/help.txt
          grep -Fq '[VERSION-SPECS]' /tmp/help.txt || grep -qi 'version' /tmp/help.txt
          echo 'PERF_CF_02CS_VERSIONS_DEPLOY_SYNTAX_PASS'

      - name: Deploy exact qualified version at 100 percent
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${TARGET_VERSION}@100%" --yes --config cloudflare-d1/wrangler.toml --message "TrendOS 02CS qualified D1 read route; frontend remains OFF"
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          echo "PERF_CF_02CS_EXACT_VERSION_DEPLOYED=$TARGET_VERSION"
          sleep 12

      - name: Authenticated production canary with propagation retries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const critical=['rowNumber','orderId','orderCode','lineId','customer','customerPhone','customerSource','source','externalCustomerId','customerMode','department','itemName','qty','assignedTo','priority','status','ready','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','updatedAt','notes','customerNotified','notifiedAt','notifiedBy','lastWhatsAppMessage','lastWhatsAppAt','lastWhatsAppBy','receivedAt','expectedDeliveryAt','expectedDeliveryText','overdue','registrationSent'];
          const text=v=>String(v==null?'':v).trim();
          const key=r=>[text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');
          const fly=v=>['نعم','true','1','on','طباعة على الطاير','طباعة ع الطاير','على الطاير','ع الطاير'].includes(text(v).toLowerCase());
          function prio(v){v=text(v)||'عادي';if(v==='عاجل'||v==='VIP')return 0;if(v==='عادي')return 1;if(v==='مؤجل')return 2;return 9;}
          function tier(r,s){if(s==='print'&&fly(r.flyPrint||r.quickPrint))return 0;return (s==='print'?1:0)+prio(r.priority);}
          function ordered(rows,s){let p=-Infinity;for(const r of rows){const t=tier(r,s);assert.ok(t>=p,s+' operational tier regression');p=t;}}
          async function req(label,url,opt={}){let last;for(let i=1;i<=5;i++){try{const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b;try{b=JSON.parse(raw||'{}')}catch{throw new Error(label+' invalid JSON http='+r.status)}return{status:r.status,body:b};}catch(e){last=e;if(i<5)await sleep(2000*i)}}throw last;}
          async function session(){let last;for(let i=1;i<=12;i++){try{const x=await req('session',base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});if(x.status===200&&x.body.success&&x.body.edgeToken){console.log('PERF_CF_02CS_PROD_SESSION_PASS_ATTEMPT='+i);return x.body.edgeToken;}last=new Error('session http='+x.status);}catch(e){last=e}await sleep(Math.min(12000,2000*i));}throw last;}
          async function edge(s,t){const p=new URLSearchParams({screen:s,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});const x=await req('edge-'+s,base+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+t}});assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');return x.body;}
          async function app(s){const payload={action:'getRowsPageV1931',username,token:employeeToken,screen:s,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};const x=await req('apps-'+s,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});assert.equal(x.status,200);assert.equal(x.body.success,true);return x.body;}
          (async()=>{const t=await session(),summary=[];for(const s of ['print','laser']){const e=await edge(s,t),a=await app(s),ek=(e.rows||[]).map(key),ak=(a.rows||[]).map(key);assert.deepEqual([...ek].sort(),[...ak].sort(),s+' identity mismatch');ordered(e.rows||[],s);for(const r of e.rows||[])for(const k of critical)assert.ok(Object.prototype.hasOwnProperty.call(r,k),s+' missing '+k);for(const m of e.mirrors||[]){assert.equal(m.status,'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}summary.push({screen:s,totalRows:ek.length,ordered:true,fieldContract:critical.length});}
            const p=new URLSearchParams({screen:'print',page:'1',pageSize:'5',statusFilter:'__DEBT__'});const d=await req('debt',base+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+t}});assert.equal(d.status,409);assert.equal(d.body.code,'apps-script-required');assert.equal(d.body.fallback,'apps-script');console.log('PERF_CF_02CS_PROD_V2_CANARY_PASS='+JSON.stringify({summary,debtFallback:true}));})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Final production boundary and frontend OFF
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          if git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true'; then echo 'Production frontend D1 flag became ON'; exit 1; fi
          node <<'NODE'
          const assert=require('node:assert/strict');async function get(p){const r=await fetch(process.env.PROD_URL+p,{cache:'no-store',headers:{accept:'application/json'}});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          (async()=>{const e=await get('/v1/edge/health'),c=await get('/v1/cloud/write/health'),q=await get('/v1/qualification/cloud-write/reconcile/health'),u=await get('/v1/edge/orders/page?screen=print&page=1&pageSize=1');assert.equal(e.status,200);assert.equal(e.body.cutover,false);assert.equal(c.status,200);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);assert.equal(q.status,200);assert.equal(q.body.enabled,false);assert.equal(q.body.genericDrainEnabled,false);assert.equal(u.status,401);console.log('PERF_CF_02CS_PROD_V2_FINAL_BOUNDARY_PASS');})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          echo 'PERF_CF_02CS_PRODUCTION_WORKER_ROUTE_PASS_FRONTEND_OFF'

      - name: Automatic rollback to exact previous version on persistent failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIOUS_VERSION:-}"
          echo "PERF_CF_02CS_ROLLBACK_TO=$PREVIOUS_VERSION"
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${PREVIOUS_VERSION}@100%" --yes --config cloudflare-d1/wrangler.toml --message "TrendOS 02CS automatic rollback after failed production canary"
          sleep 12
          curl --fail --silent --show-error "$PROD_URL/v1/edge/health" > /tmp/rh.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/rh.json','utf8'));if(!x.success||x.cutover!==false)process.exit(1)"
          echo 'PERF_CF_02CS_AUTOMATIC_ROLLBACK_PASS'
