name: EasyStore A2.7 Approved First Canary Execution

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a27-approved-first-canary-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-a27-approved-first-canary
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Preflight exact approved scope
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$EASYSTORE_URL/config.js?a27exec=$GITHUB_RUN_ID" > /tmp/config.js
          curl --fail --silent --show-error --location "$EASYSTORE_URL/app.js?a27exec=$GITHUB_RUN_ID" > /tmp/app.js
          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27exec=$GITHUB_RUN_ID" > /tmp/health.json

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events;
          " > /tmp/counts-pre.json

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT canonical_username AS username,role,department,active
              FROM employee_auth_users_v1
             WHERE canonical_username='ضياء' AND lower(role)='admin' AND active=1;
          " > /tmp/user.json

          node <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('/tmp/config.js','utf8'),app=fs.readFileSync('/tmp/app.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          function rows(path){const x=JSON.parse(fs.readFileSync(path,'utf8')),out=[];const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(Array.isArray(v.results))out.push(...v.results);for(const [k,z] of Object.entries(v))if(k!=='results')w(z);}};w(x);return out;}
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'CANARY'/.test(cfg))throw new Error('live frontend not CANARY');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\['saveAccountingTemplate'\]/.test(cfg))throw new Error('live frontend action mismatch');
          if(!app.includes("itemName:'A2-CANARY-TEMPLATE-'+Date.now()"))throw new Error('synthetic payload guard missing');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw new Error('backend must begin READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0)throw new Error('server allowlists must begin empty');
          if(Number(h.writeCanaryMaxCommands||0)!==0||Number(h.writeCanaryCommandsStarted||0)!==0)throw new Error('command budget must begin unarmed');
          const c=rows('/tmp/counts-pre.json')[0]||{};
          if(Object.values(c).some(v=>Number(v||0)!==0))throw new Error('clean accounting baseline required: '+JSON.stringify(c));
          const u=rows('/tmp/user.json'); if(u.length!==1||u[0].username!=='ضياء')throw new Error('canonical Diaa admin identity not proven');
          console.log('A27_EXEC_PREFLIGHT=PASS');
          console.log('A27_EXEC_USER=ضياء');
          console.log('A27_EXEC_ACTION=saveAccountingTemplate');
          console.log('A27_EXEC_BASELINE_ROWS=0');
          console.log('GENERAL_ALLOWED=NO');
          NODE

      - name: Arm one command, wait for Diaa, then auto-disable
        shell: bash
        run: |
          set -eEuo pipefail
          cleanup(){
            trap - EXIT ERR
            cat > /tmp/disable.sql <<'SQL'
          UPDATE employee_accounting_control_v1
             SET mode='READONLY',policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1' AND mode IN ('READONLY','CANARY');
          UPDATE employee_accounting_write_canary_v1
             SET enabled=1,allowed_usernames_json='[]',allowed_actions_json='[]',
                 max_amount=0,max_commands=0,commands_started=0,expires_at_ms=0,
                 policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1 AND marker='EASYSTORE_A2_WRITE_CANARY_V1';
          SQL
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --file /tmp/disable.sql >/tmp/cleanup.log 2>&1 || true
          }
          trap cleanup EXIT ERR

          EXPIRES="$(( $(date +%s%3N) + 15*60*1000 ))"
          cat > /tmp/arm.sql <<SQL
          UPDATE employee_accounting_write_canary_v1
             SET enabled=1,
                 allowed_usernames_json='["ضياء"]',
                 allowed_actions_json='["saveAccountingTemplate"]',
                 max_amount=0,max_commands=1,commands_started=0,
                 expires_at_ms=$EXPIRES,policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1 AND marker='EASYSTORE_A2_WRITE_CANARY_V1';
          UPDATE employee_accounting_control_v1
             SET mode='CANARY',policy_epoch=policy_epoch+1,updated_at=CURRENT_TIMESTAMP
           WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1' AND mode='READONLY';
          SQL
          if grep -Eq "mode[[:space:]]*=[[:space:]]*'GENERAL'" /tmp/arm.sql; then exit 1; fi
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --file /tmp/arm.sql >/tmp/arm.log

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27armed=$GITHUB_RUN_ID" > /tmp/health-armed.json
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync('/tmp/health-armed.json','utf8'));
          if(h.mode!=='CANARY'||h.writeAuthorityMode!=='CANARY_BOUNDED')throw new Error('server did not enter bounded CANARY');
          if(Number(h.writeCanaryAllowedUserCount)!==1||Number(h.writeCanaryAllowedActionCount)!==1)throw new Error('scope not one user/one action');
          if(Number(h.writeCanaryMaxAmount)!==0||Number(h.writeCanaryMaxCommands)!==1||Number(h.writeCanaryCommandsStarted)!==0)throw new Error('budget mismatch');
          console.log('A27_EXEC_SERVER_ARMED=ONE_USER_ONE_ACTION_ONE_COMMAND_ZERO_VALUE');
          NODE

          echo "A27_EXEC_WAITING_FOR_DIAA_CLICK=YES"
          STARTED_AT=0
          SUCCESS=0
          for i in $(seq 1 120); do
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
              SELECT
                (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
                (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
                (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
                (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
                (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
                (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
                (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
                (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
                (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
                (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
                (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
                (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
                (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
                (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
                (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
                (SELECT commands_started FROM employee_accounting_write_canary_v1 WHERE singleton=1) AS commandsStarted;
            " > /tmp/poll.json
            node <<'NODE' > /tmp/poll-state.txt
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/poll.json','utf8')),rows=[];
          const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(v.materials!==undefined)rows.push(v);Object.values(v).forEach(w);}};w(x);
          if(rows.length!==1)throw new Error('poll parse');const r=rows[0];
          const forbidden=['materials','deptLines','finalInvoices','partyLedger','purchases','dailyPurchases','cashbox','waste','custodyEvents','custodyCloses','dayCloses','partyBalances'];
          if(forbidden.some(k=>Number(r[k]||0)!==0))throw new Error('forbidden accounting mutation '+JSON.stringify(r));
          if(Number(r.templates||0)>1||Number(r.requestLedger||0)>1||Number(r.events||0)>1||Number(r.commandsStarted||0)>1)throw new Error('canary multiplicity exceeded '+JSON.stringify(r));
          if(Number(r.templates||0)===1&&Number(r.requestLedger||0)===1&&Number(r.events||0)===1&&Number(r.commandsStarted||0)===1)console.log('SUCCESS');
          else if(Number(r.commandsStarted||0)===1)console.log('STARTED');
          else console.log('WAIT');
          NODE
            STATE="$(tail -n1 /tmp/poll-state.txt)"
            if [ "$STATE" = "SUCCESS" ]; then SUCCESS=1; break; fi
            if [ "$STATE" = "STARTED" ] && [ "$STARTED_AT" = "0" ]; then STARTED_AT="$i"; fi
            if [ "$STARTED_AT" != "0" ] && [ $((i-STARTED_AT)) -gt 6 ]; then
              echo "command started but did not settle within 30s" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "A27_EXEC_TIMEOUT_NO_COMMAND" >&2
            exit 1
          fi

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT template_id,department,category,item_name,fixed_cost,computed_cost,suggested_sale_price,active,updated_by
              FROM employee_accounting_templates_v1;
            SELECT request_key,operation,actor,status,entity_id
              FROM employee_accounting_request_ledger_v1;
            SELECT entity_type,entity_id,event_type,actor,request_key
              FROM employee_accounting_events_v1;
          " > /tmp/evidence.json

          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/evidence.json','utf8')),rows=[];
          const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(Array.isArray(v.results))rows.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')w(z);}};w(x);
          const all=rows.flat();
          const t=all.find(r=>r.template_id),q=all.find(r=>r.request_key&&r.operation),e=all.find(r=>r.entity_type);
          if(!t||!q||!e)throw new Error('evidence rows missing');
          if(t.department!=='عام'||t.category!=='A2_CANARY'||!String(t.item_name||'').startsWith('A2-CANARY-TEMPLATE-'))throw new Error('template identity mismatch');
          if(Number(t.fixed_cost)!==0||Number(t.computed_cost)!==0||Number(t.suggested_sale_price)!==0||Number(t.active)!==0)throw new Error('template not inactive zero-value');
          if(t.updated_by!=='ضياء')throw new Error('template actor mismatch');
          if(q.operation!=='template-upsert'||q.actor!=='ضياء'||q.status!=='COMMITTED'||!String(q.request_key||'').startsWith('A27-TPL-'))throw new Error('request ledger mismatch');
          if(e.entity_type!=='template'||e.event_type!=='create'||e.actor!=='ضياء'||e.request_key!==q.request_key||e.entity_id!==t.template_id)throw new Error('audit event mismatch');
          console.log('A27_EXEC_EXACT_D1_EVIDENCE=PASS');
          console.log('A27_EXEC_TEMPLATE_ID='+t.template_id);
          console.log('A27_EXEC_REQUEST_KEY='+q.request_key);
          NODE

          cleanup
          trap - EXIT ERR

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a27closed=$GITHUB_RUN_ID" > /tmp/health-closed.json
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync('/tmp/health-closed.json','utf8'));
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw new Error('server not closed to READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0||Number(h.writeCanaryMaxCommands||0)!==0||Number(h.writeCanaryCommandsStarted||0)!==0)throw new Error('server canary not fully cleared');
          console.log('A27_EXEC_SERVER_AUTO_DISABLED=PASS');
          console.log('GENERAL_OPENED=NO');
          NODE
