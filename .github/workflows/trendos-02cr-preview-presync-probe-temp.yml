name: TrendOS 02CR Preview Pre-Sync Probe TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cr-preview-presync-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}
    steps:
      - name: Verify 02CR preview fails closed before enrichment sync
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          (async()=>{
            const secret = String(process.env.EDGE_SESSION_SECRET || '');
            if (!secret) throw new Error('preview session secret unavailable');
            const now = Math.floor(Date.now()/1000);
            const claims = { aud:'trendos-orders-edge', sub:'02cr-presync-probe', role:'print', department:'طباعة', screens:['print'], iat:now, exp:now+180, jti:'ci-'+crypto.randomUUID() };
            const body = Buffer.from(JSON.stringify(claims)).toString('base64url');
            const input = 'v1.' + body;
            const sig = crypto.createHmac('sha256', secret).update(input).digest('base64url');
            const token = input + '.' + sig;
            const url = process.env.PREVIEW_URL + '/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=5';
            const r = await fetch(url, {headers:{authorization:'Bearer '+token,accept:'application/json'}});
            const x = await r.json();
            console.log('PERF_CF_02CR_PREVIEW_PRESYNC_STATUS='+r.status);
            console.log('PERF_CF_02CR_PREVIEW_PRESYNC_CODE='+String(x.code||''));
            console.log('PERF_CF_02CR_PREVIEW_PRESYNC_FALLBACK='+String(x.fallback||''));
            console.log('PERF_CF_02CR_PREVIEW_PRESYNC_MIRRORS='+JSON.stringify((x.mirrors||[]).map(m=>({sheetName:m.sheetName,sourceLastRow:m.sourceLastRow,sourceLastCol:m.sourceLastCol,rowCount:m.rowCount,status:m.status,syncedAt:m.syncedAt,note:m.note}))));
            if (r.status !== 503 || x.success !== false || x.code !== '02cr-operational-mirror-not-qualified' || x.fallback !== 'apps-script') process.exit(1);
            console.log('PERF_CF_02CR_PREVIEW_PRESYNC_FAIL_CLOSED_PASS');
          })().catch(e=>{ console.error(e && e.stack || e); process.exit(1); });
          NODE
