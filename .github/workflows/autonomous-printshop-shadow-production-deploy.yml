name: Autonomous Printshop Shadow Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/production-shadow/**'
      - 'autonomous-printshop/core/operational-reality-v1.mjs'
      - 'autonomous-printshop/tests/production_shadow_worker_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-shadow-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-shadow-production-deploy
  cancel-in-progress: false

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.33.2
      SHADOW_URL: https://autonomous-printshop-shadow.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard safety gate — read-only sidecar only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f autonomous-printshop/production-shadow/worker.mjs
          test -f autonomous-printshop/production-shadow/wrangler.toml
          grep -Eq '^name = "autonomous-printshop-shadow"$' autonomous-printshop/production-shadow/wrangler.toml
          grep -Eq '^database_name = "trendos-main"$' autonomous-printshop/production-shadow/wrangler.toml
          grep -q 'PRODUCTION_SHADOW_READ_ONLY' autonomous-printshop/production-shadow/worker.mjs
          grep -q 'writesAccepted:false' autonomous-printshop/production-shadow/worker.mjs
          grep -q 'd1Mutation:false' autonomous-printshop/production-shadow/worker.mjs
          grep -q 'employeeAssignment:false' autonomous-printshop/production-shadow/worker.mjs
          ! grep -Eqi '\bINSERT[[:space:]]+INTO\b|\bUPDATE[[:space:]]+[A-Za-z_"'"'"'\[]|\bDELETE[[:space:]]+FROM\b|\bREPLACE[[:space:]]+INTO\b|\bCREATE[[:space:]]+TABLE\b|\bDROP[[:space:]]+TABLE\b|\bALTER[[:space:]]+TABLE\b' autonomous-printshop/production-shadow/worker.mjs
          ! grep -Eq '\.run[[:space:]]*\(|\.batch[[:space:]]*\(' autonomous-printshop/production-shadow/worker.mjs
          echo 'SHADOW_READONLY_SAFETY_GATE=PASS'

      - name: Run shadow contracts
        run: |
          set -euo pipefail
          node autonomous-printshop/tests/operational_reality_v1.test.mjs
          node autonomous-printshop/tests/production_shadow_worker_v1.test.mjs

      - name: Wrangler dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autonomous-printshop-shadow-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --dry-run \
            --config autonomous-printshop/production-shadow/wrangler.toml \
            --outdir /tmp/autonomous-printshop-shadow-build
          test -d /tmp/autonomous-printshop-shadow-build
          echo 'SHADOW_WRANGLER_DRYRUN=PASS'

      - name: Deploy isolated read-only shadow worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --config autonomous-printshop/production-shadow/wrangler.toml
          sleep 5
          echo 'SHADOW_DEPLOYED=YES'

      - name: Verify production shadow health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$SHADOW_URL/health" > /tmp/health.json
          cat /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(x.success!==true) process.exit(1);
          if(x.service!=='autonomous-printshop-production-shadow') process.exit(2);
          if(x.database!==true) process.exit(3);
          if(x.mode!=='PRODUCTION_SHADOW_READ_ONLY') process.exit(4);
          if(x.writesAccepted!==false||x.d1Mutation!==false||x.employeeAssignment!==false||x.piiExposed!==false) process.exit(5);
          console.log('SHADOW_PRODUCTION_HEALTH=PASS');
          NODE

      - name: Verify live production snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            --output /tmp/snapshot.json --write-out '%{http_code}' "$SHADOW_URL/snapshot")"
          cat /tmp/snapshot.json
          echo
          echo "SNAPSHOT_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/snapshot.json','utf8'));
          if(x.writesAccepted!==false||x.d1Mutation!==false) process.exit(1);
          if(x.success===true){
            if(x.mode!=='PRODUCTION_SHADOW_READ_ONLY') process.exit(2);
            if(x.piiExposed!==false||x.rawOrderIdsExposed!==false||x.rawLineIdsExposed!==false) process.exit(3);
            if(!x.source||x.source.authority!=='trendos-main-d1') process.exit(4);
            console.log('SHADOW_LIVE_SNAPSHOT=PASS');
          } else {
            if(x.code!=='SOURCE_NOT_QUALIFIED') process.exit(5);
            console.log('SHADOW_LIVE_SNAPSHOT=FAIL_CLOSED_SOURCE_NOT_QUALIFIED');
          }
          NODE

      - name: Safety conclusion
        run: |
          echo 'PRODUCTION_WORKER=autonomous-printshop-shadow'
          echo 'TRENDOS_PRIMARY_WORKER_CHANGED=NO'
          echo 'D1_SCHEMA_CHANGED=NO'
          echo 'D1_BUSINESS_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
          echo 'MODE=PRODUCTION_SHADOW_READ_ONLY'
