name: TrendOS T11 Service Lines Exact Parity
on:
  push:
    branches: [cloud-migration-v3-t6b-auth-shadow-canary-20260913]
    paths: ['.github/workflows/cloud-migration-v3-t11-service-lines-exact-parity.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compare exact Service active projection from Lines mirror
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL, apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          const hidden=s=>['جاهز للاستلام','تم التسليم','مكرر','تم التنفيذ','جاهز للطباعة','ملغى','ملغي'].includes(text(s));
          const rank=p=>{p=text(p)||'عادي';return p==='عاجل'||p==='VIP'?0:p==='عادي'?1:p==='مؤجل'?2:9};
          async function req(url,opt={}){const t=Date.now();const r=await fetch(url,{cache:'no-store',redirect:'follow',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms:Date.now()-t};}
          async function login(){for(let n=0;n<4;n++){const l=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});const t=text(l.body?.user?.token);if(l.status===200&&l.body.success===true&&t){console.log('::add-mask::'+t);return t;}}throw Error('login failed')}
          async function authoritative(){for(let n=0;n<4;n++){const token=await login();const a=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username,token,screen:'service',page:'1',pageSize:'100',statusFilter:'__ACTIVE__'})});if(a.status===200&&a.body.success===true)return a;}throw Error('authoritative failed')}
          async function mirror(offset){const r=await req(base+'/v1/mirror/sheet?name='+encodeURIComponent('بنود الأوردرات')+'&limit=500&offset='+offset,{headers:{accept:'application/json'}});assert.equal(r.status,200);assert.equal(r.body.success,true);return r.body.sheet||{};}
          function idx(h,names,fallback=-1){const a=h.map(text);for(const n of names){const i=a.lastIndexOf(n);if(i>=0)return i;}return fallback;}
          (async()=>{const [auth,m0,m1]=await Promise.all([authoritative(),mirror(0),mirror(500)]);const h=m0.headers||[],rows=[...(m0.rows||[]),...(m1.rows||[])];const c={order:idx(h,['رقم الأوردر','Order ID'],0),code:idx(h,['كود الأوردر'],1),line:idx(h,['رقم البند','Line ID'],5),status:idx(h,['الحالة','Status'],10),priority:idx(h,['الأولوية','Priority'],9)};const cand=[];for(const item of rows){if(Number(item.rowNumber||0)<=1)continue;const d=Array.isArray(item.display)&&item.display.length?item.display:(item.values||[]);const orderId=text(d[c.order])||text(d[c.code]),lineId=text(d[c.line]),status=text(d[c.status])||'طلب جديد',priority=text(d[c.priority])||'عادي';if(!orderId&&!lineId)continue;if(hidden(status))continue;cand.push({orderId,lineId,status,priority});}cand.sort((a,b)=>rank(a.priority)-rank(b.priority)||a.orderId.localeCompare(b.orderId));const apps=auth.body.rows||[];const key=r=>[text(r.orderId),text(r.lineId),text(r.status),text(r.priority)||'عادي'].join('|');const ck=cand.map(key),ak=apps.map(key);console.log('T11_LINES_EXACT='+JSON.stringify({candidate:ck.length,apps:ak.length,orderExact:JSON.stringify(ck)===JSON.stringify(ak),candidateFirst:ck.slice(0,5),appsFirst:ak.slice(0,5),mirrorSyncedAt:m0.syncedAt,appsMs:auth.ms,mirrorMs:m0.ms+m1.ms}));const cs=new Set(ck),as=new Set(ak);console.log('T11_LINES_SET='+JSON.stringify({missing:[...as].filter(x=>!cs.has(x)).length,extra:[...cs].filter(x=>!as.has(x)).length}));assert.deepEqual(ck,ak,'exact Service lines projection mismatch');console.log('T11_SERVICE_LINES_EXACT_PARITY=PASS');})().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
