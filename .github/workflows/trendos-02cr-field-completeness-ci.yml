name: TrendOS 02CR Field Completeness CI

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/src/edge-orders-read-v1.mjs'
      - 'cloudflare-d1/src/edge-orders-operational-enrichment-02cr.mjs'
      - 'cloudflare-d1/src/edge-orders-read-02cr-canary.mjs'
      - 'cloudflare-d1/D1_Operational_Enrichment_Live_Sync_02CR.gs'
      - 'tests/cloudflare_edge_orders_read_v1.test.mjs'
      - 'tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs'
      - 'tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs'
      - 'tests/cloudflare_edge_orders_02cr_canary.test.mjs'
      - 'tests/cloudflare_index_v2_02cr_route.test.mjs'
      - 'tests/apps_script_d1_operational_enrichment_live_sync_02cr.test.mjs'
      - '.github/workflows/trendos-02cr-field-completeness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Edge Orders contract
        run: node tests/cloudflare_edge_orders_read_v1.test.mjs
      - name: 02CR duplicate-header last-wins regression
        run: node tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs
      - name: 02CR operational customer/debt enrichment contract
        run: node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
      - name: 02CR isolated operational canary contract
        run: node tests/cloudflare_edge_orders_02cr_canary.test.mjs
      - name: 02CR isolated Worker route contract
        run: node tests/cloudflare_index_v2_02cr_route.test.mjs
      - name: 02CR independent enrichment live sync safety contract
        run: node tests/apps_script_d1_operational_enrichment_live_sync_02cr.test.mjs
      - name: Safety conclusion
        run: |
          echo 'PASS: 02CR candidates only; no production Worker deploy, Apps Script deploy, or frontend re-enable.'
          echo 'PASS: existing Orders Live Sync V2 ownership remains unchanged.'
          echo 'PASS: Apps Script/Sheets remain production read/write authority.'
