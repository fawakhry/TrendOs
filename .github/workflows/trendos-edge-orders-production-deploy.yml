name: TrendOS Edge Orders Production Deploy

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-edge-orders-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-edge-orders-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos.trendmall-contact.workers.dev
      PROD_ALIAS_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production deployment gates
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_preview_safety_v1.test.mjs
          node tests/cloudflare_mirror_safety_v1.test.mjs
          if grep -Eq 'd1 migrations apply' .github/workflows/trendos-edge-orders-production-deploy.yml; then
            echo 'Production Orders read deployment must not apply migrations.'
            exit 1
          fi
          echo 'PASS: code gates pass and no D1 migration command exists.'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Rotate production Edge session secret
        run: |
          set -euo pipefail
          node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))" > /tmp/prod-edge-secret.txt
          chmod 600 /tmp/prod-edge-secret.txt
          cat /tmp/prod-edge-secret.txt | npx wrangler secret put EDGE_SESSION_SECRET --config cloudflare-d1/wrangler.toml
          echo 'PASS: production Edge secret installed; value not logged.'

      - name: Deploy production Worker code only
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare-d1/wrangler.toml

      - name: Verify production base health and mirror
        run: |
          set -euo pipefail
          for base in "$PROD_URL" "$PROD_ALIAS_URL"; do
            echo "Checking $base"
            code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output /tmp/edge-health.json --write-out '%{http_code}' "$base/v1/edge/health")"
            cat /tmp/edge-health.json
            test "$code" = '200'
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"
          done
          curl --fail --silent --show-error --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/orders.json
          curl --fail --silent --show-error --get --data-urlencode 'name=بنود الأوردرات' --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/lines.json
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['/tmp/orders.json','/tmp/lines.json']){
            const x=JSON.parse(fs.readFileSync(file,'utf8')),s=x.sheet||{};
            if(!x.success||x.schemaMutationFree!==true||s.status!=='ready'||Number(s.rowCount||0)!==Number(s.sourceLastRow||0)) process.exit(1);
          }
          console.log('PROD_MIRROR_PARITY_PASS');
          NODE

      - name: Verify production Orders Edge runtime
        run: |
          set -euo pipefail
          anon="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5")"
          test "$anon" = '401'
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const secret=fs.readFileSync('/tmp/prod-edge-secret.txt','utf8').trim(),now=Math.floor(Date.now()/1000);
          const p={aud:'trendos-orders-edge',sub:'ci-prod-admin',role:'admin',department:'إدارة',screens:['service','print','laser','press',''],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const b=Buffer.from(JSON.stringify(p)).toString('base64url'),i='v1.'+b,s=crypto.createHmac('sha256',secret).update(i).digest('base64url');
          fs.writeFileSync('/tmp/prod-token.txt',i+'.'+s,{mode:0o600});
          NODE
          token="$(cat /tmp/prod-token.txt)"
          code="$(curl --silent --show-error --output /tmp/page.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__ACTIVE__")"
          rm -f /tmp/prod-token.txt /tmp/prod-edge-secret.txt
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/page.json','utf8')); if(!x.success||x.dataSource!=='d1-edge-orders'||!Array.isArray(x.rows)||!x.pagination) process.exit(1); console.log('PROD_D1_ORDERS_READ_PASS rows='+x.rows.length+' total='+x.pagination.totalRows+' syncedAt='+(x.mirror&&x.mirror.syncedAt||''))"

      - name: Verify Cloud Write remains OFF
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          cat /tmp/write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
          echo 'PRODUCTION_ORDERS_EDGE_DEPLOY_PASS'
