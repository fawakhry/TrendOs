name: T12 Archive Ready Counts Readonly Diagnosis 20261102
on:
  push:
    branches: [candidate/t12-full-cloud-cutover-a56-20260929]
    paths: ['.github/workflows/t12-archive-ready-counts-readonly-20261102.yml']
permissions: { contents: read }
jobs:
  query-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read-only D1 aggregate counts, never return customer rows
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -Fxq 'name = "trendos-d1-api"' cloudflare-d1/wrangler.toml
          grep -Fq 'database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"' cloudflare-d1/wrangler.toml
          for spec in \
            "native_orders|SELECT COUNT(*) AS n FROM t12_prod_orders" \
            "old_delivered_lines|SELECT COUNT(*) AS n FROM employee_core_lines_v1 WHERE active=1 AND status='تم التسليم'" \
            "old_delivered_orders|SELECT COUNT(DISTINCT order_id) AS n FROM employee_core_lines_v1 WHERE active=1 AND status='تم التسليم'" \
            "native_archived|SELECT COUNT(*) AS n FROM employee_core_archive_orders_v1 a WHERE EXISTS(SELECT 1 FROM t12_prod_orders o WHERE o.order_id=a.order_id)" \
            "active_native_delivered_lines|SELECT COUNT(*) AS n FROM t12_prod_lines l LEFT JOIN t12_prod_line_runtime r ON r.line_id=l.line_id LEFT JOIN employee_core_archive_lines_v1 a ON a.line_id=l.line_id WHERE a.line_id IS NULL AND COALESCE(r.status,l.status)='تم التسليم'" \
            "all_native_delivered_lines|SELECT COUNT(*) AS n FROM t12_prod_lines l LEFT JOIN t12_prod_line_runtime r ON r.line_id=l.line_id WHERE COALESCE(r.status,l.status)='تم التسليم'" \
            "native_archived_lines|SELECT COUNT(*) AS n FROM employee_core_archive_lines_v1 a WHERE EXISTS(SELECT 1 FROM t12_prod_lines l WHERE l.line_id=a.line_id)" \
            "native_ready|SELECT COUNT(*) AS n FROM t12_prod_orders o WHERE EXISTS(SELECT 1 FROM t12_prod_lines l WHERE l.order_id=o.order_id) AND NOT EXISTS(SELECT 1 FROM t12_prod_lines l LEFT JOIN t12_prod_line_runtime r ON r.line_id=l.line_id WHERE l.order_id=o.order_id AND COALESCE(r.status,l.status)<>'تم التسليم') AND NOT EXISTS(SELECT 1 FROM employee_core_archive_orders_v1 a WHERE a.order_id=o.order_id)"; do
            name="${spec%%|*}"; sql="${spec#*|}"
            set +e
            raw="$(npx --yes wrangler@4.33.2 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --json --command "$sql" 2>&1)"
            exit_code=$?
            set -e
            if [ "$exit_code" -ne 0 ]; then
              echo "DIAG=${name} FAIL_EXIT_${exit_code}"
              echo "$raw" | tail -c 1000
              continue
            fi
            printf '%s' "$raw" >/tmp/count.json
            NAME="$name" node <<'NODE'
          const fs=require('fs');let j;try{j=JSON.parse(fs.readFileSync('/tmp/count.json','utf8'))}catch(e){console.log(process.env.NAME+'=invalid_json');process.exit(0)}
          const arr=Array.isArray(j)?j:[j],z=arr.flatMap(x=>x.results||[]);console.log('ARCHIVE_COUNT_'+process.env.NAME.toUpperCase()+'='+String(z[0]?.n??'unknown'))
          NODE
          done
          echo ARCHIVE_READONLY_ONLY=PASS
