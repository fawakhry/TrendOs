name: Autonomous Printshop Policy V1 CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'autonomous-printshop/core/autonomy-policy-v1.mjs'
      - 'autonomous-printshop/core/autonomy-event-ledger-v1.mjs'
      - 'autonomous-printshop/core/operational-reality-v1.mjs'
      - 'autonomous-printshop/core/trendos-operational-reality-read-adapter-v1.mjs'
      - 'autonomous-printshop/core/operator-task-authority-v1.mjs'
      - 'autonomous-printshop/core/employee-supervisor-shadow-v1.mjs'
      - 'autonomous-printshop/migrations/0019_autonomy_events_v1.sql'
      - 'autonomous-printshop/migrations/0020_operator_task_authority_v1.sql'
      - 'autonomous-printshop/migrations/0021_t12_order_schedule_v1.sql'
      - 'autonomous-printshop/migrations/0022_t12_order_schedule_maintenance_v1.sql'
      - 'autonomous-printshop/tests/trendos_autonomy_policy_v1.test.mjs'
      - 'autonomous-printshop/tests/trendos_autonomy_event_ledger_v1.test.mjs'
      - 'autonomous-printshop/tests/operational_reality_v1.test.mjs'
      - 'autonomous-printshop/tests/trendos_operational_reality_read_adapter_v1.test.mjs'
      - 'autonomous-printshop/tests/autonomous_printshop_shadow_route_v1.test.mjs'
      - 'autonomous-printshop/tests/operator_task_authority_v1.test.mjs'
      - 'autonomous-printshop/tests/t12_order_schedule_v1.test.mjs'
      - 'autonomous-printshop/tests/t12_order_schedule_maintenance_v1.test.mjs'
      - 'autonomous-printshop/tests/employee_supervisor_shadow_v1.test.mjs'
      - 'autonomous-printshop/tests/production_shadow_worker_v1.test.mjs'
      - 'autonomous-printshop/production-shadow/**'
      - 'cloudflare-d1/src/autonomous-printshop-shadow-v1.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/wrangler.toml'
      - 'autonomous-printshop/MASTER_BOOK.md'
      - 'autonomous-printshop/manifests/**'
      - '.github/workflows/autonomous-printshop-policy-v1-ci.yml'
  pull_request:
    paths:
      - 'autonomous-printshop/core/autonomy-policy-v1.mjs'
      - 'autonomous-printshop/core/autonomy-event-ledger-v1.mjs'
      - 'autonomous-printshop/core/operational-reality-v1.mjs'
      - 'autonomous-printshop/core/trendos-operational-reality-read-adapter-v1.mjs'
      - 'autonomous-printshop/core/operator-task-authority-v1.mjs'
      - 'autonomous-printshop/migrations/0019_autonomy_events_v1.sql'
      - 'autonomous-printshop/migrations/0020_operator_task_authority_v1.sql'
      - 'autonomous-printshop/tests/trendos_autonomy_policy_v1.test.mjs'
      - 'autonomous-printshop/tests/trendos_autonomy_event_ledger_v1.test.mjs'
      - 'autonomous-printshop/tests/operational_reality_v1.test.mjs'
      - 'autonomous-printshop/tests/trendos_operational_reality_read_adapter_v1.test.mjs'
      - 'autonomous-printshop/tests/autonomous_printshop_shadow_route_v1.test.mjs'
      - 'autonomous-printshop/tests/operator_task_authority_v1.test.mjs'
      - 'cloudflare-d1/src/autonomous-printshop-shadow-v1.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/wrangler.toml'
      - 'autonomous-printshop/MASTER_BOOK.md'
      - 'autonomous-printshop/manifests/**'
      - '.github/workflows/autonomous-printshop-policy-v1-ci.yml'

permissions:
  contents: read

jobs:
  autonomy-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run autonomy policy contract
        run: node autonomous-printshop/tests/trendos_autonomy_policy_v1.test.mjs
      - name: Run autonomy shadow ledger contract
        run: node autonomous-printshop/tests/trendos_autonomy_event_ledger_v1.test.mjs
      - name: Run operational reality contract
        run: node autonomous-printshop/tests/operational_reality_v1.test.mjs
      - name: Run TrendOS reality read adapter contract
        run: node autonomous-printshop/tests/trendos_operational_reality_read_adapter_v1.test.mjs
      - name: Run production shadow route contract
        run: node autonomous-printshop/tests/autonomous_printshop_shadow_route_v1.test.mjs
      - name: Run Operator Task authority contract
        run: node autonomous-printshop/tests/operator_task_authority_v1.test.mjs
      - name: Run T12 native schedule contract
        run: node autonomous-printshop/tests/t12_order_schedule_v1.test.mjs
      - name: Run T12 native schedule maintenance contract
        run: node autonomous-printshop/tests/t12_order_schedule_maintenance_v1.test.mjs
      - name: Run Employee Supervisor shadow contract
        run: node autonomous-printshop/tests/employee_supervisor_shadow_v1.test.mjs
      - name: Run isolated production shadow worker contract
        run: node autonomous-printshop/tests/production_shadow_worker_v1.test.mjs
      - name: Check production worker bundle entry
        run: node --check cloudflare-d1/src/index_v2.js
