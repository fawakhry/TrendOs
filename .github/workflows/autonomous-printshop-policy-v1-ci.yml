permissions:
  contents: read

concurrency:
  group: autonomous-printshop-policy-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run autonomy policy contract
        run: node autonomous-printshop/tests/trendos_autonomy_policy_v1.test.mjs
      - name: Run autonomy shadow ledger contract
        run: node autonomous-printshop/tests/trendos_autonomy_event_ledger_v1.test.mjs
      - name: Run operational reality contract
        run: node autonomous-printshop/tests/operational_reality_v1.test.mjs
