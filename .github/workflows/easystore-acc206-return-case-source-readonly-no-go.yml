name: ACC206 Actual Invoice Cash Receipt Return Preview Offline NO_GO
on:
  pull_request:
permissions:
  contents: read
jobs:
  acc206-real-native-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real checked-in accounting Worker invoice/cashbox preview test with synthetic D1 only
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          OPENAI_API_KEY: ''
          WHATSAPP_TOKEN: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$OPENAI_API_KEY"
          test -z "$WHATSAPP_TOKEN"
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --check tests/easystore_acc206_native_invoice_return_exposure_sqlite_no_go.test.mjs
          node tests/easystore_acc206_native_invoice_return_exposure_sqlite_no_go.test.mjs
          echo 'ACC206_ACTUAL_SOURCE_SYNTHETIC_SQLITE_ONLY=PASS'
          echo 'ACC206_CASH_REFUND_IMPLEMENTED=NO'
          echo 'ACC206_FINANCE_RELEASE=NO_GO'
