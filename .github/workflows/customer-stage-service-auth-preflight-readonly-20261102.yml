name: ONE SHOT Customer Stage Service Auth Readonly Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/customer-stage-service-auth-preflight-readonly-20261102.yml'
permissions:
  contents: read
concurrency:
  group: customer-stage-service-auth-readonly-20261102
  cancel-in-progress: false
jobs:
  qualified-readonly-audit:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-service-auth-preflight-readonly-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout fixed read-only Stage inspection code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require known account access source and literal GET-only audit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = ops/customer-stage-service-auth-preflight-readonly-20261102
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          python3 -m py_compile tools/customer_stage_service_auth_preflight_readonly_20261102.py
          ! grep -Eq "method=.(POST|PATCH|PUT|DELETE)|\.request\.(post|patch|put|delete)\(" tools/customer_stage_service_auth_preflight_readonly_20261102.py
          echo 'ACCESS_READ_ONLY_CODE_GATE=PASS'
      - name: Inspect exact remote synthetic Worker, deny-all app and token metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/customer_stage_service_auth_preflight_readonly_20261102.py
