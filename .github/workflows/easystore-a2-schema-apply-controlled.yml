name: EasyStore A2 Schema Apply Controlled
# trigger A2.7 migration 0030 one-command budget after ACC-038

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-a2-schema-apply-controlled
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Fail-closed pre-migration audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a2schema=$GITHUB_SHA" > /tmp/health-pre.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health-pre.json','utf8'));
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false||h.schemaReady!==true) throw new Error('accounting-must-remain-readonly');
          if(Number(h.googleBusinessCalls||0)!==0) throw new Error('google-business-call-drift');
          console.log('A2_SCHEMA_PRE_RUNTIME=PASS');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT mode,policy_epoch AS policyEpoch,next_invoice_number AS nextInvoiceNumber
            FROM employee_accounting_control_v1
            WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1';
          " > /tmp/control-pre.json

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events;
          " > /tmp/accounting-pre.json

          node <<'NODE'
          const fs=require('fs');
          function find(path,pred){
            const x=JSON.parse(fs.readFileSync(path,'utf8')), out=[];
            const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(pred(v))out.push(v);Object.values(v).forEach(walk)}};
            walk(x); return out;
          }
          const c=find('/tmp/control-pre.json',x=>x.mode!==undefined&&x.policyEpoch!==undefined)[0];
          if(!c||c.mode!=='READONLY') throw new Error('control-not-readonly');
          fs.writeFileSync('/tmp/pre-epoch.txt',String(Number(c.policyEpoch)));
          fs.writeFileSync('/tmp/pre-next.txt',String(Number(c.nextInvoiceNumber)));
          const rows=find('/tmp/accounting-pre.json',x=>x.materials!==undefined);
          if(rows.length!==1) throw new Error('accounting-count-parse');
          const r=Object.fromEntries(Object.entries(rows[0]).map(([k,v])=>[k,Number(v||0)]));
          const expected={requestLedger:4,materials:1,templates:1,parties:1,partyBalances:1,deptLines:0,finalInvoices:0,partyLedger:0,stockMoves:0,events:4};
          const drift=Object.keys(expected).filter(k=>r[k]!==expected[k]).map(k=>({key:k,actual:r[k],expected:expected[k]}));
          if(drift.length) throw new Error('approved-post-canary-baseline-required:'+JSON.stringify(drift));
          console.log('A2_SCHEMA_ACCOUNTING_BASELINE=APPROVED_CANARY_EVIDENCE');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT name FROM sqlite_master
            WHERE type='table'
              AND name IN ('t12_customers','employee_auth_users_v1','employee_core_orders_v1','employee_core_lines_v1','employee_attendance_days_v1','employee_hr_employees_v1')
            ORDER BY name;
          " > /tmp/sentinel-tables.json

          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/sentinel-tables.json','utf8')),names=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(typeof v.name==='string')names.push(v.name);Object.values(v).forEach(walk)}};
          walk(x);fs.writeFileSync('/tmp/sentinel-names.txt',[...new Set(names)].join('\n')+'\n');
          if(new Set(names).size<3) throw new Error('not-enough-non-accounting-sentinels');
          NODE

          : > /tmp/sentinel-pre.tsv
          while read -r t; do
            [ -n "$t" ] || continue
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "SELECT COUNT(*) AS n FROM \"$t\";" > /tmp/sentinel-one.json
            node - "$t" /tmp/sentinel-one.json /tmp/sentinel-pre.tsv <<'NODE'
          const fs=require('fs');const t=process.argv[2],p=process.argv[3],o=process.argv[4],x=JSON.parse(fs.readFileSync(p,'utf8')),vals=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.n!==undefined)vals.push(Number(v.n));Object.values(v).forEach(walk)}};
          walk(x);if(vals.length!==1)throw new Error('sentinel-count-'+t);fs.appendFileSync(o,t+'\t'+vals[0]+'\n');
          NODE
          done < /tmp/sentinel-names.txt

          npx wrangler d1 migrations list "$DATABASE" --remote --config "$API_CONFIG" || true
          echo A2_SCHEMA_PRECHECK=PASS

      - name: Apply only pending repository migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$DATABASE" --remote --config "$API_CONFIG"
          echo A2_SCHEMA_MIGRATIONS_APPLIED=YES

      - name: Verify A2 schema and invariants
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local label="$1"; local sql="$2"; local expected="$3"
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "$sql" > "/tmp/post-$label.json"
            node - "$label" "$expected" "/tmp/post-$label.json" <<'NODE'
          const fs=require('fs');const label=process.argv[2],expected=Number(process.argv[3]),p=process.argv[4],x=JSON.parse(fs.readFileSync(p,'utf8')),vals=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.n!==undefined)vals.push(Number(v.n));Object.values(v).forEach(walk)}};
          walk(x);if(vals.length!==1||vals[0]!==expected)throw new Error(label+' expected='+expected+' actual='+JSON.stringify(vals));console.log('A2_SCHEMA_'+label.toUpperCase()+'=PASS');
          NODE
          }

          q tables "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name IN (
            'employee_accounting_parties_v1','employee_accounting_purchase_invoices_v1',
            'employee_accounting_daily_purchases_v1','employee_accounting_cashbox_v1',
            'employee_accounting_waste_v1','employee_accounting_custody_events_v1',
            'employee_accounting_custody_closes_v1','employee_accounting_day_closes_v1',
            'employee_accounting_party_balances_v1','employee_accounting_tx_guard_v1'
          );" 10
          q materials_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_materials_v1') WHERE name IN ('raw_width','raw_height');" 2
          q dept_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_dept_lines_v1') WHERE name='work_date';" 1
          q party_ledger_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_party_ledger_v1') WHERE name='party_id';" 1
          q request_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_request_ledger_v1') WHERE name IN ('request_hash','source_system','correlation_id','evidence_refs_json','policy_epoch','command_version');" 6
          q event_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_events_v1') WHERE name IN ('request_key','correlation_id','source_system','evidence_refs_json','policy_epoch','autonomy_level');" 6
          q final_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_final_invoices_v1') WHERE name IN ('work_date','customer_party_id','version','held_paid','replacement_invoice_no','reversed_at_ms','reversed_by','reversal_reason','reversal_ref','manual_cost');" 10
          q day_close_cols "SELECT COUNT(*) AS n FROM pragma_table_info('employee_accounting_day_closes_v1') WHERE name IN ('report_hash','blockers_json');" 2

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_tx_guard_v1) AS txGuard;
          " > /tmp/accounting-post.json

          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/accounting-post.json','utf8')),rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.materials!==undefined)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);if(rows.length!==1)throw new Error('post-accounting-count-parse');
          const r=Object.fromEntries(Object.entries(rows[0]).map(([k,v])=>[k,Number(v||0)]));
          const expected={requestLedger:4,materials:1,templates:1,deptLines:0,finalInvoices:0,partyLedger:0,stockMoves:0,events:4,parties:1,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:1,txGuard:0};
          const drift=Object.keys(expected).filter(k=>r[k]!==expected[k]).map(k=>({key:k,actual:r[k],expected:expected[k]}));
          if(drift.length)throw new Error('migration-created-or-altered-accounting-evidence:'+JSON.stringify(drift));
          console.log('A2_SCHEMA_ACCOUNTING_POST=APPROVED_CANARY_EVIDENCE');
          NODE

          : > /tmp/sentinel-post.tsv
          while read -r t; do
            [ -n "$t" ] || continue
            npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "SELECT COUNT(*) AS n FROM \"$t\";" > /tmp/sentinel-one-post.json
            node - "$t" /tmp/sentinel-one-post.json /tmp/sentinel-post.tsv <<'NODE'
          const fs=require('fs');const t=process.argv[2],p=process.argv[3],o=process.argv[4],x=JSON.parse(fs.readFileSync(p,'utf8')),vals=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.n!==undefined)vals.push(Number(v.n));Object.values(v).forEach(walk)}};
          walk(x);if(vals.length!==1)throw new Error('sentinel-post-'+t);fs.appendFileSync(o,t+'\t'+vals[0]+'\n');
          NODE
          done < /tmp/sentinel-names.txt

          node <<'NODE'
          const fs=require('fs');
          const tsv=p=>Object.fromEntries(fs.readFileSync(p,'utf8').trim().split(/\r?\n/).filter(Boolean).map(x=>{const [k,v]=x.split('\t');return[k,Number(v)]}));
          const a=tsv('/tmp/sentinel-pre.tsv'),b=tsv('/tmp/sentinel-post.tsv');
          const drift=Object.keys(a).filter(k=>a[k]!==b[k]).map(k=>({table:k,pre:a[k],post:b[k]}));
          if(drift.length)throw new Error('non-accounting-sentinel-drift:'+JSON.stringify(drift));
          console.log('A2_SCHEMA_NON_ACCOUNTING_SENTINELS=INVARIANT');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT mode,policy_epoch AS policyEpoch,next_invoice_number AS nextInvoiceNumber
            FROM employee_accounting_control_v1
            WHERE singleton=1 AND marker='ENTRY614_ACCOUNTING_V1';
          " > /tmp/control-post.json

          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/control-post.json','utf8')),rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.mode!==undefined&&v.policyEpoch!==undefined)rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);const r=rows[0];if(!r)throw new Error('control-post-missing');
          const preEpoch=Number(fs.readFileSync('/tmp/pre-epoch.txt','utf8'));
          const preNext=Number(fs.readFileSync('/tmp/pre-next.txt','utf8'));
          if(r.mode!=='READONLY')throw new Error('accounting-mode-drift');
          if(Number(r.policyEpoch)!==preEpoch)throw new Error('accounting-policy-epoch-drift');
          if(Number(r.nextInvoiceNumber)!==preNext)throw new Error('next-invoice-drift');
          console.log('A2_SCHEMA_MODE_PRESERVED=READONLY');
          console.log('A2_SCHEMA_POLICY_EPOCH_PRESERVED='+r.policyEpoch);
          NODE

          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?a2schemapost=$GITHUB_SHA" > /tmp/health-post.json
          node <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health-post.json','utf8'));
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false||Number(h.googleBusinessCalls||0)!==0)throw new Error('post-health-drift');
          console.log('A2_SCHEMA_POST_HEALTH=PASS');
          console.log('A2_SCHEMA_PRODUCTION_BUSINESS_DATA_MUTATION=NO');
          console.log('A2_SCHEMA_POST_BASELINE=APPROVED_CANARY_EVIDENCE');
          NODE
