name: Autonomous Printshop Design Asset Binding Apply Controlled

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'autonomous-printshop/migrations/0025_design_asset_binding_v1.sql'
      - 'autonomous-printshop/tests/design_asset_linking_v1.test.mjs'
      - '.github/workflows/autonomous-printshop-design-asset-binding-apply-controlled.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-design-asset-binding-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      SQL: autonomous-printshop/migrations/0025_design_asset_binding_v1.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify asset binding contract
        run: node autonomous-printshop/tests/design_asset_linking_v1.test.mjs

      - name: Require design evidence foundation first
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT COUNT(*) AS n
              FROM sqlite_master
             WHERE type='table'
               AND name='autonomous_design_artifacts';
          " > /tmp/prereq.json
          cat /tmp/prereq.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/prereq.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.n)!==1) process.exit(1);
          console.log('DESIGN_EVIDENCE_PREREQUISITE=PASS');
          NODE

      - name: Hard safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTONOMOUS_DESIGN_ASSET_BINDING_APPEND_ONLY' "$SQL"
          grep -q 'CUSTOMER_PRIVATE' "$SQL"
          grep -q 'GITHUB_PUBLIC' "$SQL"
          ! grep -Eiq 'GOOGLE_DRIVE' "$SQL"
          ! grep -Eiq '\b(DROP|ALTER|DELETE|VACUUM|REPLACE)\b' "$SQL"
          ! grep -Eiq '(INSERT|UPDATE)[^;]*(t12_prod_|employee_|operator_tasks|autonomy_events|autonomous_readiness_evidence)' "$SQL"
          echo 'DESIGN_ASSET_BINDING_SCHEMA_SAFETY=PASS'

      - name: Apply additive asset binding schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file "$SQL"

      - name: Verify empty append-only binding ledger
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master
                WHERE type='table' AND name='autonomous_design_asset_binding_events') AS bindingTables,
              (SELECT COUNT(*) FROM autonomous_design_asset_binding_events) AS bindingEvents,
              (SELECT mode FROM autonomous_design_control WHERE singleton_id=1) AS designMode,
              (SELECT mode FROM operator_task_control WHERE singleton_id=1) AS operatorTaskMode;
          " > /tmp/post.json
          cat /tmp/post.json
          node - <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'))?.[0]?.results?.[0]||{};
          if(Number(r.bindingTables)!==1) process.exit(1);
          if(Number(r.bindingEvents)!==0) process.exit(2);
          if(String(r.designMode)!=='OFF') process.exit(3);
          if(String(r.operatorTaskMode)!=='OFF') process.exit(4);
          console.log('DESIGN_ASSET_BINDING_FOUNDATION=PASS');
          console.log('DESIGN_CONTROL=OFF');
          console.log('OPERATOR_TASK_CONTROL=OFF');
          NODE

      - name: Safety conclusion
        run: |
          echo 'ASSET_BINDING_SCHEMA=APPLIED_EMPTY'
          echo 'STORAGE_PROVIDER=AGNOSTIC'
          echo 'CUSTOMER_PRIVATE_PUBLIC_STORAGE=FORBIDDEN'
          echo 'ORDER_WRITE=NO'
          echo 'LINE_WRITE=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
