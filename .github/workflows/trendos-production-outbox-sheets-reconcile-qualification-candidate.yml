name: TrendOS Production Outbox Sheets Reconcile Qualification Candidate

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/cloud-write-reconcile-core.mjs'
      - 'cloudflare-d1/src/cloud-write-production-reconcile-qualification.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/production-shadow/index.js'
      - 'cloudflare-d1/wrangler.toml'
      - 'apps-script/patches/CLOUD_WRITE_PRODUCTION_RECONCILE_QUALIFICATION_V1.gs'
      - 'tests/cloudflare_cloud_write_reconcile_exact_target_v1.test.mjs'
      - 'tests/cloudflare_production_reconcile_qualification_v1.test.mjs'
      - 'tests/cloudflare_production_reconcile_qualification_wiring_default_off_v1.test.mjs'
      - 'tests/apps_script_cloud_write_production_reconcile_qualification_v1.test.mjs'
      - '.github/workflows/trendos-production-outbox-sheets-reconcile-qualification-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regression-test existing reconciliation state machine
        run: node --experimental-sqlite tests/cloudflare_cloud_write_reconcile_sqlite_v1.test.mjs

      - name: Prove exact-target selector never consumes older decoy rows
        run: node --experimental-sqlite tests/cloudflare_cloud_write_reconcile_exact_target_v1.test.mjs

      - name: Prove bounded 02CL Worker candidate in isolated SQLite with fake Apps Script ACK
        run: node --experimental-sqlite tests/cloudflare_production_reconcile_qualification_v1.test.mjs

      - name: Verify Apps Script one-record writer static safety contract
        run: node tests/apps_script_cloud_write_production_reconcile_qualification_v1.test.mjs

      - name: Verify isolated Production wrapper wiring remains default-OFF before DB or auth
        run: node tests/cloudflare_production_reconcile_qualification_wiring_default_off_v1.test.mjs

      - name: Verify 02CL stays outside generic core entrypoint
        run: |
          set -euo pipefail
          ! grep -Fq 'cloud-write-production-reconcile-qualification' cloudflare-d1/src/index_v2.js
          grep -Fq 'cloud-write-production-reconcile-qualification.mjs' cloudflare-d1/production-shadow/index.js
          grep -Fq 'TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"' cloudflare-d1/wrangler.toml
          ! grep -Fq 'TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "true"' cloudflare-d1/wrangler.toml
          echo '02CL_ISOLATED_PRODUCTION_WRAPPER_DEFAULT_OFF_PASS'

      - name: Safety conclusion
        run: |
          echo 'PASS means exact-target selection can address only CW-PROD-QUAL-33975124471 when the 02CL lane supplies its selectors.'
          echo 'PASS means an older unrelated pending outbox row remains untouched in isolated SQL tests.'
          echo 'PASS means the Apps Script candidate is default-OFF, exact-ID/exact-payload, one-append maximum, lock-protected, and replay-noop.'
          echo 'PASS means the Worker lane requires Edge auth, explicit confirmation, a dedicated reconciliation secret, and strict persisted-row ACK when enabled.'
          echo 'PASS means the actual Production wrapper now recognizes only the isolated 02CL prefix and rejects POST execution with HTTP 423 while the tracked flag is false, before DB/auth access.'
          echo 'IMPORTANT: this code is prepared on the working branch only. No Worker deployment, Apps Script deployment, live reconciliation, outbox consumption, or cutover occurs in this CI workflow.'
          echo 'Production cutover remains false and Sheets / Apps Script remain authoritative.'
