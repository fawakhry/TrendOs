name: TrendOS T12 D1 Migration Bookkeeping Synthetic Diagnostic

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-t12-d1-migration-bookkeeping-synthetic-diagnostic.yml'

permissions:
  contents: read

jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DB_NAME: trendos-t12-synthetic-test
      TEST_DB_UUID: 54a3c05e-cde9-4979-814f-d40f941edcd5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify TEST D1 identity
        run: |
          set -euo pipefail
          test "$TEST_DB_NAME" = "trendos-t12-synthetic-test"
          test "$TEST_DB_UUID" = "54a3c05e-cde9-4979-814f-d40f941edcd5"
          test "$TEST_DB_UUID" != "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_UUID" > /tmp/db.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/db.json')); if(!x.success||x.result?.name!=='trendos-t12-synthetic-test') process.exit(1)"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.142.0

      - name: Prepare isolated migration
        run: |
          set -euo pipefail
          mkdir -p cloudflare-d1/t12-preview/.diag-a2/migrations
          echo 'PRAGMA foreign_keys = ON;' > cloudflare-d1/t12-preview/.diag-a2/migrations/9001_diag_pragma_only.sql
          cat > cloudflare-d1/t12-preview/.diag-a2/wrangler.toml <<EOF
          name = "trendos-t12-a2-synthetic"
          compatibility_date = "2026-09-27"
          [[d1_databases]]
          binding = "T12_SYNTHETIC_DB"
          database_name = "trendos-t12-synthetic-test"
          database_id = "54a3c05e-cde9-4979-814f-d40f941edcd5"
          migrations_dir = "migrations"
          EOF
          ! grep -q 'trendos-main' cloudflare-d1/t12-preview/.diag-a2/wrangler.toml
          ! grep -q '5c4b92bf-e043-4f6e-bd6d-d514a92cd825' cloudflare-d1/t12-preview/.diag-a2/wrangler.toml

      - name: A2 apply PRAGMA-only migration on TEST
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply trendos-t12-synthetic-test --remote \
            --config cloudflare-d1/t12-preview/.diag-a2/wrangler.toml
          echo 'DIAG_A2_MIGRATION_BOOKKEEPING=PASS'
