name: TrendOS 02CR Operational Catalog Probe TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cr-operational-catalog-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read operational mirror catalog only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const wanted = new Set(['الأوردرات','بنود الأوردرات','العملاء','عملاء منع التسليم بالمديونية']);
          (async()=>{
            const r = await fetch('https://trendos-d1-api.trendmall-contact.workers.dev/v1/mirror/sheets', {headers:{accept:'application/json'}});
            const raw = await r.text();
            if (!r.ok) throw new Error('mirror catalog HTTP '+r.status);
            const body = JSON.parse(raw || '{}');
            const rows = (body.sheets || body.rows || []).filter(x => wanted.has(String(x.sheetName || ''))).map(x => ({
              sheetName:String(x.sheetName||''), sourceLastRow:Number(x.sourceLastRow||0), sourceLastCol:Number(x.sourceLastCol||0),
              rowCount:Number(x.rowCount||0), status:String(x.status||''), syncedAt:String(x.syncedAt||''), note:String(x.note||'')
            })).sort((a,b)=>a.sheetName.localeCompare(b.sheetName,'ar'));
            console.log('PERF_CF_02CR_OPERATIONAL_CATALOG='+JSON.stringify(rows));
            console.log('PERF_CF_02CR_OPERATIONAL_CATALOG_COUNT='+rows.length);
            console.log('PERF_CF_02CR_CATALOG_PROBE_PASS_NO_ROW_VALUES');
          })().catch(e=>{ console.error(e && e.stack || e); process.exit(1); });
          NODE
