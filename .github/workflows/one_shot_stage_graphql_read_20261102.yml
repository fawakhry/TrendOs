name: ONE SHOT Stage Cloudflare GraphQL Nonidentity Auth Audit READONLY
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_stage_graphql_read_20261102.yml'
permissions:
  contents: read
jobs:
  get-graphql-auth-metadata:
    if: github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'ops/customer-stage-graphql-nonidentity-audit-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_SERVICE_TOKENS_READ_API_TOKEN }}
      CF_STAGE_ACCESS_CLIENT_ID: ${{ secrets.CF_STAGE_ACCESS_CLIENT_ID }}
      CF_STAGE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_STAGE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check secret and GraphQL read-only operator syntax
        run: |
          set -euo pipefail
          python3 -m py_compile tools/one_shot_stage_graphql_login_read_20261102.py
          echo 'ONLY_READONLY_GRAPHQL_AND_TOKEN_METADATA=PASS'
      - name: Read only Access authentication event aggregates
        run: python3 tools/one_shot_stage_graphql_login_read_20261102.py
