name: TrendOS 02CS Authoritative Order Probe TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-authoritative-order-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      PREVIEW_URL: https://cs-lineid-trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
    steps:
      - uses: actions/checkout@v4

      - name: Static read-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/trendos-02cs-authoritative-order-probe-temp.yml').read_text(encoding='utf-8').splitlines()
          bad=[x.strip() for x in lines if x.strip().startswith(('npx --yes wrangler@','wrangler ','git push','git commit','curl -X','curl --request'))]
          if bad: raise SystemExit('Mutation/tooling command forbidden: '+repr(bad))
          print('PERF_CF_02CS_ORDER_PROBE_STATIC_READONLY_PASS')
          PY

      - name: Verify Apps Script follows source row order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const edgeBase=process.env.PREVIEW_URL;
          const apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const employeeToken=String(process.env.QUALIFY_EMPLOYEE_TOKEN||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function key(r){return [r&&r.orderId||'',r&&r.lineId||'',r&&r.status||''].map(v=>String(v||'').trim()).join('|');}
          async function readJson(label,url,opt={},attempts=5){
            let last;
            for(let i=1;i<=attempts;i++){
              try{
                const r=await fetch(url,{cache:'no-store',...opt});
                const raw=await r.text();
                let body;
                try{body=JSON.parse(raw||'{}');}catch{throw new Error(label+' invalid JSON http='+r.status);}
                return {status:r.status,body};
              }catch(e){last=e;if(i<attempts)await sleep(2500*i);}
            }
            throw last;
          }
          async function session(){
            const x=await readJson('session',edgeBase+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});
            assert.equal(x.status,200);assert.equal(x.body.success,true);assert.ok(x.body.edgeToken);return x.body.edgeToken;
          }
          (async()=>{
            const bearer=await session();
            const result=[];
            for(const screen of ['print','laser']){
              const p=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
              const edge=await readJson('edge-'+screen,edgeBase+'/v1/edge/orders/02cr/page?'+p,{headers:{accept:'application/json',authorization:'Bearer '+bearer}});
              assert.equal(edge.status,200);assert.equal(edge.body.success,true);
              const payload={action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'};
              const app=await readJson('apps-'+screen,apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
              assert.equal(app.status,200);assert.equal(app.body.success,true);
              const eRows=edge.body.rows||[],aRows=app.body.rows||[];
              const eKeys=eRows.map(key),aKeys=aRows.map(key);
              assert.deepEqual([...eKeys].sort(),[...aKeys].sort(),screen+' identity set differs; cannot infer ordering');
              const rowByKey=new Map();
              for(const r of eRows){const k=key(r);assert.ok(!rowByKey.has(k),screen+' duplicate identity in D1 result');rowByKey.set(k,Number(r.rowNumber||0));}
              const appSourceRows=aKeys.map(k=>rowByKey.get(k));
              assert.ok(appSourceRows.every(n=>Number.isInteger(n)&&n>1),screen+' missing source row mapping');
              const appAscending=appSourceRows.every((n,i)=>i===0||n>appSourceRows[i-1]);
              const edgeSourceRows=eRows.map(r=>Number(r.rowNumber||0));
              const edgeAscending=edgeSourceRows.every((n,i)=>i===0||n>edgeSourceRows[i-1]);
              assert.equal(appAscending,true,screen+' Apps Script does not follow source row order');
              result.push({screen,totalRows:aRows.length,appsSourceOrder:true,currentD1SourceOrder:edgeAscending});
            }
            console.log('PERF_CF_02CS_AUTHORITATIVE_ORDER_CONFIRMED='+JSON.stringify(result));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Conclusion
        run: echo 'PERF_CF_02CS_AUTHORITATIVE_ORDER_PROBE_PASS_NO_MUTATION'
