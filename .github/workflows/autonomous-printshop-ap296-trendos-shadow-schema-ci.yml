name: AP-296 TrendOS One-Shot Shadow Read — Hosted Synthetic Qualification

on:
  push:
    branches:
      - feature/ap155-imac-ssh-service-absent-owner-install-20261012
    paths:
      - 'autonomous-printshop/print-server/src/trendos_shadow_qualifier.py'
      - 'autonomous-printshop/print-server/trendos_shadow_schema_demo.py'
      - 'autonomous-printshop/print-server/tests/test_ap296_trendos_shadow_schema_synthetic.py'
      - 'autonomous-printshop/print-server/tests/test_shadow_strict_success.py'
      - 'autonomous-printshop/print-server/tests/test_issue10_read_contract_source_guards.py'
      - 'autonomous-printshop/print-server/tests/test_issue8_native_auth_config_source.py'
      - 'employee-api-dispatcher-v1.js'
      - 'config.js'
      - '.github/workflows/autonomous-printshop-ap296-trendos-shadow-schema-ci.yml'
  pull_request:
    paths:
      - 'autonomous-printshop/print-server/src/trendos_shadow_qualifier.py'
      - 'autonomous-printshop/print-server/trendos_shadow_schema_demo.py'
      - 'autonomous-printshop/print-server/tests/test_ap296_trendos_shadow_schema_synthetic.py'
      - '.github/workflows/autonomous-printshop-ap296-trendos-shadow-schema-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-employee-screen-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: autonomous-printshop/print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fake-only schema, no secrets or platform traffic
        run: |
          python -B trendos_shadow_schema_demo.py
          python -B -m unittest discover -s tests -p 'test_ap296_trendos_shadow_schema_synthetic.py' -v
          # Issue #8 and #10 source/synthetic guards must ACTUALLY execute in CI.
          python -B -m unittest discover -s tests -p 'test_shadow_strict_success.py' -v
          python -B -m unittest discover -s tests -p 'test_issue10_read_contract_source_guards.py' -v
          python -B -m unittest discover -s tests -p 'test_issue8_native_auth_config_source.py' -v
          python -B -m unittest discover -s tests -p 'test_ap281_home_employee_demo_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap280_employee_assist_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap279_bridge_shadow_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap278_path_guard_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap277_write_guard_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap276_operational_flow_synthetic.py' -v
          echo 'AP296_FAKE_SHADOW_SCHEMA_CI=PASS'
          echo 'AP296_REAL_TRENDOS_LOGIN=NO'
          echo 'AP296_CUSTOMER_DATA_PLATFORM_WRITES_PRINTERS=OFF'
