name: TrendOS 02CV Fly Print Lane Stability Promote Temp

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cv-flyprint-lane-stability-promote-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_MAIN: b4a87493ca9ce7507fc342e9b39f91449395fb46
    steps:
      - name: Checkout working branch tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Save qualified patcher and tests
        shell: bash
        run: |
          set -euo pipefail
          cp tools/patch_02cv_flyprint_lane_stability.py /tmp/patch.py
          cp tests/frontend_flyprint_lane_stability_02cv.test.mjs /tmp/fly.test.mjs
          cp tests/frontend_order_status_write_consistency_02cv.test.mjs /tmp/write.test.mjs
          cp tests/frontend_order_status_ux_02cv.test.mjs /tmp/ux.test.mjs
          sed -i 's/trendos-02cv-statusux-20260906b/trendos-02cv-flylane-20260906c/g' /tmp/ux.test.mjs

      - name: Lock exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          echo "MAIN_BEFORE=$actual"
          test "$actual" = "$EXPECTED_MAIN"
          git checkout -B main "$EXPECTED_MAIN"

      - name: Apply exact bounded frontend patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch.py .
          mkdir -p tests
          cp /tmp/write.test.mjs tests/__02cv_write_temp.test.mjs
          cp /tmp/ux.test.mjs tests/__02cv_ux_temp.test.mjs
          TRENDOS_TEST_ROOT=. node /tmp/fly.test.mjs
          node tests/__02cv_write_temp.test.mjs
          TRENDOS_TEST_ROOT=. node tests/__02cv_ux_temp.test.mjs
          node --check app.js
          rm -f tests/__02cv_write_temp.test.mjs tests/__02cv_ux_temp.test.mjs

      - name: Assert exact production scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only)
          printf 'CHANGED_FILES=%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -qx 'app.js'
          printf '%s\n' "${files[@]}" | grep -qx 'index.html'
          git diff --check
          git diff -- app.js index.html

      - name: Commit and push exact production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendos-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Keep fly-print badge stable across read lanes'
          new_sha="$(git rev-parse HEAD)"
          echo "NEW_MAIN=$new_sha"
          git push origin HEAD:main
          echo "$new_sha" > /tmp/new-main.txt

      - name: Verify pushed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          new_sha="$(cat /tmp/new-main.txt)"
          test "$(git rev-parse origin/main)" = "$new_sha"
          echo "02CV_FLYPRINT_LANE_STABILITY_PRODUCTION_PUSH=PASS"
