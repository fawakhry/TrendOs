name: EasyStore Accounting Runtime Checkpoint Audit
# refresh 2026-10-07 A2.9 recalc decision gate
# A2.7 post deploy refresh
# refresh after successful A2.8 material canary closure 2026-10-07
# refresh 2026-10-06 A2.7 pre-canary decision

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-accounting-runtime-checkpoint-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}
      - name: Audit current runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json > /tmp/deployments.json
          curl --fail --silent --show-error "$API_URL/v1/employee/accounting/health?checkpoint=$GITHUB_RUN_ID" > /tmp/accounting.json
          curl --fail --silent --show-error --location "$EASYSTORE_URL/config.js?checkpoint=$GITHUB_RUN_ID" > /tmp/easystore-config.js
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events;
          " > /tmp/counts.json
          node <<'NODE'
          const fs=require('fs');
          const ds=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const list=(Array.isArray(ds)?ds:(ds.items||[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const latest=list[0]||{};
          const full=(latest.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1)throw new Error('active API version not single 100%');
          const h=JSON.parse(fs.readFileSync('/tmp/accounting.json','utf8'));
          const cfg=fs.readFileSync('/tmp/easystore-config.js','utf8');
          const cm=cfg.match(/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*(true|false)/);
          const wm=cfg.match(/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*['"]([^'"]+)['"]/);
          const ca=cfg.match(/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*(\[[^;]*\])/);
          const x=JSON.parse(fs.readFileSync('/tmp/counts.json','utf8')),rows=[];
          function walk(v){if(Array.isArray(v))for(const z of v)walk(z);else if(v&&typeof v==='object'){if(v.results&&Array.isArray(v.results))rows.push(...v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}}
          walk(x);if(rows.length!==1)throw new Error('count snapshot parse');
          const r=rows[0],total=Object.values(r).reduce((a,v)=>a+Number(v||0),0);
          console.log('ACCOUNTING_CHECKPOINT_API_VERSION='+full[0].id);
          console.log('ACCOUNTING_CHECKPOINT_MODE='+String(h.mode||''));
          console.log('ACCOUNTING_CHECKPOINT_POLICY_EPOCH='+Number(h.policyEpoch||0));
          console.log('ACCOUNTING_CHECKPOINT_SCHEMA_READY='+String(h.schemaReady));
          console.log('ACCOUNTING_CHECKPOINT_AUTHORITATIVE_WRITES='+String(h.authoritativeWrites));
          console.log('ACCOUNTING_CHECKPOINT_GOOGLE_BUSINESS_CALLS='+Number(h.googleBusinessCalls||0));
          console.log('ACCOUNTING_CHECKPOINT_WRITE_CANARY_READY='+String(h.writeCanaryReady));
          console.log('ACCOUNTING_CHECKPOINT_WRITE_CANARY_ENABLED='+String(h.writeCanaryEnabled));
          console.log('ACCOUNTING_CHECKPOINT_CANARY_USERS='+Number(h.writeCanaryAllowedUserCount||0));
          console.log('ACCOUNTING_CHECKPOINT_CANARY_ACTIONS='+Number(h.writeCanaryAllowedActionCount||0));
          console.log('ACCOUNTING_CHECKPOINT_LIVE_WRITE_FLAG='+(cm?cm[1]:'ABSENT_SAFE'));
          console.log('ACCOUNTING_CHECKPOINT_LIVE_WRITE_MODE='+(wm?wm[1]:'ABSENT_SAFE'));
          console.log('ACCOUNTING_CHECKPOINT_LIVE_CANARY_ACTIONS='+(ca?ca[1]:'ABSENT_SAFE'));
          for(const [k,v] of Object.entries(r)) console.log('ACCOUNTING_CHECKPOINT_COUNT_'+k+'='+Number(v||0));
          console.log('ACCOUNTING_CHECKPOINT_TOTAL_BUSINESS_ROWS='+total);
          const expected={materials:1,templates:1,deptLines:0,finalInvoices:0,partyLedger:0,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:0,requestLedger:2,events:2};
          const drift=Object.keys(expected).filter(k=>Number(r[k]||0)!==expected[k]).map(k=>({key:k,actual:Number(r[k]||0),expected:expected[k]}));
          if(drift.length)throw new Error('approved canary evidence baseline drift:'+JSON.stringify(drift));
          if(h.mode!=='READONLY')throw new Error('accounting mode drift');
          if(h.authoritativeWrites!==false)throw new Error('authoritative writes drift');
          if(Number(h.googleBusinessCalls||0)!==0)throw new Error('google call drift');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0)throw new Error('server canary allowlist drift');
          if(Number(h.writeCanaryMaxCommands||0)!==0||Number(h.writeCanaryCommandsStarted||0)!==0)throw new Error('server canary command budget drift');
          if(cm&&cm[1]!=='false')throw new Error('live write flag enabled');
          if(wm&&String(wm[1]).toUpperCase()!=='OFF')throw new Error('live write mode not OFF');
          if(ca&&ca[1].replace(/\s/g,'')!=='[]')throw new Error('live canary action list not empty');
          console.log('ACCOUNTING_CHECKPOINT_APPROVED_CANARY_EVIDENCE=PASS');
          console.log('ACCOUNTING_RUNTIME_CHECKPOINT=PASS');
          console.log('PRODUCTION_MUTATION=NO');
          NODE
