name: TrendOS Book28 Core Bulk Recovery — Atomic Fake D1
on:
  push:
    branches:
      - fix/book28-core-bulk-atomic-ledger-20261016
    paths:
      - 'cloudflare-d1/src/employee-core-native-v1.mjs'
      - 'tests/book28_bulk_500_result_truth_synthetic.test.mjs'
      - '.github/workflows/trendos-book28-core-bulk-recovery-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-d1/src/employee-core-native-v1.mjs'
      - 'tests/book28_bulk_500_result_truth_synthetic.test.mjs'
      - '.github/workflows/trendos-book28-core-bulk-recovery-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-bulk-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core and tests syntax
        run: |
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book28_bulk_500_result_truth_synthetic.test.mjs
      - name: Atomic transaction rollback and lost ACK replay — fake D1 only
        run: node --test tests/book28_bulk_500_result_truth_synthetic.test.mjs
      - name: Parent Core scope and manager Mirror auth
        run: |
          node --test tests/book28_core_line_write_scope_synthetic.test.mjs
          node --test tests/book25_26_p0_auth_synthetic.test.mjs
      - name: Core dispatcher / page read compatibility
        run: |
          node tests/entry644_employee_core_general_dispatch.test.mjs
          node tests/entry650_employee_core_order_page_read.test.mjs
      - name: SQLite json_each and bound event rows (isolated memory)
        run: |
          python3 - <<'PY'
          import json, sqlite3
          c=sqlite3.connect(':memory:')
          c.executescript('CREATE TABLE events(actor TEXT, line_id TEXT, payload TEXT);')
          lines=[{'lineId':f'fake-{i}','orderId':'FAKE-ORDER'} for i in range(500)]
          c.execute("""INSERT INTO events(actor,line_id,payload)
            SELECT ?,json_extract(value,'$.lineId'),
              json_object('orderId',json_extract(value,'$.orderId'),'screen',?)
            FROM json_each(?)""",('fake-worker','print',json.dumps(lines)))
          rows=c.execute('SELECT COUNT(*),COUNT(DISTINCT line_id) FROM events').fetchone()
          assert rows==(500,500), rows
          print('SQLITE_JSON_EVENT_ROWS=500/500')
          PY
      - name: No release operations
        run: |
          echo 'REAL_D1=NO'
          echo 'REAL_GOOGLE=NO'
          echo 'REAL_CUSTOMER_ORDERS=NO'
          echo 'MERGE=NO'
          echo 'DEPLOY=NO'
          echo 'PRODUCTION_VERIFIED=NO'
