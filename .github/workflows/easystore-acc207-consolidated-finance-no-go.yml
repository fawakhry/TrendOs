name: ACC207 One-Batch Finance Offline Acceptance Matrix (NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-native-accounting-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run eight actual checked-in accounting and owner-approval source gates
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          OPENAI_API_KEY: ''
          WHATSAPP_TOKEN: ''
          FINANCE_RELEASE: 'NO_GO'
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$OPENAI_API_KEY"
          test -z "$WHATSAPP_TOKEN"
          test "$FINANCE_RELEASE" = 'NO_GO'
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --test tests/easystore_acc175_approved_finance_grants.test.mjs
          node --test tests/easystore_acc176_finance_release_readiness.test.mjs
          node --test tests/easystore_acc170_finance_flow_sqlite.test.mjs
          node --test tests/easystore_acc187_sale_refund_gap_purchase_reversal_sqlite.test.mjs
          node --test tests/easystore_acc_customer_advance_credit_sqlite.test.mjs
          node --test tests/easystore_acc205_credit_liability_readonly_sqlite_no_go.test.mjs
          node --test tests/easystore_acc206_native_invoice_return_exposure_sqlite_no_go.test.mjs
          node --test tests/easystore_acc207_finance_release_batch_no_go.test.mjs
          node scripts/acc207_finance_release_batch.mjs --out /tmp/acc207-local-no-go.json
          node -e "const x=require('/tmp/acc207-local-no-go.json');if(x.financeRelease!=='NO_GO'||x.productionDeployApproved!==false||Object.values(x.gates).some(v=>v!=='OPEN'))process.exit(1)"
          echo 'ACC207_NATIVE_ACCOUNTING_ALL_OFFLINE_SUITES=PASS'
          echo 'ACC207_ALL_OWNER_DECISIONS=BATCHED_NOT_ATTESTED'
          echo 'ACC207_PRODUCTION_DEPLOYMENT=NO'
          echo 'ACC207_FINANCE_RELEASE=NO_GO'
