name: TrendOS 02CS Fly Print Ordering Patch

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - .github/workflows/trendos-02cs-flyprint-ordering-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/go-live-2026-09-01-integrity
          fetch-depth: 0

      - name: Patch 02CR operational ordering only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cloudflare-d1/src/edge-orders-read-02cr-canary.mjs')
          s = p.read_text(encoding='utf-8')
          old = """function priorityRank(priority) {
            const p = text(priority) || 'عادي';
            if (p === 'عاجل' || p === 'VIP') return 0;
            if (p === 'عادي') return 1;
            if (p === 'مؤجل') return 2;
            return 9;
          }
          function sortLikeAppsRows(rows) {
            return (rows || []).slice().sort((a, b) => {
              const rank = priorityRank(a && a.priority) - priorityRank(b && b.priority);
              if (rank) return rank;
              return String(a && a.orderId || '').localeCompare(String(b && b.orderId || ''));
            });
          }
          """
          new = """function isFlyPrint(value) {
            const v = text(value).toLowerCase();
            return v === 'نعم' || v === 'true' || v === '1' || v === 'on' ||
              v === 'طباعة على الطاير' || v === 'طباعة ع الطاير' ||
              v === 'على الطاير' || v === 'ع الطاير';
          }
          function priorityRank(priority) {
            const p = text(priority) || 'عادي';
            if (p === 'عاجل' || p === 'VIP') return 0;
            if (p === 'عادي') return 1;
            if (p === 'مؤجل') return 2;
            return 9;
          }
          export function sortOperationalRows(rows, screen) {
            const lane = text(screen);
            return (rows || [])
              .map((row, index) => ({ row, index }))
              .sort((a, b) => {
                // Business rule: Fly Print is the highest operational tier ONLY
                // on the print screen. Laser/service must ignore the fly flag.
                if (lane === 'print') {
                  const aFly = isFlyPrint(a.row && (a.row.flyPrint || a.row.quickPrint));
                  const bFly = isFlyPrint(b.row && (b.row.flyPrint || b.row.quickPrint));
                  if (aFly !== bFly) return aFly ? -1 : 1;
                }
                const rank = priorityRank(a.row && a.row.priority) - priorityRank(b.row && b.row.priority);
                if (rank) return rank;
                // Preserve the deterministic order already produced by the rich
                // mapper inside the same operational tier.
                return a.index - b.index;
              })
              .map((item) => item.row);
          }
          """
          if old not in s:
              raise SystemExit('02CS patch guard failed: expected sort block not found')
          s = s.replace(old, new, 1)
          old_call = "const enriched = sortLikeAppsRows(enrichFromMirrors02CR(mapped, customers, restrictions, new Date()));"
          new_call = "const enriched = sortOperationalRows(enrichFromMirrors02CR(mapped, customers, restrictions, new Date()), screen);"
          if old_call not in s:
              raise SystemExit('02CS patch guard failed: expected sort call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s, encoding='utf-8')

          test = Path('tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs')
          test.write_text("""import assert from 'node:assert/strict';
          import { sortOperationalRows } from '../cloudflare-d1/src/edge-orders-read-02cr-canary.mjs';

          const printRows = [
            { orderId:'P-NORMAL', department:'طباعة', priority:'عادي', flyPrint:'لا' },
            { orderId:'P-URGENT', department:'طباعة', priority:'عاجل', flyPrint:'لا' },
            { orderId:'P-FLY', department:'طباعة', priority:'عادي', flyPrint:'نعم' },
            { orderId:'P-DEFERRED', department:'طباعة', priority:'مؤجل', flyPrint:'لا' }
          ];
          assert.deepEqual(
            sortOperationalRows(printRows, 'print').map((row) => row.orderId),
            ['P-FLY','P-URGENT','P-NORMAL','P-DEFERRED'],
            'print must be Fly Print -> urgent/VIP -> normal -> deferred'
          );

          const printVariantRows = [
            { orderId:'P-U', department:'طباعة', priority:'عاجل', quickPrint:'لا' },
            { orderId:'P-F', department:'طباعة', priority:'عادي', quickPrint:'على الطاير' }
          ];
          assert.deepEqual(
            sortOperationalRows(printVariantRows, 'print').map((row) => row.orderId),
            ['P-F','P-U'],
            'Arabic Fly Print variants must outrank urgent on print'
          );

          const laserRows = [
            { orderId:'L-NORMAL-FLY-FLAG', department:'ليزر', priority:'عادي', flyPrint:'نعم' },
            { orderId:'L-URGENT', department:'ليزر', priority:'عاجل', flyPrint:'لا' },
            { orderId:'L-NORMAL', department:'ليزر', priority:'عادي', flyPrint:'لا' },
            { orderId:'L-DEFERRED', department:'ليزر', priority:'مؤجل', flyPrint:'لا' }
          ];
          assert.deepEqual(
            sortOperationalRows(laserRows, 'laser').map((row) => row.orderId),
            ['L-URGENT','L-NORMAL-FLY-FLAG','L-NORMAL','L-DEFERRED'],
            'laser must ignore Fly Print and use urgent/VIP -> normal -> deferred'
          );

          const serviceRows = [
            { orderId:'S-NORMAL-FLY-FLAG', department:'طباعة', priority:'عادي', flyPrint:'نعم' },
            { orderId:'S-URGENT', department:'ليزر', priority:'عاجل', flyPrint:'لا' }
          ];
          assert.deepEqual(
            sortOperationalRows(serviceRows, 'service').map((row) => row.orderId),
            ['S-URGENT','S-NORMAL-FLY-FLAG'],
            'Fly Print must not become a global priority outside the print screen'
          );

          console.log('PERF_CF_02CS_OPERATIONAL_ORDERING_PASS');
          """, encoding='utf-8')
          PY

      - name: Focused 02CS regression tests
        shell: bash
        run: |
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_duplicate_headers_02cr.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/trendos_integrity_v1.test.js

      - name: Commit bounded candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-d1/src/edge-orders-read-02cr-canary.mjs tests/cloudflare_edge_orders_operational_ordering_02cs.test.mjs
          git diff --cached --check
          git commit -m "fix: enforce fly-first print ordering in 02CS"
          git push origin HEAD:agent/go-live-2026-09-01-integrity
