name: T12 D1 Counter Stuck Fix - OWNER Backend Only Live 20261102
on:
  push:
    branches: [candidate/t12-full-cloud-cutover-a56-20260929]
    paths: ['.github/workflows/t12-archive-auto-all-backend-only-live-20261102.yml']
permissions: {contents: read}
concurrency:
  group: trendos-d1-api-production-t12-archive-auto-all
  cancel-in-progress: false
jobs:
  backend-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_BRANCH_PARENT: 430e40c6929c1643ef6371f654e46aa108c51084
      PRE_BACKEND_VERSION: 18daa9c8-b5aa-4a5a-b435-96b561f21714
      LIVE_UI_VERSION: d577fae3-2e5f-4be5-8f01-a39617de6ccf
      LIVE_UI_APP_SHA: 6de62ca721e4237a13dde05d549b7ae11b906f6da836b0dd307a89b66145cde4
      BACKEND_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      UI_URL: https://trendos-ui.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact source and all 28 native D1 count auth/SQLite tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BRANCH_PARENT"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fxq 'name = "trendos-d1-api"' cloudflare-d1/wrangler.toml
          grep -Fxq 'main = "production-shadow/index.js"' cloudflare-d1/wrangler.toml
          grep -Fq 'database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"' cloudflare-d1/wrangler.toml
          grep -Fxq 'TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1 = "true"' cloudflare-d1/wrangler.toml
          grep -Fxq 'TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          ! grep -q '^TRENDOS_T12_NATIVE_CLOSE_ARCHIVE_V1_ENABLED' cloudflare-d1/wrangler.toml
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check app.js
          node --check employee-api-dispatcher-v1.js
          node --test --no-warnings tests/t12_native_close_archive_v1.test.mjs
          echo T12_28_D1_COUNT_TESTS=PASS
          npm install --no-save wrangler@4.33.2 >/dev/null 2>&1
      - name: Require exact already-published UI auto-loop and PIN current UI/backend leases
        shell: bash
        run: |
          set -euo pipefail
          for spec in "trendos-d1-api:$PRE_BACKEND_VERSION" "trendos-ui:$LIVE_UI_VERSION"; do
            name="${spec%%:*}";expected="${spec#*:}"
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/deployments" >/tmp/lease.json
            EXPECTED="$expected" node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/lease.json','utf8'));
          if(!x.success)throw Error('CF API failed');
          const a=Array.isArray(x.result)?x.result:x.result?.deployments||[],v=a[0]?.versions||[];
          if(v.length!==1||v[0].version_id!==process.env.EXPECTED||Number(v[0].percentage)!==100)throw Error('Concurrent UI/backend deployment: fail closed');
          console.log('PRODUCTION_LEASE='+v[0].version_id);
          NODE
          done
          curl -fLsS "$UI_URL/app.js?archive-auto-pre=$GITHUB_SHA-$(date +%s%N)" >/tmp/app-live.js
          echo "$LIVE_UI_APP_SHA  /tmp/app-live.js" | sha256sum --check
          cmp /tmp/app-live.js app.js
          node -e 'const s=require("fs").readFileSync("/tmp/app-live.js","utf8");if(!s.includes("T12_NATIVE_COMPLETE_ORDERS_AUTO_BATCH_V2")||!s.includes("getArchiveEligibilityV1")||!s.includes("تعذر قراءة عداد D1"))process.exit(1)'
          echo UI_ALREADY_UPDATED_NO_DEPLOY_REQUIRED=PASS
          curl -fsS "$BACKEND_URL/v1/employee/core/health" >/tmp/core-before.json
          curl -fsS "$BACKEND_URL/v1/employee/auth/health" >/tmp/auth-before.json
          node <<'NODE'
          const c=require('/tmp/core-before.json'),a=require('/tmp/auth-before.json');
          if(!c.schemaReady||c.mode!=='GENERAL'||a.mode!=='NATIVE'||!a.nativeOnly)throw Error('Backend auth/core drift');
          if(c.archiveEligibilityVersion!=='T12_NATIVE_ARCHIVE_ELIGIBILITY_V3')throw Error('Unexpected previous archive counter version');
          console.log('BACKEND_ORIGINAL_HEALTH=PASS');
          NODE
          npx wrangler d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --json --command "SELECT mode,(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'trg_t12_native_archive_v1_%') AS n FROM t12_native_archive_guard_control_v1 WHERE singleton=1" >/tmp/guard.json
          node <<'NODE'
          const x=require('/tmp/guard.json'),r=(Array.isArray(x)?x:[x]).flatMap(a=>a.results||[])[0]||{};
          if(r.mode!=='GUARDED'||Number(r.n)!==12)throw Error('Guard drift');
          console.log('D1_GUARDED_12_TRIGGERS=PASS');
          NODE
      - name: Inject only existing approved feature flag, Wrangler dry-run and recheck backend lease
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1 = "true"/a TRENDOS_T12_NATIVE_CLOSE_ARCHIVE_V1_ENABLED = "true"' cloudflare-d1/wrangler.toml
          grep -Fxq 'TRENDOS_T12_NATIVE_CLOSE_ARCHIVE_V1_ENABLED = "true"' cloudflare-d1/wrangler.toml
          test "$(grep -c '^TRENDOS_T12_NATIVE_CLOSE_ARCHIVE_V1_ENABLED' cloudflare-d1/wrangler.toml)" = 1
          npx wrangler deploy --dry-run --config cloudflare-d1/wrangler.toml --outdir /tmp/t12-only-backend-dry >/tmp/compile.txt
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/trendos-d1-api/deployments" >/tmp/lease-last.json
          node <<'NODE'
          let x=require('/tmp/lease-last.json'),a=Array.isArray(x.result)?x.result:x.result?.deployments||[],v=a[0]?.versions||[];
          if(v.length!==1||v[0].version_id!==process.env.PRE_BACKEND_VERSION||Number(v[0].percentage)!==100)throw Error('Backend changed before deploy; stop');
          NODE
          echo BACKEND_EXACT_DRY_RUN_AND_LEASE=PASS
      - name: Deploy original backend only, verify health and 100 percent version; rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = 1 ]; then
              echo BACKEND_ROLLBACK_ATTEMPTED=YES
              npx wrangler rollback "$PRE_BACKEND_VERSION" --config cloudflare-d1/wrangler.toml --message 'T12 auto-archive backend release failed' || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          DEPLOYED=1
          npx wrangler deploy --config cloudflare-d1/wrangler.toml >/tmp/t12-backend-deploy.log
          for i in $(seq 1 8); do
            curl -fsS "$BACKEND_URL/v1/employee/core/health" >/tmp/post-core.json || true
            if node -e 'const x=require("/tmp/post-core.json");process.exit(x.mode==="GENERAL"&&x.schemaReady===true&&x.actions?.includes("getArchiveEligibilityV1")&&x.archiveEligibilityVersion==="T12_NATIVE_ARCHIVE_ELIGIBILITY_V4"?0:1)'; then break;fi
            sleep 2
          done
          node -e 'let x=require("/tmp/post-core.json");if(x.mode!=="GENERAL"||!x.schemaReady||!x.actions?.includes("getArchiveEligibilityV1")||x.archiveEligibilityVersion!=="T12_NATIVE_ARCHIVE_ELIGIBILITY_V4")process.exit(1)'
          curl -fsS "$BACKEND_URL/v1/employee/core/health?archiveProbe=1" >/tmp/post-count-probe.json
          node -e 'const x=require("/tmp/post-count-probe.json");if(x.archiveEligibilityVersion!=="T12_NATIVE_ARCHIVE_ELIGIBILITY_V4"||x.archiveProbe?.available!==true||x.archiveProbe?.eligibleOrders!==undefined)process.exit(1)'
          echo LIVE_ORIGINAL_D1_COUNT_QUERIES=PASS
          curl -fsS "$BACKEND_URL/v1/employee/auth/health" >/tmp/post-auth.json
          node -e 'let x=require("/tmp/post-auth.json");if(x.mode!=="NATIVE"||!x.nativeOnly)process.exit(1)'
          status="$(curl -sS --output /tmp/anonymous.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"archiveDeliveredDepartmentV1926","username":"anonymous","screen":"service","requestId":"ARCHIVE-NOAUTH-POSTCHECK"}' "$BACKEND_URL/v1/employee/core")"
          test "$status" = 401
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/trendos-d1-api/deployments" >/tmp/post-deploy.json
          node <<'NODE'
          let x=require('/tmp/post-deploy.json'),a=Array.isArray(x.result)?x.result:x.result?.deployments||[],v=a[0]?.versions||[];
          if(v.length!==1||v[0].version_id===process.env.PRE_BACKEND_VERSION||Number(v[0].percentage)!==100)throw Error('New backend not live');
          console.log('T12_BACKEND_NEW_ACTIVE_VERSION='+v[0].version_id);
          NODE
          # Do not touch UI; verify the current already-published loop is unchanged.
          curl -fLsS "$UI_URL/app.js?archive-auto-post=$GITHUB_SHA-$(date +%s%N)" >/tmp/app-post.js
          echo "$LIVE_UI_APP_SHA  /tmp/app-post.js" | sha256sum --check
          trap - ERR
          echo T12_D1_COUNTER_BACKEND_V4_LIVE=YES
          echo UI_PRODUCTION_MUTATIONS=NO
          echo LEGACY_GOOGLE_ARCHIVE_MUTATIONS=NO
          echo BACKEND_ROLLBACK_USED=NO
