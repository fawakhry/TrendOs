name: "OWNER GO — Cloudflare Access DENY ALL exact isolated Stage Worker"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/zg-owner-go-private-access-deny-all-bootstrap-20261101.yml"
permissions:
  contents: read
concurrency:
  group: zg-owner-go-worker-access-deny-all-one-time-20261101
  cancel-in-progress: false
jobs:
  protect-isolated-stage-worker-deny-all:
    if: ${{ github.repository == 'fawakhry/TrendOs' && github.event.pull_request.number == 316 && github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'chore/zero-google-direct-cloudflare-stage-upload-v1-20261101' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Create Access deny-all app ONLY if exact Stage worker and database are nonpublic, owner-approved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare-d1/wrangler.customer-stage.toml)" = "4e0c7f8275ff9cd89740f97b9f00c6d4d6cc75dd"
          python3 tools/zero_google_direct_stage_upload_guard_v1.py >/dev/null
          python3 - <<'PY'
          import os,re,json,urllib.request,urllib.error,urllib.parse,hashlib
          acct=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not re.fullmatch('[0-9a-fA-F]{32}',acct) or len(token)<20:
              raise SystemExit('CLOUDFLARE_AUTH_MISSING_STOP')
          w='trendos-customer-portal-isolated-stage-v0'
          name='TrendOS ZG Customer Isolated Stage DENY ALL 20261101'
          base='https://api.cloudflare.com/client/v4/accounts/'+acct
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(path,data=None):
              request=urllib.request.Request(base+path,headers=headers,method='POST' if data is not None else 'GET',
                                             data=None if data is None else json.dumps(data,separators=(',',':')).encode())
              try:
                  with urllib.request.urlopen(request,timeout=30) as h: res=json.load(h)
              except urllib.error.HTTPError as e:
                  print('CLOUDFLARE_ACTION_HTTP_CODE='+str(e.code))
                  raise SystemExit('CLOUDFLARE_API_PERMISSION_OR_BAD_REQUEST_NO_FALLBACK')
              if not isinstance(res,dict) or res.get('success') is not True:
                  print('CLOUDFLARE_ACTION_API_CODE='+','.join(str(x.get('code','?')) for x in res.get('errors',[])))
                  raise SystemExit('CLOUDFLARE_API_REFUSED_NO_FALLBACK')
              return res
          worker=api('/workers/workers/'+w)['result']
          if worker.get('name')!=w or not re.fullmatch('[0-9a-fA-F-]{32,36}',worker.get('id','')):
              raise SystemExit('WORKER_ID_NOT_EXACT_STOP')
          worker_id=worker['id']
          sub=api('/workers/scripts/'+w+'/subdomain')['result']
          if sub.get('enabled') is not False or sub.get('previews_enabled') is not False:
              raise SystemExit('STAGE_ALREADY_PUBLIC_STOP')
          settings=api('/workers/scripts/'+w+'/settings')['result']
          b=settings.get('bindings') or []
          if len([x for x in b if x.get('type')=='d1' and x.get('name')=='DB'])!=1 or any(x.get('type') in ['r2_bucket','kv_namespace','service'] for x in b):
              raise SystemExit('STAGE_BINDINGS_NOT_ISOLATED_STOP')
          db_list=api('/d1/database?page=1&per_page=100')['result']
          expected='trendos-zg-customer-stage-synthetic-20261101-v0'
          if not any(x.get('name')==expected and x.get('uuid')==next(x for x in b if x.get('type')=='d1')['id'] for x in db_list):
              raise SystemExit('STAGE_D1_ID_NOT_OWN_EXACT_STOP')
          apps=[]
          for page in range(1,21):
              response=api('/access/apps?'+urllib.parse.urlencode({'page':page,'per_page':100}))
              if not isinstance(response.get('result'),list):raise SystemExit('ACCESS_APPS_RESPONSE_INVALID')
              apps.extend(response['result'])
              pages=int((response.get('result_info') or {}).get('total_pages') or 1)
              if page>=pages:break
          else:raise SystemExit('ACCESS_APPS_INVENTORY_TOO_LARGE')
          if any(x.get('name')==name or any(y.get('worker_id')==worker_id for y in (x.get('destinations') or [])) for x in apps):
              raise SystemExit('ACCESS_APP_ALREADY_EXISTS_STOP_NO_MUTATION')
          print('STAGE_WORKER_AND_PRIVATE_D1_OWNER_EXACT=VERIFIED')
          print('EXISTING_ACCESS_APP_FOR_EXACT_WORKER=NONE')
          data={'type':'self_hosted','name':name,
                'destinations':[{'type':'worker','worker_id':worker_id}],
                'policies':[{'name':'DENY ALL TrendOS Isolated Stage','decision':'deny','include':[{'everyone':{}}]}],
                'session_duration':'1h'}
          posted=api('/access/apps',data)['result']
          appid=posted.get('id','')
          if not re.fullmatch('[0-9a-fA-F-]{32,36}',appid):raise SystemExit('ACCESS_APP_CREATED_ID_UNKNOWN')
          actual=api('/access/apps/'+appid)['result']
          dest=actual.get('destinations') or []
          pol=actual.get('policies') or []
          if (actual.get('id')!=appid or actual.get('name')!=name or
              len(dest)!=1 or dest[0].get('type')!='worker' or dest[0].get('worker_id')!=worker_id or
              len(pol)!=1 or pol[0].get('decision')!='deny' or
              not any(k.get('everyone')=={} for k in (pol[0].get('include') or []))):
              raise SystemExit('ACCESS_DENY_ALL_REMOTE_ATTESTATION_FAILED_NO_PUBLICATION')
          postsub=api('/workers/scripts/'+w+'/subdomain')['result']
          if postsub.get('enabled') is not False or postsub.get('previews_enabled') is not False:
              raise SystemExit('PUBLIC_STATUS_CHANGED_STOP')
          print('WORKER_SCOPED_ACCESS_DENY_ALL_CREATED_AND_READBACK=YES')
          print('DENY_ALL_POLICY_EVERYONE_VERIFIED=YES')
          print('WORKERS_DEV_AND_PREVIEWS_STILL_DISABLED=YES')
          print('ACCESS_APP_ID_SHA256_PREFIX='+hashlib.sha256(appid.encode()).hexdigest()[:12])
          print('ALL_CUSTOMER_FEATURES_STILL_OFF=YES')
          print('PUBLIC_INGRESS_ENABLED=NO')
          print('CLOUDFLARE_UBUNTU_ACCESS_CASE_02394197=UNCHANGED')
          PY
