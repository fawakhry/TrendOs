name: TrendOS Accounting Binding Probe Preview Runtime

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/accounting-native-module.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'cloudflare-d1/wrangler.preview.toml'
      - '.github/workflows/trendos-accounting-binding-probe-preview-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-binding-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
    steps:
      - name: Checkout expected Accounting source
        uses: actions/checkout@v4

      - name: Derive expected native Accounting version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('cloudflare-d1/src/accounting-native-module.mjs','utf8');
          const m = src.match(/TRENDOS_ACCOUNTING_NATIVE_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
          if (!m) process.exit(1);
          process.stdout.write(m[1]);
          NODE
          )"
          test -n "$version"
          echo "EXPECTED_ACCOUNTING_NATIVE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for matching isolated Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          matched='false'
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/accounting-integration.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/integration" || true)"
            if [ "$code" = '200' ]; then
              if EXPECTED_ACCOUNTING_NATIVE_VERSION="$EXPECTED_ACCOUNTING_NATIVE_VERSION" node <<'NODE'
          const fs = require('fs');
          let x = {};
          try { x = JSON.parse(fs.readFileSync('/tmp/accounting-integration.json','utf8')); } catch (_) { process.exit(1); }
          if (!x.success || x.version !== process.env.EXPECTED_ACCOUNTING_NATIVE_VERSION) process.exit(1);
          if (x.authoritativeWrites !== false || x.cutover !== false) process.exit(1);
          NODE
              then
                matched='true'
                echo "ACCOUNTING_PREVIEW_DEPLOYMENT_SYNC=PASS attempt=$attempt"
                break
              fi
            fi
            sleep 4
          done
          test "$matched" = 'true'

      - name: Verify isolated Accounting Preview D1 binding is injected with zero SQL
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-binding-probe.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/persistence-binding-probe")"
          cat /tmp/accounting-binding-probe.json
          test "$code" = '200'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-binding-probe.json','utf8'));
          if (!x.success) process.exit(1);
          if (x.dbInjected !== true) process.exit(1);
          if (x.mutationPerformed !== false) process.exit(1);
          if (x.sqlExecuted !== false) process.exit(1);
          if (x.schemaApplied !== false) process.exit(1);
          if (x.productionWriteEnabled !== false) process.exit(1);
          console.log('ACCOUNTING_PREVIEW_BINDING_PROBE=PASS');
          NODE

      - name: Verify binding probe rejects POST before any mutation path
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-binding-probe-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/persistence-binding-probe")"
          cat /tmp/accounting-binding-probe-post.json
          test "$code" = '405'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-binding-probe-post.json','utf8'));
          if (x.success !== false) process.exit(1);
          if (x.mutationPerformed !== false) process.exit(1);
          if (x.sqlExecuted !== false) process.exit(1);
          if (x.schemaApplied !== false) process.exit(1);
          if (x.productionWriteEnabled !== false) process.exit(1);
          console.log('ACCOUNTING_PREVIEW_BINDING_POST_BLOCK=PASS');
          NODE

      - name: Binding proof summary
        run: |
          echo 'ACCT-CF-02R runtime binding proof passed.'
          echo 'No SQL, migration, D1 mutation, Production write enablement, or authority cutover was performed.'
