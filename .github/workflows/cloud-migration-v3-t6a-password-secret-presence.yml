name: TrendOS Cloud Migration V3 T6A Password Secret Presence

on:
  push:
    branches:
      - cloud-migration-v3-t6a-prod-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t6a-password-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      C1: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      C2: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_PASSWORD }}
      C3: ${{ secrets.TRENDOS_QUALIFY_PASSWORD }}
      C4: ${{ secrets.TRENDOS_PROD_EMPLOYEE_PASSWORD }}
      C5: ${{ secrets.TRENDOS_TEST_PASSWORD }}
      C6: ${{ secrets.TRENDOS_PROD_TEST_PASSWORD }}
    steps:
      - name: Report secret-name presence only
        shell: bash
        run: |
          set -euo pipefail
          found=''
          [ -n "${C1:-}" ] && found='TRENDOS_PROD_QUALIFY_PASSWORD'
          [ -z "$found" ] && [ -n "${C2:-}" ] && found='TRENDOS_PROD_QUALIFY_EMPLOYEE_PASSWORD'
          [ -z "$found" ] && [ -n "${C3:-}" ] && found='TRENDOS_QUALIFY_PASSWORD'
          [ -z "$found" ] && [ -n "${C4:-}" ] && found='TRENDOS_PROD_EMPLOYEE_PASSWORD'
          [ -z "$found" ] && [ -n "${C5:-}" ] && found='TRENDOS_TEST_PASSWORD'
          [ -z "$found" ] && [ -n "${C6:-}" ] && found='TRENDOS_PROD_TEST_PASSWORD'
          if [ -n "$found" ]; then
            echo "QUALIFY_PASSWORD_SECRET_PRESENT=YES"
            echo "QUALIFY_PASSWORD_SECRET_NAME=$found"
          else
            echo "QUALIFY_PASSWORD_SECRET_PRESENT=NO"
          fi
          echo 'SECRET_VALUE_EXPOSED=NO'
          echo 'PRODUCTION_MUTATION=NO'
