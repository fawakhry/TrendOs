name: TrendOS 02CS Authoritative Order Qualify TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-authoritative-order-qualify-temp.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded fixes and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'function semanticLineId(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Fq 'function semanticUpdatedSortMs(rawValue, displayValue)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Fq 'updatedSortMsByRow.get(b.rowNumber)' cloudflare-d1/src/edge-orders-read-v1.mjs
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false' config.js
          ! grep -F 'semanticUpdatedSortMs' cloudflare-d1/src/edge-orders-read-v1.mjs | grep -E 'EDGE_SESSION_SECRET|genericDrain' >/dev/null
      - name: Edge Orders regression and 02CR contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          echo 'PERF_CF_02CS_AUTHORITATIVE_ORDER_QUALIFY_PASS'
