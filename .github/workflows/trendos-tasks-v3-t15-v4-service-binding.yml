name: TrendOS Tasks V3 T1.5 v4 Service Binding

on:
  push:
    branches:
      - tasks-v3-t15-d1-read-replica-preview-20260915
    paths:
      - 'cloudflare-d1/dashboard/tasks-v3-t15-preview-worker-v4-service-binding.single.mjs'
      - 'cloudflare-d1/test/tasks-v3-t15-v4-service-binding.mjs'
      - '.github/workflows/trendos-tasks-v3-t15-v4-service-binding.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v4 service-binding contract
        run: node cloudflare-d1/test/tasks-v3-t15-v4-service-binding.mjs
