name: TrendOS Accounting D1 Discovery Readonly

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-accounting-d1-discovery-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-d1-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.33.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: List D1 databases read only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          if (!Array.isArray(rows)) process.exit(1);
          const safe = rows.map(x => ({ name: x.name || x.database_name || '', uuid: x.uuid || x.id || x.database_id || '' }));
          console.log('D1_DATABASES=' + JSON.stringify(safe));
          const candidates = safe.filter(x => /account|preview|test|sandbox/i.test(x.name));
          console.log('ACCOUNTING_ISOLATED_CANDIDATES=' + JSON.stringify(candidates));
          console.log('D1_DISCOVERY_READONLY=PASS count=' + safe.length + ' candidates=' + candidates.length);
          NODE

      - name: Assert workflow contains no D1 mutation command
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/trendos-accounting-d1-discovery-readonly.yml'
          if grep -Eq 'wrangler@?.*d1 (create|delete|execute|migrations)' "$file"; then
            echo 'Mutation-capable D1 command detected in discovery workflow.' >&2
            exit 1
          fi
          echo 'DISCOVERY_WORKFLOW_MUTATION_FREE=PASS'
