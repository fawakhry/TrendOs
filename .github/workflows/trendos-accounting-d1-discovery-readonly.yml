name: TrendOS Accounting D1 Discovery Readonly

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-accounting-d1-discovery-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-d1-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.33.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: List D1 databases read only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          if (!Array.isArray(rows)) process.exit(1);
          const safe = rows.map(x => ({ name: x.name || x.database_name || '', uuid: x.uuid || x.id || x.database_id || '' }));
          const candidates = safe.filter(x => /account|preview|test|sandbox/i.test(x.name));
          const evidence = {
            generatedAt: new Date().toISOString(),
            command: 'wrangler d1 list --json',
            readOnly: true,
            databases: safe,
            isolatedCandidates: candidates,
            count: safe.length,
            candidateCount: candidates.length
          };
          fs.writeFileSync('/tmp/accounting-d1-discovery-sanitized.json', JSON.stringify(evidence, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Accounting D1 read-only discovery\n\n- Database count: **${safe.length}**\n- Isolated-name candidates: **${candidates.length}**\n- Mutation performed: **false**\n\n\`\`\`json\n${JSON.stringify(candidates, null, 2)}\n\`\`\`\n`);
          console.log('D1_DISCOVERY_READONLY=PASS count=' + safe.length + ' candidates=' + candidates.length);
          NODE

      - name: Upload sanitized D1 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: accounting-d1-discovery-sanitized
          path: /tmp/accounting-d1-discovery-sanitized.json
          if-no-files-found: error
          retention-days: 7

      - name: Assert workflow contains no D1 mutation command
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/trendos-accounting-d1-discovery-readonly.yml'
          if grep -Eq 'wrangler@?.*d1 (create|delete|execute|migrations)' "$file"; then
            echo 'Mutation-capable D1 command detected in discovery workflow.' >&2
            exit 1
          fi
          echo 'DISCOVERY_WORKFLOW_MUTATION_FREE=PASS'
