name: Autonomous Printshop Native Schedule Recovery Controlled

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-native-schedule-recovery-controlled.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-printshop-native-schedule-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: autonomous-printshop/production-shadow/wrangler.toml
      DB_NAME: trendos-main
      WRANGLER_VERSION: 4.33.2
      BACKFILL_SQL: autonomous-printshop/migrations/0021_t12_order_schedule_v1.sql
      MAINTENANCE_SQL: autonomous-printshop/migrations/0022_t12_order_schedule_maintenance_v1.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify schedule contracts
        run: |
          set -euo pipefail
          node autonomous-printshop/tests/t12_order_schedule_v1.test.mjs
          node autonomous-printshop/tests/t12_order_schedule_maintenance_v1.test.mjs

      - name: Hard safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'INSERT OR IGNORE INTO t12_prod_order_schedule' "$BACKFILL_SQL"
          grep -q 'CREATE TRIGGER IF NOT EXISTS trg_t12_order_schedule_after_order_insert' "$MAINTENANCE_SQL"
          grep -q 'CREATE TRIGGER IF NOT EXISTS trg_t12_order_schedule_after_line_insert' "$MAINTENANCE_SQL"
          ! grep -Eiq '\b(DROP|ALTER|DELETE|VACUUM|REPLACE)\b' "$BACKFILL_SQL" "$MAINTENANCE_SQL"
          ! grep -Eiq 'UPDATE[[:space:]]+t12_prod_(orders|lines|line_runtime)' "$BACKFILL_SQL" "$MAINTENANCE_SQL"
          ! grep -Eiq 'INSERT[[:space:]]+(OR[[:space:]]+IGNORE[[:space:]]+)?INTO[[:space:]]+t12_prod_(orders|lines|line_runtime)' "$BACKFILL_SQL" "$MAINTENANCE_SQL"
          echo 'SCHEDULE_RECOVERY_SAFETY=PASS'

      - name: Snapshot business state before recovery
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM t12_prod_orders) AS orders,
              (SELECT COUNT(*) FROM t12_prod_lines) AS lines,
              (SELECT COUNT(*) FROM t12_prod_line_runtime) AS runtimeRows,
              (SELECT COUNT(*) FROM t12_prod_order_schedule) AS scheduleRows,
              (SELECT COUNT(*)
                 FROM t12_prod_orders o
                 LEFT JOIN t12_prod_order_schedule s ON s.order_id=o.order_id
                WHERE s.order_id IS NULL) AS missingSchedule,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks,
              (SELECT COUNT(*) FROM autonomy_events) AS autonomyEvents;
          " > /tmp/before.json
          cat /tmp/before.json

      - name: Backfill only missing Native schedules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file "$BACKFILL_SQL"

      - name: Install future maintenance triggers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --file "$MAINTENANCE_SQL"

      - name: Verify full coverage and no business mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$DB_NAME" --remote --config "$CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM t12_prod_orders) AS orders,
              (SELECT COUNT(*) FROM t12_prod_lines) AS lines,
              (SELECT COUNT(*) FROM t12_prod_line_runtime) AS runtimeRows,
              (SELECT COUNT(*) FROM t12_prod_order_schedule) AS scheduleRows,
              (SELECT COUNT(*)
                 FROM t12_prod_orders o
                 LEFT JOIN t12_prod_order_schedule s ON s.order_id=o.order_id
                WHERE s.order_id IS NULL) AS missingSchedule,
              (SELECT COUNT(*)
                 FROM t12_prod_orders o
                 JOIN t12_prod_order_schedule s ON s.order_id=o.order_id
                WHERE s.expected_delivery_date <>
                  CASE
                    WHEN EXISTS(
                      SELECT 1 FROM t12_prod_lines l
                       WHERE l.order_id=o.order_id AND l.fly_print=1
                    )
                    THEN date(datetime(o.created_at,'+3 hours'))
                    ELSE date(datetime(o.created_at,'+3 hours'),'+2 days')
                  END) AS policyMismatches,
              (SELECT COUNT(*) FROM sqlite_master
                WHERE type='trigger'
                  AND name IN (
                    'trg_t12_order_schedule_after_order_insert',
                    'trg_t12_order_schedule_after_line_insert'
                  )) AS maintenanceTriggers,
              (SELECT COUNT(*) FROM operator_tasks) AS operatorTasks,
              (SELECT COUNT(*) FROM autonomy_events) AS autonomyEvents;
          " > /tmp/after.json
          cat /tmp/after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'))?.[0]?.results?.[0]||{};
          const a=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'))?.[0]?.results?.[0]||{};
          for(const k of ['orders','lines','runtimeRows','operatorTasks','autonomyEvents']){
            if(Number(b[k])!==Number(a[k])){
              console.error('BUSINESS_STATE_CHANGED',k,b[k],a[k]);
              process.exit(1);
            }
          }
          if(Number(a.scheduleRows)!==Number(a.orders)) process.exit(2);
          if(Number(a.missingSchedule)!==0) process.exit(3);
          if(Number(a.policyMismatches)!==0) process.exit(4);
          if(Number(a.maintenanceTriggers)!==2) process.exit(5);
          if(Number(a.operatorTasks)!==0) process.exit(6);
          if(Number(a.autonomyEvents)!==0) process.exit(7);
          console.log('NATIVE_SCHEDULE_RECOVERY=PASS');
          console.log('SCHEDULE_ROWS='+a.scheduleRows);
          console.log('BACKFILLED_ROWS='+(Number(a.scheduleRows)-Number(b.scheduleRows)));
          console.log('MAINTENANCE_TRIGGERS=2');
          console.log('BUSINESS_STATE_UNCHANGED=YES');
          NODE

      - name: Safety conclusion
        run: |
          echo 'ORDER_STATUS_MUTATION=NO'
          echo 'LINE_STATUS_MUTATION=NO'
          echo 'EMPLOYEE_ASSIGNMENT=NO'
          echo 'AUTONOMY_EVENTS=0'
          echo 'OPERATOR_TASKS=0'
          echo 'AUTOPILOT=OFF'
