name: TrendOS 02CU Production Worker Baseline Read-Only

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cu-production-worker-baseline-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      EXPECTED_VERSION: c77bf453-c590-4cff-a55b-fd9c625b6d76
    steps:
      - name: Verify credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read deployment and version metadata
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')
          curl -fsS "${auth[@]}" "$api/deployments" -o /tmp/deployments.json
          curl -fsS "${auth[@]}" "$api/versions" -o /tmp/versions.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const v=JSON.parse(fs.readFileSync('/tmp/versions.json','utf8'));
          if(!d.success||!v.success) throw new Error('Cloudflare metadata API failed');
          const deployments=Array.isArray(d.result)?d.result:[];
          const latest=deployments[0]||{};
          const versions=Array.isArray(latest.versions)?latest.versions:[];
          const active=versions.map(x=>({version_id:x.version_id,percentage:x.percentage}));
          console.log('ACTIVE_DEPLOYMENT='+JSON.stringify({id:latest.id,created_on:latest.created_on,source:latest.source,versions:active}));
          const recent=(Array.isArray(v.result)?v.result:[]).slice(0,8).map(x=>({id:x.id,created_on:x.created_on,number:x.number}));
          console.log('RECENT_VERSIONS='+JSON.stringify(recent));
          const expected=String(process.env.EXPECTED_VERSION||'');
          if(!active.some(x=>x.version_id===expected && Number(x.percentage)===100)) throw new Error('Expected production version is not at 100%');
          console.log('EXPECTED_VERSION_100_PERCENT=PASS');
          NODE

      - name: Read Worker settings without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "$api" -o /tmp/settings.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(!x.success||!x.result) throw new Error('Cloudflare settings API failed');
          const bs=Array.isArray(x.result.bindings)?x.result.bindings:[];
          const safeKeys=new Set([
            'TRENDOS_CLOUD_WRITE_V1_ENABLED','EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED',
            'EDGE_ORDERS_MIRROR_MAX_AGE_SECONDS','EDGE_DATA_MAX_AGE_SECONDS',
            'TRENDOS_RECONCILE_V1_ENABLED','TRENDOS_RECONCILE_GENERIC_DRAIN_ENABLED',
            'TRENDOS_PRODUCTION_SHADOW_PREVIEW_ENABLED'
          ]);
          const bindings=bs.map(b=>({name:b.name,type:b.type}));
          console.log('BINDING_NAMES_TYPES='+JSON.stringify(bindings));
          const safe={};
          for(const b of bs){ if(b.type==='plain_text'&&safeKeys.has(b.name)) safe[b.name]=String(b.text||''); }
          console.log('SAFE_FLAGS='+JSON.stringify(safe));
          if(!bindings.some(b=>b.name==='EDGE_SESSION_SECRET'&&b.type==='secret_text')) throw new Error('EDGE_SESSION_SECRET binding missing');
          console.log('EDGE_SESSION_SECRET_PRESENT_UNCHANGED_READ_ONLY=PASS');
          NODE

      - name: Probe live authority boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://trendos-d1-api.trendmall-contact.workers.dev'
          curl -fsS "$base/v1/edge/health" -o /tmp/edge.json
          curl -fsS "$base/v1/cloud/write/health" -o /tmp/cloud.json
          curl -fsS "$base/v1/qualification/cloud-write/reconcile/health" -o /tmp/reconcile.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/edge.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/cloud.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/reconcile.json','utf8'));
          if(!e.success||e.cutover!==false) throw new Error('Edge cutover boundary changed');
          if(!c.success||c.enabled!==false||c.sheetsAuthoritative!==true||c.cutover!==false) throw new Error('Cloud-write boundary changed');
          if(r.enabled!==false||r.genericDrainEnabled!==false) throw new Error('Reconcile/generic drain boundary changed');
          console.log('PRODUCTION_AUTHORITY_BOUNDARY_READ_ONLY=PASS');
          NODE
