name: TrendOS 02CU Production Worker Baseline Read-Only

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cu-production-worker-baseline-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      EXPECTED_VERSION: c77bf453-c590-4cff-a55b-fd9c625b6d76
    steps:
      - name: Verify credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read true latest active deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const safe=ds.slice(0,8).map(d=>({id:d.id,created_on:d.created_on,source:d.source,versions:(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:v.version_id||v.id,percentage:Number(v.percentage)}))}));
          console.log('RECENT_DEPLOYMENTS_DESC='+JSON.stringify(safe));
          const latest=ds[0]||{};
          const active=(Array.isArray(latest.versions)?latest.versions:[]).map(v=>({id:v.version_id||v.id,percentage:Number(v.percentage)}));
          console.log('TRUE_ACTIVE_DEPLOYMENT='+JSON.stringify({id:latest.id,created_on:latest.created_on,source:latest.source,versions:active}));
          if(!active.some(v=>v.id===process.env.EXPECTED_VERSION&&v.percentage===100)) throw new Error('Documented c77 production version is not the true latest 100% deployment');
          console.log('TRUE_ACTIVE_VERSION_C77_100_PERCENT=PASS');
          NODE

      - name: Probe live authority boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://trendos-d1-api.trendmall-contact.workers.dev'
          curl -fsS "$base/v1/edge/health" -o /tmp/edge.json
          curl -fsS "$base/v1/cloud/write/health" -o /tmp/cloud.json
          curl -fsS "$base/v1/qualification/cloud-write/reconcile/health" -o /tmp/reconcile.json
          code="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$base/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/edge.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/cloud.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/reconcile.json','utf8'));
          if(!e.success||e.cutover!==false) throw new Error('Edge cutover boundary changed');
          if(!c.success||c.enabled!==false||c.sheetsAuthoritative!==true||c.cutover!==false) throw new Error('Cloud-write runtime boundary changed');
          if(r.enabled!==false||r.genericDrainEnabled!==false) throw new Error('Reconcile/generic drain runtime boundary changed');
          console.log('PRODUCTION_AUTHORITY_BOUNDARY_READ_ONLY=PASS');
          NODE
          test "$code" = '401'
          echo 'PRODUCTION_02CR_ROUTE_PRESENT_AND_AUTH_PROTECTED=PASS'
