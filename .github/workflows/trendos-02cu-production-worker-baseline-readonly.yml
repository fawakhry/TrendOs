name: TrendOS 02CU Production Worker Baseline Read-Only

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cu-production-worker-baseline-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      EXPECTED_VERSION: 23dd09da-cb29-4310-bc01-51505fd5cdec
    steps:
      - name: Verify credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read exact active deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[]);
          const latest=ds[0]||{};
          const active=(Array.isArray(latest.versions)?latest.versions:[]).map(v=>({id:v.version_id||v.id,percentage:Number(v.percentage)}));
          console.log('ACTIVE_DEPLOYMENT='+JSON.stringify({id:latest.id,created_on:latest.created_on,source:latest.source,versions:active}));
          if(!active.some(v=>v.id===process.env.EXPECTED_VERSION&&v.percentage===100)) throw new Error('Expected 23dd production version is not at 100%');
          console.log('ACTIVE_VERSION_EXACT=PASS');
          NODE

      - name: Read exact active version metadata
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 versions view "$EXPECTED_VERSION" --name "$WORKER_NAME" --json > /tmp/version.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));
          const v=(x&&x.result)||x||{};
          const bs=Array.isArray(v.bindings)?v.bindings:[];
          const names=bs.map(b=>({name:b.name,type:b.type}));
          console.log('ACTIVE_VERSION_BINDINGS='+JSON.stringify(names));
          const safeKeys=new Set(['EDGE_DATA_MAX_AGE_SECONDS','EDGE_ORDERS_MIRROR_MAX_AGE_SECONDS','EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED','TRENDOS_CLOUD_WRITE_V1_ENABLED','TRENDOS_PRODUCTION_SHADOW_V2_ENABLED','TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED']);
          const safe={};
          for(const b of bs){if(b.type==='plain_text'&&safeKeys.has(b.name))safe[b.name]=String(b.text||'');}
          console.log('ACTIVE_VERSION_SAFE_FLAGS='+JSON.stringify(safe));
          if(!names.some(b=>b.name==='EDGE_SESSION_SECRET'&&b.type==='secret_text')) throw new Error('Active version missing EDGE_SESSION_SECRET');
          console.log('ACTIVE_VERSION_SECRET_BINDING_PRESENT=PASS');
          NODE

      - name: Probe live authority boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://trendos-d1-api.trendmall-contact.workers.dev'
          curl -fsS "$base/v1/edge/health" -o /tmp/edge.json
          curl -fsS "$base/v1/cloud/write/health" -o /tmp/cloud.json
          curl -fsS "$base/v1/qualification/cloud-write/reconcile/health" -o /tmp/reconcile.json
          node <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/edge.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/cloud.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/reconcile.json','utf8'));
          if(!e.success||e.cutover!==false) throw new Error('Edge cutover boundary changed');
          if(!c.success||c.enabled!==false||c.sheetsAuthoritative!==true||c.cutover!==false) throw new Error('Cloud-write runtime boundary changed');
          if(r.enabled!==false||r.genericDrainEnabled!==false) throw new Error('Reconcile/generic drain runtime boundary changed');
          console.log('PRODUCTION_AUTHORITY_BOUNDARY_READ_ONLY=PASS');
          NODE
