name: TrendOS Entry637 Sherif Bounded Staged Window

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry637-sherif-bounded-staged-window.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry637-sherif-bounded-staged-window
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: trendos-d1-api
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      DATABASE: trendos-main
      CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reuse exact staged window with guaranteed restore
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker=process.env.WORKER;
          const api=String(process.env.API_URL||'').replace(/\/$/,'');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker;
          const headers={authorization:'Bearer '+token};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function cf(path,options={}){
            const r=await fetch(base+path,{...options,headers:{...headers,...(options.headers||{})}});
            const raw=await r.text();
            let body={};try{body=JSON.parse(raw||'{}')}catch{}
            if(!r.ok||body.success!==true) throw new Error('Cloudflare API '+r.status+' '+path+' ERRORS='+JSON.stringify(body.errors||[]));
            return body;
          }
          function activeVersion(body){
            const deps=(body.result&&body.result.deployments)||body.result||[];
            const cur=Array.isArray(deps)?deps[0]:null;
            const full=(cur&&Array.isArray(cur.versions)?cur.versions:[]).filter(x=>Number(x.percentage||0)===100);
            if(full.length!==1) throw new Error('active deployment shape');
            const id=String(full[0].version_id||full[0].id||'');
            if(!id) throw new Error('active version missing');
            return id;
          }
          async function deployVersion(id){
            await cf('/deployments',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({strategy:'percentage',versions:[{version_id:id,percentage:100}]})
            });
          }
          async function health(tag){
            const r=await fetch(api+'/v1/employee/auth/health?entry637staged='+encodeURIComponent(tag)+'-'+Date.now(),{headers:{accept:'application/json'},cache:'no-store'});
            const b=await r.json();
            if(!r.ok||b.success!==true) throw new Error('auth health '+r.status);
            return b;
          }

          (async()=>{
            const initial=await health('pre');
            if(initial.mode!=='TRANSITIONAL'||initial.envEnabled!==true||initial.legacyBootstrapEnabled!==false||initial.legacySessionEnrollEnabled!==false||initial.nativeOnly!==true||Number(initial.userCount||0)!==5||Number(initial.nativeReadyCount||0)!==5||initial.plaintextStored!==false) throw new Error('runtime hardened preflight drift');

            const bridgeResp=await fetch(api+'/v1/employee/legacy-action/health?entry637staged=pre-'+Date.now(),{cache:'no-store'});
            const bridge=await bridgeResp.json();
            if(!bridgeResp.ok||bridge.enabled!==false) throw new Error('bridge preflight drift');

            const preDeploy=await cf('/deployments');
            const preVersion=activeVersion(preDeploy);
            const preBody=await cf('/versions/'+preVersion);
            const preEtag=String(preBody.result&&preBody.result.resources&&preBody.result.resources.script&&preBody.result.resources.script.etag||'');
            if(!preEtag) throw new Error('active etag missing');

            const settings=await cf('/settings');
            const bs=Array.isArray(settings.result&&settings.result.bindings)?settings.result.bindings:[];
            if(bs.length!==33) throw new Error('latest binding count drift '+bs.length);
            const by=new Map(bs.map(b=>[String(b.name||''),b]));
            const plain=n=>{const b=by.get(n);return b&&b.type==='plain_text'?String(b.text||''):''};
            if(plain('TRENDOS_EMPLOYEE_AUTH_V1_ENABLED')!=='true') throw new Error('latest auth enabled drift');
            if(plain('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1')!=='false') throw new Error('latest is not exact staged nativeOnly=false window');
            if(plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED')!=='true') throw new Error('latest is not exact staged bootstrap=true window');
            if(plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED')!=='false') throw new Error('latest session enroll drift');
            if(plain('TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED')!=='false') throw new Error('latest bridge drift');
            if(bs.filter(b=>String(b.type||'').includes('secret')).length!==5) throw new Error('latest secret count drift');
            if(!bs.some(b=>b&&b.name==='DB'&&b.type==='d1')) throw new Error('latest D1 binding missing');

            const versions=await cf('/versions?per_page=100');
            const vr=versions.result;
            const items=Array.isArray(vr)?vr:(vr&&Array.isArray(vr.items)?vr.items:(vr&&Array.isArray(vr.versions)?vr.versions:[]));
            if(!items.length) throw new Error('version list empty');
            const sorted=[...items].sort((a,b)=>String(b.created_on||b.created_at||'').localeCompare(String(a.created_on||a.created_at||'')));
            const stagedVersion=String(sorted[0].id||'');
            if(!stagedVersion||stagedVersion===preVersion) throw new Error('staged latest version not distinct from active');

            const stagedBody=await cf('/versions/'+stagedVersion);
            const stagedEtag=String(stagedBody.result&&stagedBody.result.resources&&stagedBody.result.resources.script&&stagedBody.result.resources.script.etag||'');
            if(!stagedEtag||stagedEtag!==preEtag) throw new Error('staged worker code differs from active');

            console.log('ENTRY637_STAGED_WINDOW_PREFLIGHT=PASS');
            console.log('ENTRY637_STAGED_CODE_ETAG_MATCH=PASS');
            console.log('ENTRY637_STAGED_BRIDGE=false');

            let windowDeployed=false;
            try{
              await deployVersion(stagedVersion);
              windowDeployed=true;

              let opened=false;
              for(let i=0;i<20;i++){
                const a=await health('open');
                if(a.nativeOnly===false&&a.legacyBootstrapEnabled===true&&a.legacySessionEnrollEnabled===false&&Number(a.userCount||0)===5&&Number(a.nativeReadyCount||0)===5){opened=true;break;}
                await sleep(1000);
              }
              if(!opened) throw new Error('staged window did not become active');

              console.log('ENTRY637_WINDOW_OPEN=PASS');
              console.log('ENTRY637_WINDOW_NATIVE_ONLY=false');
              console.log('ENTRY637_WINDOW_BOOTSTRAP=true');
              console.log('ENTRY637_WINDOW_BRIDGE=false');
              console.log('ENTRY637_WINDOW_MAX_SECONDS=600');

              let migrated=false;
              for(let attempt=1;attempt<=60;attempt++){
                const a=await health('poll-'+attempt);
                const users=Number(a.userCount||0),ready=Number(a.nativeReadyCount||0);
                console.log('ENTRY637_WINDOW_POLL='+attempt+' USERS='+users+' READY='+ready);
                if(users===6&&ready===6){
                  migrated=true;
                  console.log('ENTRY637_SHERIF_BOOTSTRAP_OBSERVED=YES');
                  break;
                }
                if(users>6||ready>6) throw new Error('unexpected extra Native user during bounded window');
                await sleep(10000);
              }

              await deployVersion(preVersion);
              windowDeployed=false;
              console.log('ENTRY637_WINDOW_CLOSED=PASS');

              let restored=null;
              for(let i=0;i<25;i++){
                restored=await health('restore');
                if(restored.nativeOnly===true&&restored.legacyBootstrapEnabled===false) break;
                await sleep(1000);
              }
              if(!restored||restored.nativeOnly!==true||restored.legacyBootstrapEnabled!==false||restored.legacySessionEnrollEnabled!==false) throw new Error('hardening restore failed');
              if(!migrated) throw new Error('Sherif did not login during bounded window');
              if(Number(restored.userCount||0)!==6||Number(restored.nativeReadyCount||0)!==6) throw new Error('post-migration count not 6/6');

              const br=await fetch(api+'/v1/employee/legacy-action/health?entry637staged=post-'+Date.now(),{cache:'no-store'});
              const bb=await br.json();
              if(!br.ok||bb.enabled!==false) throw new Error('bridge postflight drift');

              console.log('ENTRY637_HARDENING_RESTORED=PASS');
              console.log('ENTRY637_NATIVE_READY=6_OF_6');
              console.log('ENTRY637_BOUNDED_MIGRATION=PASS');
            }catch(err){
              if(windowDeployed){
                try{
                  await deployVersion(preVersion);
                  console.log('ENTRY637_WINDOW_EMERGENCY_CLOSE=PASS');
                }catch(closeErr){
                  console.log('ENTRY637_WINDOW_EMERGENCY_CLOSE=FAILED');
                }
              }
              throw err;
            }
          })().catch(err=>{
            console.error('ENTRY637_STAGED_MIGRATION_FAIL '+String(err&&err.message||err));
            process.exit(1);
          });
          NODE

      - name: Verify Sherif D1 row shape after migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json \
            --command "SELECT employee_id AS employeeId,
                              username_key AS usernameKey,
                              canonical_username AS canonicalUsername,
                              active,
                              role,
                              department,
                              screens_json AS screensJson,
                              must_change AS mustChange,
                              CASE WHEN password_hash_hex<>'' THEN 1 ELSE 0 END AS hasPasswordHash
                         FROM employee_auth_users_v1
                        WHERE username_key='شريف'
                        LIMIT 1;" > /tmp/sherif.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/sherif.json','utf8'));
          const rows=[];const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'usernameKey'))rows.push(v);Object.values(v).forEach(walk)}};walk(raw);
          if(rows.length!==1) throw new Error('Sherif row missing');
          const r=rows[0];
          if(r.usernameKey!=='شريف'||r.canonicalUsername!=='شريف'||Number(r.active)!==1||Number(r.hasPasswordHash)!==1) throw new Error('Sherif row not Native-ready');
          console.log('ENTRY637_SHERIF_D1_ROW=PASS');
          console.log('ENTRY637_SHERIF_ROLE='+String(r.role||''));
          console.log('ENTRY637_SHERIF_DEPARTMENT='+String(r.department||''));
          console.log('ENTRY637_SHERIF_SCREENS='+String(r.screensJson||''));
          console.log('ENTRY637_SHERIF_PASSWORD_HASH_LOGGED=NO');
          NODE

      - name: Boundary
        run: |
          echo ENTRY637_D1_CONTROL_MUTATION=NO
          echo ENTRY637_ACCOUNTING_TOUCHED=NO
          echo ENTRY637_EASYSTORE_TOUCHED=NO
