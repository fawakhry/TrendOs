name: TrendOS 02CU Frontend Production TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cu-frontend-production-temp.yml'

permissions:
  contents: write

concurrency:
  group: trendos-02cu-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      BASE_MAIN: 9552407c5a5136371f9afd452b913c226329d7dc
      CANDIDATE_REF: b5721d7047291e0047399ddcf5d0284f3b6ca04f
      EXPECTED_WORKER: 9a4e7163-53bd-4dd7-bbbb-4062d5e829b8
      WORKER_NAME: trendos-d1-api
      PROD_WORKER_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      SITE_URL: https://fawakhry.github.io/TrendOs
      OLD_ASSET: trendos-edge-orders-read-v1.js?v=20260906-02cu-fresh1
      NEW_ASSET: trendos-edge-orders-read-v1.js?v=20260906-02cu-idlelogical1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock exact production baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x.items||[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const active=(d.versions||[]).map(v=>({id:v.version_id||v.id,p:Number(v.percentage)}));
          if(!active.some(v=>v.id===process.env.EXPECTED_WORKER&&v.p===100)) throw new Error('02CU Worker target is not active at 100%');
          console.log('PERF_CF_02CU_FRONTEND_BASELINE_LOCK_PASS');
          NODE

      - name: Assemble surgical frontend delta on current main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/02cu-frontend "$BASE_MAIN"
          git show "$CANDIDATE_REF:trendos-edge-orders-read-v1.js" > /tmp/02cu-frontend/trendos-edge-orders-read-v1.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/02cu-frontend/config.js')
          s=p.read_text(encoding='utf-8')
          old="trendos-edge-orders-read-v1.js?v=20260906-02cu-fresh1"
          new="trendos-edge-orders-read-v1.js?v=20260906-02cu-idlelogical1"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old loader, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          grep -Fq "EDGE_ORDERS_READ_02CU_IDLE_LOGICAL_FRESHNESS_20260906" /tmp/02cu-frontend/trendos-edge-orders-read-v1.js
          grep -Fq "verified-idle-source-unchanged" /tmp/02cu-frontend/trendos-edge-orders-read-v1.js
          grep -Fq "window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true" /tmp/02cu-frontend/config.js
          grep -Fq "window.MATBAGY_DISABLE_RETURN_AUTO_REFRESH_V1 = true" /tmp/02cu-frontend/config.js
          grep -Fq "window.MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false" /tmp/02cu-frontend/config.js
          grep -Fq "window.MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false" /tmp/02cu-frontend/config.js
          grep -Fq "window.MATBAGY_TREND_MASTER_MAX_CONCURRENCY = 2" /tmp/02cu-frontend/config.js
          grep -Fq "window.MATBAGY_TREND_MASTER_MAX_ATTEMPTS = 1" /tmp/02cu-frontend/config.js

      - name: Focused frontend regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/02cu-frontend/trendos-edge-orders-read-v1.js
          git show "$CANDIDATE_REF:tests/frontend_edge_orders_cutover_02ct.test.mjs" > /tmp/02cu-frontend/tests/frontend_edge_orders_cutover_02ct.test.mjs
          (cd /tmp/02cu-frontend && node tests/frontend_edge_orders_cutover_02ct.test.mjs)
          rm -f /tmp/02cu-frontend/tests/frontend_edge_orders_cutover_02ct.test.mjs
          (cd /tmp/02cu-frontend && node tests/trendos_resume_no_autorefresh_v1.test.mjs)
          (cd /tmp/02cu-frontend && node tests/trendos_return_traffic_quiet_v1.test.mjs)
          python3 - <<'PY'
          import subprocess
          out=subprocess.check_output(['git','-C','/tmp/02cu-frontend','status','--porcelain'],text=True)
          got={line[3:] for line in out.splitlines() if line.strip()}
          expected={'config.js','trendos-edge-orders-read-v1.js'}
          print('02CU_FRONTEND_ASSEMBLED_FILES=',sorted(got))
          if got != expected: raise SystemExit(f'unexpected frontend scope {got}')
          PY

      - name: Commit and push exact two-file frontend promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git -C /tmp/02cu-frontend config user.name trendos-bot
          git -C /tmp/02cu-frontend config user.email actions@users.noreply.github.com
          git -C /tmp/02cu-frontend add config.js trendos-edge-orders-read-v1.js
          git -C /tmp/02cu-frontend commit -m "Promote 02CU logical freshness frontend"
          new_sha="$(git -C /tmp/02cu-frontend rev-parse HEAD)"
          echo "NEW_MAIN=$new_sha" >> "$GITHUB_ENV"
          git -C /tmp/02cu-frontend push origin HEAD:main
          echo "PERF_CF_02CU_FRONTEND_MAIN_PUSH=$new_sha"

      - name: Wait for GitHub Pages assets and qualify public frontend
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$SITE_URL/config.js?02cu=$GITHUB_RUN_ID-$i" -o /tmp/live-config.js \
              && curl -fsS "$SITE_URL/trendos-edge-orders-read-v1.js?02cu=$GITHUB_RUN_ID-$i" -o /tmp/live-wrapper.js \
              && grep -Fq "$NEW_ASSET" /tmp/live-config.js \
              && grep -Fq "EDGE_ORDERS_READ_02CU_IDLE_LOGICAL_FRESHNESS_20260906" /tmp/live-wrapper.js \
              && grep -Fq "verified-idle-source-unchanged" /tmp/live-wrapper.js; then
                ok=1; break
            fi
            sleep 10
          done
          test "$ok" = 1
          grep -Fq "window.MATBAGY_DISABLE_RETURN_AUTO_REFRESH_V1 = true" /tmp/live-config.js
          grep -Fq "window.MATBAGY_CUSTOMER_FEEDBACK_AUTO_SCAN_V1 = false" /tmp/live-config.js
          grep -Fq "window.MATBAGY_GO_LIVE_AUTOPILOT_AUTO_SWEEP_V1 = false" /tmp/live-config.js
          echo 'PERF_CF_02CU_PUBLIC_FRONTEND_ASSETS_PASS'

      - name: Production read-only qualification after frontend promotion
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_WORKER_URL,u=process.env.QUALIFY_USERNAME,t=process.env.QUALIFY_EMPLOYEE_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(p,opt={},n=6){let last;for(let i=1;i<=n;i++){try{const r=await fetch(base+p,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{};if(r.status>=500&&i<n){await sleep(i*1500);continue;}return{status:r.status,body:b};}catch(e){last=e;if(i<n)await sleep(i*1500)}}throw last;}
          (async()=>{
            const [e,c,r,a]=await Promise.all([
              req('/v1/edge/health'),req('/v1/cloud/write/health'),req('/v1/qualification/cloud-write/reconcile/health'),req('/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter=__ACTIVE__')
            ]);
            assert.equal(e.status,200);assert.equal(e.body.success,true);assert.equal(e.body.cutover,false);
            assert.equal(c.status,200);assert.equal(c.body.success,true);assert.equal(c.body.sheetsAuthoritative,true);assert.equal(c.body.cutover,false);assert.equal(Number(c.body.pendingOutbox||0),0);
            assert.equal(r.status,200);assert.equal(r.body.enabled,false);assert.equal(r.body.genericDrainEnabled,false);
            assert.equal(a.status,401);
            const s=await req('/v1/edge/orders/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,token:t})},8);
            assert.equal(s.status,200);assert.equal(s.body.success,true);assert.ok(s.body.edgeToken);
            const h={authorization:'Bearer '+s.body.edgeToken,accept:'application/json'};
            const x=await req('/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=5&statusFilter=__ACTIVE__',{headers:h},6);
            assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.dataSource,'d1-edge-orders-02cr-operational');
            if(x.body.logicalFreshness){assert.equal(x.body.logicalFreshness.ok,true);assert.equal(x.body.logicalFreshness.mode,'verified-idle-source-unchanged');}
            const d=await req('/v1/edge/orders/02cr/page?screen=service&page=1&pageSize=5&statusFilter=__DEBT__',{headers:h},3);
            assert.equal(d.status,409);assert.equal(d.body.fallback,'apps-script');
            console.log('PERF_CF_02CU_FRONTEND_PRODUCTION_QUALIFIED_PASS='+JSON.stringify({main:process.env.NEW_MAIN,logicalMode:x.body.logicalFreshness&&x.body.logicalFreshness.mode||'physical-fresh',debtFallback:true}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Roll back frontend if post-push qualification failed
        if: failure() && env.NEW_MAIN != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$NEW_MAIN"
          git -C /tmp/02cu-frontend revert --no-edit "$NEW_MAIN"
          rollback_sha="$(git -C /tmp/02cu-frontend rev-parse HEAD)"
          git -C /tmp/02cu-frontend push origin HEAD:main
          echo "PERF_CF_02CU_FRONTEND_ROLLBACK=$rollback_sha"
