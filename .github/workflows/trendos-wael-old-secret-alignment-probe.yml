name: TrendOS Wael Old Secret Alignment Probe

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-wael-old-secret-alignment-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.head_commit.message == 'PROBE WAEL OLD SECRET ALIGNMENT 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      U: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      T: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - name: Verify exact wael username and token presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test "$U" = 'wael'
          test -n "$T"
          echo 'WAEL_USERNAME_EXACT_MATCH=1'
          echo 'WAEL_EMPLOYEE_TOKEN_PRESENT=1'
