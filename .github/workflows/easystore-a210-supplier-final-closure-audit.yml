name: EasyStore A2.10 Supplier Final Closure Audit

on:
  push:
    branches:
      - candidate/easystore-accounting-a2-20261005
    paths:
      - '.github/workflows/easystore-a210-supplier-final-closure-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: trendos-main
      API_CONFIG: cloudflare-d1/wrangler.toml
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-accounting-a2-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@${WRANGLER_VERSION}

      - name: Final read-only closure verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$EASYSTORE_URL/config.js?a210final=$GITHUB_RUN_ID" > /tmp/config.js
          curl -fsS "$API_URL/v1/employee/accounting/health?a210final=$GITHUB_RUN_ID" > /tmp/health.json
          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command "
            SELECT
              (SELECT COUNT(*) FROM employee_accounting_materials_v1) AS materials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1) AS templates,
              (SELECT COUNT(*) FROM employee_accounting_parties_v1) AS parties,
              (SELECT COUNT(*) FROM employee_accounting_dept_lines_v1) AS deptLines,
              (SELECT COUNT(*) FROM employee_accounting_final_invoices_v1) AS finalInvoices,
              (SELECT COUNT(*) FROM employee_accounting_party_ledger_v1) AS partyLedger,
              (SELECT COUNT(*) FROM employee_accounting_stock_moves_v1) AS stockMoves,
              (SELECT COUNT(*) FROM employee_accounting_purchase_invoices_v1) AS purchases,
              (SELECT COUNT(*) FROM employee_accounting_daily_purchases_v1) AS dailyPurchases,
              (SELECT COUNT(*) FROM employee_accounting_cashbox_v1) AS cashbox,
              (SELECT COUNT(*) FROM employee_accounting_waste_v1) AS waste,
              (SELECT COUNT(*) FROM employee_accounting_custody_events_v1) AS custodyEvents,
              (SELECT COUNT(*) FROM employee_accounting_custody_closes_v1) AS custodyCloses,
              (SELECT COUNT(*) FROM employee_accounting_day_closes_v1) AS dayCloses,
              (SELECT COUNT(*) FROM employee_accounting_party_balances_v1) AS partyBalances,
              (SELECT COUNT(*) FROM employee_accounting_request_ledger_v1) AS requestLedger,
              (SELECT COUNT(*) FROM employee_accounting_events_v1) AS events,
              (SELECT COUNT(*) FROM employee_accounting_materials_v1 WHERE active=1) AS activeMaterials,
              (SELECT COUNT(*) FROM employee_accounting_templates_v1 WHERE active=1) AS activeTemplates;
            SELECT request_key,operation,actor,status,entity_id,response_json AS responseJson
              FROM employee_accounting_request_ledger_v1
             WHERE request_key LIKE 'A210-SUP-%';
            SELECT entity_type,entity_id,event_type,actor,request_key,payload_json AS payloadJson
              FROM employee_accounting_events_v1
             WHERE request_key LIKE 'A210-SUP-%';
            SELECT party_id AS partyId,party_type AS partyType,display_name AS displayName,active
              FROM employee_accounting_parties_v1
             WHERE party_type='supplier' AND display_name LIKE 'A2-CANARY-SUPPLIER-%';
            SELECT party_id AS partyId,party_type AS partyType,balance
              FROM employee_accounting_party_balances_v1
             WHERE party_type='supplier';
          " > /tmp/d1.json

          node <<'NODE' | tee .github/a210-supplier-final-closure-result.txt
          const fs=require('fs');
          const cfg=fs.readFileSync('/tmp/config.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')),groups=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Array.isArray(v.results))groups.push(v.results);for(const [k,z] of Object.entries(v))if(k!=='results')walk(z);}};walk(x);
          const all=groups.flat();
          const c=all.find(r=>r.materials!==undefined)||{};
          const qs=all.filter(r=>r.request_key&&r.operation);
          const es=all.filter(r=>r.entity_type);
          const ps=all.filter(r=>r.partyId&&r.partyType&&r.displayName!==undefined);
          const bs=all.filter(r=>r.partyId&&r.partyType&&r.balance!==undefined);
          const exp={materials:1,templates:1,parties:1,deptLines:0,finalInvoices:0,partyLedger:0,stockMoves:0,purchases:0,dailyPurchases:0,cashbox:0,waste:0,custodyEvents:0,custodyCloses:0,dayCloses:0,partyBalances:1,requestLedger:4,events:4,activeMaterials:0,activeTemplates:0};
          if(!/EASYSTORE_ACCOUNTING_D1_READONLY\s*=\s*true/.test(cfg))throw Error('frontend readonly drift');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITES\s*=\s*false/.test(cfg))throw Error('legacy writes drift');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'OFF'/.test(cfg))throw Error('frontend not OFF');
          if(!/EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS\s*=\s*\[\]/.test(cfg))throw Error('frontend actions not empty');
          if(h.mode!=='READONLY'||h.authoritativeWrites!==false)throw Error('backend not closed');
          if(Number(h.writeCanaryAllowedUserCount||0)||Number(h.writeCanaryAllowedActionCount||0)||Number(h.writeCanaryMaxCommands||0)||Number(h.writeCanaryCommandsStarted||0))throw Error('server canary not cleared');
          if(Number(h.googleBusinessCalls||0)!==0)throw Error('google calls nonzero');
          for(const [k,v] of Object.entries(exp))if(Number(c[k]||0)!==v)throw Error('count mismatch '+k+'='+c[k]);
          if(qs.length!==1||es.length!==1||ps.length!==1||bs.length!==1)throw Error('A210 evidence multiplicity');
          const q=qs[0],e=es[0],p=ps[0],b=bs[0];
          if(q.operation!=='supplier-master-upsert'||q.actor!=='ضياء'||q.status!=='COMMITTED'||!String(q.request_key||'').startsWith('A210-SUP-')||String(q.entity_id||'')!=='')throw Error('request mismatch');
          if(e.entity_type!=='supplier'||e.event_type!=='create'||e.actor!=='ضياء'||e.request_key!==q.request_key)throw Error('event mismatch');
          if(p.partyType!=='supplier'||!String(p.displayName||'').startsWith('A2-CANARY-SUPPLIER-')||Number(p.active)!==0||String(p.partyId)!==String(e.entity_id))throw Error('supplier mismatch');
          if(String(b.partyId)!==String(p.partyId)||b.partyType!=='supplier'||Number(b.balance)!==0)throw Error('balance mismatch');
          const ep=JSON.parse(e.payloadJson||'{}'),rp=JSON.parse(q.responseJson||'{}');
          if(Number(ep.opening||0)!==0||Number(ep.active)!==0)throw Error('event payload mismatch');
          if(Number(rp.openingBalance||0)!==0||rp.active!==false||String(rp.supplierName||rp.name||'')!==String(p.displayName))throw Error('response mismatch');
          console.log('A210_FINAL_CLOSURE=PASS');
          console.log('FRONTEND_MODE=OFF');
          console.log('FRONTEND_CANARY_ACTIONS=[]');
          console.log('BACKEND_MODE=READONLY');
          console.log('SERVER_USERS_ACTIONS=0/0');
          console.log('COMMAND_BUDGET=0/0');
          console.log('GOOGLE_BUSINESS_CALLS=0');
          console.log('MATERIALS=1');
          console.log('TEMPLATES=1');
          console.log('PARTIES=1');
          console.log('PARTY_BALANCES=1');
          console.log('REQUEST_LEDGER=4');
          console.log('EVENTS=4');
          console.log('OTHER_TRACKED_TABLES=0');
          console.log('A210_REQUEST_KEY='+q.request_key);
          console.log('A210_SUPPLIER_ID='+p.partyId);
          console.log('A210_SUPPLIER_NAME='+p.displayName);
          console.log('A210_OPENING_BALANCE=0');
          console.log('A210_ACTIVE=false');
          console.log('GENERAL_OPENED=NO');
          console.log('PRODUCTION_CLOSED=YES');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/a210-supplier-final-closure-result.txt
          git commit -m "A2.10: persist Supplier final closure audit" || exit 0
          git push origin HEAD:candidate/easystore-accounting-a2-20261005
