name: TrendOS 02CS Authoritative Order Fix TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-authoritative-order-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded authoritative ordering patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_read_v1.test.mjs
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_operational_enrichment_02cr.test.mjs
          node tests/cloudflare_edge_orders_canary_wrapper_02co.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          echo 'PERF_CF_02CS_AUTHORITATIVE_ORDER_FOCUSED_TESTS_PASS'

      - name: Exact patch scope gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'cloudflare-d1/src/edge-orders-read-v1.mjs\ntests/cloudflare_edge_orders_read_v1.test.mjs'
          ! git diff -- cloudflare-d1/src/edge-orders-read-v1.mjs tests/cloudflare_edge_orders_read_v1.test.mjs | grep -E 'EDGE_SESSION_SECRET|TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED|genericDrain|MATBAGY_EDGE_ORDERS_READ_V1_ENABLED' >/dev/null
          echo 'PERF_CF_02CS_AUTHORITATIVE_ORDER_PATCH_SCOPE_PASS'

      - name: Commit qualified code change only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-d1/src/edge-orders-read-v1.mjs tests/cloudflare_edge_orders_read_v1.test.mjs
          git commit -m 'fix: match deployed Apps Script order semantics'
          git push origin HEAD:agent/go-live-2026-09-01-integrity
          echo 'PERF_CF_02CS_AUTHORITATIVE_ORDER_FIX_COMMITTED'
