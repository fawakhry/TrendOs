name: "OWNER APPROVED — bootstrap ONLY missing Zero Google isolated OFF Worker 20261101"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/zg-cloudflare-initial-isolated-worker-bootstrap-owner-approved-20261101.yml"
permissions:
  contents: read
concurrency:
  group: "20261101-owner-bootstrap-ONLY-trendos-customer-portal-isolated-stage-v0"
  cancel-in-progress: false
jobs:
  first-time-isolated-stage-bootstrap-only:
    if: ${{ github.repository == 'fawakhry/TrendOs' && github.event.pull_request.number == 316 && github.event.pull_request.head.repo.full_name == 'fawakhry/TrendOs' && github.head_ref == 'chore/zero-google-direct-cloudflare-stage-upload-v1-20261101' && github.base_ref == 'integration/zero-google-one-package-v1-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
      TRENDOS_CUSTOMER_PORTAL_STAGING_ENABLED: "false"
      EXPECTED_STAGE_NAME: "trendos-customer-portal-isolated-stage-v0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact source and isolation gate before any Cloudflare mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$GITHUB_HEAD_REF" = "chore/zero-google-direct-cloudflare-stage-upload-v1-20261101"
          test "$(git hash-object cloudflare-d1/wrangler.customer-stage.toml)" = "4e0c7f8275ff9cd89740f97b9f00c6d4d6cc75dd"
          test "$(git hash-object cloudflare-d1/customer-stage/index.mjs)" = "e5a4999934c774f70e555790b39f7eb0a19d9ddc"
          python3 tools/zero_google_direct_stage_upload_guard_v1.py > "$RUNNER_TEMP/zg-source-isolation-guard.json"
          python3 tests/zero_google_direct_stage_upload_guard_v1.test.py -v
          grep -Fx 'workers_dev = false' cloudflare-d1/wrangler.customer-stage.toml > /dev/null
          grep -Fx 'preview_urls = false' cloudflare-d1/wrangler.customer-stage.toml > /dev/null
          ! grep -Eq '^\s*(route|routes|custom_domains|database_id|account_id)\s*=' cloudflare-d1/wrangler.customer-stage.toml
          ! grep -Eq '^\[\[(d1_databases|r2_buckets|kv_namespaces|services)\]\]' cloudflare-d1/wrangler.customer-stage.toml
          echo "OWNER_APPROVED_EXISTING_SOURCE_STAGE_OFF_GUARD=PASS"
      - name: Install local Wrangler and dry-run exact isolated Worker bundle
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/zg-cf-owner-bootstrap" --no-save --no-audit --no-fund wrangler@4
          echo "ZG_WRANGLER=$RUNNER_TEMP/zg-cf-owner-bootstrap/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zg-cf-owner-bootstrap/node_modules/.bin/wrangler" deploy --dry-run             --config wrangler.customer-stage.toml --outdir "$RUNNER_TEMP/zg-cf-isolated-off-bundle"
          echo "EXACT_ISOLATED_WORKER_BUILD=PASS"
      - name: Confirm target ABSENT via existing Cloudflare API before first-ever deploy
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          code=0
          "$ZG_WRANGLER" versions list --config wrangler.customer-stage.toml             > "$RUNNER_TEMP/zg-before-bootstrap.out" 2> "$RUNNER_TEMP/zg-before-bootstrap.err" || code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Isolated Worker exists already; refusing duplicate or upgrade"; exit 1
          fi
          # ONLY previously observed Cloudflare 10007 Worker-not-found is permitted.
          # Authentication/permission/timeout/other failure stops before any write.
          if ! grep -Eq '(10007|Worker not found|script not found)'              "$RUNNER_TEMP/zg-before-bootstrap.out" "$RUNNER_TEMP/zg-before-bootstrap.err"; then
            echo "::error::Cloudflare did not confirm the absent target; no write"; exit 1
          fi
          echo "TARGET_ABSENT_AND_NO_OTHER_WORKERS_TARGETED=VERIFIED_10007"
      - name: ONE first-time OFF Worker and isolated SQLite DO bootstrap — owner approved
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          # This is an actual deploy to CREATE only the separate isolated Worker.
          # workers_dev=false, preview_urls=false, no routes, no real D1/R2,
          # all customer features OFF. NEVER use the production Wrangler file.
          if "$ZG_WRANGLER" deploy --config wrangler.customer-stage.toml             > "$RUNNER_TEMP/zg-isolated-bootstrap.out" 2> "$RUNNER_TEMP/zg-isolated-bootstrap.err"; then
            echo "ISOLATED_CLOUDFLARE_FIRST_TIME_BOOTSTRAP=SUCCESS"
            echo "ISOLATED_CUSTOMER_FEATURES_ENABLED=NO"
            echo "LIVE_GOOGLE_CUSTOMER_ACTIONS_RETIRED_LAST_PROVEN=0/9"
          else
            echo "::error::Isolated bootstrap failed; do not retry or switch to production"
            exit 1
          fi
      - name: Verify Cloudflare reports Worker version EXISTS and NO workers.dev/preview endpoints
        working-directory: cloudflare-d1
        shell: bash
        run: |
          set -euo pipefail
          "$ZG_WRANGLER" versions list --config wrangler.customer-stage.toml             > "$RUNNER_TEMP/zg-isolated-after-versions.out" 2> "$RUNNER_TEMP/zg-isolated-after-versions.err"
          # Read-only Cloudflare API, exact unique worker, never report token,
          # URLs, customer data or contents.
          curl --silent --show-error --fail --max-time 20 --retry 0             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$EXPECTED_STAGE_NAME/subdomain"             > "$RUNNER_TEMP/zg-isolated-subdomain-status.json"
          python3 - "$RUNNER_TEMP/zg-isolated-subdomain-status.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding='utf8'))
          if (result.get('success') is not True or
              result.get('result',{}).get('enabled') is not False or
              result.get('result',{}).get('previews_enabled') is not False):
              raise SystemExit('CLOUDFLARE_ISOLATED_SUBDOMAIN_OR_PREVIEW_NOT_CONFIRMED_DISABLED')
          print('ISOLATED_WORKERS_DEV_ROUTE=DISABLED_VERIFIED_REMOTE')
          print('ISOLATED_PREVIEW_URLS=DISABLED_VERIFIED_REMOTE')
          print('PRODUCTION_WORKERS_D1_R2_NOT_TARGETED=YES')
          PY
          echo '## Authorized first-time isolated Worker Stage bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker: `trendos-customer-portal-isolated-stage-v0`. Existing Worker version verified, workers.dev and preview URLs disabled by Cloudflare readback. No custom routes or production D1/R2 configured. Customer feature flags remain OFF.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare Access ↔ Ubuntu support case #02394197 remains independent. Live Google retirements last verified 0/9.' >> "$GITHUB_STEP_SUMMARY"
