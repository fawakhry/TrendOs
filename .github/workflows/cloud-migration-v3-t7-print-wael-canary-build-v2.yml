name: TrendOS T7 Build Wael Print Canary V2
on:
  push:
    branches: [cloud-migration-v3-t7-print-wael-canary-20260913]
    paths: ['.github/workflows/cloud-migration-v3-t7-print-wael-canary-build-v2.yml']
permissions: { contents: write }
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: cloud-migration-v3-t7-print-wael-canary-20260913 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Patch canary scope
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('trendos-edge-orders-read-v1.js'); s=p.read_text()
          s=s.replace("var VERSION = 'EDGE_ORDERS_READ_02CX_LINE_ID_GUARD_20260908';", "var VERSION = 'EDGE_ORDERS_READ_T7_PRINT_WAEL_CANARY_20260913';")
          pat=r"  function eligible\(action, params\) \{\n    if \(action !== 'getRowsPageV1931'\) return false;\n    if \(text\(params && params\.statusFilter\) === '__DEBT__'\) return false;\n    return true;\n  \}"
          rep="""  function canaryUserAllowed() {
            if (window.MATBAGY_EDGE_ORDERS_CANARY_ONLY !== true) return true;
            var user = currentUser();
            var username = text(user && user.username).toLowerCase();
            var allowed = Array.isArray(window.MATBAGY_EDGE_ORDERS_CANARY_USERS)
              ? window.MATBAGY_EDGE_ORDERS_CANARY_USERS.map(function (value) { return text(value).toLowerCase(); })
              : [];
            return !!username && allowed.indexOf(username) >= 0;
          }

          function eligible(action, params) {
            if (action !== 'getRowsPageV1931') return false;
            if (text(params && params.statusFilter) === '__DEBT__') return false;
            if (window.MATBAGY_EDGE_ORDERS_CANARY_ONLY === true) {
              if (!canaryUserAllowed()) return false;
              if (text(params && params.screen).toLowerCase() !== 'print') return false;
            }
            return true;
          }"""
          s,n=re.subn(pat,rep,s); assert n==1,n
          needle="if (action === 'updateLine') {\n        var safeParams = identitySafeUpdateLineParams(params || {});"
          repl="if (action === 'updateLine') {\n        if (!canaryUserAllowed()) return original.apply(this, args);\n        var safeParams = identitySafeUpdateLineParams(params || {});"
          assert needle in s; s=s.replace(needle,repl,1)
          s=s.replace("mode: 'qualified-d1-orders-read-first-line-id-repaired-persisted-read-your-write-apps-script-authoritative',", "mode: 't7-print-wael-canary-d1-read-first-apps-script-authoritative',\n      canaryOnly: window.MATBAGY_EDGE_ORDERS_CANARY_ONLY === true,\n      canaryUsers: Array.isArray(window.MATBAGY_EDGE_ORDERS_CANARY_USERS) ? window.MATBAGY_EDGE_ORDERS_CANARY_USERS.slice() : [],")
          p.write_text(s)
          c=Path('config.js'); x=c.read_text()
          assert 'window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false;' in x
          x=x.replace('window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = false;', "window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;\nwindow.MATBAGY_EDGE_ORDERS_CANARY_ONLY = true;\nwindow.MATBAGY_EDGE_ORDERS_CANARY_USERS = ['وائل','wael'];",1)
          x=x.replace('trendos-edge-orders-read-v1.js?v=20260908a','trendos-edge-orders-read-v1.js?v=20260913-t7-wael1',1)
          c.write_text(x)
      - name: Safety and runtime tests
        run: |
          set -euo pipefail
          grep -q "MATBAGY_EDGE_ORDERS_CANARY_ONLY = true" config.js
          grep -q "screen).toLowerCase() !== 'print'" trendos-edge-orders-read-v1.js
          grep -q "statusFilter) === '__DEBT__'" trendos-edge-orders-read-v1.js
          cat > /tmp/t.mjs <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';
          const code=fs.readFileSync('trendos-edge-orders-read-v1.js','utf8');
          async function run(user,action,params,edgeOk=true){const calls={app:[],edge:[]},store=new Map([['trendos_session',JSON.stringify({user:{username:user,token:'t'}})]]),now=new Date().toISOString();const c={console,URL,URLSearchParams,Map,Date,Promise,setInterval,clearInterval,Response,Headers,sessionStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v),removeItem:k=>store.delete(k)},window:{MATBAGY_EDGE_ORDERS_READ_V1_ENABLED:true,MATBAGY_EDGE_ORDERS_CANARY_ONLY:true,MATBAGY_EDGE_ORDERS_CANARY_USERS:['وائل','wael'],MATBAGY_EDGE_ORDERS_API_URL:'https://e',trendosSecureApiV1922:async(a,p)=>{calls.app.push({a,p});return{success:true}}},fetch:async(u)=>{calls.edge.push(String(u));if(String(u).includes('/session'))return new Response(JSON.stringify({success:true,edgeToken:'x',expiresIn:600}),{status:200});if(!edgeOk)return new Response(JSON.stringify({success:false,code:'stale',message:'stale'}),{status:503});return new Response(JSON.stringify({success:true,rows:[],mirrors:['بنود الأوردرات','العملاء','عملاء منع التسليم بالمديونية'].map(sheetName=>({sheetName,status:'ready',rowCount:1,sourceLastRow:1,syncedAt:now}))}),{status:200})}};vm.createContext(c);vm.runInContext(code,c);await c.window.trendosSecureApiV1922(action,params);return calls}
          let c=await run('wael','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'});assert.equal(c.app.length,0);assert.ok(c.edge.some(x=>x.includes('/02cr/page')));
          c=await run('رحمه','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'});assert.equal(c.app.length,1);assert.equal(c.edge.length,0);
          c=await run('وائل','getRowsPageV1931',{screen:'laser',statusFilter:'__ACTIVE__'});assert.equal(c.app.length,1);assert.equal(c.edge.length,0);
          c=await run('wael','getRowsPageV1931',{screen:'print',statusFilter:'__DEBT__'});assert.equal(c.app.length,1);assert.equal(c.edge.length,0);
          c=await run('رحمه','updateLine',{orderId:'1',lineId:'1',rowNumber:2});assert.equal(c.app.length,1);assert.ok('rowNumber' in c.app[0].p);
          c=await run('wael','getRowsPageV1931',{screen:'print',statusFilter:'__ACTIVE__'},false);assert.equal(c.app.length,1);assert.ok(c.edge.some(x=>x.includes('/02cr/page')));
          console.log('T7_WAEL_PRINT_CANARY_RUNTIME=PASS');console.log('NON_CANARY_UNCHANGED=PASS');console.log('LASER_UNCHANGED=PASS');console.log('DEBT_UNCHANGED=PASS');console.log('EDGE_FAILURE_FALLBACK=PASS');
          NODE
          node /tmp/t.mjs
      - name: Commit candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.js trendos-edge-orders-read-v1.js
          git diff --cached --check
          git commit -m 'cloud migration: enable Wael print read canary'
          git push origin HEAD:cloud-migration-v3-t7-print-wael-canary-20260913
