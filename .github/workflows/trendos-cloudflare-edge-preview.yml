name: TrendOS Cloudflare Auto Preview

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/**'
      - 'tests/cloudflare_*'
      - '.github/workflows/trendos-cloudflare-edge-preview.yml'
      - 'trendos-edge-read-v1.js'
      - 'config.js'
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: 'Type DEPLOY_EDGE_PREVIEW to deploy the isolated preview Worker. This does not cut over production traffic.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trendos-cloudflare-auto-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-edge-preview:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm_preview == 'DEPLOY_EDGE_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}
      PREVIEW_WORKER_NAME: trendos-edge-gateway-preview
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pre-deploy safety tests
        run: |
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_cloud_write_v1.test.mjs
          node tests/cloudflare_preview_safety_v1.test.mjs

      - name: Verify required deploy secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$EDGE_SESSION_SECRET" || (echo 'Missing TRENDOS_EDGE_SESSION_SECRET_PREVIEW' && exit 1)

      - name: Verify preview workflow is D1 mutation-free
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]+(npx --yes )?wrangler@?.*d1 migrations apply' .github/workflows/trendos-cloudflare-edge-preview.yml; then
            echo 'Preview workflow must not apply D1 migrations.'
            exit 1
          fi
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/preview/wrangler.toml
          if grep -Eq '^migrations_dir[[:space:]]*=' cloudflare-d1/preview/wrangler.toml; then
            echo 'Preview config must not declare migrations_dir.'
            exit 1
          fi
          echo 'PASS: preview workflow has no migration apply step and cloud writes are explicitly OFF.'

      - name: Deploy isolated preview Worker with official Cloudflare action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.33.2'
          workingDirectory: 'cloudflare-d1/preview'
          secrets: |
            EDGE_SESSION_SECRET
        env:
          EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}

      - name: Verify preview health and no cutover marker
        shell: bash
        run: |
          set -euo pipefail
          code=''
          body=''
          for attempt in $(seq 1 10); do
            code="$(curl --silent --show-error --output /tmp/edge-health.json --write-out '%{http_code}' "$PREVIEW_URL/v1/edge/health" || true)"
            body="$(cat /tmp/edge-health.json 2>/dev/null || true)"
            echo "edge-health attempt=$attempt status=$code body=$body"
            if [ "$code" = '200' ]; then break; fi
            sleep 3
          done
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-health.json','utf8')); if(!x.success||!x.database||!x.authConfigured||!x.upstreamConfigured||x.cutover!==false){process.exit(1)}"

      - name: Verify protected route rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/edge-anon.json --write-out '%{http_code}' "$PREVIEW_URL/v1/edge/whoami")"
          cat /tmp/edge-anon.json
          test "$code" = '401'

      - name: Verify cloud write health is read-only and disabled
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/cloud-write.json --write-out '%{http_code}' "$PREVIEW_URL/v1/cloud/write/health")"
          cat /tmp/cloud-write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/cloud-write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.schemaMutationFree!==true||x.cutover!==false||x.sheetsAuthoritative!==true){process.exit(1)}"

      - name: Verify cloud write mutation route is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/cloud-write-blocked.json --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"clientRequestId":"preview-safety-probe","orderId":"PREVIEW-MUST-NOT-WRITE"}' \
            "$PREVIEW_URL/v1/cloud/orders")"
          cat /tmp/cloud-write-blocked.json
          test "$code" = '423'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/cloud-write-blocked.json','utf8')); if(x.success!==false||x.enabled!==false||x.cutover!==false||x.sheetsAuthoritative!==true){process.exit(1)}"

      - name: Preview deployment summary
        run: |
          echo "Preview Worker: $PREVIEW_URL"
          echo "D1 migrations: NOT APPLIED BY PREVIEW WORKFLOW"
          echo "Cloud write lane: EXPLICITLY OFF + READ-ONLY HEALTH + FAIL-CLOSED MUTATION ROUTES VERIFIED"
          echo "Frontend cutover: NOT PERFORMED"
          echo "GitHub Pages/config.js: UNCHANGED"
          echo "Apps Script writes/fallback: UNCHANGED"
