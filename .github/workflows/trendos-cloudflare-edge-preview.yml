name: TrendOS Cloudflare Auto Preview

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/**'
      - 'tests/cloudflare_*'
      - 'tests/d1_orders_live_sync_atomic_v1.test.mjs'
      - '.github/workflows/trendos-cloudflare-edge-preview.yml'
      - 'trendos-edge-read-v1.js'
      - 'config.js'
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: 'Type DEPLOY_EDGE_PREVIEW to deploy the isolated preview Worker. This does not cut over production traffic.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trendos-cloudflare-auto-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-edge-preview:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm_preview == 'DEPLOY_EDGE_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}
      PREVIEW_WORKER_NAME: trendos-edge-gateway-preview
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
      MAX_LIVE_MIRROR_AGE_SECONDS: '180'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pre-deploy safety tests
        run: |
          node tests/cloudflare_edge_gateway_v1.test.mjs
          node tests/cloudflare_edge_freshness_v1.test.mjs
          node tests/cloudflare_cloud_write_v1.test.mjs
          node --experimental-sqlite tests/cloudflare_cloud_write_sqlite_integration_v1.test.mjs
          node --experimental-sqlite tests/cloudflare_normalized_import_v1.test.mjs
          node tests/cloudflare_preview_safety_v1.test.mjs
          node tests/cloudflare_mirror_safety_v1.test.mjs
          node tests/d1_orders_live_sync_atomic_v1.test.mjs

      - name: Verify required deploy secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$EDGE_SESSION_SECRET" || (echo 'Missing TRENDOS_EDGE_SESSION_SECRET_PREVIEW' && exit 1)

      - name: Verify preview workflow is D1 mutation-free
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]+(npx --yes )?wrangler@?.*d1 migrations apply' .github/workflows/trendos-cloudflare-edge-preview.yml; then
            echo 'Preview workflow must not apply D1 migrations.'
            exit 1
          fi
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "false"$' cloudflare-d1/preview/wrangler.toml
          grep -Eq '^EDGE_DATA_MAX_AGE_SECONDS = "180"$' cloudflare-d1/preview/wrangler.toml
          if grep -Eq '^migrations_dir[[:space:]]*=' cloudflare-d1/preview/wrangler.toml; then
            echo 'Preview config must not declare migrations_dir.'
            exit 1
          fi
          echo 'PASS: preview has no migration apply step, Cloud Write is OFF, and Edge freshness limit is explicit.'

      - name: Deploy isolated preview Worker with official Cloudflare action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.33.2'
          workingDirectory: 'cloudflare-d1/preview'
          secrets: |
            EDGE_SESSION_SECRET
        env:
          EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}

      - name: Verify preview health and no cutover marker
        shell: bash
        run: |
          set -euo pipefail
          code=''
          body=''
          for attempt in $(seq 1 10); do
            code="$(curl --silent --show-error --output /tmp/edge-health.json --write-out '%{http_code}' "$PREVIEW_URL/v1/edge/health" || true)"
            body="$(cat /tmp/edge-health.json 2>/dev/null || true)"
            echo "edge-health attempt=$attempt status=$code body=$body"
            if [ "$code" = '200' ]; then break; fi
            sleep 3
          done
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-health.json','utf8')); if(!x.success||!x.database||!x.authConfigured||!x.upstreamConfigured||x.cutover!==false){process.exit(1)}; if(x.dataFreshness) console.log('EDGE_DATA_FRESHNESS=' + JSON.stringify(x.dataFreshness))"

      - name: Verify protected route rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/edge-anon.json --write-out '%{http_code}' "$PREVIEW_URL/v1/edge/whoami")"
          cat /tmp/edge-anon.json
          test "$code" = '401'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-anon.json','utf8')); if(x.success!==false||!String(x.code||'').length){process.exit(1)}"

      - name: Verify signed Preview auth and stale-data fallback contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const secret = String(process.env.EDGE_SESSION_SECRET || '');
          if (!secret) process.exit(1);
          const now = Math.floor(Date.now() / 1000);
          const payload = {
            aud: 'trendos-edge',
            sub: 'ci-preview-auth',
            iat: now,
            exp: now + 300,
            jti: 'ci-' + crypto.randomUUID()
          };
          const payloadPart = Buffer.from(JSON.stringify(payload)).toString('base64url');
          const signingInput = 'v1.' + payloadPart;
          const sig = crypto.createHmac('sha256', secret).update(signingInput).digest('base64url');
          fs.writeFileSync('/tmp/edge-token.txt', signingInput + '.' + sig, { mode: 0o600 });
          console.log('PASS: synthetic short-lived Preview token generated; token value is not logged.');
          NODE

          token="$(cat /tmp/edge-token.txt)"
          who_code="$(curl --silent --show-error --output /tmp/edge-whoami.json --write-out '%{http_code}' \
            -H "authorization: Bearer $token" \
            "$PREVIEW_URL/v1/edge/whoami")"
          test "$who_code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-whoami.json','utf8')); if(!x.success||!x.user||x.user.username!=='ci-preview-auth'){process.exit(1)}; console.log('SIGNED_WHOAMI=PASS')"

          fresh_code="$(curl --silent --show-error --output /tmp/edge-data-freshness.json --write-out '%{http_code}' \
            -H "authorization: Bearer $token" \
            "$PREVIEW_URL/v1/edge/data-freshness")"
          cat /tmp/edge-data-freshness.json

          inbox_code="$(curl --silent --show-error --output /tmp/edge-inbox.json --write-out '%{http_code}' \
            -H "authorization: Bearer $token" \
            "$PREVIEW_URL/v1/edge/customer-manager/inbox?limit=1")"
          unset token
          rm -f /tmp/edge-token.txt

          if [ "$fresh_code" = '200' ]; then
            test "$inbox_code" = '200'
            node -e "const f=JSON.parse(require('fs').readFileSync('/tmp/edge-data-freshness.json','utf8')); const x=JSON.parse(require('fs').readFileSync('/tmp/edge-inbox.json','utf8')); if(!f.success||!f.freshness||f.freshness.fresh!==true||!x.success||x.dataSource!=='d1-edge'||x.edgeSession!=='ci-preview-auth'||!Array.isArray(x.conversations)){process.exit(1)}; console.log('SIGNED_D1_INBOX_READ=PASS count=' + x.conversations.length)"
          elif [ "$fresh_code" = '503' ]; then
            test "$inbox_code" = '503'
            node -e "const f=JSON.parse(require('fs').readFileSync('/tmp/edge-data-freshness.json','utf8')); const x=JSON.parse(require('fs').readFileSync('/tmp/edge-inbox.json','utf8')); if(f.code!=='stale-edge-data'||!f.freshness||f.freshness.fresh!==false||x.code!=='stale-edge-data'||x.fallback!=='apps-script'){process.exit(1)}; console.log('STALE_D1_FAIL_CLOSED=PASS stale=' + JSON.stringify(f.freshness.staleEntities))"
          else
            echo "Unexpected data freshness HTTP=$fresh_code"
            exit 1
          fi
          echo 'PASS: protected Edge reads either serve fresh D1 data or fail closed to Apps Script fallback.'

      - name: Verify Edge session exchange rejects incomplete credentials before upstream
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/edge-session-invalid.json --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "$PREVIEW_URL/v1/edge/session")"
          cat /tmp/edge-session-invalid.json
          test "$code" = '400'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/edge-session-invalid.json','utf8')); if(x.success!==false||!String(x.message||'').includes('username and token')){process.exit(1)}"
          echo 'PASS: missing employee credentials fail before Apps Script verification.'

      - name: Verify cloud write health is read-only and disabled
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/cloud-write.json --write-out '%{http_code}' "$PREVIEW_URL/v1/cloud/write/health")"
          cat /tmp/cloud-write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/cloud-write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.schemaMutationFree!==true||x.cutover!==false||x.sheetsAuthoritative!==true){process.exit(1)}"

      - name: Verify cloud write mutation route is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/cloud-write-blocked.json --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"clientRequestId":"preview-safety-probe","orderId":"PREVIEW-MUST-NOT-WRITE"}' \
            "$PREVIEW_URL/v1/cloud/orders")"
          cat /tmp/cloud-write-blocked.json
          test "$code" = '423'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/cloud-write-blocked.json','utf8')); if(x.success!==false||x.enabled!==false||x.cutover!==false||x.sheetsAuthoritative!==true){process.exit(1)}"

      - name: Verify normalized import is unavailable on Preview
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/normalized-import-blocked.json --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"syncRunId":"preview-must-not-write","syncFinal":true,"sourceRowCounts":{"orders":1},"orders":[{"orderId":"PREVIEW-MUST-NOT-WRITE"}]}' \
            "$PREVIEW_URL/v1/import/batch")"
          cat /tmp/normalized-import-blocked.json
          test "$code" = '401'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/normalized-import-blocked.json','utf8')); if(x.success!==false||x.schemaMutationFree!==true){process.exit(1)}"
          echo 'PASS: Preview has no MIGRATION_SECRET binding; normalized remote import fails before D1 mutation.'

      - name: Verify mirror stats are SELECT-only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/mirror-stats.json --write-out '%{http_code}' "$PREVIEW_URL/v1/mirror/stats")"
          cat /tmp/mirror-stats.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/mirror-stats.json','utf8')); if(!x.success||!x.stats||x.stats.schemaMutationFree!==true){process.exit(1)}; console.log('mirror-snapshot', JSON.stringify(x.stats))"

      - name: Verify atomic mirror capability read-only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/mirror-capabilities.json --write-out '%{http_code}' "$PREVIEW_URL/v1/mirror/capabilities")"
          cat /tmp/mirror-capabilities.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/mirror-capabilities.json','utf8')); if(!x.success||!x.capabilities||x.capabilities.schemaMutationFree!==true||x.capabilities.atomicSupported!==true||!Array.isArray(x.capabilities.missingTables)||x.capabilities.missingTables.length!==0){process.exit(1)}; console.log('ATOMIC_CAPABILITY=' + JSON.stringify(x.capabilities))"

      - name: Verify anonymous mirror import cannot initialize schema
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/mirror-import-blocked.json --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"sheetName":"PREVIEW-MUST-NOT-WRITE","rows":[]}' \
            "$PREVIEW_URL/v1/import/sheet")"
          cat /tmp/mirror-import-blocked.json
          test "$code" = '401'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/mirror-import-blocked.json','utf8')); if(x.success!==false||x.schemaMutationFree!==true){process.exit(1)}"

      - name: Benchmark Preview Edge and mirror reads
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/edge-times.txt
          : > /tmp/mirror-times.txt
          CURL_RETRY=(--fail --silent --show-error --retry 4 --retry-delay 1 --retry-all-errors --connect-timeout 10 --max-time 20)
          for i in $(seq 1 15); do
            curl "${CURL_RETRY[@]}" --output /dev/null --write-out '%{time_total}\n' "$PREVIEW_URL/v1/edge/health" >> /tmp/edge-times.txt
            curl "${CURL_RETRY[@]}" --get --data-urlencode 'name=الأوردرات' --data-urlencode 'limit=1' --output /dev/null --write-out '%{time_total}\n' "$PREVIEW_URL/v1/mirror/sheet" >> /tmp/mirror-times.txt
          done
          node <<'NODE'
          const fs = require('fs');
          function summarize(file) {
            const xs = fs.readFileSync(file, 'utf8').trim().split(/\s+/).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
            if (xs.length !== 15) throw new Error('Expected 15 successful benchmark samples, got ' + xs.length);
            const pick = p => xs[Math.min(xs.length - 1, Math.max(0, Math.ceil(xs.length * p) - 1))];
            const avg = xs.reduce((a,b)=>a+b,0)/xs.length;
            return { samples: xs.length, avgMs: +(avg*1000).toFixed(1), medianMs: +(pick(.5)*1000).toFixed(1), p90Ms: +(pick(.9)*1000).toFixed(1), maxMs: +(xs[xs.length-1]*1000).toFixed(1) };
          }
          console.log('EDGE_BENCHMARK=' + JSON.stringify(summarize('/tmp/edge-times.txt')));
          console.log('D1_MIRROR_ORDERS_BENCHMARK=' + JSON.stringify(summarize('/tmp/mirror-times.txt')));
          NODE

      - name: Gate Orders and Lines mirror freshness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            --data-urlencode 'name=الأوردرات' \
            --data-urlencode 'limit=1' \
            "$PREVIEW_URL/v1/mirror/sheet" > /tmp/orders-mirror.json
          curl --fail --silent --show-error --get \
            --data-urlencode 'name=بنود الأوردرات' \
            --data-urlencode 'limit=1' \
            "$PREVIEW_URL/v1/mirror/sheet" > /tmp/lines-mirror.json
          node <<'NODE'
          const fs = require('fs');
          const maxAge = Number(process.env.MAX_LIVE_MIRROR_AGE_SECONDS || 180);
          function parseSqliteUtc(value) {
            const raw = String(value || '').trim();
            const normalized = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)
              ? raw.replace(' ', 'T') + 'Z'
              : raw;
            const ms = Date.parse(normalized);
            return Number.isFinite(ms) ? ms : 0;
          }
          function inspect(file, label) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!payload.success || !payload.sheet || payload.schemaMutationFree !== true) {
              throw new Error(label + ': invalid mirror response');
            }
            const s = payload.sheet;
            const ageSeconds = parseSqliteUtc(s.syncedAt)
              ? Math.max(0, Math.round((Date.now() - parseSqliteUtc(s.syncedAt)) / 1000))
              : Number.MAX_SAFE_INTEGER;
            const result = {
              sheetName: s.sheetName,
              rowCount: Number(s.rowCount || 0),
              sourceLastRow: Number(s.sourceLastRow || 0),
              sourceLastCol: Number(s.sourceLastCol || 0),
              status: String(s.status || ''),
              syncedAt: String(s.syncedAt || ''),
              ageSeconds,
              note: String(s.note || ''),
              rowParitySelf: Number(s.rowCount || 0) === Number(s.sourceLastRow || 0),
              liveSyncNote: String(s.note || '') === 'TrendOS orders live sync V1',
              fresh: ageSeconds <= maxAge
            };
            console.log(label + '_MIRROR=' + JSON.stringify(result));
            if (result.status !== 'ready' || !result.rowParitySelf || !result.liveSyncNote || !result.fresh) {
              throw new Error(label + ': live mirror freshness gate failed');
            }
          }
          inspect('/tmp/orders-mirror.json', 'ORDERS');
          inspect('/tmp/lines-mirror.json', 'LINES');
          NODE

      - name: Preview deployment summary
        run: |
          echo "Preview Worker: $PREVIEW_URL"
          echo "Edge auth: anonymous 401 + signed whoami PASS required"
          echo "Edge business data: fresh D1 serves; stale D1 returns 503 stale-edge-data for Apps Script fallback"
          echo "D1 migrations: NOT APPLIED BY PREVIEW WORKFLOW"
          echo "Cloud write lane: EXPLICITLY OFF + READ-ONLY HEALTH + FAIL-CLOSED MUTATION ROUTES VERIFIED"
          echo "Cloud write transaction model: isolated SQL success/idempotency/rollback PASS required pre-deploy"
          echo "Normalized live-sync protocol: isolated final-freshness/invalid-row/rollback PASS required; Preview import endpoint must stay unauthorized"
          echo "Mirror reads: SELECT-ONLY; atomic capability REQUIRED; anonymous import rejected before schema initialization"
          echo "Orders + Lines mirror: freshness <= ${MAX_LIVE_MIRROR_AGE_SECONDS}s REQUIRED"
          echo "Preview latency: benchmarked against the actual mirror read path with transient-network retries"
          echo "Frontend cutover: NOT PERFORMED"
          echo "Apps Script writes/fallback: UNCHANGED"
