
name: TrendOS Entry637 Sherif Bounded Bootstrap Window

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry637-sherif-bounded-bootstrap-window.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry637-sherif-bounded-bootstrap-window
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: trendos-d1-api
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      EXPECTED_FRONTEND_VERSION: 697f2afb-87c2-47cc-9889-3e986e7f0863
      DATABASE: trendos-main
      CONFIG: cloudflare-d1/wrangler.toml
      WRANGLER_VERSION: 4.33.2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/v1/employee/auth/health?entry637windowpre=$GITHUB_SHA" -o /tmp/auth-pre.json
          curl --fail --silent --show-error "$API_URL/v1/employee/legacy-action/health?entry637windowpre=$GITHUB_SHA" -o /tmp/bridge-pre.json
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry637windowpre=$GITHUB_SHA" -o /tmp/config-pre.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry637windowpre=$GITHUB_SHA" -o /tmp/dispatcher-pre.js

          node <<'NODE'
          const fs=require('fs');
          const a=require('/tmp/auth-pre.json'),b=require('/tmp/bridge-pre.json');
          if(a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==false||a.legacySessionEnrollEnabled!==false||a.nativeOnly!==true||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5||a.plaintextStored!==false) throw new Error('auth preflight drift');
          if(b.enabled!==false) throw new Error('bridge preflight drift');

          const cfg=fs.readFileSync('/tmp/config-pre.js','utf8');
          for(const s of ["'شريف'","'sherif'","window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;","window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;"]){
            if(!cfg.includes(s)) throw new Error('frontend config missing '+s);
          }
          const dsp=fs.readFileSync('/tmp/dispatcher-pre.js','utf8');
          if(!dsp.includes("['شريف','شريف']")||!dsp.includes("['sherif','شريف']")) throw new Error('Sherif alias mapping missing');

          console.log('ENTRY637_WINDOW_PREFLIGHT=PASS');
          console.log('ENTRY637_START_NATIVE_READY=5');
          NODE

      - name: Open bounded window, wait for Sherif, restore hardening
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker=process.env.WORKER;
          const api=String(process.env.API_URL||'').replace(/\/$/,'');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker;
          const headers={authorization:'Bearer '+token};

          async function cf(path,options={}){
            const r=await fetch(base+path,{...options,headers:{...headers,...(options.headers||{})}});
            const raw=await r.text();
            let body={};try{body=JSON.parse(raw||'{}')}catch{}
            if(!r.ok||body.success!==true) throw new Error('Cloudflare API '+r.status);
            return body;
          }
          function activeVersion(body){
            const deps=(body.result&&body.result.deployments)||body.result||[];
            const cur=Array.isArray(deps)?deps[0]:null;
            const full=(cur&&Array.isArray(cur.versions)?cur.versions:[]).filter(x=>Number(x.percentage||0)===100);
            if(full.length!==1) throw new Error('active deployment shape');
            const id=String(full[0].version_id||full[0].id||'');
            if(!id) throw new Error('active version missing');
            return id;
          }
          async function deployVersion(id){
            await cf('/deployments',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({strategy:'percentage',versions:[{version_id:id,percentage:100}]})
            });
          }
          async function health(){
            const r=await fetch(api+'/v1/employee/auth/health?entry637window='+Date.now(),{headers:{accept:'application/json'},cache:'no-store'});
            const b=await r.json();
            if(!r.ok||b.success!==true) throw new Error('auth health '+r.status);
            return b;
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const preDeploy=await cf('/deployments');
            const preVersion=activeVersion(preDeploy);
            const preSettings=await cf('/settings');
            const preVersionBody=await cf('/versions/'+preVersion);
            const beforeVersions=await cf('/versions?per_page=100');

            const bindings=Array.isArray(preSettings.result&&preSettings.result.bindings)?preSettings.result.bindings:[];
            if(bindings.length!==33) throw new Error('binding count drift');
            const by=new Map(bindings.map(b=>[String(b.name||''),b]));
            const plain=n=>{const b=by.get(n);return b&&b.type==='plain_text'?String(b.text||''):''};
            if(plain('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1')!=='true') throw new Error('nativeOnly precondition');
            if(plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED')!=='false') throw new Error('bootstrap precondition');
            if(plain('TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED')!=='false') throw new Error('session enroll drift');
            if(plain('TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED')!=='false') throw new Error('bridge binding drift');
            if(bindings.filter(b=>String(b.type||'').includes('secret')).length!==5) throw new Error('secret count drift');

            const preEtag=String(preVersionBody.result&&preVersionBody.result.resources&&preVersionBody.result.resources.script&&preVersionBody.result.resources.script.etag||'');
            if(!preEtag) throw new Error('pre etag missing');

            const vr=beforeVersions.result;
            const items=Array.isArray(vr)?vr:(vr&&Array.isArray(vr.items)?vr.items:(vr&&Array.isArray(vr.versions)?vr.versions:[]));
            const beforeIds=new Set(items.map(x=>String(x.id||'')).filter(Boolean));

            let windowActivated=false;
            try{
              const next=bindings.map(b=>{
                if(b.name==='TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1') return {name:b.name,type:'plain_text',text:'false'};
                if(b.name==='TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED') return {name:b.name,type:'plain_text',text:'true'};
                return {name:b.name,type:'inherit',version_id:'latest'};
              });
              const form=new FormData();
              form.append('settings',new Blob([JSON.stringify({
                bindings:next,
                annotations:{'workers/message':'Entry637 bounded Sherif bootstrap window'}
              })],{type:'application/json'}),'settings.json');
              await cf('/settings',{method:'PATCH',body:form});
              windowActivated=true;

              const afterSettings=await cf('/settings');
              const bs=Array.isArray(afterSettings.result&&afterSettings.result.bindings)?afterSettings.result.bindings:[];
              const m=new Map(bs.map(b=>[String(b.name||''),b]));
              if(String(m.get('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1')&&m.get('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1').text||'')!=='false') throw new Error('nativeOnly window not false');
              if(String(m.get('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED')&&m.get('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED').text||'')!=='true') throw new Error('bootstrap window not true');

              let active=activeVersion(await cf('/deployments'));
              if(active===preVersion){
                const afterVersions=await cf('/versions?per_page=100');
                const avr=afterVersions.result;
                const ais=Array.isArray(avr)?avr:(avr&&Array.isArray(avr.items)?avr.items:(avr&&Array.isArray(avr.versions)?avr.versions:[]));
                const fresh=ais.map(x=>String(x.id||'')).filter(id=>id&&!beforeIds.has(id));
                if(fresh.length<1) throw new Error('settings window version missing');
                await deployVersion(fresh[0]);
                active=fresh[0];
              }

              const activeBody=await cf('/versions/'+active);
              const etag=String(activeBody.result&&activeBody.result.resources&&activeBody.result.resources.script&&activeBody.result.resources.script.etag||'');
              if(etag!==preEtag) throw new Error('worker code changed');
              console.log('ENTRY637_WINDOW_OPEN=PASS');
              console.log('ENTRY637_WINDOW_NATIVE_ONLY=false');
              console.log('ENTRY637_WINDOW_BOOTSTRAP=true');
              console.log('ENTRY637_WINDOW_BRIDGE=false');
              console.log('ENTRY637_WINDOW_MAX_SECONDS=600');

              let migrated=false;
              for(let attempt=1;attempt<=60;attempt++){
                const a=await health();
                const users=Number(a.userCount||0),ready=Number(a.nativeReadyCount||0);
                console.log('ENTRY637_WINDOW_POLL='+attempt+' USERS='+users+' READY='+ready);
                if(users===6&&ready===6){
                  migrated=true;
                  console.log('ENTRY637_SHERIF_BOOTSTRAP_OBSERVED=YES');
                  break;
                }
                if(users>6||ready>6) throw new Error('unexpected extra Native user during bounded window');
                await sleep(10000);
              }

              await deployVersion(preVersion);
              windowActivated=false;
              console.log('ENTRY637_WINDOW_CLOSED=PASS');

              let restored=null;
              for(let i=0;i<20;i++){
                restored=await health();
                if(restored.nativeOnly===true&&restored.legacyBootstrapEnabled===false) break;
                await sleep(1000);
              }
              if(!restored||restored.nativeOnly!==true||restored.legacyBootstrapEnabled!==false||restored.legacySessionEnrollEnabled!==false){
                throw new Error('hardening restore failed');
              }
              if(!migrated) throw new Error('Sherif did not login during bounded window');
              if(Number(restored.userCount||0)!==6||Number(restored.nativeReadyCount||0)!==6) throw new Error('post-migration count not 6/6');

              console.log('ENTRY637_HARDENING_RESTORED=PASS');
              console.log('ENTRY637_NATIVE_ONLY=true');
              console.log('ENTRY637_BOOTSTRAP=false');
              console.log('ENTRY637_NATIVE_READY=6_OF_6');
              console.log('ENTRY637_BOUNDED_MIGRATION=PASS');
            }catch(err){
              if(windowActivated){
                try{
                  await deployVersion(preVersion);
                  console.log('ENTRY637_WINDOW_EMERGENCY_CLOSE=PASS');
                }catch(closeErr){
                  console.log('ENTRY637_WINDOW_EMERGENCY_CLOSE=FAILED');
                }
              }
              throw err;
            }
          })().catch(err=>{
            console.error('ENTRY637_BOUNDED_MIGRATION_FAIL '+String(err&&err.message||err));
            process.exit(1);
          });
          NODE

      - name: Verify Sherif D1 row shape after migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT employee_id AS employeeId,
                              username_key AS usernameKey,
                              canonical_username AS canonicalUsername,
                              active,
                              role,
                              department,
                              screens_json AS screensJson,
                              must_change AS mustChange,
                              CASE WHEN password_hash_hex<>'' THEN 1 ELSE 0 END AS hasPasswordHash
                         FROM employee_auth_users_v1
                        WHERE username_key='شريف'
                        LIMIT 1;" > /tmp/sherif.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/sherif.json','utf8'));
          const rows=[];const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'usernameKey'))rows.push(v);Object.values(v).forEach(walk)}};walk(raw);
          if(rows.length!==1) throw new Error('Sherif row missing');
          const r=rows[0];
          if(r.usernameKey!=='شريف'||r.canonicalUsername!=='شريف'||Number(r.active)!==1||Number(r.hasPasswordHash)!==1) throw new Error('Sherif row not Native-ready');
          console.log('ENTRY637_SHERIF_D1_ROW=PASS');
          console.log('ENTRY637_SHERIF_ROLE='+String(r.role||''));
          console.log('ENTRY637_SHERIF_DEPARTMENT='+String(r.department||''));
          console.log('ENTRY637_SHERIF_SCREENS='+String(r.screensJson||''));
          console.log('ENTRY637_SHERIF_PASSWORD_HASH_LOGGED=NO');
          NODE

      - name: Boundary
        run: |
          echo ENTRY637_PRODUCTION_BUSINESS_MUTATION=NO
          echo ENTRY637_ACCOUNTING_TOUCHED=NO
          echo ENTRY637_EASYSTORE_TOUCHED=NO
