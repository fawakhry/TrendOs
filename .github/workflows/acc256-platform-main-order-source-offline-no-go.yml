name: ACC256 original trendos-main order source OFF candidate and HMAC isolation
on:
  pull_request:
    paths:
      - 'cloudflare-d1/easystore-finance-stage/wrangler.trendos-original-order-context-main-candidate-off.toml'
      - 'tests/acc256_platform_original_order_source_config_no_go.test.mjs'
      - '.github/workflows/acc256-platform-main-order-source-offline-no-go.yml'
  push:
    branches:
      - 'integration/trendos-easystore-verified-offline-no-go-20261025'
    paths:
      - 'cloudflare-d1/easystore-finance-stage/wrangler.trendos-original-order-context-main-candidate-off.toml'
      - 'tests/acc256_platform_original_order_source_config_no_go.test.mjs'
      - '.github/workflows/acc256-platform-main-order-source-offline-no-go.yml'
permissions:
  contents: read
jobs:
  offline-platform-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      FINANCE_RELEASE: NO_GO
      FINANCE_WRITES: 'OFF'
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tested signed source/client + OFF-only real platform D1 candidate; ZERO provider access
        shell: bash
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = NO_GO
          test "$FINANCE_WRITES" = OFF
          node --check tests/acc256_platform_original_order_source_config_no_go.test.mjs
          node --test \
            tests/acc252_order_context_pure_contract_no_go.test.mjs \
            tests/acc253_original_t12_private_source_sqlite_no_go.test.mjs \
            tests/acc256_platform_original_order_source_config_no_go.test.mjs
          echo 'ACC256_MAIN_DB_METADATA_CONFIRMED_IN_SEPARATE_READONLY_WORKFLOW=YES'
          echo 'ACC256_CAPTURE_0035_ON_MAIN=NOT_PRESENT_BLOCKS_TRUSTED_CUSTOMER_BINDING'
          echo 'ACC256_PROD_DB_READS_OR_WRITES=ZERO'
          echo 'ACC256_PRIVATE_WORKER_DEPLOY=NO'
          echo 'FINANCE_RELEASE=NO_GO'
