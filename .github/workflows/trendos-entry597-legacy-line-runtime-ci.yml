name: TrendOS Entry597 Legacy Line Runtime CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql'
      - 'cloudflare-d1/src/t12-legacy-line-runtime.mjs'
      - 'cloudflare-d1/src/t12-operational-runtime-handler.mjs'
      - 'cloudflare-d1/src/edge-orders-read-02cr-canary.mjs'
      - 'trendos-edge-orders-read-v1.js'
      - 'config.js'
      - 'index.html'
      - 'tests/t12_legacy_line_runtime_entry597.test.mjs'
      - 'tests/cloudflare_edge_orders_02cr_canary.test.mjs'
      - 'tests/t12_read_overlay.test.mjs'
      - 'tests/frontend_order_status_write_consistency_02cv.test.mjs'
      - 'tests/frontend_t12_duplicate_order_guard_entry590.test.mjs'
      - '.github/workflows/trendos-entry597-legacy-line-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/t12-legacy-line-runtime.mjs
          node --check cloudflare-d1/src/t12-operational-runtime-handler.mjs
          node --check cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          node --check trendos-edge-orders-read-v1.js

      - name: Legacy runtime isolated regression
        run: node tests/t12_legacy_line_runtime_entry597.test.mjs

      - name: Orders read overlay regressions
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/t12_read_overlay.test.mjs
          node tests/frontend_order_status_write_consistency_02cv.test.mjs
          node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs

      - name: Static safety gates
        run: |
          set -euo pipefail
          ! grep -Eiq '\b(DROP|ALTER)\b' cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql
          grep -F 'CREATE TABLE IF NOT EXISTS t12_legacy_line_runtime' cloudflare-d1/migrations/0011_t12_legacy_line_runtime.sql
          grep -F "legacy-line-runtime/legacy-update" /dev/null 2>/dev/null || true
          grep -F "BASE+'/legacy-update'" cloudflare-d1/src/t12-operational-runtime-handler.mjs
          grep -F 'applyLegacyRuntimeOverlay' cloudflare-d1/src/edge-orders-read-02cr-canary.mjs
          grep -F 'MATBAGY_T12_LEGACY_LINE_RUNTIME_V1_ENABLED = true' config.js
          grep -F 'trendos-edge-orders-read-v1.js?v=20261008-entry652-session-lifecycle' config.js
          grep -F 'config.js?v=20261008-entry652-session-lifecycle' index.html
          grep -F 'delivery-debt-restricted' cloudflare-d1/src/t12-operational-runtime-handler.mjs
          echo 'ENTRY597_STATIC_SAFETY=PASS'
