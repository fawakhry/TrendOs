name: TrendOS T11 Service Row Builder Extract

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t11-service-row-builder-extract.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact row builders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Code.gs').read_text(encoding='utf-8')
          def fn(name):
              marker='function '+name+'('
              start=s.find(marker)
              if start < 0:
                  print('FUNCTION_NOT_FOUND='+name)
                  return
              i=start; depth=0; seen=False; q=None; esc=False; line_comment=False; block_comment=False
              while i < len(s):
                  c=s[i]; n=s[i+1] if i+1 < len(s) else ''
                  if line_comment:
                      if c=='\n': line_comment=False
                  elif block_comment:
                      if c=='*' and n=='/': block_comment=False; i+=1
                  elif esc:
                      esc=False
                  elif q:
                      if c=='\\': esc=True
                      elif c==q: q=None
                  else:
                      if c=='/' and n=='/': line_comment=True; i+=1
                      elif c=='/' and n=='*': block_comment=True; i+=1
                      elif c in "'\"`": q=c
                      elif c=='{': depth+=1; seen=True
                      elif c=='}':
                          depth-=1
                          if seen and depth==0:
                              i+=1
                              break
                  i+=1
              print('===BEGIN '+name+'===')
              print(s[start:i])
              print('===END '+name+'===')
          for n in ['getRows_','getRowsPageV1931_']:
              fn(n)
          print('PRODUCTION_MUTATION=NO')
          PY
