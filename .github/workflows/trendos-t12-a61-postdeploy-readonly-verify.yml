name: TrendOS T12 A61 Post-Deploy Read-Only Verification

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-postdeploy-readonly-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      WORKER_NAME: trendos-d1-api
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
      DATABASE: trendos-main
      EXPECTED_TARGET_BUNDLE_SHA256: befde84a727cf7bb0b7f3a8769b7b5aad560d783ab7edf9f783430e84b083494
      EXPECTED_APPS_SCRIPT_API_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      RESULT_FILE: docs/trendos/blackbox/منصة ترند/TRENDOS_T12_A61_POSTDEPLOY_READONLY_VERIFY_RESULT_2026-09-30.txt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live A61 OFF-state read-only
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STATUS="FAILED"
          REASON="UNKNOWN"
          ACTIVE_DEPLOYMENT="NOT_VERIFIED"
          ACTIVE_VERSION="NOT_VERIFIED"
          LIVE_SHA="NOT_VERIFIED"
          SETTINGS="NOT_VERIFIED"
          AUTH="NOT_VERIFIED"
          BRIDGE="NOT_VERIFIED"
          D1_MODE="NOT_VERIFIED"
          CUSTOMER_MODE="NOT_VERIFIED"
          CUSTOMER_COUNT="NOT_VERIFIED"
          ORDER_MODE="NOT_VERIFIED"
          ROUTES="NOT_VERIFIED"

          mkdir -p "$(dirname "$RESULT_FILE")"
          record() {
            {
              echo "POSTDEPLOY_VERIFY_STATUS=$STATUS"
              echo "FAILURE_REASON=$REASON"
              echo "ACTIVE_DEPLOYMENT_ID=$ACTIVE_DEPLOYMENT"
              echo "ACTIVE_VERSION_ID=$ACTIVE_VERSION"
              echo "LIVE_BUNDLE_SHA256=$LIVE_SHA"
              echo "EXPECTED_A61_TARGET_BUNDLE_SHA256=$EXPECTED_TARGET_BUNDLE_SHA256"
              echo "LIVE_EQUALS_A61_TARGET=$([ "$LIVE_SHA" = "$EXPECTED_TARGET_BUNDLE_SHA256" ] && echo YES || echo NO)"
              echo "SETTINGS_OFF_STATE=$SETTINGS"
              echo "AUTH_HEALTH=$AUTH"
              echo "BRIDGE_HEALTH=$BRIDGE"
              echo "D1_AUTH_CONTROL_MODE=$D1_MODE"
              echo "CUSTOMER_MODE=$CUSTOMER_MODE"
              echo "CUSTOMER_COUNT=$CUSTOMER_COUNT"
              echo "ORDER_CREATE_MODE=$ORDER_MODE"
              echo "PROTECTED_ROUTES=$ROUTES"
              echo "TRENDOS_EMPLOYEE_AUTH_V1_ENABLED=false"
              echo "TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED=false"
              echo "TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1=false"
              echo "TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED=false"
              echo "EMPLOYEE_LEGACY_BRIDGE_ACTIONS="
              echo "EMPLOYEE_LEGACY_BRIDGE_SECRET_V1=DEFERRED_NOT_CONFIGURED"
              echo "APPS_SCRIPT_API_URL_UNCHANGED=YES"
              echo "NATIVE_EMPLOYEE_LOGIN=NO"
              echo "D1_MUTATION=NO"
              echo "CLOUDFLARE_MUTATION=NO"
              echo "ORDER_MUTATION=NO"
              echo "CUSTOMER_MUTATION=NO"
              echo "ACCOUNTING_MUTATION=NO"
              echo "SECRET_WRITE=NO"
            } > "$RESULT_FILE"
          }
          fail(){ REASON="$1"; record; exit 1; }

          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || fail "CLOUDFLARE_API_TOKEN_MISSING"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || fail "CLOUDFLARE_ACCOUNT_ID_MISSING"

          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json 2>/tmp/deployments.err || fail "DEPLOYMENTS_LIST_FAILED"
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1)process.exit(2);
          fs.writeFileSync('/tmp/active-deployment.txt',String(d.id));
          fs.writeFileSync('/tmp/active-version.txt',full[0].id);
          NODE
          [ "$?" -eq 0 ] || fail "ACTIVE_VERSION_NOT_SINGLE_100_PERCENT"
          ACTIVE_DEPLOYMENT="$(cat /tmp/active-deployment.txt)"
          ACTIVE_VERSION="$(cat /tmp/active-version.txt)"

          curl --compressed --fail --silent --show-error             -D /tmp/content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/content.body || fail "LIVE_CONTENT_READ_FAILED"

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib
          hs=Path('/tmp/content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'; body=Path('/tmp/content.body').read_bytes(); payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              c=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''; fn=(p.get_filename() or '').lower(); n=(p.get_param('name',header='content-disposition') or '').lower(); t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')): c.append(d)
              if c: payload=max(c,key=len)
          else: payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          Path('/tmp/live.sha').write_text(hashlib.sha256(payload).hexdigest())
          PY
          [ "$?" -eq 0 ] || fail "LIVE_CONTENT_PARSE_FAILED"
          LIVE_SHA="$(cat /tmp/live.sha)"
          [ "$LIVE_SHA" = "$EXPECTED_TARGET_BUNDLE_SHA256" ] || fail "LIVE_NOT_A61_TARGET"

          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"             -o /tmp/settings.json || fail "SETTINGS_READ_FAILED"
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(!x||x.success!==true||!x.result)process.exit(2);
          const b=Array.isArray(x.result.bindings)?x.result.bindings:[];const by=new Map(b.map(v=>[String(v.name||''),v]));
          const val=n=>{const v=by.get(n);return v&&(v.type==='plain_text'||v.type==='json')?String(v.text??v.value??''):'';};
          if(val('TRENDOS_EMPLOYEE_AUTH_V1_ENABLED')!=='false')process.exit(3);
          if(val('TRENDOS_EMPLOYEE_AUTH_LEGACY_BOOTSTRAP_V1_ENABLED')!=='false')process.exit(4);
          if(val('TRENDOS_EMPLOYEE_AUTH_NATIVE_ONLY_V1')!=='false')process.exit(5);
          if(val('TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED')!=='false')process.exit(6);
          if(val('EMPLOYEE_LEGACY_BRIDGE_ACTIONS')!=='')process.exit(7);
          if(by.has('EMPLOYEE_LEGACY_BRIDGE_SECRET_V1'))process.exit(8);
          if(val('APPS_SCRIPT_API_URL')!==process.env.EXPECTED_APPS_SCRIPT_API_URL)process.exit(9);
          const db=by.get('DB');if(!db||db.type!=='d1'||String(db.id||db.database_id||'')!=='5c4b92bf-e043-4f6e-bd6d-d514a92cd825')process.exit(10);
          NODE
          [ "$?" -eq 0 ] || fail "SETTINGS_OFF_STATE_FAILED"
          SETTINGS="PASS"

          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" -o /tmp/auth.json || fail "AUTH_HEALTH_HTTP_FAILED"
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" -o /tmp/bridge.json || fail "BRIDGE_HEALTH_HTTP_FAILED"
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" -o /tmp/customer.json || fail "CUSTOMER_HEALTH_HTTP_FAILED"
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" -o /tmp/order.json || fail "ORDER_HEALTH_HTTP_FAILED"
          curl --fail --silent --show-error "$PROD_URL/v1/edge/health" -o /tmp/edge.json || fail "EDGE_HEALTH_HTTP_FAILED"

          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/auth.json'));const b=JSON.parse(fs.readFileSync('/tmp/bridge.json'));const c=JSON.parse(fs.readFileSync('/tmp/customer.json'));const o=JSON.parse(fs.readFileSync('/tmp/order.json'));const e=JSON.parse(fs.readFileSync('/tmp/edge.json'));
          if(a.success!==true||a.schemaReady!==true||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false||a.plaintextStored!==false)process.exit(2);
          if(b.success!==true||b.enabled!==false||b.upstreamConfigured!==true||b.secretConfigured!==false||Number(b.allowedPolicyCount)!==0||b.rawNativeTokenForwarded!==false||b.plaintextPasswordForwarded!==false)process.exit(3);
          if(c.success!==true||c.schemaReady!==true||c.mode!=='GENERAL')process.exit(4);
          if(o.success!==true||o.schemaReady!==true||o.mode!=='GENERAL')process.exit(5);
          if(e.success!==true)process.exit(6);
          fs.writeFileSync('/tmp/customer-mode.txt',String(c.mode));fs.writeFileSync('/tmp/customer-count.txt',String(c.customerCount??0));fs.writeFileSync('/tmp/order-mode.txt',String(o.mode));
          NODE
          [ "$?" -eq 0 ] || fail "HEALTH_STATE_FAILED"
          AUTH="PASS_OFF"; BRIDGE="PASS_DISABLED"
          CUSTOMER_MODE="$(cat /tmp/customer-mode.txt)"; CUSTOMER_COUNT="$(cat /tmp/customer-count.txt)"; ORDER_MODE="$(cat /tmp/order-mode.txt)"

          orders_code="$(curl --silent --show-error --output /tmp/orders-anon --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1&statusFilter=__ACTIVE__")"
          customer_code="$(curl --silent --show-error --output /tmp/customer-anon --write-out '%{http_code}' "$PROD_URL/v1/edge/customers/search?q=probe")"
          [ "$orders_code" = "401" ] || fail "ORDERS_ROUTE_AUTH_BOUNDARY_REGRESSED"
          [ "$customer_code" = "401" ] || fail "CUSTOMER_ROUTE_AUTH_BOUNDARY_REGRESSED"
          ROUTES="PASS_AUTH_PROTECTED"

          npx --yes wrangler@4.33.2 d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT singleton,marker,mode,policy_epoch FROM employee_auth_control_v1 WHERE singleton=1;"             > /tmp/d1.json 2>/tmp/d1.err || fail "D1_CONTROL_READ_FAILED"
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const f=[];const w=v=>{if(Array.isArray(v))return v.forEach(w);if(v&&typeof v==='object'){if(v.marker==='T12_EMPLOYEE_AUTH_V1')f.push(v);Object.values(v).forEach(w)}};w(x);if(f.length!==1||f[0].mode!=='OFF')process.exit(2);
          NODE
          [ "$?" -eq 0 ] || fail "D1_CONTROL_NOT_OFF"
          D1_MODE="OFF"

          STATUS="SUCCESS"; REASON="NONE"; record

      - name: Persist sanitized verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT_FILE" ]; then
            mkdir -p "$(dirname "$RESULT_FILE")"
            printf '%s\n' 'POSTDEPLOY_VERIFY_STATUS=FAILED' 'FAILURE_REASON=RESULT_FILE_NOT_PRODUCED' 'CLOUDFLARE_MUTATION=NO' > "$RESULT_FILE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_FILE"
          git diff --cached --quiet || git commit -m "docs: record A61 postdeploy read-only verification"
          git push origin HEAD:candidate/t12-full-cloud-cutover-a56-20260929

      - name: Enforce verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'POSTDEPLOY_VERIFY_STATUS=SUCCESS' "$RESULT_FILE"
          grep -Fx 'LIVE_EQUALS_A61_TARGET=YES' "$RESULT_FILE"
          grep -Fx 'AUTH_HEALTH=PASS_OFF' "$RESULT_FILE"
          grep -Fx 'BRIDGE_HEALTH=PASS_DISABLED' "$RESULT_FILE"
          grep -Fx 'D1_AUTH_CONTROL_MODE=OFF' "$RESULT_FILE"
          grep -Fx 'EMPLOYEE_LEGACY_BRIDGE_SECRET_V1=DEFERRED_NOT_CONFIGURED' "$RESULT_FILE"
          echo 'A61_POSTDEPLOY_READONLY_VERIFY=PASS'
