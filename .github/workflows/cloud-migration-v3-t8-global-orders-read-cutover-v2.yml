name: TrendOS T8 Global Orders Read Cutover V2

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t8-global-orders-read-cutover-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendos-t8-global-orders-read-cutover
  cancel-in-progress: false

jobs:
  qualify-and-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PAGES_BASE: https://fawakhry.github.io/TrendOs
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Pre-cutover production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"; test -n "$QUALIFY_PASSWORD"
          curl -fsS "$PROD_URL/v1/edge/health" > /tmp/edge.json
          curl -fsS "$PROD_URL/v1/cloud/write/health" > /tmp/write.json
          node - <<'NODE'
          const fs=require('fs'); const e=JSON.parse(fs.readFileSync('/tmp/edge.json')); const w=JSON.parse(fs.readFileSync('/tmp/write.json'));
          if(!e.success||e.cutover!==false||!e.database||!e.authConfigured||!e.upstreamConfigured)process.exit(1);
          if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true)process.exit(2);
          console.log('T8V2_PRECUTOVER_BOUNDARY=PASS');
          NODE

      - name: Race-tolerant live D1 vs Apps Script parity and latency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim(),key=r=>[text(r&&r.orderId),text(r&&r.lineId),text(r&&r.status)].join('|');
          async function req(url,opt={}){const t=Date.now();const r=await fetch(url,{cache:'no-store',redirect:'follow',...opt});const ms=Date.now()-t;const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms};}
          async function freshPair(){
            for(let attempt=1;attempt<=4;attempt++){
              const login=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});
              if(login.status!==200||login.body.success!==true){console.log('T8V2_LOGIN_ATTEMPT='+attempt+' FAIL');continue;}
              const employeeToken=text(login.body&&login.body.user&&login.body.user.token); if(!employeeToken)continue; console.log('::add-mask::'+employeeToken);
              const sess=await req(base+'/v1/edge/orders/session',{method:'POST',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({username,token:employeeToken})});
              console.log('T8V2_SESSION_ATTEMPT='+attempt+' STATUS='+sess.status+' MS='+sess.ms);
              if(sess.status===200&&sess.body.success===true&&sess.body.edgeToken){console.log('::add-mask::'+text(sess.body.edgeToken));return{employeeToken,session:sess};}
              await new Promise(r=>setTimeout(r,500));
            }
            throw new Error('could not obtain stable fresh qualification session');
          }
          (async()=>{
            const pair=await freshPair(), employeeToken=pair.employeeToken, sess=pair.session, edgeToken=text(sess.body.edgeToken);
            const allowed=Array.isArray(sess.body&&sess.body.user&&sess.body.user.screens)?sess.body.user.screens.map(text).filter(Boolean):[];
            const screens=['service','print','laser','press'].filter(s=>allowed.length===0||allowed.includes(s)); assert.ok(screens.length>0);
            const summary=[];
            for(const screen of screens){
              const q=new URLSearchParams({screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'});
              const edge=await req(base+'/v1/edge/orders/02cr/page?'+q,{headers:{accept:'application/json',authorization:'Bearer '+edgeToken}});
              assert.equal(edge.status,200,screen+' D1 HTTP '+JSON.stringify(edge.body)); assert.equal(edge.body.success,true); assert.equal(edge.body.dataSource,'d1-edge-orders-02cr-operational');
              const app=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username,token:employeeToken,screen,page:'1',pageSize:'100',statusFilter:'__ACTIVE__'})});
              if(app.status===200&&app.body.success!==true&&text(app.body.message).includes('انتهت')) throw new Error('qualification employee token raced after session; retry workflow');
              assert.equal(app.status,200,screen+' Apps HTTP'); assert.equal(app.body.success,true,screen+' Apps success '+JSON.stringify(app.body));
              const ek=(edge.body.rows||[]).map(key).sort(),ak=(app.body.rows||[]).map(key).sort(); assert.deepEqual(ek,ak,screen+' identity parity mismatch');
              for(const name of ['بنود الأوردرات','العملاء','عملاء منع التسليم بالمديونية']){const m=(edge.body.mirrors||[]).find(x=>text(x&&x.sheetName)===name);assert.ok(m);assert.equal(text(m.status),'ready');assert.equal(Number(m.rowCount||0),Number(m.sourceLastRow||0));}
              summary.push({screen,rows:ek.length,d1Ms:edge.ms,appsMs:app.ms});
            }
            console.log('T8V2_LIVE_PARITY=PASS '+JSON.stringify(summary)); console.log('T8V2_SESSION_MS='+sess.ms);
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Promote main from Wael canary to global qualified D1 reads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          echo "T8_PREV_MAIN=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js'); s=p.read_text()
          if 'window.MATBAGY_EDGE_ORDERS_CANARY_ONLY = true;' not in s: raise SystemExit('expected canary flag not found')
          s=s.replace('window.MATBAGY_EDGE_ORDERS_CANARY_ONLY = true;','window.MATBAGY_EDGE_ORDERS_CANARY_ONLY = false;',1)
          if "trendos-edge-orders-read-v1.js?v=20260913-t7-wael1" not in s: raise SystemExit('expected T7 loader missing')
          s=s.replace("trendos-edge-orders-read-v1.js?v=20260913-t7-wael1","trendos-edge-orders-read-v1.js?v=20260913-t8-global1",1)
          p.write_text(s)
          PY
          grep -Fq 'window.MATBAGY_EDGE_ORDERS_READ_V1_ENABLED = true;' config.js
          grep -Fq 'window.MATBAGY_EDGE_ORDERS_CANARY_ONLY = false;' config.js
          grep -Fq 'trendos-edge-orders-read-v1.js?v=20260913-t8-global1' config.js
          grep -Fq "QUALIFIED_PAGE_PATH = '/v1/edge/orders/02cr/page'" trendos-edge-orders-read-v1.js
          grep -Fq "statusFilter) === '__DEBT__'" trendos-edge-orders-read-v1.js
          git config user.name trendos-cloud-migration; git config user.email actions@users.noreply.github.com
          git add config.js; git commit -m 'prod: promote qualified D1 orders reads globally'
          echo "T8_CUTOVER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
          echo 'T8_MAIN_CUTOVER_PUSHED=1' >> "$GITHUB_ENV"

      - name: Wait for published Pages and verify global flag
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do stamp="$(date +%s)-$i"; if curl -fsS "$PAGES_BASE/config.js?t8=$stamp" -o /tmp/live-config.js; then if grep -Fq 'window.MATBAGY_EDGE_ORDERS_CANARY_ONLY = false;' /tmp/live-config.js && grep -Fq 'trendos-edge-orders-read-v1.js?v=20260913-t8-global1' /tmp/live-config.js; then ok=1; break; fi; fi; sleep 5; done
          test "$ok" = 1
          echo 'T8V2_PAGES_GLOBAL_FLAG=PASS'

      - name: Post-cutover production boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PROD_URL/v1/edge/health" > /tmp/post-edge.json
          curl -fsS "$PROD_URL/v1/cloud/write/health" > /tmp/post-write.json
          node - <<'NODE'
          const fs=require('fs');const e=JSON.parse(fs.readFileSync('/tmp/post-edge.json')),w=JSON.parse(fs.readFileSync('/tmp/post-write.json'));
          if(!e.success||e.cutover!==false)process.exit(1); if(!w.success||w.cutover!==false||w.sheetsAuthoritative!==true)process.exit(2); console.log('T8V2_POSTCUTOVER_BOUNDARY=PASS');
          NODE
          code="$(curl -sS -o /tmp/u.json -w '%{http_code}' "$PROD_URL/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=1")"; test "$code" = 401

      - name: Automatic frontend rollback on post-cutover failure
        if: ${{ failure() && env.T8_MAIN_CUTOVER_PUSHED == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git checkout -B main origin/main
          git config user.name trendos-cloud-migration; git config user.email actions@users.noreply.github.com
          git revert --no-edit "$T8_CUTOVER_SHA"; git push origin HEAD:main
          echo 'T8V2_FRONTEND_ROLLBACK=COMMITTED'

      - name: Final T8 conclusion
        if: ${{ success() }}
        run: |
          echo 'T8_GLOBAL_ORDERS_READ_CUTOVER=PASS'
          echo 'D1_READS_GLOBAL=YES'
          echo 'DEBT_FALLBACK_APPS_SCRIPT=YES'
          echo 'EDGE_FAILURE_FALLBACK_APPS_SCRIPT=YES'
          echo 'SHEETS_WRITE_AUTHORITY_CHANGED=NO'
          echo 'TASK_MUTATION=NO'
