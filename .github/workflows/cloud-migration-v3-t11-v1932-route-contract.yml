name: TrendOS T11 V1932 Route Contract
on:
  push:
    branches: [cloud-migration-v3-t6b-auth-shadow-canary-20260913]
    paths: ['.github/workflows/cloud-migration-v3-t11-v1932-route-contract.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V1932 route and matching symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Code.gs').read_text(encoding='utf-8')
          for marker in ['function trendosV1932TryRoute_']:
              start=s.find(marker)
              if start<0: continue
              i=start; depth=0; seen=False; q=None; esc=False
              while i<len(s):
                  c=s[i]
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif q:
                      if c==q: q=None
                  elif c in "'\"`": q=c
                  else:
                      if c=='{': depth+=1; seen=True
                      elif c=='}':
                          depth-=1
                          if seen and depth==0: i+=1; break
                  i+=1
              print(s[start:i])
          print('\n--- MATCHES ---')
          for n,line in enumerate(s.splitlines(),1):
              if 'getRowsPageV1931' in line or ('service' in line.lower() and '1932' in line.lower()):
                  print(f'{n}: {line[:400]}')
          PY
          echo 'PRODUCTION_MUTATION=NO'
