name: T12 D1 Counter Stuck Owner Live Worker/UI Lease Readonly (refresh 2)
on:
  push:
    branches: [candidate/t12-full-cloud-cutover-a56-20260929]
    paths: ['.github/workflows/t12-d1-counter-stuck-owner-live-lease-20261102.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read exact current production UI bytes and Worker traffic leases
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js employee-api-dispatcher-v1.js config.js; do
            curl -fLsS "https://trendos-ui.trendmall-contact.workers.dev/$file?probe=$GITHUB_SHA-$(date +%s%N)" >"/tmp/live-$file"
          done
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          for (const f of ['app.js','employee-api-dispatcher-v1.js','config.js']){
            const live=fs.readFileSync('/tmp/live-'+f),source=fs.readFileSync(f);
            const sha=v=>crypto.createHash('sha256').update(v).digest('hex');
            console.log('LIVE_SOURCE='+JSON.stringify({file:f,match:live.equals(source),
              liveSha:sha(live),sourceSha:sha(source)}));
          }
          const app=fs.readFileSync('/tmp/live-app.js','utf8'),dispatcher=fs.readFileSync('/tmp/live-employee-api-dispatcher-v1.js','utf8');
          console.log('LIVE_ARCHIVE_APP_CHECK='+JSON.stringify({
            autoLoop:app.includes('T12_NATIVE_COMPLETE_ORDERS_AUTO_BATCH_V2'),
            separateRead:app.includes('api("getArchiveEligibilityV1"'),
            clearError:app.includes('تعذر قراءة عداد D1'),
            countReady:app.includes('جاهز للأرشفة على D1'),
            dispatcherRead:dispatcher.includes("'getArchiveEligibilityV1'")
          }));
          NODE
          for worker in trendos-d1-api trendos-ui; do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/deployments" >"/tmp/$worker.json"
            W="$worker" node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/'+process.env.W+'.json','utf8'));
          const d=Array.isArray(x.result)?x.result:x.result?.deployments||[],v=d[0]?.versions||[];
          if(!x.success||v.length!==1||Number(v[0].percentage)!==100)throw Error('Unexpected Worker lease');
          console.log('CURRENT_WORKER='+JSON.stringify({name:process.env.W,version:v[0].version_id}));
          NODE
          done
          curl -fsS 'https://trendos-d1-api.trendmall-contact.workers.dev/v1/employee/core/health?archiveProbe=1' >/tmp/health.json
          node <<'NODE'
          const x=require('/tmp/health.json');
          console.log('CURRENT_CORE='+JSON.stringify({mode:x.mode,schema:x.schemaReady,
            archiveEligibilityVersion:x.archiveEligibilityVersion,archiveProbe:x.archiveProbe}));
          NODE
          echo LIVE_READONLY_LEASE_PROBE=PASS
