name: TrendOS T11 Service Deployed Contract Parity

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - '.github/workflows/cloud-migration-v3-t11-service-deployed-contract-parity.yml'

permissions:
  contents: read

env:
  PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
  APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
  QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
  QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Service deployed contract against D1 Lines mirror
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=await import('node:crypto');
          const apps=process.env.APPS_SCRIPT_URL, base=process.env.PROD_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(), password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          const digits=v=>text(v).replace(/\D/g,'');
          const assert=(c,m)=>{if(!c)throw new Error(m||'assertion failed')};
          const hash=v=>crypto.createHash('sha256').update(String(v)).digest('hex').slice(0,16);
          async function req(url,opt={}){const t=Date.now();const r=await fetch(url,{redirect:'follow',cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b,ms:Date.now()-t};}
          async function authoritative(){for(let n=1;n<=4;n++){const l=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});const token=text(l.body?.user?.token);if(!token)continue;console.log('::add-mask::'+token);const a=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username,token,screen:'service',page:'1',pageSize:'100',statusFilter:'__ACTIVE__'})});if(a.status===200&&a.body?.success===true)return a;await new Promise(r=>setTimeout(r,350));}throw new Error('authoritative Service read unavailable');}
          async function mirror(offset){const r=await req(base+'/v1/mirror/sheet?name='+encodeURIComponent('بنود الأوردرات')+'&limit=500&offset='+offset,{headers:{accept:'application/json'}});assert(r.status===200,'mirror HTTP '+r.status);assert(r.body?.success===true,'mirror success false');return r.body.sheet||{};}
          const [a,m0,m1]=await Promise.all([authoritative(),mirror(0),mirror(500)]);
          const h=Array.isArray(m0.headers)?m0.headers:[], rows=[...(m0.rows||[]),...(m1.rows||[])];
          const hm={};h.forEach((x,i)=>{const k=text(x);if(k)hm[k]=i});
          const idx=(names,fallback)=>{for(const n of names)if(Number.isInteger(hm[n]))return hm[n];return fallback};
          const c={order:idx(['رقم الأوردر'],0),code:idx(['كود الأوردر'],1),phone:idx(['رقم العميل'],16),priority:idx(['الأولوية'],9),status:idx(['الحالة'],10)};
          const hidden=s=>['جاهز للاستلام','تم التسليم','مكرر','تم التنفيذ','جاهز للطباعة','ملغى'].includes(text(s));
          const rank=p=>{p=text(p)||'عادي';return p==='عاجل'||p==='VIP'?0:p==='عادي'?1:p==='مؤجل'?2:9};
          const candidate=[];
          const rawStatus={};
          for(const r of rows){if(Number(r?.rowNumber||0)<=1)continue;const d=Array.isArray(r.display)&&r.display.length?r.display:(r.values||[]);const orderId=text(d[c.order])||text(d[c.code]), lineId=text(d[c.phone]), status=text(d[c.status])||'طلب جديد', priority=text(d[c.priority])||'عادي';if(!orderId&&!lineId)continue;rawStatus[status]=(rawStatus[status]||0)+1;if(hidden(status))continue;candidate.push({orderId,lineId,status,priority});}
          candidate.sort((x,y)=>rank(x.priority)-rank(y.priority)||x.orderId.localeCompare(y.orderId));
          const ar=(a.body?.rows||[]).map(x=>({orderId:text(x?.orderId),lineId:text(x?.lineId),status:text(x?.status)||'طلب جديد',priority:text(x?.priority)||'عادي'}));
          const key=x=>[text(x.orderId),digits(x.lineId),text(x.status),text(x.priority)||'عادي'].join('|');
          const ck=candidate.map(key), ak=ar.map(key);
          const multisetDiff=(left,right)=>{const m=new Map();for(const x of right)m.set(x,(m.get(x)||0)+1);const out=[];for(const x of left){const n=m.get(x)||0;if(n)m.set(x,n-1);else out.push(x);}return out};
          const missing=multisetDiff(ak,ck), extra=multisetDiff(ck,ak);
          const statusCount=list=>list.reduce((o,x)=>{const s=x.split('|')[2]||'';o[s]=(o[s]||0)+1;return o},{});
          const exact=missing.length===0&&extra.length===0&&ck.length===ak.length;
          console.log('T11_SERVICE_DEPLOYED_PARITY='+JSON.stringify({exact,candidateRows:ck.length,appsRows:ak.length,missing:missing.length,extra:extra.length,appsTotal:a.body?.pagination?.totalRows,mirrorSyncedAt:m0.syncedAt,appsMs:a.ms}));
          console.log('T11_SERVICE_MISSING_BY_STATUS='+JSON.stringify(statusCount(missing)));
          console.log('T11_SERVICE_EXTRA_BY_STATUS='+JSON.stringify(statusCount(extra)));
          console.log('T11_SERVICE_RAW_STATUS_COUNTS='+JSON.stringify(rawStatus));
          console.log('T11_SERVICE_HASHES='+JSON.stringify({candidate:hash(ck.join('\n')),apps:hash(ak.join('\n'))}));
          console.log('BUSINESS_VALUES_EXPOSED=NO');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO');
          if(!exact) process.exit(23);
          console.log('T11_SERVICE_DEPLOYED_CONTRACT_PARITY=PASS');
          NODE
