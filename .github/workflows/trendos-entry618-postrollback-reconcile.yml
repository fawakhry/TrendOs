name: TrendOS Entry618 Post-Rollback Read-Only Reconcile

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry618-postrollback-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      API_CONFIG: cloudflare-d1/wrangler.toml
      DATABASE: trendos-main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2
      - name: Reconcile runtime after Entry618 rollback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json > /tmp/api.json
          npx wrangler deployments list --name trendos-ui --json > /tmp/ui.json
          node <<'NODE'
          const fs=require('fs');
          function active(path,label){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const d=ds[0]||{};
            const full=(d.versions||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
            if(full.length!==1) throw new Error(label+'-not-single-100');
            console.log('ENTRY618_RECONCILE_'+label+'_VERSION='+full[0].id);
          }
          active('/tmp/api.json','API');
          active('/tmp/ui.json','FRONTEND');
          NODE

          npx wrangler d1 execute "$DATABASE" --remote --config "$API_CONFIG" --json --command             "SELECT mode,policy_epoch AS policyEpoch FROM employee_ops_control_v1 WHERE singleton=1 AND marker='ENTRY614_EMPLOYEE_OPS_V1';"             > /tmp/ops-control.json

          for f in auth legacy-action ops content comms accounting core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry618reconcile=$GITHUB_SHA" -o "/tmp/$f.json"
          done
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health?entry618reconcile=$GITHUB_SHA" -o /tmp/orders.json
          curl --fail --silent --show-error "$API_URL/v1/t12/customers/write/health?entry618reconcile=$GITHUB_SHA" -o /tmp/customers.json
          curl --fail --silent --show-error "$API_URL/v1/t12/orders/line-runtime/health?entry618reconcile=$GITHUB_SHA" -o /tmp/line.json

          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry618reconcile=$GITHUB_SHA" -o /tmp/config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry618reconcile=$GITHUB_SHA" -o /tmp/dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry618reconcile=$GITHUB_SHA" -o /tmp/edge.js

          node <<'NODE'
          const fs=require('fs');
          const parse=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const raw=parse('/tmp/ops-control.json'), rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.mode&&v.policyEpoch!==undefined)rows.push(v);Object.values(v).forEach(walk)}};
          walk(raw);
          const ctl=rows[0];
          if(!ctl) throw new Error('ops-control-missing');
          const auth=parse('/tmp/auth.json'), bridge=parse('/tmp/legacy-action.json'), ops=parse('/tmp/ops.json');
          if(auth.mode!=='OFF'||auth.envEnabled!==false) throw new Error('auth-drift');
          if(bridge.enabled!==false||bridge.secretConfigured!==false||Number(bridge.allowedPolicyCount||0)!==0) throw new Error('bridge-drift');
          if(ctl.mode!=='READONLY'||ops.mode!=='READONLY') throw new Error('ops-not-readonly-after-rollback');
          if(Number(ctl.policyEpoch)!==Number(ops.policyEpoch)) throw new Error('ops-epoch-health-d1-mismatch');
          for(const f of ['content','comms','accounting','core']){
            const x=parse('/tmp/'+f+'.json');
            if(x.mode!=='OFF') throw new Error(f+'-drift');
          }
          const o=parse('/tmp/orders.json'), c=parse('/tmp/customers.json'), l=parse('/tmp/line.json');
          if(o.mode!=='GENERAL'||o.duplicateGuardReady!==true) throw new Error('orders-drift');
          if(c.mode!=='GENERAL') throw new Error('customers-drift');
          if(l.writeMode!=='cloud-native+legacy-overlay') throw new Error('line-drift');
          const cfg=fs.readFileSync('/tmp/config.js','utf8');
          const disp=fs.readFileSync('/tmp/dispatcher.js','utf8');
          const edge=fs.readFileSync('/tmp/edge.js','utf8');
          if(!cfg.includes("MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE = 'READONLY'")) throw new Error('frontend-not-readonly');
          if(!cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_V1 = false')) throw new Error('frontend-auth-drift');
          if(!cfg.includes('MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false')) throw new Error('frontend-bridge-drift');
          if(cfg.includes('MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1')||disp.includes('canaryRouteEnabled')) throw new Error('entry611-canary-drift');
          if(!edge.includes('postWriteBarrierRecoveries')||!edge.includes('recoverPostWriteBarrier')) throw new Error('refresh-fix-drift');
          console.log('ENTRY618_RECONCILE_OPS_MODE='+ctl.mode);
          console.log('ENTRY618_RECONCILE_OPS_POLICY_EPOCH='+ctl.policyEpoch);
          console.log('ENTRY618_RECONCILE_AUTH=OFF');
          console.log('ENTRY618_RECONCILE_BRIDGE=OFF');
          console.log('ENTRY618_RECONCILE_OTHER_FAMILIES=OFF');
          console.log('ENTRY618_RECONCILE_ORDERS_CUSTOMERS_LINE=PASS');
          console.log('ENTRY618_RECONCILE_FRONTEND=READONLY');
          console.log('ENTRY618_RECONCILE_REFRESH_FIX=PASS');
          console.log('ENTRY618_POSTROLLBACK_RECONCILE=PASS');
          NODE
