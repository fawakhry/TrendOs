name: TrendOS Accounting Persistence Schema Preflight Preview Runtime

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/accounting-native-module.mjs'
      - 'cloudflare-d1/src/accounting-persistence-schema-preflight-v1.mjs'
      - 'tests/cloudflare_accounting_persistence_schema_preflight_runtime_v1.test.mjs'
      - '.github/workflows/trendos-accounting-persistence-schema-preflight-preview-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-accounting-persistence-schema-preflight-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Derive expected Accounting version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('cloudflare-d1/src/accounting-native-module.mjs','utf8');
          const m = src.match(/TRENDOS_ACCOUNTING_NATIVE_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
          if (!m) process.exit(1);
          process.stdout.write(m[1]);
          NODE
          )"
          echo "EXPECTED_ACCOUNTING_NATIVE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for matching isolated Preview Accounting version
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/integration.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/integration" || true)"
            if [ "$code" = 200 ] && EXPECTED_ACCOUNTING_NATIVE_VERSION="$EXPECTED_ACCOUNTING_NATIVE_VERSION" node <<'NODE'
          const fs=require('fs'); let x={}; try{x=JSON.parse(fs.readFileSync('/tmp/integration.json','utf8'))}catch{process.exit(1)}
          process.exit(x.success && x.version===process.env.EXPECTED_ACCOUNTING_NATIVE_VERSION ? 0 : 1)
          NODE
            then matched=true; echo "ACCOUNTING_PREVIEW_VERSION_SYNC=PASS attempt=$attempt"; break; fi
            sleep 4
          done
          test "$matched" = true

      - name: Require live isolated Accounting schema compatibility
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/preflight.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/persistence-schema-preflight")"
          cat /tmp/preflight.json
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          if (x.success !== true) process.exit(1);
          if (x.code !== 'SCHEMA_COMPATIBLE' || x.compatible !== true) process.exit(1);
          if (x.readOnly !== true || x.authoritativeWrites !== false || x.mutationPerformed !== false) process.exit(1);
          if (x.persistence !== 'diagnostic-only') process.exit(1);
          if (!Array.isArray(x.checkedTables)) process.exit(1);
          const required=['accounting_operation_idempotency','accounting_stock_movements'];
          for (const table of required) if (!x.checkedTables.includes(table)) process.exit(1);
          if (!Array.isArray(x.missingTables) || x.missingTables.length !== 0) process.exit(1);
          if (!x.missingColumns || typeof x.missingColumns !== 'object' || Object.keys(x.missingColumns).length !== 0) process.exit(1);
          console.log('ACCOUNTING_SCHEMA_COMPATIBILITY=PASS');
          console.log('ACCOUNTING_SCHEMA_CHECKED_TABLES=' + JSON.stringify(x.checkedTables));
          NODE

      - name: Verify schema preflight is GET only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/preflight-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/persistence-schema-preflight")"
          test "$code" = 405
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/preflight-post.json','utf8'));
          if (x.success !== false || x.authoritativeWrites !== false || x.mutationPerformed !== false || x.persistence !== 'none') process.exit(1);
          console.log('ACCOUNTING_SCHEMA_PREFLIGHT_POST_BLOCK=PASS');
          NODE

      - name: Reconfirm financial authority remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/health")"
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (!x.success || x.authoritativeWrites !== false || x.d1FinancialWrites !== false || x.d1SchemaMutation !== false) process.exit(1);
          if (x.sheetsAuthoritative !== true || x.writeAuthority !== 'google-sheets-apps-script') process.exit(1);
          console.log('ACCOUNTING_AUTHORITY_UNCHANGED=PASS');
          NODE

      - name: Accounting schema compatibility summary
        run: |
          echo 'PASS: Isolated trendos-accounting-preview schema is recognized by the live Preview runtime.'
          echo 'PASS: Required Accounting persistence tables/columns are compatible.'
          echo 'PASS: Schema recognition remained read-only and POST is blocked.'
          echo 'PASS: D1 financial authoritative writes remain disabled; Sheets + Apps Script remain authoritative.'
