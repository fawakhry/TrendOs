name: SERVER-68 Isolated Stage Preflight (No Deploy)
on:
  pull_request:
    paths:
      - cloudflare-d1/wrangler.server68-isolated-stage.toml
      - cloudflare-d1/src/mirror-service-replay-guard-v1.mjs
      - cloudflare-d1/src/mirror-service-read-v1.mjs
      - cloudflare-d1/production-shadow/index.js
      - tests/server68_isolated_stage_preflight.test.mjs
      - tests/server68_secure_mirror_pagination_compat.test.mjs
      - tests/server68_r5_signed_metadata_preflight.test.mjs
      - cloudflare-d1/r5-server68-signed-metadata-preflight.mjs
      - tests/server68_wrangle_local_runtime_smoke.mjs
      - tests/server69_ubuntu_python_to_local_workerd.py
      - tests/server69_release_decision_queue.test.mjs
      - autonomous-printshop/print-server/SERVER69_RELEASE_DECISIONS.json
      - autonomous-printshop/print-server/SERVICE_ORDER_READER_POLICY_V1.json
      - autonomous-printshop/print-server/src/trendosshop_read_once.py
      - autonomous-printshop/print-server/tests/test_server34_trendosshop_read_once.py
      - tests/server33_trendosshop_service_orders_read.test.mjs
      - cloudflare-d1/src/trendosshop-service-orders-read-v1.mjs
      - tests/server67_purpose_scoped_mirror_service_read.test.mjs
      - tests/fixtures/server68_local_mirror_fixture.sql
      - cloudflare-d1/wrangler.server68-local-runtime.toml
      - cloudflare-d1/D1_Orders_Read_Cutover.gs
      - .github/workflows/server68-isolated-stage-preflight.yml
  push:
    branches:
      - release/server68-staging-qualification-20261016

permissions:
  contents: read

jobs:
  offline-isolated-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Explicitly NO env.CLOUDFLARE_API_TOKEN, NO Account ID, NO GitHub Secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging target isolation, source auth and role-limited clients
        run: |
          node --test tests/server68_isolated_stage_preflight.test.mjs \
            tests/server68_r5_signed_metadata_preflight.test.mjs \
            tests/server33_trendosshop_service_orders_read.test.mjs \
            tests/server69_release_decision_queue.test.mjs \
            tests/server68_secure_mirror_pagination_compat.test.mjs \
            tests/server67_purpose_scoped_mirror_service_read.test.mjs \
            tests/server67_apps_script_signed_mirror_client_offline.test.mjs \
            tests/server66_legacy_mirror_read_gate.test.mjs \
            tests/server56_legacy_customer_bridge_compat.test.mjs \
            tests/server30_legacy_sensitive_read_gate.test.mjs
      - name: Verify existing Python Ubuntu one-shot client (FakeOpener, no network)
        run: |
          PYTHONPATH=autonomous-printshop/print-server \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover \
            -s autonomous-printshop/print-server/tests \
            -p 'test_server34_trendosshop_read_once.py' -v
      - name: Validate isolated Worker bundle with Wrangler offline dry-run
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 deploy \
            --config cloudflare-d1/wrangler.server68-isolated-stage.toml \
            --dry-run --outdir /tmp/trendos-server68-offline
          test -d /tmp/trendos-server68-offline
          test -n "$(find /tmp/trendos-server68-offline -maxdepth 1 -type f -name '*.js' -print -quit)"
          echo 'SERVER68_DRY_RUN=PASS; NO_DEPLOY, NO_D1_BINDING, NO_CLOUDFLARE_TOKEN'
      - name: Local Wrangler runtime with synthetic SQLite D1 and durable replay guard
        timeout-minutes: 7
        run: |
          node tests/server68_wrangle_local_runtime_smoke.mjs
