
name: TrendOS Entry635 Native Only Preflight Frontend Controlled

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry635-native-only-preflight-frontend-controlled.yml'

permissions:
  contents: read

concurrency:
  group: trendos-entry635-native-only-preflight-frontend-controlled
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      FRONTEND_CONFIG: cloudflare-d1/wrangler.frontend.toml
      EXPECTED_FRONTEND_VERSION: 9f1ea548-ff16-4360-a16e-fd225e5e112b
      PRE_DISPATCHER_COMMIT: 2dab878100c78b5e1db0e0fa1f157e1cbd44b2ca
      NEW_DISPATCHER_COMMIT: 53743a876a0ec04a22705e9b597db127e12b3480
      LIVE_BASE_COMMIT: 2da755ca910b84911378c018d050cf806d8349d5
      NEW_DISPATCHER_TAG: 20261006-entry635-native-only-ready

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2

      - name: Repo qualification
        run: |
          set -euo pipefail
          node tests/entry635_native_only_bridge_free_preflight.test.mjs
          test "$(git rev-parse "$NEW_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js")" = "$(git rev-parse HEAD:employee-api-dispatcher-v1.js)"
          echo ENTRY635_FRONTEND_REPO_QUALIFICATION=PASS

      - name: Exact live preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-pre.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-pre.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(full.length!==1||full[0].id!==process.env.EXPECTED_FRONTEND_VERSION) throw new Error('frontend version drift');
          fs.writeFileSync('/tmp/pre-ui-version.txt',full[0].id);
          console.log('ENTRY635_FRONTEND_VERSION_LOCK=PASS');
          NODE

          for f in auth legacy-action core content comms ops accounting; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry635frontpre=$GITHUB_SHA" -o "/tmp/$f-pre.json"
          done
          node <<'NODE'
          const fs=require('fs'),r=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'-pre.json','utf8'));
          const a=r('auth'),b=r('legacy-action');
          if(a.mode!=='TRANSITIONAL'||a.envEnabled!==true||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false||Number(a.userCount||0)!==5||Number(a.nativeReadyCount||0)!==5) throw new Error('auth drift');
          if(b.enabled!==false) throw new Error('bridge drift');
          console.log('ENTRY635_FRONTEND_RUNTIME_PREFLIGHT=PASS');
          NODE

          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/?entry635pre=$suffix" -o /tmp/live-index.html
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry635pre=$suffix" -o /tmp/live-config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry635pre=$suffix" -o /tmp/live-dispatcher.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry635pre=$suffix" -o /tmp/live-app.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/trendos-edge-orders-read-v1.js?entry635pre=$suffix" -o /tmp/live-edge.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/attendance-v1.js?entry635pre=$suffix" -o /tmp/live-attendance.js

          git show "$PRE_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" >/tmp/pre-dispatcher.js
          cmp -s /tmp/live-dispatcher.js /tmp/pre-dispatcher.js
          grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/live-config.js
          grep -Fq "window.MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT = 5;" /tmp/live-config.js
          echo ENTRY635_FRONTEND_EXACT_LIVE_BASELINE=PASS

      - name: Build exact-live dispatcher bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/livebase cloudflare-d1/frontend-dist
          git worktree add --detach /tmp/livebase "$LIVE_BASE_COMMIT" >/dev/null
          mkdir -p cloudflare-d1/frontend-dist
          find /tmp/livebase -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -I{} cp "{}" cloudflare-d1/frontend-dist/

          cp /tmp/live-index.html cloudflare-d1/frontend-dist/index.html
          cp /tmp/live-config.js cloudflare-d1/frontend-dist/config.js
          cp /tmp/live-app.js cloudflare-d1/frontend-dist/app.js
          cp /tmp/live-edge.js cloudflare-d1/frontend-dist/trendos-edge-orders-read-v1.js
          cp /tmp/live-attendance.js cloudflare-d1/frontend-dist/attendance-v1.js
          git show "$NEW_DISPATCHER_COMMIT:employee-api-dispatcher-v1.js" > cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js

          export NEW_DISPATCHER="employee-api-dispatcher-v1.js?v=$NEW_DISPATCHER_TAG"
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path('cloudflare-d1/frontend-dist/index.html')
          s=p.read_text()
          pat=r'employee-api-dispatcher-v1[.]js[?]v=[^"]+'
          if len(re.findall(pat,s))!=1: raise SystemExit('dispatcher cache tag count')
          p.write_text(re.sub(pat,os.environ['NEW_DISPATCHER'],s,count=1))
          PY

          node --check cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "T12_ENTRY635_NATIVE_ONLY_BRIDGE_FREE_PREFLIGHT_V1_20261006" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          grep -Fq "native-only-with-bridge" cloudflare-d1/frontend-dist/employee-api-dispatcher-v1.js
          echo ENTRY635_FRONTEND_BUNDLE=PASS

      - name: Deploy with rollback and compatibility smoke
        shell: bash
        run: |
          set -eEuo pipefail
          PRE="$(cat /tmp/pre-ui-version.txt)"
          DEPLOYED=0
          rollback(){
            rc=$?
            trap - ERR
            if [ "$DEPLOYED" = "1" ]; then
              npx wrangler rollback "$PRE" --message "Entry635 frontend compatibility rollback" --config "$FRONTEND_CONFIG" || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx wrangler deploy --config "$FRONTEND_CONFIG" >/tmp/deploy.log
          DEPLOYED=1

          OK=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location "$FRONTEND_URL/?entry635post=$suffix" -o /tmp/post-index.html               && curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry635post=$suffix" -o /tmp/post-config.js               && curl --fail --silent --show-error --location "$FRONTEND_URL/employee-api-dispatcher-v1.js?entry635post=$suffix" -o /tmp/post-dispatcher.js               && grep -Fq "T12_ENTRY635_NATIVE_ONLY_BRIDGE_FREE_PREFLIGHT_V1_20261006" /tmp/post-dispatcher.js               && grep -Fq "window.MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1 = false;" /tmp/post-config.js; then
                OK=1
                echo "ENTRY635_FRONTEND_PROPAGATION_ATTEMPT=$attempt"
                break
            fi
            sleep 2
          done
          test "$OK" = "1"

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('/tmp/post-dispatcher.js','utf8');
          const calls=[]; const realFetch=globalThis.fetch;
          const legacy=async(action,params)=>({success:true,source:'legacy'}); legacy.__trendosEdgeOrdersReadV1=true;
          const windowObject={
            MATBAGY_EMPLOYEE_NATIVE_AUTH_V1:false,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_V1:true,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_USERS:['ضياء','diaa','وائل','wael','جابر','gaber','jaber','رحمه','رحمة','rahma','ريفان','ريڤان','revan','rivan'],
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_MIN_BRIDGE_POLICIES:0,
            MATBAGY_EMPLOYEE_NATIVE_AUTH_CANARY_REQUIRED_READY_COUNT:5,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_V1:false,
            MATBAGY_EMPLOYEE_LEGACY_BRIDGE_POLICIES:[],
            MATBAGY_EMPLOYEE_OPS_CUTOVER_MODE:'GENERAL',
            MATBAGY_EMPLOYEE_ACCOUNTING_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CORE_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_CONTENT_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_COMMS_CUTOVER_MODE:'READONLY',
            MATBAGY_EMPLOYEE_API_URL:process.env.API_URL,
            MATBAGY_EDGE_ORDERS_API_URL:process.env.API_URL,
            trendosSecureApiV1922:legacy
          };
          const tracked=async(url,options={})=>{calls.push(String(url));return realFetch(url,options);};
          const sandbox={window:windowObject,console,URL,Set,Map,JSON,Error,Number,Date,Promise,AbortController,TextEncoder,setTimeout,clearTimeout,setInterval,clearInterval,Response,fetch:tracked};
          vm.runInNewContext(source,sandbox,{filename:'entry635-live-dispatcher.js'});
          (async()=>{
            const out=await windowObject.trendosEmployeeApiV1('login',{username:'diaa',password:String(process.env.QUALIFY_PASSWORD||'')});
            const token=String(out&&out.user&&out.user.token||'').trim();
            if(out.success!==true||out.authSource!=='d1-native-employee-v1'||!token) throw new Error('compat login failed');
            console.log('::add-mask::'+token);
            if(calls.some(u=>u.includes('/v1/employee/legacy-action'))) throw new Error('bridge call');
            console.log('ENTRY635_FRONTEND_COMPAT_NATIVE_LOGIN=PASS');
            console.log('ENTRY635_FRONTEND_COMPAT_BRIDGE_CALLS=0');
            const l=await windowObject.trendosEmployeeApiV1('logout',{username:'diaa',token});
            if(l.success!==true) throw new Error('logout failed');
            console.log('ENTRY635_FRONTEND_COMPAT_LOGOUT=PASS');
          })().catch(e=>{console.error(String(e&&e.message||e));process.exit(31);});
          NODE

          npx wrangler deployments list --name trendos-ui --json >/tmp/ui-post.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/ui-post.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const full=(((ds[0]||{}).versions)||[]).filter(v=>Number(v.percentage||0)===100);
          if(full.length!==1) throw new Error('post version shape');
          console.log('ENTRY635_FRONTEND_VERSION='+String(full[0].version_id||full[0].id||''));
          NODE

          trap - ERR
          echo ENTRY635_FRONTEND_NATIVE_ONLY_COMPAT=PASS
          echo ENTRY635_BACKEND_NATIVE_ONLY=false
          echo ENTRY635_BACKEND_BOOTSTRAP=false
          echo ENTRY635_BACKEND_BRIDGE=false
          echo ENTRY635_API_MUTATION=NO
          echo ENTRY635_D1_BUSINESS_MUTATION=NO
