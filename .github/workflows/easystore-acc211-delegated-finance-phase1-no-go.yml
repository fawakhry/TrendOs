name: ACC211 Owner Delegated Restricted Finance Phase1 Real Worker SQLite NO_GO
on:
  pull_request:
permissions:
  contents: read
jobs:
  phase1-bounded-finance-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real checked-in financial worker — sales and collections only in synthetic SQLite
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FINANCE_RELEASE: 'NO_GO'
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = 'NO_GO'
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --test tests/easystore_acc211_delegated_safe_phase1_scope_real_native_sqlite_no_go.test.mjs
          echo 'ACC211_REAL_WORKER_SOURCE_ONLY=YES'
          echo 'ACC211_AUTHENTIC_STAFF_GRANTS_NOT_PROVIDED=YES'
          echo 'ACC211_PRODUCTION_MONEY_WRITES=ZERO'
          echo 'ACC211_FINANCE_RELEASE=NO_GO'
