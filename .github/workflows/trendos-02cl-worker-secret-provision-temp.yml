name: TrendOS 02CL Worker Secret Provision TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cl-worker-secret-provision-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-02cl-worker-secret-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RECONCILE_SECRET: ${{ secrets.TRENDOS_PROD_RECONCILE_QUALIFY_SECRET }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
      TARGET: CW-PROD-QUAL-33975124471

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard safety gate and secret readiness
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RECONCILE_SECRET"
          test "${#RECONCILE_SECRET}" -ge 32
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' cloudflare-d1/wrangler.toml
          echo '02CL_SECRET_INPUT_READY'

      - name: Read-only pre-provision boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/qualification/cloud-write/reconcile/health" > /tmp/pre.json
          TARGET="$TARGET" node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/pre.json','utf8'));
          const pass=x.success===true&&x.enabled===false&&x.targetOrderId===process.env.TARGET&&Number(x.exactTargetRows||0)===1&&x.outboxStatus==='pending'&&Number(x.attempts||0)===0&&x.productionCutover===false&&x.sheetsAuthoritative===true&&x.genericDrainEnabled===false;
          if(!pass) process.exit(1);
          console.log('02CL_PRE_SECRET_BOUNDARY_PASS secretConfigured='+String(x.reconcileSecretConfigured));
          NODE

      - name: Provision dedicated Worker reconciliation secret only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RECONCILE_SECRET" | npx --yes wrangler@${WRANGLER_VERSION} secret put TRENDOS_PROD_RECONCILE_QUALIFY_SECRET --config cloudflare-d1/wrangler.toml >/tmp/secret-put.log 2>&1
          grep -Eq 'Successfully created secret|Success' /tmp/secret-put.log || cat /tmp/secret-put.log
          echo '02CL_WORKER_RECONCILE_SECRET_PROVISIONED'

      - name: Post-provision Worker must remain OFF and target untouched
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PROD_URL/v1/qualification/cloud-write/reconcile/health" > /tmp/post.json
          TARGET="$TARGET" node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/post.json','utf8'));
          const pass=x.success===true&&x.enabled===false&&x.reconcileSecretConfigured===true&&x.targetOrderId===process.env.TARGET&&Number(x.exactTargetRows||0)===1&&x.outboxStatus==='pending'&&Number(x.attempts||0)===0&&x.productionCutover===false&&x.sheetsAuthoritative===true&&x.genericDrainEnabled===false;
          console.log('02CL_POST_SECRET_HEALTH='+JSON.stringify({enabled:x.enabled,reconcileSecretConfigured:x.reconcileSecretConfigured,exactTargetRows:x.exactTargetRows,outboxStatus:x.outboxStatus,attempts:x.attempts,productionCutover:x.productionCutover,sheetsAuthoritative:x.sheetsAuthoritative,pass}));
          if(!pass) process.exit(1);
          NODE
          code="$(curl --silent --show-error --output /tmp/postfail.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"confirmation":"QUALIFY_PRODUCTION_OUTBOX_TO_SHEETS_33975124471","orderId":"CW-PROD-QUAL-33975124471"}' "$PROD_URL/v1/qualification/cloud-write/reconcile/order")"
          test "$code" = '423'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/postfail.json','utf8')); if(x.success!==false||x.code!=='qualification-disabled'||x.productionCutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
          echo '02CL_WORKER_STILL_FAIL_CLOSED_PASS'

      - name: Reconfirm Apps Script V153 remains OFF
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/^APPS_SCRIPT_API_URL = "\(.*\)"$/\1/p' cloudflare-d1/wrangler.toml | head -n1)"
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/apps.json --write-out '%{http_code}' "${base}?action=cloudWriteReconcileProductionQualificationV1&_probe=post-secret-provision")"
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/apps.json','utf8')); if(x.success!==false||x.code!=='qualification-disabled'||x.persisted!==false||x.sheetsWritten!==false||Number(x.mutationCount||0)!==0||x.productionCutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
          echo '02CL_APPS_SCRIPT_STILL_DEFAULT_OFF_PASS'

      - name: Safety conclusion
        run: |
          echo 'PERF_CF_02CL_DEDICATED_WORKER_SECRET_PROVISION_PASS'
          echo 'Only the dedicated Worker reconciliation secret was provisioned.'
          echo '02CL remains disabled on both Worker and Apps Script. Target remains pending with attempts 0.'
          echo 'No D1 migration, no outbox claim, no Sheet write, no EDGE_SESSION_SECRET rotation, no cutover.'
