name: TrendOS T12 Duplicate Order Guard Production Install

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-duplicate-order-guard-production-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-t12-duplicate-order-guard-production-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: trendos-d1-api
      DATABASE: trendos-main
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      CONFIG: cloudflare-d1/wrangler.toml
      TARGET_MIGRATION: 0010_t12_duplicate_order_guard.sql
      ENTRY504_SOURCE_REF: 76477ccf7160634c75d7c21c8547bdbe4ff29f15
      TARGET_SOURCE_REF: e7c61d1d6b1e5e7e3f5e9fef9d65077086fff534
      EXPECTED_PRE_VERSION: b3deae0e-6503-4dfb-ab27-0344d43ddad5
      EXPECTED_PRE_SHA256: 95eb969e1aaea5ee21ac5a8b7b859c40d5874dbf14ef56644d4dbb44bcf6ca53
      EXPECTED_TARGET_SHA256: 2b78dea01c7e5892460ead4581915da9982208d60a41a95ce903beb742698f67
      WRANGLER_VERSION: 4.33.2

    steps:
      - name: Checkout exact authorized target source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SOURCE_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight exact source and build target before mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -f "$CONFIG"
          test -f "cloudflare-d1/migrations/$TARGET_MIGRATION"

          git diff --name-only "$ENTRY504_SOURCE_REF".."$TARGET_SOURCE_REF" -- cloudflare-d1/ | sort > /tmp/cloud-delta.txt
          cat > /tmp/expected-cloud-delta.txt <<'EOF'
          cloudflare-d1/migrations/0010_t12_duplicate_order_guard.sql
          cloudflare-d1/src/t12-general-create-handler.mjs
          cloudflare-d1/src/t12-general-create.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-cloud-delta.txt
          diff -u /tmp/expected-cloud-delta.txt /tmp/cloud-delta.txt

          node --check cloudflare-d1/src/t12-general-create.mjs
          node --check cloudflare-d1/src/t12-general-create-handler.mjs
          node --experimental-sqlite tests/t12_general_create.test.mjs

          mkdir -p cloudflare-d1/dist
          npx --yes esbuild@0.25.10 cloudflare-d1/production-shadow/index.js             --bundle             --format=esm             --platform=browser             --target=es2022             --outfile=cloudflare-d1/dist/trendos-entry592-duplicate-guard-worker.js

          node --check cloudflare-d1/dist/trendos-entry592-duplicate-guard-worker.js
          actual_target_sha="$(sha256sum cloudflare-d1/dist/trendos-entry592-duplicate-guard-worker.js | awk '{print $1}')"
          test "$actual_target_sha" = "$EXPECTED_TARGET_SHA256"
          echo 'ENTRY592_TARGET_BUILD=PASS'
          echo "TARGET_BUNDLE_SHA256=$actual_target_sha"

      - name: Preflight live API exact version and bundle before mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION deployments list --name "$WORKER_NAME" --json > /tmp/pre-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/pre-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1) throw new Error('active deployment is not exactly one version at 100%');
          if(full[0].id!==process.env.EXPECTED_PRE_VERSION) throw new Error('unexpected active API version');
          fs.writeFileSync('/tmp/pre-deployment-id.txt',String(d.id));
          console.log('PRE_ACTIVE_VERSION='+full[0].id);
          console.log('PRE_ACTIVE_TRAFFIC=100');
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/pre-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/pre-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os
          hs=Path('/tmp/pre-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/pre-content.body').read_bytes()
          payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower()
                  n=(p.get_param('name',header='content-disposition') or '').lower()
                  t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')):
                      cand.append(d)
              if cand: payload=max(cand,key=len)
          else:
              payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          sha=hashlib.sha256(payload).hexdigest()
          if sha!=os.environ['EXPECTED_PRE_SHA256']:
              raise SystemExit('PRE_LIVE_BUNDLE_SHA_MISMATCH')
          print('PRE_LIVE_BUNDLE_SHA256='+sha)
          PY

      - name: Preflight current health, D1 invariants and exact pending migration
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" -o /tmp/pre-order-health.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/pre-order-health.json','utf8'));
          if(x.success!==true||x.schemaReady!==true||x.mode!=='GENERAL'||x.generalCutover!==true) {
            throw new Error('pre order create health mismatch');
          }
          console.log('PRE_ORDER_CREATE_MODE=GENERAL');
          NODE

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type='table' AND name='t12_prod_duplicate_order_guard';"             > /tmp/pre-guard-table.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pre-guard-table.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'present'))rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(rows.length<1||Number(rows[0].present)!==0) throw new Error('guard table already present');
          console.log('PRE_DUPLICATE_GUARD_TABLE_PRESENT=NO');
          NODE

          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/pre-migrations.txt 2>&1
          mapfile -t pending < <(grep -oE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/pre-migrations.txt | sort -u || true)
          test "${#pending[@]}" -eq 1
          test "${pending[0]}" = "$TARGET_MIGRATION"
          echo "PRE_PENDING_MIGRATION=$TARGET_MIGRATION"

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT (SELECT COUNT(*) FROM t12_prod_orders) AS orders_count,(SELECT COUNT(*) FROM t12_prod_lines) AS lines_count,(SELECT COUNT(*) FROM t12_prod_request_ledger) AS ledger_count,(SELECT next_order_number FROM t12_prod_create_control WHERE singleton=1) AS next_order_number,(SELECT mode FROM t12_prod_general_create_control WHERE singleton=1) AS create_mode;"             > /tmp/pre-business.json

          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pre-business.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'orders_count'))rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(rows.length!==1||String(rows[0].create_mode)!=='GENERAL') throw new Error('pre business invariant query failed');
          fs.writeFileSync('/tmp/pre-business-row.json',JSON.stringify(rows[0]));
          console.log('PRE_BUSINESS_INVARIANTS_CAPTURED=YES');
          NODE

      - name: Snapshot bindings and verify deploy will preserve current config
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"             -o /tmp/pre-settings.json

          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          x=json.loads(Path('/tmp/pre-settings.json').read_text())
          if not x or x.get('success') is not True or not x.get('result'):
              raise SystemExit('SETTINGS_READ_INVALID')
          result=x['result']
          bindings=result.get('bindings') or []
          by={str(v.get('name','')):v for v in bindings}
          cfg=tomllib.loads(Path('cloudflare-d1/wrangler.toml').read_text())
          expected_vars=cfg.get('vars') or {}
          for name,val in expected_vars.items():
              b=by.get(name)
              if not b or b.get('type') not in ('plain_text','json'):
                  raise SystemExit('EXPECTED_VAR_MISSING:'+name)
              live=str(b.get('text',b.get('value','')))
              if live!=str(val):
                  raise SystemExit('EXPECTED_VAR_DRIFT:'+name)
          db=by.get('DB')
          if not db or db.get('type')!='d1' or str(db.get('id',db.get('database_id','')))!='5c4b92bf-e043-4f6e-bd6d-d514a92cd825':
              raise SystemExit('D1_BINDING_DRIFT')
          compat=str(result.get('compatibility_date') or '')
          if compat and compat!='2026-08-27':
              raise SystemExit('COMPATIBILITY_DATE_DRIFT')
          normalized=[]
          for b in bindings:
              name=str(b.get('name','')); typ=str(b.get('type',''))
              item={'name':name,'type':typ}
              if typ in ('plain_text','json'):
                  item['value']=str(b.get('text',b.get('value','')))
              elif typ=='d1':
                  item['id']=str(b.get('id',b.get('database_id','')))
              normalized.append(item)
          normalized.sort(key=lambda z:(z['name'],z['type']))
          Path('/tmp/pre-bindings-normalized.json').write_text(json.dumps(normalized,sort_keys=True,separators=(',',':')))
          print('PRE_BINDINGS_AND_VARS_MATCH_CONFIG=YES')
          PY

      - name: Apply only migration 0010
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply "$DATABASE" --remote --config "$CONFIG" | tee /tmp/migration-apply.txt

          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/post-migrations.txt 2>&1
          if grep -qE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/post-migrations.txt; then
            echo 'Unexpected pending migration remains'
            cat /tmp/post-migrations.txt
            exit 1
          fi

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT name FROM sqlite_master WHERE type='table' AND name='t12_prod_duplicate_order_guard'; SELECT COUNT(*) AS guard_rows FROM t12_prod_duplicate_order_guard;"             > /tmp/post-migration-verify.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/post-migration-verify.json','utf8'));
          const names=[];const counts=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(v.name)names.push(String(v.name));if(Object.prototype.hasOwnProperty.call(v,'guard_rows'))counts.push(Number(v.guard_rows));Object.values(v).forEach(walk)}};
          walk(x);
          if(!names.includes('t12_prod_duplicate_order_guard')) throw new Error('guard table missing after migration');
          if(counts.length<1||counts[0]!==0) throw new Error('guard table unexpectedly nonempty after migration');
          console.log('MIGRATION_0010_APPLIED=YES');
          console.log('DUPLICATE_GUARD_TABLE_PRESENT=YES');
          console.log('DUPLICATE_GUARD_INITIAL_ROWS=0');
          NODE

      - name: Build runner-only no-bundle config preserving vars and deploy API only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrangler.toml')
          c=p.read_text()
          c=c.replace('main = "production-shadow/index.js"','main = "dist/trendos-entry592-duplicate-guard-worker.js"')
          c=c.replace('workers_dev = true','workers_dev = true\nkeep_vars = true\nno_bundle = true')
          if 'main = "dist/trendos-entry592-duplicate-guard-worker.js"' not in c: raise SystemExit(2)
          if 'keep_vars = true' not in c or 'no_bundle = true' not in c: raise SystemExit(3)
          Path('wrangler.entry592-prod.toml').write_text(c)
          PY

          npx --yes wrangler@$WRANGLER_VERSION deploy             --config wrangler.entry592-prod.toml             --keep-vars             --no-bundle | tee /tmp/api-deploy.txt
          echo 'ENTRY592_API_DEPLOY_COMMAND=PASS'

      - name: Postflight live version, exact bundle and health
        shell: bash
        run: |
          set -euo pipefail
          sleep 5

          npx --yes wrangler@$WRANGLER_VERSION deployments list --name "$WORKER_NAME" --json > /tmp/post-deployments.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/post-deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{};
          const full=(Array.isArray(d.versions)?d.versions:[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
          if(!d.id||full.length!==1) throw new Error('post active deployment is not exactly one version at 100%');
          if(full[0].id===process.env.EXPECTED_PRE_VERSION) throw new Error('API version did not change');
          fs.writeFileSync('/tmp/post-version-id.txt',full[0].id);
          fs.writeFileSync('/tmp/post-deployment-id.txt',String(d.id));
          console.log('POST_ACTIVE_VERSION='+full[0].id);
          console.log('POST_ACTIVE_TRAFFIC=100');
          NODE

          curl --compressed --fail --silent --show-error             -D /tmp/post-content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/post-content.body

          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os
          hs=Path('/tmp/post-content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'
          body=Path('/tmp/post-content.body').read_bytes()
          payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''
                  fn=(p.get_filename() or '').lower()
                  n=(p.get_param('name',header='content-disposition') or '').lower()
                  t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')):
                      cand.append(d)
              if cand: payload=max(cand,key=len)
          else:
              payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          sha=hashlib.sha256(payload).hexdigest()
          if sha!=os.environ['EXPECTED_TARGET_SHA256']:
              raise SystemExit('POST_LIVE_BUNDLE_SHA_MISMATCH')
          print('POST_LIVE_BUNDLE_SHA256='+sha)
          PY

          curl --fail --silent --show-error "$PROD_URL/health" -o /tmp/post-root-health.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" -o /tmp/post-order-health.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" -o /tmp/post-customer-health.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" -o /tmp/post-auth-health.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" -o /tmp/post-bridge-health.json

          node <<'NODE'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('/tmp/post-root-health.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/post-order-health.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/post-customer-health.json','utf8'));
          const a=JSON.parse(fs.readFileSync('/tmp/post-auth-health.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/post-bridge-health.json','utf8'));
          if(root.success!==true||root.database!==true) throw new Error('root health failed');
          if(o.success!==true||o.schemaReady!==true||o.duplicateGuardReady!==true||o.mode!=='GENERAL'||o.generalCutover!==true) throw new Error('order guard health failed');
          if(c.success!==true||c.schemaReady!==true||c.mode!=='GENERAL') throw new Error('customer health regressed');
          if(a.success!==true||a.schemaReady!==true||a.mode!=='OFF'||a.envEnabled!==false||a.nativeOnly!==false) throw new Error('auth OFF-state regressed');
          if(b.success!==true||b.enabled!==false) throw new Error('bridge OFF-state regressed');
          console.log('POST_ROOT_HEALTH=PASS');
          console.log('POST_ORDER_CREATE_MODE=GENERAL');
          console.log('POST_DUPLICATE_GUARD_READY=YES');
          console.log('POST_CUSTOMER_MODE=GENERAL');
          console.log('POST_EMPLOYEE_AUTH_MODE=OFF');
          console.log('POST_LEGACY_BRIDGE_ENABLED=NO');
          NODE

      - name: Postflight D1 and business invariants unchanged
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 migrations list "$DATABASE" --remote --config "$CONFIG" > /tmp/final-migrations.txt 2>&1
          if grep -qE '[0-9]{4}_[A-Za-z0-9._-]+\.sql' /tmp/final-migrations.txt; then
            echo 'Pending migrations remain after install'
            cat /tmp/final-migrations.txt
            exit 1
          fi

          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE" --remote --config "$CONFIG" --json             --command "SELECT (SELECT COUNT(*) FROM t12_prod_orders) AS orders_count,(SELECT COUNT(*) FROM t12_prod_lines) AS lines_count,(SELECT COUNT(*) FROM t12_prod_request_ledger) AS ledger_count,(SELECT next_order_number FROM t12_prod_create_control WHERE singleton=1) AS next_order_number,(SELECT mode FROM t12_prod_general_create_control WHERE singleton=1) AS create_mode,(SELECT COUNT(*) FROM t12_prod_duplicate_order_guard) AS guard_rows;"             > /tmp/post-business.json

          node <<'NODE'
          const fs=require('fs');
          const pre=JSON.parse(fs.readFileSync('/tmp/pre-business-row.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/post-business.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))return v.forEach(walk);if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'orders_count'))rows.push(v);Object.values(v).forEach(walk)}};
          walk(x);
          if(rows.length!==1) throw new Error('post business invariant row missing');
          const post=rows[0];
          for(const k of ['orders_count','lines_count','ledger_count','next_order_number']) {
            if(Number(post[k])!==Number(pre[k])) throw new Error('business invariant changed:'+k);
          }
          if(String(post.create_mode)!=='GENERAL'||String(pre.create_mode)!=='GENERAL') throw new Error('create mode changed');
          if(Number(post.guard_rows)!==0) throw new Error('guard rows should be zero immediately after install');
          console.log('ORDER_ROWS_MUTATED=NO');
          console.log('LINE_ROWS_MUTATED=NO');
          console.log('REQUEST_LEDGER_MUTATED=NO');
          console.log('NEXT_ORDER_NUMBER_CHANGED=NO');
          console.log('GUARD_ROWS_AFTER_INSTALL=0');
          NODE

      - name: Postflight bindings unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"             -o /tmp/post-settings.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/post-settings.json').read_text())
          if not x or x.get('success') is not True or not x.get('result'):
              raise SystemExit('POST_SETTINGS_READ_INVALID')
          bindings=x['result'].get('bindings') or []
          normalized=[]
          for b in bindings:
              name=str(b.get('name','')); typ=str(b.get('type',''))
              item={'name':name,'type':typ}
              if typ in ('plain_text','json'):
                  item['value']=str(b.get('text',b.get('value','')))
              elif typ=='d1':
                  item['id']=str(b.get('id',b.get('database_id','')))
              normalized.append(item)
          normalized.sort(key=lambda z:(z['name'],z['type']))
          post=json.dumps(normalized,sort_keys=True,separators=(',',':'))
          pre=Path('/tmp/pre-bindings-normalized.json').read_text()
          if post!=pre:
              raise SystemExit('BINDINGS_OR_VARIABLES_CHANGED')
          print('BINDINGS_VARIABLES_SECRET_PRESENCE_UNCHANGED=YES')
          PY

      - name: Final authorized-scope result
        shell: bash
        run: |
          set -euo pipefail
          echo 'ENTRY592_PRODUCTION_INSTALL=PASS'
          echo 'MIGRATION_0010_APPLIED=YES'
          echo 'API_GUARD_DEPLOYED=YES'
          echo "ACTIVE_API_VERSION=$(cat /tmp/post-version-id.txt)"
          echo "ACTIVE_API_DEPLOYMENT=$(cat /tmp/post-deployment-id.txt)"
          echo "ACTIVE_API_BUNDLE_SHA256=$EXPECTED_TARGET_SHA256"
          echo 'ORDER_CREATE_MODE=GENERAL'
          echo 'DUPLICATE_GUARD_READY=YES'
          echo 'ORDER_DATA_MUTATED=NO'
          echo 'ORDER_STATUS_MUTATED=NO'
          echo 'NEXT_ORDER_NUMBER_CHANGED=NO'
