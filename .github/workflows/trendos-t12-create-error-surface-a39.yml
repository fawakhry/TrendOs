name: TrendOS T12 CREATE Error Surface A39

on:
  push:
    branches:
      - diagnostic/t12-create-error-surface-a39-20260928
    paths:
      - '.github/workflows/trendos-t12-create-error-surface-a39.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify exact CREATE error surface
        shell: bash
        run: |
          set -euo pipefail
          node --check trendos-edge-orders-read-v1.js
          node --check config.js
          node tests/t12_create_error_surface.test.mjs
          grep -F "EDGE_ORDERS_T12_CREATE_ERRORS_20260928" trendos-edge-orders-read-v1.js
          grep -F "trendos-edge-orders-read-v1.js?v=20260928-t12-create-errors1" config.js
          echo 'CREATE_ERROR_SURFACE_QUALIFICATION=PASS'
