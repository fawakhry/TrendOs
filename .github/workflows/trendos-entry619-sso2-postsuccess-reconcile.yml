name: TrendOS Entry619 SSO2 Post-Success Reconcile

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry619-sso2-postsuccess-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      FRONTEND_URL: https://trendos-ui.trendmall-contact.workers.dev
      EASYSTORE_URL: https://fawakhry.github.io/EasyStore
      EXPECTED_API_VERSION: de2c825d-ef63-407d-90dc-8059a9d4f192
      EXPECTED_FRONTEND_VERSION: 1f4a4faa-b532-45d5-8ea7-f5f79c8d2ac7
      TAG: entry619-d1-readonly-sso2-20261004

    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.33.2
      - name: Reconcile
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name trendos-d1-api --json >/tmp/api.json
          npx wrangler deployments list --name trendos-ui --json >/tmp/ui.json
          node <<'NODE'
          const fs=require('fs');
          function active(path,label,expected){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            const ds=(Array.isArray(x)?x:(x&&Array.isArray(x.items)?x.items:[])).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
            const full=(((ds[0]||{}).versions)||[]).map(v=>({id:String(v.version_id||v.id||''),p:Number(v.percentage||0)})).filter(v=>v.id&&v.p===100);
            if(full.length!==1||full[0].id!==expected)throw new Error(label+' drift');
            console.log('ENTRY619_SSO2_RECONCILE_'+label+'_VERSION='+full[0].id);
          }
          active('/tmp/api.json','API',process.env.EXPECTED_API_VERSION);
          active('/tmp/ui.json','FRONTEND',process.env.EXPECTED_FRONTEND_VERSION);
          NODE
          for f in auth legacy-action ops accounting content comms core; do
            curl --fail --silent --show-error "$API_URL/v1/employee/$f/health?entry619sso2reconcile=$GITHUB_SHA" -o "/tmp/$f.json"
          done
          suffix="$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location "$FRONTEND_URL/config.js?entry619sso2reconcile=$suffix" -o /tmp/config.js
          curl --fail --silent --show-error --location "$FRONTEND_URL/app.js?entry619sso2reconcile=$suffix" -o /tmp/app.js
          curl --fail --silent --show-error --location "$EASYSTORE_URL/index.html?entry619sso2reconcile=$suffix" -o /tmp/easy-index.html
          curl --fail --silent --show-error --location "$EASYSTORE_URL/app.js?entry619sso2reconcile=$suffix" -o /tmp/easy-app.js
          node <<'NODE'
          const fs=require('fs'),r=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=r('/tmp/accounting.json'),o=r('/tmp/ops.json'),au=r('/tmp/auth.json'),b=r('/tmp/legacy-action.json');
          if(a.mode!=='READONLY'||Number(a.policyEpoch||0)!==2||a.authoritativeWrites!==false)throw new Error('accounting drift');
          if(o.mode!=='GENERAL'||Number(o.policyEpoch||0)!==7)throw new Error('ops drift');
          if(au.mode!=='OFF'||au.envEnabled!==false)throw new Error('auth drift');
          if(b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0)throw new Error('bridge drift');
          for(const f of ['content','comms','core'])if(r('/tmp/'+f+'.json').mode!=='OFF')throw new Error(f+' drift');
          const cfg=fs.readFileSync('/tmp/config.js','utf8'), app=fs.readFileSync('/tmp/app.js','utf8');
          const ei=fs.readFileSync('/tmp/easy-index.html','utf8'), ea=fs.readFileSync('/tmp/easy-app.js','utf8');
          if(!cfg.includes(process.env.TAG)||!app.includes('entry619PostEmployeeSso'))throw new Error('trendos sso2 drift');
          if(!ei.includes(process.env.TAG)||!ea.includes('entry619SchedulePostSsoRead')||!ea.includes('D1 READONLY')||!ea.includes('SSO OK'))throw new Error('easystore sso2 drift');
          console.log('ENTRY619_SSO2_POSTSUCCESS_RECONCILE=PASS');
          console.log('ENTRY619_SSO2_ACCOUNTING=READONLY_EPOCH_2');
          console.log('ENTRY619_SSO2_OPS=GENERAL_EPOCH_7');
          console.log('ENTRY619_SSO2_AUTH_BRIDGE=OFF');
          console.log('ENTRY619_SSO2_EASYSTORE_RUNTIME_BADGE=READY');
          console.log('ENTRY619_SSO2_POST_SSO_READ_RETRY=READY');
          NODE
