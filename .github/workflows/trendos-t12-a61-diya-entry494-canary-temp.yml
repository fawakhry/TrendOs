name: TrendOS T12 A61 Diya Entry494 Canary TEMP

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-diya-entry494-canary-temp.yml'

permissions:
  contents: read

concurrency:
  group: trendos-t12-a61-diya-entry494-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm reviewed canary script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/a61_diya_session_enroll_canary.sh
          grep -F "A61_ENROLLMENT_WINDOW=PASS" scripts/a61_diya_session_enroll_canary.sh >/dev/null
          grep -F "A61_DIYA_SESSION_ENROLL_CANARY=SUCCESS" scripts/a61_diya_session_enroll_canary.sh >/dev/null
          echo "A61_ENTRY494_SCRIPT_REVIEW=PASS"

      - name: Run exactly one guarded Diya canary
        shell: bash
        run: bash scripts/a61_diya_session_enroll_canary.sh
