name: TrendOS T12 Add Order UI Contract A40

on:
  push:
    branches:
      - diagnostic/t12-create-ui-contract-a40-20260928
    paths:
      - '.github/workflows/trendos-t12-create-ui-contract-a40.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify Add Order UI contract alignment
        shell: bash
        run: |
          set -euo pipefail
          node --check trendos-edge-orders-read-v1.js
          node --check config.js
          node tests/t12_create_ui_contract.test.mjs
          grep -F "EDGE_ORDERS_T12_CREATE_UI_CONTRACT_20260928" trendos-edge-orders-read-v1.js
          grep -F "resolveRegisteredCustomerForCloud" trendos-edge-orders-read-v1.js
          grep -F "أوردر جديد - " trendos-edge-orders-read-v1.js
          grep -F "canonical-business-intent-invalid" trendos-edge-orders-read-v1.js
          grep -F "trendos-edge-orders-read-v1.js?v=20260928-t12-create-ui-contract1" config.js
          echo 'ADD_ORDER_UI_CONTRACT_QUALIFICATION=PASS'
