name: TrendOS Entry594 Duplicate Guard Frontend Publish
# Entry594 authorized publish trigger

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-entry594-duplicate-guard-frontend-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-entry594-duplicate-guard-frontend-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: trendos-ui
      EXPECTED_CURRENT_VERSION: b6674156-5f8f-4d57-b94b-e0b5422ae6c1
      QUALIFIED_SOURCE: 6a9cd90649cfa0ac75b25b725d53e9f779bb2c61
      PROD_URL: https://trendos-ui.trendmall-contact.workers.dev
      API_URL: https://trendos-d1-api.trendmall-contact.workers.dev

    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact qualified frontend source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SOURCE }}
          path: qualified-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read-only preflight exact current frontend and live API guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments"             > /tmp/deployments-before.json

          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const list=Array.isArray(body?.result?.deployments)?body.result.deployments:(Array.isArray(body?.result)?body.result:[]);
          if(!list.length) throw new Error('No frontend deployments returned');
          const versions=(Array.isArray(list[0]?.versions)?list[0].versions:[]).map(v=>({
            version_id:String(v?.version_id||v?.id||''),
            percentage:Number(v?.percentage ?? v?.traffic_percentage ?? NaN)
          }));
          if(versions.length!==1||versions[0].version_id!==process.env.EXPECTED_CURRENT_VERSION||versions[0].percentage!==100){
            throw new Error('Frontend active version changed unexpectedly: '+JSON.stringify(versions));
          }
          console.log('ENTRY594_FRONTEND_PRECHECK=PASS');
          console.log('CURRENT_FRONTEND_VERSION='+versions[0].version_id);
          console.log('CURRENT_FRONTEND_TRAFFIC=100');
          NODE

          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health" > /tmp/api-health.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/api-health.json','utf8'));
          if(x.success!==true||x.schemaReady!==true||x.duplicateGuardReady!==true||x.mode!=='GENERAL'){
            throw new Error('API duplicate guard is not ready');
          }
          console.log('API_DUPLICATE_GUARD_READY=YES');
          console.log('ORDER_CREATE_MODE=GENERAL');
          NODE

      - name: Re-run exact frontend qualification
        shell: bash
        run: |
          set -euo pipefail
          cd qualified-source
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SOURCE"
          node --check trendos-edge-orders-read-v1.js
          node tests/frontend_t12_duplicate_order_guard_entry590.test.mjs
          node tests/frontend_orders_initial_edge_ready_entry577.test.mjs
          node tests/frontend_session_and_zero_google_read_entry499.test.mjs
          node tests/frontend_edge_orders_cutover_02ct.test.mjs
          grep -F 'config.js?v=20261001-duplicate-order-guard-ui' index.html
          grep -F 'trendos-edge-orders-read-v1.js?v=20261001-duplicate-order-guard-ui' config.js
          grep -F "reason === 'duplicate-order-window-active'" trendos-edge-orders-read-v1.js
          grep -F 'تم منع إنشاء أوردر مكرر' trendos-edge-orders-read-v1.js
          echo 'ENTRY594_FRONTEND_QUALIFICATION=PASS'

      - name: Build frontend package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/entry594
          mkdir -p dist/entry594/frontend-dist
          for f in qualified-source/*.html qualified-source/*.js qualified-source/*.css; do
            if [ -f "$f" ]; then cp "$f" dist/entry594/frontend-dist/; fi
          done
          cp qualified-source/cloudflare-d1/src/frontend-static-worker.mjs dist/entry594/frontend-static-worker.mjs
          echo 'ENTRY594_FRONTEND_PACKAGE=PASS'

      - name: Create exact frontend version with zero traffic
        shell: bash
        run: |
          set -euo pipefail
          node tools/trendos-entry594-direct-version-upload.mjs dist/entry594 | tee /tmp/version-create.txt
          grep -F 'ENTRY594_VERSION_CREATED=YES' /tmp/version-create.txt
          grep -F 'TRAFFIC_CHANGED=NO' /tmp/version-create.txt
          grep -F 'DEPLOYMENT_CREATED=NO' /tmp/version-create.txt
          version_id="$(grep -E '^VERSION_ID=[0-9a-f-]+$' /tmp/version-create.txt | tail -1 | cut -d= -f2)"
          test -n "$version_id"
          echo "$version_id" > /tmp/target-version-id.txt
          echo "TARGET_VERSION_ID=$version_id"

      - name: Verify target version exists and active version still unchanged
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat /tmp/target-version-id.txt)"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/versions"             > /tmp/versions.json
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments"             > /tmp/deployments-mid.json

          TARGET_VERSION_ID="$target" node <<'NODE'
          const fs=require('fs');
          const versions=JSON.parse(fs.readFileSync('/tmp/versions.json','utf8'));
          const deps=JSON.parse(fs.readFileSync('/tmp/deployments-mid.json','utf8'));
          const target=process.env.TARGET_VERSION_ID;
          const expected=process.env.EXPECTED_CURRENT_VERSION;
          const walk=(v)=>Array.isArray(v)?v.some(walk):(v&&typeof v==='object'?Object.values(v).some(walk):String(v||'')===target);
          if(!walk(versions)) throw new Error('Created target version not found');
          const list=Array.isArray(deps?.result?.deployments)?deps.result.deployments:(Array.isArray(deps?.result)?deps.result:[]);
          if(!list.length) throw new Error('No deployment before promote');
          const current=(list[0].versions||[]).map(v=>({id:String(v?.version_id||v?.id||''),p:Number(v?.percentage ?? v?.traffic_percentage ?? NaN)}));
          if(current.length!==1||current[0].id!==expected||current[0].p!==100){
            throw new Error('Active frontend changed between preflight and promote: '+JSON.stringify(current));
          }
          console.log('ENTRY594_PREPROMOTE_GUARD=PASS');
          NODE

      - name: Promote exact created frontend version to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat /tmp/target-version-id.txt)"
          cat > /tmp/promote.json <<JSON
          {
            "strategy": "percentage",
            "versions": [
              {
                "version_id": "$target",
                "percentage": 100
              }
            ]
          }
          JSON

          code="$(curl --silent --show-error             --output /tmp/promote-response.json             --write-out '%{http_code}'             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/promote.json             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments")"
          test "$code" -ge 200
          test "$code" -lt 300
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/promote-response.json','utf8'));
          if(body.success!==true) throw new Error('Cloudflare promote success=false');
          console.log('ENTRY594_PROMOTE_POST_ACCEPTED=YES');
          if(body?.result?.id) console.log('PROMOTE_DEPLOYMENT_ID='+body.result.id);
          NODE

      - name: Read-only post-promote verification
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          target="$(cat /tmp/target-version-id.txt)"

          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments"             > /tmp/deployments-after.json

          TARGET_VERSION_ID="$target" node <<'NODE'
          const fs=require('fs');
          const deps=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const list=Array.isArray(deps?.result?.deployments)?deps.result.deployments:(Array.isArray(deps?.result)?deps.result:[]);
          if(!list.length) throw new Error('No deployment after promote');
          const active=(list[0].versions||[]).map(v=>({id:String(v?.version_id||v?.id||''),p:Number(v?.percentage ?? v?.traffic_percentage ?? NaN)}));
          if(active.length!==1||active[0].id!==process.env.TARGET_VERSION_ID||active[0].p!==100){
            throw new Error('Promoted target is not sole active version at 100%: '+JSON.stringify(active));
          }
          console.log('ENTRY594_ACTIVE_FRONTEND_VERSION='+active[0].id);
          console.log('ENTRY594_ACTIVE_FRONTEND_TRAFFIC=100');
          NODE

          root_code="$(curl --silent --show-error --output /tmp/root.html --write-out '%{http_code}' "$PROD_URL/?entry594=1")"
          config_code="$(curl --silent --show-error --output /tmp/config.js --write-out '%{http_code}' "$PROD_URL/config.js?v=20261001-duplicate-order-guard-ui")"
          edge_code="$(curl --silent --show-error --output /tmp/edge.js --write-out '%{http_code}' "$PROD_URL/trendos-edge-orders-read-v1.js?v=20261001-duplicate-order-guard-ui")"
          app_code="$(curl --silent --show-error --output /tmp/app.js --write-out '%{http_code}' "$PROD_URL/app.js?v=20261001-initial-edge-ready")"

          test "$root_code" = 200
          test "$config_code" = 200
          test "$edge_code" = 200
          test "$app_code" = 200

          grep -F 'config.js?v=20261001-duplicate-order-guard-ui' /tmp/root.html
          grep -F 'app.js?v=20261001-initial-edge-ready' /tmp/root.html
          grep -F 'trendos-edge-orders-read-v1.js?v=20261001-duplicate-order-guard-ui' /tmp/config.js
          grep -F "reason === 'duplicate-order-window-active'" /tmp/edge.js
          grep -F 'تم منع إنشاء أوردر مكرر' /tmp/edge.js
          grep -F 'recoverPostWriteBarrier' /tmp/edge.js
          grep -F 'postWriteBarrierRecoveries' /tmp/edge.js
          grep -F 'function loadInitialRowsWhenEdgeReady()' /tmp/app.js
          grep -F 'function secureApiChainHasEdgeOrdersRouter(fn)' /tmp/app.js

          curl --fail --silent --show-error "$API_URL/v1/t12/orders/create/health" > /tmp/api-health-post.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/api-health-post.json','utf8'));
          if(x.success!==true||x.duplicateGuardReady!==true||x.mode!=='GENERAL') throw new Error('API guard health regressed');
          console.log('ENTRY594_API_GUARD_STILL_READY=YES');
          NODE

          echo 'ENTRY594_FRONTEND_PUBLISH=PASS'
          echo 'FRONTEND_HTTP_200=YES'
          echo 'DUPLICATE_MESSAGE_PRESENT=YES'
          echo 'EDGE_CACHE_TAG_PRESENT=YES'
          echo 'CONFIG_CACHE_TAG_PRESENT=YES'
          echo 'REFRESH_FIX_MARKERS_PRESERVED=YES'
          echo 'API_WORKER_TOUCHED=NO'
          echo 'D1_TOUCHED=NO'
          echo 'APPS_SCRIPT_TOUCHED=NO'
          echo 'ORDER_DATA_MUTATED=NO'
          echo 'BUSINESS_CREATE_TEST_SENT=NO'
