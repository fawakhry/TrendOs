name: TrendOS T12 A61 Diya Legacy Login Latency TEMP

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-diya-legacy-login-latency-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
      APPS_SCRIPT_API_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm production auth remains OFF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" > /tmp/auth.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false) process.exit(11);
          console.log('A61_PRODUCTION_AUTH_OFF=PASS');
          console.log('CURRENT_NATIVE_READY_COUNT='+Number(a.nativeReadyCount||0));
          NODE

      - name: Measure direct Apps Script login and logout
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QUALIFY_USERNAME:-}"
          test -n "${QUALIFY_PASSWORD:-}"
          node <<'NODE'
          const url=String(process.env.APPS_SCRIPT_API_URL||'');
          const username=String(process.env.QUALIFY_USERNAME||'').trim();
          const password=String(process.env.QUALIFY_PASSWORD||'');
          (async()=>{
            const start=Date.now();
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),60000);
            let r,body={};
            try{
              r=await fetch(url,{
                method:'POST',
                headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},
                body:JSON.stringify({action:'login',username,password,_ts:Date.now()}),
                redirect:'follow',
                signal:controller.signal
              });
              const raw=await r.text();
              try{body=JSON.parse(raw||'{}')}catch{}
            } finally { clearTimeout(timer); }
            const ms=Date.now()-start;
            const success=!!(r&&r.ok&&body&&body.success===true);
            console.log('LEGACY_LOGIN_HTTP_STATUS='+(r?r.status:'NO_RESPONSE'));
            console.log('LEGACY_LOGIN_SUCCESS='+(success?'YES':'NO'));
            console.log('LEGACY_LOGIN_DURATION_MS='+ms);
            console.log('LEGACY_LOGIN_OVER_15S='+(ms>15000?'YES':'NO'));
            console.log('LEGACY_LOGIN_MUST_CHANGE='+(success && body.user && body.user.mustChange===true?'YES':'NO'));
            if(!success) process.exit(21);
            const token=String(body&&body.user&&body.user.token||'').trim();
            const canonical=String(body&&body.user&&(body.user.username||body.user.name)||username).trim();
            if(!token) process.exit(22);
            console.log('::add-mask::'+token);
            const lr=await fetch(url,{
              method:'POST',
              headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},
              body:JSON.stringify({action:'logout',username:canonical,token,_ts:Date.now()}),
              redirect:'follow'
            });
            const lraw=await lr.text(); let lb={}; try{lb=JSON.parse(lraw||'{}')}catch{}
            if(!lr.ok||!lb||lb.success!==true) process.exit(23);
            console.log('LEGACY_TEMP_SESSION_LOGOUT=PASS');
            console.log('CREDENTIAL_VALUES_LOGGED=NO');
          })().catch(err=>{
            console.error('LEGACY_LOGIN_DIAGNOSTIC_ERROR='+String(err&&err.name||'unknown'));
            process.exit(24);
          });
          NODE

      - name: Confirm production auth still OFF
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" > /tmp/auth-final.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/auth-final.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false) process.exit(31);
          console.log('A61_PRODUCTION_AUTH_FINAL_OFF=PASS');
          console.log('FINAL_NATIVE_READY_COUNT='+Number(a.nativeReadyCount||0));
          NODE
