name: TrendOS Entry629 Content Readonly Repo CI

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - 'employee-api-dispatcher-v1.js'
      - 'config.js'
      - 'docs/trendos/staging/ENTRY629_CONTENT_READONLY_BRIDGE_REDUCTION_MANIFEST.json'
      - 'tests/entry629_employee_content_readonly_dispatch.test.mjs'
      - 'cloudflare-d1/src/employee-content-native-v1.mjs'
      - '.github/workflows/trendos-entry629-content-readonly-repo-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/t12-full-cloud-cutover-a56-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Entry629 Content readonly contract
        shell: bash
        run: |
          set -euo pipefail
          node --check employee-api-dispatcher-v1.js
          node --check cloudflare-d1/src/employee-content-native-v1.mjs
          node tests/entry629_employee_content_readonly_dispatch.test.mjs
          node tests/entry614_employee_content_native.test.mjs
          node tests/entry628_employee_core_readonly_dispatch.test.mjs
          echo ENTRY629_REPO_GATE=PASS
      - name: No runtime mutation
        shell: bash
        run: |
          echo ENTRY629_PRODUCTION_MUTATION=NO
          echo ENTRY629_D1_CONTROL_MUTATION=NO
          echo ENTRY629_BRIDGE_POLICY_MUTATION=NO
          echo ENTRY629_ACCOUNTING_TOUCHED=NO
          echo ENTRY629_EASYSTORE_TOUCHED=NO
