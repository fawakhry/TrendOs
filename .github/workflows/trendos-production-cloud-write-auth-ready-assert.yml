name: TrendOS Production Cloud Write Auth Ready Assert

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-production-cloud-write-auth-ready-assert.yml'

permissions:
  contents: read

jobs:
  assert-ready:
    if: ${{ github.event.head_commit.message == 'ASSERT PROD QUALIFY AUTH READY 2026-09-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - name: Assert both qualification secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFY_USERNAME"
          test -n "$QUALIFY_EMPLOYEE_TOKEN"
          echo 'PROD_QUAL_AUTH_READY'
