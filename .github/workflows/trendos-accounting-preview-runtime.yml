name: TrendOS Accounting Preview Runtime

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'cloudflare-d1/src/accounting-preview.mjs'
      - 'cloudflare-d1/src/accounting-native-module.mjs'
      - 'cloudflare-d1/src/accounting-capabilities-v1.mjs'
      - 'cloudflare-d1/src/accounting-contract-v1.mjs'
      - 'cloudflare-d1/src/accounting-foundation-v1.mjs'
      - 'cloudflare-d1/src/accounting-foundation-api-v1.mjs'
      - 'cloudflare-d1/src/accounting-operations-read-v1.mjs'
      - 'cloudflare-d1/src/index_v2.js'
      - 'tests/cloudflare_preview_safety_v1.test.mjs'
      - 'tests/cloudflare_accounting_native_v1.test.mjs'
      - 'tests/cloudflare_accounting_contract_v1.test.mjs'
      - 'tests/cloudflare_accounting_foundation_v1.test.mjs'
      - '.github/workflows/trendos-accounting-preview-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-accounting-preview-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
    steps:
      - name: Checkout expected Accounting source
        uses: actions/checkout@v4

      - name: Derive expected native Accounting version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('cloudflare-d1/src/accounting-native-module.mjs','utf8');
          const m = src.match(/TRENDOS_ACCOUNTING_NATIVE_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
          if (!m) process.exit(1);
          process.stdout.write(m[1]);
          NODE
          )"
          test -n "$version"
          echo "EXPECTED_ACCOUNTING_NATIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Expected native Accounting version: $version"

      - name: Wait for matching isolated Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          matched='false'
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/accounting-deploy-sync.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/integration" || true)"
            if [ "$code" = '200' ]; then
              if EXPECTED_ACCOUNTING_NATIVE_VERSION="$EXPECTED_ACCOUNTING_NATIVE_VERSION" node <<'NODE'
          const fs = require('fs');
          let x = {};
          try { x = JSON.parse(fs.readFileSync('/tmp/accounting-deploy-sync.json','utf8')); } catch (_) { process.exit(1); }
          const expected = process.env.EXPECTED_ACCOUNTING_NATIVE_VERSION;
          if (!x.success || x.version !== expected) process.exit(1);
          if (!Array.isArray(x.foundationEndpoints) || !x.foundationEndpoints.some(v => String(v).includes('/v1/accounting/operations/line'))) process.exit(1);
          process.exit(0);
          NODE
              then
                matched='true'
                echo "ACCOUNTING_PREVIEW_DEPLOYMENT_SYNC=PASS attempt=$attempt version=$EXPECTED_ACCOUNTING_NATIVE_VERSION"
                break
              fi
            fi
            sleep 4
          done
          if [ "$matched" != 'true' ]; then
            echo 'Preview did not converge to the expected Accounting source revision.' >&2
            cat /tmp/accounting-deploy-sync.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify Accounting health authority contract
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-health.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/health")"
          cat /tmp/accounting-health.json
          test "$code" = '200'
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/accounting-health.json', 'utf8'));
          if (!x.success) process.exit(1);
          if (x.version !== 'TRENDOS_ACCOUNTING_PREVIEW_V0_1_20260905') process.exit(1);
          if (x.mode !== 'preview-sandbox' || x.cutover !== false) process.exit(1);
          if (x.authoritativeWrites !== false || x.previewBrowserWrites !== 'localStorage-only') process.exit(1);
          if (x.writeAuthority !== 'google-sheets-apps-script' || x.sheetsAuthoritative !== true) process.exit(1);
          if (x.d1SchemaMutation !== false || x.d1FinancialWrites !== false || x.cloudWriteEnabled !== false) process.exit(1);
          if (!Array.isArray(x.integrationKeys) || !x.integrationKeys.includes('Order ID') || !x.integrationKeys.includes('Line ID')) process.exit(1);
          if (!Array.isArray(x.modules) || !x.modules.includes('sales') || !x.modules.includes('inventory') || !x.modules.includes('bom') || !x.modules.includes('reports')) process.exit(1);
          console.log('ACCOUNTING_HEALTH=PASS');
          NODE

      - name: Verify native TrendOS Accounting integration contract
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-integration.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/integration")"
          cat /tmp/accounting-integration.json
          test "$code" = '200'
          EXPECTED_ACCOUNTING_NATIVE_VERSION="$EXPECTED_ACCOUNTING_NATIVE_VERSION" node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-integration.json','utf8'));
          if (!x.success || x.nativeModule !== true || x.standaloneProduct !== false) process.exit(1);
          if (x.version !== process.env.EXPECTED_ACCOUNTING_NATIVE_VERSION) process.exit(1);
          if (x.platform !== 'TrendOS' || x.module !== 'TrendOS Accounting') process.exit(1);
          if (x.easyStoreRole !== 'historical-working-trendos-accounting-baseline') process.exit(1);
          if (x.authoritativeWrites !== false || x.cutover !== false) process.exit(1);
          if (!x.sharedIdentity || x.sharedIdentity.orderKey !== 'Order ID' || x.sharedIdentity.lineKey !== 'Line ID' || x.sharedIdentity.profitCenterKey !== 'Profit Center ID') process.exit(1);
          if (!Array.isArray(x.operationsToAccounting) || !x.operationsToAccounting.includes('approved selling price / approved line amount')) process.exit(1);
          if (!Array.isArray(x.accountingToOperations) || !x.accountingToOperations.includes('factual line profit')) process.exit(1);
          console.log('ACCOUNTING_TRENDOS_INTEGRATION=PASS');
          NODE

      - name: Verify Accounting V1 contract metadata
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-contract.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/contract")"
          cat /tmp/accounting-contract.json
          test "$code" = '200'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-contract.json','utf8'));
          if (!x.success || x.version !== 'TRENDOS_ACCOUNTING_CONTRACT_V1_20260905') process.exit(1);
          if (x.mode !== 'validation-only' || x.authoritativeWrites !== false || x.persistence !== 'none') process.exit(1);
          for (const e of ['SalesInvoice','SalesInvoiceLine','Payment','Purchase','Expense','Item','BOM','StockMovement','CashTransaction']) {
            if (!x.entityTypes.includes(e)) process.exit(1);
          }
          if (!x.envelope || !x.envelope.required.includes('idempotencyKey')) process.exit(1);
          console.log('ACCOUNTING_CONTRACT_METADATA=PASS');
          NODE

      - name: Verify valid Accounting command validation is zero-write
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/accounting-valid.json <<'JSON'
          {"entityType":"SalesInvoiceLine","operation":"validate-future-line","idempotencyKey":"RUNTIME-VALID-LINE-001","payload":{"invoiceLineId":"INV-RT-L1","invoiceId":"INV-RT","orderId":"ORDER-RT","sourceOrderId":"ORDER-RT","lineId":"LINE-RT","itemId":"ITEM-RT","profitCenterId":"PC-RT","quantity":2,"unitPrice":125,"recognizedUnitCost":60}}
          JSON
          code="$(curl --silent --show-error --output /tmp/accounting-valid-result.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/accounting-valid.json "$PREVIEW_URL/v1/accounting/validate")"
          cat /tmp/accounting-valid-result.json
          test "$code" = '200'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-valid-result.json','utf8'));
          if (!x.success || x.valid !== true || x.nativeModule !== true) process.exit(1);
          if (x.authoritativeWrites !== false || x.persistence !== 'none') process.exit(1);
          if (!x.normalized || x.normalized.payload.orderId !== 'ORDER-RT' || x.normalized.payload.lineId !== 'LINE-RT') process.exit(1);
          console.log('ACCOUNTING_VALIDATE_VALID=PASS');
          NODE

      - name: Verify Line Order mismatch is rejected without persistence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/accounting-mismatch.json <<'JSON'
          {"entityType":"SalesInvoiceLine","operation":"validate-future-line","idempotencyKey":"RUNTIME-MISMATCH-LINE-001","payload":{"invoiceLineId":"INV-MM-L1","invoiceId":"INV-MM","orderId":"ORDER-A","sourceOrderId":"ORDER-B","lineId":"LINE-MM","itemId":"ITEM-MM","quantity":1,"unitPrice":100}}
          JSON
          code="$(curl --silent --show-error --output /tmp/accounting-mismatch-result.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/accounting-mismatch.json "$PREVIEW_URL/v1/accounting/validate")"
          cat /tmp/accounting-mismatch-result.json
          test "$code" = '422'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-mismatch-result.json','utf8'));
          if (x.valid !== false || x.authoritativeWrites !== false || x.persistence !== 'none') process.exit(1);
          if (!Array.isArray(x.errors) || !x.errors.some(e => e.code === 'line-order-mismatch')) process.exit(1);
          console.log('ACCOUNTING_VALIDATE_MISMATCH=PASS');
          NODE

      - name: Verify profit-sharing fields stay outside Accounting
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/accounting-share.json <<'JSON'
          {"entityType":"Expense","operation":"create-expense","idempotencyKey":"RUNTIME-SHARE-FIELD-001","payload":{"expenseId":"EXP-RT","expenseType":"test","amount":10,"currency":"EGP","investorPercentage":20}}
          JSON
          code="$(curl --silent --show-error --output /tmp/accounting-share-result.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/accounting-share.json "$PREVIEW_URL/v1/accounting/validate")"
          test "$code" = '422'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-share-result.json','utf8'));
          if (!x.errors.some(e => e.code === 'profit-sharing-field-forbidden')) process.exit(1);
          if (x.authoritativeWrites !== false || x.persistence !== 'none') process.exit(1);
          console.log('ACCOUNTING_PROFIT_SHARE_BLOCK=PASS');
          NODE

      - name: Verify F1 foundation remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-foundation.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/foundation")"
          cat /tmp/accounting-foundation.json
          test "$code" = '200'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-foundation.json','utf8'));
          if (!x.success || x.authoritativeWrites !== false) process.exit(1);
          if (!x.entityOwners || x.entityOwners.orderId !== 'TrendOS Operations' || x.entityOwners.lineId !== 'TrendOS Operations') process.exit(1);
          if (!x.legacyRoleBridge || x.legacyRoleBridge.mutationPermission !== false) process.exit(1);
          if (!Array.isArray(x.invariants) || !x.invariants.some(v => String(v).includes('No financial write authority'))) process.exit(1);
          console.log('ACCOUNTING_FOUNDATION_READ_ONLY=PASS');
          NODE

      - name: Verify native TrendOS Accounting module shell
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/trendos-accounting.html --write-out '%{http_code}' "$PREVIEW_URL/trendos/accounting")"
          test "$code" = '200'
          grep -Fq 'TrendOS Native Module' /tmp/trendos-accounting.html
          grep -Fq 'EasyStore' /tmp/trendos-accounting.html
          grep -Fq 'Order ID / Line ID' /tmp/trendos-accounting.html
          grep -Fq 'TrendOS Accounting' /tmp/trendos-accounting.html
          grep -Fq 'بدون كتابة على الإنتاج' /tmp/trendos-accounting.html
          echo 'TRENDOS_ACCOUNTING_NATIVE_UI=PASS'

      - name: Verify engineering alias remains available
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting.html --write-out '%{http_code}' "$PREVIEW_URL/accounting")"
          test "$code" = '200'
          grep -Fq 'TrendOS Accounting' /tmp/accounting.html
          grep -Fq 'برنامج الحسابات' /tmp/accounting.html
          grep -Fq 'بدون كتابة على الإنتاج' /tmp/accounting.html
          echo 'ACCOUNTING_ALIAS=PASS'

      - name: Verify unauthenticated Accounting Operations read is blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-line-anon.json --write-out '%{http_code}' "$PREVIEW_URL/v1/accounting/operations/line?orderId=ORDER-RT&lineId=LINE-RT")"
          cat /tmp/accounting-line-anon.json
          test "$code" = '401'
          node <<'NODE'
          const x = JSON.parse(require('fs').readFileSync('/tmp/accounting-line-anon.json','utf8'));
          if (x.success !== false || x.authoritativeWrites !== false) process.exit(1);
          console.log('ACCOUNTING_OPERATIONS_ANON_BLOCK=PASS');
          NODE

      - name: Verify authoritative Accounting POST routes remain blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/accounting-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/health")"
          test "$code" = '405'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/accounting-post.json','utf8')); if(x.success!==false||x.authoritativeWrites!==false||x.sheetsAuthoritative!==true){process.exit(1)}"
          native_code="$(curl --silent --show-error --output /tmp/accounting-native-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/integration")"
          test "$native_code" = '405'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/accounting-native-post.json','utf8')); if(x.success!==false||x.nativeModule!==true||x.authoritativeWrites!==false){process.exit(1)}"
          contract_post="$(curl --silent --show-error --output /tmp/accounting-contract-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/contract")"
          test "$contract_post" = '405'
          foundation_post="$(curl --silent --show-error --output /tmp/accounting-foundation-post.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/v1/accounting/foundation")"
          test "$foundation_post" = '405'
          echo 'ACCOUNTING_AUTHORITATIVE_POST_BLOCK=PASS'

      - name: Accounting Preview runtime summary
        run: |
          echo 'PASS: TrendOS Accounting native shell, V1 validation contract and F1 foundation are live on the isolated Cloudflare Worker.'
          echo 'PASS: Runtime matched the exact source Accounting native version before verification.'
          echo 'PASS: Validation persistence is NONE and financial authoritative writes remain disabled.'
          echo 'PASS: Sheets + Apps Script remain authoritative until a separate approved cutover.'
