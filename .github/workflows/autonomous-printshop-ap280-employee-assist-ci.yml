name: AP-280 Employee Assisted Queue — Hosted Synthetic Qualification

on:
  push:
    branches:
      - feature/ap155-imac-ssh-service-absent-owner-install-20261012
    paths:
      - 'autonomous-printshop/print-server/src/employee_assist.py'
      - 'autonomous-printshop/print-server/src/server.py'
      - 'autonomous-printshop/print-server/public/**'
      - 'autonomous-printshop/print-server/tests/test_ap280_employee_assist_synthetic.py'
      - '.github/workflows/autonomous-printshop-ap280-employee-assist-ci.yml'
  pull_request:
    paths:
      - 'autonomous-printshop/print-server/src/employee_assist.py'
      - 'autonomous-printshop/print-server/src/server.py'
      - 'autonomous-printshop/print-server/public/**'
      - 'autonomous-printshop/print-server/tests/test_ap280_employee_assist_synthetic.py'
      - '.github/workflows/autonomous-printshop-ap280-employee-assist-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-employee-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: autonomous-printshop/print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check user interface JavaScript syntax
        run: node --check public/app.js
      - name: Synthetic queue and all prior operational/security regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_ap280_employee_assist_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap279_bridge_shadow_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap278_path_guard_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap277_write_guard_synthetic.py' -v
          python -B -m unittest discover -s tests -p 'test_ap276_operational_flow_synthetic.py' -v
          echo 'AP280_HOSTED_EMPLOYEE_QUEUE_SYNTHETIC=PASS'
          echo 'AP280_CLOUD_UBUNTU_CUSTOMER_PRINT=OFF'
          echo 'AP280_PRODUCTION_READY=NO'
