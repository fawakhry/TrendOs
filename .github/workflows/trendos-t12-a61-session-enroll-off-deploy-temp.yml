name: TrendOS T12 A61 Session Enrollment OFF Deploy TEMP
on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/trendos-t12-a61-session-enroll-off-deploy-temp.yml'
permissions:
  contents: read
concurrency:
  group: trendos-t12-a61-session-enroll-off-deploy-temp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WORKER_NAME: trendos-d1-api
      WRANGLER_VERSION: 4.33.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight and source qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-d1/src/employee-auth-native-v1.mjs
          node tests/employee_auth_native_a61.test.mjs
          grep -Fx 'TRENDOS_EMPLOYEE_AUTH_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fx 'TRENDOS_EMPLOYEE_AUTH_LEGACY_SESSION_ENROLL_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          grep -Fx 'EMPLOYEE_AUTH_ENROLL_CANARY_USER = ""' cloudflare-d1/wrangler.toml
          grep -Fx 'EMPLOYEE_AUTH_ENROLL_NONCE = ""' cloudflare-d1/wrangler.toml
          grep -Fx 'TRENDOS_EMPLOYEE_LEGACY_BRIDGE_V1_ENABLED = "false"' cloudflare-d1/wrangler.toml
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" > /tmp/a.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" > /tmp/b.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/a.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/b.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false||Number(a.userCount||0)!==0||Number(a.nativeReadyCount||0)!==0) process.exit(11);
          if(!b.success||b.enabled!==false||b.secretConfigured!==false) process.exit(12);
          console.log('A61_ENROLL_OFF_DEPLOY_PREFLIGHT=PASS');
          NODE
      - name: Build runner-only keep-vars config
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          node <<'NODE'
          const fs=require('fs');
          let c=fs.readFileSync('wrangler.toml','utf8');
          c=c.replace('workers_dev = true','workers_dev = true\nkeep_vars = true');
          fs.writeFileSync('wrangler.a61-enroll-off.toml',c);
          NODE
      - name: Deploy enrollment source default-OFF
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-d1
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.a61-enroll-off.toml | tee /tmp/deploy.txt
          echo 'A61_ENROLLMENT_SOURCE_OFF_DEPLOY=PASS'
      - name: Verify OFF state and hash
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl --fail --silent --show-error "$PROD_URL/v1/employee/auth/health" > /tmp/a.json
          curl --fail --silent --show-error "$PROD_URL/v1/employee/legacy-action/health" > /tmp/b.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/customers/write/health" > /tmp/c.json
          curl --fail --silent --show-error "$PROD_URL/v1/t12/orders/create/health" > /tmp/o.json
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/a.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/b.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/c.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/o.json','utf8'));
          if(!a.success||a.mode!=='OFF'||a.envEnabled!==false||a.legacyBootstrapEnabled!==false||a.nativeOnly!==false||Number(a.nativeReadyCount||0)!==0) process.exit(21);
          if(!b.success||b.enabled!==false||b.secretConfigured!==false||Number(b.allowedPolicyCount||0)!==0) process.exit(22);
          if(!c.success||String(c.mode||'').toUpperCase()!=='GENERAL'||Number(c.customerCount||0)<247) process.exit(23);
          if(!o.success||String(o.mode||'').toUpperCase()!=='GENERAL') process.exit(24);
          console.log('A61_ENROLLMENT_SOURCE_OFF_POSTDEPLOY=PASS');
          console.log('AUTH_MODE=OFF');
          console.log('NATIVE_READY_COUNT=0');
          NODE
          curl --compressed --fail --silent --show-error             -D /tmp/content.headers             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2"             -o /tmp/content.body
          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib
          hs=Path('/tmp/content.headers').read_text(errors='ignore').splitlines()
          cts=[x.split(':',1)[1].strip() for x in hs if x.lower().startswith('content-type:')]
          ct=cts[-1] if cts else 'application/javascript'; body=Path('/tmp/content.body').read_bytes(); payload=None
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              cand=[]
              for p in msg.iter_parts():
                  d=p.get_payload(decode=True) or b''; fn=(p.get_filename() or '').lower(); n=(p.get_param('name',header='content-disposition') or '').lower(); t=p.get_content_type().lower()
                  if 'javascript' in t or fn.endswith(('.js','.mjs')) or n.endswith(('.js','.mjs')): cand.append(d)
              if cand: payload=max(cand,key=len)
          else: payload=body
          if not payload: raise SystemExit(2)
          payload=payload.replace(b'\r\n',b'\n').rstrip()+b'\n'
          print('A61_ENROLLMENT_LIVE_SHA256='+hashlib.sha256(payload).hexdigest())
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f cloudflare-d1/wrangler.a61-enroll-off.toml
