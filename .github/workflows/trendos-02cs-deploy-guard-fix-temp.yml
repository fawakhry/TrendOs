name: TrendOS 02CS Deploy Guard Fix TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths:
      - '.github/workflows/trendos-02cs-deploy-guard-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/go-live-2026-09-01-integrity
      - name: Accept absent-or-false D1 frontend flag on main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/trendos-02cs-exact-version-production-deploy-temp.yml')
          s=p.read_text(encoding='utf-8')
          old="          git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*false'"
          new="          if git show origin/main:config.js | grep -Eq 'MATBAGY_EDGE_ORDERS_READ_V1_ENABLED[[:space:]]*=[[:space:]]*true'; then echo 'Production frontend D1 flag must remain OFF'; exit 1; fi"
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 main flag guards, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/trendos-02cs-exact-version-production-deploy-temp.yml
      - name: Commit corrected guard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trendos-02cs-exact-version-production-deploy-temp.yml
          git commit -m 'fix: accept default-off main frontend flag in 02CS deploy gate'
          git push origin HEAD:agent/go-live-2026-09-01-integrity
