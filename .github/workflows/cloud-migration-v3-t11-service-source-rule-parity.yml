name: TrendOS T11 Service Source Rule Parity

on:
  push:
    branches:
      - cloud-migration-v3-t6b-auth-shadow-canary-20260913
    paths:
      - .github/workflows/cloud-migration-v3-t11-service-source-rule-parity.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_PASSWORD: ${{ secrets.TRENDOS_PROD_QUALIFY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source rule matches authoritative Service membership
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL,apps=process.env.APPS_SCRIPT_URL;
          const username=String(process.env.QUALIFY_USERNAME||'').trim(),password=String(process.env.QUALIFY_PASSWORD||'');
          const text=v=>String(v==null?'':v).trim();
          const hidden=s=>['جاهز للاستلام','تم التسليم','مكرر','تم التنفيذ','جاهز للطباعة','ملغى','ملغي'].includes(text(s));
          async function req(url,opt={}){const r=await fetch(url,{cache:'no-store',redirect:'follow',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{}return{status:r.status,body:b};}
          async function login(){for(let n=0;n<4;n++){const l=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username,password})});const t=text(l.body&&l.body.user&&l.body.user.token);if(l.status===200&&l.body.success===true&&t){console.log('::add-mask::'+t);return t;}}throw new Error('login failed');}
          async function authoritative(){for(let n=0;n<4;n++){const token=await login();const a=await req(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username,token,screen:'service',page:'1',pageSize:'100',statusFilter:'__ACTIVE__'})});if(a.status===200&&a.body.success===true)return a.body;}throw new Error('authoritative failed');}
          async function mirror(offset){const r=await req(base+'/v1/mirror/sheet?name='+encodeURIComponent('الأوردرات')+'&limit=500&offset='+offset,{headers:{accept:'application/json'}});assert.equal(r.status,200);assert.equal(r.body.success,true);return r.body.sheet||{};}
          function idx(h,names){const a=h.map(text);for(const n of names){const i=a.lastIndexOf(n);if(i>=0)return i;}return -1;}
          (async()=>{
            const [auth,a,b]=await Promise.all([authoritative(),mirror(0),mirror(500)]);
            const appIds=new Set((auth.rows||[]).map(r=>text(r.orderId)).filter(Boolean));
            const headers=a.headers||[], rows=[...(a.rows||[]),...(b.rows||[])];
            const c={id:idx(headers,['رقم الأوردر','id']),status:idx(headers,['الحالة العامة','status']),source:idx(headers,['مصدر الطلب'])};
            const active=[];
            for(const item of rows){if(Number(item.rowNumber||0)<=1)continue;const d=Array.isArray(item.display)&&item.display.length?item.display:(item.values||[]);const id=text(d[c.id]),status=text(d[c.status])||'طلب جديد',source=text(d[c.source]);if(!id||hidden(status))continue;active.push({id,source});}
            const nonblank=active.filter(x=>x.source).map(x=>x.id); const blank=active.filter(x=>!x.source).map(x=>x.id);
            const missingFromRule=[...appIds].filter(id=>!nonblank.includes(id));
            const extraFromRule=nonblank.filter(id=>!appIds.has(id));
            const blankIncluded=blank.filter(id=>appIds.has(id));
            console.log('T11_SOURCE_RULE='+JSON.stringify({apps:appIds.size,active:active.length,nonblankSource:nonblank.length,blankSource:blank.length,missingFromRule:missingFromRule.length,extraFromRule:extraFromRule.length,blankIncluded:blankIncluded.length}));
            console.log('T11_SOURCE_RULE_EXTRA_IDS='+JSON.stringify(extraFromRule));
            console.log('T11_SOURCE_RULE_MISSING_IDS='+JSON.stringify(missingFromRule));
            console.log('T11_SOURCE_RULE_BLANK_INCLUDED_IDS='+JSON.stringify(blankIncluded));
            assert.equal(missingFromRule.length,0); assert.equal(extraFromRule.length,0); assert.equal(blankIncluded.length,0); assert.equal(nonblank.length,appIds.size);
            console.log('T11_SERVICE_SOURCE_RULE_PARITY=PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
