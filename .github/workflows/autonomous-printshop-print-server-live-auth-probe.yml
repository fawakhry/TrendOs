name: Autonomous Printshop Print Server Live Auth Probe

on:
  push:
    branches:
      - candidate/t12-full-cloud-cutover-a56-20260929
    paths:
      - '.github/workflows/autonomous-printshop-print-server-live-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe curl variants
        shell: pwsh
        run: |
          $url = 'https://trendos-d1-api.trendmall-contact.workers.dev/v1/employee/auth/login'
          $body = '{"username":"__print_server_probe__","password":"invalid-probe-password"}'
          Write-Host '=== CURL DEFAULT ==='
          curl.exe -sS -i -X POST $url -H 'Content-Type: application/json; charset=utf-8' --data $body
          Write-Host '=== CURL ORIGIN ==='
          curl.exe -sS -i -X POST $url -H 'Content-Type: application/json; charset=utf-8' -H 'Origin: https://fawakhry.github.io' --data $body
          Write-Host '=== CURL BROWSER ==='
          curl.exe -sS -i -X POST $url -H 'Content-Type: application/json; charset=utf-8' -H 'Origin: https://fawakhry.github.io' -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) TrendOS-Print-Server/0.2' --data $body

      - name: Probe Python urllib variants
        shell: pwsh
        run: |
          @'
          import json, urllib.request, urllib.error
          url='https://trendos-d1-api.trendmall-contact.workers.dev/v1/employee/auth/login'
          data=json.dumps({'username':'__print_server_probe__','password':'invalid-probe-password'}).encode()
          variants=[
            ('PY_DEFAULT', {'Accept':'application/json','Content-Type':'application/json; charset=utf-8'}),
            ('PY_ORIGIN', {'Accept':'application/json','Content-Type':'application/json; charset=utf-8','Origin':'https://fawakhry.github.io'}),
            ('PY_BROWSER', {'Accept':'application/json','Content-Type':'application/json; charset=utf-8','Origin':'https://fawakhry.github.io','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) TrendOS-Print-Server/0.2'}),
          ]
          for name, headers in variants:
              req=urllib.request.Request(url,data=data,method='POST',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print(name,'STATUS='+str(r.status),'BODY='+r.read().decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  print(name,'STATUS='+str(e.code),'BODY='+e.read().decode('utf-8','replace'))
              except Exception as e:
                  print(name,'ERROR='+repr(e))
          '@ | Set-Content -Encoding utf8 probe.py
          python probe.py
