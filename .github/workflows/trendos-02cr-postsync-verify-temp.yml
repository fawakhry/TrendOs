name: TrendOS 02CR Post-Sync Verify TEMP

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-02cr-postsync-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      PREVIEW_URL: https://trendos-edge-gateway-preview.trendmall-contact.workers.dev
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwGHOduL0BHvH-o4up9nbk1wYFi54D2KOnW1AFDigpBzyuAOTWzPfpSFPGSyFVj_fmTmg/exec
      EDGE_SESSION_SECRET: ${{ secrets.TRENDOS_EDGE_SESSION_SECRET_PREVIEW }}
      TRENDOS_PROD_QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
    steps:
      - name: Static read-only guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          data=Path('.github/workflows/trendos-02cr-postsync-verify-temp.yml').read_text(encoding='utf-8')
          forbidden=['wrangler'+' deploy','secret'+' put','d1 execute --'+'file','/v1/import/'+'sheet','/v1/mirror/'+'delta','/v1/mirror/'+'heartbeat','reconcile/'+'order']
          for token in forbidden:
            if token in data:
              raise SystemExit('Forbidden mutation token: '+token)
          print('PERF_CF_02CR_POSTSYNC_STATIC_READ_ONLY_PASS')
          PY

      - name: Verify support mirrors and production boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PROD_URL;
          async function jf(url){const r=await fetch(url,{cache:'no-store'}); const t=await r.text(); let b={}; try{b=JSON.parse(t||'{}')}catch{} return {status:r.status,body:b};}
          (async()=>{
            const expected='PERF-CF-02CR enrichment live sync V1';
            const summary={};
            for(const name of ['العملاء','عملاء منع التسليم بالمديونية']){
              const m=await jf(base+'/v1/mirror/sheet?name='+encodeURIComponent(name)+'&limit=1&offset=0');
              assert.equal(m.status,200,name+' mirror HTTP');
              assert.equal(m.body.success,true,name+' mirror success');
              const s=m.body.sheet||{};
              assert.equal(String(s.status||''),'ready',name+' ready');
              assert.equal(String(s.note||''),expected,name+' exact 02CR note');
              assert.equal(Number(s.rowCount||0),Number(s.sourceLastRow||0),name+' row parity');
              assert.ok(Number(s.sourceLastRow||0)>=1,name+' rows');
              summary[name]={sourceLastRow:Number(s.sourceLastRow||0),sourceLastCol:Number(s.sourceLastCol||0),rowCount:Number(s.rowCount||0),status:String(s.status||''),syncedAt:String(s.syncedAt||''),note:String(s.note||'')};
            }
            const lines=await jf(base+'/v1/mirror/sheet?name='+encodeURIComponent('بنود الأوردرات')+'&limit=1&offset=0');
            assert.equal(lines.status,200); assert.equal(lines.body.success,true);
            assert.equal(String(lines.body.sheet?.note||''),'TrendOS orders live sync V2 quota-aware','Lines ownership must remain V2');
            assert.equal(Number(lines.body.sheet?.rowCount||0),Number(lines.body.sheet?.sourceLastRow||0));
            const edge=await jf(base+'/v1/edge/health');
            const recon=await jf(base+'/v1/qualification/cloud-write/reconcile/health');
            const cloud=await jf(base+'/v1/cloud/write/health');
            const unauth=await jf(base+'/v1/edge/orders/page?screen=print&page=1&pageSize=5');
            assert.equal(edge.status,200); assert.equal(edge.body.success,true); assert.equal(edge.body.database,true); assert.equal(edge.body.cutover,false);
            assert.equal(recon.status,200); assert.equal(recon.body.enabled,false); assert.equal(recon.body.genericDrainEnabled,false); assert.equal(recon.body.productionCutover,false); assert.equal(recon.body.sheetsAuthoritative,true);
            assert.equal(cloud.status,200); assert.equal(cloud.body.success,true); assert.equal(cloud.body.cutover,false); assert.equal(cloud.body.sheetsAuthoritative,true); assert.equal(Number(cloud.body.pendingOutbox||0),0);
            assert.equal(unauth.status,401);
            const cfg=await (await fetch('https://raw.githubusercontent.com/fawakhry/TrendOs/main/config.js',{cache:'no-store'})).text();
            assert.ok(!/MATBAGY_EDGE_ORDERS_READ_V1_ENABLED\s*=\s*true/.test(cfg),'frontend flag must remain OFF');
            assert.ok(!/trendos-edge-orders-read-v1\.js/.test(cfg),'edge loader must remain absent');
            console.log('PERF_CF_02CR_SUPPORT_MIRRORS='+JSON.stringify(summary));
            console.log('PERF_CF_02CR_LINES_OWNER='+JSON.stringify({sourceLastRow:Number(lines.body.sheet?.sourceLastRow||0),rowCount:Number(lines.body.sheet?.rowCount||0),note:String(lines.body.sheet?.note||'')}));
            console.log('PERF_CF_02CR_PROD_BOUNDARY_PASS='+JSON.stringify({cutover:false,sheetsAuthoritative:true,reconcileEnabled:false,genericDrainEnabled:false,pendingOutbox:0,ordersUnauthStatus:401,frontendEdgeRead:false}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Verify Preview 02CR vs Apps Script operational parity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDGE_SESSION_SECRET"
          test -n "$TRENDOS_PROD_QUALIFY_USERNAME"
          test -n "$TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const crypto=require('crypto');
          const preview=process.env.PREVIEW_URL, apps=process.env.APPS_SCRIPT_URL;
          const now=Math.floor(Date.now()/1000);
          const claims={aud:'trendos-orders-edge',sub:'02cr-postsync-probe',role:'print',department:'طباعة',screens:['print'],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const body=Buffer.from(JSON.stringify(claims)).toString('base64url');
          const input='v1.'+body;
          const token=input+'.'+crypto.createHmac('sha256',process.env.EDGE_SESSION_SECRET).update(input).digest('base64url');
          const auth={authorization:'Bearer '+token,accept:'application/json'};
          async function jf(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts});const t=await r.text();let b={};try{b=JSON.parse(t||'{}')}catch{}return{status:r.status,body:b};}
          function norm(v){if(v===null||v===undefined)return''; if(typeof v==='boolean') return v?'true':'false'; if(typeof v==='number'&&Number.isFinite(v)) return String(v); return String(v).trim();}
          function ident(r){return norm(r.orderId)+'|'+norm(r.lineId);}
          const fields=['orderId','lineId','customerName','customerPhone','department','itemName','quantity','departmentOwner','priority','status','ready','notes','heatPress','flyPrint','quickPrint','debtAmount','debtHold','deliveryDebtRestricted','debtRestrictionReason','debtNotes','expectedTime','lastWhatsAppMessage','registrationMessageSent','reportedBy','orderSource'];
          function compareRows(aRows,dRows,label){
            const a=new Map((aRows||[]).map(r=>[ident(r),r]));
            const d=new Map((dRows||[]).map(r=>[ident(r),r]));
            assert.deepEqual([...d.keys()].sort(),[...a.keys()].sort(),label+' identity parity');
            const mismatches=[];
            for(const [id,ar] of a){const dr=d.get(id); for(const f of fields){if(norm(ar[f])!==norm(dr[f])) mismatches.push({id,field:f});}}
            if(mismatches.length){console.log('PERF_CF_02CR_FIELD_MISMATCHES='+JSON.stringify(mismatches.slice(0,40))); process.exit(1);}
            return {rows:a.size,fieldsCompared:fields.length};
          }
          async function appCall(params){
            return jf(apps,{method:'POST',headers:{accept:'application/json','content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getRowsPageV1931',username:process.env.TRENDOS_PROD_QUALIFY_USERNAME,token:process.env.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN,screen:'print',page:'1',pageSize:'100',...params})});
          }
          async function d1Call(params){const q=new URLSearchParams({screen:'print',page:'1',pageSize:'100',...params}); return jf(preview+'/v1/edge/orders/02cr/page?'+q.toString(),{headers:auth});}
          (async()=>{
            const app0=await appCall({}); const d10=await d1Call({});
            assert.equal(app0.status,200,'Apps Script base HTTP'); assert.equal(app0.body.success,true,'Apps Script base success');
            assert.equal(d10.status,200,'02CR Preview base HTTP'); assert.equal(d10.body.success,true,'02CR Preview base success');
            assert.equal(String(d10.body.version||''),'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');
            const baseParity=compareRows(app0.body.rows,d10.body.rows,'base');
            assert.deepEqual(d10.body.statusCounts||{},app0.body.statusCounts||{},'statusCounts parity');
            assert.deepEqual(d10.body.statusOrderCounts||{},app0.body.statusOrderCounts||{},'statusOrderCounts parity');
            assert.equal(Number(d10.body.pagination?.totalRows||0),Number(app0.body.pagination?.totalRows||0),'pagination total parity');
            const probes=[
              {name:'active',params:{statusFilter:'__ACTIVE__'}},
              {name:'overdue',params:{statusFilter:'__OVERDUE__'}},
              {name:'today',params:{statusFilter:'__TODAY_WORK__'}},
              {name:'ready',params:{statusFilter:'__READY_PICKUP__'}},
              {name:'cancelled',params:{statusFilter:'__CANCELLED__'}},
              {name:'deliveredToday',params:{statusFilter:'__DELIVERED_TODAY__'}},
              {name:'priorityUrgent',params:{priorityFilter:'عاجل'}},
              {name:'priorityNormal',params:{priorityFilter:'عادي'}},
              {name:'heatOnly',params:{heatPressFilter:'only'}},
              {name:'heatWithout',params:{heatPressFilter:'without'}}
            ];
            if((app0.body.rows||[])[0]?.orderId) probes.push({name:'orderIdQuery',params:{query:String(app0.body.rows[0].orderId)}});
            const filterSummary={};
            for(const p of probes){
              const a=await appCall(p.params), d=await d1Call(p.params);
              assert.equal(a.status,200,p.name+' Apps HTTP'); assert.equal(a.body.success,true,p.name+' Apps success');
              assert.equal(d.status,200,p.name+' D1 HTTP'); assert.equal(d.body.success,true,p.name+' D1 success');
              const cp=compareRows(a.body.rows,d.body.rows,p.name);
              assert.equal(Number(d.body.pagination?.totalRows||0),Number(a.body.pagination?.totalRows||0),p.name+' total parity');
              filterSummary[p.name]=cp.rows;
            }
            const debt=await d1Call({statusFilter:'__DEBT__'});
            assert.equal(debt.status,409,'__DEBT__ fallback status'); assert.equal(debt.body.code,'apps-script-required'); assert.equal(debt.body.fallback,'apps-script');
            console.log('PERF_CF_02CR_BASE_PARITY='+JSON.stringify({rows:baseParity.rows,fieldsCompared:baseParity.fieldsCompared,identityParity:true,fieldParity:true,pagination:true,statusCounts:true,statusOrderCounts:true}));
            console.log('PERF_CF_02CR_FILTER_PARITY='+JSON.stringify(filterSummary));
            console.log('PERF_CF_02CR_DEBT_FALLBACK='+JSON.stringify({status:debt.status,code:debt.body.code,fallback:debt.body.fallback}));
            console.log('PERF_CF_02CR_POSTSYNC_PREVIEW_PARITY_PASS_NO_PII_LOGGING');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE

      - name: Conclusion
        run: |
          echo 'PERF_CF_02CR_POSTSYNC_VERIFY_PASS_NO_MUTATION'
          echo 'No Worker deploy, no D1 import/delta/heartbeat write, no frontend change, no secret rotation, no 02CL action.'
