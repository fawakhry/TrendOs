name: TrendOS 02CU Worker Zero Traffic Upload TEMP

on:
  push:
    branches: [agent/go-live-2026-09-01-integrity]
    paths: ['.github/workflows/trendos-02cu-worker-zero-traffic-upload-temp.yml']

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUALIFY_USERNAME: ${{ secrets.TRENDOS_PROD_QUALIFY_USERNAME }}
      QUALIFY_EMPLOYEE_TOKEN: ${{ secrets.TRENDOS_PROD_QUALIFY_EMPLOYEE_TOKEN }}
      WORKER_NAME: trendos-d1-api
      PREVIEW_URL: https://cu-idle-trendos-d1-api.trendmall-contact.workers.dev
      BASE_REF: b78d0656754038f700ee4ecdba6c95b88c5feba8
      CANDIDATE_REF: b5721d7047291e0047399ddcf5d0284f3b6ca04f
      PREVIOUS_VERSION: c77bf453-c590-4cff-a55b-fd9c625b6d76
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock current production version
        run: |
          set -euo pipefail
          npx --yes wrangler@4.33.2 deployments list --name "$WORKER_NAME" --json > /tmp/deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const ds=(Array.isArray(x)?x:x.items||[]).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const d=ds[0]||{}; const a=(d.versions||[]).map(v=>({id:v.version_id||v.id,p:Number(v.percentage)}));
          if(!a.some(v=>v.id===process.env.PREVIOUS_VERSION&&v.p===100)) throw new Error('c77 is no longer active at 100%');
          console.log('PERF_CF_02CU_UPLOAD_BASELINE_LOCK_PASS');
          NODE

      - name: Assemble exact three-file Worker delta
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/02cu-prod "$BASE_REF"
          for f in cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs cloudflare-d1/src/index_v2.js cloudflare-d1/src/edge-orders-idle-verifier.mjs; do
            mkdir -p "/tmp/02cu-prod/$(dirname "$f")"
            git show "$CANDIDATE_REF:$f" > "/tmp/02cu-prod/$f"
          done
          python3 - <<'PY'
          import subprocess
          expected={'cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs','cloudflare-d1/src/index_v2.js','cloudflare-d1/src/edge-orders-idle-verifier.mjs'}
          out=subprocess.check_output(['git','-C','/tmp/02cu-prod','status','--porcelain'],text=True)
          got={line[3:] for line in out.splitlines() if line.strip()}
          print('02CU_ASSEMBLED_FILES=',sorted(got))
          if got != expected: raise SystemExit(f'unexpected scope {got}')
          PY
          cmp cloudflare-d1/wrangler.toml /tmp/02cu-prod/cloudflare-d1/wrangler.toml
          grep -Eq '^EDGE_ORDERS_IDLE_HEARTBEAT_ENABLED = "true"$' /tmp/02cu-prod/cloudflare-d1/wrangler.toml
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' /tmp/02cu-prod/cloudflare-d1/wrangler.toml
          node --check /tmp/02cu-prod/cloudflare-d1/src/index_v2.js
          node --check /tmp/02cu-prod/cloudflare-d1/src/edge-orders-read-02cr-freshness.mjs

      - name: Focused tests
        run: |
          set -euo pipefail
          node tests/cloudflare_edge_orders_02cr_canary.test.mjs
          node tests/cloudflare_edge_orders_02cr_idle_freshness_02cu.test.mjs
          node tests/cloudflare_index_v2_02cr_route.test.mjs
          node tests/frontend_edge_orders_cutover_02ct.test.mjs
          node tests/cloudflare_edge_orders_idle_verifier_v1.test.mjs

      - name: Upload version only with zero production traffic
        run: |
          set -euo pipefail
          cd /tmp/02cu-prod
          npx --yes wrangler@4.33.2 versions upload --config cloudflare-d1/wrangler.toml --preview-alias cu-idle --message "TrendOS 02CU dual-signal idle freshness candidate"
          sleep 8
          npx --yes wrangler@4.33.2 versions list --name "$WORKER_NAME" --json > /tmp/versions.json
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/versions.json','utf8'));
          const vs=(Array.isArray(x)?x:x.items||[]).slice().sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const v=vs[0]||{}; const id=String(v.id||v.version_id||'');
          if(!id||id===process.env.PREVIOUS_VERSION) throw new Error('new version not identified');
          fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_VERSION=${id}\n`);
          console.log('PERF_CF_02CU_ZERO_TRAFFIC_TARGET='+id);
          NODE

      - name: Qualify preview alias read-only
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.PREVIEW_URL,u=process.env.QUALIFY_USERNAME,t=process.env.QUALIFY_EMPLOYEE_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opt={},n=6){let last;for(let i=1;i<=n;i++){try{const r=await fetch(url,{cache:'no-store',...opt});const raw=await r.text();let b={};try{b=JSON.parse(raw||'{}')}catch{};if(r.status>=500&&i<n){await sleep(i*1500);continue;}return{status:r.status,body:b};}catch(e){last=e;if(i<n)await sleep(i*1500)}}throw last;}
          (async()=>{
            const s=await req(base+'/v1/edge/orders/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,token:t})},8);
            assert.equal(s.status,200);assert.equal(s.body.success,true);assert.ok(s.body.edgeToken);
            const h={authorization:'Bearer '+s.body.edgeToken,accept:'application/json'};
            const x=await req(base+'/v1/edge/orders/02cr/page?screen=print&page=1&pageSize=5&statusFilter=__ACTIVE__',{headers:h},6);
            assert.equal(x.status,200);assert.equal(x.body.success,true);assert.equal(x.body.version,'D1_ORDERS_READ_02CR_OPERATIONAL_CANARY');assert.equal(x.body.dataSource,'d1-edge-orders');
            if(x.body.logicalFreshness){assert.equal(x.body.logicalFreshness.ok,true);assert.equal(x.body.logicalFreshness.mode,'verified-idle-source-unchanged');}
            const d=await req(base+'/v1/edge/orders/02cr/page?screen=service&page=1&pageSize=5&statusFilter=__DEBT__',{headers:h},3);
            assert.equal(d.status,409);assert.equal(d.body.fallback,'apps-script');
            console.log('PERF_CF_02CU_ZERO_TRAFFIC_PREVIEW_PASS='+JSON.stringify({targetVersion:process.env.TARGET_VERSION,logicalMode:x.body.logicalFreshness&&x.body.logicalFreshness.mode||'physical-fresh',debtFallback:true}));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
