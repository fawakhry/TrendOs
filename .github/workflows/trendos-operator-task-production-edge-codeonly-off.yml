name: TrendOS Operator Task V2 Production Edge Code-Only OFF Deploy

on:
  push:
    branches:
      - operator-task-v2-production-activation-20260913
    paths:
      - '.github/workflows/trendos-operator-task-production-edge-codeonly-off.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendos-operator-task-production-edge-codeonly-off
  cancel-in-progress: false

jobs:
  deploy-codeonly-off:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
      WRANGLER_VERSION: 4.33.2
    steps:
      - name: Checkout exact activation branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hard safety gate — Operator Task route code present but OFF
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cfg='cloudflare-d1/wrangler.toml'
          grep -Eq '^name = "trendos-d1-api"$' "$cfg"
          grep -Eq '^main = "production-shadow/index\.js"$' "$cfg"
          grep -Eq '^TRENDOS_OPERATOR_TASK_V2_EDGE_ENABLED = "false"$' "$cfg"
          grep -Eq '^TRENDOS_CLOUD_WRITE_V1_ENABLED = "true"$' "$cfg"
          grep -Eq '^TRENDOS_PRODUCTION_SHADOW_V2_ENABLED = "true"$' "$cfg"
          grep -Eq '^TRENDOS_PROD_RECONCILE_QUALIFY_ENABLED = "false"$' "$cfg"
          grep -q "handleOperatorTaskEdgeRequest" cloudflare-d1/src/index_v2.js
          grep -q "operator-task-edge-v2" cloudflare-d1/src/index_v2.js
          grep -q "import core from '../src/index_v2.js'" cloudflare-d1/production-shadow/index.js
          ! grep -Eq 'TRENDOS_OPERATOR_TASK_PROXY_SECRET[[:space:]]*=' "$cfg"
          workflow='.github/workflows/trendos-operator-task-production-edge-codeonly-off.yml'
          ! grep -Eq 'wrangler.*d1[[:space:]]+migrations[[:space:]]+apply' "$workflow"
          ! grep -Eq 'wrangler.*secret[[:space:]]+(put|bulk)' "$workflow"
          echo 'PRODUCTION_OT_EDGE_CODEONLY_OFF_SAFETY_PASS'

      - name: Run Operator Task and Edge contracts
        run: |
          set -euo pipefail
          node --test tests/operator_task_workflow_v2_contract.test.mjs
          node --test tests/operator_task_edge_v2.test.mjs
          node --test tests/operator_task_gaber_material_gate_v1.test.mjs
          node --test tests/operator_task_gaber_material_ui_v1.test.mjs
          node --check cloudflare-d1/src/index_v2.js
          echo 'OPERATOR_TASK_CONTRACTS_PASS'

      - name: Live Production baseline — GET only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PROD_URL/v1/edge/health" > /tmp/pre-edge.json
          curl --fail --silent --show-error "$PROD_URL/v1/cloud/write/health" > /tmp/pre-write.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/pre-edge.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/pre-write.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.enabled!==true||w.writesAccepted!==true||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('PRODUCTION_PREDEPLOY_BASELINE_PASS');
          NODE

      - name: Compile exact Production payload with Wrangler dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trendos-ot-prod-off-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config cloudflare-d1/wrangler.toml --outdir /tmp/trendos-ot-prod-off-build
          test -d /tmp/trendos-ot-prod-off-build
          echo 'PRODUCTION_OT_EDGE_DRYRUN_PASS'

      - name: Deploy Operator Task route code with Edge gate OFF
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare-d1/wrangler.toml
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"
          sleep 5
          echo 'PRODUCTION_OT_EDGE_CODE_DEPLOYED_GATE_OFF'

      - name: Post-deploy verify core runtime and current Cloud Write state preserved
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PROD_URL/v1/edge/health" > /tmp/post-edge.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PROD_URL/v1/cloud/write/health" > /tmp/post-write.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/post-edge.json','utf8'));
          const w=JSON.parse(fs.readFileSync('/tmp/post-write.json','utf8'));
          if(!e.success||e.database!==true||e.authConfigured!==true||e.upstreamConfigured!==true||e.cutover!==false) process.exit(1);
          if(!w.success||w.enabled!==true||w.writesAccepted!==true||w.cutover!==false||w.sheetsAuthoritative!==true) process.exit(2);
          console.log('PRODUCTION_POSTDEPLOY_BASELINE_PASS');
          NODE

      - name: Post-deploy verify Operator Task route exists and is fail-closed OFF
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/ot-disabled.json --write-out '%{http_code}' "$PROD_URL/v1/operator/tasks/status")"
          cat /tmp/ot-disabled.json
          echo
          test "$code" = '503'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/ot-disabled.json','utf8')); if(x.success!==false||x.code!=='OPERATOR_TASK_EDGE_DISABLED') process.exit(1); console.log('PRODUCTION_OPERATOR_TASK_ROUTE_OFF_PASS')"

      - name: Automatic rollback on post-deploy failure
        if: ${{ failure() && env.DEPLOYED == '1' }}
        continue-on-error: true
        shell: bash
        run: |
          echo 'Post-deploy verification failed; rolling back immediately.'
          npx --yes wrangler@${WRANGLER_VERSION} rollback --config cloudflare-d1/wrangler.toml --message "Rollback after Operator Task V2 code-only OFF verification failure"

      - name: Safety conclusion
        if: ${{ success() }}
        run: |
          echo 'PRODUCTION_OPERATOR_TASK_EDGE_CODEONLY_OFF_DEPLOY=PASS'
          echo 'TRENDOS_OPERATOR_TASK_V2_EDGE_ENABLED=false'
          echo 'NO_PROXY_SECRET_CHANGE=YES'
          echo 'NO_EDGE_SESSION_SECRET_CHANGE=YES'
          echo 'NO_D1_MIGRATION=YES'
          echo 'NO_TASK_MUTATION=YES'
