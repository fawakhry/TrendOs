name: TrendOS Cloudflare Token Metadata ReadOnly

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-cloudflare-token-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve active secret token metadata read-only
        shell: bash
        run: |
          set -u
          verify="$(curl --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             https://api.cloudflare.com/client/v4/user/tokens/verify)"
          token_id="$(printf '%s' "$verify" | jq -r '.result.id // ""')"
          echo "TOKEN_ID=$token_id"
          echo "TOKEN_STATUS=$(printf '%s' "$verify" | jq -r '.result.status // "unknown"')"

          user_code="$(curl --silent --show-error             --output /tmp/user-token.json             --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/$token_id" || true)"
          echo "USER_TOKEN_DETAILS_HTTP=$user_code"
          jq -c '{success,errors,result:{id:.result.id,name:.result.name,status:.result.status,policies:.result.policies}}' /tmp/user-token.json 2>/dev/null || true

          acct_code="$(curl --silent --show-error             --output /tmp/account-token.json             --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/$token_id" || true)"
          echo "ACCOUNT_TOKEN_DETAILS_HTTP=$acct_code"
          jq -c '{success,errors,result:{id:.result.id,name:.result.name,status:.result.status,policies:.result.policies}}' /tmp/account-token.json 2>/dev/null || true

          echo "MUTATIONS=NONE"
