name: TrendOS Wrangler D1 ReadOnly Diagnostics

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-cloudflare-token-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-migration-v3-t12-order-create-ci-20260919
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm exact target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fx 'name = "trendos-d1-api"' cloudflare-d1/wrangler.toml
          grep -F 'database_name = "trendos-main"' cloudflare-d1/wrangler.toml
          grep -F 'database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"' cloudflare-d1/wrangler.toml
          echo "TARGET_GUARD=PASS"

      - name: Wrangler identity
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 whoami

      - name: Wrangler D1 list
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 list

      - name: Wrangler D1 info
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 info trendos-main --config cloudflare-d1/wrangler.toml

      - name: Wrangler D1 SELECT
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --command "SELECT 1 AS wrangler_readonly_probe;"

      - name: Wrangler migration status read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 migrations list trendos-main --remote --config cloudflare-d1/wrangler.toml

      - name: Final marker
        shell: bash
        run: |
          echo "DIAGNOSTIC_MUTATIONS=NONE"
