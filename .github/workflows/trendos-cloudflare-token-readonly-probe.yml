name: TrendOS Cloudflare Token Identity Verify

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-cloudflare-token-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_TOKEN_ID: 46244467c1de37daa419a38f6fb39921
    steps:
      - name: Verify token identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          code="$(curl --silent --show-error             --output /tmp/verify.json             --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"
          echo "VERIFY_HTTP=$code"
          jq -r '"VERIFY_SUCCESS=" + ((.success // false)|tostring)' /tmp/verify.json
          jq -r '"TOKEN_STATUS=" + (.result.status // "unknown")' /tmp/verify.json
          token_id="$(jq -r '.result.id // ""' /tmp/verify.json)"
          echo "TOKEN_ID=$token_id"
          if [ "$token_id" = "$EXPECTED_TOKEN_ID" ]; then
            echo "TOKEN_ID_MATCH_EXPECTED=true"
          else
            echo "TOKEN_ID_MATCH_EXPECTED=false"
          fi
