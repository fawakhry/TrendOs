name: TrendOS D1 Migration Remote Isolation

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-cloudflare-token-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_DB_ID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
      TEST_DB_ID: 54a3c05e-cde9-4979-814f-d40f941edcd5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-migration-v3-t12-order-create-ci-20260919
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production state read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --command "SELECT name,type FROM sqlite_master WHERE name LIKE 't12_prod_%' ORDER BY name;"
          npx --yes wrangler@4.142.0 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 10;"

      - name: Build isolated synthetic-test config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag-d1/migrations
          cp cloudflare-d1/migrations/0005_t12_production_create_canary.sql diag-d1/migrations/9001_t12_prod_canary_diag_20260927.sql
          cat > diag-d1/wrangler.toml <<'EOF'
          name = "trendos-t12-migration-diag"
          main = "dummy.js"
          compatibility_date = "2026-08-27"

          [[d1_databases]]
          binding = "DB"
          database_name = "trendos-t12-synthetic-test"
          database_id = "54a3c05e-cde9-4979-814f-d40f941edcd5"
          migrations_dir = "migrations"
          migrations_table = "diag_migrations_20260927"
          EOF
          printf 'export default { fetch(){ return new Response("diag"); } };\n' > diag-d1/dummy.js
          test "$(git hash-object cloudflare-d1/migrations/0005_t12_production_create_canary.sql)" = '95224bb1afa50a6344fd0cf755a40d20ca7b9a6a'

      - name: Synthetic-test precheck
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_ID/query"
          curl --silent --show-error -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"sql":"SELECT COUNT(*) AS c FROM sqlite_master WHERE name LIKE '''t12_prod_%''' OR name='''diag_migrations_20260927''';"}'             "$api" > /tmp/pre.json
          cat /tmp/pre.json
          test "$(jq -r '.success' /tmp/pre.json)" = "true"
          test "$(jq -r '.result[0].results[0].c' /tmp/pre.json)" = "0"
          echo "SYNTHETIC_PRECHECK=CLEAN"

      - name: Apply exact migration shape on synthetic test
        id: applytest
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 migrations apply trendos-t12-synthetic-test --remote --config diag-d1/wrangler.toml
          echo "SYNTHETIC_MIGRATION_APPLY=PASS"

      - name: Synthetic-test verify
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_ID/query"
          curl --silent --show-error -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"sql":"SELECT name,type FROM sqlite_master WHERE name LIKE '''t12_prod_%''' OR name='''diag_migrations_20260927''' ORDER BY name;"}'             "$api" > /tmp/verify.json
          cat /tmp/verify.json

      - name: Synthetic-test cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_ID/query"
          sql="DROP TABLE IF EXISTS t12_prod_outbox; DROP TABLE IF EXISTS t12_prod_events; DROP TABLE IF EXISTS t12_prod_lines; DROP TABLE IF EXISTS t12_prod_orders; DROP TABLE IF EXISTS t12_prod_request_ledger; DROP TABLE IF EXISTS t12_prod_create_control; DROP TABLE IF EXISTS diag_migrations_20260927;"
          curl --silent --show-error -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"             "$api" > /tmp/cleanup.json
          cat /tmp/cleanup.json
          test "$(jq -r '.success' /tmp/cleanup.json)" = "true"

          curl --silent --show-error -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"sql":"SELECT COUNT(*) AS c FROM sqlite_master WHERE name LIKE '''t12_prod_%''' OR name='''diag_migrations_20260927''';"}'             "$api" > /tmp/post.json
          cat /tmp/post.json
          test "$(jq -r '.success' /tmp/post.json)" = "true"
          test "$(jq -r '.result[0].results[0].c' /tmp/post.json)" = "0"
          echo "SYNTHETIC_CLEANUP=PASS"
          echo "PRODUCTION_MUTATIONS=NONE"
