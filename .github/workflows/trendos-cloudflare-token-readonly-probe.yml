name: TrendOS D1 PRAGMA Foreign-Key Diagnostic

on:
  push:
    branches:
      - diagnostic/cloudflare-token-readonly-20260927
    paths:
      - '.github/workflows/trendos-cloudflare-token-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-migration-v3-t12-order-create-ci-20260919
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact target guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -F 'database_name = "trendos-main"' cloudflare-d1/wrangler.toml
          grep -F 'database_id = "5c4b92bf-e043-4f6e-bd6d-d514a92cd825"' cloudflare-d1/wrangler.toml

      - name: Read current foreign_keys pragma
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --command "PRAGMA foreign_keys;"

      - name: Attempt redundant foreign_keys ON and capture result
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.142.0 d1 execute trendos-main --remote --config cloudflare-d1/wrangler.toml --command "PRAGMA foreign_keys = ON;" > /tmp/pragma-on.log 2>&1
          rc=$?
          set -e
          cat /tmp/pragma-on.log
          echo "PRAGMA_ON_EXIT_CODE=$rc"
          if grep -Fq 'You do not have permission to perform this operation. [code: 7500]' /tmp/pragma-on.log; then
            echo "PRAGMA_ON_MATCHES_MIGRATION_FAILURE=true"
          else
            echo "PRAGMA_ON_MATCHES_MIGRATION_FAILURE=false"
          fi
          echo "PERSISTED_MUTATIONS=NONE"
