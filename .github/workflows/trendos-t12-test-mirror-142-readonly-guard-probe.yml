name: TrendOS T12 TEST Mirror 142 ReadOnly Guard Probe

on:
  push:
    branches:
      - cloud-migration-v3-t12-order-create-ci-20260919
    paths:
      - 'docs/trendos/staging/RUN_T12_TEST_MIRROR_142_READONLY_GUARD_PROBE_20260926.trigger'

permissions:
  contents: read

concurrency:
  group: trendos-t12-test-mirror-142-readonly-guard-probe
  cancel-in-progress: false

jobs:
  readonlyGuardProbe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DB_UUID: 54a3c05e-cde9-4979-814f-d40f941edcd5
      TEST_DB_NAME: trendos-t12-synthetic-test
      PROD_DB_UUID: 5c4b92bf-e043-4f6e-bd6d-d514a92cd825
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source and run local SELECT-only contract
        run: |
          set -euo pipefail
          test "$TEST_DB_UUID" != "$PROD_DB_UUID"
          test "$(git hash-object cloudflare-d1/t12-preview/t12-existing-test-mirror-142-readonly-guard-probe-20260926.mjs)" = "a873d7a0c1d85c75c04e1c30eda37791150f7f76"
          test "$(git hash-object tests/t12_existing_test_mirror_142_readonly_guard_probe_v1.test.mjs)" = "acd8f1272a9adc35d4f11ade21739b4160004e29"
          node --experimental-sqlite tests/t12_existing_test_mirror_142_readonly_guard_probe_v1.test.mjs

      - name: Verify exact remote TEST D1 identity read-only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TEST_DB_UUID"             > /tmp/test-db.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/test-db.json','utf8'));if(x.success!==true||x.result?.name!==process.env.TEST_DB_NAME)process.exit(1);console.log('TEST_D1_IDENTITY_READ_ONLY_PASS name='+x.result.name)"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.141.0

      - name: Run remote TEST SELECT-only large guard probe
        run: |
          set -euo pipefail
          cat > cloudflare-d1/t12-preview/.t12-142-readonly-guard-probe-runtime.toml <<EOF
          name = "trendos-t12-mirror-142-readonly-guard-probe"
          main = "./t12-existing-test-mirror-142-readonly-guard-probe-20260926.mjs"
          compatibility_date = "2026-09-26"
          [[d1_databases]]
          binding = "T12_SYNTHETIC_DB"
          database_name = "$TEST_DB_NAME"
          database_id = "$TEST_DB_UUID"
          remote = true
          EOF
          ! grep -q 'trendos-main' cloudflare-d1/t12-preview/.t12-142-readonly-guard-probe-runtime.toml
          ! grep -q "$PROD_DB_UUID" cloudflare-d1/t12-preview/.t12-142-readonly-guard-probe-runtime.toml

          CI=1 npx wrangler dev             --config cloudflare-d1/t12-preview/.t12-142-readonly-guard-probe-runtime.toml             --ip 127.0.0.1 --port 8787 >/tmp/t12-142-readonly-guard-probe.log 2>&1 &
          PID=$!
          cleanup(){
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
            rm -f cloudflare-d1/t12-preview/.t12-142-readonly-guard-probe-runtime.toml
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 40); do
            code="$(curl --silent --show-error --max-time 20               --output /tmp/probe.json --write-out '%{http_code}'               http://127.0.0.1:8787/__t12/local/142-readonly-guard-probe || true)"
            if [ -s /tmp/probe.json ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "READONLY_GUARD_PROBE_HTTP=$code"
          cat /tmp/probe.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/probe.json','utf8'));if(!x.success||x.code!=='readonly-large-guard-pass'||x.productionAuthorized!==false||x.mutationAttempted!==false||x.results?.length!==2)process.exit(1);for(const r of x.results){if(r.error||r.observed?.mismatches!==0||r.observed?.catalogMatches!==1||r.observed?.actualRows!==r.expectedRows+11)process.exit(1);}console.log('REAL_TEST_142_READONLY_GUARD_PAYLOAD_PASS='+JSON.stringify(x.results.map(r=>({sheetName:r.sheetName,chunks:r.chunks,payloadBytes:r.payloadBytes,maxChunkBytes:r.maxChunkBytes,sqlBytes:r.sqlBytes,bindCount:r.bindCount,elapsedMs:r.elapsedMs}))))"

      - name: Record scope
        if: ${{ always() }}
        run: |
          {
            echo '### TrendOS T12 142 read-only guard payload diagnostic'
            echo '- GET only against existing isolated TEST D1.'
            echo '- No POST, db.batch write, seed, DDL, Worker deploy, or production binding.'
            echo '- If the probe fails, do not retry the old 142 write; inspect the sanitized D1 error only.'
          } >> "$GITHUB_STEP_SUMMARY"
