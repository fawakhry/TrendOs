name: BOOK19 Actual Accounting Receipt to Core Delivery Gate (FAKE SQLITE NO_GO)
on:
  pull_request:
permissions:
  contents: read
jobs:
  accounting-receipt-delivery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invoke actual accounting and Core handlers in ONE throwaway in-memory SQLite only
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          EASY_STORE_LIVE_AUTH: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$EASY_STORE_LIVE_AUTH"
          node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
          node --check cloudflare-d1/src/employee-core-native-v1.mjs
          node --check tests/book19_actual_accounting_receipt_to_delivery_gate_sqlite_no_go.test.mjs
          node --test tests/book19_actual_accounting_receipt_to_delivery_gate_sqlite_no_go.test.mjs
          echo 'BOOK19_ACTUAL_HANDLERS_FAKE_SQLITE_ONLY=YES'
          echo 'BOOK19_FINANCE_RELEASE=NO_GO'
          echo 'BOOK19_PRODUCTION_WRITES=ZERO'
