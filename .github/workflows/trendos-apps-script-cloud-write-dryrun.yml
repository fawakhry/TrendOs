name: TrendOS Apps Script Cloud Write Dry-Run Gate

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - 'apps-script/patches/CLOUD_WRITE_RECONCILE_DRYRUN_V1.gs'
      - 'tests/apps_script_cloud_write_reconcile_dryrun_v1.test.mjs'
      - '.github/workflows/trendos-apps-script-cloud-write-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apps-script-dryrun-readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reconciliation dry-run is mutation-free and staging-only
        run: node tests/apps_script_cloud_write_reconcile_dryrun_v1.test.mjs
      - name: Safety conclusion
        run: |
          echo 'PASS: Apps Script reconciliation contract is dry-run/read-only only.'
          echo 'PASS: no Sheet mutation API, network write, Drive write, or header creation is present in the patch.'
          echo 'PASS: runtime guards require dryRun=true, configured secret, CW-STAGE-* entity IDs, payload identity, and compatible Orders schema.'
          echo 'This workflow does not deploy Apps Script and does not mutate Google Sheets or Production Cloud Write.'
