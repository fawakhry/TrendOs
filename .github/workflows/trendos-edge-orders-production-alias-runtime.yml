name: TrendOS Edge Orders Production Alias Runtime

on:
  push:
    branches:
      - agent/go-live-2026-09-01-integrity
    paths:
      - '.github/workflows/trendos-edge-orders-production-alias-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://trendos-d1-api.trendmall-contact.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify health and mirror
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PROD_URL/v1/edge/health")"
          cat /tmp/health.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!x.success||x.database!==true||x.authConfigured!==true||x.upstreamConfigured!==true||x.cutover!==false) process.exit(1)"
          for sheet in 'الأوردرات' 'بنود الأوردرات'; do
            curl --fail --silent --show-error --get --data-urlencode "name=$sheet" --data-urlencode 'limit=1' "$PROD_URL/v1/mirror/sheet" > /tmp/sheet.json
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/sheet.json','utf8')),s=x.sheet||{}; if(!x.success||x.schemaMutationFree!==true||s.status!=='ready'||Number(s.rowCount||0)!==Number(s.sourceLastRow||0)) process.exit(1); console.log('MIRROR_PASS '+s.sheetName+' rows='+s.rowCount+' syncedAt='+s.syncedAt)"
          done
      - name: Rotate secret for signed runtime qualification
        run: |
          npm install --no-save wrangler@4.33.2 >/dev/null 2>&1
          node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))" > /tmp/edge-secret.txt
          chmod 600 /tmp/edge-secret.txt
          cat /tmp/edge-secret.txt | npx wrangler secret put EDGE_SESSION_SECRET --config cloudflare-d1/wrangler.toml >/dev/null
          echo 'EDGE_SECRET_ROTATED_FOR_RUNTIME_PASS'
      - name: Signed Orders read and fail-closed checks
        run: |
          set -euo pipefail
          anon="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5")"
          test "$anon" = '401'
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'); const secret=fs.readFileSync('/tmp/edge-secret.txt','utf8').trim(),now=Math.floor(Date.now()/1000);
          const p={aud:'trendos-orders-edge',sub:'ci-prod-admin',role:'admin',department:'إدارة',screens:['service','print','laser','press',''],iat:now,exp:now+300,jti:'ci-'+crypto.randomUUID()};
          const b=Buffer.from(JSON.stringify(p)).toString('base64url'),i='v1.'+b,s=crypto.createHmac('sha256',secret).update(i).digest('base64url'); fs.writeFileSync('/tmp/token.txt',i+'.'+s,{mode:0o600});
          NODE
          token="$(cat /tmp/token.txt)"
          code="$(curl --silent --show-error --output /tmp/page.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__ACTIVE__")"
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/page.json','utf8')); if(!x.success||x.dataSource!=='d1-edge-orders'||!Array.isArray(x.rows)||!x.pagination) process.exit(1); console.log('PROD_ALIAS_ORDERS_PASS rows='+x.rows.length+' total='+x.pagination.totalRows+' syncedAt='+(x.mirror&&x.mirror.syncedAt||''))"
          debt="$(curl --silent --show-error --output /tmp/debt.json --write-out '%{http_code}' -H "authorization: Bearer $token" "$PROD_URL/v1/edge/orders/page?screen=service&page=1&pageSize=5&statusFilter=__DEBT__")"
          test "$debt" = '409'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/debt.json','utf8')); if(x.code!=='apps-script-required'||x.fallback!=='apps-script') process.exit(1)"
          rm -f /tmp/token.txt /tmp/edge-secret.txt
      - name: Cloud Write remains OFF
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/write.json --write-out '%{http_code}' "$PROD_URL/v1/cloud/write/health")"
          cat /tmp/write.json
          test "$code" = '200'
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/write.json','utf8')); if(!x.success||x.enabled!==false||x.writesAccepted!==false||x.cutover!==false||x.sheetsAuthoritative!==true) process.exit(1)"
          echo 'PRODUCTION_ALIAS_RUNTIME_PASS'
