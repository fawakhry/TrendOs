<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendOS Reset Cache</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#111;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;border:1px solid #dde3ea;border-radius:18px;padding:24px;max-width:560px;box-shadow:0 8px 24px #0001}button{background:#005BFF;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}</style></head>
<body><div class="box"><h1>تنضيف كاش TrendOS</h1><p id="msg">اضغط الزرار ثم افتح الموقع من جديد.</p><button id="go">مسح الكاش وفتح البرنامج</button></div>
<script>document.getElementById('go').onclick=async function(){var m=document.getElementById('msg');m.textContent='جاري مسح الكاش...';try{if('serviceWorker'in navigator){let regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{await r.unregister()}catch(e){}}}if(window.caches&&caches.keys){let keys=await caches.keys();for(const k of keys){if(/trendos|matbagy|workbox|cache/i.test(k)) await caches.delete(k)}}try{localStorage.removeItem('TRENDOS_CACHE_TAG');localStorage.removeItem('MATBAGY_VERSION_MIX_WARNING')}catch(e){}}catch(e){}m.textContent='تم. سيتم فتح البرنامج...';setTimeout(function(){location.href='./?v=trendos-v1923-open-order-visibility-20260812a&t='+Date.now()},700)};</script>
</body></html>
